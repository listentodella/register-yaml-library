              bits: "5"
              desc: "CMSIS MMRDY 位域"
            - name: "HFRDY"
              bits: "4"
              desc: "CMSIS HFRDY 位域"
            - name: "THREAD"
              bits: "3"
              desc: "FPCCR：处理器模式位"
            - name: "USER"
              bits: "1"
              desc: "FPCCR：特权级别位"
            - name: "LSPACT"
              bits: "0"
              desc: "FPCCR：惰性状态保存有效位"
        - name: "FPCAR"
          desc: "浮点上下文地址寄存器"
          condition: "当__FPU_PRESENT==1时"
          fields:
