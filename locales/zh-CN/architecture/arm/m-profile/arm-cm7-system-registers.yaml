      access: "内存映射内核外设访问"
      desc: "来自 FPU_Type 的 FPU 寄存器"
      registers:
        - name: "FPCCR"
          desc: "浮点上下文控制寄存器"
          condition: "当__FPU_PRESENT==1时"
          fields:
            - name: "ASPEN"
              bits: "31"
              desc: "位"
            - name: "LSPEN"
              bits: "30"
              desc: "CMSIS LSPEN 位域"
