translations:
  sensor: "Arm Cortex-M7 系统寄存器"
  pages:
    - name: "Special Registers"
      title: "特殊寄存器"
      access: "MRS / MSR 特殊寄存器接口"
      desc: "由 CMSIS-Core 内建函数提供的 M-profile 处理器状态、屏蔽、控制和堆栈指针寄存器"
      registers:
        - name: "APSR"
          desc: "读取 APSR 寄存器，返回 APSR 寄存器的内容。"
          fields:
            - name: "N"
              bits: "31"
              desc: "CMSIS N 位域"
            - name: "Z"
              bits: "30"
              desc: "CMSIS Z 位域"
            - name: "C"
              bits: "29"
              desc: "CMSIS C 位域"
            - name: "V"
              bits: "28"
              desc: "CMSIS V 位域"
            - name: "Q"
              bits: "27"
              desc: "CMSIS Q 位域"
            - name: "GE"
              bits: "19:16"
              desc: "CMSIS GE 位域"
        - name: "BASEPRI"
          desc: "读取基础优先级，返回基础优先级寄存器的当前值；设置基础优先级：将给定值写入基础优先级寄存器。根据条件设置基础优先级 仅当禁用 BASEPRI 屏蔽或新值增加 BASEPRI 优先级时，才将给定值写入基础优先级寄存器。"
          fields:
            - name: "BASEPRI"
              bits: "7:0"
              desc: "基础优先级屏蔽值"
        - name: "CONTROL"
          desc: "读取控制寄存器，返回控制寄存器的内容；设置控制寄存器：将给定值写入控制寄存器。"
          fields:
            - name: "FPCA"
              bits: "2"
              desc: "CMSIS FPCA 位域"
            - name: "SPSEL"
              bits: "1"
              desc: "CMSIS SPSEL 位域"
            - name: "nPRIV"
              bits: "0"
              desc: "CMSIS nPRIV 位域"
        - name: "FAULTMASK"
          desc: "读取故障屏蔽，返回故障屏蔽寄存器的当前值；设置故障屏蔽：将给定值写入故障屏蔽寄存器。"
          fields:
            - name: "FM"
              bits: "0"
              desc: "故障屏蔽位"
        - name: "IPSR"
          desc: "读取 IPSR 寄存器，返回 IPSR 寄存器的内容。"
          fields:
            - name: "ISR"
              bits: "8:0"
              desc: "CMSIS ISR 位域"
        - name: "MSP"
          desc: "读取主堆栈指针，返回主堆栈指针的当前值 (MSP)；设置主堆栈指针：将给定值写入主堆栈指针（MSP）。"
          fields:
            - name: "ADDRESS"
              bits: "31:0"
              desc: "主堆栈指针值"
        - name: "PRIMASK"
          desc: "读取优先级掩码 从优先级掩码寄存器返回优先级掩码位的当前状态；设置优先级掩码：将给定值写入优先级掩码寄存器。"
          fields:
            - name: "PM"
              bits: "0"
              desc: "异常屏蔽位"
        - name: "PSP"
          desc: "读取进程堆栈指针，返回进程堆栈指针的当前值 (PSP)；设置进程堆栈指针：将给定值写入进程堆栈指针 (PSP)。"
          fields:
            - name: "ADDRESS"
              bits: "31:0"
              desc: "进程堆栈指针值"
        - name: "xPSR"
          desc: "读取 xPSR 寄存器，返回 xPSR 寄存器的内容。"
          fields:
            - name: "N"
              bits: "31"
              desc: "CMSIS N 位域"
            - name: "Z"
              bits: "30"
              desc: "CMSIS Z 位域"
            - name: "C"
              bits: "29"
              desc: "CMSIS C 位域"
            - name: "V"
              bits: "28"
              desc: "CMSIS V 位域"
            - name: "Q"
              bits: "27"
              desc: "CMSIS Q 位域"
            - name: "T"
