translations:
  sensor: "Arm Cortex-M0 系统寄存器"
  pages:
    - name: "Special Registers"
      title: "特殊寄存器"
      access: "MRS / MSR 特殊寄存器接口"
      desc: "由 CMSIS-Core 内建函数提供的 M-profile 处理器状态、屏蔽、控制和堆栈指针寄存器"
      registers:
        - name: "APSR"
          desc: "读取 APSR 寄存器，返回 APSR 寄存器的内容。"
          fields:
            - name: "N"
              bits: "31"
              desc: "CMSIS N 位域"
            - name: "Z"
              bits: "30"
              desc: "CMSIS Z 位域"
            - name: "C"
              bits: "29"
              desc: "CMSIS C 位域"
            - name: "V"
              bits: "28"
              desc: "CMSIS V 位域"
        - name: "CONTROL"
          desc: "读取控制寄存器，返回控制寄存器的内容；设置控制寄存器：将给定值写入控制寄存器。"
          fields:
            - name: "SPSEL"
              bits: "1"
              desc: "CMSIS SPSEL 位域"
        - name: "IPSR"
          desc: "读取 IPSR 寄存器，返回 IPSR 寄存器的内容。"
          fields:
            - name: "ISR"
              bits: "8:0"
              desc: "CMSIS ISR 位域"
        - name: "MSP"
          desc: "读取主堆栈指针，返回主堆栈指针的当前值 (MSP)；设置主堆栈指针：将给定值写入主堆栈指针（MSP）。"
          fields:
            - name: "ADDRESS"
              bits: "31:0"
              desc: "主堆栈指针值"
        - name: "PRIMASK"
          desc: "读取优先级掩码 从优先级掩码寄存器返回优先级掩码位的当前状态；设置优先级掩码：将给定值写入优先级掩码寄存器。"
          fields:
            - name: "PM"
              bits: "0"
              desc: "异常屏蔽位"
        - name: "PSP"
          desc: "读取进程堆栈指针，返回进程堆栈指针的当前值 (PSP)；设置进程堆栈指针：将给定值写入进程堆栈指针 (PSP)。"
          fields:
            - name: "ADDRESS"
              bits: "31:0"
              desc: "进程堆栈指针值"
        - name: "xPSR"
          desc: "读取 xPSR 寄存器，返回 xPSR 寄存器的内容。"
          fields:
            - name: "N"
              bits: "31"
              desc: "CMSIS N 位域"
            - name: "Z"
              bits: "30"
              desc: "CMSIS Z 位域"
            - name: "C"
              bits: "29"
              desc: "CMSIS C 位域"
            - name: "V"
              bits: "28"
              desc: "CMSIS V 位域"
            - name: "T"
              bits: "24"
              desc: "CMSIS T 位域"
            - name: "ISR"
              bits: "8:0"
              desc: "CMSIS ISR 位域"
    - name: "SCB"
      title: "系统控制块（SCB）"
      access: "内存映射内核外设访问"
      desc: "来自 SCB_Type 的 SCB 寄存器"
      registers:
        - name: "CPUID"
          desc: "CPUID 基址寄存器"
          fields:
            - name: "IMPLEMENTER"
              bits: "31:24"
              desc: "CMSIS IMPLEMENTER 位域"
            - name: "VARIANT"
              bits: "23:20"
              desc: "CMSIS VARIANT 位域"
            - name: "ARCHITECTURE"
              bits: "19:16"
              desc: "CMSIS ARCHITECTURE 位域"
            - name: "PARTNO"
              bits: "15:4"
              desc: "CMSIS PARTNO 位域"
            - name: "REVISION"
              bits: "3:0"
              desc: "CMSIS REVISION 位域"
        - name: "ICSR"
          desc: "中断控制和状态寄存器"
          fields:
            - name: "NMIPENDSET"
              bits: "31"
              desc: "CMSIS NMIPENDSET 位域"
            - name: "PENDSVSET"
              bits: "28"
              desc: "CMSIS PENDSVSET 位域"
            - name: "PENDSVCLR"
              bits: "27"
              desc: "CMSIS PENDSVCLR 位域"
            - name: "PENDSTSET"
              bits: "26"
              desc: "CMSIS PENDSTSET 位域"
            - name: "PENDSTCLR"
              bits: "25"
              desc: "CMSIS PENDSTCLR 位域"
            - name: "ISRPREEMPT"
              bits: "23"
              desc: "CMSIS ISRPREEMPT 位域"
            - name: "ISRPENDING"
              bits: "22"
              desc: "CMSIS ISRPENDING 位域"
            - name: "VECTPENDING"
              bits: "20:12"
              desc: "CMSIS VECTPENDING 位域"
            - name: "VECTACTIVE"
              bits: "8:0"
              desc: "CMSIS VECTACTIVE 位域"
        - name: "AIRCR"
          desc: "应用中断和复位控制寄存器"
          fields:
            - name: "VECTKEY"
              bits: "31:16"
              source_condition: "Field view: VECTKEY"
              desc: "CMSIS VECTKEY 位域"
              condition: "位域视图：VECTKEY"
            - name: "VECTKEYSTAT"
              bits: "31:16"
              source_condition: "Field view: VECTKEYSTAT"
              desc: "CMSIS VECTKEYSTAT 位域"
              condition: "位域视图：VECTKEYSTAT"
            - name: "ENDIANNESS"
              bits: "15"
              desc: "CMSIS ENDIANNESS 位域"
            - name: "SYSRESETREQ"
              bits: "2"
              desc: "CMSIS SYSRESETREQ 位域"
            - name: "VECTCLRACTIVE"
              bits: "1"
              desc: "CMSIS VECTCLRACTIVE 位域"
        - name: "SCR"
          desc: "系统控制寄存器"
          fields:
            - name: "SEVONPEND"
              bits: "4"
              desc: "CMSIS SEVONPEND 位域"
            - name: "SLEEPDEEP"
              bits: "2"
              desc: "CMSIS SLEEPDEEP 位域"
            - name: "SLEEPONEXIT"
              bits: "1"
              desc: "CMSIS SLEEPONEXIT 位域"
        - name: "CCR"
          desc: "配置控制寄存器"
          fields:
            - name: "STKALIGN"
              bits: "9"
              desc: "CMSIS STKALIGN 位域"
            - name: "UNALIGN_TRP"
              bits: "3"
              desc: "CMSIS UNALIGN_TRP 位域"
        - name: "SHPR[0]"
          desc: "系统处理程序优先级寄存器。 [0] 为 RESERVED（元素 0）"
        - name: "SHPR[1]"
          desc: "系统处理程序优先级寄存器。 [0] 是 RESERVED（元素 1）"
        - name: "SHCSR"
          desc: "系统处理程序控制和状态寄存器"
          fields:
            - name: "SVCALLPENDED"
              bits: "15"
              desc: "CMSIS SVCALLPENDED 位域"
    - name: "SysTick"
      title: "系统滴答定时器（SysTick）"
      access: "内存映射内核外设访问"
      desc: "来自 SysTick_Type 的 SysTick 寄存器"
      registers:
        - name: "CTRL"
          desc: "SysTick 控制和状态寄存器"
          fields:
            - name: "COUNTFLAG"
              bits: "16"
              desc: "CMSIS COUNTFLAG 位域"
            - name: "CLKSOURCE"
              bits: "2"
              desc: "CMSIS CLKSOURCE 位域"
            - name: "TICKINT"
              bits: "1"
              desc: "CMSIS TICKINT 位域"
            - name: "ENABLE"
              bits: "0"
              desc: "CMSIS ENABLE 位域"
        - name: "LOAD"
          desc: "SysTick 重载值寄存器"
          fields:
            - name: "RELOAD"
              bits: "23:0"
              desc: "CMSIS RELOAD 位域"
        - name: "VAL"
          desc: "SysTick 当前值寄存器"
          fields:
            - name: "CURRENT"
              bits: "23:0"
              desc: "CMSIS CURRENT 位域"
        - name: "CALIB"
          desc: "SysTick 校准寄存器"
          fields:
            - name: "NOREF"
              bits: "31"
              desc: "CMSIS NOREF 位域"
            - name: "SKEW"
              bits: "30"
              desc: "CMSIS SKEW 位域"
            - name: "TENMS"
              bits: "23:0"
              desc: "CMSIS TENMS 位域"
    - name: "NVIC"
      title: "嵌套向量中断控制器（NVIC）"
      access: "内存映射内核外设访问"
      desc: "来自 NVIC_Type 的 NVIC 寄存器"
      registers:
        - name: "ISER"
          desc: "中断使能置位寄存器"
        - name: "ICER"
          desc: "中断使能清除寄存器"
        - name: "ISPR"
          desc: "中断挂起置位寄存器"
        - name: "ICPR"
          desc: "中断挂起清除寄存器"
        - name: "IPR[0]"
          desc: "中断优先级寄存器（元素 0）"
        - name: "IPR[1]"
          desc: "中断优先级寄存器（元素 1）"
        - name: "IPR[2]"
          desc: "中断优先级寄存器（元素 2）"
        - name: "IPR[3]"
          desc: "中断优先级寄存器（元素 3）"
        - name: "IPR[4]"
          desc: "中断优先级寄存器（元素 4）"
        - name: "IPR[5]"
          desc: "中断优先级寄存器（元素 5）"
        - name: "IPR[6]"
          desc: "中断优先级寄存器（元素 6）"
        - name: "IPR[7]"
          desc: "中断优先级寄存器（元素 7）"
