        - name: "RBAR"
          desc: "MPU 区域基地址寄存器"
          condition: "当 __MPU_PRESENT == 1 时"
          fields:
            - name: "XN"
              bits: "0"
              desc: "执行禁止（XN）控制。置 1 后禁止从该 MPU 区域取指执行。"
        - name: "RLAR"
          desc: "MPU 区域限制地址寄存器"
          condition: "当 __MPU_PRESENT == 1 时"
          fields:
            - name: "PXN"
