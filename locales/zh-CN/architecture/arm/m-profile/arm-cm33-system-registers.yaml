    - name: "DWT"
      title: "数据观察点与跟踪（DWT）"
      access: "内存映射内核外设访问"
      desc: "来自 DWT_Type 的 DWT 寄存器"
      registers:
        - name: "CTRL"
          desc: "控制寄存器"
          fields:
            - name: "NOTRCPKT"
              bits: "27"
              desc: "DWT 跟踪数据包生成实现状态。该位只报告硬件能力，不是禁用控制位。"
              values:
                - value: 0
                  desc: "实现了跟踪数据包生成。"
                - value: 1
                  desc: "未实现跟踪数据包生成。"
            - name: "NOEXTTRIG"
              bits: "26"
              desc: "DWT 外部匹配触发实现状态。该位只报告硬件能力，不是禁用控制位。"
              values:
                - value: 0
                  desc: "实现了外部匹配触发。"
                - value: 1
                  desc: "未实现外部匹配触发。"
            - name: "NOCYCCNT"
              bits: "25"
              desc: "DWT 周期计数器实现状态。该位只报告硬件能力，不是禁用控制位。"
              values:
                - value: 0
                  desc: "实现了周期计数器。"
                - value: 1
                  desc: "未实现周期计数器。"
            - name: "NOPRFCNT"
              bits: "24"
              desc: "DWT 性能分析计数器实现状态。该位只报告硬件能力，不是禁用控制位。"
              values:
                - value: 0
                  desc: "实现了性能分析计数器。"
                - value: 1
                  desc: "未实现性能分析计数器。"
            - name: "CYCEVTENA"
              bits: "22"
              desc: "DWT 周期计数事件生成控制。置 1 后启用周期计数事件。"
              values:
                - value: 0
                  desc: "Cycle-count event generation 已禁用。"
                - value: 1
                  desc: "Cycle-count event generation 已启用。"
            - name: "FOLDEVTENA"
              bits: "21"
              desc: "DWT 折叠指令事件生成控制。置 1 后启用折叠指令事件。"
              values:
                - value: 0
                  desc: "Folded-instruction event generation 已禁用。"
                - value: 1
                  desc: "Folded-instruction event generation 已启用。"
            - name: "LSUEVTENA"
              bits: "20"
              desc: "DWT 装载/存储单元事件生成控制。置 1 后启用 LSU 事件。"
              values:
                - value: 0
                  desc: "Load/store-unit event generation 已禁用。"
                - value: 1
