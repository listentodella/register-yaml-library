      access: "内存映射内核外设访问"
      desc: "来自 MPU_Type 的 MPU 寄存器"
      registers:
        - name: "TYPE"
          desc: "MPU 类型寄存器"
          condition: "当 __MPU_PRESENT == 1 时"
          fields:
            - name: "SEPARATE"
              bits: "0"
              desc: "指令区和数据区是否使用独立区域集合的实现指示。"
        - name: "CTRL"
          desc: "MPU 控制寄存器"
          condition: "当 __MPU_PRESENT == 1 时"
          fields:
            - name: "PRIVDEFENA"
              bits: "2"
              desc: "特权默认内存映射控制。置 1 后，特权访问在没有 MPU 区域匹配时可以使用默认内存映射。"
            - name: "HFNMIENA"
              bits: "1"
              desc: "HardFault/NMI 处理期间的 MPU 检查控制。置 1 后，在 HardFault 和 NMI 处理函数中仍执行 MPU 检查。"
            - name: "ENABLE"
              bits: "0"
              desc: "MPU 总使能控制。0 禁用 MPU，1 启用 MPU。"
              values:
                - value: 0
                  desc: "MPU 已禁用。"
                - value: 1
                  desc: "MPU 已启用。"
