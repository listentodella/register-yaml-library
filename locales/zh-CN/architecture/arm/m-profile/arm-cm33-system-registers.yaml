              source_condition: "Field view: S_SDE"
              desc: "DCB DHCSR：安全调试已启用"
              condition: "位域视图：S_SDE"
            - name: "S_LOCKUP"
              bits: "19"
              source_condition: "Field view: S_LOCKUP"
              desc: "DCB DHCSR：锁定状态"
              condition: "位域视图：S_LOCKUP"
            - name: "S_SLEEP"
              bits: "18"
              source_condition: "Field view: S_SLEEP"
              desc: "DCB DHCSR：休眠状态"
              condition: "位域视图：S_SLEEP"
            - name: "S_HALT"
              bits: "17"
              source_condition: "Field view: S_HALT"
              desc: "DCB DHCSR：暂停状态"
              condition: "位域视图：S_HALT"
            - name: "S_REGRDY"
              bits: "16"
              source_condition: "Field view: S_REGRDY"
              desc: "DCB DHCSR：寄存器就绪状态"
              condition: "位域视图：S_REGRDY"
            - name: "C_SNAPSTALL"
              bits: "5"
              desc: "DCB DHCSR：快速失速控制"
            - name: "C_MASKINTS"
              bits: "3"
              desc: "DCB DHCSR：中断屏蔽控制"
            - name: "C_STEP"
              bits: "2"
              desc: "DCB DHCSR：单步控制"
            - name: "C_HALT"
              bits: "1"
              desc: "DCB DHCSR：暂停控制"
            - name: "C_DEBUGEN"
              bits: "0"
              desc: "DCB DHCSR：调试使能控制"
        - name: "DCRSR"
          desc: "调试核心寄存器选择器寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "REGWnR"
              bits: "16"
              desc: "DCB DCRSR：寄存器写/不读"
            - name: "REGSEL"
              bits: "6:0"
              desc: "DCB DCRSR：寄存器选择器"
        - name: "DCRDR"
          desc: "调试核心寄存器 数据寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "DBGTMP"
              bits: "31:0"
              desc: "DCB DCRDR：数据临时缓冲区"
        - name: "DEMCR"
          desc: "调试异常和监视控制寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "TRCENA"
              bits: "24"
              desc: "DCB DEMCR：跟踪使能"
            - name: "MONPRKEY"
              bits: "23"
              desc: "DCB DEMCR：监视器挂起请求键"
            - name: "UMON_EN"
              bits: "21"
              desc: "DCB DEMCR：非特权监视器使能"
            - name: "SDME"
              bits: "20"
              desc: "DCB DEMCR：安全状态 DebugMonitor 使能"
            - name: "MON_REQ"
              bits: "19"
              desc: "DCB DEMCR：监视器请求"
            - name: "MON_STEP"
              bits: "18"
              desc: "DCB DEMCR：监视器单步"
            - name: "MON_PEND"
              bits: "17"
              desc: "DCB DEMCR：监视器挂起"
            - name: "MON_EN"
              bits: "16"
              desc: "DCB DEMCR：监视器使能"
            - name: "VC_SFERR"
              bits: "11"
              desc: "DCB DEMCR：SecureFault 向量捕获"
            - name: "VC_HARDERR"
              bits: "10"
              desc: "DCB DEMCR：HardFault 错误向量捕获"
            - name: "VC_INTERR"
              bits: "9"
              desc: "DCB DEMCR：中断错误向量捕获"
            - name: "VC_BUSERR"
              bits: "8"
              desc: "DCB DEMCR：BusFault 错误向量捕获"
            - name: "VC_STATERR"
              bits: "7"
              desc: "DCB DEMCR：状态错误向量捕获"
            - name: "VC_CHKERR"
              bits: "6"
              desc: "DCB DEMCR：检查错误向量捕获"
            - name: "VC_NOCPERR"
              bits: "5"
              desc: "DCB DEMCR：NOCP 错误向量捕获"
            - name: "VC_MMERR"
              bits: "4"
              desc: "DCB DEMCR：MemManage 错误向量捕获"
            - name: "VC_CORERESET"
              bits: "0"
              desc: "DCB DEMCR：内核复位向量捕获"
        - name: "DAUTHCTRL"
          desc: "调试验证控制寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "INTSPNIDEN"
              bits: "3"
              desc: "DCB DAUTHCTRL：内部安全非侵入式调试使能"
            - name: "SPNIDENSEL"
              bits: "2"
              desc: "DCB DAUTHCTRL：安全非侵入式调试使能选择"
            - name: "INTSPIDEN"
              bits: "1"
              desc: "DCB DAUTHCTRL：内部安全侵入式调试使能"
            - name: "SPIDENSEL"
              bits: "0"
              desc: "DCB DAUTHCTRL：安全侵入式调试使能选择"
        - name: "DSCSR"
          desc: "调试安全控制和状态寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "CDSKEY"
              bits: "17"
              desc: "DCB DSCSR：CDS 写使能键"
            - name: "CDS"
              bits: "16"
              desc: "DCB DSCSR：当前域为安全状态"
            - name: "SBRSEL"
              bits: "1"
              desc: "DCB DSCSR：安全分组寄存器选择"
            - name: "SBRSELEN"
              bits: "0"
              desc: "DCB DSCSR：安全分组寄存器选择使能"
    - name: "DIB_NS"
      title: "调试接口块（DIB）（非安全）"
      access: "内存映射内核外设访问"
      desc: "来自 DIB_Type 的 DIB_NS 寄存器"
      registers:
        - name: "DLAR"
          desc: "SCS 软件锁访问寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields: []
        - name: "DLSR"
          desc: "SCS 软件锁定状态寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "nTT"
              bits: "2"
              desc: "DIB DLSR：不是三十二位"
            - name: "SLK"
              bits: "1"
              desc: "DIB DLSR：软件锁定状态"
            - name: "SLI"
              bits: "0"
              desc: "DIB DLSR：实现软件锁"
        - name: "DAUTHSTATUS"
          desc: "调试验证状态寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "SNID"
              bits: "7:6"
              desc: "DIB DAUTHSTATUS：安全非侵入式调试"
            - name: "SID"
              bits: "5:4"
              desc: "DIB DAUTHSTATUS：安全侵入式调试"
            - name: "NSNID"
              bits: "3:2"
              desc: "DIB DAUTHSTATUS：非安全非侵入式调试"
            - name: "NSID"
              bits: "1:0"
              desc: "DIB DAUTHSTATUS：非安全侵入式调试"
        - name: "DDEVARCH"
          desc: "SCS 设备架构寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "ARCHITECT"
              bits: "31:21"
              source_condition: "Field view: ARCHITECT"
              condition: "位域视图：ARCHITECT"
            - name: "PRESENT"
              bits: "24:20"
              source_condition: "Field view: PRESENT"
              condition: "位域视图：PRESENT"
            - name: "ARCHVER"
              bits: "15:12"
              desc: "DIB DDEVARCH：架构版本"
            - name: "ARCHPART"
              bits: "11:0"
              desc: "DIB DDEVARCH：架构部分"
        - name: "DDEVTYPE"
          desc: "SCS 设备类型寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "SUB"
              bits: "7:4"
              desc: "-类型"
            - name: "MAJOR"
              bits: "3:0"
              desc: "类型"
    - name: "MPU_NS"
      title: "内存保护单元（MPU）（非安全）"
      access: "内存映射内核外设访问"
      desc: "来自 MPU_Type 的 MPU_NS 寄存器"
      registers:
        - name: "TYPE"
          desc: "MPU 类型寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "SEPARATE"
              bits: "0"
              desc: "指令区和数据区是否使用独立区域集合的实现指示。"
        - name: "CTRL"
          desc: "MPU 控制寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "PRIVDEFENA"
              bits: "2"
              desc: "特权默认内存映射控制。置 1 后，特权访问在没有 MPU 区域匹配时可以使用默认内存映射。"
            - name: "HFNMIENA"
              bits: "1"
              desc: "HardFault/NMI 处理期间的 MPU 检查控制。置 1 后，在 HardFault 和 NMI 处理函数中仍执行 MPU 检查。"
            - name: "ENABLE"
              bits: "0"
              desc: "MPU 总使能控制。0 禁用 MPU，1 启用 MPU。"
              values:
                - value: 0
                  desc: "MPU 已禁用。"
                - value: 1
                  desc: "MPU 已启用。"
        - name: "RNR"
          desc: "MPU 区域编号寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields: []
        - name: "RBAR"
          desc: "MPU 区域基地址寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "XN"
              bits: "0"
              desc: "执行禁止（XN）控制。置 1 后禁止从该 MPU 区域取指执行。"
        - name: "RLAR"
          desc: "MPU 区域限制地址寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "PXN"
              bits: "4"
              desc: "特权执行禁止（PXN）控制。置 1 后禁止特权软件从该 MPU 区域取指执行。"
            - name: "EN"
              bits: "0"
              desc: "MPU 区域使能控制。0 禁用该区域，1 启用该区域。"
        - name: "RBAR_A1"
          desc: "MPU 区域基址寄存器别名 1"
          condition: "当安全扩展公开非安全别名时"
          fields: []
        - name: "RLAR_A1"
          desc: "MPU 区域限制地址寄存器别名 1"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "EN"
              bits: "0"
              desc: "能位"
        - name: "RBAR_A2"
          desc: "MPU 区域基址寄存器别名 2"
          condition: "当安全扩展公开非安全别名时"
          fields: []
        - name: "RLAR_A2"
          desc: "MPU 区域限制地址寄存器别名 2"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "EN"
              bits: "0"
              desc: "能位"
        - name: "RBAR_A3"
          desc: "MPU 区域基址寄存器别名 3"
          condition: "当安全扩展公开非安全别名时"
          fields: []
        - name: "RLAR_A3"
          desc: "MPU 区域限制地址寄存器别名 3"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "EN"
              bits: "0"
              desc: "能位"
        - name: "MAIR0"
          desc: "MPU 内存属性间接寄存器 0"
          condition: "当安全扩展公开非安全别名时"
          fields: []
        - name: "MAIR1"
          desc: "MPU 内存属性间接寄存器 1"
          condition: "当安全扩展公开非安全别名时"
          fields: []
    - name: "FPU_NS"
      title: "浮点单元（FPU）（非安全）"
      access: "内存映射内核外设访问"
      desc: "来自 FPU_Type 的 FPU_NS 寄存器"
      registers:
        - name: "FPCCR"
          desc: "浮点上下文控制寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "ASPEN"
              bits: "31"
              desc: "自动浮点状态保存控制。置 1 后，异常进入时启用浮点上下文的自动保存机制。"
            - name: "LSPEN"
              bits: "30"
              desc: "惰性浮点状态保存控制。置 1 后，只有异常处理程序实际使用浮点功能时才完成浮点上下文保存。"
            - name: "UFRDY"
              bits: "10"
              desc: "UFRDY 浮点状态就绪标志。"
              values:
                - value: 0
                  desc: "对应浮点状态尚未就绪。"
                - value: 1
                  desc: "对应浮点状态已经就绪。"
            - name: "SPLIMVIOL"
              bits: "9"
              desc: "FPU_NS FPCCR.SPLIMVIOL 错误/故障状态。0 表示未记录对应条件，1 表示已记录对应条件。"
            - name: "MONRDY"
              bits: "8"
              desc: "MONRDY 浮点状态就绪标志。"
              values:
                - value: 0
                  desc: "对应浮点状态尚未就绪。"
                - value: 1
                  desc: "对应浮点状态已经就绪。"
            - name: "SFRDY"
              bits: "7"
              desc: "SFRDY 浮点状态就绪标志。"
              values:
                - value: 0
                  desc: "对应浮点状态尚未就绪。"
                - value: 1
                  desc: "对应浮点状态已经就绪。"
            - name: "BFRDY"
              bits: "6"
              desc: "BFRDY 浮点状态就绪标志。"
              values:
                - value: 0
                  desc: "对应浮点状态尚未就绪。"
                - value: 1
                  desc: "对应浮点状态已经就绪。"
            - name: "MMRDY"
              bits: "5"
              desc: "MMRDY 浮点状态就绪标志。"
              values:
                - value: 0
                  desc: "对应浮点状态尚未就绪。"
                - value: 1
                  desc: "对应浮点状态已经就绪。"
            - name: "HFRDY"
              bits: "4"
              desc: "HFRDY 浮点状态就绪标志。"
              values:
                - value: 0
                  desc: "对应浮点状态尚未就绪。"
                - value: 1
                  desc: "对应浮点状态已经就绪。"
            - name: "THREAD"
              bits: "3"
              desc: "浮点上下文处理器模式状态。0 表示处理模式，1 表示线程模式。"
            - name: "S"
              bits: "2"
              desc: "延迟浮点状态保存所记录的浮点上下文安全状态。该位在激活延迟保存时记录上下文所属的安全状态。"
              values:
                - value: 0
                  desc: "该浮点上下文属于非安全状态。"
                - value: 1
                  desc: "该浮点上下文属于安全状态。"
            - name: "USER"
              bits: "1"
              desc: "浮点上下文特权级状态。0 表示特权上下文，1 表示非特权上下文。"
            - name: "LSPACT"
              bits: "0"
              desc: "惰性浮点状态保存活动状态。1 表示当前存在尚未完成的惰性浮点上下文保存。"
        - name: "FPCAR"
          desc: "浮点上下文地址寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "ADDRESS"
              bits: "31:3"
              desc: "位"
        - name: "FPDSCR"
          desc: "浮点默认状态控制寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "AHP"
              bits: "26"
              desc: "位"
            - name: "DN"
              bits: "25"
              desc: "位"
            - name: "FZ"
              bits: "24"
              desc: "位"
            - name: "RMode"
              bits: "23:22"
              desc: "位"
        - name: "MVFR0"
          desc: "媒体和 VFP 功能寄存器 0"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "FPRound"
              bits: "31:28"
              desc: "MVFR0：舍入模式位"
            - name: "FPShortvec"
              bits: "27:24"
              desc: "MVFR0：短向量位"
            - name: "FPSqrt"
              bits: "23:20"
              desc: "MVFR0：平方根位"
            - name: "FPDivide"
              bits: "19:16"
              desc: "MVFR0：除位"
            - name: "FPExceptrap"
              bits: "15:12"
              desc: "MVFR0：异常捕获位"
            - name: "FPDP"
              bits: "11:8"
              desc: "MVFR0：双精度位"
            - name: "FPSP"
              bits: "7:4"
              desc: "MVFR0：单精度位"
            - name: "SIMDReg"
              bits: "3:0"
              desc: "MVFR0：SIMD 寄存器位"
        - name: "MVFR1"
          desc: "媒体和 VFP 功能寄存器 1"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "FMAC"
              bits: "31:28"
              desc: "MVFR1：带保险丝的 MAC 位"
            - name: "FPHP"
              bits: "27:24"
              desc: "MVFR1：FP HPFP 位"
            - name: "FPDNaN"
              bits: "7:4"
              desc: "MVFR1：D_NaN 模式位"
            - name: "FPFtZ"
              bits: "3:0"
              desc: "MVFR1：FtZ 模式位"
        - name: "MVFR2"
          desc: "媒体和 VFP 功能寄存器 2"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "FPMisc"
              bits: "7:4"
              desc: "MVFR2：VFP 杂项位"
