        - name: "ACTLR"
          desc: "辅助控制寄存器"
          condition: "当安全扩展公开非安全别名时"
        - name: "CPPWR"
          desc: "协处理器电源控制寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields: []
    - name: "SCB_NS"
      title: "系统控制块（SCB）（非安全）"
      access: "内存映射内核外设访问"
      desc: "来自 SCB_Type 的 SCB_NS 寄存器"
      registers:
        - name: "CPUID"
          desc: "CPUID 基址寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields: []
        - name: "ICSR"
          desc: "中断控制和状态寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "PENDNMICLR"
              bits: "30"
              values:
                - value: 0
                  desc: "不发出清除请求。"
                - value: 1
                  desc: "写入 1 清除对应的挂起或状态位；读取时可能返回 0。"
            - name: "PENDSVCLR"
              bits: "27"
              values:
                - value: 0
                  desc: "不发出清除请求。"
                - value: 1
                  desc: "写入 1 清除对应的挂起或状态位；读取时可能返回 0。"
            - name: "PENDSTCLR"
              bits: "25"
              values:
                - value: 0
                  desc: "不发出清除请求。"
                - value: 1
                  desc: "写入 1 清除对应的挂起或状态位；读取时可能返回 0。"
            - name: "STTNS"
              bits: "24"
              desc: "位置（安全扩展）"
            - name: "ISRPREEMPT"
              bits: "23"
              desc: "SCB_NS ICSR.ISRPREEMPT 挂起状态。0 表示未挂起，1 表示挂起。"
              values:
                - value: 0
                  desc: "No interrupt preemption 已挂起。"
                - value: 1
                  desc: "Interrupt preemption 已挂起。"
            - name: "ISRPENDING"
              bits: "22"
              desc: "SCB_NS ICSR.ISRPENDING 挂起状态。0 表示未挂起，1 表示挂起。"
              values:
                - value: 0
                  desc: "No external interrupt 已挂起。"
                - value: 1
                  desc: "At least one external interrupt 已挂起。"
        - name: "VTOR"
          desc: "向量表偏移寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields: []
        - name: "AIRCR"
          desc: "应用中断和复位控制寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "VECTKEY"
              bits: "31:16"
              source_condition: "Field view: VECTKEY"
              condition: "位域视图：VECTKEY"
            - name: "VECTKEYSTAT"
              bits: "31:16"
              source_condition: "Field view: VECTKEYSTAT"
              condition: "位域视图：VECTKEYSTAT"
        - name: "SCR"
          desc: "系统控制寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields: []
        - name: "CCR"
          desc: "配置控制寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "BP"
              bits: "18"
              desc: "SCB_NS CCR.BP 使能控制。0 表示禁用，1 表示启用。"
              values:
                - value: 0
                  desc: "Branch prediction 已禁用。"
                - value: 1
                  desc: "Branch prediction 已启用。"
            - name: "IC"
              bits: "17"
              desc: "SCB_NS CCR.IC 使能控制。0 表示禁用，1 表示启用。"
              values:
                - value: 0
                  desc: "The instruction cache 已禁用。"
                - value: 1
                  desc: "The instruction cache 已启用。"
            - name: "DC"
              bits: "16"
              desc: "SCB_NS CCR.DC 使能控制。0 表示禁用，1 表示启用。"
              values:
                - value: 0
                  desc: "The data cache 已禁用。"
                - value: 1
                  desc: "The data cache 已启用。"
        - name: "SHPR[0]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 0）"
          condition: "当安全扩展公开非安全别名时"
        - name: "SHPR[1]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 1）"
          condition: "当安全扩展公开非安全别名时"
        - name: "SHPR[2]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 2）"
          condition: "当安全扩展公开非安全别名时"
        - name: "SHPR[3]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 3）"
          condition: "当安全扩展公开非安全别名时"
        - name: "SHPR[4]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 4）"
          condition: "当安全扩展公开非安全别名时"
        - name: "SHPR[5]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 5）"
          condition: "当安全扩展公开非安全别名时"
        - name: "SHPR[6]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 6）"
          condition: "当安全扩展公开非安全别名时"
        - name: "SHPR[7]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 7）"
          condition: "当安全扩展公开非安全别名时"
        - name: "SHPR[8]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 8）"
          condition: "当安全扩展公开非安全别名时"
        - name: "SHPR[9]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 9）"
          condition: "当安全扩展公开非安全别名时"
        - name: "SHPR[10]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 10）"
          condition: "当安全扩展公开非安全别名时"
        - name: "SHPR[11]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 11）"
          condition: "当安全扩展公开非安全别名时"
        - name: "SHCSR"
          desc: "系统处理程序控制和状态寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "HARDFAULTPENDED"
              bits: "21"
              desc: "HARDFAULT 异常挂起状态。1 表示对应异常已挂起。"
            - name: "SECUREFAULTPENDED"
              bits: "20"
              desc: "SECUREFAULT 异常挂起状态。1 表示对应异常已挂起。"
            - name: "SECUREFAULTENA"
              bits: "19"
              desc: "SECUREFAULT 可配置故障处理使能。0 表示该故障不能独立激活并会升级处理，1 表示允许激活对应故障处理程序。"
              values:
                - value: 0
                  desc: "SECUREFAULT fault handling 已禁用。"
                - value: 1
                  desc: "SECUREFAULT fault handling 已启用。"
            - name: "USGFAULTENA"
              bits: "18"
              desc: "USGFAULT 可配置故障处理使能。0 表示该故障不能独立激活并会升级处理，1 表示允许激活对应故障处理程序。"
              values:
                - value: 0
                  desc: "USGFAULT fault handling 已禁用。"
                - value: 1
                  desc: "USGFAULT fault handling 已启用。"
