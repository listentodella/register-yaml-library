          condition: "当 __MPU_PRESENT == 1 时"
          fields: []
        - name: "RLAR_A3"
          desc: "MPU 区域限制地址寄存器别名 3"
          condition: "当 __MPU_PRESENT == 1 时"
          fields:
            - name: "EN"
              bits: "0"
              desc: "能位"
        - name: "MAIR0"
          desc: "MPU 内存属性间接寄存器 0"
          condition: "当 __MPU_PRESENT == 1 时"
          fields: []
        - name: "MAIR1"
          desc: "MPU 内存属性间接寄存器 1"
          condition: "当 __MPU_PRESENT == 1 时"
