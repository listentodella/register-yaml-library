translations:
  sensor: "Arm Cortex-M23 系统寄存器"
  family: "Armv8-M 基线"
  pages:
    - name: "Special Registers"
      title: "特殊寄存器"
      access: "MRS / MSR 特殊寄存器接口"
      desc: "由 CMSIS-Core 内建函数提供的 M-profile 处理器状态、屏蔽、控制和堆栈指针寄存器"
      registers:
        - name: "APSR"
          desc: "读取 APSR 寄存器，返回 APSR 寄存器的内容。"
          fields:
            - name: "N"
              bits: "31"
              desc: "负数条件码标志。执行会更新条件标志的指令后，N 表示结果按二进制补码解释时的符号：N=1 表示结果为负，N=0 表示结果为非负。它只反映最近一次更新条件标志的指令结果，并不表示任意通用寄存器当前是否为负。"
              values:
                - value: 0
                  desc: "最近一次更新条件标志的结果为非负数。"
                - value: 1
                  desc: "最近一次更新条件标志的结果为负数。"
            - name: "Z"
              bits: "30"
              desc: "零条件码标志。最近一次更新条件标志的指令结果为 0 时 Z=1，否则 Z=0。CMP 等比较指令按减法更新标志但不保存结果，因此 Z=1 通常表示两个操作数相等。"
              values:
                - value: 0
                  desc: "最近一次更新条件标志的结果不为 0；比较结果为不相等。"
                - value: 1
                  desc: "最近一次更新条件标志的结果为 0；比较结果为相等。"
            - name: "C"
              bits: "29"
              desc: "进位/借位条件码标志。加法中 C=1 表示产生无符号进位；减法或 CMP 比较中 C=1 表示未借位、C=0 表示发生借位，因此无符号比较时 C=1 通常表示左操作数大于或等于右操作数。对于会更新标志的移位指令，若指令有相应定义，C 保存最后移出的位。"
              values:
                - value: 0
                  desc: "含义取决于指令：加法未产生无符号进位；减法或比较发生了借位；或者最后移出的位为 0。"
                - value: 1
                  desc: "含义取决于指令：加法产生无符号进位；减法或比较未发生借位；或者最后移出的位为 1。"
            - name: "V"
              bits: "28"
              desc: "有符号溢出条件码标志。数学结果超出当前运算位宽的二进制补码有符号范围时 V=1，例如两个同号数相加却得到异号结果。V 判断有符号溢出；C 判断无符号进位或借位，两者不能互换。"
              values:
                - value: 0
                  desc: "最近一次更新条件标志的算术结果未超出有符号数范围。"
                - value: 1
                  desc: "最近一次更新条件标志的算术结果超出了有符号数范围。"
        - name: "CONTROL"
          desc: "读取控制寄存器，返回控制寄存器的内容；设置控制寄存器：将给定值写入控制寄存器。"
          fields:
            - name: "SPSEL"
              bits: "1"
              desc: "线程模式堆栈指针选择。处理模式始终使用 MSP；线程模式下 SPSEL=0 使用 MSP，SPSEL=1 使用 PSP。"
              values:
                - value: 0
                  desc: "线程模式使用 MSP（主堆栈指针）。"
                - value: 1
                  desc: "线程模式使用 PSP（进程堆栈指针）。"
            - name: "nPRIV"
              bits: "0"
              desc: "线程模式特权级控制。nPRIV=0 为特权线程模式，nPRIV=1 为非特权线程模式；处理模式始终为特权模式。"
              values:
                - value: 0
                  desc: "线程模式以特权级运行。"
                - value: 1
                  desc: "线程模式以非特权级运行。"
        - name: "CONTROL_NS"
          desc: "读取控制寄存器（非安全） 在安全模式下返回非安全控制寄存器的内容；设置控制寄存器（非安全） 当处于安全状态时，将给定值写入非安全控制寄存器。"
          condition: "实现安全扩展时，可从安全状态访问"
          fields:
            - name: "SPSEL"
              bits: "1"
              desc: "线程模式堆栈指针选择。处理模式始终使用 MSP；线程模式下 SPSEL=0 使用 MSP，SPSEL=1 使用 PSP。"
              values:
                - value: 0
                  desc: "线程模式使用 MSP（主堆栈指针）。"
                - value: 1
                  desc: "线程模式使用 PSP（进程堆栈指针）。"
            - name: "nPRIV"
              bits: "0"
              desc: "线程模式特权级控制。nPRIV=0 为特权线程模式，nPRIV=1 为非特权线程模式；处理模式始终为特权模式。"
              values:
                - value: 0
                  desc: "线程模式以特权级运行。"
                - value: 1
                  desc: "线程模式以非特权级运行。"
        - name: "IPSR"
          desc: "读取 IPSR 寄存器，返回 IPSR 寄存器的内容。"
          fields:
            - name: "ISR"
              bits: "8:0"
              desc: "当前异常号。0 表示线程模式；非 0 值按照当前内核实现的异常号表标识正在处理的异常。"
        - name: "MSP"
          desc: "读取主堆栈指针，返回主堆栈指针的当前值 (MSP)；设置主堆栈指针：将给定值写入主堆栈指针（MSP）。"
          fields:
            - name: "ADDRESS"
              bits: "31:0"
              desc: "主堆栈指针值"
        - name: "MSP_NS"
          desc: "读取主堆栈指针（非安全） 处于安全状态时，返回非安全主堆栈指针 (MSP) 的当前值；设置主堆栈指针（非安全） 当处于安全状态时，将给定值写入非安全主堆栈指针 (MSP)。"
          condition: "实现安全扩展时，可从安全状态访问"
          fields:
            - name: "ADDRESS"
              bits: "31:0"
              desc: "从安全状态访问的非安全主堆栈指针值。"
        - name: "MSPLIM"
          desc: "读取主堆栈指针限制 没有 ARMv8-M 主扩展（i.e.Cortex-M23）的设备缺少非安全堆栈指针限制寄存器，因此始终返回零。返回主堆栈指针限制 (MSPLIM) 的当前值；设置主堆栈指针限制 不带 ARMv8-M 主扩展的设备 (i.e.Cortex-M23) 缺少非安全堆栈指针限制寄存器，因此写入会被静默忽略。将给定值写入主堆栈指针限制 (MSPLIM)。"
          fields:
            - name: "ADDRESS"
              bits: "31:0"
              desc: "主堆栈指针限制值"
        - name: "MSPLIM_NS"
          desc: "读取主堆栈指针限制（非安全） 没有 ARMv8-M 主扩展的设备（i.e.Cortex-M23）缺少非安全堆栈指针限制寄存器，因此始终返回零。当处于安全状态时，返回非安全主堆栈指针限制（MSPLIM）的当前值；设置主堆栈指针限制（非安全） 不带 ARMv8-M 主扩展（i.e.Cortex-M23）的设备缺少非安全堆栈指针限制寄存器，因此写入会被静默忽略。处于安全状态时，将给定值写入非安全主堆栈指针限制 (MSPLIM)。"
          condition: "实现安全扩展时，可从安全状态访问"
          fields:
            - name: "ADDRESS"
              bits: "31:0"
              desc: "从安全状态访问的非安全主堆栈指针下界。实现堆栈限制检查时，非安全 MSP 低于该界限可触发堆栈限制故障。"
        - name: "PRIMASK"
          desc: "读取优先级掩码 从优先级掩码寄存器返回优先级掩码位的当前状态；设置优先级掩码：将给定值写入优先级掩码寄存器。"
          fields:
            - name: "PM"
              bits: "0"
              desc: "优先级屏蔽位。PM=1 时屏蔽所有具有可配置优先级的异常，但不会屏蔽 NMI 和 HardFault。"
              values:
                - value: 0
                  desc: "PRIMASK 不屏蔽具有可配置优先级的异常。"
                - value: 1
                  desc: "PRIMASK 屏蔽具有可配置优先级的异常；NMI 和 HardFault 仍可响应。"
        - name: "PRIMASK_NS"
          desc: "读取优先级掩码（非安全） 当处于安全状态时，从优先级掩码寄存器返回非安全优先级掩码位的当前状态；设置优先级掩码（非安全） 当处于安全状态时，将给定值写入非安全优先级掩码寄存器。"
          condition: "实现安全扩展时，可从安全状态访问"
          fields:
            - name: "PM"
              bits: "0"
              desc: "优先级屏蔽位。PM=1 时屏蔽所有具有可配置优先级的异常，但不会屏蔽 NMI 和 HardFault。"
              values:
                - value: 0
                  desc: "PRIMASK 不屏蔽具有可配置优先级的异常。"
                - value: 1
                  desc: "PRIMASK 屏蔽具有可配置优先级的异常；NMI 和 HardFault 仍可响应。"
        - name: "PSP"
          desc: "读取进程堆栈指针，返回进程堆栈指针的当前值 (PSP)；设置进程堆栈指针：将给定值写入进程堆栈指针 (PSP)。"
          fields:
            - name: "ADDRESS"
              bits: "31:0"
              desc: "进程堆栈指针值"
        - name: "PSP_NS"
          desc: "读取进程堆栈指针（非安全） 处于安全状态时，返回非安全进程堆栈指针 (PSP) 的当前值；设置进程堆栈指针（非安全） 当处于安全状态时，将给定值写入非安全进程堆栈指针 (PSP)。"
          condition: "实现安全扩展时，可从安全状态访问"
          fields:
            - name: "ADDRESS"
              bits: "31:0"
              desc: "从安全状态访问的非安全进程堆栈指针值。"
        - name: "PSPLIM"
          desc: "读取进程堆栈指针限制 没有 ARMv8-M 主扩展的设备 (i.e.Cortex-M23) 缺少非安全堆栈指针限制寄存器，因此在非安全模式下始终返回零。返回进程堆栈指针限制 (PSPLIM) 的当前值；设置进程堆栈指针限制 不带 ARMv8-M 主扩展的设备 (i.e.Cortex-M23) 缺少非安全堆栈指针限制寄存器，因此在非安全模式下写入会被静默忽略。将给定值写入进程堆栈指针限制 (PSPLIM)。"
          fields:
            - name: "ADDRESS"
              bits: "31:0"
              desc: "进程堆栈指针限制值"
        - name: "PSPLIM_NS"
          desc: "读取进程堆栈指针限制（非安全） 没有 ARMv8-M 主扩展的设备（i.e.Cortex-M23）缺少非安全堆栈指针限制寄存器，因此始终返回零。处于安全状态时，返回非安全进程堆栈指针限制 (PSPLIM) 的当前值；设置进程堆栈指针（非安全） 不带 ARMv8-M 主扩展的设备（i.e.Cortex-M23）缺少非安全堆栈指针限制寄存器，因此写入会被静默忽略。处于安全状态时，将给定值写入非安全进程堆栈指针限制 (PSPLIM)。"
          condition: "实现安全扩展时，可从安全状态访问"
          fields:
            - name: "ADDRESS"
              bits: "31:0"
              desc: "从安全状态访问的非安全进程堆栈指针下界。实现堆栈限制检查时，非安全 PSP 低于该界限可触发堆栈限制故障。"
        - name: "SP_NS"
          desc: "读取堆栈指针（非安全） 处于安全状态时，返回非安全堆栈指针 (SP) 的当前值；设置堆栈指针（非安全） 当处于安全状态时，将给定值写入非安全堆栈指针 (SP)。"
          condition: "实现安全扩展时，可从安全状态访问"
          fields:
            - name: "ADDRESS"
              bits: "31:0"
              desc: "从安全状态访问的非安全堆栈指针值。"
        - name: "xPSR"
          desc: "读取 xPSR 寄存器，返回 xPSR 寄存器的内容。"
          fields:
            - name: "N"
              bits: "31"
              desc: "负数条件码标志。执行会更新条件标志的指令后，N 表示结果按二进制补码解释时的符号：N=1 表示结果为负，N=0 表示结果为非负。它只反映最近一次更新条件标志的指令结果，并不表示任意通用寄存器当前是否为负。"
              values:
                - value: 0
                  desc: "最近一次更新条件标志的结果为非负数。"
                - value: 1
                  desc: "最近一次更新条件标志的结果为负数。"
            - name: "Z"
              bits: "30"
              desc: "零条件码标志。最近一次更新条件标志的指令结果为 0 时 Z=1，否则 Z=0。CMP 等比较指令按减法更新标志但不保存结果，因此 Z=1 通常表示两个操作数相等。"
              values:
                - value: 0
                  desc: "最近一次更新条件标志的结果不为 0；比较结果为不相等。"
                - value: 1
                  desc: "最近一次更新条件标志的结果为 0；比较结果为相等。"
            - name: "C"
              bits: "29"
              desc: "进位/借位条件码标志。加法中 C=1 表示产生无符号进位；减法或 CMP 比较中 C=1 表示未借位、C=0 表示发生借位，因此无符号比较时 C=1 通常表示左操作数大于或等于右操作数。对于会更新标志的移位指令，若指令有相应定义，C 保存最后移出的位。"
              values:
                - value: 0
                  desc: "含义取决于指令：加法未产生无符号进位；减法或比较发生了借位；或者最后移出的位为 0。"
                - value: 1
                  desc: "含义取决于指令：加法产生无符号进位；减法或比较未发生借位；或者最后移出的位为 1。"
            - name: "V"
              bits: "28"
              desc: "有符号溢出条件码标志。数学结果超出当前运算位宽的二进制补码有符号范围时 V=1，例如两个同号数相加却得到异号结果。V 判断有符号溢出；C 判断无符号进位或借位，两者不能互换。"
              values:
                - value: 0
                  desc: "最近一次更新条件标志的算术结果未超出有符号数范围。"
                - value: 1
                  desc: "最近一次更新条件标志的算术结果超出了有符号数范围。"
            - name: "T"
              bits: "24"
              desc: "异常现场中的 Thumb 状态指示。CMSIS 将该位标为只读；构造或恢复异常栈帧时必须保留架构规定的值，不能把它当作普通模式开关。"
            - name: "ISR"
              bits: "8:0"
              desc: "当前异常号。0 表示线程模式；非 0 值按照当前内核实现的异常号表标识正在处理的异常。"
    - name: "SCB"
      title: "系统控制块（SCB）"
      access: "内存映射内核外设访问"
      desc: "来自 SCB_Type 的 SCB 寄存器"
      registers:
        - name: "CPUID"
          desc: "CPUID 基址寄存器"
          fields: []
        - name: "ICSR"
          desc: "中断控制和状态寄存器"
          fields:
            - name: "PENDNMICLR"
              bits: "30"
              values:
                - value: 0
                  desc: "不发出清除请求。"
                - value: 1
                  desc: "写入 1 清除对应的挂起或状态位；读取时可能返回 0。"
            - name: "PENDSVCLR"
              bits: "27"
              values:
                - value: 0
                  desc: "不发出清除请求。"
                - value: 1
                  desc: "写入 1 清除对应的挂起或状态位；读取时可能返回 0。"
            - name: "PENDSTCLR"
              bits: "25"
              values:
                - value: 0
                  desc: "不发出清除请求。"
                - value: 1
                  desc: "写入 1 清除对应的挂起或状态位；读取时可能返回 0。"
            - name: "STTNS"
              bits: "24"
              desc: "位置（安全扩展）"
            - name: "ISRPREEMPT"
              bits: "23"
              desc: "SCB ICSR.ISRPREEMPT 挂起状态。0 表示未挂起，1 表示挂起。"
              values:
                - value: 0
                  desc: "No interrupt preemption 已挂起。"
                - value: 1
                  desc: "Interrupt preemption 已挂起。"
            - name: "ISRPENDING"
              bits: "22"
              desc: "SCB ICSR.ISRPENDING 挂起状态。0 表示未挂起，1 表示挂起。"
              values:
                - value: 0
                  desc: "No external interrupt 已挂起。"
                - value: 1
                  desc: "At least one external interrupt 已挂起。"
        - name: "VTOR"
          desc: "向量表偏移寄存器"
          fields: []
        - name: "AIRCR"
          desc: "应用中断和复位控制寄存器"
          fields:
            - name: "VECTKEY"
              bits: "31:16"
              source_condition: "Field view: VECTKEY"
              condition: "位域视图：VECTKEY"
            - name: "VECTKEYSTAT"
              bits: "31:16"
              source_condition: "Field view: VECTKEYSTAT"
              condition: "位域视图：VECTKEYSTAT"
        - name: "SCR"
          desc: "系统控制寄存器"
          fields: []
        - name: "CCR"
          desc: "配置控制寄存器"
          fields:
            - name: "BP"
              bits: "18"
              desc: "SCB CCR.BP 使能控制。0 表示禁用，1 表示启用。"
              values:
                - value: 0
                  desc: "Branch prediction 已禁用。"
                - value: 1
                  desc: "Branch prediction 已启用。"
            - name: "IC"
              bits: "17"
              desc: "SCB CCR.IC 使能控制。0 表示禁用，1 表示启用。"
              values:
                - value: 0
                  desc: "The instruction cache 已禁用。"
                - value: 1
                  desc: "The instruction cache 已启用。"
            - name: "DC"
              bits: "16"
              desc: "SCB CCR.DC 使能控制。0 表示禁用，1 表示启用。"
              values:
                - value: 0
                  desc: "The data cache 已禁用。"
                - value: 1
                  desc: "The data cache 已启用。"
        - name: "SHPR[0]"
          desc: "系统处理程序优先级寄存器。 [0] 为 RESERVED（元素 0）"
        - name: "SHPR[1]"
          desc: "系统处理程序优先级寄存器。 [0] 是 RESERVED（元素 1）"
        - name: "SHCSR"
          desc: "系统处理程序控制和状态寄存器"
          fields:
            - name: "HARDFAULTPENDED"
              bits: "21"
              desc: "HARDFAULT 异常挂起状态。1 表示对应异常已挂起。"
            - name: "SVCALLPENDED"
              bits: "15"
              desc: "SVCALL 异常挂起状态。1 表示对应异常已挂起。"
            - name: "SYSTICKACT"
              bits: "11"
              desc: "SYSTICK 异常活动状态。1 表示对应异常当前处于活动状态。"
              values:
                - value: 0
                  desc: "SYSTICK exception 未活动。"
                - value: 1
                  desc: "SYSTICK exception 处于活动状态。"
            - name: "PENDSVACT"
              bits: "10"
              desc: "PENDSV 异常活动状态。1 表示对应异常当前处于活动状态。"
              values:
                - value: 0
                  desc: "PENDSV exception 未活动。"
                - value: 1
                  desc: "PENDSV exception 处于活动状态。"
            - name: "SVCALLACT"
              bits: "7"
              desc: "SVCALL 异常活动状态。1 表示对应异常当前处于活动状态。"
              values:
                - value: 0
                  desc: "SVCALL exception 未活动。"
                - value: 1
                  desc: "SVCALL exception 处于活动状态。"
            - name: "NMIACT"
              bits: "5"
              desc: "NMI 异常活动状态。1 表示对应异常当前处于活动状态。"
              values:
                - value: 0
                  desc: "NMI exception 未活动。"
                - value: 1
                  desc: "NMI exception 处于活动状态。"
            - name: "HARDFAULTACT"
              bits: "2"
              desc: "HARDFAULT 异常活动状态。1 表示对应异常当前处于活动状态。"
              values:
                - value: 0
                  desc: "HARDFAULT exception 未活动。"
                - value: 1
                  desc: "HARDFAULT exception 处于活动状态。"
    - name: "SysTick"
      title: "系统滴答定时器（SysTick）"
      access: "内存映射内核外设访问"
      desc: "来自 SysTick_Type 的 SysTick 寄存器"
      registers:
        - name: "CTRL"
          desc: "SysTick 控制和状态寄存器"
          fields:
            - name: "COUNTFLAG"
              bits: "16"
              desc: "计数器回卷状态。SysTick 从 1 递减到 0 时置 1；读取 SysTick CTRL 会清除该粘滞状态。"
              values:
                - value: 0
                  desc: "自上次读取 CTRL 后，计数器尚未回卷到 0。"
                - value: 1
                  desc: "自上次读取 CTRL 后，计数器至少回卷到 0 一次。"
            - name: "CLKSOURCE"
              bits: "2"
              desc: "SysTick 时钟源选择。0 选择外部/参考时钟，1 选择处理器时钟。"
              values:
                - value: 0
                  desc: "SysTick 使用外部/参考时钟。"
                - value: 1
                  desc: "SysTick 使用处理器时钟。"
            - name: "TICKINT"
              bits: "1"
              desc: "SysTick 异常请求控制。置 1 后，计数器回卷到 0 时请求 SysTick 异常。"
              values:
                - value: 0
                  desc: "计数器回卷时不请求 SysTick 异常。"
                - value: 1
                  desc: "计数器回卷时请求 SysTick 异常。"
            - name: "ENABLE"
              bits: "0"
              desc: "SysTick 计数器使能控制。0 停止计数，1 从 LOAD 装载值开始递减计数。"
              values:
                - value: 0
                  desc: "SysTick 计数器停止。"
                - value: 1
                  desc: "SysTick 计数器从 LOAD 装载值开始递减。"
        - name: "LOAD"
          desc: "SysTick 重载值寄存器"
          fields:
            - name: "RELOAD"
              bits: "23:0"
              desc: "SysTick 计数器递减到 0 后重新装载的值。"
        - name: "VAL"
          desc: "SysTick 当前值寄存器"
          fields:
            - name: "CURRENT"
              bits: "23:0"
              desc: "SysTick 当前计数值；向该字段写入任意值都会把当前计数器清零。"
        - name: "CALIB"
          desc: "SysTick 校准寄存器"
          fields:
            - name: "NOREF"
              bits: "31"
              desc: "校准参考时钟指示。0 表示存在独立参考时钟，1 表示没有独立参考时钟。"
              values:
                - value: 0
                  desc: "存在可用于校准的独立参考时钟。"
                - value: 1
                  desc: "不存在独立参考时钟。"
            - name: "SKEW"
              bits: "30"
              desc: "校准偏差指示。1 表示 TENMS 校准值不能保证满足实现规定的精度。"
              values:
                - value: 0
                  desc: "TENMS 校准值满足实现规定的精度。"
                - value: 1
                  desc: "TENMS 校准值不能保证满足实现规定的精度。"
            - name: "TENMS"
              bits: "23:0"
              desc: "参考时钟下对应 10 ms 时间间隔的重装校准值。"
