          desc: "MPU 控制寄存器"
          condition: "当 __MPU_PRESENT == 1 时"
          fields:
            - name: "PRIVDEFENA"
              bits: "2"
              desc: "特权默认内存映射控制。置 1 后，特权访问在没有 MPU 区域匹配时可以使用默认内存映射。"
            - name: "HFNMIENA"
              bits: "1"
              desc: "HardFault/NMI 处理期间的 MPU 检查控制。置 1 后，在 HardFault 和 NMI 处理函数中仍执行 MPU 检查。"
            - name: "ENABLE"
              bits: "0"
              desc: "MPU 总使能控制。0 禁用 MPU，1 启用 MPU。"
              values:
                - value: 0
                  desc: "MPU 已禁用。"
                - value: 1
                  desc: "MPU 已启用。"
        - name: "RNR"
          desc: "MPU 区域编号寄存器"
          condition: "当 __MPU_PRESENT == 1 时"
          fields: []
        - name: "RBAR"
          desc: "MPU 区域基地址寄存器"
          condition: "当 __MPU_PRESENT == 1 时"
          fields:
            - name: "XN"
              bits: "0"
              desc: "执行禁止（XN）控制。置 1 后禁止从该 MPU 区域取指执行。"
        - name: "RLAR"
          desc: "MPU 区域限制地址寄存器"
          condition: "当 __MPU_PRESENT == 1 时"
          fields:
            - name: "EN"
              bits: "0"
              desc: "MPU 区域使能控制。0 禁用该区域，1 启用该区域。"
        - name: "MAIR0"
          desc: "MPU 内存属性间接寄存器 0"
          condition: "当 __MPU_PRESENT == 1 时"
          fields: []
        - name: "MAIR1"
          desc: "MPU 内存属性间接寄存器 1"
          condition: "当 __MPU_PRESENT == 1 时"
          fields: []
    - name: "SAU"
      title: "安全归属单元（SAU）"
      access: "内存映射内核外设访问"
      desc: "来自 SAU_Type 的 SAU 寄存器"
      registers:
        - name: "CTRL"
          desc: "SAU 控制寄存器"
          condition: "何时实现安全扩展"
          fields:
            - name: "ALLNS"
              bits: "1"
              desc: "未匹配地址的默认安全归属控制。置 1 后，未命中 SAU 区域的地址归属为非安全。"
            - name: "ENABLE"
              bits: "0"
              desc: "安全归属单元（SAU）总使能控制。0 禁用 SAU，1 启用 SAU。"
              values:
                - value: 0
                  desc: "SAU 已禁用。"
                - value: 1
                  desc: "SAU 已启用。"
        - name: "TYPE"
          desc: "SAU 类型寄存器"
          condition: "何时实现安全扩展"
          fields: []
        - name: "RNR"
          desc: "SAU 区域编号寄存器"
          condition: "何时实现安全扩展"
          fields: []
        - name: "RBAR"
          desc: "SAU 区域基地址寄存器"
          condition: "何时实现安全扩展"
          fields: []
        - name: "RLAR"
          desc: "SAU 区域限制地址寄存器"
          condition: "何时实现安全扩展"
          fields:
            - name: "NSC"
              bits: "1"
              desc: "非安全可调用（NSC）属性控制。置 1 后，该 SAU 区域被标记为非安全可调用区域。"
              values:
                - value: 0
                  desc: "该区域不是非安全可调用区域。"
                - value: 1
                  desc: "该区域是非安全可调用区域。"
            - name: "ENABLE"
              bits: "0"
              desc: "SAU 区域使能控制。0 禁用该区域，1 启用该区域。"
              values:
                - value: 0
                  desc: "SAU 已禁用。"
                - value: 1
                  desc: "SAU 已启用。"
    - name: "SCB_NS"
      title: "系统控制块（SCB）（非安全）"
      access: "内存映射内核外设访问"
      desc: "来自 SCB_Type 的 SCB_NS 寄存器"
      registers:
        - name: "CPUID"
          desc: "CPUID 基址寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields: []
        - name: "ICSR"
          desc: "中断控制和状态寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "PENDNMICLR"
              bits: "30"
              values:
                - value: 0
                  desc: "不发出清除请求。"
                - value: 1
                  desc: "写入 1 清除对应的挂起或状态位；读取时可能返回 0。"
            - name: "PENDSVCLR"
              bits: "27"
              values:
                - value: 0
                  desc: "不发出清除请求。"
                - value: 1
                  desc: "写入 1 清除对应的挂起或状态位；读取时可能返回 0。"
            - name: "PENDSTCLR"
              bits: "25"
              values:
                - value: 0
                  desc: "不发出清除请求。"
                - value: 1
                  desc: "写入 1 清除对应的挂起或状态位；读取时可能返回 0。"
            - name: "STTNS"
              bits: "24"
              desc: "位置（安全扩展）"
            - name: "ISRPREEMPT"
              bits: "23"
              desc: "SCB_NS ICSR.ISRPREEMPT 挂起状态。0 表示未挂起，1 表示挂起。"
              values:
                - value: 0
                  desc: "No interrupt preemption 已挂起。"
                - value: 1
                  desc: "Interrupt preemption 已挂起。"
            - name: "ISRPENDING"
              bits: "22"
              desc: "SCB_NS ICSR.ISRPENDING 挂起状态。0 表示未挂起，1 表示挂起。"
              values:
                - value: 0
                  desc: "No external interrupt 已挂起。"
                - value: 1
                  desc: "At least one external interrupt 已挂起。"
        - name: "VTOR"
          desc: "向量表偏移寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields: []
        - name: "AIRCR"
          desc: "应用中断和复位控制寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "VECTKEY"
              bits: "31:16"
              source_condition: "Field view: VECTKEY"
              condition: "位域视图：VECTKEY"
            - name: "VECTKEYSTAT"
              bits: "31:16"
              source_condition: "Field view: VECTKEYSTAT"
              condition: "位域视图：VECTKEYSTAT"
        - name: "SCR"
          desc: "系统控制寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields: []
        - name: "CCR"
          desc: "配置控制寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "BP"
              bits: "18"
              desc: "SCB_NS CCR.BP 使能控制。0 表示禁用，1 表示启用。"
              values:
                - value: 0
                  desc: "Branch prediction 已禁用。"
                - value: 1
                  desc: "Branch prediction 已启用。"
            - name: "IC"
              bits: "17"
              desc: "SCB_NS CCR.IC 使能控制。0 表示禁用，1 表示启用。"
              values:
                - value: 0
                  desc: "The instruction cache 已禁用。"
                - value: 1
                  desc: "The instruction cache 已启用。"
            - name: "DC"
              bits: "16"
              desc: "SCB_NS CCR.DC 使能控制。0 表示禁用，1 表示启用。"
              values:
                - value: 0
                  desc: "The data cache 已禁用。"
                - value: 1
                  desc: "The data cache 已启用。"
        - name: "SHPR[0]"
          desc: "系统处理程序优先级寄存器。 [0] 为 RESERVED（元素 0）"
          condition: "当安全扩展公开非安全别名时"
        - name: "SHPR[1]"
          desc: "系统处理程序优先级寄存器。 [0] 是 RESERVED（元素 1）"
          condition: "当安全扩展公开非安全别名时"
        - name: "SHCSR"
          desc: "系统处理程序控制和状态寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "HARDFAULTPENDED"
              bits: "21"
              desc: "HARDFAULT 异常挂起状态。1 表示对应异常已挂起。"
            - name: "SVCALLPENDED"
              bits: "15"
              desc: "SVCALL 异常挂起状态。1 表示对应异常已挂起。"
            - name: "SYSTICKACT"
              bits: "11"
              desc: "SYSTICK 异常活动状态。1 表示对应异常当前处于活动状态。"
              values:
                - value: 0
                  desc: "SYSTICK exception 未活动。"
                - value: 1
                  desc: "SYSTICK exception 处于活动状态。"
            - name: "PENDSVACT"
              bits: "10"
              desc: "PENDSV 异常活动状态。1 表示对应异常当前处于活动状态。"
              values:
                - value: 0
                  desc: "PENDSV exception 未活动。"
                - value: 1
                  desc: "PENDSV exception 处于活动状态。"
            - name: "SVCALLACT"
              bits: "7"
              desc: "SVCALL 异常活动状态。1 表示对应异常当前处于活动状态。"
              values:
                - value: 0
                  desc: "SVCALL exception 未活动。"
                - value: 1
                  desc: "SVCALL exception 处于活动状态。"
            - name: "NMIACT"
              bits: "5"
              desc: "NMI 异常活动状态。1 表示对应异常当前处于活动状态。"
              values:
                - value: 0
                  desc: "NMI exception 未活动。"
                - value: 1
                  desc: "NMI exception 处于活动状态。"
            - name: "HARDFAULTACT"
              bits: "2"
              desc: "HARDFAULT 异常活动状态。1 表示对应异常当前处于活动状态。"
              values:
                - value: 0
                  desc: "HARDFAULT exception 未活动。"
                - value: 1
                  desc: "HARDFAULT exception 处于活动状态。"
    - name: "SysTick_NS"
      title: "系统滴答定时器（SysTick）（非安全）"
      access: "内存映射内核外设访问"
      desc: "来自 SysTick_Type 的 SysTick_NS 寄存器"
      registers:
        - name: "CTRL"
          desc: "SysTick 控制和状态寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "COUNTFLAG"
              bits: "16"
              desc: "计数器回卷状态。SysTick 从 1 递减到 0 时置 1；读取 SysTick CTRL 会清除该粘滞状态。"
              values:
                - value: 0
                  desc: "自上次读取 CTRL 后，计数器尚未回卷到 0。"
                - value: 1
                  desc: "自上次读取 CTRL 后，计数器至少回卷到 0 一次。"
            - name: "CLKSOURCE"
              bits: "2"
              desc: "SysTick 时钟源选择。0 选择外部/参考时钟，1 选择处理器时钟。"
              values:
                - value: 0
                  desc: "SysTick 使用外部/参考时钟。"
                - value: 1
                  desc: "SysTick 使用处理器时钟。"
            - name: "TICKINT"
              bits: "1"
              desc: "SysTick 异常请求控制。置 1 后，计数器回卷到 0 时请求 SysTick 异常。"
              values:
                - value: 0
                  desc: "计数器回卷时不请求 SysTick 异常。"
                - value: 1
                  desc: "计数器回卷时请求 SysTick 异常。"
            - name: "ENABLE"
              bits: "0"
              desc: "SysTick 计数器使能控制。0 停止计数，1 从 LOAD 装载值开始递减计数。"
              values:
                - value: 0
                  desc: "SysTick 计数器停止。"
                - value: 1
                  desc: "SysTick 计数器从 LOAD 装载值开始递减。"
        - name: "LOAD"
          desc: "SysTick 重载值寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "RELOAD"
              bits: "23:0"
              desc: "SysTick 计数器递减到 0 后重新装载的值。"
        - name: "VAL"
          desc: "SysTick 当前值寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "CURRENT"
              bits: "23:0"
              desc: "SysTick 当前计数值；向该字段写入任意值都会把当前计数器清零。"
        - name: "CALIB"
          desc: "SysTick 校准寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "NOREF"
              bits: "31"
              desc: "校准参考时钟指示。0 表示存在独立参考时钟，1 表示没有独立参考时钟。"
              values:
                - value: 0
                  desc: "存在可用于校准的独立参考时钟。"
                - value: 1
                  desc: "不存在独立参考时钟。"
            - name: "SKEW"
              bits: "30"
              desc: "校准偏差指示。1 表示 TENMS 校准值不能保证满足实现规定的精度。"
              values:
                - value: 0
                  desc: "TENMS 校准值满足实现规定的精度。"
                - value: 1
                  desc: "TENMS 校准值不能保证满足实现规定的精度。"
            - name: "TENMS"
              bits: "23:0"
              desc: "参考时钟下对应 10 ms 时间间隔的重装校准值。"
