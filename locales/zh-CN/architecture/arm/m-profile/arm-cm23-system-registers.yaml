    - name: "DCB_NS"
      title: "调试控制块（DCB）（非安全）"
      access: "内存映射内核外设访问"
      desc: "来自 DCB_Type 的 DCB_NS 寄存器"
      registers:
        - name: "DHCSR"
          desc: "调试停止控制和状态寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "DBGKEY"
              bits: "31:16"
              source_condition: "Field view: DBGKEY"
              desc: "DCB DHCSR：调试键"
              condition: "位域视图：DBGKEY"
            - name: "S_RESTART_ST"
              bits: "26"
              source_condition: "Field view: S_RESTART_ST"
              desc: "DCB DHCSR：重启粘滞状态"
              condition: "位域视图：S_RESTART_ST"
            - name: "S_RESET_ST"
              bits: "25"
              source_condition: "Field view: S_RESET_ST"
              desc: "DCB DHCSR：复位粘滞状态"
              condition: "位域视图：S_RESET_ST"
            - name: "S_RETIRE_ST"
              bits: "24"
              source_condition: "Field view: S_RETIRE_ST"
              desc: "DCB DHCSR：指令完成粘滞状态"
              condition: "位域视图：S_RETIRE_ST"
            - name: "S_SDE"
              bits: "20"
              source_condition: "Field view: S_SDE"
              desc: "DCB DHCSR：安全调试已启用"
              condition: "位域视图：S_SDE"
            - name: "S_LOCKUP"
              bits: "19"
              source_condition: "Field view: S_LOCKUP"
              desc: "DCB DHCSR：锁定状态"
              condition: "位域视图：S_LOCKUP"
            - name: "S_SLEEP"
              bits: "18"
              source_condition: "Field view: S_SLEEP"
              desc: "DCB DHCSR：休眠状态"
              condition: "位域视图：S_SLEEP"
            - name: "S_HALT"
              bits: "17"
              source_condition: "Field view: S_HALT"
              desc: "DCB DHCSR：暂停状态"
              condition: "位域视图：S_HALT"
            - name: "S_REGRDY"
              bits: "16"
              source_condition: "Field view: S_REGRDY"
              desc: "DCB DHCSR：寄存器就绪状态"
              condition: "位域视图：S_REGRDY"
            - name: "C_MASKINTS"
              bits: "3"
              desc: "DCB DHCSR：中断屏蔽控制"
            - name: "C_STEP"
              bits: "2"
              desc: "DCB DHCSR：单步控制"
            - name: "C_HALT"
              bits: "1"
              desc: "DCB DHCSR：暂停控制"
            - name: "C_DEBUGEN"
              bits: "0"
              desc: "DCB DHCSR：调试使能控制"
        - name: "DCRSR"
          desc: "调试核心寄存器选择器寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "REGWnR"
              bits: "16"
              desc: "DCB DCRSR：寄存器写/不读"
            - name: "REGSEL"
              bits: "6:0"
              desc: "DCB DCRSR：寄存器选择器"
        - name: "DCRDR"
          desc: "调试核心寄存器 数据寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "DBGTMP"
              bits: "31:0"
              desc: "DCB DCRDR：数据临时缓冲区"
        - name: "DEMCR"
          desc: "调试异常和监视控制寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "TRCENA"
              bits: "24"
              desc: "DCB DEMCR：跟踪使能"
            - name: "VC_HARDERR"
              bits: "10"
              desc: "DCB DEMCR：HardFault 错误向量捕获"
            - name: "VC_CORERESET"
              bits: "0"
              desc: "DCB DEMCR：内核复位向量捕获"
        - name: "DAUTHCTRL"
          desc: "调试验证控制寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "INTSPNIDEN"
              bits: "3"
              desc: "DCB DAUTHCTRL：内部安全非侵入式调试使能"
            - name: "SPNIDENSEL"
              bits: "2"
              desc: "DCB DAUTHCTRL：安全非侵入式调试使能选择"
            - name: "INTSPIDEN"
              bits: "1"
              desc: "DCB DAUTHCTRL：内部安全侵入式调试使能"
            - name: "SPIDENSEL"
              bits: "0"
              desc: "DCB DAUTHCTRL：安全侵入式调试使能选择"
        - name: "DSCSR"
          desc: "调试安全控制和状态寄存器"
