    - name: "DCB_NS"
      title: "调试控制块（DCB）（非安全）"
      access: "内存映射内核外设访问"
      desc: "来自 DCB_Type 的 DCB_NS 寄存器"
      registers:
        - name: "DHCSR"
          desc: "调试停止控制和状态寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "DBGKEY"
              bits: "31:16"
              source_condition: "Field view: DBGKEY"
              desc: "DCB DHCSR：调试键"
              condition: "位域视图：DBGKEY"
            - name: "S_RESTART_ST"
              bits: "26"
              source_condition: "Field view: S_RESTART_ST"
              desc: "DCB DHCSR：重启粘滞状态"
              condition: "位域视图：S_RESTART_ST"
            - name: "S_RESET_ST"
              bits: "25"
              source_condition: "Field view: S_RESET_ST"
              desc: "DCB DHCSR：复位粘滞状态"
              condition: "位域视图：S_RESET_ST"
            - name: "S_RETIRE_ST"
              bits: "24"
              source_condition: "Field view: S_RETIRE_ST"
              desc: "DCB DHCSR：指令完成粘滞状态"
              condition: "位域视图：S_RETIRE_ST"
            - name: "S_SDE"
              bits: "20"
              source_condition: "Field view: S_SDE"
              desc: "DCB DHCSR：安全调试已启用"
              condition: "位域视图：S_SDE"
            - name: "S_LOCKUP"
              bits: "19"
              source_condition: "Field view: S_LOCKUP"
              desc: "DCB DHCSR：锁定状态"
              condition: "位域视图：S_LOCKUP"
            - name: "S_SLEEP"
              bits: "18"
              source_condition: "Field view: S_SLEEP"
              desc: "DCB DHCSR：休眠状态"
              condition: "位域视图：S_SLEEP"
            - name: "S_HALT"
              bits: "17"
              source_condition: "Field view: S_HALT"
              desc: "DCB DHCSR：暂停状态"
              condition: "位域视图：S_HALT"
            - name: "S_REGRDY"
              bits: "16"
              source_condition: "Field view: S_REGRDY"
              desc: "DCB DHCSR：寄存器就绪状态"
              condition: "位域视图：S_REGRDY"
            - name: "C_MASKINTS"
              bits: "3"
              desc: "DCB DHCSR：中断屏蔽控制"
            - name: "C_STEP"
              bits: "2"
              desc: "DCB DHCSR：单步控制"
            - name: "C_HALT"
              bits: "1"
              desc: "DCB DHCSR：暂停控制"
            - name: "C_DEBUGEN"
              bits: "0"
              desc: "DCB DHCSR：调试使能控制"
        - name: "DCRSR"
          desc: "调试核心寄存器选择器寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "REGWnR"
              bits: "16"
              desc: "DCB DCRSR：寄存器写/不读"
            - name: "REGSEL"
              bits: "6:0"
              desc: "DCB DCRSR：寄存器选择器"
        - name: "DCRDR"
          desc: "调试核心寄存器 数据寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "DBGTMP"
              bits: "31:0"
              desc: "DCB DCRDR：数据临时缓冲区"
        - name: "DEMCR"
          desc: "调试异常和监视控制寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "TRCENA"
              bits: "24"
              desc: "DCB DEMCR：跟踪使能"
            - name: "VC_HARDERR"
              bits: "10"
              desc: "DCB DEMCR：HardFault 错误向量捕获"
            - name: "VC_CORERESET"
              bits: "0"
              desc: "DCB DEMCR：内核复位向量捕获"
        - name: "DAUTHCTRL"
          desc: "调试验证控制寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "INTSPNIDEN"
              bits: "3"
              desc: "DCB DAUTHCTRL：内部安全非侵入式调试使能"
            - name: "SPNIDENSEL"
              bits: "2"
              desc: "DCB DAUTHCTRL：安全非侵入式调试使能选择"
            - name: "INTSPIDEN"
              bits: "1"
              desc: "DCB DAUTHCTRL：内部安全侵入式调试使能"
            - name: "SPIDENSEL"
              bits: "0"
              desc: "DCB DAUTHCTRL：安全侵入式调试使能选择"
        - name: "DSCSR"
          desc: "调试安全控制和状态寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "CDSKEY"
              bits: "17"
              desc: "DCB DSCSR：CDS 写使能键"
            - name: "CDS"
              bits: "16"
              desc: "DCB DSCSR：当前域为安全状态"
            - name: "SBRSEL"
              bits: "1"
              desc: "DCB DSCSR：安全分组寄存器选择"
            - name: "SBRSELEN"
              bits: "0"
              desc: "DCB DSCSR：安全分组寄存器选择使能"
    - name: "DIB_NS"
      title: "调试接口块（DIB）（非安全）"
      access: "内存映射内核外设访问"
      desc: "来自 DIB_Type 的 DIB_NS 寄存器"
      registers:
        - name: "DLAR"
          desc: "SCS 软件锁访问寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields: []
        - name: "DLSR"
          desc: "SCS 软件锁定状态寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "nTT"
              bits: "2"
              desc: "DIB DLSR：不是三十二位"
            - name: "SLK"
              bits: "1"
              desc: "DIB DLSR：软件锁定状态"
            - name: "SLI"
              bits: "0"
              desc: "DIB DLSR：实现软件锁"
        - name: "DAUTHSTATUS"
          desc: "调试验证状态寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "SNID"
              bits: "7:6"
              desc: "DIB DAUTHSTATUS：安全非侵入式调试"
            - name: "SID"
              bits: "5:4"
              desc: "DIB DAUTHSTATUS：安全侵入式调试"
            - name: "NSNID"
              bits: "3:2"
              desc: "DIB DAUTHSTATUS：非安全非侵入式调试"
            - name: "NSID"
              bits: "1:0"
              desc: "DIB DAUTHSTATUS：非安全侵入式调试"
        - name: "DDEVARCH"
          desc: "SCS 设备架构寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "ARCHITECT"
              bits: "31:21"
              source_condition: "Field view: ARCHITECT"
              condition: "位域视图：ARCHITECT"
            - name: "PRESENT"
              bits: "24:20"
              source_condition: "Field view: PRESENT"
              condition: "位域视图：PRESENT"
            - name: "ARCHVER"
              bits: "15:12"
              desc: "DIB DDEVARCH：架构版本"
            - name: "ARCHPART"
              bits: "11:0"
              desc: "DIB DDEVARCH：架构部分"
        - name: "DDEVTYPE"
          desc: "SCS 设备类型寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "SUB"
              bits: "7:4"
              desc: "-类型"
            - name: "MAJOR"
              bits: "3:0"
              desc: "类型"
    - name: "MPU_NS"
      title: "内存保护单元（MPU）（非安全）"
      access: "内存映射内核外设访问"
      desc: "来自 MPU_Type 的 MPU_NS 寄存器"
      registers:
        - name: "TYPE"
          desc: "MPU 类型寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "SEPARATE"
              bits: "0"
              desc: "指令区和数据区是否使用独立区域集合的实现指示。"
        - name: "CTRL"
          desc: "MPU 控制寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "PRIVDEFENA"
              bits: "2"
              desc: "特权默认内存映射控制。置 1 后，特权访问在没有 MPU 区域匹配时可以使用默认内存映射。"
            - name: "HFNMIENA"
              bits: "1"
              desc: "HardFault/NMI 处理期间的 MPU 检查控制。置 1 后，在 HardFault 和 NMI 处理函数中仍执行 MPU 检查。"
            - name: "ENABLE"
              bits: "0"
              desc: "MPU 总使能控制。0 禁用 MPU，1 启用 MPU。"
              values:
                - value: 0
                  desc: "MPU 已禁用。"
                - value: 1
                  desc: "MPU 已启用。"
        - name: "RNR"
          desc: "MPU 区域编号寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields: []
        - name: "RBAR"
          desc: "MPU 区域基地址寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "XN"
              bits: "0"
              desc: "执行禁止（XN）控制。置 1 后禁止从该 MPU 区域取指执行。"
        - name: "RLAR"
          desc: "MPU 区域限制地址寄存器"
          condition: "当安全扩展公开非安全别名时"
          fields:
            - name: "EN"
              bits: "0"
              desc: "MPU 区域使能控制。0 禁用该区域，1 启用该区域。"
        - name: "MAIR0"
          desc: "MPU 内存属性间接寄存器 0"
          condition: "当安全扩展公开非安全别名时"
          fields: []
        - name: "MAIR1"
          desc: "MPU 内存属性间接寄存器 1"
          condition: "当安全扩展公开非安全别名时"
          fields: []
