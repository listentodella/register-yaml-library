    - name: "FPU"
      title: "浮点单元（FPU）"
      access: "内存映射内核外设访问"
      desc: "来自 FPU_Type 的 FPU 寄存器"
      registers:
        - name: "FPCCR"
          desc: "浮点上下文控制寄存器"
          condition: "当__FPU_PRESENT==1时"
          fields:
            - name: "ASPEN"
              bits: "31"
              desc: "自动浮点状态保存控制。置 1 后，异常进入时启用浮点上下文的自动保存机制。"
            - name: "LSPEN"
              bits: "30"
              desc: "惰性浮点状态保存控制。置 1 后，只有异常处理程序实际使用浮点功能时才完成浮点上下文保存。"
            - name: "MONRDY"
              bits: "8"
              desc: "MONRDY 浮点状态就绪标志。"
              values:
                - value: 0
                  desc: "对应浮点状态尚未就绪。"
                - value: 1
                  desc: "对应浮点状态已经就绪。"
            - name: "BFRDY"
              bits: "6"
              desc: "BFRDY 浮点状态就绪标志。"
              values:
                - value: 0
                  desc: "对应浮点状态尚未就绪。"
                - value: 1
                  desc: "对应浮点状态已经就绪。"
            - name: "MMRDY"
              bits: "5"
              desc: "MMRDY 浮点状态就绪标志。"
              values:
                - value: 0
                  desc: "对应浮点状态尚未就绪。"
                - value: 1
                  desc: "对应浮点状态已经就绪。"
            - name: "HFRDY"
              bits: "4"
              desc: "HFRDY 浮点状态就绪标志。"
              values:
                - value: 0
                  desc: "对应浮点状态尚未就绪。"
                - value: 1
                  desc: "对应浮点状态已经就绪。"
            - name: "THREAD"
              bits: "3"
              desc: "浮点上下文处理器模式状态。0 表示处理模式，1 表示线程模式。"
            - name: "USER"
              bits: "1"
              desc: "浮点上下文特权级状态。0 表示特权上下文，1 表示非特权上下文。"
            - name: "LSPACT"
              bits: "0"
              desc: "惰性浮点状态保存活动状态。1 表示当前存在尚未完成的惰性浮点上下文保存。"
        - name: "FPCAR"
          desc: "浮点上下文地址寄存器"
          condition: "当__FPU_PRESENT==1时"
          fields:
            - name: "ADDRESS"
              bits: "31:3"
              desc: "位"
        - name: "FPDSCR"
          desc: "浮点默认状态控制寄存器"
          condition: "当__FPU_PRESENT==1时"
          fields:
            - name: "AHP"
              bits: "26"
              desc: "位"
            - name: "DN"
              bits: "25"
              desc: "位"
            - name: "FZ"
              bits: "24"
              desc: "位"
            - name: "RMode"
              bits: "23:22"
              desc: "位"
        - name: "MVFR0"
          desc: "媒体和 VFP 功能寄存器 0"
          condition: "当__FPU_PRESENT==1时"
          fields:
            - name: "FPRound"
              bits: "31:28"
              desc: "MVFR0：舍入模式位"
            - name: "FPShortvec"
              bits: "27:24"
              desc: "MVFR0：短向量位"
            - name: "FPSqrt"
              bits: "23:20"
              desc: "MVFR0：平方根位"
            - name: "FPDivide"
              bits: "19:16"
              desc: "MVFR0：除位"
            - name: "FPExceptrap"
              bits: "15:12"
              desc: "MVFR0：异常捕获位"
            - name: "FPDP"
              bits: "11:8"
              desc: "MVFR0：双精度位"
            - name: "FPSP"
              bits: "7:4"
              desc: "MVFR0：单精度位"
            - name: "SIMDReg"
              bits: "3:0"
              desc: "MVFR0：SIMD 寄存器位"
        - name: "MVFR1"
          desc: "媒体和 VFP 功能寄存器 1"
          condition: "当__FPU_PRESENT==1时"
          fields:
            - name: "FMAC"
              bits: "31:28"
              desc: "MVFR1：带保险丝的 MAC 位"
            - name: "FPHP"
              bits: "27:24"
              desc: "MVFR1：FP HPFP 位"
            - name: "FPDNaN"
              bits: "7:4"
              desc: "MVFR1：D_NaN 模式位"
            - name: "FPFtZ"
              bits: "3:0"
              desc: "MVFR1：FtZ 模式位"
        - name: "MVFR2"
          desc: "媒体和 VFP 功能寄存器 2"
          condition: "当__FPU_PRESENT==1时"
          fields:
            - name: "FPMisc"
              bits: "7:4"
              desc: "MVFR2：VFP 杂项位"
