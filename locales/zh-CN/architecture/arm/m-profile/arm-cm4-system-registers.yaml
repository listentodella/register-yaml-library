                  desc: "实现了性能分析计数器。"
                - value: 1
                  desc: "未实现性能分析计数器。"
            - name: "CYCEVTENA"
              bits: "22"
              desc: "DWT 周期计数事件生成控制。置 1 后启用周期计数事件。"
              values:
                - value: 0
                  desc: "Cycle-count event generation 已禁用。"
                - value: 1
                  desc: "Cycle-count event generation 已启用。"
            - name: "FOLDEVTENA"
              bits: "21"
              desc: "DWT 折叠指令事件生成控制。置 1 后启用折叠指令事件。"
              values:
                - value: 0
                  desc: "Folded-instruction event generation 已禁用。"
                - value: 1
                  desc: "Folded-instruction event generation 已启用。"
            - name: "LSUEVTENA"
              bits: "20"
              desc: "DWT 装载/存储单元事件生成控制。置 1 后启用 LSU 事件。"
              values:
                - value: 0
                  desc: "Load/store-unit event generation 已禁用。"
                - value: 1
                  desc: "Load/store-unit event generation 已启用。"
            - name: "SLEEPEVTENA"
              bits: "19"
              desc: "DWT 休眠事件生成控制。置 1 后启用休眠事件。"
              values:
                - value: 0
                  desc: "Sleep event generation 已禁用。"
                - value: 1
                  desc: "Sleep event generation 已启用。"
            - name: "EXCEVTENA"
              bits: "18"
              desc: "DWT 异常事件生成控制。置 1 后启用异常事件。"
              values:
                - value: 0
                  desc: "Exception event generation 已禁用。"
                - value: 1
                  desc: "Exception event generation 已启用。"
            - name: "CPIEVTENA"
              bits: "17"
              desc: "DWT CPI 事件生成控制。置 1 后启用 CPI 事件。"
              values:
                - value: 0
                  desc: "CPI event generation 已禁用。"
                - value: 1
                  desc: "CPI event generation 已启用。"
            - name: "EXCTRCENA"
              bits: "16"
              desc: "DWT 异常跟踪生成控制。置 1 后启用异常跟踪。"
              values:
                - value: 0
                  desc: "Exception tracing 已禁用。"
                - value: 1
                  desc: "Exception tracing 已启用。"
            - name: "PCSAMPLENA"
              bits: "12"
              desc: "DWT 程序计数器采样控制。置 1 后启用 PC 采样。"
              values:
                - value: 0
                  desc: "Program-counter sampling 已禁用。"
                - value: 1
                  desc: "Program-counter sampling 已启用。"
            - name: "CYCCNTENA"
              bits: "0"
              desc: "DWT 周期计数器使能控制。0 禁用 CYCCNT，1 启用 CYCCNT。"
              values:
                - value: 0
                  desc: "DWT 周期计数器已禁用。"
                - value: 1
                  desc: "DWT 周期计数器已启用。"
