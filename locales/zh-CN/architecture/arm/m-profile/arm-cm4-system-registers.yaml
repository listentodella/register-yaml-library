translations:
  sensor: "Arm Cortex-M4 系统寄存器"
  pages:
    - name: "Special Registers"
      title: "特殊寄存器"
      access: "MRS / MSR 特殊寄存器接口"
      desc: "由 CMSIS-Core 内建函数提供的 M-profile 处理器状态、屏蔽、控制和堆栈指针寄存器"
      registers:
        - name: "APSR"
          desc: "读取 APSR 寄存器，返回 APSR 寄存器的内容。"
          fields:
            - name: "N"
              bits: "31"
              desc: "负数条件码标志。执行会更新条件标志的指令后，N 表示结果按二进制补码解释时的符号：N=1 表示结果为负，N=0 表示结果为非负。它只反映最近一次更新条件标志的指令结果，并不表示任意通用寄存器当前是否为负。"
              values:
                - value: 0
                  desc: "最近一次更新条件标志的结果为非负数。"
                - value: 1
                  desc: "最近一次更新条件标志的结果为负数。"
            - name: "Z"
              bits: "30"
              desc: "零条件码标志。最近一次更新条件标志的指令结果为 0 时 Z=1，否则 Z=0。CMP 等比较指令按减法更新标志但不保存结果，因此 Z=1 通常表示两个操作数相等。"
              values:
                - value: 0
                  desc: "最近一次更新条件标志的结果不为 0；比较结果为不相等。"
                - value: 1
                  desc: "最近一次更新条件标志的结果为 0；比较结果为相等。"
            - name: "C"
              bits: "29"
              desc: "进位/借位条件码标志。加法中 C=1 表示产生无符号进位；减法或 CMP 比较中 C=1 表示未借位、C=0 表示发生借位，因此无符号比较时 C=1 通常表示左操作数大于或等于右操作数。对于会更新标志的移位指令，若指令有相应定义，C 保存最后移出的位。"
              values:
                - value: 0
                  desc: "含义取决于指令：加法未产生无符号进位；减法或比较发生了借位；或者最后移出的位为 0。"
                - value: 1
                  desc: "含义取决于指令：加法产生无符号进位；减法或比较未发生借位；或者最后移出的位为 1。"
            - name: "V"
              bits: "28"
              desc: "有符号溢出条件码标志。数学结果超出当前运算位宽的二进制补码有符号范围时 V=1，例如两个同号数相加却得到异号结果。V 判断有符号溢出；C 判断无符号进位或借位，两者不能互换。"
              values:
                - value: 0
                  desc: "最近一次更新条件标志的算术结果未超出有符号数范围。"
                - value: 1
                  desc: "最近一次更新条件标志的算术结果超出了有符号数范围。"
            - name: "Q"
              bits: "27"
              desc: "累计饱和标志。支持的饱和算术或 DSP 指令发生饱和或规定的溢出时置 1。Q 是粘滞标志：后续普通指令通常不会自动清零，所以 Q=1 可能来自更早的一条指令；必须按架构规定由软件显式清除。"
              values:
                - value: 0
                  desc: "自上次清除 Q 后，尚未记录到饱和或规定的溢出。"
                - value: 1
                  desc: "自上次清除 Q 后发生过饱和或规定的溢出；触发事件可能来自更早的指令。"
            - name: "GE"
              bits: "19:16"
              desc: "并行 SIMD/DSP 运算的 GE（Greater than or Equal）标志。具体置位条件由指令定义：每个通道可记录有符号“大于或等于”、无符号进位，或无符号减法“无借位”的结果；SEL 等指令按通道读取这些标志来选择结果。"
        - name: "BASEPRI"
          desc: "读取基础优先级，返回基础优先级寄存器的当前值；设置基础优先级：将给定值写入基础优先级寄存器。根据条件设置基础优先级 仅当禁用 BASEPRI 屏蔽或新值增加 BASEPRI 优先级时，才将给定值写入基础优先级寄存器。"
          fields:
            - name: "BASEPRI"
              bits: "7:0"
              desc: "基础优先级屏蔽阈值。0 表示不使用 BASEPRI 屏蔽；非 0 值屏蔽优先级数值大于或等于该阈值的可配置异常，实际有效位数由内核实现决定。"
        - name: "CONTROL"
          desc: "读取控制寄存器，返回控制寄存器的内容；设置控制寄存器：将给定值写入控制寄存器。"
          fields:
            - name: "FPCA"
              bits: "2"
              desc: "浮点上下文活动标志。FPCA=1 表示当前执行上下文已经分配浮点寄存器上下文，异常入栈时可能需要保存浮点状态。"
              values:
                - value: 0
                  desc: "当前执行上下文没有活动的浮点上下文。"
                - value: 1
                  desc: "当前执行上下文存在活动的浮点上下文，异常入栈时可能需要保存浮点状态。"
            - name: "SPSEL"
              bits: "1"
              desc: "线程模式堆栈指针选择。处理模式始终使用 MSP；线程模式下 SPSEL=0 使用 MSP，SPSEL=1 使用 PSP。"
              values:
                - value: 0
                  desc: "线程模式使用 MSP（主堆栈指针）。"
                - value: 1
                  desc: "线程模式使用 PSP（进程堆栈指针）。"
            - name: "nPRIV"
              bits: "0"
              desc: "线程模式特权级控制。nPRIV=0 为特权线程模式，nPRIV=1 为非特权线程模式；处理模式始终为特权模式。"
              values:
                - value: 0
                  desc: "线程模式以特权级运行。"
                - value: 1
                  desc: "线程模式以非特权级运行。"
        - name: "FAULTMASK"
          desc: "读取故障屏蔽，返回故障屏蔽寄存器的当前值；设置故障屏蔽：将给定值写入故障屏蔽寄存器。"
          fields:
            - name: "FM"
              bits: "0"
              desc: "故障屏蔽位。FM=1 时屏蔽除 NMI 之外的所有异常，包括 HardFault，直到软件清除该屏蔽。"
              values:
                - value: 0
                  desc: "FAULTMASK 不屏蔽异常。"
                - value: 1
                  desc: "FAULTMASK 屏蔽除 NMI 之外的所有异常，包括 HardFault。"
        - name: "IPSR"
          desc: "读取 IPSR 寄存器，返回 IPSR 寄存器的内容。"
          fields:
            - name: "ISR"
              bits: "8:0"
              desc: "当前异常号。0 表示线程模式；非 0 值按照当前内核实现的异常号表标识正在处理的异常。"
        - name: "MSP"
          desc: "读取主堆栈指针，返回主堆栈指针的当前值 (MSP)；设置主堆栈指针：将给定值写入主堆栈指针（MSP）。"
          fields:
            - name: "ADDRESS"
              bits: "31:0"
              desc: "主堆栈指针值"
        - name: "PRIMASK"
          desc: "读取优先级掩码 从优先级掩码寄存器返回优先级掩码位的当前状态；设置优先级掩码：将给定值写入优先级掩码寄存器。"
          fields:
            - name: "PM"
              bits: "0"
              desc: "优先级屏蔽位。PM=1 时屏蔽所有具有可配置优先级的异常，但不会屏蔽 NMI 和 HardFault。"
              values:
                - value: 0
                  desc: "PRIMASK 不屏蔽具有可配置优先级的异常。"
                - value: 1
                  desc: "PRIMASK 屏蔽具有可配置优先级的异常；NMI 和 HardFault 仍可响应。"
        - name: "PSP"
          desc: "读取进程堆栈指针，返回进程堆栈指针的当前值 (PSP)；设置进程堆栈指针：将给定值写入进程堆栈指针 (PSP)。"
          fields:
            - name: "ADDRESS"
              bits: "31:0"
              desc: "进程堆栈指针值"
        - name: "xPSR"
          desc: "读取 xPSR 寄存器，返回 xPSR 寄存器的内容。"
          fields:
            - name: "N"
              bits: "31"
              desc: "负数条件码标志。执行会更新条件标志的指令后，N 表示结果按二进制补码解释时的符号：N=1 表示结果为负，N=0 表示结果为非负。它只反映最近一次更新条件标志的指令结果，并不表示任意通用寄存器当前是否为负。"
              values:
                - value: 0
                  desc: "最近一次更新条件标志的结果为非负数。"
                - value: 1
                  desc: "最近一次更新条件标志的结果为负数。"
            - name: "Z"
              bits: "30"
              desc: "零条件码标志。最近一次更新条件标志的指令结果为 0 时 Z=1，否则 Z=0。CMP 等比较指令按减法更新标志但不保存结果，因此 Z=1 通常表示两个操作数相等。"
              values:
                - value: 0
                  desc: "最近一次更新条件标志的结果不为 0；比较结果为不相等。"
                - value: 1
                  desc: "最近一次更新条件标志的结果为 0；比较结果为相等。"
            - name: "C"
              bits: "29"
              desc: "进位/借位条件码标志。加法中 C=1 表示产生无符号进位；减法或 CMP 比较中 C=1 表示未借位、C=0 表示发生借位，因此无符号比较时 C=1 通常表示左操作数大于或等于右操作数。对于会更新标志的移位指令，若指令有相应定义，C 保存最后移出的位。"
              values:
                - value: 0
                  desc: "含义取决于指令：加法未产生无符号进位；减法或比较发生了借位；或者最后移出的位为 0。"
                - value: 1
                  desc: "含义取决于指令：加法产生无符号进位；减法或比较未发生借位；或者最后移出的位为 1。"
            - name: "V"
              bits: "28"
              desc: "有符号溢出条件码标志。数学结果超出当前运算位宽的二进制补码有符号范围时 V=1，例如两个同号数相加却得到异号结果。V 判断有符号溢出；C 判断无符号进位或借位，两者不能互换。"
              values:
                - value: 0
                  desc: "最近一次更新条件标志的算术结果未超出有符号数范围。"
                - value: 1
                  desc: "最近一次更新条件标志的算术结果超出了有符号数范围。"
            - name: "Q"
              bits: "27"
              desc: "累计饱和标志。支持的饱和算术或 DSP 指令发生饱和或规定的溢出时置 1。Q 是粘滞标志：后续普通指令通常不会自动清零，所以 Q=1 可能来自更早的一条指令；必须按架构规定由软件显式清除。"
              values:
                - value: 0
                  desc: "自上次清除 Q 后，尚未记录到饱和或规定的溢出。"
                - value: 1
                  desc: "自上次清除 Q 后发生过饱和或规定的溢出；触发事件可能来自更早的指令。"
            - name: "T"
              bits: "24"
              desc: "异常现场中的 Thumb 状态指示。CMSIS 将该位标为只读；构造或恢复异常栈帧时必须保留架构规定的值，不能把它当作普通模式开关。"
            - name: "GE"
              bits: "19:16"
              desc: "并行 SIMD/DSP 运算的 GE（Greater than or Equal）标志。具体置位条件由指令定义：每个通道可记录有符号“大于或等于”、无符号进位，或无符号减法“无借位”的结果；SEL 等指令按通道读取这些标志来选择结果。"
            - name: "ISR"
              bits: "8:0"
              desc: "当前异常号。0 表示线程模式；非 0 值按照当前内核实现的异常号表标识正在处理的异常。"
            - name: "ICI_IT_2"
              bits: "26:25"
              desc: "异常现场中保存的 ICI/IT 执行状态高段。"
            - name: "ICI_IT_1"
              bits: "15:10"
              desc: "异常现场中保存的 ICI/IT 执行状态低段。"
    - name: "SCnSCB"
      title: "系统控制空间（SCnSCB）"
      access: "内存映射内核外设访问"
      desc: "来自 SCnSCB_Type 的 SCnSCB 寄存器"
      registers:
        - name: "ICTR"
          desc: "中断控制器类型寄存器"
          fields: []
        - name: "ACTLR"
          desc: "辅助控制寄存器"
          fields:
            - name: "DISOOFP"
              bits: "9"
              desc: "SCnSCB ACTLR.DISOOFP 禁用控制。0 表示不禁用，1 表示禁用。"
            - name: "DISFPCA"
              bits: "8"
              desc: "SCnSCB ACTLR.DISFPCA 禁用控制。0 表示不禁用，1 表示禁用。"
            - name: "DISFOLD"
              bits: "2"
              desc: "SCnSCB ACTLR.DISFOLD 禁用控制。0 表示不禁用，1 表示禁用。"
            - name: "DISDEFWBUF"
              bits: "1"
              desc: "SCnSCB ACTLR.DISDEFWBUF 禁用控制。0 表示不禁用，1 表示禁用。"
            - name: "DISMCYCINT"
              bits: "0"
              desc: "SCnSCB ACTLR.DISMCYCINT 禁用控制。0 表示不禁用，1 表示禁用。"
    - name: "SCB"
      title: "系统控制块（SCB）"
      access: "内存映射内核外设访问"
      desc: "来自 SCB_Type 的 SCB 寄存器"
      registers:
        - name: "CPUID"
          desc: "CPUID 基址寄存器"
          fields: []
        - name: "ICSR"
          desc: "中断控制和状态寄存器"
          fields:
            - name: "PENDSVCLR"
              bits: "27"
              values:
                - value: 0
                  desc: "不发出清除请求。"
                - value: 1
                  desc: "写入 1 清除对应的挂起或状态位；读取时可能返回 0。"
            - name: "PENDSTCLR"
              bits: "25"
              values:
                - value: 0
                  desc: "不发出清除请求。"
                - value: 1
                  desc: "写入 1 清除对应的挂起或状态位；读取时可能返回 0。"
            - name: "ISRPREEMPT"
              bits: "23"
              desc: "SCB ICSR.ISRPREEMPT 挂起状态。0 表示未挂起，1 表示挂起。"
              values:
                - value: 0
                  desc: "No interrupt preemption 已挂起。"
                - value: 1
                  desc: "Interrupt preemption 已挂起。"
            - name: "ISRPENDING"
              bits: "22"
              desc: "SCB ICSR.ISRPENDING 挂起状态。0 表示未挂起，1 表示挂起。"
              values:
                - value: 0
                  desc: "No external interrupt 已挂起。"
                - value: 1
                  desc: "At least one external interrupt 已挂起。"
        - name: "VTOR"
          desc: "向量表偏移寄存器"
          fields: []
        - name: "AIRCR"
          desc: "应用中断和复位控制寄存器"
          fields:
            - name: "VECTKEY"
              bits: "31:16"
              source_condition: "Field view: VECTKEY"
              condition: "位域视图：VECTKEY"
            - name: "VECTKEYSTAT"
              bits: "31:16"
              source_condition: "Field view: VECTKEYSTAT"
              condition: "位域视图：VECTKEYSTAT"
            - name: "VECTRESET"
              bits: "0"
              desc: "SCB AIRCR.VECTRESET 置位/挂起请求。写 1 设置对应状态或挂起请求。"
        - name: "SCR"
          desc: "系统控制寄存器"
          fields: []
        - name: "CCR"
          desc: "配置控制寄存器"
          fields:
            - name: "NONBASETHRDENA"
              bits: "0"
              desc: "SCB CCR.NONBASETHRDENA 禁用控制。0 表示不禁用，1 表示禁用。"
        - name: "SHPR[0]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 0）"
        - name: "SHPR[1]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 1）"
        - name: "SHPR[2]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 2）"
        - name: "SHPR[3]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 3）"
        - name: "SHPR[4]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 4）"
        - name: "SHPR[5]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 5）"
        - name: "SHPR[6]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 6）"
        - name: "SHPR[7]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 7）"
        - name: "SHPR[8]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 8）"
        - name: "SHPR[9]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 9）"
        - name: "SHPR[10]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 10）"
        - name: "SHPR[11]"
          desc: "系统处理程序优先级寄存器（4-7、8-11、12-15）（元素 11）"
        - name: "SHCSR"
          desc: "系统处理程序控制和状态寄存器"
          fields:
            - name: "USGFAULTENA"
              bits: "18"
              desc: "USGFAULT 可配置故障处理使能。0 表示该故障不能独立激活并会升级处理，1 表示允许激活对应故障处理程序。"
              values:
                - value: 0
                  desc: "USGFAULT fault handling 已禁用。"
                - value: 1
                  desc: "USGFAULT fault handling 已启用。"
            - name: "BUSFAULTENA"
              bits: "17"
              desc: "BUSFAULT 可配置故障处理使能。0 表示该故障不能独立激活并会升级处理，1 表示允许激活对应故障处理程序。"
              values:
                - value: 0
                  desc: "BUSFAULT fault handling 已禁用。"
                - value: 1
                  desc: "BUSFAULT fault handling 已启用。"
            - name: "MEMFAULTENA"
              bits: "16"
              desc: "MEMFAULT 可配置故障处理使能。0 表示该故障不能独立激活并会升级处理，1 表示允许激活对应故障处理程序。"
              values:
                - value: 0
                  desc: "MEMFAULT fault handling 已禁用。"
                - value: 1
                  desc: "MEMFAULT fault handling 已启用。"
            - name: "SVCALLPENDED"
              bits: "15"
              desc: "SVCALL 异常挂起状态。1 表示对应异常已挂起。"
            - name: "BUSFAULTPENDED"
              bits: "14"
              desc: "BUSFAULT 异常挂起状态。1 表示对应异常已挂起。"
            - name: "MEMFAULTPENDED"
              bits: "13"
              desc: "MEMFAULT 异常挂起状态。1 表示对应异常已挂起。"
            - name: "USGFAULTPENDED"
              bits: "12"
              desc: "USGFAULT 异常挂起状态。1 表示对应异常已挂起。"
            - name: "SYSTICKACT"
              bits: "11"
              desc: "SYSTICK 异常活动状态。1 表示对应异常当前处于活动状态。"
              values:
                - value: 0
                  desc: "SYSTICK exception 未活动。"
                - value: 1
                  desc: "SYSTICK exception 处于活动状态。"
            - name: "PENDSVACT"
              bits: "10"
