              desc: "HVC 或 SVC 指令的立即数位域的值。对于 HVC 指令，这是所发出指令的 imm16 位域的值。对于 SVC 指令：\n如果指令是无条件的，则：对于T32指令，该位域是从指令的imm8 位域零扩展的。对于A32指令，该位域是指令的imm24 位域的低16 位。对于T32指令，该位域是从指令的imm8 位域零扩展的。对于A32指令，该位域是指令的imm24 位域的低16 位。如果指令是有条件的，则该位域为 UNKNOWN。"
              condition: "当HVC或SVC指令执行出现异常时"
              reset_info: "温复位；AU"
            - name: "CV"
              bits: "24"
              source_condition: "When Exception from SMC instruction execution"
              desc: "条件代码有效。该位的可能值为：\n当A32指令被捕获时，CV被设置为1。当T32指令被捕获时，无论CV被设置为1还是 IMPLEMENTATION DEFINED，设置为0。更多信息请参见COND位域的描述。仅当CCKNOWNPASS为1时该位域才有效，否则为 RES0。"
              condition: "SMC指令执行异常时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "COND 位域无效。"
                - value: "0b1"
                  desc: "COND 位域有效。"
            - name: "COND"
              bits: "23:20"
              source_condition: "When Exception from SMC instruction execution"
              desc: "捕获指令的条件代码。当 A32 指令被捕获时，CV 被设置为 1 并且：\n如果指令是有条件的，则 COND 设置为指令中的条件代码位域值。如果指令是无条件的，则 COND 设置为 0b1110。已知可以通过条件代码检查的条件 A32 指令可以通过以下任一方式呈现：\nCOND 设置为 0b1110，该值表示无条件。将COND值保存在指令中。当T32指令被捕获时，IMPLEMENTATION DEFINED 是否：\nCV 设置为 0，COND 设置为 UNKNOWN 值。软件必须检查 SPSR.IT 位域以确定 T32 指令的条件（如果有）。 CV 设置为 1，COND 设置为应用于指令的条件的条件代码。对于 T32 和 A32 指令的实现，仅当指令通过其条件代码检查时，才会在捕获的条件指令上发生异常，这些定义意味着当 CV 设置为 1 时，IMPLEMENTATION DEFINED 是否COND 位域设置为 0b1110，或应用于指令的任何条件的值。仅当CCKNOWNPASS为1时该位域才有效，否则为 RES0。"
              condition: "SMC指令执行异常时"
              reset_info: "温复位；AU"
            - name: "CCKNOWNPASS"
              bits: "19"
              source_condition: "When Exception from SMC instruction execution"
              desc: "指示指令是否可能未通过其条件代码检查。"
              condition: "SMC指令执行异常时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "该指令是无条件的，或者是有条件的并且通过了条件代码检查。"
                - value: "0b1"
                  desc: "该指令是有条件的，并且可能未通过条件代码检查。"
            - name: "RES0"
              bits: "18:0"
              source_condition: "When Exception from SMC instruction execution"
              desc: "保留，RES0。"
              condition: "SMC指令执行异常时"
            - name: "RES0"
              bits: "24:11"
              source_condition: "When Exception from a Prefetch Abort"
              desc: "保留，RES0。"
              condition: "当预取中止出现异常时"
            - name: "FnV"
              bits: "10"
              source_condition: "When Exception from a Prefetch Abort"
              desc: "FAR 对于同步外部中止（转换表遍历上的同步外部中止除外）无效。仅当 IFSC 代码为 0b010000 时，此位域才有效。对于所有其他中止，它是 RES0。"
              condition: "当预取中止出现异常时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "HIFAR有效。"
                - value: "0b1"
                  desc: "HIFAR 无效，并且包含 UNKNOWN 值。"
            - name: "EA"
              bits: "9"
              source_condition: "When Exception from a Prefetch Abort"
              desc: "外部中止类型。该位可以提供外部中止的 IMPLEMENTATION DEFINED 分类。对于外部中止以外的任何中止，该位返回值 0。"
              condition: "当预取中止出现异常时"
              reset_info: "温复位；AU"
            - name: "RES0"
              bits: "8"
              source_condition: "When Exception from a Prefetch Abort"
              desc: "保留，RES0。"
              condition: "当预取中止出现异常时"
            - name: "S1PTW"
              bits: "7"
              source_condition: "When Exception from a Prefetch Abort"
              desc: "对于第 2 阶段故障，指示该故障是否是针对第 1 阶段转换表遍历进行的访问的第 2 阶段故障：\n对于第 2 阶段故障以外的任何中止，该位为 RES0。"
              condition: "当预取中止出现异常时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "故障不在第 1 阶段转换表行走的第 2 阶段转换上。"
                - value: "0b1"
                  desc: "第 1 阶段转换表遍历的访问的第 2 阶段转换出现故障。"
            - name: "RES0"
              bits: "6"
              source_condition: "When Exception from a Prefetch Abort"
              desc: "保留，RES0。"
              condition: "当预取中止出现异常时"
            - name: "IFSC"
              bits: "5:0"
              source_condition: "When Exception from a Prefetch Abort"
              desc: "指令故障状态代码。该位域的可能值有：\n所有其他值均被保留。有关与故障关联的查找级别的更多信息，请参阅“长描述符转换表查找时与 MMU 故障关联的级别”。如果设置了 S1PTW 位，则级别指的是正在地址转换第 1 阶段地址转换行走的 stage2 地址转换的级别。"
              condition: "当预取中止出现异常时"
              reset_info: "温复位；AU"
              values:
                - value: "0b000000"
                  desc: "转换表基址寄存器中的地址大小错误。"
                - value: "0b000001"
                  desc: "地址大小错误，级别 1。"
                - value: "0b000010"
                  desc: "地址大小错误，级别 2。"
                - value: "0b000011"
                  desc: "地址大小错误，级别 3。"
                - value: "0b000101"
                  desc: "地址转换错误，1 级。"
                - value: "0b000110"
                  desc: "地址转换错误，2 级。"
                - value: "0b000111"
                  desc: "地址转换错误，3 级。"
                - value: "0b001001"
                  desc: "访问标志故障，级别 1。"
                - value: "0b001010"
                  desc: "访问标志故障，级别 2。"
                - value: "0b001011"
                  desc: "访问标志故障，级别 3。"
                - value: "0b001101"
                  desc: "权限错误，级别 1。"
                - value: "0b001110"
                  desc: "权限错误，级别 2。"
                - value: "0b001111"
                  desc: "权限错误，级别 3。"
                - value: "0b010000"
                  desc: "同步外部中止，不在转换表上行走。"
                - value: "0b010101"
                  desc: "转换表行走上的同步外部中止，级别 1。"
                - value: "0b010110"
                  desc: "转换表行走上的同步外部中止，级别 2。"
                - value: "0b010111"
                  desc: "转换表行走上的同步外部中止，级别 3。"
                - value: "0b011000"
                  source_condition: "When FEAT_RAS is not implemented"
                  desc: "内存访问时出现同步奇偶校验或 ECC 错误，而不是转换表遍历时出现错误。"
                  condition: "当 FEAT_RAS 未实现时"
                - value: "0b011101"
                  source_condition: "When FEAT_RAS is not implemented"
                  desc: "转换表遍历上的内存访问出现同步奇偶校验或 ECC 错误，级别 1。"
                  condition: "当 FEAT_RAS 未实现时"
                - value: "0b011110"
                  source_condition: "When FEAT_RAS is not implemented"
                  desc: "转换表遍历上的内存访问出现同步奇偶校验或 ECC 错误，级别 2。"
                  condition: "当 FEAT_RAS 未实现时"
                - value: "0b011111"
                  source_condition: "When FEAT_RAS is not implemented"
                  desc: "转换表遍历上的内存访问出现同步奇偶校验或 ECC 错误，级别 3。"
                  condition: "当 FEAT_RAS 未实现时"
                - value: "0b100010"
                  desc: "调试异常。"
                - value: "0b110000"
                  desc: "TLB 冲突中止。"
            - name: "RES0"
              bits: "24:0"
              source_condition: "When Exception from an Illegal state or PC alignment fault"
              desc: "保留，RES0。"
              condition: "当异常状态为非法或PC对齐错误时"
            - name: "ISV"
              bits: "24"
              source_condition: "When Exception from a Data Abort"
              desc: "指令综合征有效。指示ISS[23:14]中的综合征信息是否有效。对于除第 2 阶段地址转换生成的数据中止异常之外的所有故障，该位均为 0，对于这些故障，以下所有内容都适用于生成数据中止异常的指令：\n该指令为 LDR、LDA、LDRT、LDRSH、LDRSHT、LDRH、 LDAH、LDRHT、LDRSB、LDRSBT、LDRB、LDAB、LDRBT、STR、STL、STRT、STRH、STLH、STRHT、STRB、STLB 或 STRBT 指令。该指令不执行寄存器写回。该指令未使用 PC 作为源或目标寄存器。对于这些情况，如果 ISV 为 UNKNOWN\n异常是在内存访问模式下的调试状态下生成的，如“内存访问模式下的数据中止异常”中所述，否则指示 ISS[23:14] 是否持有有效的综合征。在A32指令集中，LDR*T和STR*T指令始终执行寄存器写回，因此永远不会返回有效指令syndrome.WhenFEAT_RAS实现时，对于任何同步外部中止，ISV 为 0。 ISV 在第 1 阶段转换表行走的第 2 阶段中止时设置为 0。当 FEAT_RAS 未实现时，无论 ISV 在第 2 阶段转换表遍历的同步外部中止时设置为 1 还是 0，都由 IMPLEMENTATION DEFINED 决定。"
              condition: "当数据中止异常时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "无有效指导综合征。 ISS[23:14]是 RES0。"
                - value: "0b1"
                  desc: "ISS[23:14]持有有效指令综合征。"
            - name: "SAS"
              bits: "23:22"
              source_condition: "When Exception from a Data Abort"
              desc: "综合征访问大小。当ISV为1时，表示故障操作尝试访问的大小。当ISV的值为 UNKNOWN 时，该位域为 UNKNOWN。当ISV的值为0时，该位域为 RES0。"
              condition: "当数据中止异常时"
              reset_info: "温复位；AU"
              values:
                - value: "0b00"
                  desc: "字节"
                - value: "0b01"
                  desc: "半字"
                - value: "0b10"
                  desc: "词"
                - value: "0b11"
                  desc: "双字"
            - name: "SSE"
              bits: "21"
              source_condition: "When Exception from a Data Abort"
              desc: "综合征标志延长。当ISV为1时，对于字节、半字或字加载操作，指示数据项是否必须进行符号扩展。对于这些情况，该位的可能值为：\n对于所有其他操作，该位为 0。当 ISV 的值为 UNKNOWN 时，该位域为 UNKNOWN。当ISV的值为0时，该位域为 RES0。"
              condition: "当数据中止异常时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "不需要符号扩展。"
                - value: "0b1"
                  desc: "数据项必须进行符号扩展。"
            - name: "RES0"
              bits: "20"
              source_condition: "When Exception from a Data Abort"
              desc: "保留，RES0。"
              condition: "当数据中止异常时"
            - name: "SRT"
              bits: "19:16"
              source_condition: "When Exception from a Data Abort"
              desc: "综合征登记转移。当ISV为1时，错误指令的Rt操作数的寄存器号。当ISV的值为 UNKNOWN 时，该位域为 UNKNOWN。当ISV的值为0时，该位域为 RES0。"
              condition: "当数据中止异常时"
              reset_info: "温复位；AU"
            - name: "RES0"
              bits: "15"
              source_condition: "When Exception from a Data Abort"
              desc: "保留，RES0。"
              condition: "当数据中止异常时"
            - name: "AR"
              bits: "14"
              source_condition: "When Exception from a Data Abort"
              desc: "获取/释放。当ISV为1时，该位的可能值为：\n当ISV的值为 UNKNOWN 时，该位域为 UNKNOWN。当ISV的值为0时，该位域为 RES0。"
              condition: "当数据中止异常时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "指令没有获取/释放语义。"
                - value: "0b1"
                  desc: "指令确实具有获取/释放语义。"
            - name: "RES0"
              bits: "13:12"
              source_condition: "When Exception from a Data Abort"
              desc: "保留，RES0。"
              condition: "当数据中止异常时"
            - name: "AET"
              bits: "11:10"
              source_condition: "When Exception from a Data Abort；When FEAT_RAS is implemented"
              desc: "异步错误类型。当DFSC为0b010001时，描述发生SError异常后的PE错误状态。在同步数据中止异常时，该位域为 RES0。如果多个错误被视为单个 SError 异常，则会报告总体 PE 错误状态。软件可以使用此信息来确定可以进行哪些恢复。恢复软件还必须检查任何实现的故障记录，以确定error.When FEAT_RAS 未实现时，或者当 DFSC 不是 0b010001 时：\n位[11]为 RES0。位[10]构成FnV位域。"
              condition: "当数据中止异常时；当执行FEAT_RAS时"
              reset_info: "温复位；AU"
              values:
                - value: "0b00"
                  desc: "无法收容（UC）。"
                - value: "0b01"
                  desc: "不可恢复状态（UEU）。"
                - value: "0b10"
                  desc: "可重启状态（UEO）。"
                - value: "0b11"
                  desc: "可恢复状态（UER）。"
            - name: "RES0"
              bits: "11:10"
              source_condition: "When Exception from a Data Abort；Otherwise"
              desc: "保留，RES0。"
              condition: "当数据中止异常时；否则"
            - name: "FnV"
              bits: "11:10"
              source_condition: "When Exception from a Data Abort；Otherwise"
              desc: "FAR 对于同步外部中止（转换表遍历上的同步外部中止除外）无效。当FEAT_RAS未实现时，仅当DFSC为0b010000时，该位域才有效。对于所有其他中止，它是 RES0。当实现FEAT_RAS时：\n如果DFSC为0b010000，则该位域有效。如果DFSC为0b010001，则该位构成AET位域的一部分，成为AET[0]。对于所有其他中止，该位域为 RES0。"
              condition: "当数据中止异常时；否则"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "HDFAR 有效。"
                - value: "0b1"
                  desc: "HDFAR 无效，并且包含 UNKNOWN 值。"
            - name: "EA"
              bits: "9"
              source_condition: "When Exception from a Data Abort"
              desc: "外部中止类型。该位可以提供外部中止的 IMPLEMENTATION DEFINED 分类。对于外部中止以外的任何中止，该位返回值 0。"
              condition: "当数据中止异常时"
              reset_info: "温复位；AU"
            - name: "CM"
              bits: "8"
              source_condition: "When Exception from a Data Abort"
              desc: "缓存维护。对于同步故障，识别来自高速缓存维护或地址转换指令的故障。对于同步故障，该位的可能值为：\n对于异步数据中止异常，该位为 0。"
              condition: "当数据中止异常时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "故障不是由高速缓存维护或地址转换指令生成的。"
                - value: "0b1"
                  desc: "由高速缓存维护或地址转换指令生成的故障。"
            - name: "S1PTW"
              bits: "7"
              source_condition: "When Exception from a Data Abort"
              desc: "对于第 2 阶段故障，指示该故障是否是针对第 1 阶段转换表遍历进行的访问的第 2 阶段故障：\n对于第 2 阶段故障以外的任何中止，该位为 RES0。"
              condition: "当数据中止异常时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "故障不在第 1 阶段转换表行走的第 2 阶段转换上。"
                - value: "0b1"
                  desc: "第 1 阶段转换表遍历的访问的第 2 阶段转换出现故障。"
            - name: "WnR"
              bits: "6"
              source_condition: "When Exception from a Data Abort"
              desc: "写不读。指示同步中止是由写指令还是读指令引起的。对于缓存维护和地址转换指令的故障，该位始终返回值 1。 在异步数据中止异常时：\n当FEAT_RAS未实现时，该位为 UNKNOWN。当实现FEAT_RAS时，该位为 RES0。"
              condition: "当数据中止异常时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "由读指令引起的中止。"
                - value: "0b1"
                  desc: "由写指令引起的中止。"
            - name: "DFSC"
              bits: "5:0"
              source_condition: "When Exception from a Data Abort"
              desc: "数据故障状态代码。该位域的可能值有：\n所有其他值均被保留。有关与故障关联的查找级别的更多信息，请参阅“长描述符转换表查找时与 MMU 故障关联的级别”。如果设置了 S1PTW 位，则级别指的是正在地址转换第 1 阶段地址转换行走的 stage2 地址转换的级别。"
              condition: "当数据中止异常时"
              reset_info: "温复位；AU"
              values:
                - value: "0b000000"
                  desc: "转换表基址寄存器中的地址大小错误。"
                - value: "0b000001"
                  desc: "地址大小错误，级别 1。"
                - value: "0b000010"
                  desc: "地址大小错误，级别 2。"
                - value: "0b000011"
                  desc: "地址大小错误，级别 3。"
                - value: "0b000101"
                  desc: "地址转换错误，1 级。"
                - value: "0b000110"
                  desc: "地址转换错误，2 级。"
                - value: "0b000111"
                  desc: "地址转换错误，3 级。"
                - value: "0b001001"
                  desc: "访问标志故障，级别 1。"
                - value: "0b001010"
                  desc: "访问标志故障，级别 2。"
                - value: "0b001011"
                  desc: "访问标志故障，级别 3。"
                - value: "0b001101"
                  desc: "权限错误，级别 1。"
                - value: "0b001110"
                  desc: "权限错误，级别 2。"
                - value: "0b001111"
                  desc: "权限错误，级别 3。"
                - value: "0b010000"
                  desc: "同步外部中止，不在转换表上行走。"
                - value: "0b010001"
                  desc: "异步SError异常。"
                - value: "0b010101"
                  desc: "转换表行走上的同步外部中止，级别 1。"
                - value: "0b010110"
                  desc: "转换表行走上的同步外部中止，级别 2。"
                - value: "0b010111"
                  desc: "转换表行走上的同步外部中止，级别 3。"
                - value: "0b011000"
                  source_condition: "When FEAT_RAS is not implemented"
                  desc: "内存访问时出现同步奇偶校验或 ECC 错误，而不是转换表遍历时出现错误。"
                  condition: "当 FEAT_RAS 未实现时"
                - value: "0b011001"
                  source_condition: "When FEAT_RAS is not implemented"
                  desc: "异步 SError 异常，来自内存访问时的奇偶校验或 ECC 错误。"
                  condition: "当 FEAT_RAS 未实现时"
                - value: "0b011101"
                  source_condition: "When FEAT_RAS is not implemented"
                  desc: "转换表遍历上的内存访问出现同步奇偶校验或 ECC 错误，级别 1。"
                  condition: "当 FEAT_RAS 未实现时"
                - value: "0b011110"
                  source_condition: "When FEAT_RAS is not implemented"
                  desc: "转换表遍历上的内存访问出现同步奇偶校验或 ECC 错误，级别 2。"
                  condition: "当 FEAT_RAS 未实现时"
                - value: "0b011111"
                  source_condition: "When FEAT_RAS is not implemented"
                  desc: "转换表遍历上的内存访问出现同步奇偶校验或 ECC 错误，级别 3。"
                  condition: "当 FEAT_RAS 未实现时"
                - value: "0b100001"
                  desc: "对准故障。"
                - value: "0b100010"
                  desc: "调试异常。"
                - value: "0b110000"
                  desc: "TLB 冲突中止。"
                - value: "0b110100"
                  desc: "IMPLEMENTATION DEFINED 故障（锁定）。"
                - value: "0b110101"
                  desc: "IMPLEMENTATION DEFINED 故障（不支持独占访问）。"
        - name: "HSTR"
          desc: "控制在 EL1 或更低位置对 coproc == 0b1111 编码空间中的系统寄存器陷入 非安全访问的 Hyp 模式："
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "RES0"
              bits: "31:16,14,4"
              desc: "保留，RES0。"
            - name: "T<n>"
              bits: "15,13:5,3:0"
              desc: "其余位域控制是否使用 MCR 或 MRC 指令进行非安全 EL0 和 EL1 访问，使用 EC 综合征值 0x03 和 MCRR 报告或MRRC指令，使用EC综合征值0x04报告，到coproc == 0b1111编码空间中的系统寄存器陷入 Hyp模式：\n例如，当 HSTR.T7 为 1 时，对于非安全 EL1 执行的指令：\ncoproc 设置为 0b1111 且 <CRn> 设置为 c7 的 MCR 或 MRC 指令将被捕获为 Hyp 模式。 coproc 设置为 0b1111 且 <CRm> 设置为 c7 的 MCRR 或 MRRC 指令将被捕获为 Hyp 模式。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；0x0000；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "此控制对对系统寄存器的非安全 EL0 或 EL1 访问没有影响。"
                - value: "0b1"
                  desc: "任何带有 coproc == 0b1111 且 CRn == <n> 的非安全 EL1 MCR 或 MRC 访问都会陷入 Hyp 模式。仅当此位域的值为 0 时访问不是 UNDEFINED 时，具有这些值的非安全 EL0 MCR 或 MRC 访问才会陷入 Hyp 模式。 MCRR 或 MRRC 访问 coproc == 0b1111 且 CRm == <n> 陷入 Hyp 模式。仅当该位域的值为 0 时访问不是 UNDEFINED 时，具有这些值的非安全 EL0 MCRR 或 MRRC 访问才会陷入 Hyp 模式。"
        - name: "HTPIDR"
          desc: "提供一个位置，在 Hyp 模式下运行的软件可以存储线程标识信息，这些信息对于在 EL0 或 EL1 上执行的非安全软件不可见，用于管理程序管理目的。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "TID"
              bits: "31:0"
              desc: "线程 ID 线程 ID。在此异常级别运行的软件存储的线程标识信息。"
              reset_info: "温复位；AU"
        - name: "HTRFCR"
          desc: "为跟踪提供 EL2 控件。"
          condition: "当实现 FEAT_AA32EL2 且实现 FEAT_TRF 时"
          fields:
            - name: "RES0"
              bits: "31:7"
              desc: "保留，RES0。"
            - name: "TS"
              bits: "6:5"
              desc: "时间戳控制。控制用于跟踪时间戳的时基。当 SelfHostedTraceEnabled() == FALSE 时，该位域被忽略。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'00'；温复位；否则；AU"
              values:
                - value: "0b00"
                  desc: "时间戳由TRFCR.TS控制。"
                - value: "0b01"
                  desc: "虚拟时间戳。跟踪的时间戳是物理计数器值减去 CNTVOFF 的值。"
                - value: "0b11"
                  desc: "物理时间戳。跟踪的时间戳是物理计数器值。"
            - name: "RES0"
              bits: "4"
              desc: "保留，RES0。"
            - name: "CX"
              bits: "3"
              desc: "VMID 跟踪启用。当 SelfHostedTraceEnabled() == FALSE 时，该位域被忽略。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "不允许 VMID 跟踪。"
                - value: "0b1"
                  desc: "允许 VMID 跟踪。"
            - name: "RES0"
              bits: "2"
              desc: "保留，RES0。"
            - name: "E2TRE"
              bits: "1"
              desc: "EL2 跟踪启用。当 SelfHostedTraceEnabled() == FALSE 时，该位域被忽略。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "EL2 禁止跟踪。"
                - value: "0b1"
                  desc: "EL2 允许跟踪。"
            - name: "E0HTRE"
              bits: "0"
              desc: "EL0 跟踪使能。如果满足以下任一条件，则忽略此位域：\nPE 处于安全状态。 SelfHostedTraceEnabled() == FALSE。 HCR.TGE == 0。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "当 HCR.TGE == 1 时，在 EL0 处禁止跟踪。"
                - value: "0b1"
                  desc: "当 HCR.TGE == 1 时，允许在 EL0 处进行跟踪。"
        - name: "HVBAR"
          desc: "保存进入 Hyp 模式的任何异常的向量基地址。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "VBA"
              bits: "31:5"
              desc: "向量基地址 向量基地址。进入此异常级别的异常的异常向量基地址的位[31:5]。异常向量的位[4:0]是异常偏移量。"
              reset_info: "温复位；AU"
            - name: "RES0"
              bits: "4:0"
              desc: "保留，RES0。"
        - name: "VMPIDR"
          desc: "保存虚拟化多处理器 ID 的值。这是由非安全 EL1 读取 MPIDR 返回的值，在多处理器系统中，它提供了额外的 PE 识别系统。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "M"
              bits: "31"
              desc: "指示此实现是否包含 Armv7 多处理扩展引入的功能。"
              values:
                - value: "0b0"
                  desc: "此实现不包括 Armv7 多处理扩展功能。"
                - value: "0b1"
                  desc: "此实现包括 Armv7 多处理扩展功能。"
            - name: "U"
              bits: "30"
              desc: "表示单处理器系统，与多处理器系统中的 PE 0 不同。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；其他位域AArch32:MPIDR.U；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "处理器是多处理器系统的一部分。"
                - value: "0b1"
                  desc: "处理器是单处理器系统的一部分。"
            - name: "RES0"
              bits: "29:25"
              desc: "保留，RES0。"
            - name: "MT"
              bits: "24"
              desc: "指示最低关联性级别是否由使用多线程类型方法实现的逻辑 PE 组成。有关亲和力级别的更多信息，请参阅 Aff0 的描述。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；其他位域AArch32:MPIDR.MT；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "PE 在最低亲和力水平下的性能很大程度上是独立的。"
                - value: "0b1"
                  desc: "PE 在最低亲和力水平下的性能是非常相互依赖的。"
            - name: "Aff2"
              bits: "23:16"
              desc: "亲和度级别2。更多信息请参见Aff0的描述。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；其他位域AArch32:MPIDR.Aff2；温复位；否则；AU"
            - name: "Aff1"
              bits: "15:8"
              desc: "亲和度级别1。更多信息请参见Aff0的描述。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；其他位域AArch32:MPIDR.Aff1；温复位；否则；AU"
            - name: "Aff0"
              bits: "7:0"
              desc: "亲和性级别 0。MPIDR.{Aff2、Aff1、Aff0} 或 MPIDR_EL1.{[Aff3每个PE的位域集在整个系统内必须是唯一的。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；其他位域AArch32:MPIDR.Aff0；温复位；否则；AU"
        - name: "VPIDR"
          desc: "保存虚拟化处理器 ID 的值。这是 MIDR 的非安全 EL1 读取返回的值。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "Implementer"
              bits: "31:24"
              desc: "实现者代码。该位域必须包含 Arm 分配的实现者代码。 Arm 可以分配本手册中未发布的代码。所有未由 Arm 分配的值均被保留且不得使用。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；其他位域AArch32:MIDR.Implementer；温复位；否则；AU"
              values:
                - value: "0x00"
                  desc: "保留供软件使用。"
                - value: "0x41"
                  desc: "手臂有限公司。"
                - value: "0x42"
                  desc: "博通公司。"
                - value: "0x43"
                  desc: "卡维姆公司"
                - value: "0x44"
                  desc: "数字设备公司。"
                - value: "0x46"
                  desc: "富士通有限公司"
                - value: "0x49"
                  desc: "英飞凌科技AG。"
                - value: "0x4D"
                  desc: "摩托罗拉或飞思卡尔半导体公司"
                - value: "0x4E"
                  desc: "NVIDIA 公司。"
                - value: "0x50"
                  desc: "应用微电路公司。"
                - value: "0x51"
                  desc: "高通公司"
                - value: "0x56"
                  desc: "Marvell 国际有限公司"
                - value: "0x69"
                  desc: "英特尔公司。"
                - value: "0xC0"
                  desc: "安培计算。"
            - name: "Variant"
              bits: "23:20"
              desc: "IMPLEMENTATION DEFINED 变体编号。通常，此位域用于区分不同的产品变体或产品的主要修订版。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；其他位域AArch32:MIDR.Variant；温复位；否则；AU"
            - name: "Architecture"
              bits: "19:16"
              desc: "架构版本。所有其他值均被保留。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；其他位域AArch32:MIDR.Architecture；温复位；否则；AU"
              values:
                - value: "0b1111"
                  desc: "架构特性在 ID_* 寄存器中单独标识。"
            - name: "PartNum"
              bits: "15:4"
              desc: "设备的 IMPLEMENTATION DEFINED 主要部件号。在 Arm 实现的处理器上，如果主要部件编号的前四位是 0x0 或 0x7，则变体和架构的编码方式不同。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；其他位域AArch32:MIDR.PartNum；温复位；否则；AU"
            - name: "Revision"
              bits: "3:0"
              desc: "设备的 IMPLEMENTATION DEFINED 修订号。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；其他位域AArch32:MIDR.Revision；温复位；否则；AU"
