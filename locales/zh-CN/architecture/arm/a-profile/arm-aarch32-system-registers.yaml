                  desc: "EL0 写入软件增量寄存器被禁用，除非由 PMUSERENR.EN 启用。"
                - value: "0b1"
                  desc: "EL0 写入软件增量寄存器被启用，除非被另一个控制捕获。"
            - name: "EN"
              bits: "0"
              desc: "使能。启用 EL0 对 PMU 系统寄存器的读/写访问。受此控制影响的寄存器访问是：\nMRC 或 MCR 访问 PMCCFILTR、PMCCNTR、PMCNTENCLR、PMCNTENSET、PMCR、PMEVCNTR<n>、PMEVTYPER<n>、PMOVSR、PMOVSSET、 PMSELR、PMXEVCNTR 和 PMXEVTYPER。 MRC 读取以下寄存器：PMCEID0 和 PMCEID1。如果实现 FEAT_PMUv3p1，则为 PMCEID2 和 PMCEID3。 MCR 写入 PMSWINC。 MRRC 或 MCRR 访问 PMCCNTR。当被捕获时，读取和写入都是UNDEFINED。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "EL0 访问指定的 PMU 系统寄存器将被捕获，除非由 PMUSERENR 启用。{ER,CR,SW}。"
                - value: "0b1"
                  desc: "EL0 对指定 PMU 系统寄存器的访问被启用，除非被另一个控制捕获。"
        - name: "PMXEVCNTR"
          desc: "读取或写入所选事件计数器的值 PMEVCNTR<n>。 PMSELR.SEL 确定选择哪个事件计数器。"
          condition: "当实现 FEAT_AA32 并实现 FEAT_PMUv3 时"
          fields:
            - name: "PMEVCNTR<n>"
              bits: "31:0"
              desc: "所选事件计数器的值 PMEVCNTR<n>，其中 n 是存储在 PMSELR.SEL 中的值。如果实现 FEAT_PMUv3p5，则事件计数器为 64 位，并且在 AArch32 状态下只能访问事件计数器的最低有效部分：\n从计数器的 PMXEVCNTR 返回位 [31:0] 读取。写入 PMXEVCNTR 更新位 [31:0] 并保持位 [63:32] 不变。无法直接从 AArch32 状态访问位 [63:32]。如果实现不支持AArch64，则不需要实现位[63:32]。如果未实现FEAT_PMUv3p5，则事件计数器为32 位。"
              reset_info: "温复位；AU"
        - name: "PMXEVTYPER"
          desc: "当 PMSELR.SEL 选择事件计数器时，将访问 PMEVTYPER<n> 寄存器。当PMSELR.SEL选择周期计数器时，将访问PMCCFILTR。"
          condition: "当实现 FEAT_AA32 并实现 FEAT_PMUv3 时"
          fields:
