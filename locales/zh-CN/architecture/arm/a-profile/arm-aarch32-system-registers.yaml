                - value: "0b0"
                  desc: "使用短描述符转换表格式。"
                - value: "0b1"
                  desc: "使用长描述符转换表格式。"
            - name: "RES0"
              bits: "8:4"
              source_condition: "When TTBCR.EAE == '0'；Layout: TTBCR.EAE==0"
              desc: "保留，RES0。"
              condition: "当TTBCR.EAE == '0'时；布局：TTBCR.EAE==0"
            - name: "RES0"
              bits: "31:17"
              source_condition: "When TTBCR.EAE == '1'；Layout: TTBCR.EAE==1"
              desc: "保留，RES0。"
              condition: "当TTBCR.EAE == '1'时；布局：TTBCR.EAE==1"
            - name: "FnV"
              bits: "16"
              source_condition: "When TTBCR.EAE == '1'；Layout: TTBCR.EAE==1"
              desc: "FAR 对于同步外部中止（转换表遍历上的同步外部中止除外）无效。该位域仅对同步外部中止有效，转换表遍历上的同步外部中止除外。对于所有其他预取中止异常，它是 RES0。"
              condition: "当TTBCR.EAE == '1'时；布局：TTBCR.EAE==1"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "IFAR 有效。"
                - value: "0b1"
                  desc: "IFAR 无效，并保存 UNKNOWN 值。"
            - name: "RES0"
              bits: "15:13"
              source_condition: "When TTBCR.EAE == '1'；Layout: TTBCR.EAE==1"
              desc: "保留，RES0。"
              condition: "当TTBCR.EAE == '1'时；布局：TTBCR.EAE==1"
            - name: "ExT"
              bits: "12"
              source_condition: "When TTBCR.EAE == '1'；Layout: TTBCR.EAE==1"
              desc: "外部中止类型。该位可用于提供外部中止的 IMPLEMENTATION DEFINED 分类。在不提供任何外部中止分类的实现中，该位是 RES0。对于外部中止以外的中止，该位始终返回 0。"
              condition: "当TTBCR.EAE == '1'时；布局：TTBCR.EAE==1"
              reset_info: "温复位；AU"
            - name: "RES0"
              bits: "11:10"
              source_condition: "When TTBCR.EAE == '1'；Layout: TTBCR.EAE==1"
              desc: "保留，RES0。"
              condition: "当TTBCR.EAE == '1'时；布局：TTBCR.EAE==1"
            - name: "LPAE"
              bits: "9"
              source_condition: "When TTBCR.EAE == '1'；Layout: TTBCR.EAE==1"
              desc: "在发生数据中止异常时，该位设置如下：\n硬件不会解释该位来确定内存系统的行为，因此软件可以将该位设置为 0 或 1，而不影响操作。"
              condition: "当TTBCR.EAE == '1'时；布局：TTBCR.EAE==1"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "使用短描述符转换表格式。"
                - value: "0b1"
                  desc: "使用长描述符转换表格式。"
            - name: "RES0"
              bits: "8:6"
              source_condition: "When TTBCR.EAE == '1'；Layout: TTBCR.EAE==1"
              desc: "保留，RES0。"
              condition: "当TTBCR.EAE == '1'时；布局：TTBCR.EAE==1"
            - name: "STATUS"
              bits: "5:0"
              source_condition: "When TTBCR.EAE == '1'；Layout: TTBCR.EAE==1"
              desc: "故障状态位。该位域的可能值有：\n所有其他值均被保留。当实现FEAT_RAS时，0b011000、0b011101、0b011110和0b011111被保留。有关与故障关联的查找级别的更多信息，请参阅“长描述符转换表查找中与 MMU 故障关联的级别”。"
              condition: "当TTBCR.EAE == '1'时；布局：TTBCR.EAE==1"
              reset_info: "温复位；AU"
              values:
                - value: "0b000000"
                  desc: "转换表基址寄存器中的地址大小错误。"
                - value: "0b000001"
                  desc: "地址大小错误，级别 1。"
                - value: "0b000010"
                  desc: "地址大小错误，级别 2。"
                - value: "0b000011"
                  desc: "地址大小错误，级别 3。"
                - value: "0b000101"
                  desc: "地址转换错误，1 级。"
                - value: "0b000110"
                  desc: "地址转换错误，2 级。"
                - value: "0b000111"
                  desc: "地址转换错误，3 级。"
                - value: "0b001001"
                  desc: "访问标志故障，级别 1。"
                - value: "0b001010"
                  desc: "访问标志故障，级别 2。"
                - value: "0b001011"
                  desc: "访问标志故障，级别 3。"
                - value: "0b001101"
                  desc: "权限错误，级别 1。"
                - value: "0b001110"
                  desc: "权限错误，级别 2。"
                - value: "0b001111"
                  desc: "权限错误，级别 3。"
                - value: "0b010000"
                  desc: "同步外部中止，不在转换表上行走。"
                - value: "0b010101"
                  desc: "转换表行走上的同步外部中止，级别 1。"
                - value: "0b010110"
                  desc: "转换表行走上的同步外部中止，级别 2。"
                - value: "0b010111"
                  desc: "转换表行走上的同步外部中止，级别 3。"
                - value: "0b011000"
                  source_condition: "When FEAT_RAS is not implemented"
                  desc: "内存访问时出现同步奇偶校验或 ECC 错误，而不是转换表遍历时出现错误。"
                  condition: "当 FEAT_RAS 未实现时"
                - value: "0b011101"
                  source_condition: "When FEAT_RAS is not implemented"
                  desc: "转换表遍历上的内存访问出现同步奇偶校验或 ECC 错误，级别 1。"
                  condition: "当 FEAT_RAS 未实现时"
                - value: "0b011110"
                  source_condition: "When FEAT_RAS is not implemented"
                  desc: "转换表遍历上的内存访问出现同步奇偶校验或 ECC 错误，级别 2。"
                  condition: "当 FEAT_RAS 未实现时"
                - value: "0b011111"
                  source_condition: "When FEAT_RAS is not implemented"
                  desc: "转换表遍历上的内存访问出现同步奇偶校验或 ECC 错误，级别 3。"
                  condition: "当 FEAT_RAS 未实现时"
                - value: "0b100001"
                  desc: "PC 对准故障。"
                - value: "0b100010"
                  desc: "调试异常。"
                - value: "0b110000"
                  desc: "TLB 冲突中止。"
        - name: "ISR"
          desc: "显示 IRQ 和 FIQ 中断和 SError 异常的待处理状态。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:9"
              desc: "保留，RES0。"
            - name: "A"
              bits: "8"
              desc: "SError 异常挂起位：\n如果满足以下所有条件，则此位域显示虚拟 SError 异常的待处理状态：\nEL2 在当前安全状态下实现并启用。以下任意一项均适用：EL2 使用 AArch64，HCR_EL2.AMO 为 1。EL2 使用 AArch64，实现 FEAT_DoubleFault2，且 HCRX_EL2.TMEA 的有效值为 1。EL2 为使用 AArch32 和 HCR.AMO 为 1。PE 在 EL1 处执行。否则，该位域显示物理 SError 异常的待处理状态。如果 SError 异常是边沿触发的，则当发生物理 SError 异常时，该位域被清除为零。"
              values:
                - value: "0b0"
                  desc: "没有待处理的 SError 异常。"
                - value: "0b1"
                  desc: "SError 异常正在等待处理。"
            - name: "I"
              bits: "7"
              desc: "IRQ 待处理位。指示 IRQ 中断是否待处理：\n如果以下所有条件均适用，则该位域显示虚拟 IRQ 中断的待处理状态：\nEL2 在当前安全状态下实现并启用。以下任何一项均适用：EL2 使用 AArch64，HCR_EL2.IMO 为 1。EL2 使用 AArch32，HCR.IMO 为 1。PE 在 EL1 执行。否则，该位域显示物理 IRQ 中断的待处理状态。"
              values:
                - value: "0b0"
                  desc: "没有待处理的 IRQ。"
                - value: "0b1"
                  desc: "IRQ 中断正在等待处理。"
            - name: "F"
              bits: "6"
              desc: "FIQ 待处理位。指示 FIQ 中断是否处于待处理状态。如果以下所有条件均适用，则该位域显示虚拟 FIQ 中断的待处理状态：\nEL2 在当前安全状态下实现并启用。以下任何一项均适用：EL2 使用 AArch64，HCR_EL2.FMO 为 1。EL2 使用 AArch32，HCR.FMO 为 1。PE 在 EL1 执行。否则，该位域显示物理 FIQ 中断的待处理状态。"
              values:
                - value: "0b0"
                  desc: "没有待处理的 FIQ。"
                - value: "0b1"
                  desc: "FIQ 中断正在等待处理。"
            - name: "RES0"
              bits: "5:0"
              desc: "保留，RES0。"
        - name: "VBAR"
          desc: "当未选择高异常向量时，保存未进入监控模式或 Hyp 模式的异常的向量基地址。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "VBA"
              bits: "31:5"
              desc: "向量基地址 向量基地址。进入此异常级别的异常的异常向量基地址的位[31:5]。异常向量的位[4:0]是异常偏移量。"
              reset_info: "温复位；ID"
            - name: "RES0"
              bits: "4:0"
              desc: "保留，RES0。"
    - name: "Float"
      title: "浮点"
      access: "MRS / MSR 系统寄存器接口"
      desc: "Arm AArch32 架构系统寄存器：Float"
      registers:
        - name: "FPEXC"
          desc: "为已实现的高级 SIMD 和浮点功能提供全局启用，并报告浮点状态信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "EX"
              bits: "31"
              desc: "异常位。"
              reset_info: "温复位；AU"
            - name: "EN"
              bits: "30"
              desc: "允许从所有异常级别访问高级 SIMD 和浮点功能，但将此位域设置为 0 不会禁用以下功能：\nVMSR访问FPEXC或FPSID。 VMRS 从FPEXC、FPSID、MVFR0、MVFR1、MVFR2 访问。高级 SIMD 和浮点指令在 AArch32 状态下的执行可以通过以下控件禁用或捕获：\nCPACR.cp10，或者，如果在 EL0 处执行，则为 CPACR_EL1.FPEN。 FPEXC.EN。如果在非安全状态下执行：HCPTR.TCP10，或者如果EL2正在使用AArch64、CPTR_EL2.TFP。 NSACR.cp10，或者如果 EL3 使用 AArch64、CPTR_EL3.TFP。仅适用于高级 SIMD 指令：CPACR.ASEDIS。如果在非安全状态下执行，则为 HCPTR.TASE 和 NSACR.NSASEDIS。有关详细信息，请参阅控件的说明。当使用 AArch32 在 EL0 执行时：\n如果EL1使用AArch64，则FPEXC.EN的有效值为1。其中包括EL2使用AArch64 且在当前安全状态下使能时，HCR_EL2.TGE为1，HCR_EL2.RW的有效值为1。如果 EL2 使用的是 AArch64，并且在当前安全状态下使能，HCR_EL2.TGE 为 1，HCR_EL2.RW 的有效值为 0，则无论 FPEXC.EN 的有效值为 1 还是写入的值，都是 IMPLEMENTATION DEFINED FPEXC.EN。但是，Arm 不建议使用 FPEXC.EN 的值来确定行为。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "访问 FPSCR 以及任何 SIMD 和浮点寄存器 Q0-Q15，包括它们作为 D0-D31 寄存器或 S0-S31 寄存器的视图，所有异常级别均为 UNDEFINED。"
                - value: "0b1"
                  desc: "该控制允许在所有异常级别访问高级 SIMD 和浮点功能。"
            - name: "DEX"
              bits: "29"
              desc: "定义浮点执行的同步异常。该位域标识尝试执行指令所生成的同步异常是否是由未分配的编码生成的。该指令必须位于由返回 TRUE 的伪代码函数 ExecutingCP10or11Instr() 标识的编码空间中。该位域还指示FPEXC.TFV位域是否有效。该位的含义是：\n在将该位设置为 1 的异常中，异常处理例程必须将该位清除为 0。在既不支持浮点异常捕获又将 FPSCR.{Stride, Len} 位域实现为 RAZ 的实现中，该位为 RES0。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "该异常是由于尝试在伪代码函数 ExecutingCP10or11Instr() 标识的编码空间中执行未分配的指令而生成的。如果FPEXC.TFV是RW那么它是无效的并且 UNKNOWN。如果 FPEXC.{IDF、IXF、UFF、OFF、DZF、IOF} 是 RW 则它们无效，UNKNOWN。"
                - value: "0b1"
                  desc: "异常是在执行分配的编码期间生成的。 FPEXC.TFV 有效，表示异常原因。"
            - name: "FP2V"
              bits: "28"
              desc: "FPINST2 指令有效位。从Armv8.0开始，该位为 RES0。"
              reset_info: "温复位；AU"
            - name: "VV"
              bits: "27"
              desc: "VECITR 有效位。从Armv8.0开始，该位为 RES0。"
              reset_info: "温复位；AU"
            - name: "TFV"
              bits: "26"
              desc: "捕获故障有效位。仅当 FPEXC.DEX 的值为 1 时有效。有效时，指示异常原因，从而指示是否 FPEXC.{IDF、IXF、UFF、OFF、DZF、 IOF} 有效。该位返回一个状态值并忽略写入。当FPEXC.DEX的值为0且该位为RW时，该位无效且为 UNKNOWN。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "该异常是由于执行浮点VABS、VADD、VDIV、VFMA、VFMS、VFNMA、VFNMS、VMLA、 VMLS、VMOV、VMUL、VNEG、VNMLA、VNMLS、VNMUL、VSQRT 或 VSUB 指令中的一项或两项时FPSCR.{Stride, Len} 不为零。如果 FPEXC.{IDF、IXF、UFF、OFF、DZF、IOF} 是 RW 则它们无效，UNKNOWN。"
                - value: "0b1"
                  desc: "FPEXC.{IDF、IXF、UFF、OFF、DZF、IOF} 指示在异常发生时是否存在捕获的浮点异常。为异常发生时发生的所有捕获的异常设置位。"
            - name: "RES0"
              bits: "25:11"
              desc: "保留，RES0。"
            - name: "VECITR"
              bits: "10:8"
              desc: "向量迭代计数。从Armv8.0开始，该位域为 RES1。"
              reset_info: "温复位；AU"
            - name: "IDF"
              bits: "7"
              desc: "输入非正常捕获异常位。仅当 FPEXC.TFV 值为 1 时有效。有效时表示 FPSCR.IDE 为 1 时是否发生输入非正常异常：\n仅当 FPSCR.FZ 为 1 时，才会发生输入非正规异常。由于 FPSCR.FZ16 的值为 1，所以刷新为零的半精度浮点值不会生成输入非正规 exception.This 位，必须通过异常处理例程将其清除为 0。当FPEXC.TFV的值为0且该位为RW时，该位无效且为 UNKNOWN。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "输入非正常异常尚未发生。"
                - value: "0b1"
                  desc: "输入发生非正常异常。"
            - name: "RES0"
              bits: "6:5"
              desc: "保留，RES0。"
            - name: "IXF"
              bits: "4"
              desc: "不精确的捕获异常位。仅当FPEXC.TFV的值为1时有效。有效时表示FPSCR.IXE为1时是否发生了Inexact异常：\n该位必须由异常处理例程清除为 0。当FPEXC.TFV的值为0且该位为RW时，该位无效且为 UNKNOWN。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "未发生不精确异常。"
                - value: "0b1"
                  desc: "发生了不精确的异常。"
            - name: "UFF"
              bits: "3"
              desc: "下溢捕获异常位。仅当 FPEXC.TFV 的值为 1 时有效。有效时表示 FPSCR.UFE 为 1 时是否发生下溢异常：\n可能发生下溢捕获的异常：\n仅当 FPSCR.FZ16 为 0 时才适用于半精度数据处理指令。否则仅当 FPSCR.FZ 为 0 时才适用。该位必须由异常处理例程清除为 0。当FPEXC.TFV的值为0且该位为RW时，该位无效，为 UNKNOWN。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "未发生下溢异常。"
                - value: "0b1"
                  desc: "发生下溢异常。"
            - name: "OFF"
              bits: "2"
              desc: "溢出捕获异常位。仅当FPEXC.TFV的值为1时有效。有效时表示FPSCR.OFE为1时是否发生溢出异常：\n该位必须由异常处理例程清除为 0。当FPEXC.TFV的值为0且该位为RW时，该位无效且为 UNKNOWN。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "没有发生溢出异常。"
                - value: "0b1"
                  desc: "发生溢出异常。"
            - name: "DZF"
              bits: "1"
              desc: "除以零捕获的异常位。仅当 FPEXC.TFV 值为 1 时有效。有效时表示 FPSCR.DZE 为 1 时是否发生除零异常：\n该位必须由异常处理例程清除为 0。当FPEXC.TFV的值为0且该位为RW时，该位无效且为 UNKNOWN。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "没有发生除零异常。"
                - value: "0b1"
                  desc: "发生除零异常。"
            - name: "IOF"
              bits: "0"
              desc: "无效操作捕获异常位。仅当FPEXC.TFV的值为1时有效。有效时表示FPSCR.IOE为1时是否发生无效操作异常：\n该位必须由异常处理例程清除为 0。当FPEXC.TFV的值为0且该位为RW时，该位无效且为 UNKNOWN。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "未发生无效操作异常。"
                - value: "0b1"
                  desc: "发生无效操作异常。"
        - name: "FPSCR"
          desc: "提供浮点系统状态信息和控制。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "N"
              bits: "31"
              desc: "否定条件标志。这是通过浮点比较运算来更新的。"
              reset_info: "温复位；AU"
            - name: "Z"
              bits: "30"
              desc: "零条件标志。这是通过浮点比较运算来更新的。"
              reset_info: "温复位；AU"
            - name: "C"
              bits: "29"
              desc: "携带条件标志。这是通过浮点比较运算来更新的。"
              reset_info: "温复位；AU"
            - name: "V"
              bits: "28"
              desc: "溢出条件标志。这是通过浮点比较运算来更新的。"
              reset_info: "温复位；AU"
            - name: "QC"
              bits: "27"
              desc: "累积饱和位，仅限高级 SIMD。该位设置为 1，表示自上次向该位写入 0 以来，高级 SIMD 整数运算已饱和。"
              reset_info: "温复位；AU"
            - name: "AHP"
              bits: "26"
              desc: "替代半精度控制位：\n该位仅用于半精度浮点和其他浮点格式之间的转换。作为 FEAT_FP16 扩展的一部分添加的数据处理指令始终使用 IEEE 半精度格式，并忽略该位的值。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "选择 IEEE 半精度格式。"
                - value: "0b1"
                  desc: "选择替代半精度格式。"
            - name: "DN"
              bits: "25"
              desc: "默认NaN控制位：\n该位的值仅控制标量浮点运算。无论 DN 位的值如何，高级 SIMD 算法始终使用默认的 NaN 设置。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "NaN 操作数传播到浮点运算的输出。"
                - value: "0b1"
                  desc: "任何涉及一个或多个 NaNs 的操作都会返回默认的 NaN。"
            - name: "FZ"
              bits: "24"
              desc: "清零模式控制位：\n该位的值仅控制标量浮点运算。无论 FZ 位的值如何，高级 SIMD 算法始终使用清零设置。该位对半精度计算没有影响。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "清零模式已禁用。浮点系统的行为完全符合 IEEE 754 标准。"
                - value: "0b1"
                  desc: "启用清零模式。"
            - name: "RMode"
              bits: "23:22"
              desc: "舍入模式控制位域。该位域的编码为：\n几乎所有标量浮点指令都使用指定的舍入模式。无论 RMode 位的值如何，高级 SIMD 算法始终使用“舍入到最近”设置。"
              reset_info: "温复位；AU"
              values:
                - value: "0b00"
                  desc: "舍入到最近 (RN) 模式。"
                - value: "0b01"
                  desc: "向正无穷 (RP) 模式舍入。"
                - value: "0b10"
                  desc: "朝负无穷大 (RM) 模式舍入。"
                - value: "0b11"
                  desc: "向零舍入 (RZ) 模式。"
            - name: "Stride"
              bits: "21:20"
              desc: "如果该位域为 RW 且设置为非零值，则某些浮点指令编码为 UNDEFINED。指令伪代码识别这些指令。 Arm 强烈建议软件切勿将此位域设置为零以外的值。处理高级 SIMD 指令时，该位域的值被忽略。"
              reset_info: "温复位；AU"
            - name: "FZ16"
              bits: "19"
              source_condition: "When FEAT_FP16 is implemented"
              desc: "半精度数据处理指令上的清零模式控制位：\n该位的值适用于标量和高级 SIMD 浮点半精度计算。"
              condition: "当实现FEAT_FP16时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "清零模式已禁用。浮点系统的行为完全符合 IEEE 754 标准。"
                - value: "0b1"
                  desc: "启用清零模式。"
            - name: "RES0"
              bits: "19"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "Len"
              bits: "18:16"
              desc: "如果该位域为 RW 且设置为非零值，则某些浮点指令编码为 UNDEFINED。指令伪代码识别这些指令。 Arm 强烈建议软件切勿将此位域设置为零以外的值。处理高级 SIMD 指令时，该位域的值被忽略。"
              reset_info: "温复位；AU"
            - name: "IDE"
              bits: "15"
              desc: "输入 非正常浮点异常陷阱启用。当该位为RW时，仅适用于浮点运算。高级 SIMD 操作始终在 AArch32 状态下使用未捕获的浮点异常处理。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "选择未捕获的异常处理。如果发生浮点异常，则 IDC 位设置为 1。"
                - value: "0b1"
                  desc: "选择了捕获异常处理。如果发生浮点异常，PE 不会更新 IDC 位。"
            - name: "RES0"
              bits: "14:13"
              desc: "保留，RES0。"
            - name: "IXE"
              bits: "12"
              desc: "不精确的浮点异常陷阱启用。当该位为RW时，仅适用于浮点运算。高级 SIMD 操作始终在 AArch32 状态下使用未捕获的浮点异常处理。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "选择未捕获的异常处理。如果发生浮点异常，则 IXC 位设置为 1。"
                - value: "0b1"
                  desc: "选择了捕获异常处理。如果发生浮点异常，PE 不会更新 IXC 位。"
            - name: "UFE"
              bits: "11"
              desc: "下溢浮点异常陷阱启用。当该位为RW时，仅适用于浮点运算。高级 SIMD 操作始终在 AArch32 状态下使用未捕获的浮点异常处理。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "选择未捕获的异常处理。如果发生浮点异常，则 UFC 位设置为 1。"
                - value: "0b1"
                  desc: "选择了捕获异常处理。如果发生浮点异常且未使能清零，则 PE 不会更新 UFC 位。"
            - name: "OFE"
              bits: "10"
              desc: "溢出浮点异常陷阱启用。当该位为RW时，仅适用于浮点运算。高级 SIMD 操作始终在 AArch32 状态下使用未捕获的浮点异常处理。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "选择未捕获的异常处理。如果发生浮点异常，则 OFC 位设置为 1。"
                - value: "0b1"
                  desc: "选择了捕获异常处理。如果发生浮点异常，PE 不会更新 OFC 位。"
            - name: "DZE"
              bits: "9"
              desc: "除以零浮点异常陷阱启用。当该位为RW时，仅适用于浮点运算。高级 SIMD 操作始终在 AArch32 状态下使用未捕获的浮点异常处理。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "选择未捕获的异常处理。如果发生浮点异常，则 DZC 位设置为 1。"
                - value: "0b1"
                  desc: "选择了捕获异常处理。如果发生浮点异常，PE 不会更新 DZC 位。"
            - name: "IOE"
              bits: "8"
              desc: "无效操作浮点异常陷阱启用。当该位为RW时，仅适用于浮点运算。高级 SIMD 操作始终在 AArch32 状态下使用未捕获的浮点异常处理。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "选择未捕获的异常处理。如果发生浮点异常，则 IOC 位设置为 1。"
                - value: "0b1"
                  desc: "选择了捕获异常处理。如果发生浮点异常，PE 不会更新 IOC 位。"
            - name: "IDC"
              bits: "7"
              desc: "输入 非正规累积浮点异常位。该位设置为 1 表示自上次向该位写入 0 以来已发生输入非正常浮点异常。 VFP 指令如何更新该位取决于 IDE 位的值。如果高级 SIMD 指令执行的一个或多个浮点计算中发生输入非正常浮点异常，则无论 IDE 位的值如何，都会设置该位。"
              reset_info: "温复位；AU"
            - name: "RES0"
              bits: "6:5"
              desc: "保留，RES0。"
            - name: "IXC"
              bits: "4"
              desc: "不精确的累积浮点异常位。该位设置为 1 表示自上次向该位写入 0 以来已发生不精确浮点异常。 VFP 指令如何更新该位取决于 IXE 位的值。如果高级 SIMD 指令执行的一个或多个浮点计算中发生不精确浮点异常，则无论 IXE 位的值如何，都会设置该位。在清零模式下，发生不精确浮点异常的标准是不同的。有关详细信息，请参阅“清零”。"
              reset_info: "温复位；AU"
            - name: "UFC"
              bits: "3"
              desc: "下溢累积浮点异常位。该位设置为 1 表示自上次向该位写入 0 以来发生了下溢浮点异常。 VFP 指令如何更新该位取决于 UFE 位的值。如果高级 SIMD 指令执行的一项或多项浮点计算中发生下溢浮点异常、FPSCR.UFE 为 0 或启用清零，则该指令会设置该位。在清零模式下，发生下溢浮点异常的标准是不同的。有关详细信息，请参阅“清零”。"
              reset_info: "温复位；AU"
            - name: "OFC"
              bits: "2"
              desc: "溢出累积浮点异常位。该位设置为 1 表示自上次向该位写入 0 以来发生了溢出浮点异常。 VFP 指令如何更新该位取决于 OFE 位的值。如果高级 SIMD 指令执行的一个或多个浮点计算中发生溢出浮点异常，则无论 OFE 位的值如何，都会设置该位。"
              reset_info: "温复位；AU"
            - name: "DZC"
              bits: "1"
              desc: "除以零累积浮点异常位。该位设置为 1 表示自上次向该位写入 0 以来已发生除以零浮点异常。 VFP 指令如何更新该位取决于 DZE 位的值。如果高级 SIMD 指令执行的一个或多个浮点计算中发生被零除浮点异常，则无论 DZE 位的值如何，都会设置该位。"
              reset_info: "温复位；AU"
            - name: "IOC"
              bits: "0"
              desc: "无效操作累积浮点异常位。该位设置为 1 表示自上次向该位写入 0 以来已发生无效操作浮点异常。 VFP 指令如何更新该位取决于 IOE 位的值。如果高级 SIMD 指令执行的一个或多个浮点计算中发生无效操作浮点异常，则无论 IOE 位的值如何，都会设置该位。"
              reset_info: "温复位；AU"
        - name: "FPSID"
          desc: "提供有关浮点实现的顶级信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "Implementer"
              bits: "31:24"
              desc: "实现者代码与 MIDR 所使用的代码相同。对于 Arm 的实现，此位域为 0x41，即 A 的 ASCII 代码。此位域具有 IMPLEMENTATION DEFINED 值。"
            - name: "SW"
              bits: "23"
              desc: "软件位。在 Armv8 中，唯一允许的值为 0。"
              values:
                - value: "0b0"
                  desc: "该实现提供了浮点指令的硬件实现。"
                - value: "0b1"
                  desc: "该实现仅支持浮点指令的软件模拟。"
            - name: "Subarchitecture"
              bits: "22:16"
              desc: "子体系结构版本号。对于 Arm 设计的子架构，该位域（寄存器位[22]）的最高有效位为 0。此处未列出的最高有效位为 0 的值被保留。当子架构设计者不是 Arm 时，该位域的最高有效位（寄存器位[22]）必须为 1。每个实现者必须维护自己设计的子架构列表，从子架构版本号 0x40 开始。在Armv8中，允许的值为0b0000011和0b0000100。"
              values:
                - value: "0b0000000"
                  desc: "VFPv1 架构，具有 IMPLEMENTATION DEFINED 子架构。"
                - value: "0b0000001"
                  desc: "VFPv2 架构与通用 VFP 子架构 v1。"
                - value: "0b0000010"
                  desc: "VFPv3 架构或更高版本，具有通用 VFP 子架构 v2。 VFP 架构版本由 MVFR0 和 MVFR1 寄存器指示。"
                - value: "0b0000011"
                  desc: "VFPv3 架构或更高版本，具有 Null 子架构。整个浮点实现都是在硬件中实现的，不需要软件支持代码。 VFP 架构版本由 MVFR0 和 MVFR1 寄存器指示。该值只能由不支持 FPSCR 中陷阱使能位的实现使用。"
                - value: "0b0000100"
                  desc: "VFPv3 架构或更高版本，具有通用 VFP 子架构 v3，并支持 FPSCR 中的陷阱使能位。 VFP 架构版本由 MVFR0 和 MVFR1 寄存器指示。"
            - name: "PartNum"
              bits: "15:8"
              desc: "浮点实现的部件号，由实现者分配。该位域的值是 IMPLEMENTATION DEFINED。"
            - name: "Variant"
              bits: "7:4"
              desc: "变体编号。通常，该位域区分单个产品的不同生产变体。该位域的值是 IMPLEMENTATION DEFINED。"
            - name: "Revision"
              bits: "3:0"
              desc: "浮点实现的修订号。该位域的值是 IMPLEMENTATION DEFINED。"
        - name: "MVFR0"
          desc: "描述 AArch32 高级 SIMD 提供的功能和浮点实现。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "FPRound"
              bits: "31:28"
              desc: "浮点舍入模式。指示浮点实现是否提供对舍入模式的支持。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0001。"
              values:
                - value: "0b0000"
                  desc: "未实现，或仅支持舍入到最近模式，但 VCVT 指令支持舍入到零模式，无论 FPSCR 设置如何，这些指令始终使用该舍入模式。"
                - value: "0b0001"
                  desc: "支持所有舍入模式。"
            - name: "FPShVec"
              bits: "27:24"
              desc: "短向量。指示浮点实现是否支持使用短向量。所有其他值均被保留。在 Armv8 中，唯一允许的值为 0b0000。"
              values:
                - value: "0b0000"
                  desc: "不支持短向量。"
                - value: "0b0001"
                  desc: "支持短向量运算。"
            - name: "FPSqrt"
              bits: "23:20"
              desc: "平方根。指示浮点实现是否提供对 ARMv6 VFP 平方根运算的支持。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0001。 VSQRT.F32 指令还需要单精度浮点属性位[7:4]，VSQRT.F64 指令还需要双精度浮点属性位[11:8]。"
              values:
                - value: "0b0000"
                  desc: "硬件上不支持。"
                - value: "0b0001"
                  desc: "支持。"
            - name: "FPDivide"
              bits: "19:16"
              desc: "指示浮点实现是否提供对 VFP 除法运算的支持。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0001。 VDIV.F32 指令还需要单精度浮点属性位[7:4]，VDIV.F64 指令还需要双精度浮点属性位[11:8]。"
              values:
                - value: "0b0000"
                  desc: "硬件上不支持。"
                - value: "0b0001"
                  desc: "支持。"
            - name: "FPTrap"
              bits: "15:12"
              desc: "浮点异常捕获。指示浮点实现是否提供对异常捕获的支持。所有其他值均被保留。值为 0b0001 表示当相应陷阱启用时，浮点异常会生成异常。"
              values:
                - value: "0b0000"
                  desc: "不支持。"
                - value: "0b0001"
                  desc: "支持。"
            - name: "FPDP"
              bits: "11:8"
              desc: "浮点双精度。指示浮点实现是否提供对双精度运算的支持。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0010。值 0b0001 或 0b0010 表示支持 VFP 受支持版本中的所有 VFP 双精度指令，除了该位域非零之外：\n仅当平方根位域为 0b0001 时，VSQRT.F64 才可用。 VDIV.F64 仅当除法位域为 0b0001 时才可用。仅当单精度位域非零时，双精度和单精度之间的转换才可用。"
              values:
                - value: "0b0000"
                  desc: "硬件上不支持。"
                - value: "0b0001"
                  desc: "支持，VFPv2。"
                - value: "0b0010"
                  desc: "支持，VFPv3、VFPv4 或 Armv8。 VFPv3和Armv8增加了加载双精度浮点常数的指令，以及双精度和定点值之间的转换。"
            - name: "FPSP"
              bits: "7:4"
              desc: "浮点单精度。指示浮点实现是否提供对单精度运算的支持。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0010。值 0b0001 或 0b0010 表示支持 VFP 受支持版本中的所有 VFP 单精度指令，除了该位域非零之外：\nVSQRT.F32 仅当平方根位域为 0b0001 时才可用。 VDIV.F32 仅当除法位域为 0b0001 时才可用。仅当双精度位域非零时，双精度和单精度之间的转换才可用。"
              values:
                - value: "0b0000"
                  desc: "硬件上不支持。"
                - value: "0b0001"
                  desc: "支持，VFPv2。"
                - value: "0b0010"
                  desc: "支持，VFPv3 或 VFPv4。 VFPv3增加了加载单精度浮点常数的指令，以及单精度和定点值之间的转换。"
            - name: "SIMDReg"
              bits: "3:0"
              desc: "高级 SIMD 寄存器。指示高级 SIMD 和浮点实现是否提供对高级 SIMD 和浮点寄存器组的支持。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0010。"
              values:
                - value: "0b0000"
                  desc: "该实现没有高级 SIMD 和浮点支持。"
                - value: "0b0001"
                  desc: "该实现包括 16 x 64 位寄存器的浮点支持。"
                - value: "0b0010"
                  desc: "该实现包括高级 SIMD 和 32 x 64 位寄存器的浮点支持。"
        - name: "MVFR1"
          desc: "描述 AArch32 高级 SIMD 提供的功能和浮点实现。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "SIMDFMAC"
              bits: "31:28"
              desc: "高级 SIMD 融合乘法累加。指示高级 SIMD 实现是否提供融合乘法累加指令。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0001。高级 SIMD 和浮点实现必须为这些指令提供相同级别的支持。"
              values:
                - value: "0b0000"
                  desc: "未实现。"
                - value: "0b0001"
                  desc: "已实现。"
            - name: "FPHP"
              bits: "27:24"
              desc: "浮点半精度。指示半精度浮点支持的级别。所有其他值均被保留。在 Armv8 中，允许的值为：\n0b0000 在没有浮点支持的实现中。 0b0010 在具有浮点支持的实现中，不包括 FEAT_FP16 扩展。 0b0011 在具有浮点支持的实现中，包括 FEAT_FP16 扩展。该位域指示的支持级别必须等于 SIMDHP 位域指示的支持级别，这意味着允许的值为：\n半精度指令 supportedFPHPSIMDHPNo support0b00000b0000Conversions only0b00100b0001Conversions 和 arithmetic0b00110b0010"
              values:
                - value: "0b0000"
                  desc: "不支持。"
                - value: "0b0001"
                  desc: "支持浮点半精度转换指令，用于单精度和半精度之间的转换。"
                - value: "0b0010"
                  desc: "至于0b0001，增加了双精度和半精度之间的转换指令。"
                - value: "0b0011"
                  desc: "至于0b0010，并增加了对半精度浮点运算的支持。"
            - name: "SIMDHP"
              bits: "23:20"
              desc: "高级 SIMD 半精度。指示半精度浮点支持的级别。所有其他值均被保留。在 Armv8 中，允许的值为：\n0b0000 在没有 SIMD 浮点支持的实现中。 0b0001 在具有 SIMD 浮点支持的实现中，不包括 FEAT_FP16 扩展。 0b0010 在具有 SIMD 浮点支持（包括 FEAT_FP16 扩展）的实现中。该位域指示的支持级别必须等于 FPHP 位域指示的支持级别，这意味着允许的值为：\n半精度指令 supportedFPHPSIMDHPNo support0b00000b0000Conversions only0b00100b0001Conversions 和 arithmetic0b00110b0010"
              values:
                - value: "0b0000"
                  desc: "不支持。"
                - value: "0b0001"
                  desc: "支持SIMD半精度转换指令，用于单精度与半精度之间的转换。"
                - value: "0b0010"
                  desc: "至于0b0001，并增加了对半精度浮点运算的支持。"
            - name: "SIMDSP"
              bits: "19:16"
              desc: "高级 SIMD 单精度。指示高级 SIMD 和浮点实现是否提供单精度浮点指令。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0001。"
              values:
                - value: "0b0000"
                  desc: "未实现。"
                - value: "0b0001"
                  desc: "已实现。仅当 SIMDInt 位域为 0b0001 时才允许使用该值。"
            - name: "SIMDInt"
              bits: "15:12"
              desc: "高级 SIMD 整数。指示高级 SIMD 和浮点实现是否提供整数指令。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0001。"
              values:
                - value: "0b0000"
                  desc: "未实现。"
                - value: "0b0001"
                  desc: "已实现。"
            - name: "SIMDLS"
              bits: "11:8"
              desc: "高级 SIMD 加载/存储。指示高级 SIMD 和浮点实现是否提供加载/存储指令。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0001。"
              values:
                - value: "0b0000"
                  desc: "未实现。"
                - value: "0b0001"
                  desc: "已实现。"
            - name: "FPDNaN"
              bits: "7:4"
              desc: "默认NaN。指示浮点实现是否仅提供对默认 NaN 的支持。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0001。"
              values:
                - value: "0b0000"
                  desc: "未实现，或者硬件仅支持默认的NaN。"
                - value: "0b0001"
                  desc: "硬件支持 NaN 值的传播。"
            - name: "FPFtZ"
              bits: "3:0"
              desc: "冲洗至零模式。指示浮点实现是否仅提供对清零操作模式的支持。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0001。"
              values:
                - value: "0b0000"
                  desc: "未实现，或硬件仅支持清零操作模式。"
                - value: "0b0001"
                  desc: "硬件支持完全非规范化数字算术。"
        - name: "MVFR2"
          desc: "描述 AArch32 高级 SIMD 提供的功能和浮点实现。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:8"
              desc: "保留，RES0。"
            - name: "FPMisc"
              bits: "7:4"
              desc: "指示浮点实现是否提供对其他 VFP 功能的支持。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0100。"
              values:
                - value: "0b0000"
                  desc: "未实现，或不支持其他功能。"
                - value: "0b0001"
                  desc: "支持浮点选择。"
                - value: "0b0010"
                  desc: "作为 0b0001，以及使用定向舍入模式将浮点转换为整数。"
                - value: "0b0011"
                  desc: "如0b0010，浮点舍入为整数浮点。"
                - value: "0b0100"
                  desc: "如0b0011，以及浮点MaxNum和MinNum。"
            - name: "SIMDMisc"
              bits: "3:0"
              desc: "指示高级 SIMD 实现是否提供对各种高级 SIMD 功能的支持。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0011。"
              values:
                - value: "0b0000"
                  desc: "未实现，或不支持其他功能。"
                - value: "0b0001"
                  desc: "使用定向舍入模式将浮点转换为整数。"
                - value: "0b0010"
                  desc: "如0b0001，浮点舍入为整数浮点。"
                - value: "0b0011"
                  desc: "如0b0010，以及浮点MaxNum和MinNum。"
    - name: "Generic System Control"
      title: "通用系统控制"
      access: "MRS / MSR 系统寄存器接口"
      desc: "Arm AArch32 架构系统寄存器：通用系统控制"
      registers:
        - name: "PAR"
          desc: "返回成功执行的地址转换指令的输出地址（OA），如果指令未成功执行，则返回故障信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "63:32"
              source_condition: "When the instruction returned a 32-bit value to the PAR, PAR.F==0"
              desc: "保留，RES0。"
              condition: "当指令返回32 位值给PAR时，PAR.F==0"
            - name: "PA"
              bits: "31:12"
              source_condition: "When the instruction returned a 32-bit value to the PAR, PAR.F==0"
              desc: "输出地址。与提供的输入地址相对应的输出地址（OA）。该位域返回地址位[31:12]。"
              condition: "当指令返回32 位值给PAR时，PAR.F==0"
              reset_info: "温复位；AU"
            - name: "LPAE"
              bits: "11"
              source_condition: "When the instruction returned a 32-bit value to the PAR, PAR.F==0"
              desc: "当用地址转换操作的结果更新PAR时，该位设置如下："
              condition: "当指令返回32 位值给PAR时，PAR.F==0"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "使用的短描述符转换表格式。这意味着 PAR 返回了一个 32 位值。"
            - name: "NOS"
              bits: "10"
              source_condition: "When the instruction returned a 32-bit value to the PAR, PAR.F==0"
              desc: "不可外部共享。当PAR.SH的返回值为1时，表示物理内存区域的Shareability属性：\n当PAR.SH的返回值为0时，该位域的返回值为 UNKNOWN。该位域中返回的值可以是结果属性，由任何允许的实现选择和任何适用的配置位确定，而不是出现在转换表描述符中的值。"
              condition: "当指令返回32 位值给PAR时，PAR.F==0"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "内存区域是外部可共享的。"
                - value: "0b1"
                  desc: "内存区域是内部可共享的。"
            - name: "NS"
              bits: "9"
              source_condition: "When the instruction returned a 32-bit value to the PAR, PAR.F==0"
              desc: "非安全。安全地址转换机制中转换表条目的 NS 属性。对于安全地址转换机制的结果，该位反映转换的物理地址空间的安全状态。这意味着如果这些 NSTable 位对转换有影响，则它反映了转换表遍历的早期级别的 NSTable 位的影响。对于非安全地址转换机制的结果，该位是 UNKNOWN。"
              condition: "当指令返回32 位值给PAR时，PAR.F==0"
              reset_info: "温复位；AU"
            - name: "IMPLEMENTATION DEFINED"
              bits: "8"
              source_condition: "When the instruction returned a 32-bit value to the PAR, PAR.F==0"
              desc: "IMPLEMENTATION DEFINED。"
              condition: "当指令返回32 位值给PAR时，PAR.F==0"
              reset_info: "温复位；AU"
            - name: "SH"
              bits: "7"
              source_condition: "When the instruction returned a 32-bit value to the PAR, PAR.F==0"
              desc: "可共享性。指示物理内存区域是否不可共享：\n该位域中返回的值可以是结果属性，由任何允许的实现选择和任何适用的配置位确定，而不是出现在转换表描述符中的值。"
              condition: "当指令返回32 位值给PAR时，PAR.F==0"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "内存是不可共享的。"
                - value: "0b1"
                  desc: "内存可共享，PAR.NOS表示该区域是外部共享还是内部共享。"
            - name: "Inner[2:0]"
              bits: "6:4"
              source_condition: "When the instruction returned a 32-bit value to the PAR, PAR.F==0"
              desc: "该区域的内部可缓存性属性。允许的值为：\n值 0b010 和 0b100 被保留。该位域中返回的值可以是结果属性，由任何允许的实现选择和任何适用的配置位确定，而不是出现在转换表描述符中的值。"
              condition: "当指令返回32 位值给PAR时，PAR.F==0"
              reset_info: "温复位；AU"
              values:
                - value: "0b000"
                  desc: "不可缓存。"
                - value: "0b001"
                  desc: "设备-nGnRnE。"
                - value: "0b011"
                  desc: "设备-nGnRE。"
                - value: "0b101"
                  desc: "写回、写分配。"
                - value: "0b110"
                  desc: "直写式。"
                - value: "0b111"
                  desc: "回写，无写分配。"
            - name: "Outer[1:0]"
              bits: "3:2"
              source_condition: "When the instruction returned a 32-bit value to the PAR, PAR.F==0"
              desc: "该区域的外部可缓存性属性。允许的值为：\n该位域中返回的值可以是结果属性，由任何允许的实现选择和任何适用的配置位确定，而不是出现在转换表描述符中的值。"
              condition: "当指令返回32 位值给PAR时，PAR.F==0"
              reset_info: "温复位；AU"
              values:
                - value: "0b00"
                  desc: "不可缓存。"
                - value: "0b01"
                  desc: "写回、写分配。"
                - value: "0b10"
                  desc: "直写式，无写分配。"
                - value: "0b11"
                  desc: "回写，无写分配。"
            - name: "SS"
              bits: "1"
              source_condition: "When the instruction returned a 32-bit value to the PAR, PAR.F==0"
              desc: "超节。用于指示结果是否是超节："
              condition: "当指令返回32 位值给PAR时，PAR.F==0"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "结果不是超级部分。 PAR[31:12]包含OA[31:12]。"
                - value: "0b1"
                  desc: "结果是一个超节，并且：\nPAR[31:24]包含OA[31:24]。 PAR[23:16]包含OA[39:32]。 PAR[15:12]包含0b0000。如果实现支持少于 40 位的物理地址，则 PAR 位域中与未实现的物理地址位对应的位为 UNKNOWN。"
            - name: "F"
              bits: "0"
              source_condition: "When the instruction returned a 32-bit value to the PAR, PAR.F==0"
              desc: "指示指令是否执行了成功的地址转换。"
              condition: "当指令返回32 位值给PAR时，PAR.F==0"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "地址转换成功完成。"
            - name: "RES0"
              bits: "63:32"
              source_condition: "When the instruction returned a 32-bit value to the PAR, PAR.F==1"
              desc: "保留，RES0。"
              condition: "当指令返回32 位值给PAR时，PAR.F==1"
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:16"
              source_condition: "When the instruction returned a 32-bit value to the PAR, PAR.F==1"
              desc: "IMPLEMENTATION DEFINED。"
              condition: "当指令返回32 位值给PAR时，PAR.F==1"
              reset_info: "温复位；AU"
            - name: "RES0"
              bits: "15:12"
              source_condition: "When the instruction returned a 32-bit value to the PAR, PAR.F==1"
              desc: "保留，RES0。"
              condition: "当指令返回32 位值给PAR时，PAR.F==1"
            - name: "LPAE"
              bits: "11"
              source_condition: "When the instruction returned a 32-bit value to the PAR, PAR.F==1"
              desc: "当用地址转换操作的结果更新PAR时，该位设置如下："
              condition: "当指令返回32 位值给PAR时，PAR.F==1"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "使用的短描述符转换表格式。这意味着 PAR 返回了一个 32 位值。"
            - name: "RES0"
              bits: "10:7"
              source_condition: "When the instruction returned a 32-bit value to the PAR, PAR.F==1"
              desc: "保留，RES0。"
              condition: "当指令返回32 位值给PAR时，PAR.F==1"
            - name: "FS[5]"
              bits: "6"
              source_condition: "When the instruction returned a 32-bit value to the PAR, PAR.F==1"
              desc: "故障状态位，外部中止类型。提供外部中止的 IMPLEMENTATION DEFINED 分类。使用短描述符转换表格式时，值与 DFSR.ExT 位域中的值相同。在不提供任何外部中止分类的实现中，该位是 RES0。对于外部中止以外的中止，该位始终返回 0。"
              condition: "当指令返回32 位值给PAR时，PAR.F==1"
              reset_info: "温复位；AU"
            - name: "FS[4:0]"
              bits: "5:1"
              source_condition: "When the instruction returned a 32-bit value to the PAR, PAR.F==1"
              desc: "故障状态位。使用短描述符转换表格式时，值与 DFSR.FS 位域中的值相同。"
              condition: "当指令返回32 位值给PAR时，PAR.F==1"
              reset_info: "温复位；AU"
              values:
                - value: "0b00001"
                  desc: "对准故障。"
                - value: "0b00011"
                  desc: "访问标志故障，级别 1。"
                - value: "0b00100"
                  desc: "指令缓存维护故障。"
                - value: "0b00101"
                  desc: "地址转换错误，1 级。"
                - value: "0b00110"
                  desc: "访问标志故障，级别 2。"
                - value: "0b00111"
                  desc: "地址转换错误，2 级。"
                - value: "0b01001"
                  desc: "域故障，级别 1。"
                - value: "0b01011"
                  desc: "域故障，2 级。"
                - value: "0b01100"
                  desc: "同步外部中止，在转换表上行走，级别 1。"
                - value: "0b01101"
                  desc: "权限错误，级别 1。"
                - value: "0b01110"
                  desc: "同步外部中止，在转换表上行走，级别 2。"
                - value: "0b01111"
                  desc: "权限错误，级别 2。"
                - value: "0b10000"
                  desc: "TLB 冲突中止。"
                - value: "0b11001"
                  source_condition: "When FEAT_RAS is not implemented"
                  desc: "内存访问时出现同步奇偶校验或 ECC 错误，而不是转换表遍历时出现错误。"
                  condition: "当 FEAT_RAS 未实现时"
                - value: "0b11100"
                  source_condition: "When FEAT_RAS is not implemented"
                  desc: "转换表行走上出现同步奇偶校验或 ECC 错误，级别 1。"
                  condition: "当 FEAT_RAS 未实现时"
                - value: "0b11110"
                  source_condition: "When FEAT_RAS is not implemented"
                  desc: "转换表行走上出现同步奇偶校验或 ECC 错误，级别 2。"
                  condition: "当 FEAT_RAS 未实现时"
            - name: "F"
              bits: "0"
              source_condition: "When the instruction returned a 32-bit value to the PAR, PAR.F==1"
              desc: "指示指令是否执行了成功的地址转换。"
              condition: "当指令返回32 位值给PAR时，PAR.F==1"
              reset_info: "温复位；AU"
              values:
                - value: "0b1"
                  desc: "地址转换已中止。"
            - name: "ATTR"
              bits: "63:56"
              source_condition: "When the instruction returned a 64-bit value to the PAR, PAR.F==0"
              desc: "返回的输出地址的内存属性。该位域使用与 MAIR0 和 MAIR1 中的 Attr<n> 位域相同的编码。该位域中返回的值可以是结果属性，由任何允许的实现选择和任何适用的配置位确定，而不是出现在转换表描述符中的值。"
              condition: "当指令返回64 位值给PAR时，PAR.F==0"
              reset_info: "温复位；AU"
            - name: "RES0"
              bits: "55:40"
              source_condition: "When the instruction returned a 64-bit value to the PAR, PAR.F==0"
              desc: "保留，RES0。"
              condition: "当指令返回64 位值给PAR时，PAR.F==0"
            - name: "PA"
              bits: "39:12"
              source_condition: "When the instruction returned a 64-bit value to the PAR, PAR.F==0"
              desc: "输出地址。与提供的输入地址相对应的输出地址（OA）。该位域返回地址位[39:12]。"
              condition: "当指令返回64 位值给PAR时，PAR.F==0"
              reset_info: "温复位；AU"
            - name: "LPAE"
              bits: "11"
              source_condition: "When the instruction returned a 64-bit value to the PAR, PAR.F==0"
              desc: "当用地址转换操作的结果更新PAR时，该位设置如下："
              condition: "当指令返回64 位值给PAR时，PAR.F==0"
              reset_info: "温复位；AU"
              values:
                - value: "0b1"
                  desc: "使用长描述符转换表格式。这意味着 PAR 返回了一个 64 位值。"
            - name: "IMPLEMENTATION DEFINED"
              bits: "10"
              source_condition: "When the instruction returned a 64-bit value to the PAR, PAR.F==0"
              desc: "IMPLEMENTATION DEFINED。"
              condition: "当指令返回64 位值给PAR时，PAR.F==0"
              reset_info: "温复位；AU"
            - name: "NS"
              bits: "9"
              source_condition: "When the instruction returned a 64-bit value to the PAR, PAR.F==0"
              desc: "非安全。安全地址转换机制中转换表条目的 NS 属性。对于安全地址转换机制的结果，该位反映转换的物理地址空间的安全状态。这意味着如果这些 NSTable 位对转换有影响，则它反映了转换表遍历的早期级别的 NSTable 位的影响。对于非安全地址转换机制的结果，该位是 UNKNOWN。"
              condition: "当指令返回64 位值给PAR时，PAR.F==0"
              reset_info: "温复位；AU"
            - name: "SH"
              bits: "8:7"
              source_condition: "When the instruction returned a 64-bit value to the PAR, PAR.F==0"
              desc: "可共享性属性，用于返回的输出地址。允许的值为：\n值 0b01 被保留。该位域返回值 0b10：\n任何类型的设备内存。在此位域中返回的具有内部不可缓存和外部不可缓存 attributes.The 值的普通内存可以是结果属性，由任何允许的实现选择和任何适用的配置位确定，而不是出现在转换表描述符中的值。"
              condition: "当指令返回64 位值给PAR时，PAR.F==0"
              reset_info: "温复位；AU"
              values:
                - value: "0b00"
                  desc: "不可共享。"
                - value: "0b10"
                  desc: "外部可共享。"
                - value: "0b11"
                  desc: "内部可共享。"
            - name: "RES0"
              bits: "6:1"
              source_condition: "When the instruction returned a 64-bit value to the PAR, PAR.F==0"
              desc: "保留，RES0。"
              condition: "当指令返回64 位值给PAR时，PAR.F==0"
            - name: "F"
              bits: "0"
              source_condition: "When the instruction returned a 64-bit value to the PAR, PAR.F==0"
              desc: "指示指令是否执行了成功的地址转换。"
              condition: "当指令返回64 位值给PAR时，PAR.F==0"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "地址转换成功完成。"
            - name: "IMPLEMENTATION DEFINED"
              bits: "63:56"
              source_condition: "When the instruction returned a 64-bit value to the PAR, PAR.F==1"
              desc: "IMPLEMENTATION DEFINED。"
              condition: "当指令返回64 位值给PAR时，PAR.F==1"
              reset_info: "温复位；AU"
            - name: "IMPLEMENTATION DEFINED"
              bits: "55:52"
              source_condition: "When the instruction returned a 64-bit value to the PAR, PAR.F==1"
              desc: "IMPLEMENTATION DEFINED。"
              condition: "当指令返回64 位值给PAR时，PAR.F==1"
              reset_info: "温复位；AU"
            - name: "IMPLEMENTATION DEFINED"
              bits: "51:48"
              source_condition: "When the instruction returned a 64-bit value to the PAR, PAR.F==1"
              desc: "IMPLEMENTATION DEFINED。"
              condition: "当指令返回64 位值给PAR时，PAR.F==1"
              reset_info: "温复位；AU"
            - name: "RES0"
              bits: "47:12"
              source_condition: "When the instruction returned a 64-bit value to the PAR, PAR.F==1"
              desc: "保留，RES0。"
              condition: "当指令返回64 位值给PAR时，PAR.F==1"
            - name: "LPAE"
              bits: "11"
              source_condition: "When the instruction returned a 64-bit value to the PAR, PAR.F==1"
              desc: "当用地址转换操作的结果更新PAR时，该位设置如下："
              condition: "当指令返回64 位值给PAR时，PAR.F==1"
              reset_info: "温复位；AU"
              values:
                - value: "0b1"
                  desc: "使用长描述符转换表格式。这意味着 PAR 返回了一个 64 位值。"
            - name: "RES0"
              bits: "10"
              source_condition: "When the instruction returned a 64-bit value to the PAR, PAR.F==1"
              desc: "保留，RES0。"
              condition: "当指令返回64 位值给PAR时，PAR.F==1"
            - name: "FSTAGE"
              bits: "9"
              source_condition: "When the instruction returned a 64-bit value to the PAR, PAR.F==1"
              desc: "指示地址转换中止的地址转换阶段："
              condition: "当指令返回64 位值给PAR时，PAR.F==1"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "由于第 1 阶段地址转换出现错误，地址转换中止。"
                - value: "0b1"
                  desc: "由于第 2 阶段地址转换中出现错误，地址转换中止。"
            - name: "S2WLK"
              bits: "8"
              source_condition: "When the instruction returned a 64-bit value to the PAR, PAR.F==1"
              desc: "如果该位设置为 1，则表示由于第 1 阶段转换表遍历期间第 2 阶段故障而中止转换。"
              condition: "当指令返回64 位值给PAR时，PAR.F==1"
              reset_info: "温复位；AU"
            - name: "RES0"
              bits: "7"
              source_condition: "When the instruction returned a 64-bit value to the PAR, PAR.F==1"
              desc: "保留，RES0。"
              condition: "当指令返回64 位值给PAR时，PAR.F==1"
            - name: "FST"
              bits: "6:1"
              source_condition: "When the instruction returned a 64-bit value to the PAR, PAR.F==1"
              desc: "故障状态位域。使用长描述符转换表格式时，值与 DFSR.STATUS 和 IFSR.STATUS 位域中的值相同。"
              condition: "当指令返回64 位值给PAR时，PAR.F==1"
              reset_info: "温复位；AU"
              values:
                - value: "0b000000"
                  desc: "转换表基址寄存器中的地址大小错误。"
                - value: "0b000001"
                  desc: "地址大小错误，级别 1。"
                - value: "0b000010"
                  desc: "地址大小错误，级别 2。"
                - value: "0b000011"
                  desc: "地址大小错误，级别 3。"
                - value: "0b000101"
                  desc: "地址转换错误，1 级。"
                - value: "0b000110"
                  desc: "地址转换错误，2 级。"
                - value: "0b000111"
                  desc: "地址转换错误，3 级。"
                - value: "0b001001"
                  desc: "访问标志故障，级别 1。"
                - value: "0b001010"
                  desc: "访问标志故障，级别 2。"
                - value: "0b001011"
                  desc: "访问标志故障，级别 3。"
                - value: "0b001101"
                  desc: "权限错误，级别 1。"
                - value: "0b001110"
                  desc: "权限错误，级别 2。"
                - value: "0b001111"
                  desc: "权限错误，级别 3。"
                - value: "0b010101"
                  desc: "转换表行走上的同步外部中止，级别 1。"
                - value: "0b010110"
                  desc: "转换表行走上的同步外部中止，级别 2。"
                - value: "0b010111"
                  desc: "转换表行走上的同步外部中止，级别 3。"
                - value: "0b011101"
                  source_condition: "When FEAT_RAS is not implemented"
                  desc: "转换表遍历上的内存访问出现同步奇偶校验或 ECC 错误，级别 1。"
                  condition: "当 FEAT_RAS 未实现时"
                - value: "0b011110"
                  source_condition: "When FEAT_RAS is not implemented"
                  desc: "转换表遍历上的内存访问出现同步奇偶校验或 ECC 错误，级别 2。"
                  condition: "当 FEAT_RAS 未实现时"
                - value: "0b011111"
                  source_condition: "When FEAT_RAS is not implemented"
                  desc: "转换表遍历上的内存访问出现同步奇偶校验或 ECC 错误，级别 3。"
                  condition: "当 FEAT_RAS 未实现时"
                - value: "0b110000"
                  desc: "TLB 冲突中止。"
            - name: "F"
              bits: "0"
              source_condition: "When the instruction returned a 64-bit value to the PAR, PAR.F==1"
              desc: "指示指令是否执行了成功的地址转换。"
              condition: "当指令返回64 位值给PAR时，PAR.F==1"
              reset_info: "温复位；AU"
              values:
                - value: "0b1"
                  desc: "地址转换已中止。"
    - name: "GIC"
      title: "通用中断控制器（GIC）"
      access: "MRS / MSR 系统寄存器接口"
      desc: "Arm AArch32 架构系统寄存器：GIC"
      registers:
        - name: "ICH_AP0R<n>"
          desc: "提供有关 EL2 的组 0 活动优先级的信息。"
          condition: "当实现FEAT_AA32EL2时，实现GICv3，并且（实现EL2或实现EL3）"
          fields:
            - name: "P<x>"
              bits: "31:0"
              desc: "提供对第 0 组中断的虚拟活动优先级的访问。每个位的可能值为：\n优先级和位之间的对应关系取决于所实现的优先级的位数。如果实现5 位抢占（优先级位[7:3]），则抢占级别有32个，这些抢占级别的活动状态保存在Priority[7:3]对应位中的ICH_AP0R0中。如果实现 6 位抢占（优先级位 [7:2]），则有 64 个抢占级别，并且：\n抢占级别 0 - 124 的活动状态保存在 ICH_AP0R0 中对应于 0:Priority[6:2] 的位中。抢占级别 128 - 252 的活动状态保存在 ICH_AP0R1 中对应于 1:Priority[6:2] 的位中。如果实现 7 位抢占（优先级位 [7:1]），则有 128 个抢占级别，并且：\n抢占级别 0 - 62 的活动状态保存在 ICH_AP0R0 中对应于 00:Priority[5:1] 的位中。抢占级别 64 - 126 的活动状态保存在 ICH_AP0R1 中对应于 01:Priority[5:1] 的位中。抢占级别 128 - 190 的活动状态保存在 ICH_AP0R2 中对应于 10:Priority[5:1] 的位中。抢占级别 192 - 254 的活动状态保存在 ICH_AP0R3 中对应于 11:Priority[5:1] 的位中。将 ICH_AP0R<n> 和 ICH_AP1R<n> 中与优先级对应的位设置为 1 可能会导致虚拟中断的中断优先级系统出现 UNPREDICTABLE 行为。"
              reset_info: "温复位；0x00000000"
              values:
                - value: "0b0"
                  desc: "在与该位对应的优先级上没有活动的组 0 中断。"
                - value: "0b1"
                  desc: "有一个组 0 中断处于活动状态，其优先级对应于该位。"
        - name: "ICH_AP1R<n>"
          desc: "提供有关 EL2 的组 1 活动优先级的信息。"
          condition: "当实现FEAT_AA32EL2时，实现GICv3，并且（实现EL2或实现EL3）"
          fields:
            - name: "P<x>"
              bits: "31:0"
              desc: "第 1 组中断活动优先级。每个位的可能值为：\n优先级和位之间的对应关系取决于所实现的优先级的位数。如果实现5 位抢占（优先级位[7:3]），则抢占级别有32个，这些抢占级别的活动状态保存在Priority[7:3]对应位中的ICH_AP1R0中。如果实现 6 位抢占（优先级位 [7:2]），则有 64 个抢占级别，并且：\n抢占级别 0 - 124 的活动状态保存在 ICH_AP1R0 中对应于 0:Priority[6:2] 的位中。抢占级别 128 - 252 的活动状态保存在 ICH_AP1R1 中对应于 1:Priority[6:2] 的位中。如果实现 7 位抢占（优先级位 [7:1]），则有 128 个抢占级别，并且：\n抢占级别 0 - 62 的活动状态保存在 ICH_AP1R0 中对应于 00:Priority[5:1] 的位中。抢占级别 64 - 126 的活动状态保存在 ICH_AP1R1 中对应于 01:Priority[5:1] 的位中。抢占级别 128 - 190 的活动状态保存在 ICH_AP1R2 中对应于 10:Priority[5:1] 的位中。抢占级别 192 - 254 的活动状态保存在 ICH_AP1R3 中对应于 11:Priority[5:1] 的位中。\n将 ICH_AP0R<n> 和 ICH_AP1R<n> 中与优先级相对应的位设置为 1 可能会导致虚拟中断的中断优先级系统出现 UNPREDICTABLE 行为。"
              reset_info: "温复位；0x00000000"
              values:
                - value: "0b0"
                  desc: "在与该位相对应的优先级上没有活动的组 1 中断。"
                - value: "0b1"
                  desc: "有一个组 1 中断处于活动状态，其优先级对应于该位。"
        - name: "ICH_EISR"
          desc: "指示哪些列表寄存器具有未完成的 EOI 维护中断。"
          condition: "当实现FEAT_AA32EL2时，实现GICv3，并且（实现EL2或实现EL3）"
          fields:
            - name: "RES0"
              bits: "31:16"
              desc: "保留，RES0。"
            - name: "Status<n>"
              bits: "15:0"
              desc: "EOI List寄存器<n>维护中断状态位：\n对于任何 ICH_LR<n>，如果满足以下所有条件，则相应的状态位设置为 1：\nICH_LRC<n>。状态为 0b00。 ICH_LRC<n>.HW 为 0。ICH_LRC<n>.EOI（位[9]）为 1，表示当对应于该 List 寄存器的中断被禁用时，维护中断被置位。"
              reset_info: "温复位；0x0000"
              values:
                - value: "0b0"
                  desc: "列表寄存器<n>，ICH_LR<n>，没有EOI 维护中断。"
                - value: "0b1"
                  desc: "列表寄存器 <n>，ICH_LR<n>，有一个尚未处理的 EOI 维护中断。"
        - name: "ICH_ELRSR"
          desc: "指示哪些列表寄存器包含有效中断。"
          condition: "当实现FEAT_AA32EL2时，实现GICv3，并且（实现EL2或实现EL3）"
          fields:
            - name: "RES0"
              bits: "31:16"
              desc: "保留，RES0。"
            - name: "Status<n>"
              bits: "15:0"
              desc: "列表寄存器 <n>、ICH_LR<n> 的状态位：\n对于任何列表寄存器 <n>，如果 ICH_LRC<n>.State 为 0b00 并且 ICH_LRC<n>.HW 为 1 或 ICH_LRC<n>.EOI（位 [9]）为 0，则相应的状态位设置为 1。"
              values:
                - value: "0b0"
                  desc: "列表寄存器 ICH_LR<n>（如果实现）包含有效中断。使用该列表寄存器可能会导致覆盖有效中断。"
                - value: "0b1"
                  desc: "列表寄存器 ICH_LR<n> 不包含有效中断。列表寄存器为空，可以在不覆盖有效中断或丢失 EOI 维护中断的情况下使用。"
        - name: "ICH_HCR"
          desc: "控制虚拟机的环境。"
          condition: "当实现FEAT_AA32EL2时，实现GICv3，并且（实现EL2或实现EL3）"
          fields:
            - name: "EOIcount"
              bits: "31:27"
              desc: "每当成功写入虚拟 EOIR 或 DIR 寄存器并导致虚拟中断停用时，该位域就会递增。即：\n当 EOI 模式为零且未找到列表寄存器时，使用不在 LPI 范围（即 < 8192）内的有效中断标识符对 EOIR 进行虚拟写入。当 EOI 模式为 1 并且未找到列表寄存器时，使用不在 LPI 范围（即 < 8192）内的有效中断标识符对 DIR 进行虚拟写入。这使得软件能够管理比已实现的列表寄存器更多的活动中断。 CONSTRAINED UNPREDICTABLE 对 EOIR 的虚拟写入（不清除活动优先级寄存器（ICH_AP0R<n>/ICH_AP1R<n>）中的位）是否会增加 EOIcount。允许的行为有：\n增加 EOI 计数。保持 EOIcount 不变。"
              reset_info: "温复位；'00000'"
            - name: "RES0"
              bits: "26:15"
              desc: "保留，RES0。"
            - name: "TDIR"
              bits: "14"
              source_condition: "When FEAT_GICv3_TDIR is implemented"
              desc: "陷阱非安全 EL1 写入 ICC_DIR 和 ICV_DIR。 Arm 不赞成不包含此陷阱位。"
              condition: "当实现FEAT_GICv3_TDIR时"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "ICC_DIR 和 ICV_DIR 的非安全 EL1 写入不会陷入 EL2，除非被其他机制捕获。"
                - value: "0b1"
                  desc: "ICV_DIR 的非安全 EL1 写入陷入 EL2。 ICC_DIR的非安全写是否被捕获为 IMPLEMENTATION DEFINED。不捕获 ICC_DIR 写入的是 DEPRECATED。"
            - name: "RES0"
              bits: "14"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "TSEI"
              bits: "13"
              desc: "捕获所有本地生成的 SEI。该位允许管理程序拦截本地生成的 SEI，否则这些 SEI 会在非安全 EL1 处获取。如果ICH_VTR.SEIS为0，则该位为 RES0。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "本地生成的 SEI 不会导致 EL2 陷阱。"
                - value: "0b1"
                  desc: "本地生成的 SEI 陷阱为 EL2。"
            - name: "TALL1"
              bits: "12"
              desc: "捕获对 ICC_* 和 ICV_* 系统寄存器的所有非安全 EL1 访问，用于 EL2 的组 1 中断。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "非安全 EL1 对第 1 组中断的 ICC_* 和 ICV_* 寄存器的访问照常进行。"
                - value: "0b1"
                  desc: "非安全 EL1 访问 ICC_* 和 ICV_* 寄存器，以将第 1 组中断陷阱陷入 EL2。"
            - name: "TALL0"
              bits: "11"
              desc: "捕获对 ICC_* 和 ICV_* 系统寄存器的所有非安全 EL1 访问，以将组 0 中断发送至 EL2。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "非安全 EL1 对第 0 组中断的 ICC_* 和 ICV_* 寄存器的访问照常进行。"
                - value: "0b1"
                  desc: "非安全 EL1 访问 ICC_* 和 ICV_* 寄存器，以将组 0 中断陷阱陷入 EL2。"
            - name: "TC"
              bits: "10"
              desc: "捕获对 EL2 的组 0 和组 1 共用的系统寄存器的所有非安全 EL1 访问。这会影响对 ICC_SGI0R、ICC_SGI1R、ICC_ASGI1R、ICC_CTLR、ICC_DIR、ICC_PMR、ICC_RPR、ICV_CTLR、ICV_DIR、 ICV_PMR 和 ICV_RPR。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "对公共寄存器的非安全 EL1 访问正常进行。"
                - value: "0b1"
                  desc: "非安全 EL1 访问公共寄存器陷阱到 EL2。"
            - name: "RES0"
              bits: "9"
              desc: "保留，RES0。"
            - name: "vSGIEOICount"
              bits: "8"
              source_condition: "When GICv4.1 is implemented"
              desc: "控制虚拟 SGI 的停用是否可以增加 ICH_HCR_EL2.EOIcount"
              condition: "当GICv4.1实现时"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "停用虚拟 SGI 会增加 ICH_HCR.EOIcount。"
                - value: "0b1"
                  desc: "停用虚拟 SGI 不会增加 ICH_HCR.EOIcount。"
            - name: "RES0"
              bits: "8"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "VGrp1DIE"
              bits: "7"
              desc: "VM 第 1 组禁用中断启用。启用维护中断信令，同时禁用从虚拟 CPU 接口到连接的 vPE 的组 1 中断信令："
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "维护中断已禁用。"
                - value: "0b1"
                  desc: "当 ICH_VMCR.VENG1 为 0 时发出维护中断信号。"
            - name: "VGrp1EIE"
              bits: "6"
              desc: "VM 第 1 组使能中断使能。当启用从虚拟 CPU 接口到连接的 vPE 的组 1 中断信号时，启用维护中断信号："
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "维护中断已禁用。"
                - value: "0b1"
                  desc: "当 ICH_VMCR.VENG1 为 1 时发出维护中断信号。"
            - name: "VGrp0DIE"
              bits: "5"
              desc: "VM 第 0 组禁用中断启用。启用维护中断信令，同时禁用从虚拟 CPU 接口到连接的 vPE 的组 0 中断信令："
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "维护中断已禁用。"
                - value: "0b1"
                  desc: "当 ICH_VMCR.VENG0 为 0 时发出维护中断信号。"
            - name: "VGrp0EIE"
              bits: "4"
              desc: "VM 组 0 使能中断使能。当启用从虚拟 CPU 接口到连接的 vPE 的组 0 中断信号时，启用维护中断信号："
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "维护中断已禁用。"
                - value: "0b1"
                  desc: "当 ICH_VMCR.VENG0 为 1 时发出维护中断信号。"
            - name: "NPIE"
              bits: "3"
              desc: "无挂起中断启用。当没有状态位域设置为 0b01（待处理）的列表寄存器时，启用维护中断信号："
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "维护中断已禁用。"
                - value: "0b1"
                  desc: "当列表寄存器不包含处于挂起状态的中断时，发出维护中断信号。"
            - name: "LRENPIE"
              bits: "2"
              desc: "列表寄存器条目不存在中断启用。当虚拟 CPU 接口没有针对 EOI 请求的相应有效列表寄存器条目时，启用维护中断信号："
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "维护中断已禁用。"
                - value: "0b1"
                  desc: "当 EOIcount 位域不为 0 时，维护中断被置位。"
            - name: "UIE"
              bits: "1"
              desc: "下溢中断启用。当列表寄存器为空或仅保存一个有效条目时，启用维护中断信号："
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "维护中断已禁用。"
                - value: "0b1"
                  desc: "如果没有或只有一个列表寄存器条目被标记为有效中断，则维护中断被断言。"
            - name: "En"
              bits: "0"
              desc: "启用。虚拟 CPU 接口的全局使能位：\n当该位域设置为0时：\n虚拟 CPU 接口不会发出任何维护中断信号。虚拟 CPU 接口不发出任何虚拟中断信号。读取 ICV_IAR0、ICV_IAR1、GICV_IAR 或 GICV_AIAR 会返回虚假中断 ID。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "虚拟 CPU 接口操作已禁用。"
                - value: "0b1"
                  desc: "启用虚拟 CPU 接口操作。"
        - name: "ICH_LR<n>"
          desc: "提供虚拟 CPU 接口的中断上下文信息。"
          condition: "当实现FEAT_AA32EL2时，实现GICv3，并且（实现EL2或实现EL3）"
          fields:
            - name: "vINTID"
              bits: "31:0"
              desc: "虚拟INTID的中断。如果 vINTID 的值为 1020-1023 且 ICH_LRC<n>.State!=0b00（无效），则行为为 UNPREDICTABLE。如果两个或多个列表寄存器在以下情况下指定相同的 vINTID，则行为为 UNPREDICTABLE：\nICH_LRC<n>.State == 01. ICH_LRC<n>.State == 10. ICH_LRC<n>.State == 11. IMPLEMENTATION DEFINED 实现了多少位，但至少必须实现 16 位。未实现的位是 RES0。实现的位数可以从ICH_VTR.IDbits中找到。当VM使用内存映射访问GIC时，软件必须确保在位[12:10]中提供正确的源PEID。"
              reset_info: "温复位；0x00000000"
        - name: "ICH_LRC<n>"
          desc: "提供虚拟 CPU 接口的中断上下文信息。"
          condition: "当实现FEAT_AA32EL2时，实现GICv3，并且（实现EL2或实现EL3）"
          fields:
            - name: "State"
              bits: "31:30"
              desc: "中断的状态：\n当虚拟中断在中断生命周期中进行时，GIC 会更新这些状态位。处于无效状态的条目将被忽略，除非是为了生成虚拟维护中断。对于硬件中断，挂起和活动状态保存在物理分发器中，而不是虚拟 CPU 接口中。虚拟机管理程序必须仅对软件发起的中断使用挂起和活动状态，这些中断通常与虚拟设备或 SGI 关联。"
              reset_info: "温复位；'00'"
              values:
                - value: "0b00"
                  desc: "无效（无效）。"
                - value: "0b01"
                  desc: "待定。"
                - value: "0b10"
                  desc: "活跃。"
                - value: "0b11"
                  desc: "待定和活动。"
            - name: "HW"
              bits: "29"
              desc: "指示这个虚拟中断是否直接映射到硬件中断，也就是说它对应的是物理中断。虚拟中断的停用也会导致物理中断的停用INTIDpINTID位域指示。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "中断完全由软件触发。当虚拟中断被停用时，不会向分发器发送任何通知。"
                - value: "0b1"
                  desc: "该中断直接映射到硬件中断。当虚拟中断被停用时，停用中断请求被发送到分配器，使用该寄存器中的pINTID位域来指示物理中断INTID。如果ICH_VMCR.VEOIM为0，则该请求对应于写入ICC_EOIR0或ICC_EOIR1。否则，它对应于写入ICC_DIR。"
            - name: "Group"
              bits: "28"
              desc: "指示该虚拟中断的组。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "这是第 0 组虚拟中断。 ICH_VMCR.VFIQEn 确定它是作为虚拟 IRQ 还是作为虚拟 FIQ 发出信号，并且 ICH_VMCR.VENG0 启用向虚拟机发送该中断的信号。"
                - value: "0b1"
                  desc: "这是第 1 组虚拟中断，表示为虚拟 IRQ。 ICH_VMCR.VENG1 启用向虚拟机发送该中断的信号。如果 ICH_VMCR.VCBPR 为 0，则 ICC_BPR1 确定待处理的第 1 组中断是否具有足够的优先级来抢占当前执行。否则，ICH_LR<n> 确定抢占。"
            - name: "RES0"
              bits: "27:24"
              desc: "保留，RES0。"
            - name: "Priority"
              bits: "23:16"
              desc: "该中断的优先级。它是 IMPLEMENTATION DEFINED 实现了多少位优先级，但至少必须实现 5 位。未实现的位是 RES0，从位[16]开始到位[18]。实现的位数可以从ICH_VTR.PRIbits中找到。"
              reset_info: "温复位；0x00"
            - name: "RES0"
              bits: "15:13"
              desc: "保留，RES0。"
            - name: "pINTID"
              bits: "12:0"
              desc: "物理INTID，用于硬件中断。当ICH_LRC<n>.HW为0(没有对应的物理中断)时，该位域含义如下：\n位[12:10]：RES0。位[9]：EOI。如果该位为 1，则当 vINTID 标识的中断被停用时，EOI 维护中断被置位。位[8:0]：保留，RES0。当ICH_LRC<n>.HW为1时（有对应的物理中断）：\n该位域表示物理INTID。该位域仅需要实现足够的位来保存已实现的 INTID 大小的有效值。任何未使用的高阶位都是 RES0。当ICC_CTLR_EL1.ExtRange为0时，则该位域的位[44:42]为 RES0。如果 pINTID 的值不是有效的 INTID，则行为为 UNPREDICTABLE。如果pINTID的值指示PPI，则该位域适用于与请求去激活的虚拟CPU接口相同的物理PEID关联的PPI。仅对于需要停用的中断，列表寄存器中才需要硬件物理标识符。这意味着无论 ICC_CTLR.IDbits 指定的数字是多少，仅需要 13 位物理 INTID。"
              reset_info: "温复位；'0000000000000'"
        - name: "ICH_MISR"
          desc: "指示哪些维护中断被置位。"
          condition: "当实现FEAT_AA32EL2时，实现GICv3，并且（实现EL2或实现EL3）"
          fields:
            - name: "RES0"
              bits: "31:8"
              desc: "保留，RES0。"
            - name: "VGrp1D"
              bits: "7"
              desc: "vPE 第 1 组禁用。当 ICH_HCR.VGrp1DIE 为 1 并且 ICH_VMCR.VENG0 为 0 时，该维护中断被置位。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "vPE 第 1 组禁用维护中断未置位。"
                - value: "0b1"
                  desc: "vPE 第 1 组已禁用维护中断已生效。"
            - name: "VGrp1E"
              bits: "6"
              desc: "vPE 组 1 已启用。当 ICH_HCR.VGrp1EIE 为 1 并且 ICH_VMCR.VENG1 为 1 时，该维护中断被置位。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "vPE 第 1 组已启用维护中断未置位。"
                - value: "0b1"
                  desc: "vPE 第 1 组启用维护中断已置位。"
            - name: "VGrp0D"
              bits: "5"
              desc: "vPE 组 0 禁用。当 ICH_HCR.VGrp0DIE 为 1 并且 ICH_VMCR.VENG0 为 0 时，该维护中断被置位。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "vPE 组 0 禁用维护中断未置位。"
                - value: "0b1"
                  desc: "vPE 组 0 已禁用维护中断已生效。"
            - name: "VGrp0E"
              bits: "4"
              desc: "vPE 组 0 已启用。当 ICH_HCR.VGrp0EIE 为 1 并且 ICH_VMCR.VENG0 为 1 时，该维护中断被置位。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "vPE 组 0 已启用维护中断未置位。"
                - value: "0b1"
                  desc: "vPE 组 0 启用维护中断已置位。"
            - name: "NP"
              bits: "3"
              desc: "没有待处理。当 ICH_HCR.NPIE 为 1 并且没有列表寄存器处于挂起状态时，该维护中断被置位。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "未断言未决维护中断。"
                - value: "0b1"
                  desc: "未声明待处理维护中断。"
            - name: "LRENP"
              bits: "2"
              desc: "列表寄存器条目不存在。当 ICH_HCR.LRENPIE 为 1 并且 ICH_HCR.EOIcount 非零时，该维护中断被置位。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "列表寄存器条目不存在 维护中断未生效。"
                - value: "0b1"
                  desc: "列表寄存器条目不存在维护中断已生效。"
            - name: "U"
              bits: "1"
              desc: "下溢。当 ICH_HCR.UIE 为 1 并且 0 或列表寄存器条目之一被标记为有效中断时，即相应的 ICH_LRC<n>.State 位不等于 0x0，则断言此维护中断。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "未声明下溢维护中断。"
                - value: "0b1"
                  desc: "下溢维护中断已生效。"
            - name: "EOI"
              bits: "0"
              desc: "中断结束。当 ICH_EISR 中至少一位为 1 时，该维护中断被置位。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "中断结束维护中断未置位。"
                - value: "0b1"
                  desc: "中断结束维护中断有效。"
        - name: "ICH_VMCR"
          desc: "使管理程序能够保存和恢复 GIC 状态的虚拟机视图。"
          condition: "当实现FEAT_AA32EL2时，实现GICv3，并且（实现EL2或实现EL3）"
          fields:
            - name: "VPMR"
              bits: "31:24"
              desc: "虚拟优先级掩码。虚拟 CPU 接口的优先级掩码级别。如果待处理的虚拟中断的优先级高于该位域指示的值，则接口向PE发出虚拟中断信号。该位域是 ICV_PMR.Priority 的别名。"
              reset_info: "温复位；AU"
            - name: "VBPR0"
              bits: "23:21"
              desc: "虚拟二进制点寄存器，组 0。定义优先级值位域分为两部分的点：组优先级位域和子优先级位域。组优先级位域决定组 0 中断抢占，如果 ICH_VMCR.VCBPR == 1，还决定组 1 中断抢占。该位域是 ICV_BPR0.BinaryPoint 的别名。"
              reset_info: "温复位；AU"
            - name: "VBPR1"
              bits: "20:18"
              desc: "虚拟二进制点寄存器，组 1。定义优先级值位域分为两部分的点：组优先级位域和子优先级位域。如果 ICH_VMCR.VCBPR == 0，组优先级位域确定组 1 中断抢占。该位域是 ICV_BPR1.BinaryPoint 的别名。"
              reset_info: "温复位；AU"
            - name: "RES0"
              bits: "17:10"
              desc: "保留，RES0。"
            - name: "VEOIM"
              bits: "9"
              desc: "虚拟EOI模式。控制对中断结束寄存器的写入是否也会停用虚拟中断：\n该位是 ICV_CTLR.EOImode 的别名。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "ICV_EOIR0 和 ICV_EOIR1 提供优先级下降和中断停用功能。对ICV_DIR的访问是 UNPREDICTABLE。"
                - value: "0b1"
                  desc: "ICV_EOIR0 和 ICV_EOIR1 仅提供优先级下降功能。 ICV_DIR 提供中断停用功能。"
            - name: "RES0"
              bits: "8:5"
              desc: "保留，RES0。"
            - name: "VCBPR"
              bits: "4"
              desc: "虚拟公共二进制点寄存器。该位的可能值为：\n该位域是 ICV_CTLR.CBPR 的别名。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "ICV_BPR0 仅确定虚拟组 0 中断的抢占组。 ICV_BPR1 确定虚拟组 1 中断的抢占组。"
                - value: "0b1"
                  desc: "ICV_BPR0 确定虚拟组 0 和虚拟组 1 中断的抢占组。读取 ICV_BPR1 返回 ICV_BPR0 加一，饱和为 0b111。对 ICV_BPR1 的写入将被忽略。"
            - name: "VFIQEn"
              bits: "3"
              desc: "虚拟 FIQ 启用。该位的可能值为：\n该位是 GICV_CTLR.FIQEn 的别名。在 ICC_SRE.SRE 的非安全副本始终为 1 的实现中，该位为 RES1。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "第 0 组虚拟中断表示为虚拟 IRQ。"
                - value: "0b1"
                  desc: "第 0 组虚拟中断表示为虚拟 FIQ。"
            - name: "VAckCtl"
              bits: "2"
              desc: "虚拟AckCtl。该位的可能值为：\n该位是 GICV_CTLR.AckCtl 的别名。支持该位域是为了向后兼容 GICv2。 Arm 不赞成使用该位域。在 ICC_SRE.SRE 的非安全副本始终为 1 的实现中，该位为 RES0。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "如果最高优先级待处理中断是组 1，则读取 GICV_IAR 或 GICV_HPPIR 将返回 INTID 1022。"
                - value: "0b1"
                  desc: "如果最高优先级待处理中断是组 1，则读取 GICV_IAR 或 GICV_HPPIR 将返回相应中断的 INTID。"
            - name: "VENG1"
              bits: "1"
              desc: "虚拟组 1 中断使能。该位的可能值为：\n该位是 ICV_IGRPEN1.Enable 的别名。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "虚拟组 1 中断被禁用。"
                - value: "0b1"
                  desc: "虚拟组 1 中断已启用。"
            - name: "VENG0"
              bits: "0"
              desc: "虚拟组 0 中断使能。该位的可能值为：\n该位是 ICV_IGRPEN0.Enable 的别名。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "虚拟组 0 中断被禁用。"
                - value: "0b1"
                  desc: "虚拟组 0 中断已启用。"
        - name: "ICH_VTR"
          desc: "报告支持的 GIC 虚拟化功能。"
          condition: "当实现FEAT_AA32EL2时，实现GICv3，并且（实现EL2或实现EL3）"
          fields:
            - name: "PRIbits"
              bits: "31:29"
              desc: "优先级位。实现的虚拟优先级位数减一。实现必须实现至少 32 级虚拟优先级（5 个优先级位）。该位域是 ICV_CTLR.PRIbits 的别名。"
              values:
                - value: "0b100..0b110"
                  desc: "实现的虚拟优先级位数减一。"
            - name: "PREbits"
              bits: "28:26"
              desc: "实现的虚拟抢占位数减一。实现必须实现至少 32 级虚拟抢占优先级（5 个抢占位）。该位域的值必须小于或等于ICH_VTR.PRIbits的值。"
              values:
                - value: "0b000..0b110"
                  desc: "实现的虚拟抢占位数减一。"
            - name: "IDbits"
              bits: "25:23"
              desc: "支持的虚拟中断标识符位数：\n所有其他值均被保留。该位域是 ICV_CTLR.IDbits 的别名。"
              values:
                - value: "0b000"
                  desc: "16 位。"
                - value: "0b001"
                  desc: "24 位。"
            - name: "SEIS"
              bits: "22"
              desc: "SEI 支持。指示虚拟CPU接口是否支持生成SEI：\n该位是 ICV_CTLR.SEIS 的别名。"
              values:
                - value: "0b0"
                  desc: "虚拟CPU接口逻辑不支持SEI的生成。"
                - value: "0b1"
                  desc: "虚拟CPU接口逻辑支持SEI的生成。"
            - name: "A3V"
              bits: "21"
              desc: "亲和力 3 有效。可能的值为：\n该位是 ICV_CTLR.A3V 的别名。"
              values:
                - value: "0b0"
                  desc: "虚拟 CPU 接口逻辑仅支持 SGI 代系统寄存器中 Affinity 3 的零值。"
                - value: "0b1"
                  desc: "虚拟 CPU 接口逻辑支持 SGI 代系统寄存器中 Affinity 3 的非零值。"
            - name: "nV4"
              bits: "20"
              desc: "不支持直接注入虚拟中断。可能的值为：\n在GICv3中，唯一允许的值为1。"
              values:
                - value: "0b0"
                  desc: "CPU接口逻辑支持直接注入虚拟中断。"
                - value: "0b1"
                  desc: "CPU接口逻辑不支持直接注入虚拟中断。"
            - name: "TDS"
              bits: "19"
              desc: "支持单独捕获非安全 EL1 写入 ICV_DIR。 FEAT_GICv3_TDIR实现了值1添加的功能。"
              values:
                - value: "0b0"
                  desc: "实现不支持ICH_HCR.TDIR。"
                - value: "0b1"
                  desc: "实现支持ICH_HCR.TDIR。"
            - name: "RES0"
              bits: "18:5"
              desc: "保留，RES0。"
            - name: "ListRegs"
              bits: "4:0"
              desc: "已实现的列表寄存器的数量减一。例如，值 0b01111 表示最多实现 16 个列表寄存器。"
              values:
                - value: "0b00000..0b01111"
                  desc: "实现的列表寄存器的数量减一。"
    - name: "GIC control registers"
      title: "GIC 控制寄存器"
      access: "MRS / MSR 系统寄存器接口"
      desc: "Arm AArch32 架构系统寄存器：GIC控制寄存器"
      registers:
        - name: "ICC_AP0R<n>"
          desc: "提供有关组 0 活动优先级的信息。"
          condition: "当FEAT_AA32EL1被实现并且GICv3被实现时"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:0"
              desc: "IMPLEMENTATION DEFINED。"
              reset_info: "温复位；0x00000000"
        - name: "ICC_AP1R<n>"
          desc: "提供有关第 1 组活动优先级的信息。"
          condition: "当FEAT_AA32EL1被实现并且GICv3被实现时"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:0"
              desc: "IMPLEMENTATION DEFINED。"
              reset_info: "温复位；0x00000000"
        - name: "ICC_ASGI1R"
          desc: "为非当前安全状态的安全状态生成组 1 SGI。"
          condition: "当FEAT_AA32EL1被实现并且GICv3被实现时"
          fields:
            - name: "RES0"
              bits: "63:56"
              desc: "保留，RES0。"
            - name: "Aff3"
              bits: "55:48"
              desc: "将生成 SGI 个中断的集群的关联路径的关联性 3 值。如果IRM位为1，则该位域为 RES0。"
            - name: "RS"
              bits: "47:44"
              desc: "RangeSelector 控制 TargetList 位域表示哪一组 16 个值。 TargetList[n]表示aff0值((RS * 16) + n)。当ICC_CTLR_EL1.RSS==0时，RS为 RES0。当 ICC_CTLR_EL1.RSS==1 且 GICD_TYPER.RSS==0 时，用 RS != 0 写入该寄存器是 CONSTRAINED UNPREDICTABLE 的选择：\n写入被忽略。 RS位域被视为0。"
            - name: "RES0"
              bits: "43:41"
              desc: "保留，RES0。"
            - name: "IRM"
              bits: "40"
              desc: "中断路由模式。确定如何将生成的中断分配给 PE。可能的值为："
              values:
                - value: "0b0"
                  desc: "中断路由到 Aff3.Aff2.Aff1.<目标列表> 指定的 PE。"
                - value: "0b1"
                  desc: "中断路由到系统中的所有 PE，不包括“自身”。"
            - name: "Aff2"
              bits: "39:32"
              desc: "将生成 SGI 个中断的集群的关联路径的关联 2 值。如果IRM位为1，则该位域为 RES0。"
            - name: "RES0"
              bits: "31:28"
              desc: "保留，RES0。"
            - name: "INTID"
              bits: "27:24"
              desc: "SGI的INTID。"
            - name: "Aff1"
              bits: "23:16"
              desc: "将生成 SGI 个中断的集群的关联路径的关联 1 值。如果IRM位为1，则该位域为 RES0。"
            - name: "TargetList"
              bits: "15:0"
              desc: "目标清单。将生成 SGI 中断的 PE 集。每个位对应于簇内的PE，亲和力0值等于位号。如果仅针对安全 EL3 设置 SRE，则在 EL3 上执行的软件可能会使用系统寄存器接口来生成 SGI。因此，分发器必须始终能够接收并确认从 CPU 接口收到的生成 SGI 数据包，无论安全状态的 ARE 设置如何。但是，分发服务器可能会丢弃此类数据包。如果IRM位为1，则该位域为 RES0。如果某个位为 1 并且该位不对应于有效目标 PE，则分发器必须忽略该位。在这种情况下，分销商是否可以发出系统错误信号是 IMPLEMENTATION DEFINED。"
        - name: "ICC_BPR0"
          desc: "定义优先级值位域分为两部分的点：组优先级位域和子优先级位域。组优先级位域决定组 0 中断抢占。"
          condition: "当FEAT_AA32EL1被实现并且GICv3被实现时"
          fields:
            - name: "RES0"
              bits: "31:3"
              desc: "保留，RES0。"
            - name: "BinaryPoint"
              bits: "2:0"
              desc: "该位域的值控制 8 位中断优先级位域如何分为确定中断抢占的组优先级位域和子优先级位域。这是按如下方式完成的：\n二进制小数点valueGroup优先fieldSubpriorityfieldField带二进制point0[7:1][0]ggggggg.s1[7:2][1:0]gggggg.ss2[7:3][2:0]ggggg.sss3[7:4][3:0]gggg.ssss4[7:5][4:0]ggg.sssss5[7:6][5:0]gg.ssssss6[7][6:0]g.sssssss7Nopreemption[7:0].ssssssss"
              reset_info: "温复位；AU"
        - name: "ICC_BPR1"
          desc: "定义优先级值位域分为两部分的点：组优先级位域和子优先级位域。组优先级位域决定组 1 中断抢占。"
          condition: "当FEAT_AA32EL1被实现并且GICv3被实现时"
          fields:
            - name: "RES0"
              bits: "31:3"
              desc: "保留，RES0。"
            - name: "BinaryPoint"
              bits: "2:0"
              desc: "如果 GIC 配置为对组 0 和组 1 中断使用单独的二进制小数点位域，则该位域的值控制如何将 8 位中断优先级位域拆分为组优先级位域（确定中断抢占）和子优先级位域。有关优先级的详细信息，请参阅 ARM® 通用中断控制器架构规范、GIC 架构版本 3.0 和版本 4.0 (ARM IHI 0069) 中的“优先级分组”。向该位域写入 0 将会将该位域设置为其重置值。如果实现 EL3 并且 ICC_MCTLR.CBPR_EL1S 为 1：\n不在监控模式下访问 EL3 的该寄存器会访问 ICC_BPR0 的状态。当SCR_EL3.EEL2为1并且HCR_EL2.IMO为1时，在EL1对该寄存器的安全访问访问ICV_BPR1的状态。否则，在 EL1 处对该寄存器进行安全访问会访问 ICC_BPR0 的状态。如果实现 EL3 并且 ICC_MCTLR.CBPR_EL1NS 为 1，则在 EL1 和 EL2 处对该寄存器进行非安全访问的行为如下，具体取决于 HCR.IMO 和 SCR.IRQ 的值：\nHCR.IMOSCR_IRQBehavior0b00b0Non-安全 EL1 和 EL2 读取返回 ICC_BPR0 + 1 饱和为 0b111。非安全 EL1 和 EL2 写入将被忽略。0b00b1非安全 EL1 和 EL2 访问陷阱 EL3。0b10b0非安全 EL1 访问影响虚拟中断。非安全 EL2 读取返回 ICC_BPR0 + 1 饱和为 0b111。非安全 EL2 写入被忽略。0b10b1非安全 EL1 访问会影响虚拟中断。非安全 EL2 访问陷阱 EL3。如果 EL3 未实现且 ICC_CTLR.CBPR 为 1，则在 EL1 和 EL2 处对该寄存器进行非安全访问的行为如下，具体取决于 HCR.IMO 的值：\nHCR.IMOBehavior0b0Non-安全 EL1 和 EL2 读取返回 ICC_BPR0 + 1 饱和为 0b111。非安全 EL1 和 EL2 写入将被忽略。0b1非安全 EL1 访问会影响虚拟中断。非安全 EL2 读取返回 ICC_BPR0 + 1 饱和为 0b111。非安全 EL2 写入将被忽略。"
              reset_info: "该位域重置为 IMPLEMENTATION DEFINED 非零值。"
        - name: "ICC_CTLR"
          desc: "控制 GIC CPU 接口行为的各个方面，并提供有关所实现功能的信息。"
          condition: "当FEAT_AA32EL1被实现并且GICv3被实现时"
          fields:
            - name: "RES0"
              bits: "31:20"
              desc: "保留，RES0。"
            - name: "ExtRange"
              bits: "19"
              desc: "扩展 INTID 范围。如果实现了EL3，则ICC_CTLR_EL1.ExtRange是ICC_CTLR_EL3.ExtRange的别名。"
              values:
                - value: "0b0"
                  desc: "CPU 接口不支持 1024..8191 范围内的 INTID。如果 IRI 向 CPU 接口传送 1024 至 8191 范围内的中断，则行为为 UNPREDICTABLE。 Arm 强烈建议不要将 IRI 配置为将此范围内的中断传递给不支持这些中断的 PE。"
                - value: "0b1"
                  desc: "CPU 接口支持 1024..8191 范围内的 INTID。 1024..8191 范围内的所有 INTID 均被视为需要停用。"
            - name: "RSS"
              bits: "18"
              desc: "范围选择器支持。"
              values:
                - value: "0b0"
                  desc: "支持亲和力级别 0 值为 0 - 15 的目标 SGI。"
                - value: "0b1"
                  desc: "支持亲和力级别 0 值为 0 - 255 的目标 SGI。"
            - name: "RES0"
              bits: "17:16"
              desc: "保留，RES0。"
            - name: "A3V"
              bits: "15"
              desc: "亲和力 3 有效。如果EL3被实现并使用AArch32，则该位是ICC_MCTLR.A3V的别名。如果EL3被实现并使用AArch64，则该位是ICC_CTLR_EL3.A3V的别名。"
              values:
                - value: "0b0"
                  desc: "CPU 接口逻辑仅支持 SGI 代系统寄存器中 Affinity 3 的零值。"
                - value: "0b1"
                  desc: "CPU 接口逻辑支持 SGI 代系统寄存器中 Affinity 3 的非零值。"
            - name: "SEIS"
              bits: "14"
              desc: "SEI 支持。 CPU接口是否支持本地生成SEI。如果EL3被实现并使用AArch32，则该位是ICC_MCTLR.SEIS的别名。如果EL3被实现并使用AArch64，则该位是ICC_CTLR_EL3.SEIS的别名。"
              values:
                - value: "0b0"
                  desc: "CPU接口逻辑不支持本地生成SEI。"
                - value: "0b1"
                  desc: "CPU接口逻辑支持SEI的本地生成。"
            - name: "IDbits"
              bits: "13:11"
              desc: "标识符位。支持的物理中断标识符位数。所有其他值均被保留。如果EL3被实现并使用AArch32，则该位域是ICC_MCTLR.IDbits的别名。如果EL3被实现并使用AArch64，则该位域是ICC_CTLR_EL3.IDbits的别名。"
              values:
                - value: "0b000"
                  desc: "16 位。"
                - value: "0b001"
                  desc: "24 位。"
            - name: "PRIbits"
              bits: "10:8"
              desc: "优先级位。实现的优先级位数减一。支持两种安全状态的实现必须实现至少 32 级物理优先级（5 个优先级位）。仅支持单个安全状态的实现必须实现至少 16 个物理优先级级别（4 个优先级位）。该位域始终返回已实现的优先级位数，无论访问的安全状态或二进制点寄存器 ICC_BPR0 和 ICC_BPR1 中定义的组优先级和子优先级之间的 GICD_CTLR.DS.The 划分的值如何。如果EL3被实现并使用AArch32，则物理访问返回来自ICC_MCTLR.PRIbits的值。如果EL3被实现并使用AArch64，则物理访问返回来自ICC_CTLR_EL3.PRIbits的值。如果EL3未实现，则物理访问返回该位域的值。该位域具有 IMPLEMENTATION DEFINED 值。"
            - name: "RES0"
              bits: "7"
              desc: "保留，RES0。"
            - name: "PMHE"
              bits: "6"
              desc: "优先级掩码提示启用。控制优先级屏蔽寄存器是否用作中断分配的提示：\n如果实现EL3：\n如果EL3使用AArch32，则该位是ICC_MCTLR.PMHE的别名。如果EL3使用AArch64，则该位是ICC_CTLR_EL3.PMHE的别名。如果 GICD_CTLR.DS == 0，则该位是只读的。如果 GICD_CTLR.DS == 1，则该位可读/写。如果EL3未实现，则该位是只读还是读/写由 IMPLEMENTATION DEFINED：\n如果该位是只读的，则实现可以选择将此位域设置为 RAZ/WI 或 RAO/WI。如果该位被读/写，它将重置为零。"
              values:
                - value: "0b0"
                  desc: "禁止使用ICC_PMR作为中断分配的提示。"
                - value: "0b1"
                  desc: "允许使用 ICC_PMR 作为中断分配的提示。"
            - name: "RES0"
              bits: "5:2"
              desc: "保留，RES0。"
            - name: "EOImode"
              bits: "1"
              desc: "当前安全状态的EOI模式。控制对中断结束寄存器的写入是否也会停用中断：\n如果实现EL3：\n如果 EL3 使用 AArch32，则该位是 ICC_MCTLR.EOImode_EL1{S, NS} 的别名，其中 S 或 NS 对应于当前安全状态。如果 EL3 使用 AArch64，则该位是 ICC_CTLR_EL3.EOImode_EL1{S, NS} 的别名，其中 S 或 NS 对应于当前的安全状态。如果EL3未实现，则该位是只读还是读/写由 IMPLEMENTATION DEFINED：\n如果该位是只读的，则实现可以选择将此位域设置为 RAZ/WI 或 RAO/WI。如果该位被读/写，它将重置为零。"
              values:
                - value: "0b0"
                  desc: "ICC_EOIR0 和 ICC_EOIR1 提供优先级下降和中断停用功能。对ICC_DIR的访问是 UNPREDICTABLE。"
                - value: "0b1"
                  desc: "ICC_EOIR0 和 ICC_EOIR1 仅提供优先级下降功能。 ICC_DIR 提供中断停用功能。"
            - name: "CBPR"
              bits: "0"
              desc: "通用二进制点寄存器。控制同一寄存器是否用于组 0 和组 1 中断的中断抢占：\n如果实现EL3：\n如果 EL3 使用 AArch32，则该位是 ICC_MCTLR.CBPR_EL1{S,NS} 的别名，其中 S 或 NS 对应于当前的安全性状态。如果 EL3 使用 AArch64，则该位是 ICC_CTLR_EL3.CBPR_EL1{S,NS} 的别名，其中 S 或 NS 对应于当前的安全状态。如果 GICD_CTLR.DS == 0，则该位是只读的。如果 GICD_CTLR.DS == 1，则该位可读/写。如果EL3未实现，则该位是只读还是读/写由 IMPLEMENTATION DEFINED：\n如果该位是只读的，则实现可以选择将此位域设为 RAZ/WI 或RAO/WI。如果该位被读/写，它将重置为零。"
              values:
                - value: "0b0"
                  desc: "ICC_BPR0 仅确定组 0 中断的抢占组。 ICC_BPR1 确定组 1 中断的抢占组。"
                - value: "0b1"
                  desc: "ICC_BPR0 确定组 0 和组 1 中断的抢占组。"
        - name: "ICC_DIR"
          desc: "当中断优先级下降与中断停用分开时，写入该寄存器将停用指定的中断。"
          condition: "当FEAT_AA32EL1被实现并且GICv3被实现时"
          fields:
            - name: "RES0"
              bits: "31:24"
              desc: "保留，RES0。"
            - name: "INTID"
              bits: "23:0"
              desc: "要停用的中断的 INTID。该位域已实现 16 位或 24 位。实现的位数可以在ICC_CTLR.IDbits和ICC_MCTLR.IDbits中找到。如果仅实现 16 位，则该寄存器的位 [23:16] 为 RES0。"
        - name: "ICC_EOIR0"
          desc: "A PE 写入该寄存器，通知 CPU 接口已完成指定的 Group 0 中断的处理。"
          condition: "当FEAT_AA32EL1被实现并且GICv3被实现时"
          fields:
            - name: "RES0"
              bits: "31:24"
              desc: "保留，RES0。"
            - name: "INTID"
              bits: "23:0"
              desc: "INTID由对应的ICC_IAR0访问。该位域已实现 16 位或 24 位。实现的位数可以在ICC_CTLR.IDbits和ICC_MCTLR.IDbits中找到。如果仅实现 16 位，则该寄存器的位 [23:16] 为 RES0。如果当前异常级别和安全状态的 EOImode 位为 0，则写入该寄存器会降低中断的优先级，并停用中断。如果当前异常级别和安全状态的 EOImode 位为 1，则写入该寄存器只会降低中断的优先级。软件必须写入ICC_DIR以停用中断。相应的 EOImode 位变化如下：\n如果实现了 EL3 并且软件在监控模式下执行，则相应的位为 ICC_MCTLR.EOImode_EL3。如果实现了 EL3 并且软件未在监控模式下执行，则该位取决于当前的安全状态：如果软件在安全状态下执行，则在 ICC_CTLR 的安全实例中该位为 ICC_CTLR.EOImode。这是 ICC_MCTLR.EOImode_EL1S 的别名。如果软件在非安全状态下执行，则 ICC_CTLR 的非安全实例中的位为 ICC_CTLR.EOImode。这是 ICC_MCTLR.EOImode_EL1NS 的别名。如果 EL3 未实现，则相应位为 ICC_CTLR.EOImode。"
        - name: "ICC_EOIR1"
          desc: "APE写入该寄存器以通知CPU接口已完成指定的组1中断的处理。"
          condition: "当FEAT_AA32EL1被实现并且GICv3被实现时"
          fields:
            - name: "RES0"
              bits: "31:24"
              desc: "保留，RES0。"
            - name: "INTID"
              bits: "23:0"
              desc: "INTID由对应的ICC_IAR1访问。该位域已实现 16 位或 24 位。实现的位数可以在ICC_CTLR.IDbits和ICC_MCTLR.IDbits中找到。如果仅实现 16 位，则该寄存器的位 [23:16] 为 RES0。如果当前异常级别和安全状态的 EOImode 位为 0，则写入该寄存器会降低中断的优先级，并停用中断。如果当前异常级别和安全状态的 EOImode 位为 1，则写入该寄存器只会降低中断的优先级。软件必须写入ICC_DIR以停用中断。相应的 EOImode 位变化如下：\n如果实现了 EL3 并且软件在监控模式下执行，则相应的位为 ICC_MCTLR.EOImode_EL3。如果实现了 EL3 并且软件未在监控模式下执行，则该位取决于当前的安全状态：如果软件在安全状态下执行，则在 ICC_CTLR 的安全实例中该位为 ICC_CTLR.EOImode。这是 ICC_MCTLR.EOImode_EL1S 的别名。如果软件在非安全状态下执行，则 ICC_CTLR 的非安全实例中的位为 ICC_CTLR.EOImode。这是 ICC_MCTLR.EOImode_EL1NS 的别名。如果 EL3 未实现，则相应位为 ICC_CTLR.EOImode。"
        - name: "ICC_HPPIR0"
          desc: "指示 CPU 接口上最高优先级的待处理第 0 组中断。"
          condition: "当FEAT_AA32EL1被实现并且GICv3被实现时"
          fields:
            - name: "RES0"
              bits: "31:24"
              desc: "保留，RES0。"
            - name: "INTID"
              bits: "23:0"
              desc: "最高优先级待处理中断的 INTID（如果在当前安全状态和异常级别可观察到该中断）。如果最高优先级挂起中断不可观察，则该位域包含一个特殊的INTID来指示原因。这些特殊 INTID 可以是以下之一：1020、1021 或 1023。有关详细信息，请参阅 ARM® 通用中断控制器架构规范、GIC 架构版本 3.0 和版本 4.0 (ARM IHI 0069）。该位域已实现 16 位或 24 位。实现的位数可以在ICC_CTLR.IDbits和ICC_MCTLR.IDbits中找到。如果仅实现 16 位，则该寄存器的位 [23:16] 为 RES0。"
        - name: "ICC_HPPIR1"
          desc: "指示 CPU 接口上最高优先级的待处理第 1 组中断。"
          condition: "当FEAT_AA32EL1被实现并且GICv3被实现时"
          fields:
            - name: "RES0"
              bits: "31:24"
              desc: "保留，RES0。"
            - name: "INTID"
              bits: "23:0"
              desc: "最高优先级待处理中断的 INTID（如果在当前安全状态和异常级别可观察到该中断）。如果最高优先级挂起中断不可观察，则该位域包含一个特殊的INTID来指示原因。该特殊值INTID只能取值1023。有关详细信息，请参阅 ARM® 通用中断控制器架构规范、GIC 架构版本 3.0 和版本 4.0 (ARM IHI 0069) 中的“特殊 INTID”。该位域已实现 16 位或 24 位。实现的位数可以在ICC_CTLR.IDbits和ICC_MCTLR.IDbits中找到。如果仅实现 16 位，则该寄存器的位 [23:16] 为 RES0。"
        - name: "ICC_HSRE"
          desc: "控制是否将系统寄存器接口或 GIC CPU 接口的存储器映射接口用于 EL2。"
          condition: "当实现FEAT_AA32EL2时，实现GICv3，并且（实现EL2或实现EL3）"
          fields:
            - name: "RES0"
              bits: "31:4"
              desc: "保留，RES0。"
            - name: "Enable"
              bits: "3"
              desc: "启用。启用对 ICC_SRE 的较低异常级别访问。如果ICC_HSRE.SRE是RAO/WI，则允许实现使能位RAO/WI。如果 ICC_HSRE.SRE 为 0，则除了读取该位值之外的所有用途，使能位都表现为 1。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "非安全EL1访问ICC_SRE陷阱到EL2。"
                - value: "0b1"
                  desc: "对 ICC_SRE 的非安全 EL1 访问不会捕获 EL2。"
            - name: "DIB"
              bits: "2"
              desc: "禁用 IRQ 旁路。如果实现了EL3并且GICD_CTLR.DS为0，则该位域是ICC_MSRE.DIB的只读别名。如果实现了EL3并且GICD_CTLR.DS为1，则该位域是ICC_MSRE.DIB的读/写别名。在不支持IRQ旁路的系统中，该位为RAO/WI。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "IRQ 旁路启用。"
                - value: "0b1"
                  desc: "IRQ 旁路禁用。"
            - name: "DFB"
              bits: "1"
              desc: "禁用 FIQ 旁路。如果实现了EL3并且GICD_CTLR.DS为0，则该位域是ICC_MSRE.DFB的只读别名。如果实现了EL3并且GICD_CTLR.DS为1，则该位域是ICC_MSRE.DFB的读/写别名。在不支持FIQ旁路的系统中，该位为RAO/WI。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "FIQ 旁路启用。"
                - value: "0b1"
                  desc: "FIQ 旁路禁用。"
            - name: "SRE"
              bits: "0"
              desc: "系统寄存器启用。如果软件将该位从 1 更改为 0，则结果为 UNPREDICTABLE。如果实现仅支持到 GIC CPU 接口的系统寄存器接口，则该位为 RAO/WI。如果EL3被实现并使用AArch64：\n当ICC_SRE_EL3.SRE==0时，该位为 RAZ/WI。如果使用AArch32 实现EL3：\n当ICC_MSRE.SRE==0时，该位为 RAZ/WI。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "必须使用内存映射接口。在 EL2 或以下位置访问任何 ICH_* 系统寄存器，或除 ICC_SRE 或 ICC_HSRE 之外的任何 EL1 或 EL2 ICC_* 寄存器， UNDEFINED。"
                - value: "0b1"
                  desc: "ICH_* 寄存器以及 EL1 和 EL2 ICC_* 寄存器的系统寄存器接口已针对 EL2 启用。"
        - name: "ICC_IAR0"
          desc: "PE 读取该寄存器以获得发出信号的 Group 0 中断的 INTID。该读取充当中断的确认。"
          condition: "当FEAT_AA32EL1被实现并且GICv3被实现时"
          fields:
            - name: "RES0"
              bits: "31:24"
              desc: "保留，RES0。"
            - name: "INTID"
              bits: "23:0"
              desc: "发出信号的中断的 INTID。这是最高优先级挂起中断的 INTID，前提是该中断具有足够的优先级，可以将其发送到 PE，并且可以在当前安全状态和异常级别进行确认。如果最高优先级挂起中断不可观察，则该位域包含一个特殊的INTID来指示原因。这些特殊 INTID 可以是以下之一：1020、1021 或 1023。有关详细信息，请参阅 ARM® 通用中断控制器架构规范、GIC 架构版本 3.0 和版本 4.0 (ARM IHI 0069）。该位域已实现 16 位或 24 位。实现的位数可以在ICC_CTLR.IDbits和ICC_MCTLR.IDbits中找到。如果仅实现 16 位，则该寄存器的位 [23:16] 为 RES0。"
        - name: "ICC_IAR1"
          desc: "PE 读取该寄存器以获得发出信号的第 1 组中断的 INTID。该读取充当中断的确认。"
          condition: "当FEAT_AA32EL1被实现并且GICv3被实现时"
          fields:
            - name: "RES0"
              bits: "31:24"
              desc: "保留，RES0。"
            - name: "INTID"
              bits: "23:0"
              desc: "发出信号的中断的 INTID。这是最高优先级挂起中断的 INTID，前提是该中断具有足够的优先级，可以将其发送到 PE，并且可以在当前安全状态和异常级别进行确认。如果最高优先级挂起中断不可观察，则该位域包含一个特殊的INTID来指示原因。该特殊值INTID只能取值1023。有关详细信息，请参阅 ARM® 通用中断控制器架构规范、GIC 架构版本 3.0 和版本 4.0 (ARM IHI 0069) 中的“特殊 INTID”。该位域已实现 16 位或 24 位。实现的位数可以在ICC_CTLR.IDbits和ICC_MCTLR.IDbits中找到。如果仅实现 16 位，则该寄存器的位 [23:16] 为 RES0。"
        - name: "ICC_IGRPEN0"
          desc: "控制是否启用第 0 组中断。"
          condition: "当FEAT_AA32EL1被实现并且GICv3被实现时"
          fields:
            - name: "RES0"
              bits: "31:1"
              desc: "保留，RES0。"
            - name: "Enable"
              bits: "0"
              desc: "启用组 0 中断。对此寄存器的虚拟访问更新 ICH_VMCR.VENG0。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "组 0 中断被禁用。"
                - value: "0b1"
                  desc: "组 0 中断已启用。"
        - name: "ICC_IGRPEN1"
          desc: "控制是否为当前安全状态启用第 1 组中断。"
          condition: "当FEAT_AA32EL1被实现并且GICv3被实现时"
          fields:
            - name: "RES0"
              bits: "31:1"
              desc: "保留，RES0。"
            - name: "Enable"
              bits: "0"
              desc: "为当前安全状态启用第 1 组中断。对此寄存器的虚拟访问更新 ICH_VMCR.VENG1。如果 EL3 存在：\n如果 EL3 使用 AArch32，则该位是 ICC_MGRPEN1.EnableGrp1{S, NS} 的读/写别名，或者 ICC_IGRPEN1_EL3.EnableGrp1{S, NS}（如果适用） EL3正在使用AArch64。当在 EL3 访问该寄存器时，将访问适合 SCR.NS 当前设置的该寄存器的副本。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "当前安全状态下第 1 组中断被禁用。"
                - value: "0b1"
                  desc: "当前安全状态启用第 1 组中断。"
        - name: "ICC_MCTLR"
          desc: "控制 GIC CPU 接口行为的各个方面，并提供有关所实现功能的信息。"
          condition: "当FEAT_AA32EL3被实现时，GICv3被实现，并且EL3被实现"
          fields:
            - name: "RES0"
              bits: "31:20"
              desc: "保留，RES0。"
            - name: "ExtRange"
              bits: "19"
              desc: "扩展 INTID 范围（只读）。"
              values:
                - value: "0b0"
                  desc: "CPU 接口不支持 1024..8191 范围内的 INTID。如果 IRI 向 CPU 接口传送 1024 至 8191 范围内的中断，则行为为 UNPREDICTABLE。 Arm 强烈建议不要将 IRI 配置为将此范围内的中断传递给不支持这些中断的 PE。"
                - value: "0b1"
                  desc: "CPU 接口支持 1024..8191 范围内的 INTID 1024..8191 范围内的所有 INTID 均被视为需要停用。"
            - name: "RSS"
              bits: "18"
              desc: "范围选择器支持。可能的值为：\n该位是只读的。"
              values:
                - value: "0b0"
                  desc: "支持亲和力级别 0 值为 0 - 15 的目标 SGI。"
                - value: "0b1"
                  desc: "支持亲和力级别 0 值为 0 - 255 的目标 SGI。"
            - name: "nDS"
              bits: "17"
              desc: "不支持禁用安全性。只读和写入将被忽略。"
              values:
                - value: "0b0"
                  desc: "CPU接口逻辑支持禁用安全性。"
                - value: "0b1"
                  desc: "CPU接口逻辑不支持关闭安全，要求不关闭安全。"
            - name: "RES0"
              bits: "16"
              desc: "保留，RES0。"
            - name: "A3V"
              bits: "15"
              desc: "亲和力 3 有效。只读和写入将被忽略。如果 EL3 存在，则 ICC_CTLR.A3V 是 ICC_MCTLR.A3V 的别名"
              values:
                - value: "0b0"
                  desc: "CPU 接口逻辑不支持 SGI 生成系统寄存器中的 Aff3 位域的非零值。"
                - value: "0b1"
                  desc: "CPU 接口逻辑支持 SGI 代系统寄存器中 Aff3 位域的非零值。"
            - name: "SEIS"
              bits: "14"
              desc: "SEI 支持。只读和写入将被忽略。 CPU接口是否支持生成SEI。如果 EL3 存在，则 ICC_CTLR.SEIS 是 ICC_MCTLR.SEIS 的别名"
              values:
                - value: "0b0"
                  desc: "CPU接口逻辑不支持SEI的生成。"
                - value: "0b1"
                  desc: "CPU接口逻辑支持SEI的生成。"
            - name: "IDbits"
              bits: "13:11"
              desc: "标识符位。只读和写入将被忽略。指示支持的物理中断标识符位的数量。所有其他值均被保留。如果 EL3 存在，则 ICC_CTLR.IDbits 是 ICC_MCTLR.IDbits 的别名"
              values:
                - value: "0b000"
                  desc: "16 位。"
                - value: "0b001"
                  desc: "24 位。"
            - name: "PRIbits"
              bits: "10:8"
              desc: "优先级位。只读和写入将被忽略。实现的优先级位数减一。支持两种安全状态的实现必须实现至少 32 级物理优先级（5 个优先级位）。仅支持单个安全状态的实现必须实现至少 16 个物理优先级级别（4 个优先级位）。该位域始终返回所实现的优先级位数，无论 SCR.NS 的值或 GICD_CTLR.DS.The 的值如何，组优先级和子优先级之间的划分是在二进制点寄存器 ICC_BPR0 和 ICC_BPR1 中定义的。该位域确定 ICC_BPR0 的最小值。"
            - name: "RES0"
              bits: "7"
              desc: "保留，RES0。"
            - name: "PMHE"
              bits: "6"
              desc: "优先级掩码提示启用。在将此位域清除为 0 之前，软件必须将 ICC_PMR 写入 0xFF。实现可能会选择将此位域设置为 RAO/WI。如果 EL3 存在，则 ICC_CTLR.PMHE 是 ICC_MCTLR.PMHE 的别名。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "禁止使用优先级掩码寄存器作为中断分配的提示。"
                - value: "0b1"
                  desc: "允许使用优先级掩码寄存器作为中断分配的提示。"
            - name: "RM"
              bits: "5"
              desc: "SBZ。 AArch64 中的等效位是路由修饰符位。当EL3使用AArch32 时，不支持此功能。"
              reset_info: "温复位；AU"
            - name: "EOImode_EL1NS"
              bits: "4"
              desc: "EOI 模式用于在非安全 EL1 和 EL2 下处理的中断。控制对中断结束寄存器的写入是否也会停用中断。如果 EL3 存在，则 ICC_CTLR(NS).EOImode 是 ICC_MCTLR.EOImode_EL1NS 的别名。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "ICC_EOIR0 和 ICC_EOIR1 提供优先级下降和中断停用功能。对ICC_DIR的访问是 UNPREDICTABLE。"
                - value: "0b1"
                  desc: "ICC_EOIR0 和 ICC_EOIR1 仅提供优先级下降功能。 ICC_DIR 提供中断停用功能。"
            - name: "EOImode_EL1S"
              bits: "3"
              desc: "EOI 模式用于在安全 EL1 处处理中断。控制对中断结束寄存器的写入是否也会停用中断。如果 EL3 存在，则 ICC_CTLR(S).EOImode 是 ICC_MCTLR.EOImode_EL1S 的别名。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "ICC_EOIR0 和 ICC_EOIR1 提供优先级下降和中断停用功能。对ICC_DIR的访问是 UNPREDICTABLE。"
                - value: "0b1"
                  desc: "ICC_EOIR0 和 ICC_EOIR1 仅提供优先级下降功能。 ICC_DIR 提供中断停用功能。"
            - name: "EOImode_EL3"
              bits: "2"
              desc: "EOI 模式用于在 EL3 处处理中断。控制对中断结束寄存器的写入是否也会停用中断。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "ICC_EOIR0 和 ICC_EOIR1 提供优先级下降和中断停用功能。对ICC_DIR的访问是 UNPREDICTABLE。"
                - value: "0b1"
                  desc: "ICC_EOIR0 和 ICC_EOIR1 仅提供优先级下降功能。 ICC_DIR 提供中断停用功能。"
            - name: "CBPR_EL1NS"
              bits: "1"
              desc: "通用二进制点寄存器，EL1 非安全。控制是否使用同一寄存器来抢占组 0 和组 1 非安全中断EL1和EL2。如果 EL3 存在，则 ICC_CTLR(NS).CBPR 是 ICC_MCTLR.CBPR_EL1NS 的别名。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "ICC_BPR0 仅确定组 0 中断的抢占组。 ICC_BPR1 确定非安全组 1 中断的抢占组。"
                - value: "0b1"
                  desc: "ICC_BPR0 确定组 0 中断和非安全组 1 中断的抢占组。对GICC_BPR和ICC_BPR1的非安全访问访问ICC_BPR0的状态。"
            - name: "CBPR_EL1S"
              bits: "0"
              desc: "通用二进制点寄存器，EL1 安全。控制同一寄存器是否用于安全非监控模式下组 0 和组 1 安全中断的中断抢占。如果 EL3 存在，则 ICC_CTLR(S).CBPR 是 ICC_MCTLR.CBPR_EL1S 的别名。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "ICC_BPR0 仅确定组 0 中断的抢占组。 ICC_BPR1 确定安全组 1 中断的抢占组。"
                - value: "0b1"
                  desc: "ICC_BPR0 确定组 0 中断和安全组 1 中断的抢占组。安全EL1访问，或不在监控模式下EL3访问，以ICC_BPR1访问ICC_BPR0的状态。"
        - name: "ICC_MGRPEN1"
          desc: "控制是否启用第 1 组中断。"
          condition: "当FEAT_AA32EL3被实现时，GICv3被实现，并且EL3被实现"
          fields:
            - name: "RES0"
              bits: "31:2"
              desc: "保留，RES0。"
            - name: "EnableGrp1S"
              bits: "1"
              desc: "启用安全状态的第 1 组中断。安全 ICC_IGRPEN1.Enable 位是 ICC_MGRPEN1.EnableGrp1S 位的读/写别名。如果该中断 PE 的最高优先级挂起中断是使用 1 of N 模型的第 1 组中断，则由于使能位从 1 变为 0，该中断将瞄准另一个中断 PE。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "安全组 1 中断被禁用。"
                - value: "0b1"
                  desc: "安全组 1 中断已启用。"
            - name: "EnableGrp1NS"
              bits: "0"
              desc: "启用非安全状态的第 1 组中断。非安全 ICC_IGRPEN1.Enable 位是 ICC_MGRPEN1.EnableGrp1NS 位的读/写别名。如果该中断 PE 的最高优先级挂起中断是使用 1 of N 模型的第 1 组中断，则由于使能位从 1 变为 0，该中断将瞄准另一个中断 PE。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "非安全组 1 中断被禁用。"
                - value: "0b1"
                  desc: "启用非安全组 1 中断。"
        - name: "ICC_MSRE"
          desc: "控制是否将系统寄存器接口或 GIC CPU 接口的存储器映射接口用于 EL3。"
          condition: "当FEAT_AA32EL3被实现时，GICv3被实现，并且EL3被实现"
          fields:
            - name: "RES0"
              bits: "31:4"
              desc: "保留，RES0。"
            - name: "Enable"
              bits: "3"
              desc: "使能。启用对 ICC_SRE 和 ICC_HSRE 的较低异常级别访问。如果ICC_MSRE.SRE是RAO/WI，则允许实现使能位RAO/WI。如果 ICC_MSRE.SRE 为 0，则除了读取该位值之外的所有用途，使能位都表现为 1。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "安全 EL1 访问到 EL3 的安全 ICC_SRE 陷阱。 EL2访问非安全ICC_SRE和ICC_HSRE陷阱到EL3。非安全 EL1 对 ICC_SRE 的访问会陷阱到 EL3，除非这些访问由于 ICC_HSRE.Enable == 0 而陷入 EL2。"
                - value: "0b1"
                  desc: "安全 EL1 对安全 ICC_SRE 的访问不会捕获 EL3。 EL2 对非安全 ICC_SRE 和 ICC_HSRE 的访问不会捕获 EL3。对 ICC_SRE 的非安全 EL1 访问不会捕获 EL3。"
            - name: "DIB"
              bits: "2"
              desc: "禁用 IRQ 旁路。在不支持IRQ旁路的系统中，该位为RAO/WI。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "IRQ 旁路启用。"
                - value: "0b1"
                  desc: "IRQ 旁路禁用。"
            - name: "DFB"
              bits: "1"
              desc: "禁用 FIQ 旁路。在不支持FIQ旁路的系统中，该位为RAO/WI。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "FIQ 旁路启用。"
                - value: "0b1"
                  desc: "FIQ 旁路禁用。"
            - name: "SRE"
              bits: "0"
              desc: "系统寄存器启用。如果软件将该位从 1 更改为 0，则结果为 UNPREDICTABLE。如果实现仅支持到 GIC CPU 接口的系统寄存器接口，则该位为 RAO/WI。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "必须使用内存映射接口。访问 EL3 或以下位置的任何 ICH_* 系统寄存器，或除 ICC_SRE 之外的任何 EL1、EL2 或 EL3 ICC_* 寄存器， ICC_HSRE或ICC_MSRE是UNDEFINED。"
                - value: "0b1"
                  desc: "ICH_* 寄存器以及 EL1、EL2 和 EL3 ICC_* 寄存器的系统寄存器接口已针对 EL3 启用。"
        - name: "ICC_PMR"
          desc: "提供中断优先级过滤器。只有优先级高于该寄存器中的值的中断才会向 PE 发出信号。"
          condition: "当FEAT_AA32EL1被实现并且GICv3被实现时"
          fields:
            - name: "RES0"
              bits: "31:8"
              desc: "保留，RES0。"
            - name: "Priority"
              bits: "7:0"
              desc: "CPU 接口的优先级掩码级别。如果中断的优先级高于该位域指示的值，则接口向PE发出中断信号。可能的优先级位域值如下：\n已实现的优先级 bitsPossible 优先级 levels[7:0]0x00-0xFF (0-255) 的优先级位域 valuesNumber、全部 values256[7:1]0x00-0xFE (0-254)、偶数值 only128[7:2]0x00-0xFC (0-252)，步长为 464[7:3]0x00-0xF8 (0-248)，步长为 832[7:4]0x00-0xF0 (0-240)，步长为 1616 未实现的优先级位为 RAZ/WI。"
              reset_info: "温复位；0x00"
        - name: "ICC_RPR"
          desc: "CPU接口的运行优先级。"
          condition: "当FEAT_AA32EL1被实现并且GICv3被实现时"
          fields:
            - name: "RES0"
              bits: "31:8"
              desc: "保留，RES0。"
            - name: "Priority"
              bits: "7:0"
              desc: "CPU接口当前运行优先级。这是当前活动中断的组优先级。返回的优先级是组优先级，就好像当前异常级别和安全状态的 BPR 设置为已实现的优先级位数的最小值 BPR。如果实现 8 位优先级，则组优先级为优先级的位[7:1]。"
        - name: "ICC_SGI0R"
          desc: "生成安全组 0 SGI。"
          condition: "当FEAT_AA32EL1被实现并且GICv3被实现时"
          fields:
            - name: "RES0"
              bits: "63:56"
              desc: "保留，RES0。"
            - name: "Aff3"
              bits: "55:48"
              desc: "将生成 SGI 个中断的集群的关联路径的关联性 3 值。如果IRM位为1，则该位域为 RES0。"
            - name: "RS"
              bits: "47:44"
              desc: "RangeSelector 控制 TargetList 位域表示哪一组 16 个值。 TargetList[n]表示aff0值((RS * 16) + n)。当ICC_CTLR_EL1.RSS==0时，RS为 RES0。当 ICC_CTLR_EL1.RSS==1 且 GICD_TYPER.RSS==0 时，用 RS != 0 写入该寄存器是 CONSTRAINED UNPREDICTABLE 的选择：\n写入被忽略。 RS位域被视为0。"
            - name: "RES0"
              bits: "43:41"
              desc: "保留，RES0。"
            - name: "IRM"
              bits: "40"
              desc: "中断路由模式。确定如何将生成的中断分配给 PE。可能的值为："
              values:
                - value: "0b0"
                  desc: "中断路由到 Aff3.Aff2.Aff1.<目标列表> 指定的 PE。"
                - value: "0b1"
                  desc: "中断路由到系统中的所有 PE，不包括“自身”。"
            - name: "Aff2"
              bits: "39:32"
              desc: "将生成 SGI 个中断的集群的关联路径的关联 2 值。如果IRM位为1，则该位域为 RES0。"
            - name: "RES0"
              bits: "31:28"
              desc: "保留，RES0。"
            - name: "INTID"
              bits: "27:24"
              desc: "SGI的INTID。"
            - name: "Aff1"
              bits: "23:16"
              desc: "将生成 SGI 个中断的集群的关联路径的关联 1 值。如果IRM位为1，则该位域为 RES0。"
            - name: "TargetList"
              bits: "15:0"
              desc: "目标清单。将生成 SGI 中断的 PE 集。每个位对应于簇内的PE，亲和力0值等于位号。如果仅针对安全 EL3 设置 SRE，则在 EL3 上执行的软件可能会使用系统寄存器接口来生成 SGI。因此，分发器必须始终能够接收并确认从 CPU 接口收到的生成 SGI 数据包，无论安全状态的 ARE 设置如何。但是，分发服务器可能会丢弃此类数据包。如果IRM位为1，则该位域为 RES0。如果某个位为 1 并且该位不对应于有效目标 PE，则分发器必须忽略该位。在这种情况下，分销商是否可以发出系统错误信号是 IMPLEMENTATION DEFINED。"
        - name: "ICC_SGI1R"
          desc: "为当前安全状态生成组 1 SGI。"
          condition: "当FEAT_AA32EL1被实现并且GICv3被实现时"
          fields:
            - name: "RES0"
              bits: "63:56"
              desc: "保留，RES0。"
            - name: "Aff3"
              bits: "55:48"
              desc: "将生成 SGI 个中断的集群的关联路径的关联性 3 值。如果IRM位为1，则该位域为 RES0。"
            - name: "RS"
              bits: "47:44"
              desc: "RangeSelector 控制 TargetList 位域表示哪一组 16 个值。 TargetList[n]表示aff0值((RS * 16) + n)。当ICC_CTLR_EL1.RSS==0时，RS为 RES0。当 ICC_CTLR_EL1.RSS==1 且 GICD_TYPER.RSS==0 时，用 RS != 0 写入该寄存器是 CONSTRAINED UNPREDICTABLE 的选择：\n写入被忽略。 RS位域被视为0。"
            - name: "RES0"
              bits: "43:41"
              desc: "保留，RES0。"
            - name: "IRM"
              bits: "40"
              desc: "中断路由模式。确定如何将生成的中断分配给 PE。可能的值为："
              values:
                - value: "0b0"
                  desc: "中断路由到 Aff3.Aff2.Aff1.<目标列表> 指定的 PE。"
                - value: "0b1"
                  desc: "中断路由到系统中的所有 PE，不包括“自身”。"
            - name: "Aff2"
              bits: "39:32"
              desc: "将生成 SGI 个中断的集群的关联路径的关联 2 值。如果IRM位为1，则该位域为 RES0。"
            - name: "RES0"
              bits: "31:28"
              desc: "保留，RES0。"
            - name: "INTID"
              bits: "27:24"
              desc: "SGI的INTID。"
            - name: "Aff1"
              bits: "23:16"
              desc: "将生成 SGI 个中断的集群的关联路径的关联 1 值。如果IRM位为1，则该位域为 RES0。"
            - name: "TargetList"
              bits: "15:0"
              desc: "目标清单。将生成 SGI 中断的 PE 集。每个位对应于簇内的PE，亲和力0值等于位号。如果仅针对安全 EL3 设置 SRE，则在 EL3 上执行的软件可能会使用系统寄存器接口来生成 SGI。因此，分发器必须始终能够接收并确认从 CPU 接口收到的生成 SGI 数据包，无论安全状态的 ARE 设置如何。但是，分发服务器可能会丢弃此类数据包。如果IRM位为1，则该位域为 RES0。如果某个位为 1 并且该位不对应于有效目标 PE，则分发器必须忽略该位。在这种情况下，分销商是否可以发出系统错误信号是 IMPLEMENTATION DEFINED。"
        - name: "ICC_SRE"
          desc: "控制是否将系统寄存器接口或 GIC CPU 接口的存储器映射接口用于 EL0 和 EL1。"
          condition: "当FEAT_AA32EL1被实现并且GICv3被实现时"
          fields:
            - name: "RES0"
              bits: "31:3"
              desc: "保留，RES0。"
            - name: "DIB"
              bits: "2"
              desc: "禁用 IRQ 旁路。如果实现了 EL3 并且 GICD_CTLR.DS == 0，则该位域是 ICC_MSRE.DIB 的只读别名。如果实现了 EL3 并且 GICD_CTLR.DS == 1，并且未实现 EL2，则该位域是 ICC_MSRE.DIB 的读/写别名。如果未实现EL3且实现了EL2，则该位域是ICC_HSRE.DIB的只读别名。如果 GICD_CTLR.DS == 1 且 EL2 被实现，则该位域是 ICC_HSRE.DIB 的只读别名。在不支持IRQ旁路的系统中，该位域为RAO/WI。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "IRQ 旁路启用。"
                - value: "0b1"
                  desc: "IRQ 旁路禁用。"
            - name: "DFB"
              bits: "1"
              desc: "禁用 FIQ 旁路。如果实现了 EL3 并且 GICD_CTLR.DS == 0，则该位域是 ICC_MSRE.DFB 的只读别名。如果实现了 EL3 并且 GICD_CTLR.DS == 1，并且未实现 EL2，则该位域是 ICC_MSRE.DFB 的读/写别名。如果未实现EL3且实现了EL2，则该位域是ICC_HSRE.DFB的只读别名。如果 GICD_CTLR.DS == 1 且 EL2 被实现，则该位域是 ICC_HSRE.DFB 的只读别名。在不支持FIQ旁路的系统中，该位域为RAO/WI。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "FIQ 旁路启用。"
                - value: "0b1"
                  desc: "FIQ 旁路禁用。"
            - name: "SRE"
              bits: "0"
              desc: "系统寄存器启用。如果软件在该寄存器的安全实例中将该位从 1 更改为 0，则结果为 UNPREDICTABLE。如果实现仅支持到 GIC CPU 接口的系统寄存器接口，则该位为 RAO/WI。如果EL3被实现并使用AArch64：\n当ICC_SRE_EL3.SRE==0时，该位的安全副本为 RAZ/WI。当ICC_SRE_EL3.SRE==0时，该位的非安全副本为 RAZ/WI。如果EL3被实现并使用AArch32：\n当ICC_MSRE.SRE==0时，该位的安全副本为 RAZ/WI。当ICC_MSRE.SRE==0时，该位的非安全副本为 RAZ/WI。如果EL2被实现并使用AArch64：\n当ICC_SRE_EL2.SRE==0时，该位的非安全副本为 RAZ/WI。如果EL2被实现并使用AArch32：\n当ICC_HSRE.SRE==0时，该位的非安全副本为 RAZ/WI。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "必须使用内存映射接口。在 EL1 处对除 ICC_SRE 之外的任何 ICC_* 系统寄存器的访问都是 UNDEFINED。"
                - value: "0b1"
                  desc: "当前安全状态的系统寄存器接口已启用。"
    - name: "GICV Control"
      title: "GIC 虚拟化控制"
      access: "MRS / MSR 系统寄存器接口"
      desc: "Arm AArch32 架构系统寄存器：GICV控制"
      registers:
        - name: "ICV_AP0R<n>"
          desc: "提供有关虚拟组 0 活动优先级的信息。"
          condition: "当FEAT_AA32EL1被实现时，GICv3被实现，并且EL2被实现"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:0"
              desc: "IMPLEMENTATION DEFINED。"
              reset_info: "温复位；0x00000000"
        - name: "ICV_AP1R<n>"
          desc: "提供有关虚拟组 1 活动优先级的信息。"
          condition: "当FEAT_AA32EL1被实现时，GICv3被实现，并且EL2被实现"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:0"
              desc: "IMPLEMENTATION DEFINED。"
              reset_info: "温复位；0x00000000"
        - name: "ICV_BPR0"
          desc: "定义优先级值位域分为两部分的点：组优先级位域和子优先级位域。组优先级位域决定虚拟组 0 中断抢占。"
          condition: "当FEAT_AA32EL1被实现时，GICv3被实现，并且EL2被实现"
          fields:
            - name: "RES0"
              bits: "31:3"
              desc: "保留，RES0。"
            - name: "BinaryPoint"
              bits: "2:0"
              desc: "该位域的值控制 8 位中断优先级位域如何分为确定中断抢占的组优先级位域和子优先级位域。这是按如下方式完成的：\n二进制小数点valueGroup优先fieldSubpriorityfieldField带二进制point0[7:1][0]ggggggg.s1[7:2][1:0]gggggg.ss2[7:3][2:0]ggggg.sss3[7:4][3:0]gggg.ssss4[7:5][4:0]ggg.sssss5[7:6][5:0]gg.ssssss6[7][6:0]g.sssssss7Nopreemption[7:0].ssssssss"
              reset_info: "温复位；AU"
        - name: "ICV_BPR1"
          desc: "定义优先级值位域分为两部分的点：组优先级位域和子优先级位域。组优先级位域确定虚拟组 1 中断抢占。"
          condition: "当FEAT_AA32EL1被实现时，GICv3被实现，并且EL2被实现"
          fields:
            - name: "RES0"
              bits: "31:3"
              desc: "保留，RES0。"
            - name: "BinaryPoint"
              bits: "2:0"
              desc: "如果 GIC 配置为对组 0 和组 1 中断使用单独的二进制小数点位域，则该位域的值控制如何将 8 位中断优先级位域拆分为组优先级位域（确定中断抢占）和子优先级位域。有关优先级的详细信息，请参阅 ARM® 通用中断控制器架构规范、GIC 架构版本 3.0 和版本 4.0 (ARM IHI 0069) 中的“优先级分组”。尝试将此位域编程为小于最小值的值会将该位域设置为最小值。如果 ICV_CTLR.CBPR 设置为 1，则非安全 EL1 读取返回 ICV_BPR0 + 1 饱和为 0b111。非安全 EL1 写入将被忽略。如果ICV_CTLR.CBPR设置为1，则安全EL1读取返回ICV_BPR0。安全EL1写入修改ICV_BPR0"
              reset_info: "温复位；AU"
        - name: "ICV_CTLR"
          desc: "控制 GIC 虚拟 CPU 接口的行为的各个方面，并提供有关所实现功能的信息。"
          condition: "当FEAT_AA32EL1被实现时，GICv3被实现，并且EL2被实现"
          fields:
            - name: "RES0"
              bits: "31:20"
              desc: "保留，RES0。"
            - name: "ExtRange"
              bits: "19"
              desc: "扩展 INTID 范围（只读）。 ICV_CTLR.ExtRange 是 ICC_CTLR.ExtRange 的别名。"
              values:
                - value: "0b0"
                  desc: "CPU 接口不支持 1024..8191 范围内的 INTID。如果 IRI 向 CPU 接口传送 1024 至 8191 范围内的中断，则行为为 UNPREDICTABLE。 Arm 强烈建议不要将 IRI 配置为将此范围内的中断传递给不支持这些中断的 PE。"
                - value: "0b1"
                  desc: "CPU 接口支持 1024..8191 范围内的 INTID。 1024..8191 范围内的所有 INTID 均被视为需要停用。"
            - name: "RSS"
              bits: "18"
              desc: "范围选择器支持。可能的值为：\n该位是只读的。"
              values:
                - value: "0b0"
                  desc: "支持亲和力级别 0 值为 0 - 15 的目标 SGI。"
                - value: "0b1"
                  desc: "支持亲和力级别 0 值为 0 - 255 的目标 SGI。"
            - name: "RES0"
              bits: "17:16"
              desc: "保留，RES0。"
            - name: "A3V"
              bits: "15"
              desc: "亲和力 3 有效。只读和写入将被忽略。可能的值为："
              values:
                - value: "0b0"
                  desc: "虚拟 CPU 接口逻辑仅支持 SGI 代系统寄存器中 Affinity 3 的零值。"
                - value: "0b1"
                  desc: "虚拟 CPU 接口逻辑支持 SGI 代系统寄存器中 Affinity 3 的非零值。"
            - name: "SEIS"
              bits: "14"
              desc: "SEI 支持。只读和写入将被忽略。指示虚拟CPU接口是否支持本地生成SEI："
              values:
                - value: "0b0"
                  desc: "虚拟CPU接口逻辑不支持本地生成SEI。"
                - value: "0b1"
                  desc: "虚拟CPU接口逻辑支持SEI的本地生成。"
            - name: "IDbits"
              bits: "13:11"
              desc: "标识符位。只读和写入将被忽略。支持的虚拟中断标识符位数：\n所有其他值均被保留。"
              values:
                - value: "0b000"
                  desc: "16 位。"
                - value: "0b001"
                  desc: "24 位。"
            - name: "PRIbits"
              bits: "10:8"
              desc: "优先级位。只读和写入将被忽略。实现的虚拟优先级位数减一。实现必须实现至少 32 级虚拟优先级（5 个优先级位）。组优先级和子优先级之间的划分在二进制小数点寄存器ICV_BPR0和ICV_BPR1中定义。"
            - name: "RES0"
              bits: "7:2"
              desc: "保留，RES0。"
            - name: "EOImode"
              bits: "1"
              desc: "虚拟EOI模式。控制对中断结束寄存器的写入是否也会停用虚拟中断："
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "ICV_EOIR0 和 ICV_EOIR1 提供优先级下降和中断停用功能。对ICV_DIR的访问是 UNPREDICTABLE。"
                - value: "0b1"
                  desc: "ICV_EOIR0 和 ICV_EOIR1 仅提供优先级下降功能。 ICV_DIR 提供中断停用功能。"
            - name: "CBPR"
              bits: "0"
              desc: "通用二进制点寄存器。控制是否使用同一寄存器来抢占虚拟组 0 和虚拟组 1 中断："
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "ICV_BPR0 仅确定虚拟组 0 中断的抢占组。 ICV_BPR1 确定虚拟组 1 中断的抢占组。"
                - value: "0b1"
                  desc: "ICV_BPR1 的非安全读取返回 ICV_BPR0 加一，饱和为 0b111。对 ICV_BPR1 的非安全写入将被忽略。 ICV_BPR1 的安全读取返回 ICV_BPR0。 ICV_BPR1 的安全写入修改 ICV_BPR0。"
        - name: "ICV_DIR"
          desc: "当中断优先级下降与中断停用分开时，写入该寄存器将停用指定的虚拟中断。"
          condition: "当FEAT_AA32EL1被实现时，GICv3被实现，并且EL2被实现"
          fields:
            - name: "RES0"
              bits: "31:24"
              desc: "保留，RES0。"
            - name: "INTID"
              bits: "23:0"
              desc: "要停用的虚拟中断的 INTID。该位域已实现 16 位或 24 位。实现的位数可以在ICV_CTLR.IDbits中找到。如果仅实现 16 位，则该寄存器的位 [23:16] 为 RES0。"
        - name: "ICV_EOIR0"
          desc: "APE写入该寄存器，通知CPU接口已完成指定虚拟0组中断的处理。"
          condition: "当FEAT_AA32EL1被实现时，GICv3被实现，并且EL2被实现"
          fields:
            - name: "RES0"
              bits: "31:24"
              desc: "保留，RES0。"
            - name: "INTID"
              bits: "23:0"
              desc: "INTID由对应的ICV_IAR0访问。该位域已实现 16 位或 24 位。实现的位数可以在ICV_CTLR.IDbits中找到。如果仅实现 16 位，则该寄存器的位 [23:16] 为 RES0。如果 ICV_CTLR.EOImode 位为 0，则写入该寄存器会降低虚拟中断的优先级，并停用虚拟中断。如果 ICV_CTLR.EOImode 位为 1，则写入该寄存器只会降低虚拟中断的优先级。软件必须写入ICV_DIR以停用虚拟中断。"
        - name: "ICV_EOIR1"
          desc: "APE写入该寄存器，通知CPU接口已完成指定虚拟组1中断的处理。"
          condition: "当FEAT_AA32EL1被实现时，GICv3被实现，并且EL2被实现"
          fields:
            - name: "RES0"
              bits: "31:24"
              desc: "保留，RES0。"
            - name: "INTID"
              bits: "23:0"
              desc: "INTID由对应的ICV_IAR1访问。该位域已实现 16 位或 24 位。实现的位数可以在ICV_CTLR.IDbits中找到。如果仅实现 16 位，则该寄存器的位 [23:16] 为 RES0。如果 ICV_CTLR.EOImode 位为 0，则写入该寄存器会降低虚拟中断的优先级，并停用虚拟中断。如果 ICV_CTLR.EOImode 位为 1，则写入该寄存器只会降低虚拟中断的优先级。软件必须写入ICV_DIR以停用虚拟中断。"
        - name: "ICV_HPPIR0"
          desc: "指示虚拟 CPU 接口上最高优先级的待处理虚拟组 0 中断。"
          condition: "当FEAT_AA32EL1被实现时，GICv3被实现，并且EL2被实现"
          fields:
            - name: "RES0"
              bits: "31:24"
              desc: "保留，RES0。"
            - name: "INTID"
              bits: "23:0"
              desc: "最高优先级待处理虚拟中断INTID。如果最高优先级挂起中断不可观察，则该位域包含一个特殊的INTID来指示原因。该特殊值INTID只能取值1023。有关详细信息，请参阅 ARM® 通用中断控制器架构规范、GIC 架构版本 3.0 和版本 4.0 (ARM IHI 0069) 中的“特殊 INTID”。该位域已实现 16 位或 24 位。实现的位数可以在ICV_CTLR.IDbits中找到。如果仅实现 16 位，则该寄存器的位 [23:16] 为 RES0。"
        - name: "ICV_HPPIR1"
          desc: "指示虚拟 CPU 接口上最高优先级的待处理虚拟组 1 中断。"
          condition: "当FEAT_AA32EL1被实现时，GICv3被实现，并且EL2被实现"
          fields:
            - name: "RES0"
              bits: "31:24"
              desc: "保留，RES0。"
            - name: "INTID"
              bits: "23:0"
              desc: "最高优先级待处理虚拟中断INTID。如果最高优先级挂起中断不可观察，则该位域包含一个特殊的INTID来指示原因。该特殊值INTID只能取值1023。有关详细信息，请参阅 ARM® 通用中断控制器架构规范、GIC 架构版本 3.0 和版本 4.0 (ARM IHI 0069) 中的“特殊 INTID”。该位域已实现 16 位或 24 位。实现的位数可以在ICV_CTLR.IDbits中找到。如果仅实现 16 位，则该寄存器的位 [23:16] 为 RES0。"
        - name: "ICV_IAR0"
          desc: "PE 读取该寄存器以获得发出信号的虚拟组 0 中断的 INTID。该读取充当中断的确认。"
          condition: "当FEAT_AA32EL1被实现时，GICv3被实现，并且EL2被实现"
          fields:
            - name: "RES0"
              bits: "31:24"
              desc: "保留，RES0。"
            - name: "INTID"
              bits: "23:0"
              desc: "发出信号的虚拟中断的 INTID。这是最高优先级待处理虚拟中断的 INTID，前提是该中断具有足够的优先级，可以将其发送到 PE，并且可以对其进行确认。如果最高优先级挂起中断不可观察，则该位域包含一个特殊的INTID来指示原因。该特殊值INTID只能取值1023。有关详细信息，请参阅 ARM® 通用中断控制器架构规范、GIC 架构版本 3.0 和版本 4.0 (ARM IHI 0069) 中的“特殊 INTID”。该位域已实现 16 位或 24 位。实现的位数可以在ICV_CTLR.IDbits中找到。如果仅实现 16 位，则该寄存器的位 [23:16] 为 RES0。"
        - name: "ICV_IAR1"
          desc: "PE 读取该寄存器以获得发出信号的虚拟组 1 中断的 INTID。该读取充当中断的确认。"
          condition: "当FEAT_AA32EL1被实现时，GICv3被实现，并且EL2被实现"
          fields:
            - name: "RES0"
              bits: "31:24"
              desc: "保留，RES0。"
            - name: "INTID"
              bits: "23:0"
              desc: "发出信号的虚拟中断的 INTID。这是最高优先级待处理虚拟中断的 INTID，前提是该中断具有足够的优先级，可以将其发送到 PE，并且可以对其进行确认。如果最高优先级挂起中断不可观察，则该位域包含一个特殊的INTID来指示原因。该特殊值INTID只能取值1023。有关详细信息，请参阅 ARM® 通用中断控制器架构规范、GIC 架构版本 3.0 和版本 4.0 (ARM IHI 0069) 中的“特殊 INTID”。该位域已实现 16 位或 24 位。实现的位数可以在ICV_CTLR.IDbits中找到。如果仅实现 16 位，则该寄存器的位 [23:16] 为 RES0。"
        - name: "ICV_IGRPEN0"
          desc: "控制是否启用虚拟组 0 中断。"
          condition: "当FEAT_AA32EL1被实现时，GICv3被实现，并且EL2被实现"
          fields:
            - name: "RES0"
              bits: "31:1"
              desc: "保留，RES0。"
            - name: "Enable"
              bits: "0"
              desc: "启用虚拟组 0 中断。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "虚拟组 0 中断被禁用。"
                - value: "0b1"
                  desc: "虚拟组 0 中断已启用。"
        - name: "ICV_IGRPEN1"
          desc: "控制是否为当前安全状态启用虚拟组 1 中断。"
          condition: "当FEAT_AA32EL1被实现时，GICv3被实现，并且EL2被实现"
          fields:
            - name: "RES0"
              bits: "31:1"
              desc: "保留，RES0。"
            - name: "Enable"
              bits: "0"
              desc: "启用虚拟组 1 中断。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "虚拟组 1 中断被禁用。"
                - value: "0b1"
                  desc: "虚拟组 1 中断已启用。"
        - name: "ICV_PMR"
          desc: "提供虚拟中断优先级过滤器。只有优先级高于该寄存器中的值的虚拟中断才会向 PE 发出信号。"
          condition: "当FEAT_AA32EL1被实现时，GICv3被实现，并且EL2被实现"
          fields:
            - name: "RES0"
              bits: "31:8"
              desc: "保留，RES0。"
            - name: "Priority"
              bits: "7:0"
              desc: "虚拟 CPU 接口的优先级掩码级别。如果虚拟中断的优先级高于该位域指示的值，则接口向PE发送虚拟中断信号。可能的优先级位域值如下：\n已实现的优先级 bitsPossible 优先级 levels[7:0]0x00-0xFF (0-255) 的优先级位域 valuesNumber、全部 values256[7:1]0x00-0xFE (0-254)、偶数值 only128[7:2]0x00-0xFC (0-252)，步长为 464[7:3]0x00-0xF8 (0-248)，步长为 832[7:4]0x00-0xF0 (0-240)，步长为 1616 未实现的优先级位为 RAZ/WI。"
              reset_info: "温复位；0x00"
        - name: "ICV_RPR"
          desc: "虚拟CPU接口的运行优先级。"
          condition: "当FEAT_AA32EL1被实现时，GICv3被实现，并且EL2被实现"
          fields:
            - name: "RES0"
              bits: "31:8"
              desc: "保留，RES0。"
            - name: "Priority"
              bits: "7:0"
              desc: "虚拟CPU接口当前的运行优先级。这是当前活动虚拟中断的组优先级。返回的优先级是组优先级，就好像当前异常级别和安全状态的 BPR 设置为已实现的优先级位数的最小值 BPR。如果实现 8 位优先级，则组优先级为优先级的位[7:1]。"
    - name: "Identification Registers"
      title: "标识寄存器"
      access: "MRS / MSR 系统寄存器接口"
      desc: "Arm AArch32 架构系统寄存器：识别寄存器"
      registers:
        - name: "CCSIDR"
          desc: "提供有关当前选定缓存的体系结构的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:24"
              source_condition: "When FEAT_CCIDX is implemented；Layout: IsFeatureImplemented(FEAT_CCIDX)"
              desc: "保留，RES0。"
              condition: "当实现FEAT_CCIDX时；布局：IsFeatureImplemented(FEAT_CCIDX)"
            - name: "Associativity"
              bits: "23:3"
              source_condition: "When FEAT_CCIDX is implemented；Layout: IsFeatureImplemented(FEAT_CCIDX)"
              desc: "（缓存的关联性）- 1，因此值 0 表示关联性为 1。关联性不必是 2 的幂。"
              condition: "当实现FEAT_CCIDX时；布局：IsFeatureImplemented(FEAT_CCIDX)"
            - name: "LineSize"
              bits: "2:0"
              source_condition: "When FEAT_CCIDX is implemented；Layout: IsFeatureImplemented(FEAT_CCIDX)"
              desc: "(Log2(缓存行中的字节数)) - 4. 例如：\n对于 16 字节的行长度：Log2(16) = 4，LineSize 条目 = 0。这是最小行长度。对于 32 字节的行长度：Log2(32) = 5，LineSize 条目 = 1。C++ 17 规范有两个与不干扰的内存粒度相关的已定义参数。对于通用软件和工具，Arm 将 hardware_destructive_interference_size 参数设置为 256 字节，将 hardware_constructive_interference_size 参数设置为 64 字节。"
              condition: "当实现FEAT_CCIDX时；布局：IsFeatureImplemented(FEAT_CCIDX)"
            - name: "UNKNOWN"
              bits: "31:28"
              source_condition: "Layout: !IsFeatureImplemented(FEAT_CCIDX)"
              desc: "保留，UNKNOWN。"
              condition: "布局：!IsFeatureImplemented(FEAT_CCIDX)"
            - name: "NumSets"
              bits: "27:13"
              source_condition: "Layout: !IsFeatureImplemented(FEAT_CCIDX)"
              desc: "（高速缓存中的组数）- 1，因此值 0 表示高速缓存中有 1 个组。集合的数量不必是 2 的幂。"
              condition: "布局：!IsFeatureImplemented(FEAT_CCIDX)"
            - name: "Associativity"
              bits: "12:3"
              source_condition: "Layout: !IsFeatureImplemented(FEAT_CCIDX)"
              desc: "（缓存的关联性）- 1，因此值 0 表示关联性为 1。关联性不必是 2 的幂。"
              condition: "布局：!IsFeatureImplemented(FEAT_CCIDX)"
            - name: "LineSize"
              bits: "2:0"
              source_condition: "Layout: !IsFeatureImplemented(FEAT_CCIDX)"
              desc: "(Log2(缓存行中的字节数)) - 4. 例如：\n对于 16 字节的行长度：Log2(16) = 4，LineSize 条目 = 0。这是最小行长度。对于 32 字节的行长度：Log2(32) = 5，LineSize 条目 = 1。C++ 17 规范有两个与不干扰的内存粒度相关的已定义参数。对于通用软件和工具，Arm 将 hardware_destructive_interference_size 参数设置为 256 字节，将 hardware_constructive_interference_size 参数设置为 64 字节。"
              condition: "布局：!IsFeatureImplemented(FEAT_CCIDX)"
        - name: "CCSIDR2"
          desc: "提供有关当前选定缓存的体系结构的信息。"
          condition: "当FEAT_AA32EL1被实现并且FEAT_CCIDX被实现时"
          fields:
            - name: "RES0"
              bits: "31:24"
              desc: "保留，RES0。"
            - name: "NumSets"
              bits: "23:0"
              desc: "（高速缓存中的组数）- 1，因此值 0 表示高速缓存中有 1 个组。集合的数量不必是 2 的幂。"
        - name: "CLIDR"
          desc: "标识在每个级别实现的缓存类型，并且可以使用按集合/方式操作的架构缓存维护指令进行管理，最多可达七个级别。还标识缓存层次结构的一致性级别 (LoC) 和统一级别 (LoU)。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "ICB"
              bits: "31:30"
              desc: "内部缓存边界。该位域指示缓存内部可缓存内存区域的边界。"
              values:
                - value: "0b00"
                  desc: "该机制未公开。"
                - value: "0b01"
                  desc: "L1缓存是最高的Inner Cacheable级别。"
                - value: "0b10"
                  desc: "L2缓存是最高的Inner Cacheable级别。"
                - value: "0b11"
                  desc: "L3缓存是最高的Inner Cacheable级别。"
            - name: "LoUU"
              bits: "29:27"
              desc: "缓存层次结构的统一单处理器级别。有关此位域值的说明，请参阅清理、无效以及清理和无效指令的术语。该位域不描述指令缓存失效的要求。请参阅 CTR.DIC.When FEAT_S2FWB 的实现，该架构要求该位域为零，以便不需要清理任何级别的数据缓存来管理指令获取的一致性。该位域具有 IMPLEMENTATION DEFINED 值。"
            - name: "LoC"
              bits: "26:24"
              desc: "缓存层次结构的一致性级别。有关此位域值的说明，请参阅清理、无效以及清理和无效指令的术语。该位域具有 IMPLEMENTATION DEFINED 值。"
            - name: "LoUIS"
              bits: "23:21"
              desc: "缓存层次结构的统一内部可共享级别。有关此位域值的说明，请参阅清理、无效以及清理和无效指令的术语。该位域不描述指令缓存失效的要求。请参阅 CTR.DIC.When FEAT_S2FWB 的实现，该架构要求该位域为零，以便不需要清理任何级别的数据缓存来管理指令获取的一致性。该位域具有 IMPLEMENTATION DEFINED 值。"
            - name: "Ctype<n>"
              bits: "20:0"
              desc: "缓存类型位域。指示已实现的缓存类型，并且可以使用架构化的缓存维护指令进行管理，这些指令在每个级别（从 1 级到最多 7 级缓存层次结构）按集合/方式操作。所有其他值均被保留。如果软件从 Ctype1 向上读取缓存类型位域，一旦它看到值 0b000，则在层次结构的更远级别上不存在可以使用按 set/way 操作的架构缓存维护指令来管理的缓存。因此，例如，如果 Ctype3 是第一个值为 0b000 的缓存类型位域，则必须忽略 Ctype4 到 Ctype7 的值。"
              values:
                - value: "0b000"
                  desc: "没有缓存。"
                - value: "0b001"
                  desc: "仅指令缓存。"
                - value: "0b010"
                  desc: "仅数据缓存。"
                - value: "0b011"
                  desc: "独立的指令和数据缓存。"
                - value: "0b100"
                  desc: "统一缓存。"
        - name: "CSSELR"
          desc: "通过指定所需的缓存级别和缓存类型（指令缓存或数据缓存）来选择当前缓存大小ID寄存器，CCSIDR。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:4"
              desc: "保留，RES0。"
            - name: "Level"
              bits: "3:1"
              desc: "所需缓存的缓存级别。允许的值为：\n所有其他值均被保留。如果 CSSELR.{Level, InD} 被编程为未实现的缓存级别，则读取 CSSELR 时该位域的值为 UNKNOWN。"
              reset_info: "温复位；AU"
              values:
                - value: "0b000"
                  desc: "1 级缓存。"
                - value: "0b001"
                  desc: "2 级缓存。"
                - value: "0b010"
                  desc: "三级缓存。"
                - value: "0b011"
                  desc: "4 级缓存。"
                - value: "0b100"
                  desc: "5级缓存。"
                - value: "0b101"
                  desc: "6级缓存。"
                - value: "0b110"
                  desc: "7级缓存。"
            - name: "InD"
              bits: "0"
              desc: "指令不是数据位。允许的值为：\n如果 CSSELR.{Level, InD} 被编程为未实现的缓存级别，则读取 CSSELR 时该位域的值为 UNKNOWN。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "数据或者统一缓存。"
                - value: "0b1"
                  desc: "指令缓存。"
        - name: "CTR"
          desc: "提供有关缓存体系结构的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES1"
              bits: "31"
              desc: "保留，RES1。"
            - name: "RES0"
              bits: "30"
              desc: "保留，RES0。"
            - name: "DIC"
              bits: "29"
              desc: "数据与指令一致性的指令高速缓存失效要求。同一 Inner Shareable 共享域中的所有 PE 必须具有该位域的共同值。"
              values:
                - value: "0b0"
                  desc: "为了保证数据与指令的一致性，需要使指令高速缓存对统一点无效。"
                - value: "0b1"
                  desc: "数据与指令的一致性不需要指令高速缓存对统一点的无效。"
            - name: "IDC"
              bits: "28"
              desc: "数据缓存清理要求指令与数据的一致性。该位的含义是：\n如果 CTR.DIC 为 1，则此位域中报告的值必须为 1。如果满足以下任一条件，则 IDC 的有效值为 1：\nCTR.IDC == 1。CLIDR.LoC == 0b000。 CLIDR.LoUIS == 0b000 和 CLIDR.LoUU == 0b000。同一 Inner Shareable 共享域中的所有 PE 必须具有共同的有效值 IDC。"
              values:
                - value: "0b0"
                  desc: "为了指令与数据的一致性，需要将数据缓存清理到统一点，除非 CLIDR.LoC == 0b000 或 (CLIDR.LoUIS == 0b000 且 CLIDR.LoUU == 0b000)。"
                - value: "0b1"
                  desc: "指令与数据的一致性不需要将数据缓存清理到统一点。"
            - name: "CWG"
              bits: "27:24"
              desc: "缓存写回粒度。 Log2 由于已修改内存位置的缓存条目的逐出而可以覆盖的最大内存大小的字数。值 0b0000 表示该寄存器不提供缓存写回粒度信息，并且：\n必须假定架构最大值为 512 个字 (2KB)。高速缓存写回粒度可以根据高速缓存大小ID寄存器中编码的最大高速缓存行大小来确定。大于 0b1001 的值被保留。 Arm 建议不支持缓存回写的实现将此位域实现为 0b0001。例如，这适用于仅支持直写式高速缓存的实现。该位域具有 IMPLEMENTATION DEFINED 值。"
            - name: "ERG"
              bits: "23:20"
              desc: "独家预订粒度。 Log2 已为 Load-Exclusive 和 Store-Exclusive 指令实现的保留粒度最大大小的字数。不推荐使用值 0b0000。值 0b0001 和大于 0b1001 的值被保留。该位域具有 IMPLEMENTATION DEFINED 值。"
            - name: "DminLine"
              bits: "19:16"
              desc: "PE控制的所有数据缓存和统一缓存中最小缓存行的字数Log2。该位域具有 IMPLEMENTATION DEFINED 值。"
            - name: "L1Ip"
              bits: "15:14"
              desc: "1 级指令缓存策略。指示L1指令缓存的索引和标记策略。从 Armv8.0 开始，不允许使用值 0b01。"
              values:
                - value: "0b00"
                  desc: "保留。"
                - value: "0b01"
                  desc: "ASID 标记的虚拟索引，虚拟标签 (AIVIVT)。"
                - value: "0b10"
                  desc: "虚拟索引，物理标签（VIPT）。"
                - value: "0b11"
                  desc: "物理索引、物理标签（PIPT）。"
            - name: "RES0"
              bits: "13:4"
              desc: "保留，RES0。"
            - name: "IminLine"
              bits: "3:0"
              desc: "Log2是PE控制的所有指令高速缓存的最小高速缓存行中的字数。该位域具有 IMPLEMENTATION DEFINED 值。"
        - name: "DBGDEVID"
          desc: "通过描述调试实现的其他功能来添加 DBGDIDR 给出的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "CIDMask"
              bits: "31:28"
              desc: "指示上下文ID匹配断点屏蔽功能的支持级别。所有其他值均被保留。 Armv8 的值为 0b0000。"
              values:
                - value: "0b0000"
                  desc: "未实现上下文 ID 屏蔽。"
                - value: "0b0001"
                  desc: "实现了上下文ID屏蔽。"
            - name: "AuxRegs"
              bits: "27:24"
              desc: "表示对辅助寄存器的支持。所有其他值均被保留。"
              values:
                - value: "0b0000"
                  desc: "没有一个支持。"
                - value: "0b0001"
                  desc: "支持外部调试辅助控制寄存器，EDACR。"
            - name: "DoubleLock"
              bits: "23:20"
              desc: "OS 实现双重锁定。 FEAT_DoubleLock 实现由值 0b0001 标识的功能。所有其他值均被保留。"
              values:
                - value: "0b0000"
                  desc: "OS 未实现双重锁定。 DBGOSDLR 为 RAZ/WI。"
                - value: "0b0001"
                  desc: "OS 实现双重锁定。 DBGOSDLR 是 RW。"
            - name: "VirtExtns"
              bits: "19:16"
              desc: "指示是否实现EL2。所有其他值均被保留。"
              values:
                - value: "0b0000"
                  desc: "EL2 未实现。"
                - value: "0b0001"
                  desc: "EL2 已实现。"
            - name: "VectorCatch"
              bits: "15:12"
              desc: "定义 Vector Catch 异常实现的形式。所有其他值均被保留。"
              values:
                - value: "0b0000"
                  desc: "已实现地址匹配向量捕获异常。"
                - value: "0b0001"
                  desc: "异常匹配已实现 Vector Catch 异常。"
            - name: "BPAddrMask"
              bits: "11:8"
              desc: "指示指令地址匹配断点屏蔽功能的支持级别。所有其他值均被保留。 Armv8 的值为 0b1111。"
              values:
                - value: "0b0000"
                  desc: "可以实现断点地址屏蔽。如果未实现，DBGBCR<n>[28:24] 为 RAZ/WI。"
                - value: "0b0001"
                  desc: "实现了断点地址屏蔽。"
                - value: "0b1111"
                  desc: "未实现断点地址屏蔽。 DBGBCR<n>[28:24] 是 RES0。"
            - name: "WPAddrMask"
              bits: "7:4"
              desc: "指示数据地址匹配观察点屏蔽功能的支持级别。所有其他值均被保留。 Armv8 的值为 0b0001。"
              values:
                - value: "0b0000"
                  desc: "可能会实现观察点地址屏蔽。如果未实现，DBGWCR<n>.MASK（地址掩码）为 RAZ/WI。"
                - value: "0b0001"
                  desc: "实现观察点地址屏蔽。"
                - value: "0b1111"
                  desc: "未实现观察点地址屏蔽。 DBGWCR<n>.MASK（地址掩码）为 RES0。"
            - name: "PCSample"
              bits: "3:0"
              desc: "指示使用外部调试寄存器的 PC 基于样本的分析支持的级别。所有其他值均被保留。实现 FEAT_PCSRv8p2 时，唯一允许的值为 0b0000。 FEAT_PCSRv8p2 在性能监视器寄存器空间中实现 PC 基于样本的分析扩展，如 PMDEVID.PCSample 的值所示。"
              values:
                - value: "0b0000"
                  desc: "PC 基于样本的分析扩展未在外部调试寄存器空间中实现。"
                - value: "0b0010"
                  desc: "仅实现了EDPCSR和EDCIDSR。仅当 EL3 和 EL2 未实现时才允许使用此选项。"
                - value: "0b0011"
                  desc: "实现了EDPCSR、EDCIDSR和EDVIDSR。"
        - name: "DBGDEVID1"
          desc: "通过描述调试实现的其他功能来添加 DBGDIDR 给出的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:4"
              desc: "保留，RES0。"
            - name: "PCSROffset"
              bits: "3:0"
              desc: "该位域指示应用于 EDPCSR 读取返回的 PC 样本的偏移量。实现 FEAT_PCSRv8p2 时，唯一允许的值为 0b0000。 FEAT_PCSRv8p2 在性能监视器寄存器空间中实现 PC 基于样本的分析扩展，如 PMDEVID.PCSample 的值所示。"
              values:
                - value: "0b0000"
                  desc: "EDPCSR 未实现。"
                - value: "0b0010"
                  desc: "EDPCSR 已实现。样本未应用偏移，并且不会对 AArch32 状态下的指令集状态进行采样。"
        - name: "DBGDIDR"
          desc: "指定实现了哪个版本的调试架构，以及调试实现的一些功能。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "WRPs"
              bits: "31:28"
              desc: "观察点数量，负 1。如果实现了 FEAT_Debugv8p9 并且实现了 16 个或更多观察点，则该位域读取为 0b1111。如果EL1支持AArch32，则PE不会实现超过16个watchpoints.The值0b0000被保留。"
              values:
                - value: "0b0001..0b1111"
                  desc: "观察点的数量，负 1。"
            - name: "BRPs"
              bits: "27:24"
              desc: "断点数量，负1。如果实现了FEAT_Debugv8p9并且实现了16个或更多断点，则该位域读取为0b1111。如果EL1支持AArch32，则PE不会实现超过16个breakpoints.The值0b0000被保留。"
              values:
                - value: "0b0001..0b1111"
                  desc: "断点数量，负 1。"
            - name: "CTX_CMPs"
              bits: "23:20"
              desc: "上下文感知断点的数量，减 1。该位域的值永远不会大于 DBGDIDR.BRPs。如果实现了 FEAT_Debugv8p9 并实现了 16 个或更多上下文感知断点，则该位域读取为 0b1111。如果EL1支持AArch32，则PE不会实现超过16个断点。"
              values:
                - value: "0b0000..0b1111"
                  desc: "上下文感知断点的数量，负 1。"
            - name: "Version"
              bits: "19:16"
              desc: "调试架构版本。指示存在 Armv8 调试架构。所有其他值均被保留。从 Armv8.0 开始，不允许使用值 0b0000、0b0001、0b0010、0b0011、0b0100 和 0b0101。 FEAT_Debugv8p1 实现由值 0b0111 标识的功能。 FEAT_Debugv8p2 实现由值 0b1000 标识的功能。 FEAT_Debugv8p4 实现由值 0b1001 标识的功能。 FEAT_Debugv8p8 实现由值 0b1010 标识的功能。 FEAT_Debugv8p9 实现由值 0b1011 标识的功能。从 Armv8.1 开始，当实现 FEAT_Debugv8p1 时，不允许使用值 0b0110。从 Armv8.2 开始，不允许使用值 0b0110 和 0b0111。从 Armv8.4 开始，不允许使用值 0b1000。从 Armv8.8 开始，不允许使用值 0b1001。从 Armv8.9 开始，不允许使用值 0b1010。"
              values:
                - value: "0b0000"
                  desc: "不支持。"
            - name: "RES1"
              bits: "15"
              desc: "保留，RES1。"
            - name: "nSUHD_imp"
              bits: "14"
              desc: "之前指出未实现安全用户停止调试。该位域的值必须与 SE_imp 位域的值匹配。该位域具有 IMPLEMENTATION DEFINED 值。"
            - name: "RES0"
              bits: "13"
              desc: "保留，RES0。"
            - name: "SE_imp"
              bits: "12"
              desc: "EL3 已实现。该位域的值必须与 nSUHD_imp 位域的值匹配。"
              values:
                - value: "0b0"
                  desc: "EL3 未实现。"
                - value: "0b1"
                  desc: "EL3 已实现。"
            - name: "RES0"
              bits: "11:0"
              desc: "保留，RES0。"
        - name: "ERRIDR"
          desc: "定义可通过错误记录系统寄存器访问的错误记录的最高编号索引。"
          condition: "当实现 FEAT_RAS 并实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:16"
              desc: "保留，RES0。"
            - name: "NUM"
              bits: "15:0"
              desc: "可通过错误记录系统寄存器访问的记录的最高编号索引加一。零表示无法通过错误记录系统寄存器访问任何记录。每个实现的记录都由一个节点拥有。一个节点可能拥有多条记录。该位域具有 IMPLEMENTATION DEFINED 值。"
        - name: "ID_AFR0"
          desc: "提供有关 AArch32 状态下 PE 的 IMPLEMENTATION DEFINED 功能的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:16"
              desc: "保留，RES0。"
            - name: "IMPLEMENTATION DEFINED"
              bits: "15:12"
              desc: "IMPLEMENTATION DEFINED。"
            - name: "IMPLEMENTATION DEFINED"
              bits: "11:8"
              desc: "IMPLEMENTATION DEFINED。"
            - name: "IMPLEMENTATION DEFINED"
              bits: "7:4"
              desc: "IMPLEMENTATION DEFINED。"
            - name: "IMPLEMENTATION DEFINED"
              bits: "3:0"
              desc: "IMPLEMENTATION DEFINED。"
        - name: "ID_DFR0"
          desc: "提供有关处于 AArch32 状态的调试系统的顶级信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "PerfMon"
              bits: "27:24"
              desc: "性能监视器扩展版本。该位域不遵循标准 ID 方案，而是使用“用于性能监视器扩展版本的替代 ID 方案”中描述的替代 ID 方案。所有其他值均被保留。 FEAT_PMUv3 实现由值 0b0011 标识的功能。 FEAT_PMUv3p1 实现由值 0b0100 标识的功能。 FEAT_PMUv3p4 实现由值 0b0101 标识的功能。 FEAT_PMUv3p5 实现由值 0b0110 标识的功能。 FEAT_PMUv3p7 实现由值 0b0111 标识的功能。 FEAT_PMUv3p8 实现由值 0b1000 标识的功能。 FEAT_PMUv3p9 实现\n由值 0b1001 标识的功能。在任何 Armv8 实现中，不允许使用值 0b0001 和 0b0010。从Armv8.1开始，如果实现FEAT_PMUv3，则不允许使用值0b0011。从Armv8.4开始，如果实现FEAT_PMUv3，则不允许使用值0b0100。从Armv8.5开始，如果实现FEAT_PMUv3，则不允许使用值0b0101。从Armv8.7开始，如果实现FEAT_PMUv3，则不允许使用值0b0110。从Armv8.8开始，如果实现FEAT_PMUv3，则不允许使用值0b0111。从Armv8.9开始，如果实现FEAT_PMUv3，则不允许使用值0b1000。在Armv7中，值0b0000可以表示实现了PMUv1。 Armv8 实现中不允许使用 PMUv1 和 PMUv2。"
              values:
                - value: "0b0000"
                  desc: "性能监视器扩展未实现。"
                - value: "0b0001"
                  desc: "性能监视器扩展，PMUv1 已实现。"
                - value: "0b0010"
                  desc: "性能监视器扩展，PMUv2 已实现。"
                - value: "0b0011"
                  desc: "性能监视器扩展，PMUv3 已实现。"
                - value: "0b0100"
                  desc: "PMUv3 适用于 Armv8.1。作为 0b0011，并添加了对以下内容的支持：\n扩展 16 位 PMEVTYPER<n>.evtCount 位域。如果执行EL2，则由HDCR.HPMD控制。"
                - value: "0b0101"
                  desc: "PMUv3 适用于 Armv8.4。为 0b0100，并添加对 PMMIR 寄存器的支持。"
                - value: "0b0110"
                  desc: "PMUv3 适用于 Armv8.5。作为 0b0101，并添加了对以下内容的支持：\n64 位事件计数器。如果执行EL2，则由HDCR.HCCD控制。如果执行EL3，则由SDCR.SCCD控制。"
                - value: "0b0111"
                  desc: "PMUv3 适用于 Armv8.7。作为 0b0110，并添加了对以下内容的支持：\nPMCR.FZO 以及EL2 被实现时，由HDCR.HPMFZO 控制。如果实现 EL3 并使用 AArch64，则 MDCR_EL3.{MPMX,MCCD} 进行控制。"
                - value: "0b1000"
                  desc: "PMUv3 适用于 Armv8.8。作为 0b0111，并且：\n扩展公共事件编号空间以包括 0x0040 至 0x00BF 和 0x4040 至 0x40BF。如果选择了保留或未实现的 PMU 事件编号，则删除 CONSTRAINED UNPREDICTABLE 行为。"
                - value: "0b1001"
                  desc: "PMUv3 适用于 Armv8.9。作为 0b1000，并且：\n更新现有 PMU 事件的定义。添加对 EDECR.PME 控件的支持。"
                - value: "0b1111"
                  desc: "支持 IMPLEMENTATION DEFINED 形式的性能监视器，不支持 PMUv3。 Arm 不建议在新实现中使用此值。"
            - name: "MProfDbg"
              bits: "23:20"
              desc: "M 型材调试。支持 M 配置处理器的内存映射调试模型。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "不支持。"
                - value: "0b0001"
                  desc: "支持 M-profile 调试架构，具有内存映射访问。"
            - name: "MMapTrc"
              bits: "19:16"
              desc: "内存映射跟踪。支持内存映射跟踪模型。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0001。有关更多信息，请参阅 Arm® 嵌入式跟踪宏单元架构规范，ETMv4 (ARM IHI 0064)。"
              values:
                - value: "0b0000"
                  desc: "不支持。"
                - value: "0b0001"
                  desc: "支持 Arm 跟踪架构，具有内存映射访问。"
            - name: "CopTrc"
              bits: "15:12"
              desc: "支持基于系统寄存器的跟踪模型，使用 coproc == 0b1110 编码空间中的寄存器。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0001。有关更多信息，请参阅 Arm® 嵌入式跟踪宏单元架构规范，ETMv4 (ARM IHI 0064)。"
              values:
                - value: "0b0000"
                  desc: "不支持。"
                - value: "0b0001"
                  desc: "支持 Arm 跟踪架构，具有系统寄存器访问权限。"
            - name: "MMapDbg"
              bits: "11:8"
              desc: "内存映射调试。支持 A 和 R 配置处理器的 Armv7 内存映射调试模型。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。 Armv8 定义的可选内存映射与 Armv7 不兼容。"
              values:
                - value: "0b0000"
                  desc: "不支持。"
                - value: "0b0100"
                  desc: "支持Armv7、v7调试架构，具有内存映射访问。"
                - value: "0b0101"
                  desc: "支持Armv7、v7.1 调试架构，具有内存映射访问功能。"
            - name: "CopSDbg"
              bits: "7:4"
              desc: "支持基于系统寄存器的安全调试模型，使用 coproc = 0b1110 编码空间中的寄存器，适用于包含 EL3 的 A 配置文件处理器。如果未实现EL3且实现的安全状态为非安全状态，则该位域为 RES0。否则，该位域读取与位[3:0]相同。该位域有一个 IMPLEMENTATION DEFINED 值。"
            - name: "CopDbg"
              bits: "3:0"
              desc: "调试架构版本。指示存在 Armv8 调试架构。所有其他值均被保留。 Armv8 中不允许使用值 0b0000、0b0010、0b0011、0b0100 和 0b0101。 FEAT_Debugv8p1 实现由值 0b0111 标识的功能。 FEAT_Debugv8p2 实现由值 0b1000 标识的功能。 FEAT_Debugv8p4 实现由值 0b1001 标识的功能。 FEAT_Debugv8p8 实现由值 0b1010 标识的功能。 FEAT_Debugv8p9 实现由值 0b1011 标识的功能。从 Armv8.1 开始，当实现 FEAT_Debugv8p1 时，不允许使用值 0b0110。从 Armv8.2 开始，不允许使用值 0b0110 和 0b0111。从 Armv8.4 开始，不允许使用值 0b1000。从 Armv8.8 开始，不允许使用值 0b1001。从 Armv8.9 开始，不允许使用值 0b1010。"
              values:
                - value: "0b0000"
                  desc: "不支持。"
        - name: "ID_DFR1"
          desc: "提供有关 AArch32 中调试系统的顶级信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:8"
              desc: "保留，RES0。"
            - name: "HPMN0"
              bits: "7:4"
              desc: "来宾操作系统的 PMU 事件计数器为零。所有其他值均被保留。如果未实现FEAT_PMUv3、未实现FEAT_FGT或未实现EL2，则唯一允许的值为0b0000。 FEAT_HPMN0 实现由值 0b0001 标识的功能。从 Armv8.8 开始，在包含 FEAT_PMUv3、FEAT_FGT 和 EL2 的实现中，不允许使用值 0b0000。"
              values:
                - value: "0b0000"
                  desc: "将 HDCR.HPMN 设置为零会产生 CONSTRAINED UNPREDICTABLE 行为。"
                - value: "0b0001"
                  desc: "将 HDCR.HPMN 设置为零已定义行为。"
            - name: "MTPMU"
              bits: "3:0"
              desc: "多线程PMU扩展。所有其他值均被保留。 FEAT_MTPMU 实现由值 0b0001 标识的功能。从 Armv8.6 开始，在包含 FEAT_PMUv3 的实现中，不允许使用值 0b0000。在不包含 FEAT_PMUv3 的实现中，不允许使用值 0b0001。"
              values:
                - value: "0b0000"
                  desc: "FEAT_MTPMU 未实现。如果实现了 FEAT_PMUv3，则 PMEVTYPER<n>.MT 是读/写还是 RES0 都是 IMPLEMENTATION DEFINED。"
                - value: "0b0001"
                  desc: "已实现 FEAT_MTPMU 和 FEAT_PMUv3。 PMEVTYPER<n>.MT 可读/写。当FEAT_MTPMU禁用时，PMEVTYPER<n>.MT的有效值为0。"
                - value: "0b1111"
                  desc: "FEAT_MTPMU 未实现。如果实现 FEAT_PMUv3，则 PMEVTYPER<n>.MT 为 RES0。"
        - name: "ID_ISAR0"
          desc: "提供有关PE在AArch32 状态下实现的指令集的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:28"
              desc: "保留，RES0。"
            - name: "Divide"
              bits: "27:24"
              desc: "表示已实现的除法指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0010。"
              values:
                - value: "0b0000"
                  desc: "没有实现。"
                - value: "0b0001"
                  desc: "在T32指令集中添加SDIV和UDIV。"
                - value: "0b0010"
                  desc: "对于0b0001，在A32指令集中添加SDIV和UDIV。"
            - name: "Debug"
              bits: "23:20"
              desc: "表示已实现的 Debug 指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "没有实现。"
                - value: "0b0001"
                  desc: "添加BKPT。"
            - name: "Coproc"
              bits: "19:16"
              desc: "表示已实现的系统寄存器访问指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "没有实现，除了架构单独归属的指令以提供对 AArch32 系统寄存器和系统指令的访问。"
                - value: "0b0001"
                  desc: "添加通用CDP、LDC、MCR、MRC和STC。"
                - value: "0b0010"
                  desc: "对于 0b0001，添加通用 CDP2、LDC2、MCR2、MRC2 和 STC2。"
                - value: "0b0011"
                  desc: "至于0b0010，并添加通用MCRR和MRRC。"
                - value: "0b0100"
                  desc: "至于0b0011，并添加通用MCRR2和MRRC2。"
            - name: "CmpBranch"
              bits: "15:12"
              desc: "表示T32指令集中实现的组合比较和分支指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "没有实现。"
                - value: "0b0001"
                  desc: "添加CBNZ和CBZ。"
            - name: "BitField"
              bits: "11:8"
              desc: "表示支持BitField指令BFC、BFI、SBFX和UBFX。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "指定的指令未执行。"
                - value: "0b0001"
                  desc: "指定的指令被执行。"
            - name: "BitCount"
              bits: "7:4"
              desc: "表示已实现的位计数指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "没有实现。"
                - value: "0b0001"
                  desc: "添加CLZ。"
            - name: "Swap"
              bits: "3:0"
              desc: "表示A32指令集中实现的Swap指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "没有实现。"
                - value: "0b0001"
                  desc: "添加SWP和SWPB。"
        - name: "ID_ISAR1"
          desc: "提供有关PE在AArch32 状态下实现的指令集的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "Jazelle"
              bits: "31:28"
              desc: "表示已实现的 Jazelle 扩展指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "不支持贾泽尔。"
                - value: "0b0001"
                  desc: "添加BXJ指令，以及PSR中的J位。此设置可能表示 Jazelle 扩展的简单实现。"
            - name: "Interwork"
              bits: "27:24"
              desc: "表示已实现的互通指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0011。"
              values:
                - value: "0b0000"
                  desc: "没有实现。"
                - value: "0b0001"
                  desc: "添加BX指令，以及PSR中的T位。"
                - value: "0b0010"
                  desc: "至于0b0001，并增加了BLX指令。 PC 负载具有类似 BX 的行为。"
                - value: "0b0011"
                  desc: "对于 0b0010，保证以 PC 为目标且 S 位清零的 A32 指令集中的数据处理指令具有类似 BX 的行为。"
            - name: "Immediate"
              bits: "23:20"
              desc: "表示支持具有长立即数的数据处理指令：\nMOVT 指令 MOV 指令使用零扩展 16 位立即数进行编码。 T32 ADD 和 SUB 指令编码采用零扩展 12 位立即数，其他 ADD、ADR 和 SUB 编码由这些编码的伪代码交叉引用。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "指定的指令未执行。"
                - value: "0b0001"
                  desc: "指定的指令被执行。"
            - name: "IfThen"
              bits: "19:16"
              desc: "表示T32指令集中实现的If-Then指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "没有实现。"
                - value: "0b0001"
                  desc: "添加IT指令以及PSR中的IT位。"
            - name: "Extend"
              bits: "15:12"
              desc: "表示已实现的扩展指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0010。"
              values:
                - value: "0b0000"
                  desc: "未实现标量符号扩展或零扩展指令，其中标量指令表示非高级 SIMD 指令。"
                - value: "0b0001"
                  desc: "添加SXTB、SXTH、UXTB和UXTH指令。"
                - value: "0b0010"
                  desc: "对于0b0001，添加了SXTB16、SXTAB、SXTAB16、SXTAH、UXTB16、UXTAB、UXTAB16 和 UXTAH 指令。"
            - name: "Except_AR"
              bits: "11:8"
              desc: "指示已实现的 A 和 R-profile 异常处理指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "没有实现。"
                - value: "0b0001"
                  desc: "添加SRS和RFE指令，以及CPS指令的A和R配置形式。"
            - name: "Except"
              bits: "7:4"
              desc: "表示A32指令集中实现的异常处理指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "未实现。这表明 LDM 和 STM 指令的用户库和异常返回形式未实现。"
                - value: "0b0001"
                  desc: "添加LDM（异常返回）、LDM（用户寄存器）和STM（用户寄存器）指令版本。"
            - name: "Endian"
              bits: "3:0"
              desc: "表示已实现的 Endian 指令。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0001。"
              values:
                - value: "0b0000"
                  desc: "没有实现。"
                - value: "0b0001"
                  desc: "添加SETEND指令以及PSR中的E位。"
        - name: "ID_ISAR2"
          desc: "提供有关PE在AArch32 状态下实现的指令集的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "Reversal"
              bits: "31:28"
              desc: "表示已执行的反转指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0010。"
              values:
                - value: "0b0000"
                  desc: "没有实现。"
                - value: "0b0001"
                  desc: "添加REV、REV16和REVSH指令。"
                - value: "0b0010"
                  desc: "对于0b0001，增加了RBIT指令。"
            - name: "PSR_AR"
              bits: "27:24"
              desc: "表示已实现的 A 和 R 型指令来操纵 PSR。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。数据处理指令的异常返回形式为：\n在A32指令集中，以PC为目标且设置了S位的数据处理指令。这些指令可能会受到 WithShifts 属性的影响。在T32指令集中，有SUBS、PC、LR、#N指令。"
              values:
                - value: "0b0000"
                  desc: "没有实现。"
                - value: "0b0001"
                  desc: "增加MRS和MSR指令，以及数据处理指令的异常返回形式。"
            - name: "MultU"
              bits: "23:20"
              desc: "表示已实现的高级无符号乘法指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0010。"
              values:
                - value: "0b0000"
                  desc: "没有实现。"
                - value: "0b0001"
                  desc: "添加UMULL和UMLAL指令。"
                - value: "0b0010"
                  desc: "至于0b0001，并增加了UMAAL指令。"
            - name: "MultS"
              bits: "19:16"
              desc: "表示已实现的高级带符号乘法指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0011。"
              values:
                - value: "0b0000"
                  desc: "没有实现。"
                - value: "0b0001"
                  desc: "添加SMULL和SMLAL指令。"
                - value: "0b0010"
                  desc: "对于0b0001，添加了SMLABB、SMLABT、SMLALBB、SMLALBT、SMLALTB、SMLALTT、SMLATB、SMLATT、SMLAWB、SMLAWT、SMULBB、SMULBT、SMULTB、SMULTT、SMULWB 和 SMULWT 指令。还在 PSR 中添加 Q 位。"
                - value: "0b0011"
                  desc: "对于0b0010，添加了SMLAD、SMLADX、SMLALD、SMLALDX、SMLSD、SMLSDX、SMLSLD、SMLSLDX、SMMLA、SMMLAR、SMMLS、SMMLSR、SMMUL、SMMULR、SMUAD、SMUADX、SMUSD 和 SMUSDX说明。"
            - name: "Mult"
              bits: "15:12"
              desc: "表示已实现的附加乘法指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0010。"
              values:
                - value: "0b0000"
                  desc: "没有执行任何附加指令。这意味着仅实现了 MUL。"
                - value: "0b0001"
                  desc: "添加MLA指令。"
                - value: "0b0010"
                  desc: "对于0b0001，增加了MLS指令。"
            - name: "MultiAccessInt"
              bits: "11:8"
              desc: "表示支持可中断多路访问指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "没有支持。这意味着 LDM 和 STM 指令不可中断。"
                - value: "0b0001"
                  desc: "LDM 和 STM 指令可重新启动。"
                - value: "0b0010"
                  desc: "LDM和STM指令是连续的。"
            - name: "MemHint"
              bits: "7:4"
              desc: "表示已实现的内存提示指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0100。"
              values:
                - value: "0b0000"
                  desc: "没有实现。"
                - value: "0b0001"
                  desc: "添加PLD指令。"
                - value: "0b0010"
                  desc: "添加PLD指令。 （0b0001 和 0b0010 具有相同的效果。）"
                - value: "0b0011"
                  desc: "至于0b0001（或0b0010），并增加了PLI指令。"
                - value: "0b0100"
                  desc: "对于0b0011，增加了PLDW指令。"
            - name: "LoadStore"
              bits: "3:0"
              desc: "指示已实现的附加加载/存储指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0010。"
              values:
                - value: "0b0000"
                  desc: "没有执行额外的加载/存储指令。"
                - value: "0b0001"
                  desc: "添加LDRD和STRD指令。"
                - value: "0b0010"
                  desc: "对于0b0001，添加Load Acquire(LDAB、LDAH、LDA、LDAEXB、LDAEXH、LDAEX、LDAEXD) 和商店发布 (STLB、STLH、STL、STLEXB、STLEXH、STLEX、STLEXD) 指令。"
        - name: "ID_ISAR3"
          desc: "提供有关PE在AArch32 状态下实现的指令集的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "T32EE"
              bits: "31:28"
              desc: "表示已实现的T32EE指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "没有实现。"
                - value: "0b0001"
                  desc: "添加 ENTERX 和 LEAVEX 指令，并修改加载行为以包括空检查。"
            - name: "TrueNOP"
              bits: "27:24"
              desc: "表示已实现的真NOP指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "没有实现。这意味着不存在不具有任何寄存器依赖性的 NOP 指令。"
                - value: "0b0001"
                  desc: "在 T32 和 A32 指令集中添加真正的 NOP 指令。这也允许附加的 NOP 兼容提示。"
            - name: "T32Copy"
              bits: "23:20"
              desc: "表示支持T32非标志位设置MOV指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "不支持。这意味着在T32指令集中，编码MOV(寄存器)指令的T1不支持从低位寄存器到低位寄存器的复制。"
                - value: "0b0001"
                  desc: "添加对MOV（寄存器）指令的T32指令集编码T1的支持，从低位寄存器复制到低位寄存器。"
            - name: "TabBranch"
              bits: "19:16"
              desc: "表示T32指令集中实现的表分支指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "没有实现。"
                - value: "0b0001"
                  desc: "添加TBB和TBH指令。"
            - name: "SynchPrim"
              bits: "15:12"
              desc: "与ID_ISAR4.SynchPrim_frac结合使用，指示已实现的同步原语指令。 SynchPrim 和 SynchPrim_frac 的所有其他组合均被保留。在Armv8中，唯一允许的值为0b0010。"
              values:
                - value: "0b0000"
                  desc: "如果 SynchPrim_frac == 0b000，则不实现同步基元。"
                - value: "0b0001"
                  desc: "如果 SynchPrim_frac == 0b000，则添加 LDREX 和 STREX 指令。如果 SynchPrim_frac == 0b011，还添加 CLREX、LDREXB、STREXB 和 STREXH 指令。"
                - value: "0b0010"
                  desc: "如果SynchPrim_frac == 0b000，则与[0b001, 0b011]一样，还添加LDREXD和STREXD指令。"
            - name: "SVC"
              bits: "11:8"
              desc: "表示已实现的SVC指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "未实现。"
                - value: "0b0001"
                  desc: "添加SVC指令。"
            - name: "SIMD"
              bits: "7:4"
              desc: "表示已实现的SIMD指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0011。 SIMD 位域仅与在通用寄存器上执行 SIMD 操作的已实现指令相关。在支持高级 SIMD 和浮点指令的实现中，MVFR0、MVFR1 和 MVFR2 提供有关已实现的高级 SIMD 指令的信息。"
              values:
                - value: "0b0000"
                  desc: "没有实现。"
                - value: "0b0001"
                  desc: "添加SSAT和USAT指令以及PSR中的Q位。"
                - value: "0b0011"
                  desc: "对于0b0001，添加了PKHBT、PKHTB、QADD16、QADD8、QASX、QSUB16、QSUB8、QSAX、SADD16、SADD8、SASX、SEL、SHADD16、SHADD8、SHASX、SHSUB16、SHSUB8、SHSAX、SSAT16、SSUB16、SSUB8、SSAX、SXTAB16、SXTB16、UADD16、UADD8、UASX、UHADD16、UHADD8、UHASX，UHSUB16，UHSUB8，UHSAX，UQADD16，UQADD8， UQASX、UQSUB16、UQSUB8、UQSAX、USAD8、USADA8、 USAT16、USUB16、USUB8、USAX、UXTAB16 和 UXTB16说明。还添加了对 PSR 中的 GE[3:0] 位的支持。"
            - name: "Saturate"
              bits: "3:0"
              desc: "表示支持饱和指令QADD、QDADD、QDSUB和QSUB指令以及PSR中的Q位。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "没有实现。这意味着不会实现非高级 SIMD 饱和指令。"
                - value: "0b0001"
                  desc: "指定的指令被执行。"
        - name: "ID_ISAR4"
          desc: "提供有关PE在AArch32 状态下实现的指令集的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "SWP_frac"
              bits: "31:28"
              desc: "表示支持内存系统锁定SWP或SWPB指令的总线。所有其他值均被保留。仅当 ID_ISAR0.Swap 为 0b0000 时，该位域才有效。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "SWP 或 SWPB 指令未实现。"
                - value: "0b0001"
                  desc: "SWP 或 SWPB 已实现，但仅在单处理器上下文中。 SWP 和 SWPB 不保证来自其他请求者的内存访问是否可以出现在 SWP 或 SWPB 的加载内存访问和存储内存访问之间。"
            - name: "PSR_M"
              bits: "27:24"
              desc: "指示已实现的用于修改 PSR 的 M-profile 指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "没有实现。"
                - value: "0b0001"
                  desc: "添加CPS、MRS和MSR指令的M型材形式。"
            - name: "SynchPrim_frac"
              bits: "23:20"
              desc: "与ID_ISAR3.SynchPrim结合使用，指示已实现的同步原语指令。 SynchPrim 和 SynchPrim_frac 的所有其他组合均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "如果 SynchPrim == 0b0000，则未实现同步原语。如果 SynchPrim == 0b0001，则添加 LDREX 和 STREX 指令。如果 SynchPrim == 0b0010，还添加 CLREX、LDREXB、LDREXH、STREXB、STREXH、LDREXD 和 STREXD 指令。"
                - value: "0b0011"
                  desc: "如果 SynchPrim == 0b0001，则添加 LDREX、STREX、CLREX、LDREXB、LDREXH、STREXB 和 STREXH 指令。"
            - name: "Barrier"
              bits: "19:16"
              desc: "表示支持 T32 和 A32 指令集中的 Barrier 指令 DMB、DSB 和 ISB。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "没有实现。屏障操作仅作为 (coproc==0b1111) 编码空间中的系统指令提供。"
                - value: "0b0001"
                  desc: "指定的指令被执行。"
            - name: "SMC"
              bits: "15:12"
              desc: "表示执行的SMC指令。所有其他值均被保留。在Armv8中，允许的值为：\n如果实现EL3，则唯一允许的值为0b0001。如果 EL3 和 EL2 均未实现，则唯一允许的值为 0b0000。"
              values:
                - value: "0b0000"
                  desc: "没有实现。"
                - value: "0b0001"
                  desc: "添加SMC指令。"
            - name: "Writeback"
              bits: "11:8"
              desc: "表示支持 Writeback 寻址模式。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "基本支持。仅LDM、STM、PUSH、POP、SRS和RFE指令支持回写寻址模式。这些指令支持所有的写回寻址模式。"
                - value: "0b0001"
                  desc: "添加对所有写回寻址模式的支持。"
            - name: "WithShifts"
              bits: "7:4"
              desc: "表示支持带班次的指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0100。"
              values:
                - value: "0b0000"
                  desc: "仅在 MOV 和移位指令中支持非零移位。"
                - value: "0b0001"
                  desc: "添加对 LSL 0-3 范围内的加载和存储移位的支持。"
                - value: "0b0011"
                  desc: "至于 0b0001，并添加了对其他常量移位选项的支持，包括加载/存储和其他指令。"
                - value: "0b0100"
                  desc: "至于0b0011，并添加了对寄存器控制移位选项的支持。"
            - name: "Unpriv"
              bits: "3:0"
              desc: "表示执行的非特权指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0010。"
              values:
                - value: "0b0000"
                  desc: "没有实现。没有实现 T 变体指令。"
                - value: "0b0001"
                  desc: "添加LDRBT、LDRT、STRBT和STRT指令。"
                - value: "0b0010"
                  desc: "对于0b0001，增加了LDRHT、LDRSBT、LDRSHT和STRHT指令。"
        - name: "ID_ISAR5"
          desc: "提供有关PE在AArch32 状态下实现的指令集的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "VCMA"
              bits: "31:28"
              desc: "表示 AArch32 支持复数加法和乘法，其中数字存储在向量中。所有其他值均被保留。 FEAT_FCMA 实现 0b0001 标识的功能。从 Armv8.3 开始，不允许使用值 0b0000。"
              values:
                - value: "0b0000"
                  desc: "VCMLA 和 VCADD 指令未在 AArch32 中实现。"
                - value: "0b0001"
                  desc: "VCMLA 和 VCADD 指令在 AArch32 中实现。"
            - name: "RDM"
              bits: "27:24"
              desc: "表示在 AArch32 状态下支持 VQRDMLAH 和 VQRDMLSH 指令。所有其他值均被保留。 FEAT_RDM 实现由值 0b0001 标识的功能。从 Armv8.1 开始，不允许使用值 0b0000。"
              values:
                - value: "0b0000"
                  desc: "未执行 VQRDMLAH 和 VQRDMLSH 指令。"
                - value: "0b0001"
                  desc: "已实现 VQRDMLAH 和 VQRDMLSH 指令。"
            - name: "RES0"
              bits: "23:20"
              desc: "保留，RES0。"
            - name: "CRC32"
              bits: "19:16"
              desc: "表示支持CRC32指令 CRC32B、CRC32H、CRC32W、CRC32CB、CRC32CH和CRC32CW处于AArch32 状态。所有其他值均被保留。 FEAT_CRC32 实现由值 0b0001 标识的功能。从 Armv8.1 开始，不允许使用值 0b0000。"
              values:
                - value: "0b0000"
                  desc: "CRC32 指令未实现。"
                - value: "0b0001"
                  desc: "指定的指令被执行。"
            - name: "SHA2"
              bits: "15:12"
              desc: "表示支持 SHA2 指令 SHA256H、SHA256H2、SHA256SU0 和 SHA256SU1 AArch32 状态。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0001。"
              values:
                - value: "0b0000"
                  desc: "未执行 SHA2 指令。"
                - value: "0b0001"
                  desc: "指定的指令被执行。"
            - name: "SHA1"
              bits: "11:8"
              desc: "表示支持 SHA1 指令 SHA1C、SHA1P、SHA1M、SHA1H、SHA1SU0和SHA1SU1处于AArch32 状态。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0001。"
              values:
                - value: "0b0000"
                  desc: "未执行 SHA1 指令。"
                - value: "0b0001"
                  desc: "指定的指令被执行。"
            - name: "AES"
              bits: "7:4"
              desc: "表示在AArch32 状态下支持AES指令。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0010。"
              values:
                - value: "0b0000"
                  desc: "未执行 AES 指令。"
                - value: "0b0001"
                  desc: "实现了AESE、AESD、AESMC和AESIMC。"
                - value: "0b0010"
                  desc: "对于0b0001，加上对64 位数据量进行操作的VMULL（多项式）指令。"
            - name: "SEVL"
              bits: "3:0"
              desc: "表示在AArch32 状态下支持SEVL指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "SEVL 被实现为 NOP。"
                - value: "0b0001"
                  desc: "SEVL 被实现为本地发送事件。"
        - name: "ID_ISAR6"
          desc: "提供有关PE在AArch32 状态下实现的指令集的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "CLRBHB"
              bits: "31:28"
              desc: "表示在AArch32 状态下支持CLRBHB指令。所有其他值均被保留。 FEAT_CLRBHB 实现 0b0001 标识的功能。从 Armv8.9 开始，不允许使用值 0b0000。"
              values:
                - value: "0b0000"
                  desc: "CLRBHB指令未执行。"
                - value: "0b0001"
                  desc: "执行CLRBHB指令。"
            - name: "I8MM"
              bits: "27:24"
              desc: "表示支持高级 SIMD 和浮点 Int8 矩阵乘法指令 VSMMLA、VSUDOT、VUMMLA、VUSMMLA和VUSDOT处于AArch32 状态。所有其他值均被保留。 FEAT_AA32I8MM 实现 0b0001 标识的功能。从Armv8.2开始，允许的值为0b0000和0b0001。"
              values:
                - value: "0b0000"
                  desc: "Int8 矩阵乘法指令未实现。"
                - value: "0b0001"
                  desc: "指定的指令被执行。"
            - name: "BF16"
              bits: "23:20"
              desc: "表示支持高级 SIMD 和浮点 BFloat16 指令 VCVT、VCVTB、VCVTT、[VDOT AArch32 中操作数或结果类型为 BF16、VFMAB、VFMAT 和 VMMLA 指令状态。所有其他值均被保留。 FEAT_AA32BF16 实现 0b0001 标识的功能。从Armv8.2开始，允许的值为0b0000和0b0001。"
              values:
                - value: "0b0000"
                  desc: "BFloat16 指令未实现。"
                - value: "0b0001"
                  desc: "指定的指令被执行。"
            - name: "SPECRES"
              bits: "19:16"
              desc: "表示支持AArch32 状态下的预测无效指令。所有其他值均被保留。 FEAT_SPECRES 实现 0b0001 标识的功能。 FEAT_SPECRES2 实现 0b0010 标识的功能。从 Armv8.5 开始，不允许使用值 0b0000。从 Armv8.9 开始，不允许使用值 0b0001。"
              values:
                - value: "0b0000"
                  desc: "预测无效指令未实现。"
                - value: "0b0001"
                  desc: "实现了CFPRCTX、DVPRCTX和CPPRCTX指令。"
                - value: "0b0010"
                  desc: "为0b0001，执行COSPRCTX指令。"
            - name: "SB"
              bits: "15:12"
              desc: "表示在AArch32 状态下支持SB指令。所有其他值均被保留。从 Armv8.5 开始，不允许使用值 0b0000。"
              values:
                - value: "0b0000"
                  desc: "SB指令未执行。"
                - value: "0b0001"
                  desc: "执行SB指令。"
            - name: "FHM"
              bits: "11:8"
              desc: "表示在 AArch32 状态下支持高级 SIMD 和浮点 VFMAL 和 VMFSL 指令。 FEAT_FHM 实现由值 0b0001 标识的功能。"
              values:
                - value: "0b0000"
                  desc: "VFMAL 和 VMFSL 指令未实现。"
                - value: "0b0001"
                  desc: "已实现 VFMAL 和 VMFSL 指令。"
            - name: "DP"
              bits: "7:4"
              desc: "表示支持AArch32 状态下的点积指令。所有其他值均被保留。 FEAT_DotProd 实现由值 0b0001 标识的功能。"
              values:
                - value: "0b0000"
                  desc: "未实现点积指令。"
                - value: "0b0001"
                  desc: "已实现 VUDOT 和 VSDOT 指令。"
            - name: "JSCVT"
              bits: "3:0"
              desc: "表示在AArch32 状态下支持JavaScript转换指令。所有其他值均被保留。在Armv8.0中，唯一允许的值为0b0000。 FEAT_JSCVT 实现 0b0001 标识的功能。从Armv8.3开始，如果实现高级SIMD或浮点，则不允许使用值0b0000。从Armv8.3开始，如果高级SIMD或浮点未实现，则唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "VJCVT指令未执行。"
                - value: "0b0001"
                  desc: "执行VJCVT指令。"
        - name: "ID_MMFR0"
          desc: "提供有关 AArch32 状态下实现的内存模型和内存管理支持的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "InnerShr"
              bits: "31:28"
              desc: "最内在的共享性。表示实现的最里面的共享域。所有其他值均被保留。在Armv8中，允许的值为0b0000、0b0001和0b1111。仅当实现支持两个级别的共享性时，此位域才有效，如值为 0b0001 的 ID_MMFR0.ShareLvl 所示。当ID_MMFR0.ShareLvl为零时，该位域为 UNKNOWN。"
              values:
                - value: "0b0000"
                  desc: "实现为不可缓存。"
                - value: "0b0001"
                  desc: "通过硬件一致性支持来实现。"
                - value: "0b1111"
                  desc: "可共享性被忽略。"
            - name: "FCSE"
              bits: "27:24"
              desc: "指示实现是否包括FCSE。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "不支持。"
                - value: "0b0001"
                  desc: "支持 FCSE。"
            - name: "AuxReg"
              bits: "23:20"
              desc: "辅助寄存器。表示对辅助寄存器的支持。所有其他值均被保留。在Armv8中，唯一允许的值为0b0010。对未实现的辅助寄存器的访问是UNDEFINED。"
              values:
                - value: "0b0000"
                  desc: "没有一个支持。"
                - value: "0b0001"
                  desc: "仅支持辅助控制寄存器。"
                - value: "0b0010"
                  desc: "支持辅助故障状态寄存器（AIFSR 和 ADFSR）和辅助控制寄存器。"
            - name: "TCM"
              bits: "19:16"
              desc: "表示对 TCM 和相关 DMA 的支持。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "不支持。"
                - value: "0b0001"
                  desc: "支持是 IMPLEMENTATION DEFINED。"
                - value: "0b0010"
                  desc: "仅支持 TCM、Armv6 实现。"
                - value: "0b0011"
                  desc: "支持TCM和DMA、Armv6实现。"
            - name: "ShareLvl"
              bits: "15:12"
              desc: "可共享性级别。表示实现的共享级别的数量。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "实现了一级共享性。"
                - value: "0b0001"
                  desc: "实现了两个级别的共享性。"
            - name: "OuterShr"
              bits: "11:8"
              desc: "最外层的可共享性。表示实现的最外层共享域。所有其他值均被保留。在Armv8中，允许的值为0b0000、0b0001和0b1111。"
              values:
                - value: "0b0000"
                  desc: "实现为不可缓存。"
                - value: "0b0001"
                  desc: "通过硬件一致性支持来实现。"
                - value: "0b1111"
                  desc: "可共享性被忽略。"
            - name: "PMSA"
              bits: "7:4"
              desc: "表示支持 PMSA。所有其他值均被保留。在 Armv8-A 中，唯一允许的值为 0b0000。"
              values:
                - value: "0b0000"
                  desc: "不支持。"
                - value: "0b0001"
                  desc: "支持 IMPLEMENTATION DEFINED PMSA。"
                - value: "0b0010"
                  desc: "支持 PMSAv6，并实现了缓存类型寄存器。"
                - value: "0b0011"
                  desc: "支持 PMSAv7，支持内存分段。 Armv7-R 配置文件。"
                - value: "0b0100"
                  desc: "支持 PMSAv8-32，带有基数和限制。 Armv8-R AArch32 配置文件。"
            - name: "VMSA"
              bits: "3:0"
              desc: "表示支持 VMSA。所有其他值均被保留。在 Armv8-A 中，唯一允许的值为 0b0101。"
              values:
                - value: "0b0000"
                  desc: "不支持。"
                - value: "0b0001"
                  desc: "支持 IMPLEMENTATION DEFINED VMSA。"
                - value: "0b0010"
                  desc: "支持 VMSAv6，并实现了缓存和 TLB 类型寄存器。"
                - value: "0b0011"
                  desc: "支持 VMSAv7，支持重新映射和访问标志。 ARMv7-A 配置文件。"
                - value: "0b0100"
                  desc: "至于0b0011，并添加了对短描述符转换表格式描述符中的PXN位的支持。"
                - value: "0b0101"
                  desc: "至于0b0100，并添加了对长描述符转换表格式的支持。"
        - name: "ID_MMFR1"
          desc: "提供有关 AArch32 状态下实现的内存模型和内存管理支持的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "BPred"
              bits: "31:28"
              desc: "分支预测器。指示分支预测器管理要求。所有其他值均被保留。在 Armv8 中，允许的值为 0b0010、0b0011 或 0b0100。对于 0b0000 和 0b0100 以外的值，Arm 架构参考手册或产品文档可能会提供有关所需维护的更多信息。"
              values:
                - value: "0b0000"
                  desc: "没有分支预测器，或者不存在 MMU。表示固定的 MPU 配置。"
                - value: "0b0001"
                  desc: "分支预测器需要刷新：\n启用或禁用地址转换阶段。将新数据写入指令位置。将新映射写入转换表。对 TTBR0、TTBR1 或 TTBCR 寄存器的更改。更改为 ContextID 或 ASID，或者更改为 FCSE ProcessID（如果支持）。"
                - value: "0b0010"
                  desc: "分支预测器需要刷新：\n启用或禁用地址转换阶段。将新数据写入指令位置。将新映射写入转换表。对 TTBR0、TTBR1 或 TTBCR 寄存器的任何更改，而不更改相应的 ContextID 或 ASID 或 FCSE ProcessID 如果支持的话。"
                - value: "0b0011"
                  desc: "分支预测器仅在将新数据写入指令位置时才需要刷新。"
                - value: "0b0100"
                  desc: "为了执行的正确性，分支预测器不需要随时刷新。"
            - name: "L1TstCln"
              bits: "27:24"
              desc: "1 级缓存测试和清理。表示支持的 1 级数据缓存测试和清理操作，用于哈佛或统一缓存实现。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "没有一个支持。"
                - value: "0b0001"
                  desc: "支持的 1 级数据缓存测试和清理操作有：\n测试并清理数据缓存。"
                - value: "0b0010"
                  desc: "至于0b0001，并添加：\n测试、清理和使数据缓存失效。"
            - name: "L1Uni"
              bits: "23:20"
              desc: "1 级统一缓存。表示统一缓存实现支持的整个一级缓存维护操作。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "没有一个支持。"
                - value: "0b0001"
                  desc: "支持的整个 1 级缓存操作有：\n使缓存无效，包括分支预测器（如果适用）。如果适用，则使分支预测器无效。"
                - value: "0b0010"
                  desc: "至于0b0001，并添加：\n清理缓存，使用使用缓存脏状态位的递归模型。使用使用缓存脏状态位的递归模型来清理和无效缓存。"
            - name: "L1Hvd"
              bits: "19:16"
              desc: "1 级哈佛缓存。指示哈佛缓存实现支持的整个 1 级缓存维护操作。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "没有一个支持。"
                - value: "0b0001"
                  desc: "支持的整个 1 级缓存操作有：\n使指令高速缓存无效，包括分支预测器（如果适用）。如果适用，则使分支预测器无效。"
                - value: "0b0010"
                  desc: "至于0b0001，并添加：\n使数据缓存无效。使数据缓存和指令缓存无效，包括分支预测器（如果适用）。"
                - value: "0b0011"
                  desc: "至于0b0010，并添加：\n清理数据缓存，使用使用缓存脏状态位的递归模型。使用缓存脏状态位的递归模型来清理和无效数据缓存。"
            - name: "L1UniSW"
              bits: "15:12"
              desc: "1 级按 Set/Way 统一缓存。通过set/way表示支持的一级缓存行维护操作，以实现统一的缓存实现。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "没有一个支持。"
                - value: "0b0001"
                  desc: "按set/way支持的1级统一缓存行维护操作有：\n按设置/方式清理缓存行。"
                - value: "0b0010"
                  desc: "至于0b0001，并添加：\n按设置/方式清理和无效缓存行。"
                - value: "0b0011"
                  desc: "至于0b0010，并添加：\n按设置/方式使缓存行无效。"
            - name: "L1HvdSW"
              bits: "11:8"
              desc: "按 Set/Way 的 1 级哈佛缓存。指示哈佛缓存实现中按 set/way 表示支持的 1 级缓存行维护操作。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "没有一个支持。"
                - value: "0b0001"
                  desc: "按 set/way 支持的 1 级哈佛缓存行维护操作有：\n按设置/方式清理数据缓存行。按设置/方式清理和无效数据缓存行。"
                - value: "0b0010"
                  desc: "至于0b0001，并添加：\n按设置/方式使数据缓存行无效。"
                - value: "0b0011"
                  desc: "至于0b0010，并添加：\n按设置/方式使指令高速缓存行无效。"
            - name: "L1UniVA"
              bits: "7:4"
              desc: "1 级统一缓存（按虚拟地址）。表示VA支持的一级缓存行维护操作，用于统一缓存实现。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "没有一个支持。"
                - value: "0b0001"
                  desc: "VA 支持的 1 级统一缓存行维护操作有：\n通过 VA 清理缓存行。通过 VA 使缓存行无效。通过 VA 清理并使缓存行无效。"
                - value: "0b0010"
                  desc: "至于0b0001，并添加：\n如果实现了分支预测器，则通过 VA 使分支预测器无效。"
            - name: "L1HvdVA"
              bits: "3:0"
              desc: "按虚拟地址划分的 1 级哈佛高速缓存。指示 VA 支持的 1 级缓存行维护操作，用于哈佛缓存实现。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "没有一个支持。"
                - value: "0b0001"
                  desc: "VA 支持的 1 级哈佛缓存行维护操作有：\n通过VA清理数据缓存行。通过 VA 使数据缓存行无效。通过VA清理和无效数据缓存线。通过VA清理指令缓存行。"
                - value: "0b0010"
                  desc: "至于0b0001，并添加：\n如果实现了分支预测器，则通过 VA 使分支预测器无效。"
        - name: "ID_MMFR2"
          desc: "提供有关 AArch32 状态下实现的内存模型和内存管理支持的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "HWAccFlg"
              bits: "31:28"
              desc: "硬件访问标志。在 Arm 架构的早期版本中，该位域表示支持硬件访问标志，作为 VMSAv7 实现的一部分。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "不支持。"
                - value: "0b0001"
                  desc: "支持 VMSAv7 访问标志，已在硬件中更新。"
            - name: "WFIStall"
              bits: "27:24"
              desc: "等待中断停止。表示支持等待中断 (WFI) 停顿。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b0001。"
              values:
                - value: "0b0000"
                  desc: "不支持。"
                - value: "0b0001"
                  desc: "支持 WFI 停顿。"
            - name: "MemBarr"
              bits: "23:20"
              desc: "内存屏障。指示 (coproc == 1111) 编码空间中支持的内存屏障系统指令。所有其他值均被保留。在Armv8中，唯一允许的值为0b0010。 Arm 不赞成使用这些操作。 ID_ISAR4.Barrier_instrs 指示对首选屏障指令的支持级别。"
              values:
                - value: "0b0000"
                  desc: "没有一个支持。"
                - value: "0b0001"
                  desc: "支持的内存屏障系统指令有：\n数据同步屏障（DSB）。"
                - value: "0b0010"
                  desc: "至于0b0001，并添加：\n指令同步屏障（ISB）。数据内存屏障（DMB）。"
            - name: "UniTLB"
              bits: "19:16"
              desc: "统一TLB。支持的TLB维护操作，用于统一TLB实现。所有其他值均被保留。在Armv8中，唯一允许的值为0b0110。"
              values:
                - value: "0b0000"
                  desc: "不支持。"
                - value: "0b0001"
                  desc: "支持的统一TLB维护操作有：\n使TLB中的所有条目无效。使VA输入的TLB无效。"
                - value: "0b0010"
                  desc: "至于0b0001，并添加：\n通过 ASID 匹配使 TLB 条目无效。"
                - value: "0b0011"
                  desc: "至于0b0010，并添加：\n使 VA 的指令 TLB 和数据 TLB 条目全部 ASID 无效。这是共享统一的TLB操作"
                - value: "0b0100"
                  desc: "至于0b0011，并添加：\n使 VA 的 Hyp 模式统一 TLB 条目无效。使整个非安全PL1&0统一TLB无效。使整个Hyp模式统一TLB无效。"
                - value: "0b0101"
                  desc: "至于0b0100，增加以下操作：TLBIMVALIS、TLBIMVAALIS、TLBIMVALHIS、TLBIMVAL、TLBIMVAAL、 TLBIMVALH。"
                - value: "0b0110"
                  desc: "对于0b0101，增加以下操作：TLBIIPAS2IS、TLBIIPAS2LIS、TLBIIPAS2、TLBIIPAS2L。"
            - name: "HvdTLB"
              bits: "15:12"
              desc: "如果ID_MMFR2.UniTLB的值不为0b0000，则该位域的含义为 IMPLEMENTATION DEFINED。 Arm 不赞成软件使用该位域。该位域有一个 IMPLEMENTATION DEFINED 值。"
            - name: "L1HvdRng"
              bits: "11:8"
              desc: "1 级哈佛缓存范围。指示哈佛缓存实现支持的 1 级缓存维护范围操作。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "不支持。"
                - value: "0b0001"
                  desc: "支持的 1 级哈佛缓存维护范围操作有：\n通过 VA 使数据缓存范围无效。通过 VA 使指令缓存范围无效。按 VA 清理数据缓存范围。通过 VA 清理和无效数据缓存范围。"
            - name: "L1HvdBG"
              bits: "7:4"
              desc: "1 级哈佛缓存后台获取。指示哈佛缓存实现支持的 1 级缓存后台获取操作。当支持时，后台获取操作是非阻塞操作。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "不支持。"
                - value: "0b0001"
                  desc: "支持的 1 级哈佛缓存后台获取操作有：\n通过VA获取指令缓存范围。通过VA获取数据缓存范围。"
            - name: "L1HvdFG"
              bits: "3:0"
              desc: "1 级哈佛缓存前台获取。指示哈佛缓存实现支持的 1 级缓存前台获取操作。当支持时，前台获取操作是阻塞操作。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "不支持。"
                - value: "0b0001"
                  desc: "支持的 1 级哈佛缓存前台获取操作有：\n通过VA获取指令缓存范围。通过VA获取数据缓存范围。"
        - name: "ID_MMFR3"
          desc: "提供有关 AArch32 状态下实现的内存模型和内存管理支持的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "Supersec"
              bits: "31:28"
              desc: "超级部分。在 VMSA 实现上，指示是否支持超级节。所有其他值均被保留。在Armv8中，允许的值为0b0000和0b1111。"
              values:
                - value: "0b0000"
                  desc: "支持超级部分。"
                - value: "0b1111"
                  desc: "不支持超级部分。"
            - name: "CMemSz"
              bits: "27:24"
              desc: "缓存内存大小。指示缓存支持的物理内存大小。所有其他值均被保留。在Armv8中，允许的值为0b0000、0b0001和0b0010。"
              values:
                - value: "0b0000"
                  desc: "4GB，对应32 位物理地址范围。"
                - value: "0b0001"
                  desc: "64GB，对应36 位物理地址范围。"
                - value: "0b0010"
                  desc: "1TB或更多，对应40 位或更大的物理地址范围。"
            - name: "CohWalk"
              bits: "23:20"
              desc: "连贯行走。指示转换表更新是否需要清理到统一点。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "对转换表的更新需要清理统一点，以确保后续转换表遍历的可见性。"
                - value: "0b0001"
                  desc: "对转换表的更新不需要清理统一点以确保后续转换表遍历的可见性。"
            - name: "PAN"
              bits: "19:16"
              desc: "特权访问从不。表示支持 AArch32 状态下 CPSR、SPSR 和 DSPSR 中的 PAN 位。所有其他值均被保留。 FEAT_PAN 实现由值 0b0001 标识的功能。 FEAT_PAN2 实现由值 0b0010 添加的功能。从 Armv8.1 开始，不允许使用值 0b0000。从 Armv8.2 开始，不允许使用值 0b0001。"
              values:
                - value: "0b0000"
                  desc: "PAN 不支持。"
                - value: "0b0001"
                  desc: "支持PAN。"
                - value: "0b0010"
                  desc: "支持PAN并支持ATS1CPRP和ATS1CPWP指令。"
            - name: "MaintBcst"
              bits: "15:12"
              desc: "维护广播。指示是否广播Cache、TLB和分支预测器操作。所有其他值均被保留。在Armv8中，唯一允许的值为0b0010。"
              values:
                - value: "0b0000"
                  desc: "缓存、TLB 和分支预测器操作仅影响局部结构。"
                - value: "0b0001"
                  desc: "高速缓存和分支预测器操作根据指令的可共享性和定义的行为影响结构。 TLB操作仅影响局部结构。"
                - value: "0b0010"
                  desc: "高速缓存、TLB 和分支预测器操作根据指令的可共享性和定义的行为影响结构。"
            - name: "BPMaint"
              bits: "11:8"
              desc: "分支预测器维护。指示具有分层缓存维护操作的实现中支持的分支预测器维护操作。所有其他值均被保留。在Armv8中，唯一允许的值为0b0010。"
              values:
                - value: "0b0000"
                  desc: "没有一个支持。"
                - value: "0b0001"
                  desc: "支持的分支预测器维护操作有：\n使所有分支预测器无效。"
                - value: "0b0010"
                  desc: "至于0b0001，并添加：\n通过 VA 使分支预测器无效。"
            - name: "CMaintSW"
              bits: "7:4"
              desc: "按集合/方式进行缓存维护。在分层缓存的实现中，通过 set/way 指示支持的缓存维护操作。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。在统一缓存实现中，数据缓存维护操作适用于统一缓存。"
              values:
                - value: "0b0000"
                  desc: "没有一个支持。"
                - value: "0b0001"
                  desc: "按 set/way 支持的分层缓存维护指令有：\n按设置/方式使数据缓存无效。按集合/方式清理数据缓存。按设置/方式清理和无效数据缓存。"
            - name: "CMaintVA"
              bits: "3:0"
              desc: "通过虚拟地址进行缓存维护。指示在分层缓存的实现中，VA 支持的缓存维护操作。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。在统一缓存实现中，数据缓存维护操作适用于统一缓存，指令缓存维护指令不执行。"
              values:
                - value: "0b0000"
                  desc: "没有一个支持。"
                - value: "0b0001"
                  desc: "VA 支持的分层缓存维护操作有：\n通过VA使数据缓存无效。通过VA清理数据缓存。通过VA清理和无效数据缓存。通过VA使指令缓存无效。使所有指令高速缓存条目无效。"
        - name: "ID_MMFR4"
          desc: "提供有关 AArch32 状态下实现的内存模型和内存管理支持的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "EVT"
              bits: "31:28"
              desc: "增强的虚拟化陷阱。如果实现EL2，则表示支持HCR2。{TTLBIS、TOCU、TICAB、TID4} 陷阱。所有其他值均被保留。 FEAT_EVT 实现由值 0b0001 标识的功能。 FEAT_EVT2 实现由值 0b0010 标识的功能。如果EL2未实现或不支持AArch32，则唯一允许的值为0b0000。从Armv8.5开始，如果实现EL2并支持AArch32，则不允许使用值0b0001。"
              values:
                - value: "0b0000"
                  desc: "不支持 HCR2.{TTLBIS、TOCU、TICAB、TID4} 陷阱。"
                - value: "0b0001"
                  desc: "支持 HCR2.{TOCU、TICAB、TID4} 陷阱。"
                - value: "0b0010"
                  desc: "作为 0b0001，支持 HCR2.TTLBIS 陷阱。"
            - name: "CCIDX"
              bits: "27:24"
              desc: "指示支持使用修订后的 CCSIDR 格式以及 CCSIDR2 的存在。所有其他值均被保留。 FEAT_CCIDX 实现 0b0001 标识的功能。从Armv8.3开始，允许的值为0b0000和0b0001。"
              values:
                - value: "0b0000"
                  desc: "CCSIDR各级实现了32 位格式，CCSIDR2寄存器未实现。"
                - value: "0b0001"
                  desc: "CCSIDR各级实现了64 位格式，并实现了CCSIDR2寄存器。"
            - name: "LSM"
              bits: "23:20"
              desc: "表示支持 HSCTLR 和 SCTLR 中的 LSMAOE 和 nTLSMD 位。所有其他值均被保留。 FEAT_LSMAOC 实现由值 0b0001 标识的功能。从Armv8.2开始，允许的值为0b0000和0b0001。"
              values:
                - value: "0b0000"
                  desc: "不支持 LSMAOE 和 nTLSMD 位。"
                - value: "0b0001"
                  desc: "支持 LSMAOE 和 nTLSMD 位。"
            - name: "HPDS"
              bits: "19:16"
              desc: "分层权限禁用转换表中的位。所有其他值均被保留。 FEAT_AA32HPD 实现由值 0b0001 标识的功能。 FEAT_HPDS2 实现由值 0b0010 添加的功能。值 0b0000 意味着 TTBCR2 的编码是 UNDEFINED。"
              values:
                - value: "0b0000"
                  desc: "不支持禁用分层控件。"
                - value: "0b0001"
                  desc: "支持使用 TTBCR2.HPD0、TTBCR2.HPD1 和 HTCR.HPD 位禁用分层控制。"
                - value: "0b0010"
                  desc: "至于值 0b0001，并从最终查找级别添加地址转换表描述符的位 [62:59] 的可能硬件分配，以供 IMPLEMENTATION DEFINED 使用。"
            - name: "CnP"
              bits: "15:12"
              desc: "常见非私人翻译。所有其他值均被保留。 FEAT_TTCNP 实现由值 0b0001 标识的功能。从 Armv8.2 开始，不允许使用值 0b0000。"
              values:
                - value: "0b0000"
                  desc: "不支持通用非私人翻译。"
                - value: "0b0001"
                  desc: "支持公共翻译，不支持私人翻译。"
            - name: "XNX"
              bits: "11:8"
              desc: "支持在第 2 阶段按异常级别禁止执行控制区分。保留所有其他值。 FEAT_XNX 实现由值 0b0001 标识的功能。当实现FEAT_XNX时：\n如果满足以下所有条件，则 ID_MMFR4.XNX 的值是 0b0000 还是 0b0001:ID_AA64MMFR1_EL1.XNX IMPLEMENTATION DEFINED ==1。 EL2无法使用AArch32。 EL1可以使用AArch32。如果EL2可以使用AArch32，则不允许使用值0b0000。"
              values:
                - value: "0b0000"
                  desc: "不支持第 2 阶段的 EL0 和 EL1 执行-永不控制之间的区别。"
                - value: "0b0001"
                  desc: "EL0 和 EL1 之间的区别支持第 2 阶段禁止执行控制。"
            - name: "AC2"
              bits: "7:4"
              desc: "表示使用ACTLR2和HACTLR2对ACTLR和HACTLR寄存器进行扩展。所有其他值均被保留。在Armv8.0中，允许的值为0b0000和0b0001。从Armv8.2开始，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "ACTLR2 和 HACTLR2 未实现。"
                - value: "0b0001"
                  desc: "实现ACTLR2和HACTLR2。"
            - name: "SpecSEI"
              bits: "3:0"
              source_condition: "When FEAT_RAS is implemented"
              desc: "描述 PE 是否可以从内存的推测性读取（包括推测性指令提取）中生成 SError 异常。所有其他值均被保留。 FEAT_SpecSEI 实现由值 0b0001 标识的功能。"
              condition: "当实现FEAT_RAS时"
              values:
                - value: "0b0000"
                  desc: "PE 绝不会因推测读取时的外部中止而生成 SError 异常。"
                - value: "0b0001"
                  desc: "由于推测读取时发生外部中止，PE 可能会生成 SError 异常。"
            - name: "RES0"
              bits: "3:0"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
        - name: "ID_MMFR5"
          desc: "提供有关 AArch32 状态下实现的内存模型和内存管理支持的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:8"
              desc: "保留，RES0。"
            - name: "nTLBPA"
              bits: "7:4"
              desc: "表示支持转换表遍历的中间缓存。非连贯物理转换缓存是自上次完成适用于 PE 的相关 TLBI 以来先前有效转换表条目的非连贯缓存，其中：\n缓存由保存转换表条目的位置的物理地址索引。缓存用于第 1 阶段转换，并通过保存转换表条目的位置的中间物理地址进行索引。所有其他值均被保留。 FEAT_nTLBPA 实现由值 0b0001 标识的功能。从 Armv8.0 开始，允许的值为 0b0000 和 0b0001。"
              values:
                - value: "0b0000"
                  desc: "转换表遍历的中间缓存可能包括非一致的物理转换缓存。"
                - value: "0b0001"
                  desc: "转换表遍历的中间缓存不包括非一致性物理转换缓存。"
            - name: "ETS"
              bits: "3:0"
              desc: "表示支持增强地址转换同步。所有其他值均被保留。 FEAT_ETS2 实现由值 0b0010 标识的功能。 FEAT_ETS3 实现由值 0b0011 标识的功能。从 Armv8.8 开始，不允许使用值 0b0000 和 0b0001。从 Armv9.5 开始，不允许使用值 0b0010。"
              values:
                - value: "0b0000"
                  desc: "不支持增强地址转换同步。"
                - value: "0b0001"
                  desc: "不支持增强地址转换同步。"
                - value: "0b0010"
                  desc: "FEAT_ETS2 已实现。"
                - value: "0b0011"
                  desc: "FEAT_ETS3 已实现。"
        - name: "ID_PFR0"
          desc: "提供有关 AArch32 状态下 PE 支持的指令集和其他功能的顶级信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RAS"
              bits: "31:28"
              desc: "RAS扩展版本。所有其他值均被保留。 FEAT_RAS 实现由值 0b0001 标识的功能。 FEAT_DoubleFault 实现由值 0b0010 标识的功能。当 ERRIDR.NUM 为零时：\n如果未实现FEAT_DoubleFault，则无论是否实现FEAT_RASv1p1或FEAT_RASv2，都允许该位域具有值0b0001。如果实现了FEAT_DoubleFault，则无论是否实现FEAT_RASv2，都允许该位域具有值0b0010。当 ERRIDR.NUM 不为零时：\nFEAT_RASv1p1 实现由值 0b0010 标识的功能。 FEAT_RASv2 实现由值 0b0011 标识的功能。从 Armv8.2 开始，不允许使用值 0b0000。从 Armv8.4 开始，如果实现 FEAT_DoubleFault 或 ERRIDR.NUM 非零，则不允许使用值 0b0001。当该位域值为0b0001时，ID_PFR2.RAS_frac表示FEAT_RASv1p1是否为implemented.FromArmv8.9，如果为ERRIDR.NUM 不为零，则不允许使用值 0b0010。"
              values:
                - value: "0b0000"
                  desc: "RAS 扩展未实现。"
                - value: "0b0001"
                  desc: "实现了RAS扩展，FEAT_RAS提供了ESB指令和错误同步事件。"
                - value: "0b0010"
                  desc: "FEAT_RASv1p1 已实现。作为 0b0001，并添加了对附加 ERXMISC<m> 系统寄存器的支持。通过系统寄存器访问的错误记录符合 RAS 系统架构 v1.1，其中包括对 ERR<n>STATUS 的简化以及对可选 RAS 时间戳的支持扩展。"
                - value: "0b0011"
                  desc: "FEAT_RASv2 已实现。作为 0b0010，并且要求通过系统寄存器访问的错误记录符合 RAS 系统架构 v1.1 或 RAS 系统架构 v2。"
            - name: "DIT"
              bits: "27:24"
              desc: "数据独立时序。所有其他值均被保留。 FEAT_DIT 实现由值 0b0001 标识的功能。从 Armv8.4 开始，不允许使用值 0b0000。"
              values:
                - value: "0b0000"
                  desc: "AArch32 不保证任何指令的恒定执行时间。"
                - value: "0b0001"
                  desc: "AArch32 提供PSTATE.DIT机制来保证某些指令的恒定执行时间。"
            - name: "AMU"
              bits: "23:20"
              desc: "表示支持活动监视器扩展。所有其他值均被保留。 FEAT_AMUv1 实现由值 0b0001 标识的功能。 FEAT_AMUv1p1 实现由值 0b0010 标识的功能。在Armv8.0中，唯一允许的值为0b0000。在Armv8.4中，允许的值为0b0000和0b0001。从 Armv8.6 开始，允许的值为 0b0000、0b0001 和 0b0010。"
              values:
                - value: "0b0000"
                  desc: "活动监视器扩展未实现。"
                - value: "0b0001"
                  desc: "FEAT_AMUv1 已实现。"
                - value: "0b0010"
                  desc: "FEAT_AMUv1p1 已实现。作为 0b0001 并添加对活动监视器事件计数器虚拟化的支持。"
            - name: "CSV2"
              bits: "19:16"
              desc: "推测性使用脱离上下文的分支目标。所有其他值均被保留。 FEAT_CSV2 实现由值 0b0001 标识的功能。 FEAT_CSV2_1p1 实现由值 0b0010 标识的功能。从 Armv8.5 开始，允许的值为 0b0001 和 0b0010。"
              values:
                - value: "0b0000"
                  desc: "该实现没有透露是否实现了FEAT_CSV2。"
                - value: "0b0001"
                  desc: "FEAT_CSV2 已实现，但 FEAT_CSV2_1p1 未实现。"
                - value: "0b0010"
                  desc: "FEAT_CSV2_1p1 已实现。"
            - name: "State3"
              bits: "15:12"
              desc: "T32EE指令集支持。所有其他值均被保留。在Armv8中，唯一允许的值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "未实现。"
                - value: "0b0001"
                  desc: "实现了T32EE指令集。"
            - name: "State2"
              bits: "11:8"
              desc: "Jazelle 扩展支持。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "未实现。"
                - value: "0b0001"
                  desc: "已实现 Jazelle 扩展，但未在异常条目上清除 JOSCR.CV。"
                - value: "0b0010"
                  desc: "实现 Jazelle 扩展，并在异常条目上清除 JOSCR.CV。"
            - name: "State1"
              bits: "7:4"
              desc: "T32指令集支持。所有其他值均被保留。在Armv8中，唯一允许的值为0b0011。"
              values:
                - value: "0b0000"
                  desc: "T32 指令集未实现。"
                - value: "0b0001"
                  desc: "T32 在引入 Thumb-2 技术之前实现的编码：\n所有指令均为 16 位。 BL或BLX是一对16 位指令。无法对BL和BLX以外的32 位指令进行编码。"
                - value: "0b0011"
                  desc: "T32编码是在引入Thumb-2技术后实现的，适用于所有16 位和32 位T32基本指令。"
            - name: "State0"
              bits: "3:0"
              desc: "A32指令集支持。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "A32指令集未实现。"
                - value: "0b0001"
                  desc: "A32 指令集已实现。"
        - name: "ID_PFR1"
          desc: "提供有关 AArch32 程序员模型的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "GIC"
              bits: "31:28"
              desc: "系统寄存器【GIC】【CPU】接口。所有其他值均被保留。"
              values:
                - value: "0b0000"
                  desc: "GIC CPU 接口 系统寄存器未实现。"
                - value: "0b0001"
                  desc: "支持 GIC CPU 接口的 3.0 和 4.0 版本的系统寄存器接口。"
                - value: "0b0011"
                  desc: "支持 GIC CPU 接口版本 4.1 的系统寄存器接口。"
            - name: "Virt_frac"
              bits: "27:24"
              desc: "虚拟化分数位域。当虚拟化位域为0b0000时，确定对虚拟化扩展的支持。所有其他值均被保留。在Armv8中，允许的值为：\n实现EL2时为0b0000。当EL2未实现时为0b0001。仅当ID_PFR1.Virtualization的值为0时，该位域才有效，否则其值为0b0000。 ID_ISAR 寄存器不识别虚拟化扩展添加的指令是否已实现。"
              values:
                - value: "0b0000"
                  desc: "没有实现虚拟化扩展。"
                - value: "0b0001"
                  desc: "实现了以下虚拟化扩展：\n如果实现了 EL3，则 SCR.SIF 位。如果实现了 EL3，则对虚拟化扩展中描述的 SCR.AW 和 SCR.FW 位进行修改。 MSR（分组寄存器）和 MRS（分组寄存器）指令。 ERET指令。"
            - name: "Sec_frac"
              bits: "23:20"
              desc: "安全分数位域。当安全位域为0b0000时，确定对安全扩展的支持。所有其他值均被保留。在Armv8中，允许的值为：\n实现EL3时为0b0000。未实现 EL3 时为 0b0001 或 0b0010。仅当ID_PFR1.Security的值为0时该位域才有效，否则其值为0b0000。"
              values:
                - value: "0b0000"
                  desc: "未实现任何安全扩展。"
                - value: "0b0001"
                  desc: "实现了以下安全扩展：\nVBAR 寄存器。 TTBCR.PD0 和 TTBCR.PD1 位。"
                - value: "0b0010"
                  desc: "至于0b0001，支持访问安全或非安全物理内存的能力。"
            - name: "GenTimer"
              bits: "19:16"
              desc: "通用计时器支持。所有其他值均被保留。 FEAT_ECV 实现由值 0b0010 标识的功能。在Armv8.0中，唯一允许的值为0b0001。从 Armv8.6 开始，唯一允许的值为 0b0010。"
              values:
                - value: "0b0000"
                  desc: "通用定时器未实现。"
                - value: "0b0001"
                  desc: "通用定时器已实现。"
                - value: "0b0010"
                  desc: "通用定时器已实现，还包括对 CNTHCTL.EVNTIS 和 CNTKCTL.EVNTIS 位域以及 CNTPCTSS 和 CNTVCTSS 计数器视图的支持。"
            - name: "Virtualization"
              bits: "15:12"
              desc: "虚拟化支持。所有其他值均被保留。在 Armv8-A 中，允许的值为：\n当EL2未实现时为0b0000。实现EL2时为0b0001。在包含 EL2 的实现中，如果 EL2 不能使用 AArch32，但 EL1 可以使用 AArch32，则该位域的值为0b0001。 ID_ISARs不识别HVC指令是否被实现。"
              values:
                - value: "0b0000"
                  desc: "EL2、Hyp 模式和 HVC 指令未实现。"
                - value: "0b0001"
                  desc: "EL2、Hyp 模式、HVC 指令以及 Virt_frac == 0b0001 描述的所有功能均已实现。"
            - name: "MProgMod"
              bits: "11:8"
              desc: "M-profile 程序员模型支持。所有其他值均被保留。在 Armv8-A 和 Armv8-R 中，唯一允许的值为 0b0000。"
              values:
                - value: "0b0000"
                  desc: "不支持。"
                - value: "0b0010"
                  desc: "支持双栈程序员模型。"
            - name: "Security"
              bits: "7:4"
              desc: "安全支持。所有其他值均被保留。在Armv8中，允许的值为：\n实现EL3时为0b0001。未实现EL3时为0b0000。在包含 EL3 的实现中，如果 EL3 不能使用 AArch32，但 EL1 可以使用 AArch32，则该位域的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "EL3、监控模式和SMC指令未实现。"
                - value: "0b0001"
                  desc: "EL3、监控模式、SMC 指令以及 Sec_frac == 0b0001 描述的所有功能均已实现。"
                - value: "0b0010"
                  desc: "对于 0b0001，并添加了设置 NSACR.RFR 位的功能。在 Armv8 中不允许，因为 NSACR.RFR 位为 RES0。"
            - name: "ProgMod"
              bits: "3:0"
              desc: "支持 ARMv4 及更高版本的标准程序员模型。型号必须支持用户、FIQ、IRQ、超级用户、中止、未定义和系统模式。所有其他值均被保留。在Armv8中，唯一允许的值为0b0001。"
              values:
                - value: "0b0000"
                  desc: "不支持。"
                - value: "0b0001"
                  desc: "支持。"
        - name: "ID_PFR2"
          desc: "提供有关 AArch32 程序员模型的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:12"
              desc: "保留，RES0。"
            - name: "RAS_frac"
              bits: "11:8"
              desc: "RAS 扩展分数域。所有其他值均被保留。 FEAT_RAS 实现由值 0b0000 标识的功能。当ERRIDR.NUM为零时，无论是否实现FEAT_RASv1p1，该位域都允许具有值0b0000。当 ERRIDR.NUM 不为零时，FEAT_RASv1p1 实现由值 0b0001 标识的功能。仅当 ID_PFR0.RAS == 0b0001 时，此位域才有效。"
              values:
                - value: "0b0000"
                  desc: "如果 ID_PFR0.RAS == 0b0001，则实现对可靠性、可用性和可维护性扩展的支持。"
                - value: "0b0001"
                  desc: "如果 ID_PFR0.RAS == 0b0001，则为 0b0000 并添加对其他 ERXMISC<m> 系统寄存器的支持。通过系统寄存器访问的错误记录符合 RAS 系统架构 v1.1，其中包括对 ERR<n>STATUS 的简化以及对可选 RAS 时间戳的支持扩展。"
            - name: "SSBS"
              bits: "7:4"
              desc: "推测存储绕过控制处于 AArch64 状态。在Armv8.0中，允许的值为0b0000和0b0001。从 Armv8.5 开始，唯一允许的值为 0b0001。所有其他值均被保留。"
              values:
                - value: "0b0000"
                  desc: "AArch32 没有提供控制推测存储绕过的使用的机制。"
                - value: "0b0001"
                  desc: "AArch32 提供 PSTATE.SSBS 机制来标记推测存储绕过安全的区域。"
            - name: "CSV3"
              bits: "3:0"
              desc: "断层数据的推测性使用。所有其他值均被保留。 FEAT_CSV3 实现由值 0b0001 标识的功能。在Armv8.0中，允许的值为0b0000和0b0001。从 Armv8.5 开始，唯一允许的值为 0b0001。如果实现了FEAT_E0PD，则必须实现FEAT_CSV3。"
              values:
                - value: "0b0000"
                  desc: "该PE没有公开在推测架构上不允许数据加载或寄存器读取的情况下从寄存器加载或读取的数据是否可以由比加载或寄存器读取更新的指令以允许通过架构上执行的代码恢复不可访问数据的值的方式使用。"
                - value: "0b0001"
                  desc: "在架构上不允许数据加载或寄存器读取的情况下，从寄存器加载或读取的数据不能被比加载或寄存器读取更新的指令以允许由架构上执行的代码恢复不可访问数据的值的方式使用。"
        - name: "MIDR"
          desc: "提供 PE 的标识信息，包括设备的实现者代码和设备 ID 编号。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "Implementer"
              bits: "31:24"
              desc: "实现者代码。该位域必须包含 Arm 分配的实现者代码。 Arm 可以分配本手册中未发布的代码。所有未由 Arm 分配的值均被保留且不得使用。"
              values:
                - value: "0x00"
                  desc: "保留供软件使用。"
                - value: "0x41"
                  desc: "手臂有限公司。"
                - value: "0x42"
                  desc: "博通公司。"
                - value: "0x43"
                  desc: "卡维姆公司"
                - value: "0x44"
                  desc: "数字设备公司。"
                - value: "0x46"
                  desc: "富士通有限公司"
                - value: "0x49"
                  desc: "英飞凌科技AG。"
                - value: "0x4D"
                  desc: "摩托罗拉或飞思卡尔半导体公司"
                - value: "0x4E"
                  desc: "NVIDIA 公司。"
                - value: "0x50"
                  desc: "应用微电路公司。"
                - value: "0x51"
                  desc: "高通公司"
                - value: "0x56"
                  desc: "Marvell 国际有限公司"
                - value: "0x69"
                  desc: "英特尔公司。"
                - value: "0xC0"
                  desc: "安培计算。"
            - name: "Variant"
              bits: "23:20"
              desc: "变体编号。通常，此位域用于区分不同的产品变体或产品的主要修订版。该位域具有 IMPLEMENTATION DEFINED 值。"
            - name: "Architecture"
              bits: "19:16"
              desc: "架构版本。所有其他值均被保留。"
              values:
                - value: "0b1111"
                  desc: "架构特性在 ID_* 寄存器中单独标识。"
            - name: "PartNum"
              bits: "15:4"
              desc: "设备的主要部件号。在 Arm 实现的处理器上，如果主要部件编号的前四位是 0x0 或 0x7，则变体和架构的编码方式不同。该位域具有 IMPLEMENTATION DEFINED 值。"
            - name: "Revision"
              bits: "3:0"
              desc: "设备的修订号。该位域具有 IMPLEMENTATION DEFINED 值。"
        - name: "MPIDR"
          desc: "在多处理器系统中，提供了附加的PE识别机制。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "M"
              bits: "31"
              desc: "指示此实现是否包含 Armv7 多处理扩展引入的功能。"
              values:
                - value: "0b0"
                  desc: "此实现不包括 Armv7 多处理扩展功能。"
                - value: "0b1"
                  desc: "此实现包括 Armv7 多处理扩展功能。"
            - name: "U"
              bits: "30"
              desc: "表示单处理器系统，与多处理器系统中的 PE 0 不同。"
              values:
                - value: "0b0"
                  desc: "处理器是多处理器系统的一部分。"
                - value: "0b1"
                  desc: "处理器是单处理器系统的一部分。"
            - name: "RES0"
              bits: "29:25"
              desc: "保留，RES0。"
            - name: "MT"
              bits: "24"
              desc: "指示最低关联性级别是否由使用相互依赖的方法（例如多线程）实现的逻辑 PE 组成。有关亲和力级别的更多信息，请参阅 Aff0 的描述。该位域并不表示实现了多线程，也不表示具有不同亲和级别0值的PE实现了相同的亲和级别1及更高值。"
              values:
                - value: "0b0"
                  desc: "具有不同亲和力级别 0 值的 PE 的性能以及具有相同亲和力级别 1 及更高值的 PE 的性能在很大程度上是独立的。"
                - value: "0b1"
                  desc: "具有不同亲和力级别 0 值的 PE 的性能以及具有相同亲和力级别 1 及更高值的 PE 的性能是非常相互依赖的。"
            - name: "Aff2"
              bits: "23:16"
              desc: "亲和度级别2。更多信息请参见Aff0的描述。该位域具有 IMPLEMENTATION DEFINED 值。"
            - name: "Aff1"
              bits: "15:8"
              desc: "亲和度级别1。更多信息请参见Aff0的描述。该位域具有 IMPLEMENTATION DEFINED 值。"
            - name: "Aff0"
              bits: "7:0"
              desc: "亲和性级别 0。MPIDR.{Aff2、Aff1、Aff0} 或 MPIDR_EL1.{[Aff3每个PE的位域集在整个系统内必须是唯一的。该位域具有 IMPLEMENTATION DEFINED 值。"
        - name: "PMMIR"
          desc: "描述特定于软件实现的性能监视器参数。"
          condition: "当实现 FEAT_AA32EL1 并实现 FEAT_PMUv3p4 时"
          fields:
            - name: "RES0"
              bits: "31:28"
              desc: "保留，RES0。"
            - name: "EDGE"
              bits: "27:24"
              desc: "PMU事件边沿检测。使用 PMMIR.THWIDTH 表示事件计数器阈值功能的实现。所有其他值均被保留。如果未实现 FEAT_PMUv3_TH，则唯一允许的值为 0b0000。 FEAT_PMUv3_EDGE 实现由值 0b0001 标识的功能。 PMEVTYPER<n>_EL0.TE 无法通过 PMEVTYPER<n> 访问。"
              values:
                - value: "0b0000"
                  desc: "FEAT_PMUv3_EDGE 未实现。"
                - value: "0b0001"
                  desc: "FEAT_PMUv3_EDGE 已实现。"
            - name: "THWIDTH"
              bits: "23:20"
              desc: "PMEVTYPER<n>_EL0.TH 宽度。指示 FEAT_PMUv3_TH 功能的实现，以及 PMEVTYPER<n>_EL0.TH 位域的大小（如果已实现）。所有其他值均被保留。如果FEAT_PMUv3_TH未实现，则该位域为零。否则，可写入 PMEVTYPER<n>_EL0.TH 的最大值为 2(PMMIR.THWIDTH) 减 1。 PMEVTYPER<n>_EL0.TH 无法通过 PMEVTYPER<n> 访问。"
              values:
                - value: "0b0000"
                  desc: "FEAT_PMUv3_TH 未实现。"
                - value: "0b0001"
                  desc: "1 位。 PMEVTYPER<n>_EL0.TH[11:1] 是 RES0。"
                - value: "0b0010"
                  desc: "2 位。 PMEVTYPER<n>_EL0.TH[11:2] 是 RES0。"
                - value: "0b0011"
                  desc: "3 位。 PMEVTYPER<n>_EL0.TH[11:3] 是 RES0。"
                - value: "0b0100"
                  desc: "4 位。 PMEVTYPER<n>_EL0.TH[11:4] 是 RES0。"
                - value: "0b0101"
                  desc: "5 位。 PMEVTYPER<n>_EL0.TH[11:5] 是 RES0。"
                - value: "0b0110"
                  desc: "6 位。 PMEVTYPER<n>_EL0.TH[11:6] 是 RES0。"
                - value: "0b0111"
                  desc: "7 位。 PMEVTYPER<n>_EL0.TH[11:7] 是 RES0。"
                - value: "0b1000"
                  desc: "8 位。 PMEVTYPER<n>_EL0.TH[11:8] 是 RES0。"
                - value: "0b1001"
                  desc: "9 位。 PMEVTYPER<n>_EL0.TH[11:9] 是 RES0。"
                - value: "0b1010"
                  desc: "10 位。 PMEVTYPER<n>_EL0.TH[11:10] 是 RES0。"
                - value: "0b1011"
                  desc: "11 位。 PMEVTYPER<n>_EL0.TH[11] 是 RES0。"
                - value: "0b1100"
                  desc: "12 位。"
            - name: "BUS_WIDTH"
              bits: "19:16"
              desc: "总线宽度。表示每个BUS_ACCESS事件涉及的字节数。编码为Log2（字节数）加一。所有其他值均被保留。每次传输最多可达此字节数。访问可能小于总线宽度。当该位域非零时，BUS_ACCESS计数的每次访问最多为BUS_WIDTH字节。实现可能会将宽总线视为多个较窄的总线，这样总线上的宽访问会将 BUS_ACCESS 计数器增加一以上。"
              values:
                - value: "0b0000"
                  desc: "该信息不可用。"
                - value: "0b0011"
                  desc: "四个字节。"
                - value: "0b0100"
                  desc: "8 字节。"
                - value: "0b0101"
                  desc: "16字节。"
                - value: "0b0110"
                  desc: "32 字节。"
                - value: "0b0111"
                  desc: "64 字节。"
                - value: "0b1000"
                  desc: "128 字节。"
                - value: "0b1001"
                  desc: "256 字节。"
                - value: "0b1010"
                  desc: "512 字节。"
                - value: "0b1011"
                  desc: "1024 字节。"
                - value: "0b1100"
                  desc: "2048 字节。"
            - name: "BUS_SLOTS"
              bits: "15:8"
              desc: "公交车数。 BUS_ACCESS 事件在单个 BUS_CYCLES 周期中可能增加的最大值。当该位域非零时，BUS_ACCESS事件在单个BUS_CYCLES周期中可能增加的最大值为BUS_SLOTS。如果总线计数信息不可用，则该位域将读作零。该位域具有 IMPLEMENTATION DEFINED 值。"
            - name: "SLOTS"
              bits: "7:0"
              desc: "操作宽度。 STALL_SLOT 事件在单个周期内可能增加的最大值。如果未实现 STALL_SLOT 事件，则该位域可能读作零。该位域具有 IMPLEMENTATION DEFINED 值。"
        - name: "REVIDR"
          desc: "提供特定于实现的次要修订信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:0"
              desc: "IMPLEMENTATION DEFINED。"
        - name: "TCMTR"
          desc: "提供有关 TCM 实现的信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:0"
              desc: "IMPLEMENTATION DEFINED。"
        - name: "TLBTR"
          desc: "提供有关 TLB 实现的信息。寄存器必须定义实现是提供单独的指令和数据 TLB，还是统一的 TLB。通常，该寄存器中的 IMPLEMENTATION DEFINED 信息包括TLB中可锁定条目的数量。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:1"
              desc: "IMPLEMENTATION DEFINED。"
            - name: "nU"
              bits: "0"
              desc: "不统一TLB。表示实现是否有统一的TLB。"
              values:
                - value: "0b0"
                  desc: "统一TLB。"
                - value: "0b1"
                  desc: "单独的指令和数据 TLB。"
    - name: "IMP DEF"
      title: "实现定义"
      access: "MRS / MSR 系统寄存器接口"
      desc: "Arm AArch32 架构系统寄存器：IMP DEF"
      registers:
        - name: "ACTLR"
          desc: "提供 IMPLEMENTATION DEFINED 配置和控制选项，以便在 EL1 和 EL0 上执行。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:0"
              desc: "IMPLEMENTATION DEFINED。"
              reset_info: "温复位；AU"
        - name: "ACTLR2"
          desc: "为 ACTLR 寄存器提供额外的空间，以保存 IMPLEMENTATION DEFINED 陷阱功能，以便在 EL1 和 EL0 处执行。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:0"
              desc: "IMPLEMENTATION DEFINED。"
              reset_info: "温复位；AU"
        - name: "ADFSR"
          desc: "为 EL1 模式和 EL3 模式（当实现并使用 EL3 时发生的数据中止异常提供附加 IMPLEMENTATION DEFINED 故障状态信息AArch32。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:0"
              desc: "IMPLEMENTATION DEFINED。"
              reset_info: "温复位；AU"
        - name: "AIDR"
          desc: "提供 IMPLEMENTATION DEFINED 标识信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:0"
              desc: "IMPLEMENTATION DEFINED。"
        - name: "AIFSR"
          desc: "为 EL1 模式和 EL3 模式（当实现并使用 EL3 时发生的预取中止异常提供额外的 IMPLEMENTATION DEFINED 故障状态信息AArch32。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:0"
              desc: "IMPLEMENTATION DEFINED。"
              reset_info: "温复位；AU"
        - name: "AMAIR0"
          desc: "当使用长描述符格式转换表进行第 1 阶段转换时，为 MAIR0 指定的内存区域提供 IMPLEMENTATION DEFINED 内存属性。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:0"
              desc: "IMPLEMENTATION DEFINED。"
              reset_info: "温复位；AU"
        - name: "AMAIR1"
          desc: "当使用长描述符格式转换表进行第 1 阶段转换时，为 MAIR1 指定的内存区域提供 IMPLEMENTATION DEFINED 内存属性。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:0"
              desc: "IMPLEMENTATION DEFINED。"
              reset_info: "温复位；AU"
        - name: "HACTLR"
          desc: "控制 Hyp 模式操作的 IMPLEMENTATION DEFINED 功能。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:0"
              desc: "IMPLEMENTATION DEFINED。"
              reset_info: "温复位；AU"
        - name: "HACTLR2"
          desc: "为 HACTLR 寄存器提供额外空间以保存 IMPLEMENTATION DEFINED 陷阱功能。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:0"
              desc: "IMPLEMENTATION DEFINED。"
              reset_info: "温复位；AU"
        - name: "HADFSR"
          desc: "为进入 Hyp 模式的数据中止异常提供附加的 IMPLEMENTATION DEFINED 综合征信息。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:0"
              desc: "IMPLEMENTATION DEFINED。"
              reset_info: "温复位；AU"
        - name: "HAIFSR"
          desc: "为进入 Hyp 模式的预取中止异常提供附加的 IMPLEMENTATION DEFINED 综合征信息。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:0"
              desc: "IMPLEMENTATION DEFINED。"
              reset_info: "温复位；AU"
        - name: "HAMAIR0"
          desc: "为HMAIR0定义的内存属性编码提供 IMPLEMENTATION DEFINED 内存属性。这些 IMPLEMENTATION DEFINED 属性只能为内存属性编码提供附加限定符，而不能更改HMAIR0中定义的内存属性。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:0"
              desc: "IMPLEMENTATION DEFINED。"
              reset_info: "温复位；AU"
        - name: "HAMAIR1"
          desc: "为HMAIR1定义的内存属性编码提供 IMPLEMENTATION DEFINED 内存属性。这些 IMPLEMENTATION DEFINED 属性只能为内存属性编码提供附加限定符，而不能更改HMAIR1中定义的内存属性。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:0"
              desc: "IMPLEMENTATION DEFINED。"
              reset_info: "温复位；AU"
    - name: "Legacy"
      title: "旧式寄存器"
      access: "MRS / MSR 系统寄存器接口"
