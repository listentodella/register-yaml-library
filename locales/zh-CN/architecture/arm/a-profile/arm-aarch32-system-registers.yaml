            - name: "BADDR"
              bits: "47:1"
              desc: "转换表基地址，位[47:x]，位[x-1:1]是 RES0，附加要求是，如果位[x-1:3]不全为零，则这是一个未对齐的转换表基地址，其影响是 CONSTRAINED UNPREDICTABLE，并且必须是以下之一：\n寄存器位 [x-1:3] 被视为所有位均为零。从这些位读回的值要么是写入的值，要么是零。使用该寄存器计算转换表遍历的地址的结果可能会在那些非零位中被破坏。 x 由 VTCR.SL0 和 VTCR.T0SZ 的值确定，如下所示：\n如果 VTCR.SL0 为 0b00，表示查找从级别 2 开始，则 x 为 14 - VTCR.T0SZ。如果 VTCR.SL0 为 0b01，表示查找从级别 1 开始，则 x 为 5 - VTCR.T0SZ。如果 VTCR.SL0 为 0b10 或 0b11，则生成第 2 阶段第 1 级转换故障。如果转换表基地址的位[47:40]不为零，则会生成地址大小错误。"
              reset_info: "温复位；AU"
            - name: "CnP"
              bits: "0"
              source_condition: "When FEAT_TTCNP is implemented"
              desc: "共同而非私人。该位指示VTTBR指向的每个条目是否是可由VTTBR.CnP值为1的内部共享域中的每个PE使用的公共集的成员。当TLB组合条目时从阶段 1 转换和阶段 2 转换为单个条目，如果阶段 1 和阶段 2 的 CnP 位的值为 1，则该条目只能在不同的 PE 之间共享。如果在同一内部共享域中的多个 PE 上 VTTBR.CnP 位的值为 1，并且这些 VTTBR 不指向相同的转换当 VMID 值与当前 VMID 相同时，转换结果为 CONSTRAINED UNPREDICTABLE，参见“CONSTRAINED UNPREDICTABLE 由于缓存控件或数据值而导致的行为。"
              condition: "当实现FEAT_TTCNP时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "对于内部共享域中的其他 PE，允许 VTTBR 指向的转换表条目与 VTTBR 的条目不同。这不受当前VMID值的影响。"
                - value: "0b1"
                  desc: "VTTBR 指向的转换表条目与内部共享域中每个其他 PE 的转换表条目相同，其中 VTTBR.CnP 的值为 1，并且 VMID 与当前 VMID 相同。"
            - name: "RES0"
              bits: "0"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
    - name: "Other"
      title: "其他"
      access: "MRS / MSR 系统寄存器接口"
      desc: "Arm AArch32 架构系统寄存器：其他"
      registers:
        - name: "CPACR"
          desc: "控制对跟踪以及对 EL0、EL1 和 EL3 的高级 SIMD 和浮点功能的访问。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "ASEDIS"
              bits: "31"
              desc: "禁用高级 SIMD 指令的 PL0 和 PL1 执行。如果实现不包括高级 SIMD 和浮点功能，则该位域为 RES0。否则，该位域是否实现为RW位域是 IMPLEMENTATION DEFINED。如果不实现为RW位域，则为 RAZ/WI。如果实现了 EL3 并使用 AArch32，且 NSACR.NSASEDIS 的值为 1，则该位域在非安全模式下的行为为 RAO/WI 状态，无论其实际值如何。即使该位域实现为 RAZ/WI，这也适用。有关受此位域影响的指令列表，请参阅“不适用于浮点运算的高级 SIMD 操作的控制”。请参阅 CPACR.cp10 的说明，了解可以禁用或捕获 AArch32 状态下的高级 SIMD 指令执行的其他控件列表。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "该控制允许在 PL0 和 PL1 处执行高级 SIMD 指令。"
                - value: "0b1"
                  desc: "所有高级 SIMD 指令编码但不是浮点指令编码的指令编码在 PL0 和 PL1 处为 UNDEFINED。"
            - name: "RES0"
              bits: "30:29"
              desc: "保留，RES0。"
            - name: "TRCDIS"
              bits: "28"
              desc: "将对所有实现的跟踪系统寄存器的 PL0 和 PL1 系统寄存器访问陷入 未定义模式。如果实现不包括跟踪单元，或者不包括到跟踪单元寄存器的系统寄存器接口，则该位域为 RES0。否则，该位域是否实现为RW位域是 IMPLEMENTATION DEFINED。如果不实现为RW位域，则为 RAZ/WI。如果 EL3 已实现并使用 AArch32，并且 NSACR.NSTRCDIS 的值为 1，则该位域的行为为 RAO/WI 非安全状态，无论其实际值如何。即使该位域实现为 RAZ/WI，这也适用。 FEAT_ETMv4 和 FEAT_ETE 不允许 EL0 访问跟踪系统寄存器。 EL0 对跟踪系统寄存器的访问是UNDEFINED。 Arm 架构不通过可选的内存映射外部调试接口提供跟踪寄存器访问的陷阱。对跟踪系统寄存器的系统寄存器访问可能会产生副作用。当系统寄存器访问被捕获时，在发生异常之前不会发生通常与该访问相关的任何副作用。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "该控制对 PL0 和 PL1 系统寄存器对跟踪系统寄存器的访问没有影响。"
                - value: "0b1"
                  desc: "PL0 和 PL1 对所有已实现跟踪的系统寄存器访问 系统寄存器被捕获为未定义模式。"
            - name: "RES0"
              bits: "27:24"
              desc: "保留，RES0。"
            - name: "cp11"
              bits: "23:22"
              desc: "该位域的值将被忽略。如果该位域编程为与 cp10 位域不同的值，则直接读取 CPACR 时该位域为 UNKNOWN。如果实现不包括高级 SIMD 和浮点功能，则该位域为 RES0。在非安全状态下，如果实现了EL3并使用AArch32，当NSACR.cp10的值为0时，该位域的行为为 RAZ/WI，无论其实际值如何。"
              reset_info: "温复位；'00'"
            - name: "cp10"
              bits: "21:20"
              desc: "定义高级 SIMD 和浮点功能的访问权限。该位域的可能值有：\n这些位域控制的高级 SIMD 和浮点功能包括：\n执行任何浮点或高级 SIMD 指令。对高级 SIMD 和浮点寄存器 D0-D31 的任何访问及其视图为 S0-S31 和 Q0-Q15。对 FPSCR、FPSID、MVFR0、MVFR1、MVFR2 或 FPEXC 系统的任何访问寄存器。 CPACR 对高级 SIMD 和来自 PL2 的浮点访问没有影响。这些可以通过 HCPTR.TCP10 field.If 实现不包括高级 SIMD 和浮点功能，则该位域为\nRES0。在非安全状态下，如果实现了EL3并使用AArch32，当NSACR.cp10的值为0时，该位域的行为为 RAZ/WI，无论其实际值如何。高级 SIMD 和浮点指令在 AArch32 状态下的执行可以通过以下控件禁用或捕获：\nCPACR.cp10，或者，如果在 EL0 处执行，则为 CPACR_EL1.FPEN。 FPEXC.EN。如果在非安全状态下执行：HCPTR.TCP10，或者如果 EL2 使用 AArch64、CPTR_EL2.TFP。 NSACR.cp10，或者如果 EL3 使用 AArch64、CPTR_EL3.TFP。仅适用于高级 SIMD 指令：CPACR.ASEDIS。如果在非安全状态下执行，则 HCPTR.TASE 和 NSACR.NSASEDIS。有关详细信息，请参阅控件的说明。"
              reset_info: "温复位；'00'"
              values:
                - value: "0b00"
                  desc: "PL0 和 PL1 访问高级 SIMD，浮点寄存器或指令为 UNDEFINED。"
                - value: "0b01"
                  desc: "PL0 访问高级 SIMD，浮点寄存器或指令为 UNDEFINED。"
                - value: "0b10"
                  desc: "预订的。将此位域编程为此值的效果是 CONSTRAINED UNPREDICTABLE 选择：\n出于读取该位域值以外的所有目的，该位域的值被视为 0b00、0b01 或 0b11。 PL1 访问浮点和高级 SIMD 寄存器或指令是 UNDEFINED。"
                - value: "0b11"
                  desc: "该控制允许从 PL0 和 PL1 完全访问高级 SIMD 和浮点功能。"
            - name: "RES0"
              bits: "19:0"
              desc: "保留，RES0。"
        - name: "SCTLR"
          desc: "提供系统的顶层控制，包括其内存系统。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "DSSBS"
              bits: "31"
              source_condition: "When FEAT_SSBS is implemented"
              desc: "异常条目上的默认 PSTATE.SSBS 值。定义的值为：\n当EL3被实现并使用AArch32 时，该位被存储在两个安全状态之间。"
              condition: "当实现FEAT_SSBS时"
              reset_info: "温复位；ID"
              values:
                - value: "0b0"
                  desc: "PSTATE.SSBS 在此安全状态下的任何模式（Hyp 模式除外）的异常情况下设置为 0"
                - value: "0b1"
                  desc: "PSTATE.SSBS 设置为 1，此安全状态中任何模式的异常情况（Hyp 模式除外）"
            - name: "RES0"
              bits: "31"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "TE"
              bits: "30"
              desc: "T32 异常启用。该位控制在 PL1 执行的异常级别的异常是否进入 A32 或 T32 状态："
              reset_info: "温复位；ID"
              values:
                - value: "0b0"
                  desc: "异常（包括复位）进入 A32 状态。"
                - value: "0b1"
                  desc: "异常（包括复位）进入 T32 状态。"
            - name: "AFE"
              bits: "29"
              desc: "访问标志启用。当使用 PL1&0 地址转换机制的短描述符转换表格式时，该位允许使用转换描述符中的 AP[0] 位作为访问标志，并将转换描述符中的访问权限限制为简化模型。当使用长描述符转换表格式时，VMSA 的行为就像该位设置为 1，无论该位的值是什么。 AFE 位允许缓存在 TLB 中。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "在转换表描述符中，AP[0]是访问权限位。支持全方位的访问权限。没有实现访问标志。"
                - value: "0b1"
                  desc: "在转换表描述符中，AP[0]是访问标志。仅支持访问权限的简化模型。"
            - name: "TRE"
              bits: "28"
              desc: "TEX 重映射启用。该位允许重新映射 PL1&0 地址转换机制中的 TEX[2:1] 位，用作可由操作系统管理的两个转换表位。启用此重新映射还会更改用于描述 VMSA 中内存区域属性的方案。当TTBCR.EAE的值为1时，该位为 RES1。 TRE 位允许缓存在 TLB 中。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "TEX 重新映射已禁用。 TEX[2:0] 与 C 和 B 位一起用于描述内存区域属性。"
                - value: "0b1"
                  desc: "TEX 重映射已启用。 TEX[2:1] 被重新分配以用作操作系统管理的位。 TEX[0]、C 和 B 位用于描述内存区域属性，以及 MMU 重映射寄存器。"
            - name: "RES0"
              bits: "27:26"
              desc: "保留，RES0。"
            - name: "EE"
              bits: "25"
              desc: "PSTATE.E 位的值分支到异常向量或退出复位，并且第 1 阶段转换表的字节序遵循 PL1&0 地址转换机制。如果实现不为高于 EL0 的异常级别的数据访问提供 Big-endian 支持，则该位为 RES0。如果实现不为高于 EL0 的异常级别的数据访问提供 Little-endian 支持，则该位为 RES1。"
              reset_info: "温复位；ID"
              values:
                - value: "0b0"
                  desc: "小端法。出现异常或退出复位时，PSTATE.E 被清除为 0。 PL1&0 地址转换机制中的第 1 阶段地址转换表行走是小端法。"
                - value: "0b1"
                  desc: "大端。在发生异常或退出复位时，PSTATE.E 设置为 1。 PL1&0 地址转换机制中的第 1 阶段地址转换表行走是大端字节序。"
            - name: "RES0"
              bits: "24"
              desc: "保留，RES0。"
            - name: "SPAN"
              bits: "23"
              source_condition: "When FEAT_PAN is implemented"
              desc: "设置特权访问从不，从安全或非安全状态对 EL1 进行异常处理，或者当 EL3 使用 AArch32 时从安全状态对 EL3 进行异常处理。"
              condition: "当实现 FEAT_PAN 时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "在以下情况下，PSTATE.PAN 设置为 1：\n在非安全状态下，对 EL1 进行异常处理。在安全状态下，当EL3使用AArch64 时，对EL1进行异常处理。在安全状态下，当EL3使用AArch32 时，对EL3进行异常处理。"
                - value: "0b1"
                  desc: "EL1 异常时，PSTATE.PAN 的值保持不变。"
            - name: "RES1"
              bits: "23"
              source_condition: "Otherwise"
              desc: "保留，RES1。"
              condition: "否则"
            - name: "RES1"
              bits: "22"
              desc: "保留，RES1。"
            - name: "RES0"
              bits: "21"
              desc: "保留，RES0。"
            - name: "UWXN"
              bits: "20"
              desc: "非特权写入权限意味着PL1 XN（从不执行）。对于在 PL1 执行的软件的访问，该位可以强制将 PL0 可写的所有内存区域视为 XN。 UWXN 位允许缓存在 TLB 中。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "此控制对内存访问权限没有影响。"
                - value: "0b1"
                  desc: "在 PL0 处可写的任何区域都强制为 XN，以便从在 PL1 处执行的软件进行访问。"
            - name: "WXN"
              bits: "19"
              desc: "写权限意味着XN（从不执行）。对于 PL1&0 地址转换机制，该位可以强制所有可写的内存区域被视为 XN。该位仅在 SCTLR.M 位设置时适用。 WXN 位允许缓存在 TLB 中。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "此控制对内存访问权限没有影响。"
                - value: "0b1"
                  desc: "对于在 PL1 或 PL0 上执行的软件的访问，在 PL1&0 地址转换机制中可写的任何区域都被强制为 XN。"
            - name: "nTWE"
              bits: "18"
              desc: "将 WFE 指令的 EL0 执行陷入 未定义模式。仅当指令通过其条件代码检查时，才会捕获条件 WFE 指令的尝试执行。由于 WFE 或 WFI 可以随时完成，即使没有唤醒事件，因此不保证 WFI 的 WFE 上的陷阱会被捕获，即使 WFE或当没有唤醒事件时执行WFI。唯一的保证是，如果在没有唤醒事件的情况下指令未在有限时间内完成，则会捕获陷阱。"
              reset_info: "温复位；'1'"
              values:
                - value: "0b0"
                  desc: "任何在 EL0 处执行 WFE 指令的尝试都会陷入 未定义模式， 如果指令否则会导致 PE 进入低功耗状态。"
                - value: "0b1"
                  desc: "该控制不会导致任何指令被捕获。"
            - name: "RES0"
              bits: "17"
              desc: "保留，RES0。"
            - name: "nTWI"
              bits: "16"
              desc: "将 WFI 指令的 EL0 执行陷入 未定义模式。仅当指令通过其条件代码检查时，才会捕获尝试执行条件 WFI 指令。由于 WFE 或 WFI 可以随时完成，即使没有唤醒事件，因此不保证 WFI 的 WFE 上的陷阱会被捕获，即使 WFE或当没有唤醒事件时执行WFI。唯一的保证是，如果在没有唤醒事件的情况下指令未在有限时间内完成，则会捕获陷阱。"
              reset_info: "温复位；'1'"
              values:
                - value: "0b0"
                  desc: "如果指令会导致 PE 进入低功耗状态，则在 EL0 处执行 WFI 指令的任何尝试都会陷入 未定义模式。"
                - value: "0b1"
                  desc: "该控制不会导致任何指令被捕获。"
            - name: "RES0"
              bits: "15:14"
              desc: "保留，RES0。"
            - name: "V"
              bits: "13"
              desc: "向量位。该位选择异常向量的基地址，以用于除监视模式或 Hyp 模式之外的 PE 模式："
              reset_info: "温复位；ID"
              values:
                - value: "0b0"
                  desc: "正常异常向量。基地址保存在VBAR中。"
                - value: "0b1"
                  desc: "高异常向量（Hivecs），基地址0xFFFF0000。该基地址无法重新映射。"
            - name: "I"
              bits: "12"
              desc: "指令访问 高速缓存能力控制，针对 EL1 和 EL0 处的访问：\n无论 SCTLR.I 位的值如何，如果满足以下任一条件，从 EL1 和 EL0 对普通存储器的指令访问都是可缓存的：\nEL2 使用 AArch32，HCR.DC 的值为 1。 EL2 使用 AArch64 和 HCR_EL2.DC 的值 为 1。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "所有从PL1和PL0访问普通内存的指令对于所有级别的指令和统一缓存都是不可缓存的。如果 SCTLR.M 的值为 0，则来自 PL1&0 地址转换机制的阶段 1 的指令访问为正常、外部可共享、内部不可高速缓存、外部不可高速缓存存储器。"
                - value: "0b1"
                  desc: "所有从PL1和PL0访问Normal内存的指令都可以被各级指令缓存并统一缓存。如果 SCTLR.M 的值为 0，则来自 PL1&0 地址转换机制的阶段 1 的指令访问为正常、外部可共享、内部直写、外部直写存储器。"
            - name: "RES1"
              bits: "11"
              desc: "保留，RES1。"
            - name: "EnRCTX"
              bits: "10"
              source_condition: "When FEAT_SPECRES is implemented"
              desc: "启用 EL0 访问以下系统指令：\nCFPRCTX。 DVPRCTX。 CPPRCTX。如果实现 FEAT_SPECRES2，则 COSPRCTX。当EL3被实现并使用AArch32 时，该位被存储在两个安全状态之间。"
              condition: "当实现 FEAT_SPECRES 时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "EL0 禁止访问这些指令，并且这些指令陷入 EL1。"
                - value: "0b1"
                  desc: "EL0 启用对这些指令的访问。"
            - name: "RES0"
              bits: "10"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "9"
              desc: "保留，RES0。"
            - name: "SED"
              bits: "8"
              desc: "SETEND指令禁用。禁用 PL0 和 PL1 处的 SETEND 指令。如果实现不支持任何异常级别的混合端操作，则该位为 RES1。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "SETEND 指令在 PL0 和 PL1 处启用。"
                - value: "0b1"
                  desc: "SETEND 指令在 PL0 和 PL1 处为 UNDEFINED。"
            - name: "ITD"
              bits: "7"
              desc: "IT 禁用。禁止在 PL1 和 PL0 处使用 IT 指令。如果活动 IT 块中的一条指令将被该位域禁用，则将该位域设置为 1，则行为为 CONSTRAINED UNPREDICTABLE。有关详细信息，请参阅“IT 块中的指令对 ITD 控制的更改”。 ITD 是可选的，但如果它在 SCTLR 中实现，那么它也必须在 SCTLR_EL1、SCTLR_EL2 和 HSCTLR 中实现。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "所有 IT 指令功能均在 PL1 和 PL0 处启用。"
                - value: "0b1"
                  desc: "任何在 PL1 或 PL0 执行以下任何操作的尝试都是 UNDEFINED：\nIT指令的所有编码为hw1[3:0]!=1000。 hw1：0b11xxxxxxxxxxxxxx 的后续指令的所有编码：所有 32 位指令，以及 16 位指令 B、UDF、SVC、LDM和STM。 0b1011xxxxxxxxxxxx：“杂项 16 位指令”中的所有指令。 0b10100xxxxxxxxxxx: ADD Rd, PC, #imm 0b01001xxxxxxxxxxx: LDR Rd, [PC, #imm] 0b0100x1xxx1111xxx: ADD Rdn, PC; CMPRn，PC； MOV路，PC； BXPC; BLX PC。 0b010001xx1xxxx111:ADDPC,Rm; CMPPC，Rm； MOV PC，房间。该模式还涵盖了不可预测的情况\nBLX Rn。这些指令始终为 UNDEFINED，无论它们是否因位于 IT 块中而通过或未通过适用于它们的条件代码检查。 IT 指令是否被视为： IMPLEMENTATION DEFINED\n一条 16 位指令，后面只能跟另一条 16 位指令。 32 位指令的前半部分。这意味着，对于UNDEFINED的情况，第二个16 位指令或32 位指令是UNDEFINED。关于 IT 是否被视为 16 位指令或 32 位指令的前半部分，实现可能会动态变化。"
            - name: "UNK"
              bits: "6"
              desc: "对此位的写入将被IGNORED。读取该位会返回 UNKNOWN 值。"
              reset_info: "温复位；AU"
            - name: "CP15BEN"
              bits: "5"
              desc: "系统指令内存屏障启用。允许从 PL1 和 PL0 访问 (coproc==0b1111) 编码空间中的 DMB、DSB 和 ISB 系统指令：\nCP15BEN 是可选的，但如果它在 SCTLR 中实现，那么它也必须在 SCTLR_EL1、SCTLR_EL2 和 HSCTLR 中实现。"
              reset_info: "温复位；'1'"
              values:
                - value: "0b0"
                  desc: "CP15DMB、CP15DSB 和 CP15ISB 指令的 PL0 和 PL1 执行是 UNDEFINED。"
                - value: "0b1"
                  desc: "PL0 和 PL1 允许执行 CP15DMB、CP15DSB 和 CP15ISB 指令。"
            - name: "LSMAOE"
              bits: "4"
              source_condition: "When FEAT_LSMAOC is implemented"
              desc: "加载多个和存储多个原子性和排序启用。该位允许缓存在TLB中。"
              condition: "当实现FEAT_LSMAOC时"
              reset_info: "温复位；'1'"
              values:
                - value: "0b0"
                  desc: "对于 EL1 或 EL0、T32 和 A32 处的所有存储器访问，Load Multiple 和 Store Multiple 可以在顺序存储器访问期间产生中断，并且不需要对存储器访问进行排序。"
                - value: "0b1"
                  desc: "T32 和 A32 在 EL1 或 EL0 处加载多个和存储多个的排序和中断行为与 Armv8.0 的定义相同。"
            - name: "RES1"
              bits: "4"
              source_condition: "Otherwise"
              desc: "保留，RES1。"
              condition: "否则"
            - name: "nTLSMD"
              bits: "3"
              source_condition: "When FEAT_LSMAOC is implemented"
              desc: "无陷阱加载多个并将多个存储到设备-nGRE/设备-nGnRE/设备-nGnRnE内存。该位允许缓存在TLB中。"
              condition: "当实现FEAT_LSMAOC时"
              reset_info: "温复位；'1'"
              values:
                - value: "0b0"
                  desc: "T32 和 A32 在 EL1 或 EL0 处加载多个和存储多个的所有内存访问在第 1 阶段标记为设备-nGRE/Device-nGnRE/Device-nGnRnE 内存被捕获并生成第 1 阶段对齐故障。"
                - value: "0b1"
                  desc: "T32 和 A32 在 EL1 或 EL0 处加载多个和存储多个的所有内存访问在第 1 阶段标记为设备-nGRE/Device-nGnRE/Device-nGnRnE 内存不会被捕获。"
            - name: "RES1"
              bits: "3"
              source_condition: "Otherwise"
              desc: "保留，RES1。"
              condition: "否则"
            - name: "C"
              bits: "2"
              desc: "缓存能力控制，用于 EL1 和 EL0 处的数据访问：\nPE 忽略 SCTLR.C，并且从 EL1 和 EL0 对普通内存的数据访问是可缓存的，如果：\nEL2 使用 AArch32，HCR.DC 的值为 1。EL2 使用 AArch64 和 HCR_EL2.DC 的值 为 1。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "所有从PL1和PL0对Normal内存的数据访问，以及对PL1&0阶段1转换表的所有访问，对于所有级别的数据和统一缓存都是不可缓存的。"
                - value: "0b1"
                  desc: "所有从PL1和PL0对Normal内存的数据访问，以及对PL1&0阶段1转换表的所有访问，都可以被各级数据缓存并统一缓存。"
            - name: "A"
              bits: "1"
              desc: "启用对齐检查。这是 PL1 和 PL0 处的对齐故障检查的使能位：\n无论 A 位的值如何，加载/存储独占和加载获取/存储释放指令都会进行对齐检查。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "在 PL1 或 PL0 执行时禁用对齐故障检查。加载或存储一个或多个寄存器的指令（加载/存储独占和加载获取/存储释放除外）不会检查正在访问的地址是否与正在访问的数据元素的大小对齐。"
                - value: "0b1"
                  desc: "在 PL1 或 PL0 处执行时启用对齐故障检查。所有加载或存储一个或多个寄存器的指令都具有对齐检查，以确保正在访问的地址与正在访问的数据元素的大小对齐。如果此检查失败，则会导致对齐错误，这被视为数据中止异常。"
            - name: "M"
              bits: "0"
              desc: "MMU 启用 EL1 和 EL0 第 1 阶段地址转换。该位的可能值为：\nPE 的行为就像 SCTLR.M 位域的值为 0 一样，除了返回直接读取位域的值之外，如果满足以下任一目的：\nEL2 使用 AArch32，并且 HCR.{DC, TGE} 的值不是 {0, 0}。 EL2 使用 AArch64，并且 HCR_EL2.{DC, TGE} 的值不是 {0, 0}。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "EL1 和 EL0 阶段 1 地址转换已禁用。有关指令访问普通内存的行为，请参阅 SCTLR.I 位域。"
                - value: "0b1"
                  desc: "EL1 和 EL0 阶段 1 地址转换已启用。"
    - name: "PMU"
      title: "性能监视单元（PMU）"
      access: "MRS / MSR 系统寄存器接口"
      desc: "Arm AArch32 架构系统寄存器：PMU"
      registers:
        - name: "PMCCFILTR"
          desc: "确定周期计数器 PMCCNTR 递增的模式。"
          condition: "当实现 FEAT_AA32 并实现 FEAT_PMUv3 时"
          fields:
            - name: "P"
              bits: "31"
              desc: "特权过滤。控制 EL1 中的计数周期，如果 EL3 使用 AArch32，则控制 EL3。如果实现了安全和非安全状态，则非安全 EL1 中的计数周期由 PMCCFILTR.NSK 进一步控制。"
              reset_info: "冷复位；FEAT_PMUv3_EXTPMN已实现；AU；温复位；FEAT_AA64未实现；'0'；温复位；FEAT_PMUv3_EXTPMN未实现；AU"
              values:
                - value: "0b0"
                  desc: "该机制对循环过滤没有影响。"
                - value: "0b1"
                  desc: "PE 不计算 EL1 中的周期，并且如果 EL3 使用 AArch32，则 EL3。"
            - name: "U"
              bits: "30"
              desc: "用户过滤。控制EL0中的计数周期。如果实现了安全和非安全状态，则非安全 EL0 中的计数周期由 PMCCFILTR.NSU 进一步控制。如果实现FEAT_RME，则RealmEL0中的计数周期由PMCCFILTR.RLU进一步控制。"
              reset_info: "冷复位；FEAT_PMUv3_EXTPMN已实现；AU；温复位；FEAT_AA64未实现；'0'；温复位；FEAT_PMUv3_EXTPMN未实现；AU"
              values:
                - value: "0b0"
                  desc: "该机制对循环过滤没有影响。"
                - value: "0b1"
                  desc: "PE不计算EL0中的周期。"
            - name: "NSK"
              bits: "29"
              source_condition: "When EL3 is implemented"
              desc: "非安全 EL1 过滤。控制非安全 EL1 中的计数周期。如果 PMCCFILTR.NSK 不等于 PMCCFILTR.P，则 PE 不会对非安全 EL1 中的周期进行计数。否则，该机制对非安全EL1中的循环过滤没有影响。"
              condition: "当实现EL3时"
              reset_info: "冷复位；FEAT_PMUv3_EXTPMN已实现；AU；温复位；FEAT_AA64未实现；'0'；温复位；FEAT_PMUv3_EXTPMN未实现；AU"
              values:
                - value: "0b0"
                  desc: "当PMCCFILTR.P==0时，该机制对循环过滤没有影响。当 PMCCFILTR.P == 1 时，PE 不会对非安全 EL1 中的周期进行计数。"
                - value: "0b1"
                  desc: "当 PMCCFILTR.P == 0 时，PE 不会对非安全 EL1 中的周期进行计数。当PMCCFILTR.P==1时，该机制对循环过滤没有影响。"
            - name: "RES0"
              bits: "29"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "NSU"
              bits: "28"
              source_condition: "When EL3 is implemented"
              desc: "非安全 EL0 过滤。控制非安全 EL0 中的计数周期。如果 PMCCFILTR.NSU 不等于 PMCCFILTR.U，则 PE 不会对非安全 EL0 中的周期进行计数。否则，该机制对非安全EL0中的循环过滤没有影响。"
              condition: "当实现EL3时"
              reset_info: "冷复位；FEAT_PMUv3_EXTPMN已实现；AU；温复位；FEAT_AA64未实现；'0'；温复位；FEAT_PMUv3_EXTPMN未实现；AU"
              values:
                - value: "0b0"
                  desc: "当PMCCFILTR.U==0时，该机制对循环过滤没有影响。当 PMCCFILTR.U == 1 时，PE 不会对非安全 EL0 中的周期进行计数。"
                - value: "0b1"
                  desc: "当 PMCCFILTR.U == 0 时，PE 不会对非安全 EL0 中的周期进行计数。当PMCCFILTR.U==1时，该机制对循环过滤没有影响。"
            - name: "RES0"
              bits: "28"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "NSH"
              bits: "27"
              source_condition: "When EL2 is implemented"
              desc: "EL2过滤。控制EL2中的计数周期。如果实现了EL3并且实现了FEAT_SEL2，则安全EL2中的计数周期由PMCCFILTR.SH进一步控制。"
              condition: "当实现EL2时"
              reset_info: "冷复位；FEAT_PMUv3_EXTPMN已实现；AU；温复位；FEAT_AA64未实现；'0'；温复位；FEAT_PMUv3_EXTPMN未实现；AU"
              values:
                - value: "0b0"
                  desc: "PE不计算EL2中的周期。"
                - value: "0b1"
                  desc: "该机制对循环过滤没有影响。"
            - name: "RES0"
              bits: "27"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "26:22"
              desc: "保留，RES0。"
            - name: "RLU"
              bits: "21"
              source_condition: "When FEAT_RME is implemented"
              desc: "RealmEL0过滤。控制Realm EL0 中的计数周期。如果 PMCCFILTR.RLU 不等于 PMCCFILTR.U，则 PE 不会对Realm EL0 中的周期进行计数。否则，该机制对RealmEL0中的循环过滤没有影响。"
              condition: "当实现FEAT_RME时"
              reset_info: "冷复位；FEAT_PMUv3_EXTPMN已实现；AU；温复位；FEAT_PMUv3_EXTPMN未实现；AU"
              values:
                - value: "0b0"
                  desc: "当PMCCFILTR.U==0时，该机制对循环过滤没有影响。当 PMCCFILTR.U == 1 时，PE 不会对 Realm EL0 中的周期进行计数。"
                - value: "0b1"
                  desc: "当 PMCCFILTR.U == 0 时，PE 不会对 Realm EL0 中的周期进行计数。当PMCCFILTR.U==1时，该机制对循环过滤没有影响。"
            - name: "RES0"
              bits: "21"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "20:0"
              desc: "保留，RES0。"
        - name: "PMCCNTR"
          desc: "保存处理器周期计数器的值，CCNT，用于计算处理器时钟周期。有关详细信息，请参阅“性能监视器周期计数器测量的时间”。"
          condition: "当实现 FEAT_AA32 并实现 FEAT_PMUv3 时"
          fields:
            - name: "CCNT"
              bits: "63:0"
              desc: "周期计数。根据 PMCR.{LC,D} 的值，该位域按以下方式之一递增：\n每个处理器时钟周期。每 64 个处理器时钟周期。将 1 写入 PMCR.C 将此位域设置为 0。"
              reset_info: "冷复位；FEAT_PMUv3_EXTPMN已实现；AU；温复位；FEAT_PMUv3_EXTPMN未实现；AU"
        - name: "PMCEID0"
          desc: "定义使用 0x0000 到 0x001F 范围内的 PMU 事件来实现或计数哪些公共架构事件和公共微架构事件。"
          condition: "当实现 FEAT_AA32 并实现 FEAT_PMUv3 时"
          fields:
            - name: "ID<n>"
              bits: "31:0"
              desc: "ID[n]对应公共事件n。对于每一位：\n当该位域中某位的值为1时，对应的Common事件被执行并计数。 Arm 建议，如果公共事件从未被计数，则相应位的值为 0。保留与保留事件编号对应的位。该值可能会在架构的未来修订版中用于识别其他公共事件。此类事件可能会追溯添加到早期版本的 PMU 架构中，前提是该事件不需要任何额外的 PMU 功能，并且具有可以在 PMU 早期版本的 PMCEID<n> 寄存器中表示的事件编号。架构。"
              values:
                - value: "0b0"
                  desc: "公共事件未实现，或未计算在内。"
                - value: "0b1"
                  desc: "公共事件已实现。"
        - name: "PMCEID1"
          desc: "定义使用 0x0020 到 0x003F 范围内的 PMU 事件来实现或计数哪些公共架构事件和公共微架构事件。"
          condition: "当实现 FEAT_AA32 并实现 FEAT_PMUv3 时"
          fields:
            - name: "ID<n>"
              bits: "31:0"
              desc: "ID[n]对应公共事件(0x0020 + n)。对于每一位：\n当该位域中某位的值为1时，对应的Common事件被执行并计数。 Arm 建议，如果公共事件从未被计数，则相应位的值为 0。保留与保留事件编号对应的位。该值可能会在架构的未来修订版中用于识别其他公共事件。此类事件可能会追溯添加到早期版本的 PMU 架构中，前提是该事件不需要任何额外的 PMU 功能，并且具有可以在 PMU 早期版本的 PMCEID<n> 寄存器中表示的事件编号。架构。"
              values:
                - value: "0b0"
                  desc: "公共事件未实现，或未计算在内。"
                - value: "0b1"
                  desc: "公共事件已实现。"
        - name: "PMCEID2"
          desc: "定义使用 0x4000 到 0x401F 范围内的 PMU 事件来实现或计数哪些公共架构事件和公共微架构事件。"
          condition: "当实现 FEAT_AA32 且实现 FEAT_PMUv3p1 时"
          fields:
            - name: "IDhi<n>"
              bits: "31:0"
              desc: "IDhi[n] 对应于公共事件 (0x4000 + n)。对于每一位：\n当该位域中某位的值为1时，对应的Common事件被执行并计数。 Arm 建议，如果公共事件从未被计数，则相应位的值为 0。保留与保留事件编号对应的位。该值可能会在架构的未来修订版中用于识别其他公共事件。此类事件可能会追溯添加到早期版本的 PMU 架构中，前提是该事件不需要任何额外的 PMU 功能，并且具有可以在 PMU 早期版本的 PMCEID<n> 寄存器中表示的事件编号。架构。"
              values:
                - value: "0b0"
                  desc: "公共事件未实现，或未计算在内。"
                - value: "0b1"
                  desc: "公共事件已实现。"
        - name: "PMCEID3"
          desc: "定义使用 0x4020 到 0x403F 范围内的 PMU 事件来实现或计数哪些公共架构事件和公共微架构事件。"
          condition: "当实现 FEAT_AA32 且实现 FEAT_PMUv3p1 时"
          fields:
            - name: "IDhi<n>"
              bits: "31:0"
              desc: "IDhi[n] 对应于公共事件 (0x4020 + n)。对于每一位：\n当该位域中某位的值为1时，对应的Common事件被执行并计数。 Arm 建议，如果公共事件从未被计数，则相应位的值为 0。保留与保留事件编号对应的位。该值可能会在架构的未来修订版中用于识别其他公共事件。此类事件可能会追溯添加到早期版本的 PMU 架构中，前提是该事件不需要任何额外的 PMU 功能，并且具有可以在 PMU 早期版本的 PMCEID<n> 寄存器中表示的事件编号。架构。"
              values:
                - value: "0b0"
                  desc: "公共事件未实现，或未计算在内。"
                - value: "0b1"
                  desc: "公共事件已实现。"
        - name: "PMCNTENCLR"
          desc: "允许软件禁用以下计数器："
          condition: "当实现 FEAT_AA32 并实现 FEAT_PMUv3 时"
          fields:
            - name: "C"
              bits: "31"
              desc: "PMCCNTR 禁用。写入时，允许软件禁用 PMCCNTR。读取时，返回 PMCCNTR 启用状态。"
              reset_info: "冷复位；FEAT_PMUv3_EXTPMN已实现；AU；温复位；FEAT_PMUv3_EXTPMN未实现；AU"
              values:
                - value: "0b0"
                  desc: "PMCCNTR 禁用。"
                - value: "0b1"
                  desc: "PMCCNTR 已启用。"
            - name: "P<m>"
              bits: "30:0"
              desc: "PMEVCNTR<m> 禁用。写入时，允许软件禁用 PMEVCNTR<m>。读取时，返回 PMEVCNTR<m> 启用状态。"
              reset_info: "冷复位；FEAT_PMUv3_EXTPMN已实现；AU；温复位；FEAT_PMUv3_EXTPMN未实现；AU"
              values:
                - value: "0b0"
                  desc: "PMEVCNTR<m> 已禁用。"
                - value: "0b1"
                  desc: "PMEVCNTR<m> 已启用。"
        - name: "PMCNTENSET"
          desc: "允许软件启用以下计数器："
          condition: "当实现 FEAT_AA32 并实现 FEAT_PMUv3 时"
          fields:
            - name: "C"
              bits: "31"
              desc: "PMCCNTR 启用。写入时，允许软件启用 PMCCNTR。读取时，返回 PMCCNTR 启用状态。"
              reset_info: "冷复位；FEAT_PMUv3_EXTPMN已实现；AU；温复位；FEAT_PMUv3_EXTPMN未实现；AU"
              values:
                - value: "0b0"
                  desc: "PMCCNTR 禁用。"
                - value: "0b1"
                  desc: "PMCCNTR 已启用。"
            - name: "P<m>"
              bits: "30:0"
              desc: "PMEVCNTR<m> 启用。写入时，允许软件启用 PMEVCNTR<m>。读取时，返回 PMEVCNTR<m> 启用状态。"
              reset_info: "冷复位；FEAT_PMUv3_EXTPMN已实现；AU；温复位；FEAT_PMUv3_EXTPMN未实现；AU"
              values:
                - value: "0b0"
                  desc: "PMEVCNTR<m> 已禁用。"
                - value: "0b1"
                  desc: "PMEVCNTR<m> 已启用。"
        - name: "PMCR"
          desc: "提供性能监视器实现的详细信息，包括实现的计数器数量，并配置和控制计数器。"
          condition: "当实现 FEAT_AA32 并实现 FEAT_PMUv3 时"
          fields:
            - name: "IMP"
              bits: "31:24"
              source_condition: "When FEAT_PMUv3p7 is not implemented"
              desc: "实现者代码。如果该位域为零，则 PMCR.IDCODE 为 RES0，并且软件必须使用 MIDR 来识别 PE。否则，该位域和 PMCR.IDCODE 标识软件的 PMU 实现。实现者代码由 Arm 分配。非零值与 MIDR.Implementer 具有相同的解释。 Arm 不赞成使用该位域。该位域具有 IMPLEMENTATION DEFINED 值。"
              condition: "当FEAT_PMUv3p7未实现时"
            - name: "RAZ"
              bits: "31:24"
              source_condition: "Otherwise"
              desc: "保留，RAZ。"
              condition: "否则"
            - name: "IDCODE"
              bits: "23:16"
              source_condition: "When PMCR.IMP != '00000000'"
              desc: "识别码。 Arm 不赞成使用该位域。每个实现者必须维护一个特定于实现者的识别码列表。通过实现者代码和识别码的组合来识别具体的实现。该位域具有 IMPLEMENTATION DEFINED 值。"
              condition: "当 PMCR.IMP != '00000000' 时"
            - name: "RES0"
              bits: "23:16"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "N"
              bits: "15:11"
              desc: "指示已实现的事件计数器的数量。该值的范围是0b00000-0b11111。如果值为0b00000，则仅实现PMCCNTR。如果值为0b11111，则实现PMCCNTR和31个事件计数器。如果实现 EL2，则以下所有内容均适用：\n如果 EL2 使用 AArch32，则从非安全 EL1 和非安全 EL0 读取该位域将返回 HDCR.HPMN 的有效值。如果在当前安全状态下启用EL2并使用AArch64，则从EL1和EL0读取该位域返回MDCR_EL2.HPMN的有效值。该位域具有 IMPLEMENTATION DEFINED 值。"
            - name: "RES0"
              bits: "10"
              desc: "保留，RES0。"
            - name: "FZO"
              bits: "9"
              source_condition: "When FEAT_PMUv3p7 is implemented"
              desc: "溢出时冻结。溢出时停止事件计数器。受该位域影响的计数器有：\n第一个范围内的事件计数器。如果PMCR.DP为1，则循环计数器PMCCNTR。其他事件计数器不受此位域的影响。当PMCR.DP为0时，PMCCNTR不受该位域影响。有关事件计数器范围的更多信息，请参阅 MDCR_EL2.HPMN 或 HDCR.HPMN。"
              condition: "当实现 FEAT_PMUv3p7 时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "溢出时不要冻结。"
                - value: "0b1"
                  desc: "对于第一个范围内的任何事件计数器 PMEVCNTR<m>，当 PMOVSR[m] 为 1 时，受影响的计数器不计数。"
            - name: "RES0"
              bits: "9"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "8"
              desc: "保留，RES0。"
            - name: "LP"
              bits: "7"
              source_condition: "When FEAT_PMUv3p5 is implemented"
              desc: "长事件计数器启用。确定 PMOVSR.P[n] 何时记录无符号溢出。受该位域影响的计数器是第一个范围中的事件计数器。有关事件计数器范围的更多信息，请参阅 MDCR_EL2.HPMN 或 HDCR.HPMN。其他事件计数器和PMCCNTR不受该位域的影响。 PMEVCNTR<n>[63:32] 在 AArch32 状态下不可访问。如果最高实现的异常级别使用AArch32，则无论该位域是读/写还是 RAZ/WI，都是 IMPLEMENTATION DEFINED。"
              condition: "当实现 FEAT_PMUv3p5 时"
              reset_info: "温复位；FEAT_AA64未实现；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "事件计数器增量溢出，导致 PMEVCNTR<n>[31:0] 无符号溢出。"
                - value: "0b1"
                  desc: "事件计数器增量溢出，导致 PMEVCNTR<n>[63:0] 无符号溢出。"
            - name: "RES0"
              bits: "7"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "LC"
              bits: "6"
              desc: "长周期计数器使能。确定 PMOVSR.C 何时记录无符号溢出。 Arm 不建议使用 PMCR.LC = 0。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "循环计数器增量溢出导致 PMCCNTR[31:0] 无符号溢出。"
                - value: "0b1"
                  desc: "循环计数器增量溢出导致 PMCCNTR[63:0] 无符号溢出。"
            - name: "DP"
              bits: "5"
              source_condition: "When EL3 is implemented, or (FEAT_PMUv3p1 is implemented and EL2 is implemented), or FEAT_PMUv3p7 is implemented, or FEAT_SPE_DPFZS is implemented"
              desc: "当事件计数被禁止时，禁用循环计数器。该位域禁用循环计数器时的条件与禁止或冻结第一范围内的事件计数器的事件计数时的条件相同。有关事件计数器范围的更多信息，请参阅 MDCR_EL2.HPMN 或 HDCR.HPMN。有关详细信息，请参阅“禁止事件和周期盘点”。"
              condition: "当实现EL3时，或（实现FEAT_PMUv3p1且实现EL2时），或实现FEAT_PMUv3p7时，或FEAT_SPE_DPFZS已实现"
              reset_info: "温复位；FEAT_AA64未实现；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "PMCCNTR 的周期计数不受此机制的影响。"
                - value: "0b1"
                  desc: "在禁止区域中以及当事件计数被冻结时，PMCCNTR 的周期计数被禁用：\n如果FEAT_PMUv3p1被实现，EL2被实现，并且MDCR_EL2.HPMD或HDCR.HPMD为1，则通过PMCCNTR 在 EL2 处被禁用。如果实现 FEAT_PMUv3p7 并且通过 PMCR.FZO 冻结事件计数，则禁用 PMCCNTR 的周期计数。如果实现FEAT_PMUv3p7，实现EL3并使用AArch64，并且MDCR_EL3.MPMX为1，则通过PMCCNTR 在 EL3 处被禁用。如果实现了EL3，则MDCR_EL3.SPME或SDCR.SPME为0，并且未实现FEAT_PMUv3p7之一，则EL3使用 AArch32，或 MDCR_EL3.MPMX 为 0，则 PMCCNTR 的周期计数在 EL3 处被禁用，并处于安全状态。"
            - name: "RES0"
              bits: "5"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "X"
              bits: "4"
              source_condition: "When the implementation includes a PMU event export bus"
              desc: "启用 IMPLEMENTATION DEFINED PMU 事件导出总线中的事件导出。该位域允许通过 IMPLEMENTATION DEFINED PMU 事件导出总线将事件导出到另一个设备。禁止计数时不会导出任何事件。该位域不会影响性能监视器溢出中断请求的生成或发送到交叉触发接口（CTI）的信号，这些信号可以实现为从 PE 导出的信号。如果实现了 FEAT_ETE，则该位域不会影响跟踪单元使用 PMU 事件作为外部输入。如果实现 FEAT_ETMv4，则该位域确实会影响跟踪单元将 PMU 事件用作外部输入。"
              condition: "当实现包含 PMU 事件导出总线时"
              reset_info: "温复位；FEAT_AA64未实现；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "不要导出事件。"
                - value: "0b1"
                  desc: "未禁止的出口活动。"
            - name: "RAZ/WI"
              bits: "4"
              source_condition: "Otherwise"
              desc: "保留，RAZ/WI。"
              condition: "否则"
            - name: "D"
              bits: "3"
              desc: "时钟分频器。如果PMCR.LC的有效值为1，则该位域被忽略，并且周期计数器对每个时钟周期进行计数。 Arm 不建议使用 PMCR.D = 1。"
              reset_info: "温复位；FEAT_AA64未实现；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "启用后，PMCCNTR 对每个时钟周期进行计数。"
                - value: "0b1"
                  desc: "启用后，PMCCNTR 每 64 个时钟周期计数一次。"
            - name: "C"
              bits: "2"
              desc: "循环计数器复位。写入该位域的效果是：\n复位PMCCNTR不会改变周期计数器溢出位域。 PMCR.LC 的值被忽略，并且周期计数器的位 [63:0] 被复位。"
              values:
                - value: "0b0"
                  desc: "没有行动。"
                - value: "0b1"
                  desc: "将 PMCCNTR 重置为零。"
            - name: "P"
              bits: "1"
              desc: "事件计数器重置。受该位域影响的事件计数器有：\n第一个范围内的所有事件计数器。如果满足以下任一条件，则第二范围中的所有事件计数器：EL2 在当前安全状态下被禁用或未实现。 PE 正在 EL2 或 EL3 执行。写入该位域不会影响其他事件计数器或周期计数器 PMCCNTR。有关事件计数器范围的更多信息，请参阅 MDCR_EL2.HPMN 或 HDCR.HPMN。重置事件计数器不会更改事件计数器溢出位域。如果实现 FEAT_PMUv3p5，则 MDCR_EL2.HLP 或 HDCR.HLP 和 PMCR.LP 的值将被忽略，并且所有受影响事件计数器的位 [63:0] 将被复位。"
              values:
                - value: "0b0"
                  desc: "没有行动。"
                - value: "0b1"
                  desc: "将所有受影响的事件计数器 PMEVCNTR<n> 重置为零。"
            - name: "E"
              bits: "0"
              desc: "启用。受该位域影响的计数器有：\n第一个范围内的事件计数器。有关事件计数器范围的更多信息，请参阅 MDCR_EL2.HPMN 或 HDCR.HPMN。周期计数器PMCCNTR。其他事件计数器不受此位域的影响。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "受影响的计数器被禁用并且不计数。"
                - value: "0b1"
                  desc: "受影响的计数器由 PMCNTENSET 启用。"
        - name: "PMEVCNTR<n>"
          desc: "保存事件计数器 n，对事件进行计数，其中 n 为 0 到 30。"
          condition: "当实现 FEAT_AA32 并实现 FEAT_PMUv3 时"
          fields:
            - name: "EVCNT"
              bits: "31:0"
              desc: "事件计数器 n 事件计数器 n。事件计数器 n 的值，其中 n 是该寄存器的编号，是 0 到 30 之间的数字。如果实现 FEAT_PMUv3p5，则事件计数器为 64 位，并且在 AArch32 状态下只能访问事件计数器的最低有效部分：\n从计数器的 PMEVCNTR<n> 返回位 [31:0] 读取。写入 PMEVCNTR<n> 更新位 [31:0] 并保持位 [63:32] 不变。无法直接从 AArch32 状态访问位 [63:32]。如果实现不支持AArch64，则不需要实现位[63:32]。如果未实现 FEAT_PMUv3p5，则事件计数器为 32 位。"
              reset_info: "冷复位；FEAT_PMUv3_EXTPMN已实现；AU；温复位；FEAT_PMUv3_EXTPMN未实现；AU"
        - name: "PMEVTYPER<n>"
          desc: "配置事件计数器 n，其中 n 为 0 到 30。"
          condition: "当实现 FEAT_AA32 并实现 FEAT_PMUv3 时"
          fields:
            - name: "P"
              bits: "31"
              desc: "特权过滤。控制 EL1 中的事件计数，如果 EL3 使用 AArch32，则控制 EL3 中的事件计数。如果实现了安全和非安全状态，则非安全 EL1 中的事件计数由 PMEVTYPER<n>.NSK 进一步控制。"
              reset_info: "冷复位；FEAT_PMUv3_EXTPMN已实现；AU；温复位；FEAT_PMUv3_EXTPMN未实现；AU"
              values:
                - value: "0b0"
                  desc: "该机制对事件过滤没有影响。"
                - value: "0b1"
                  desc: "PE 不会对 EL1 中的事件进行计数，并且如果 EL3 使用 AArch32，则 EL3。"
            - name: "U"
              bits: "30"
              desc: "用户过滤。控制EL0中的计数事件。如果实现了安全和非安全状态，则非安全 EL0 中的事件计数由 PMEVTYPER<n>.NSU 进一步控制。如果实现 FEAT_RME，则Realm EL0 中的事件计数进一步由 PMEVTYPER<n>.RLU 控制。"
              reset_info: "冷复位；FEAT_PMUv3_EXTPMN已实现；AU；温复位；FEAT_PMUv3_EXTPMN未实现；AU"
              values:
                - value: "0b0"
                  desc: "该机制对事件过滤没有影响。"
                - value: "0b1"
                  desc: "PE不统计EL0中的事件。"
            - name: "NSK"
              bits: "29"
              source_condition: "When EL3 is implemented"
              desc: "非安全 EL1 过滤。控制非安全 EL1 中的计数事件。如果 PMEVTYPER<n>.NSK 不等于 PMEVTYPER<n>.P，则 PE 不会对非安全 EL1 中的事件进行计数。否则，此机制对非安全 EL1 中的事件过滤没有影响。"
              condition: "当实现EL3时"
              reset_info: "冷复位；FEAT_PMUv3_EXTPMN已实现；AU；温复位；FEAT_PMUv3_EXTPMN未实现；AU"
              values:
                - value: "0b0"
                  desc: "当 PMEVTYPER<n>.P == 0 时，此机制对事件过滤没有影响。当PMEVTYPER<n>.P == 1时，PE不统计非安全EL1中的事件。"
                - value: "0b1"
                  desc: "当PMEVTYPER<n>.P == 0时，PE不统计非安全EL1中的事件。当PMEVTYPER<n>.P == 1时，该机制对事件过滤没有影响。"
            - name: "RES0"
              bits: "29"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "NSU"
              bits: "28"
              source_condition: "When EL3 is implemented"
              desc: "非安全 EL0 过滤。控制非安全 EL0 中的计数事件。如果 PMEVTYPER<n>.NSU 不等于 PMEVTYPER<n>.U，则 PE 不会对非安全 EL0 中的事件进行计数。否则，此机制对非安全 EL0 中的事件过滤没有影响。"
              condition: "当实现EL3时"
              reset_info: "冷复位；FEAT_PMUv3_EXTPMN已实现；AU；温复位；FEAT_PMUv3_EXTPMN未实现；AU"
              values:
                - value: "0b0"
                  desc: "当 PMEVTYPER<n>.U == 0 时，此机制对事件过滤没有影响。当PMEVTYPER<n>.U == 1时，PE不统计非安全EL0中的事件。"
                - value: "0b1"
                  desc: "当PMEVTYPER<n>.U == 0时，PE不统计非安全EL0中的事件。当 PMEVTYPER<n>.U == 1 时，此机制对事件过滤没有影响。"
            - name: "RES0"
              bits: "28"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "NSH"
              bits: "27"
              source_condition: "When EL2 is implemented"
              desc: "EL2过滤。控制EL2中的计数事件。如果实现了EL3并且实现了FEAT_SEL2，则安全EL2中的计数事件进一步由PMEVTYPER<n>.SH控制。"
              condition: "当实现EL2时"
              reset_info: "冷复位；FEAT_PMUv3_EXTPMN已实现；AU；温复位；FEAT_PMUv3_EXTPMN未实现；AU"
              values:
                - value: "0b0"
                  desc: "PE不统计EL2中的事件。"
                - value: "0b1"
                  desc: "该机制对事件过滤没有影响。"
            - name: "RES0"
              bits: "27"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "26"
              desc: "保留，RES0。"
            - name: "MT"
              bits: "25"
              source_condition: "When FEAT_MTPMU is implemented or an IMPLEMENTATION DEFINED multi-threaded PMU extension is implemented"
              desc: "多线程。除非另有说明：\n如果当停顿条件为真并且第二个条件为真时事件对 PE 周期进行计数，则当所有这些 PE 的停顿条件为真且第二个条件对于这些 PE 中的任何一个为真时，计数器都会对处理器周期进行计数。如果事件在任何其他条件为真时对 PE 周期进行计数，则当任何这些 PE 的条件为真时，计数器会对处理器周期进行计数。否则，事件将按所有这些 PE 的计数总和进行计数。对于停顿事件，停顿条件是指STALL、STALL_FRONTEND或STALL_BACKEND事件描述的适用条件。第二个条件是除此之外的任何条件。例如，对于STALL_FRONTEND_L1I事件，停顿条件是STALL_FRONTEND，第二个条件是当第一级指令缓存中存在需求指令未命中时。对于 STALL、STALL_FRONTEND 和 STALL_BACKEND 事件本身，第二个条件是空 TRUE 条件。请参阅“多线程实现”和“多线程实现中的循环事件计数”。从 Armv8.6 开始，不允许 IMPLEMENTATION DEFINED 多线程 PMU 扩展，这意味着如果 FEAT_MTPMU 未实现，则该位域为 RES0。请参阅ID_DFR1.MTPMU。当实现并禁用 FEAT_MTPMU 时，该位域被 PE 忽略并被视为零。"
              condition: "当实现 FEAT_MTPMU 或实现 IMPLEMENTATION DEFINED 多线程 PMU 扩展时"
              reset_info: "冷复位；FEAT_PMUv3_EXTPMN已实现；AU；温复位；FEAT_PMUv3_EXTPMN未实现；AU"
              values:
                - value: "0b0"
                  desc: "仅对控制PE的事件进行计数。"
                - value: "0b1"
                  desc: "对来自与此 PE 具有相同亲和力的 1 级及以上级别的任何 PE 的事件进行计数。"
            - name: "RES0"
              bits: "25"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "24:22"
              desc: "保留，RES0。"
            - name: "RLU"
              bits: "21"
              source_condition: "When FEAT_RME is implemented"
              desc: "RealmEL0过滤。控制Realm EL0 中的计数事件。如果 PMEVTYPER<n>.RLU 不等于 PMEVTYPER<n>.U，则 PE 不会对Realm EL0 中的事件进行计数。否则，该机制对RealmEL0中的事件过滤没有影响。"
              condition: "当实现FEAT_RME时"
              reset_info: "冷复位；FEAT_PMUv3_EXTPMN已实现；AU；温复位；FEAT_PMUv3_EXTPMN未实现；AU"
              values:
                - value: "0b0"
                  desc: "当 PMEVTYPER<n>.U == 0 时，此机制对事件过滤没有影响。当PMEVTYPER<n>.U == 1时，PE不统计RealmEL0中的事件。"
                - value: "0b1"
                  desc: "当PMEVTYPER<n>.U == 0时，PE不统计RealmEL0中的事件。当 PMEVTYPER<n>.U == 1 时，此机制对事件过滤没有影响。"
            - name: "RES0"
              bits: "21"
              source_condition: "Otherwise"
