              source_condition: "When TTBCR.EAE == '1'"
              desc: "当 ESB 指令延迟虚拟 SError 异常时设置为 1。"
              condition: "当TTBCR.EAE=='1'时"
              reset_info: "温复位；AU"
            - name: "RES0"
