    - name: "Memory"
      title: "内存系统"
      access: "MRS / MSR 系统寄存器接口"
      desc: "Arm AArch32 架构系统寄存器：内存"
      registers:
        - name: "CONTEXTIDR"
          desc: "标识当前进程标识符，并且在使用短描述符转换表格式时，标识地址空间标识符。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "PROCID"
              bits: "31:8"
              source_condition: "When TTBCR.EAE == '0'；Layout: TTBCR.EAE==0"
              desc: "进程标识符。该位域必须使用标识当前进程的唯一值进行编程。"
              condition: "当TTBCR.EAE == '0'时；布局：TTBCR.EAE==0"
              reset_info: "温复位；AU"
            - name: "ASID"
              bits: "7:0"
              source_condition: "When TTBCR.EAE == '0'；Layout: TTBCR.EAE==0"
              desc: "地址空间标识符。该位域使用当前 ASID 的值进行编程。"
              condition: "当TTBCR.EAE == '0'时；布局：TTBCR.EAE==0"
              reset_info: "温复位；AU"
            - name: "PROCID"
              bits: "31:0"
              source_condition: "When TTBCR.EAE == '1'；Layout: TTBCR.EAE==1"
              desc: "进程标识符。该位域必须使用标识当前进程的唯一值进行编程。"
              condition: "当TTBCR.EAE == '1'时；布局：TTBCR.EAE==1"
              reset_info: "温复位；AU"
        - name: "DACR"
          desc: "定义十六个内存域中每个域的访问权限。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "D<n>"
              bits: "31:0"
              desc: "域 n 访问权限，其中 n = 0 到 15。允许的值为：\n值 0b10 被保留。"
              reset_info: "温复位；AU"
              values:
                - value: "0b00"
                  desc: "无法访问。对域的任何访问都会生成域故障。"
                - value: "0b01"
                  desc: "客户。根据转换表中的权限位检查访问。"
                - value: "0b11"
                  desc: "经理。不会根据转换表中的权限位检查访问。"
        - name: "HMAIR0"
          desc: "与 HMAIR1 一起，提供与长描述符格式转换表条目中可能的 AttrIndx 值相对应的内存属性编码，用于从 Hyp 模式进行内存访问的第 1 阶段转换。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "Attr<n>"
              bits: "31:0"
              source_condition: "When TTBCR.EAE == '1'；Layout: TTBCR.EAE==1"
              desc: "长描述符格式转换表条目中 AttrIndx[2:0] 条目的内存属性编码，其中：\nAttrIndx[2:0]给出Attr<n>中<n>的值。 AttrIndx[2] 定义要访问的 MAIR。 Attr7 至 Attr4 位于 MAIR1 中，Attr3 至 Attr0 位于 MAIR0 中。位[7:4]编码如下：\nAttr<n>[7:4]Meaning0b0000Device内存。有关设备内存类型，请参阅 Attr<n>[3:0] 的编码。0b00RW、RW 不是 0b00 普通内存、外部直写瞬态。0b0100 普通内存、外部不可缓存。0b01RW、RW 不是 0b00 普通内存、外部回写瞬态。0b10RW 普通存储器，外部直写式非瞬态。0b11RW 普通存储器，外部回写非瞬态。 R = 外部读取分配策略，W = 外部写入分配策略。位 [3:0] 的含义取决于位 [7:4] 的值：\nAttr<n>[3:0]Attr<n>[7:4] 为 0b0000 时的含义Attr<n>[7:4] 不为 0b00000b0000 时的含义Device-nGnRnE memoryUNPREDICTABLE0b00RW, RW 不是 0b00UNPREDICTABLENormal 内存，内部直写 Transient0b0100Device-nGnRE memoryNormal 内存，内部非 cacheable0b01RW，RW 不是 0b00UNPREDICTABLE 正常内存，内部回写 Transient0b1000Device-nGRE memoryNormal 内存，内部直写式非瞬态（RW=0b00)0b10RW，RW 不是 0b00UNPREDICTABLE 普通存储器，内部直写式非 transient0b1100Device-GRE memoryNormal 内存，内部回写式非瞬态 (RW=0b00)0b11RW，RW 不是 0b00UNPREDICTABLE 正常内存，内部回写式非瞬态 R = 内部读分配策略，W = 内部写分配策略。某些 Attr<n> 位域中的 R 和 W 位具有以下含义：\nR 或 WMeaning0b0No Allocate0b1Allocate 实现 FEAT_XS 时，阶段 1 内部回写式可缓存、外部回写式可缓存内存类型的 XS 属性设置为0。"
              condition: "当TTBCR.EAE == '1'时；布局：TTBCR.EAE==1"
              reset_info: "温复位；AU"
        - name: "HMAIR1"
          desc: "与 HMAIR0 一起，提供与长描述符格式转换表条目中可能的 AttrIndx 值相对应的内存属性编码，用于从 Hyp 模式进行内存访问的第 1 阶段转换。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "Attr<n>"
              bits: "31:0"
              source_condition: "When TTBCR.EAE == '1'；Layout: TTBCR.EAE==1"
              desc: "长描述符格式转换表条目中 AttrIndx[2:0] 条目的内存属性编码，其中：\nAttrIndx[2:0]给出Attr<n>中<n>的值。 AttrIndx[2] 定义要访问的 MAIR。 Attr7 至 Attr4 位于 MAIR1 中，Attr3 至 Attr0 位于 MAIR0 中。位[7:4]编码如下：\nAttr<n>[7:4]Meaning0b0000Device内存。有关设备内存类型，请参阅 Attr<n>[3:0] 的编码。0b00RW、RW 不是 0b00 普通内存、外部直写瞬态。0b0100 普通内存、外部不可缓存。0b01RW、RW 不是 0b00 普通内存、外部回写瞬态。0b10RW 普通存储器，外部直写式非瞬态。0b11RW 普通存储器，外部回写非瞬态。 R = 外部读取分配策略，W = 外部写入分配策略。位 [3:0] 的含义取决于位 [7:4] 的值：\nAttr<n>[3:0]Attr<n>[7:4] 为 0b0000 时的含义Attr<n>[7:4] 不为 0b00000b0000 时的含义Device-nGnRnE memoryUNPREDICTABLE0b00RW, RW 不是 0b00UNPREDICTABLENormal 内存，内部直写 Transient0b0100Device-nGnRE memoryNormal 内存，内部非 cacheable0b01RW，RW 不是 0b00UNPREDICTABLE 正常内存，内部回写 Transient0b1000Device-nGRE memoryNormal 内存，内部直写式非瞬态（RW=0b00)0b10RW，RW 不是 0b00UNPREDICTABLE 普通存储器，内部直写式非 transient0b1100Device-GRE memoryNormal 内存，内部回写式非瞬态 (RW=0b00)0b11RW，RW 不是 0b00UNPREDICTABLE 正常内存，内部回写式非瞬态 R = 内部读分配策略，W = 内部写分配策略。某些 Attr<n> 位域中的 R 和 W 位具有以下含义：\nR 或 WMeaning0b0No Allocate0b1Allocate 实现 FEAT_XS 时，阶段 1 内部回写式可缓存、外部回写式可缓存内存类型的 XS 属性设置为0。"
              condition: "当TTBCR.EAE == '1'时；布局：TTBCR.EAE==1"
              reset_info: "温复位；AU"
        - name: "HTCR"
          desc: "EL2 地址转换机制第一阶段的控制寄存器。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "RES1"
              bits: "31"
              desc: "保留，RES1。"
            - name: "IMPLEMENTATION DEFINED"
              bits: "30"
              desc: "IMPLEMENTATION DEFINED。"
              reset_info: "温复位；AU"
            - name: "RES0"
              bits: "29"
              desc: "保留，RES0。"
            - name: "HWU62"
              bits: "28"
              source_condition: "When FEAT_HPDS2 is implemented"
              desc: "硬件使用。指示第 1 阶段转换表块或页条目的位 [62] 的 IMPLEMENTATION DEFINED 硬件使用。如果HTCR.HPD的值为0，则该位域的有效值为0。"
              condition: "当实现FEAT_HPDS2时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "每个阶段 1 转换表块或页条目的位 [62] 不能被硬件用于 IMPLEMENTATION DEFINED 目的。"
                - value: "0b1"
                  desc: "如果 HTCR.HPD 的值为 1，则每个阶段 1 转换表块或页条目的位 [62] 可由硬件用于 IMPLEMENTATION DEFINED 目的。"
            - name: "RES0"
              bits: "28"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "HWU61"
              bits: "27"
              source_condition: "When FEAT_HPDS2 is implemented"
              desc: "硬件使用。指示第 1 阶段转换表块或页条目的位 [61] 的 IMPLEMENTATION DEFINED 硬件使用。如果HTCR.HPD的值为0，则该位域的有效值为0。"
              condition: "当实现FEAT_HPDS2时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "每个阶段 1 转换表块或页条目的位 [61] 不能被硬件用于 IMPLEMENTATION DEFINED 目的。"
                - value: "0b1"
                  desc: "如果 HTCR.HPD 的值为 1，则每个阶段 1 转换表块或页条目的位 [61] 可由硬件用于 IMPLEMENTATION DEFINED 目的。"
            - name: "RES0"
              bits: "27"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "HWU60"
              bits: "26"
              source_condition: "When FEAT_HPDS2 is implemented"
              desc: "硬件使用。指示第 1 阶段转换表块或页条目的位 [60] 的 IMPLEMENTATION DEFINED 硬件使用。如果HTCR.HPD的值为0，则该位域的有效值为0。"
              condition: "当实现FEAT_HPDS2时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "每个阶段 1 转换表块或页条目的位 [60] 不能被硬件用于 IMPLEMENTATION DEFINED 目的。"
                - value: "0b1"
                  desc: "如果 HTCR.HPD 的值为 1，则每个阶段 1 转换表块或页条目的位 [60] 可由硬件用于 IMPLEMENTATION DEFINED 目的。"
            - name: "RES0"
              bits: "26"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "HWU59"
              bits: "25"
              source_condition: "When FEAT_HPDS2 is implemented"
              desc: "硬件使用。指示第 1 阶段转换表块或页条目的位 [59] 的 IMPLEMENTATION DEFINED 硬件使用。如果HTCR.HPD的值为0，则该位域的有效值为0。"
              condition: "当实现FEAT_HPDS2时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "每个阶段 1 转换表块或页条目的位 [59] 不能被硬件用于 IMPLEMENTATION DEFINED 目的。"
                - value: "0b1"
                  desc: "如果 HTCR.HPD 的值为 1，则每个阶段 1 转换表块或页条目的位 [59] 可由硬件用于 IMPLEMENTATION DEFINED 目的。"
            - name: "RES0"
              bits: "25"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "HPD"
              bits: "24"
              source_condition: "When FEAT_AA32HPD is implemented"
              desc: "分级权限禁用。这会影响 PL2 地址转换机制中的分层控制位 APTable、XNTable 和 PXNTable。禁用后，权限将被视为位为零。"
              condition: "当实现 FEAT_AA32HPD 时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "分层权限已启用。"
                - value: "0b1"
                  desc: "分级权限被禁用。"
            - name: "RES0"
              bits: "24"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES1"
              bits: "23"
              desc: "保留，RES1。"
            - name: "RES0"
              bits: "22:14"
              desc: "保留，RES0。"
            - name: "SH0"
              bits: "13:12"
              desc: "使用 HTTBR 与转换表遍历关联的内存的可共享性属性。其他值保留。将此位域编程为保留值的效果是行为 CONSTRAINED UNPREDICTABLE。"
              reset_info: "温复位；AU"
              values:
                - value: "0b00"
                  desc: "不可共享。"
                - value: "0b10"
                  desc: "外部可共享。"
                - value: "0b11"
                  desc: "内部可共享。"
            - name: "ORGN0"
              bits: "11:10"
              desc: "使用 HTTBR 与转换表遍历关联的内存的外部可缓存性属性。"
              reset_info: "温复位；AU"
              values:
                - value: "0b00"
                  desc: "普通内存，外部不可缓存。"
                - value: "0b01"
                  desc: "普通内存，外部回写读分配写分配可缓存。"
                - value: "0b10"
                  desc: "普通内存，外部直写式读取分配，无写入分配可缓存。"
                - value: "0b11"
                  desc: "普通内存，外部回写读分配无写分配可缓存。"
            - name: "IRGN0"
              bits: "9:8"
              desc: "使用 HTTBR 与转换表遍历关联的内存的内部可缓存性属性。"
              reset_info: "温复位；AU"
              values:
                - value: "0b00"
                  desc: "普通内存，内部不可缓存。"
                - value: "0b01"
                  desc: "普通内存，内部回写式读分配写分配可缓存。"
                - value: "0b10"
                  desc: "普通内存，内部直写式读取分配，无写入分配可缓存。"
                - value: "0b11"
                  desc: "普通内存，内部回写式读分配，无写分配可缓存。"
            - name: "RES0"
              bits: "7:3"
              desc: "保留，RES0。"
            - name: "T0SZ"
              bits: "2:0"
              desc: "HTTBR 寻址的内存区域的大小偏移量。区域大小为 2(32-T0SZ) 字节。"
              reset_info: "温复位；AU"
        - name: "HTTBR"
          desc: "保存 EL2 地址转换机制中地址转换第一阶段初始查找的转换表基地址，以及该地址转换机制的其他信息。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "RES0"
              bits: "63:48"
              desc: "保留，RES0。"
            - name: "BADDR"
              bits: "47:1"
              desc: "转换表基地址，位[47:x]，位[x-1:1]是 RES0，附加要求是，如果位[x-1:3]不全为零，则这是一个未对齐的转换表基地址，其影响是 CONSTRAINED UNPREDICTABLE，并且必须是以下之一：\n寄存器位 [x-1:3] 被视为所有位均为零。从这些位读回的值要么是写入的值，要么是零。使用该寄存器计算转换表遍历的地址的结果可能会在那些非零位中被破坏。 x 由 HTCR.T0SZ 的值确定，如下所示：\n如果 HTCR.T0SZ 为 0 或 1，则 x = 5 - HTCR.T0SZ。如果 HTCR.T0SZ 大于 1，则 x = 14 - HTCR.T0SZ。如果转换表基地址的位[47:40]不为零，则会生成地址大小错误。"
              reset_info: "温复位；AU"
            - name: "CnP"
              bits: "0"
              source_condition: "When FEAT_TTCNP is implemented"
              desc: "共同而非私人。该位指示 HTTBR 指向的每个条目是否是可由 HTTBR.CnP 值为 1 的内部共享域中的每个 PE 使用的公共集的成员。 位在同一内部共享域中的多个 PE 上为 1，并且当为 CnP 的值为 1 的情况指定的其他条件适用时，这些 HTTBR 不指向相同的转换表条目，则转换结果为 CONSTRAINED UNPREDICTABLE，请参阅“CONSTRAINED UNPREDICTABLE 由于缓存控件或数据值而导致的行为”。"
              condition: "当实现FEAT_TTCNP时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "对于内部共享域中的其他 PE，允许 HTTBR 指向的转换表条目与 HTTBR 的相应条目不同。这不受其他 PE 上的 HTTBR.CnP 值的影响。"
                - value: "0b1"
                  desc: "HTTBR 指向的转换表条目与 HTTBR.CnP 值为 1 的内部共享域中每个其他 PE 上的 HTTBR 指向的转换表条目相同。"
            - name: "RES0"
              bits: "0"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
        - name: "MAIR0"
          desc: "与 MAIR1 一起，提供与阶段 1 转换的长描述符格式转换表条目中可能的 AttrIndx 值相对应的内存属性编码。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "Attr<n>"
              bits: "31:0"
              source_condition: "When TTBCR.EAE == '1'；Layout: TTBCR.EAE==1"
              desc: "长描述符格式转换表条目中 AttrIndx[2:0] 条目的内存属性编码，其中：\nAttrIndx[2:0]给出Attr<n>中<n>的值。 AttrIndx[2] 定义要访问的 MAIR。 Attr7 至 Attr4 位于 MAIR1 中，Attr3 至 Attr0 位于 MAIR0 中。位[7:4]编码如下：\nAttr<n>[7:4]Meaning0b0000Device内存。有关设备内存类型，请参阅 Attr<n>[3:0] 的编码。0b00RW、RW 不是 0b00 普通内存、外部直写瞬态。0b0100 普通内存、外部不可缓存。0b01RW、RW 不是 0b00 普通内存、外部回写瞬态。0b10RW 普通存储器，外部直写式非瞬态。0b11RW 普通存储器，外部回写非瞬态。 R = 外部读取分配策略，W = 外部写入分配策略。位 [3:0] 的含义取决于位 [7:4] 的值：\nAttr<n>[3:0]Attr<n>[7:4] 为 0b0000 时的含义Attr<n>[7:4] 不为 0b00000b0000 时的含义Device-nGnRnE memoryUNPREDICTABLE0b00RW, RW 不是 0b00UNPREDICTABLENormal 内存，内部直写 Transient0b0100Device-nGnRE memoryNormal 内存，内部非 cacheable0b01RW，RW 不是 0b00UNPREDICTABLE 正常内存，内部回写 Transient0b1000Device-nGRE memoryNormal 内存，内部直写式非瞬态（RW=0b00)0b10RW，RW 不是 0b00UNPREDICTABLE 普通存储器，内部直写式非 transient0b1100Device-GRE memoryNormal 内存，内部回写式非瞬态 (RW=0b00)0b11RW，RW 不是 0b00UNPREDICTABLE 正常内存，内部回写式非瞬态 R = 内部读分配策略，W = 内部写分配策略。某些 Attr<n> 位域中的 R 和 W 位具有以下含义：\nR 或 WMeaning0b0No Allocate0b1Allocate 实现 FEAT_XS 时，阶段 1 内部回写式可缓存、外部回写式可缓存内存类型的 XS 属性设置为0。"
              condition: "当TTBCR.EAE == '1'时；布局：TTBCR.EAE==1"
              reset_info: "温复位；AU"
        - name: "MAIR1"
          desc: "与 MAIR0 一起，提供与第 1 阶段转换的长描述符格式转换表条目中可能的 AttrIndx 值相对应的内存属性编码。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "Attr<n>"
              bits: "31:0"
              source_condition: "When TTBCR.EAE == '1'；Layout: TTBCR.EAE==1"
              desc: "长描述符格式转换表条目中 AttrIndx[2:0] 条目的内存属性编码，其中：\nAttrIndx[2:0]给出Attr<n>中<n>的值。 AttrIndx[2] 定义要访问的 MAIR。 Attr7 至 Attr4 位于 MAIR1 中，Attr3 至 Attr0 位于 MAIR0 中。位[7:4]编码如下：\nAttr<n>[7:4]Meaning0b0000Device内存。有关设备内存类型，请参阅 Attr<n>[3:0] 的编码。0b00RW、RW 不是 0b00 普通内存、外部直写瞬态。0b0100 普通内存、外部不可缓存。0b01RW、RW 不是 0b00 普通内存、外部回写瞬态。0b10RW 普通存储器，外部直写式非瞬态。0b11RW 普通存储器，外部回写非瞬态。 R = 外部读取分配策略，W = 外部写入分配策略。位 [3:0] 的含义取决于位 [7:4] 的值：\nAttr<n>[3:0]Attr<n>[7:4] 为 0b0000 时的含义Attr<n>[7:4] 不为 0b00000b0000 时的含义Device-nGnRnE memoryUNPREDICTABLE0b00RW, RW 不是 0b00UNPREDICTABLENormal 内存，内部直写 Transient0b0100Device-nGnRE memoryNormal 内存，内部非 cacheable0b01RW，RW 不是 0b00UNPREDICTABLE 正常内存，内部回写 Transient0b1000Device-nGRE memoryNormal 内存，内部直写式非瞬态（RW=0b00)0b10RW，RW 不是 0b00UNPREDICTABLE 普通存储器，内部直写式非 transient0b1100Device-GRE memoryNormal 内存，内部回写式非瞬态 (RW=0b00)0b11RW，RW 不是 0b00UNPREDICTABLE 正常内存，内部回写式非瞬态 R = 内部读分配策略，W = 内部写分配策略。某些 Attr<n> 位域中的 R 和 W 位具有以下含义：\nR 或 WMeaning0b0No Allocate0b1Allocate 实现 FEAT_XS 时，阶段 1 内部回写式可缓存、外部回写式可缓存内存类型的 XS 属性设置为0。"
              condition: "当TTBCR.EAE == '1'时；布局：TTBCR.EAE==1"
              reset_info: "温复位；AU"
        - name: "NMRR"
          desc: "为通过 PRRR 中的条目映射为普通内存的内存区域提供附加映射控制。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "OR<n>"
              bits: "31:16"
              source_condition: "When TTBCR.EAE == '0'；Layout: TTBCR.EAE==0"
              desc: "内存属性 n 的外部可缓存属性映射，如果该区域被 PRRR.TR<n> 条目映射为普通内存。 n 是 TEX[0]、C 和 B 位连接的值。 n = 6 的位域的含义是 IMPLEMENTATION DEFINED，可能与此处给出的含义不同。这是因为属性组合{TEX[0] = 1, C = 1, B = 0}的含义是 IMPLEMENTATION DEFINED。实现 FEAT_XS 时，第 1 阶段外部回写式可缓存内存类型的 XS 属性设置为 0。"
              condition: "当TTBCR.EAE == '0'时；布局：TTBCR.EAE==0"
              reset_info: "温复位；AU"
              values:
                - value: "0b00"
                  desc: "区域不可缓存。"
                - value: "0b01"
                  desc: "区域是写回、写分配。"
                - value: "0b10"
                  desc: "区域为直写式，无写分配。"
                - value: "0b11"
                  desc: "区域是回写的，没有写分配。"
            - name: "IR<n>"
              bits: "15:0"
              source_condition: "When TTBCR.EAE == '0'；Layout: TTBCR.EAE==0"
              desc: "内存属性 n 的内部可缓存属性映射，如果该区域被 PRRR.TR<n> 条目映射为普通内存。 n 是 TEX[0]、C 和 B 位连接的值。 n = 6 的位域的含义是 IMPLEMENTATION DEFINED，可能与此处给出的含义不同。这是因为属性组合{TEX[0] = 1, C = 1, B = 0}的含义是 IMPLEMENTATION DEFINED。实现 FEAT_XS 时，第 1 阶段内部回写式可缓存内存类型的 XS 属性设置为 0。"
              condition: "当TTBCR.EAE == '0'时；布局：TTBCR.EAE==0"
              reset_info: "温复位；AU"
              values:
                - value: "0b00"
                  desc: "区域不可缓存。"
                - value: "0b01"
                  desc: "区域是写回、写分配。"
                - value: "0b10"
                  desc: "区域为直写式，无写分配。"
                - value: "0b11"
                  desc: "区域是回写的，没有写分配。"
        - name: "PRRR"
          desc: "控制 TEX[0]、C 和 B 内存区域属性的顶级映射。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "NOS<n>"
              bits: "31:24"
              source_condition: "When TTBCR.EAE == '0'；Layout: TTBCR.EAE==0"
              desc: "不可外部共享。 NOS<n> 是内存属性 n 的外部共享属性，如果该区域映射为非内部不可缓存、外部不可缓存的普通内存，并且相应的 PRRR.{NS0, NS1} 位域标识该区域可共享。 n 是转换表描述符中的 {TEX[0], C, B} 位串联的值。除 NOS6 之外的每个 NOS<n> 位域的可能值为：\n如果该区域是以下情况，则忽略该位的值：\n设备内存 正常内存至少为以下之一：内部不可缓存、外部不可缓存。由相应的 PRRR.{NS0, NS1} 位域标识为不可共享。 NOS6 位域的含义是 IMPLEMENTATION DEFINED。"
              condition: "当TTBCR.EAE == '0'时；布局：TTBCR.EAE==0"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "内存区域是外部可共享的。"
                - value: "0b1"
                  desc: "内存区域是内部可共享的。"
            - name: "RES0"
              bits: "23:20"
              source_condition: "When TTBCR.EAE == '0'；Layout: TTBCR.EAE==0"
              desc: "保留，RES0。"
              condition: "当TTBCR.EAE == '0'时；布局：TTBCR.EAE==0"
            - name: "NS1"
              bits: "19"
              source_condition: "When TTBCR.EAE == '0'；Layout: TTBCR.EAE==0"
              desc: "普通内存区域的 S = 1 属性的映射。该位域用于确定映射到普通内存的内存区域的可共享性，并且：\n不是内部不可缓存，外部不可缓存。将转换表描述符中的 S 位设置为 1。"
              condition: "当TTBCR.EAE == '0'时；布局：TTBCR.EAE==0"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "区域不可共享。"
                - value: "0b1"
                  desc: "区域是可共享的。相应的 PRRR.NOS<n> 位域的值确定该区域是内部可共享还是外部可共享。"
            - name: "NS0"
              bits: "18"
              source_condition: "When TTBCR.EAE == '0'；Layout: TTBCR.EAE==0"
              desc: "普通内存区域的 S = 0 属性的映射。该位域用于确定映射到普通内存的内存区域的可共享性，并且：\n不是内部不可缓存，外部不可缓存。将转换表描述符中的 S 位设置为 0。"
              condition: "当TTBCR.EAE == '0'时；布局：TTBCR.EAE==0"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "区域不可共享。"
                - value: "0b1"
                  desc: "区域是可共享的。相应的 PRRR.NOS<n> 位域的值确定该区域是内部可共享还是外部可共享。"
            - name: "DS1"
              bits: "17"
              source_condition: "When TTBCR.EAE == '0'；Layout: TTBCR.EAE==0"
              desc: "设备内存的 S = 1 属性的映射。从Armv8.0开始，所有类型的Device内存都是外部共享的，因此该位为 RES1。"
              condition: "当TTBCR.EAE == '0'时；布局：TTBCR.EAE==0"
              reset_info: "温复位；AU"
            - name: "DS0"
              bits: "16"
              source_condition: "When TTBCR.EAE == '0'；Layout: TTBCR.EAE==0"
              desc: "设备内存的 S = 0 属性的映射。从Armv8.0开始，所有类型的Device内存都是外部共享的，因此该位为 RES1。"
              condition: "当TTBCR.EAE == '0'时；布局：TTBCR.EAE==0"
              reset_info: "温复位；AU"
            - name: "TR<n>"
              bits: "15:0"
              source_condition: "When TTBCR.EAE == '0'；Layout: TTBCR.EAE==0"
              desc: "TR<n> 是内存属性 n 的主要 TEX 映射，并定义具有属性 n 的区域的映射内存类型。 n 是转换表描述符中的 {TEX[0], C, B} 位串联的值。除 TR6 之外的每个位域的可能值为：\n值 0b11 被保留。将位域编程为 0b11 的效果是 CONSTRAINED UNPREDICTABLE。 TR6 位域的含义是 IMPLEMENTATION DEFINED。当实现 FEAT_XS 时，阶段 1 内部回写式可缓存、外部回写式可缓存内存类型的 XS 属性设置为 0。"
              condition: "当TTBCR.EAE == '0'时；布局：TTBCR.EAE==0"
              reset_info: "温复位；AU"
              values:
                - value: "0b00"
                  desc: "设备-nGnRnE内存"
                - value: "0b01"
                  desc: "设备-nGnRE内存"
                - value: "0b10"
                  desc: "正常记忆力"
        - name: "TTBCR"
          desc: "PL1&0 地址转换机制第一阶段的控制寄存器。其控制包括："
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "EAE"
              bits: "31"
              source_condition: "When TTBCR.EAE == '0'；Layout: AArch32-TTBCR.EAE == 0"
              desc: "扩展地址启用。"
              condition: "当TTBCR.EAE == '0'时；布局：AArch32-TTBCR.EAE == 0"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "使用具有短描述符转换表格式的 VMSAv8-32 转换系统。"
            - name: "RES0"
              bits: "30:6"
              source_condition: "When TTBCR.EAE == '0'；Layout: AArch32-TTBCR.EAE == 0"
              desc: "保留，RES0。"
              condition: "当TTBCR.EAE == '0'时；布局：AArch32-TTBCR.EAE == 0"
            - name: "PD1"
              bits: "5"
              source_condition: "When TTBCR.EAE == '0'；Layout: AArch32-TTBCR.EAE == 0"
              desc: "使用 TTBR1 禁用转换表遍历。对于使用 TTBR1 转换的地址，该位控制是否在 TLB 未命中时执行转换表遍历。"
              condition: "当TTBCR.EAE == '0'时；布局：AArch32-TTBCR.EAE == 0"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "使用 TTBR1 执行转换表遍历。"
                - value: "0b1"
                  desc: "使用 TTBR1 转换的地址上的 TLB 缺失会生成转换错误。不执行任何转换表遍历。"
            - name: "PD0"
              bits: "4"
              source_condition: "When TTBCR.EAE == '0'；Layout: AArch32-TTBCR.EAE == 0"
              desc: "使用 TTBR0 禁用转换表遍历。该位控制是否在使用 TTBR0 转换的地址的 TLB 未命中时执行转换表遍历。"
              condition: "当TTBCR.EAE == '0'时；布局：AArch32-TTBCR.EAE == 0"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "使用 TTBR0 执行转换表遍历。"
                - value: "0b1"
                  desc: "使用 TTBR0 转换的地址上的 TLB 缺失会生成转换错误。不执行任何转换表遍历。"
            - name: "RES0"
              bits: "3"
              source_condition: "When TTBCR.EAE == '0'；Layout: AArch32-TTBCR.EAE == 0"
              desc: "保留，RES0。"
              condition: "当TTBCR.EAE == '0'时；布局：AArch32-TTBCR.EAE == 0"
            - name: "N"
              bits: "2:0"
              source_condition: "When TTBCR.EAE == '0'；Layout: AArch32-TTBCR.EAE == 0"
              desc: "表示TTBR0中保存的基址的宽度。在TTBR0中，基地址位域是位[31:14-N]。 N 的值还决定：\nTTBR0 还是 TTBR1 用作转换表遍历的基地址。 TTBR0 指向的转换表的大小。 N 可以取 0 到 7 之间的任意值，即 0b000 到 0b111。当 N 的重置值为 0 时，转换表基数与 Armv5 和 Armv6 兼容。"
              condition: "当TTBCR.EAE == '0'时；布局：AArch32-TTBCR.EAE == 0"
              reset_info: "温复位；'000'"
            - name: "EAE"
              bits: "31"
              source_condition: "When TTBCR.EAE == '1'；Layout: AArch32-TTBCR.EAE==1"
              desc: "扩展地址启用。"
              condition: "当TTBCR.EAE == '1'时；布局：AArch32-TTBCR.EAE==1"
              reset_info: "温复位；'0'"
              values:
                - value: "0b1"
                  desc: "使用具有长描述符转换表格式的 VMSAv8-32 转换系统。"
            - name: "IMPLEMENTATION DEFINED"
              bits: "30"
              source_condition: "When TTBCR.EAE == '1'；Layout: AArch32-TTBCR.EAE==1"
              desc: "IMPLEMENTATION DEFINED。"
              condition: "当TTBCR.EAE == '1'时；布局：AArch32-TTBCR.EAE==1"
              reset_info: "温复位；'0'"
            - name: "SH1"
              bits: "29:28"
              source_condition: "When TTBCR.EAE == '1'；Layout: AArch32-TTBCR.EAE==1"
              desc: "使用 TTBR1 与转换表遍历关联的内存的可共享性属性。其他值保留。将此位域编程为保留值的效果是行为 CONSTRAINED UNPREDICTABLE。"
              condition: "当TTBCR.EAE == '1'时；布局：AArch32-TTBCR.EAE==1"
              reset_info: "温复位；'00'"
              values:
                - value: "0b00"
                  desc: "不可共享。"
                - value: "0b10"
                  desc: "外部可共享。"
                - value: "0b11"
                  desc: "内部可共享。"
            - name: "ORGN1"
              bits: "27:26"
              source_condition: "When TTBCR.EAE == '1'；Layout: AArch32-TTBCR.EAE==1"
              desc: "使用 TTBR1 与转换表遍历关联的内存的外部可缓存性属性。"
              condition: "当TTBCR.EAE == '1'时；布局：AArch32-TTBCR.EAE==1"
              reset_info: "温复位；'00'"
              values:
                - value: "0b00"
                  desc: "普通内存，外部不可缓存。"
                - value: "0b01"
                  desc: "普通内存，外部回写读分配写分配可缓存。"
                - value: "0b10"
                  desc: "普通内存，外部直写式读取分配，无写入分配可缓存。"
                - value: "0b11"
                  desc: "普通内存，外部回写读分配无写分配可缓存。"
            - name: "IRGN1"
              bits: "25:24"
              source_condition: "When TTBCR.EAE == '1'；Layout: AArch32-TTBCR.EAE==1"
              desc: "使用 TTBR1 与转换表遍历关联的内存的内部可缓存性属性。"
              condition: "当TTBCR.EAE == '1'时；布局：AArch32-TTBCR.EAE==1"
              reset_info: "温复位；'00'"
              values:
                - value: "0b00"
                  desc: "普通内存，内部不可缓存。"
                - value: "0b01"
                  desc: "普通内存，内部回写式读分配写分配可缓存。"
                - value: "0b10"
                  desc: "普通内存，内部直写式读取分配，无写入分配可缓存。"
                - value: "0b11"
                  desc: "普通内存，内部回写式读分配，无写分配可缓存。"
            - name: "EPD1"
              bits: "23"
              source_condition: "When TTBCR.EAE == '1'；Layout: AArch32-TTBCR.EAE==1"
              desc: "使用 TTBR1 禁用转换表遍历。对于使用 TTBR1 转换的地址，该位控制是否在 TLB 未命中时执行转换表遍历。"
              condition: "当TTBCR.EAE == '1'时；布局：AArch32-TTBCR.EAE==1"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "使用 TTBR1 执行转换表遍历。"
                - value: "0b1"
                  desc: "使用 TTBR1 转换的地址上的 TLB 缺失会生成转换错误。不执行任何转换表遍历。"
            - name: "A1"
              bits: "22"
              source_condition: "When TTBCR.EAE == '1'；Layout: AArch32-TTBCR.EAE==1"
              desc: "选择 TTBR0 或 TTBR1 定义 ASID。"
              condition: "当TTBCR.EAE == '1'时；布局：AArch32-TTBCR.EAE==1"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "TTBR0.ASID 定义 ASID。"
                - value: "0b1"
                  desc: "TTBR1.ASID 定义 ASID。"
            - name: "RES0"
              bits: "21:19"
              source_condition: "When TTBCR.EAE == '1'；Layout: AArch32-TTBCR.EAE==1"
              desc: "保留，RES0。"
              condition: "当TTBCR.EAE == '1'时；布局：AArch32-TTBCR.EAE==1"
            - name: "T1SZ"
              bits: "18:16"
              source_condition: "When TTBCR.EAE == '1'；Layout: AArch32-TTBCR.EAE==1"
