              condition: "当TTBCR.EAE=='0'时"
            - name: "AET"
              bits: "15:14"
              source_condition: "When TTBCR.EAE == '0'"
              desc: "从 VDFSR.AET 复制的值。"
              condition: "当TTBCR.EAE=='0'时"
