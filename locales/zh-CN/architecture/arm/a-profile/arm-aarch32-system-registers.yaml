translations:
  sensor: "Arm AArch32 系统寄存器"
  family: "A-profile 架构"
  pages:
    - name: "AMU"
      title: "活动监视单元（AMU）"
      access: "MRS / MSR 系统寄存器接口"
      desc: "Arm AArch32 架构系统寄存器：AMU"
      registers:
        - name: "AMCFGR"
          desc: "活动监视器的全局配置寄存器。"
          condition: "当实现 FEAT_AMUv1 且实现 FEAT_AA32 时"
          fields:
            - name: "NCG"
              bits: "31:28"
              desc: "定义所实现的计数器组的数量，减一。所有其他值均被保留。"
              values:
                - value: "0b0000"
                  desc: "实现了一个计数器。"
                - value: "0b0001"
                  desc: "实现了两个计数器。"
            - name: "RES0"
              bits: "27:25"
              desc: "保留，RES0。"
            - name: "HDBG"
              bits: "24"
              desc: "支持调试时暂停。必须支持此功能，因此该位为 1。"
              values:
                - value: "0b0"
                  desc: "AMCR.HDBG 是 RES0。"
                - value: "0b1"
                  desc: "AMCR.HDBG 是读/写的。"
            - name: "RAZ"
              bits: "23:14"
              desc: "保留，RAZ。"
            - name: "SIZE"
              bits: "13:8"
              desc: "定义活动监视器事件计数器的大小，减一。计数器是64 位的，因此该位域的值为0b111111。软件使用该位域来确定内存映射中计数器的间距。计数器位于双字对齐的地址。读作 0b111111。"
            - name: "N"
              bits: "7:0"
              desc: "定义在所有组中实现的活动监视器事件计数器的数量。比 AMCGCR.CG1NC 和 AMCGCR.CG0NC 之和少 1。该位域的值是 IMPLEMENTATION DEFINED。"
        - name: "AMCGCR"
          desc: "提供有关每个计数器组内实现的活动监视器事件计数器数量的信息。"
          condition: "当实现 FEAT_AMUv1 且实现 FEAT_AA32 时"
          fields:
            - name: "RES0"
              bits: "31:16"
              desc: "保留，RES0。"
            - name: "CG1NC"
              bits: "15:8"
              desc: "计数器组 1 计数器数量。辅助计数器组中已实现计数器的最高索引加一。零表示辅助计数器组中没有计数器。在包括 FEAT_AMUv1 的实现中，允许的值范围是 0 到 16。如果实现 FEAT_AMUv1p1，则 AMCG1IDR_EL0 进一步定义实现哪些辅助计数器，并且辅助计数器组中的计数器可能被非连续索引。该位域的值是 IMPLEMENTATION DEFINED。"
            - name: "CG0NC"
              bits: "7:0"
              desc: "计数器组 0 计数器的数量。架构计数器组中的计数器数量。读作 0x04。"
        - name: "AMCNTENCLR0"
          desc: "禁用架构活动监视器事件计数器 AMEVCNTR0<n> 的控制位。"
          condition: "当实现 FEAT_AMUv1 且实现 FEAT_AA32 时"
          fields:
            - name: "RES0"
              bits: "31:16"
              desc: "保留，RES0。"
            - name: "RAZ/WI"
              bits: "15:4"
              desc: "保留，RAZ/WI。该位域保留用于其他架构的活动监视器事件计数器，Arm 可能会在活动监视器架构的未来版本中定义这些计数器。"
            - name: "P<n>"
              bits: "3:0"
              desc: "AMEVCNTR0<n> 的活动监视器事件计数器禁用位。 AMCGCR.CG0NC 标识架构活动监视器事件计数器的数量。在包括 FEAT_AMUv1 的实现中，架构活动监视器事件计数器的数量为 4。每个位的可能值为："
              values:
                - value: "0b0"
                  desc: "读取时，表示 AMEVCNTR0<n> 已禁用。写入后，没有任何效果。"
                - value: "0b1"
                  desc: "读取时，表示 AMEVCNTR0<n> 已启用。写入时，禁用 AMEVCNTR0<n>。"
        - name: "AMCNTENCLR1"
          desc: "禁用辅助活动监视器事件计数器 AMEVCNTR1<n> 的控制位。"
          condition: "当实现 FEAT_AMUv1 且实现 FEAT_AA32 时"
          fields:
            - name: "RES0"
              bits: "31:16"
              desc: "保留，RES0。"
            - name: "P<n>"
              bits: "15:0"
              desc: "AMEVCNTR1<n> 的活动监视器事件计数器禁用位。每个位的可能值为："
              values:
                - value: "0b0"
                  desc: "读取时，表示 AMEVCNTR1<n> 已禁用。写入后，没有任何效果。"
                - value: "0b1"
                  desc: "读取时，表示 AMEVCNTR1<n> 已启用。写入时，禁用 AMEVCNTR1<n>。"
        - name: "AMCNTENSET0"
          desc: "使能架构活动监视器事件计数器 AMEVCNTR0<n> 的控制位。"
          condition: "当实现 FEAT_AMUv1 且实现 FEAT_AA32 时"
          fields:
            - name: "RES0"
              bits: "31:16"
              desc: "保留，RES0。"
            - name: "RAZ/WI"
              bits: "15:4"
              desc: "保留，RAZ/WI。该位域保留用于其他架构的活动监视器事件计数器，Arm 可能会在活动监视器架构的未来版本中定义这些计数器。"
            - name: "P<n>"
              bits: "3:0"
              desc: "AMEVCNTR0<n> 的活动监视器事件计数器使能位。 AMCGCR.CG0NC 标识架构活动监视器事件计数器的数量。在包括 FEAT_AMUv1 的实现中，架构活动监视器事件计数器的数量为 4。每个位的可能值为："
              values:
                - value: "0b0"
                  desc: "读取时，表示 AMEVCNTR0<n> 已禁用。写入后，没有任何效果。"
                - value: "0b1"
                  desc: "读取时，表示 AMEVCNTR0<n> 已启用。写入时，使能 AMEVCNTR0<n>。"
        - name: "AMCNTENSET1"
          desc: "使能辅助活动监视器事件计数器的控制位 AMEVCNTR1<n>。"
          condition: "当实现 FEAT_AMUv1 且实现 FEAT_AA32 时"
          fields:
            - name: "RES0"
              bits: "31:16"
              desc: "保留，RES0。"
            - name: "P<n>"
              bits: "15:0"
              desc: "AMEVCNTR1<n> 的活动监视器事件计数器使能位。每个位的可能值为："
              values:
                - value: "0b0"
                  desc: "读取时，表示 AMEVCNTR1<n> 已禁用。写入后，没有任何效果。"
                - value: "0b1"
                  desc: "读取时，表示 AMEVCNTR1<n> 已启用。写入时，使能 AMEVCNTR1<n>。"
        - name: "AMCR"
          desc: "活动监视器实现的全局控制寄存器。 AMCR既适用于架构计数器组，也适用于辅助计数器组。"
          condition: "当实现 FEAT_AMUv1 且实现 FEAT_AA32 时"
          fields:
            - name: "RES0"
              bits: "31:18"
              desc: "保留，RES0。"
            - name: "CG1RZ"
              bits: "17"
              source_condition: "When FEAT_AMUv1p1 is implemented"
              desc: "计数器组 1 读零。从内存映射视图中读取数据不受此位域的影响。"
              condition: "当实现FEAT_AMUv1p1时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "AMEVCNTR1<n> 的系统寄存器读取返回所有已实现和启用的异常级别的事件计数。"
                - value: "0b1"
                  desc: "如果当前异常级别是最高实现的异常级别，则读取 AMEVCNTR1<n> 的系统寄存器将返回事件计数。否则，读取 AMEVCNTR1<n> 将返回零值。"
            - name: "RES0"
              bits: "17"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "16:11"
              desc: "保留，RES0。"
            - name: "HDBG"
              bits: "10"
              desc: "该位控制当 PE 在调试状态下停止时是否停止活动监视器计数。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "当 PE 在调试状态下停止时，活动监视器不会停止计数。"
                - value: "0b1"
                  desc: "当 PE 在调试状态下停止时，活动监视器停止计数。"
            - name: "RES0"
              bits: "9:0"
              desc: "保留，RES0。"
        - name: "AMEVCNTR0<n>"
          desc: "提供对架构活动监视器事件计数器的访问。"
          condition: "当实现 FEAT_AMUv1 且实现 FEAT_AA32 时"
          fields:
            - name: "ACNT"
              bits: "63:0"
              desc: "架构活动监视器事件计数器架构活动监视器事件计数器 n 的值，其中 n 是该寄存器的编号，是 0 到 3 之间的数字。如果实现 FEAT_AMUv1p1，则 HCR_EL2.AMVOFFEN 为 1，SCR_EL3.AMVOFFEN 为 1，则 HCR_EL2.{E2H, TGE} 的有效值不{1, 1} 和 EL2 使用 AArch64 并在当前安全状态下实现，对 EL0 或 EL1 处的这些寄存器的访问返回（PCount<63:0> - AMEVCNTVOFF0<n>_EL2<63:0>）。 PCount 是从 EL2 或 EL3 读取 AMEVCNTR0<n> 时返回的物理计数。如果计数器使能，写入该寄存器会得到 UNPREDICTABLE 结果。"
        - name: "AMEVCNTR1<n>"
          desc: "提供对辅助活动监视器事件计数器的访问。"
          condition: "当实现 FEAT_AMUv1 且实现 FEAT_AA32 时"
          fields:
            - name: "ACNT"
              bits: "63:0"
              desc: "辅助活动监视器事件计数器辅助活动监视器事件计数器 n 的值，其中 n 是该寄存器的编号，为 0 到 15 之间的数字。如果实现 FEAT_AMUv1p1，则 HCR_EL2.AMVOFFEN 为 1，SCR_EL3.AMVOFFEN 为 1，则 HCR_EL2.{E2H, TGE} 的有效值不{1, 1}，EL2 使用 AArch64 并在当前安全状态下实现，且 AMCR_EL0.CG1RZ 为 0，在 EL0 或 EL1 处读取这些寄存器返回（PCount<63:0> - AMEVCNTVOFF1<n>_EL2<63:0>）。 PCount 是从 EL2 或 EL3 读取 AMEVCNTR1<n> 时返回的物理计数。如果计数器使能，写入该寄存器会得到 UNPREDICTABLE 结果。"
        - name: "AMEVTYPER0<n>"
          desc: "提供有关架构活动监视器事件计数器 AMEVCNTR0<n> 计数的事件的信息。"
          condition: "当实现 FEAT_AMUv1 且实现 FEAT_AA32 时"
          fields:
            - name: "RES0"
              bits: "31:16"
              desc: "保留，RES0。"
            - name: "evtCount"
              bits: "15:0"
              desc: "要计数的事件。由架构活动监视器事件计数器 AMEVCNTR0<n> 计数的事件的事件号。该位域的值是每个架构计数器的架构强制规定的。下表显示了所需事件编号和相应计数器之间的映射："
              values:
                - value: "0x0011"
                  source_condition: "When n == 0"
                  desc: "处理器频率周期。"
                  condition: "当 n == 0 时"
                - value: "0x4004"
                  source_condition: "When n == 1"
                  desc: "恒定频率循环。"
                  condition: "当 n == 1 时"
                - value: "0x0008"
                  source_condition: "When n == 2"
                  desc: "指令已退役。"
                  condition: "当 n == 2 时"
                - value: "0x4005"
                  source_condition: "When n == 3"
                  desc: "内存停顿周期。"
                  condition: "当 n == 3 时"
        - name: "AMEVTYPER1<n>"
          desc: "提供有关辅助活动监视器事件计数器 AMEVCNTR1<n> 计数的事件的信息。"
          condition: "当实现 FEAT_AMUv1 且实现 FEAT_AA32 时"
          fields:
            - name: "RES0"
              bits: "31:16"
              desc: "保留，RES0。"
            - name: "evtCount"
              bits: "15:0"
              desc: "要计数的事件。由辅助活动监视器事件计数器 AMEVCNTR1<n> 计数的事件的事件号。 IMPLEMENTATION DEFINED 每个计数器支持哪些值。如果软件向该位域写入相应计数器 AMEVCNTR1<n> 不支持的值，则：\n被统计的事件是 UNPREDICTABLE。读回的值为 UNKNOWN。 AMEVCNTR1<n> 计数的事件可能在实现时固定。在这种情况下，该位域是只读的，写入的是UNDEFINED。如果相应的计数器 AMEVCNTR1<n> 被使能，写入该寄存器将得到 UNPREDICTABLE 结果。"
              reset_info: "温复位；AU"
        - name: "AMUSERENR"
          desc: "活动监视器的全局用户启用寄存器。启用或禁用 EL0 对活动监视器的访问。 AMUSERENR既适用于架构计数器组，也适用于辅助计数器组。"
          condition: "当实现 FEAT_AMUv1 且实现 FEAT_AA32 时"
          fields:
            - name: "RES0"
              bits: "31:1"
              desc: "保留，RES0。"
            - name: "EN"
              bits: "0"
              desc: "陷阱 EL0 对 EL1 的活动监视器寄存器的访问。 AMUSERENR 始终可以在 EL0 处读取，并且不受该位控制。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "EL0 对活动监视器寄存器的访问陷入 EL1。"
                - value: "0b1"
                  desc: "该控制不会导致任何指令被捕获。软件可以访问 EL0 处的所有活动监视器寄存器。"
    - name: "Debug"
      title: "调试"
      access: "MRS / MSR 系统寄存器接口"
      desc: "Arm AArch32 架构系统寄存器：调试"
      registers:
        - name: "DBGAUTHSTATUS"
          desc: "提供有关 IMPLEMENTATION DEFINED 身份验证接口的状态信息以进行调试。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:8"
              desc: "保留，RES0。"
            - name: "SNID"
              bits: "7:6"
              source_condition: "When FEAT_Debugv8p4 is implemented"
              desc: "安全的非侵入式调试。该位域的值与 DBGAUTHSTATUS.SID 相同。"
              condition: "当实现FEAT_Debugv8p4时"
            - name: "SNID"
              bits: "7:6"
              source_condition: "Otherwise"
              desc: "安全的非侵入式调试。所有其他值均被保留。"
              condition: "否则"
              values:
                - value: "0b00"
                  desc: "安全状态未实现。"
                - value: "0b10"
                  desc: "已实现并已禁用。 ExternalSecureNoninvasiveDebugEnabled() == FALSE。"
                - value: "0b11"
                  desc: "已实现并启用。 ExternalSecureNoninvasiveDebugEnabled() == TRUE。"
            - name: "SID"
              bits: "5:4"
              desc: "安全侵入式调试。所有其他值均被保留。"
              values:
                - value: "0b00"
                  desc: "安全状态未实现。"
                - value: "0b10"
                  desc: "已实现并已禁用。 ExternalSecureInvasiveDebugEnabled() == FALSE。"
                - value: "0b11"
                  desc: "已实现并启用。 ExternalSecureInvasiveDebugEnabled() == TRUE。"
            - name: "NSNID"
              bits: "3:2"
              source_condition: "When FEAT_Debugv8p4 is implemented"
              desc: "非安全非侵入式调试。所有其他值均被保留。"
              condition: "当实现FEAT_Debugv8p4时"
              values:
                - value: "0b00"
                  desc: "未实现非安全状态。"
                - value: "0b11"
                  desc: "已实现并启用。 EL3 被执行或 SCR.NS 的有效值为 1。"
            - name: "NSNID"
              bits: "3:2"
              source_condition: "Otherwise"
              desc: "非安全非侵入式调试。所有其他值均被保留。"
              condition: "否则"
              values:
                - value: "0b00"
                  desc: "未实现非安全状态。"
                - value: "0b10"
                  desc: "已实现并已禁用。 ExternalNoninvasiveDebugEnabled() == FALSE。"
                - value: "0b11"
                  desc: "已实现并启用。 ExternalNoninvasiveDebugEnabled() == TRUE。"
            - name: "NSID"
              bits: "1:0"
              desc: "非安全侵入式调试。所有其他值均被保留。"
              values:
                - value: "0b00"
                  desc: "未实现非安全状态。"
                - value: "0b10"
                  desc: "已实现并已禁用。 ExternalInvasiveDebugEnabled() == FALSE."
                - value: "0b11"
                  desc: "已实现并启用。 ExternalInvasiveDebugEnabled() == TRUE."
        - name: "DBGBCR<n>"
          desc: "保存断点的控制信息。与值寄存器 DBGBVR<n> 一起形成断点 n。如果实现了 EL2 并且该断点支持上下文匹配，则 DBGBVR<n> 可以与断点扩展值寄存器 DBGBXVR<n> 关联以进行 VMID 匹配。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:24"
              desc: "保留，RES0。"
            - name: "BT"
              bits: "23:20"
              desc: "断点类型。可能的值为：\n有关断点及其约束的详细信息，请参阅“断点异常”和“保留的 DBGBCR<n>.BT 值”。"
              reset_info: "冷复位；AU"
              values:
                - value: "0b0000"
                  desc: "未链接的指令地址匹配。 DBGBVR<n>是指令的地址。"
                - value: "0b0001"
                  desc: "作为 0b0000，但链接到上下文匹配断点。"
                - value: "0b0010"
                  desc: "Unlinked Context ID match.如果HCR_EL2.E2H的有效值为1，并且PE在EL0执行且HCR_EL2.TGE设置为1，或者PE在EL2执行，则DBGBVR<n>.ContextID 与 CONTEXTIDR_EL2 进行比较。否则，将 DBGBVR<n>.ContextID 与 CONTEXTIDR 进行比较。"
                - value: "0b0011"
                  desc: "作为启用链接的 0b0010。"
                - value: "0b0100"
                  desc: "未链接的指令地址不匹配。 DBGBVR<n>是要步进的指令的地址。"
                - value: "0b0101"
                  desc: "作为 0b0100，但链接到上下文匹配断点。"
                - value: "0b0110"
                  desc: "取消链接的 CONTEXTIDR 匹配。 DBGBVR<n>.ContextID 是与 CONTEXTIDR 相比的上下文 ID。"
                - value: "0b0111"
                  desc: "作为启用链接的 0b0110。"
                - value: "0b1000"
                  desc: "取消链接的 VMID 匹配。 DBGBXVR<n>.VMID 是与 VTTBR.VMID 相比的 VMID。"
                - value: "0b1001"
                  desc: "作为启用链接的 0b1000。"
                - value: "0b1010"
                  desc: "未链接的 VMID 和上下文 ID 匹配。 DBGBVR<n>.ContextID 是与 CONTEXTIDR 相比的上下文 ID，而 DBGBXVR<n>.VMID 是与 VMID 相比VTTBR.VMID。"
                - value: "0b1011"
                  desc: "作为启用链接的 0b1010。"
                - value: "0b1100"
                  desc: "取消链接的 CONTEXTIDR_EL2 匹配。 DBGBXVR<n>.ContextID2 是与 CONTEXTIDR_EL2 相比的上下文 ID。"
                - value: "0b1101"
                  desc: "作为启用链接的 0b1100。"
                - value: "0b1110"
                  desc: "未链接的完整上下文 ID 匹配。 DBGBVR<n>.ContextID 与 CONTEXTIDR 进行比较，而 DBGBXVR<n>.ContextID2 与 CONTEXTIDR_EL2 进行比较。"
                - value: "0b1111"
                  desc: "作为启用链接的 0b1110。"
            - name: "LBN"
              bits: "19:16"
              desc: "链接断点编号。对于链接地址匹配断点，这指定链接到的上下文匹配断点的索引。对于所有其他断点类型，该位域将被忽略，并且寄存器的读取将返回 UNKNOWN 值。当DBGBCR<n>.E的值为0时，该位域被忽略。"
              reset_info: "冷复位；AU"
            - name: "SSC"
              bits: "15:14"
              desc: "安全状态控制。确定生成断点 n 的断点调试事件的安全状态。该位域必须与 HMC 和 PMC 位域一起解释，并且对 {HMC、SSC、PMC} 位域的允许值有限制。有关详细信息，请参阅“断点生成断点异常的执行条件”和“保留的 DBGBCR<n>.{SSC、HMC、PMC} 值”。"
              reset_info: "冷复位；AU"
            - name: "HMC"
              bits: "13"
              desc: "更高的模式控制。确定调试视角，以决定何时生成断点 n 的断点调试事件。该位域必须与 SSC 和 PMC 位域一起解释，并且对 {HMC、SSC、PMC} 位域的允许值有限制。有关更多信息，请参阅 SSC 位 [15:14] 描述。有关 SSC、HMC 和 PMC 位域操作的更多信息，请参阅“断点产生断点异常的执行条件”。"
              reset_info: "冷复位；AU"
            - name: "RES0"
              bits: "12:9"
              desc: "保留，RES0。"
            - name: "BAS"
              bits: "8:5"
              desc: "字节地址选择。定义地址匹配断点匹配哪些半字，无论指令集和执行状态如何。允许的值取决于断点类型。对于地址匹配断点，允许的值为：\nBASMatch 指令 atConstraint 用于 debuggers0b0011DBGBVR<n>用于 T32 instructions0b1100DBGBVR<n>+2 用于 T32 instructions0b1111DBGBVR<n>用于 A32 指令 所有其他值被保留。有关详细信息，请参阅“保留的 DBGBCR<n>.BAS 值”。有关在地址匹配断点中使用 BAS 位域的详细信息，请参阅“在地址匹配断点中使用 BAS 位域”。对于 AArch32 第 1 阶段地址转换机制中的地址不匹配断点，允许的值为：\nBASStep 指令 atConstraint 用于 debuggers0b0000 - 用于在任何地方进行匹配 breakpoint0b0011DBGBVR<n>用于 T32 instructions0b1100DBGBVR<n>+2用于 T32 instructions0b1111DBGBVR<n>用于A32指令 所有其他值均保留。有关详细信息，请参阅“保留的 DBGBCR<n>.BAS 值”。有关在地址不匹配断点中使用 BAS 位域的详细信息，请参阅“在地址匹配断点中使用 BAS 位域”。对于上下文匹配断点，此位域为 RES1 并被忽略。"
              reset_info: "冷复位；AU"
            - name: "RES0"
              bits: "4:3"
              desc: "保留，RES0。"
            - name: "PMC"
              bits: "2:1"
              desc: "特权模式控制。确定生成断点 n 的断点调试事件的异常级别。该位域必须与 SSC 和 HMC 位域一起解释，并且对 {HMC、SSC、PMC} 位域的允许值有限制。有关详细信息，请参阅 DBGBCR<n>.SSC 说明。有关 SSC、HMC 和 PMC 位域操作的更多信息，请参阅“断点产生断点异常的执行条件”。"
              reset_info: "冷复位；AU"
            - name: "E"
              bits: "0"
              desc: "启用断点 DBGBVR<n>。可能的值为："
              reset_info: "冷复位；AU"
              values:
                - value: "0b0"
                  desc: "断点已禁用。"
                - value: "0b1"
                  desc: "已启用断点。"
        - name: "DBGBVR<n>"
          desc: "保存用于断点匹配的值，可以是指令的虚拟地址，也可以是上下文 ID。与控制寄存器DBGBCR<n>一起形成断点n。如果实现了 EL2 并且该断点支持上下文匹配，则 DBGBVR<n> 可以与断点扩展值寄存器 DBGBXVR<n> 关联以进行 VMID 匹配。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "VA[31:2]"
              bits: "31:2"
              source_condition: "When DBGBCR<n>.BT IN {'0x0x'}；Layout: DBGBCR<n>.BT==0b0x0x"
              desc: "用于比较的地址值的位[31:2]。"
              condition: "当DBGBCR<n>.BT IN {'0x0x'}时；布局：DBGBCR<n>.BT==0b0x0x"
              reset_info: "冷复位；AU"
            - name: "RES0"
              bits: "1:0"
              source_condition: "When DBGBCR<n>.BT IN {'0x0x'}；Layout: DBGBCR<n>.BT==0b0x0x"
              desc: "保留，RES0。"
              condition: "当DBGBCR<n>.BT IN {'0x0x'}时；布局：DBGBCR<n>.BT==0b0x0x"
            - name: "ContextID"
              bits: "31:0"
              source_condition: "When DBGBCR<n>.BT IN {'001x'}；Layout: DBGBCR<n>.BT==0b001x"
              desc: "用于比较的上下文 ID 值。当满足以下所有条件时，将该值与 CONTEXTIDR_EL2 进行比较：\nHCR_EL2.{E2H,TGE}的有效值为{1, 1}。 PE 正在 EL0 执行。否则，将该值与 CONTEXTIDR 进行比较。"
              condition: "当DBGBCR<n>.BT IN {'001x'}时；布局：DBGBCR<n>.BT==0b001x"
              reset_info: "冷复位；AU"
            - name: "ContextID"
              bits: "31:0"
              source_condition: "When DBGBCR<n>.BT IN {'101x'} and EL2 is implemented；Layout: DBGBCR<n>.BT==0b101x and EL2 is implemented"
              desc: "用于与 CONTEXTIDR 进行比较的上下文 ID 值。"
              condition: "当实现 DBGBCR<n>.BT IN {'101x'} 和 EL2 时；布局：DBGBCR<n>.BT==0b101x 和EL2已实现"
              reset_info: "冷复位；AU"
            - name: "ContextID"
              bits: "31:0"
              source_condition: "When DBGBCR<n>.BT IN {'x11x'}, EL2 is implemented, and FEAT_Debugv8p1 is implemented；Layout: DBGBCR<n>.BT==0bx11x, EL2 is implemented, and FEAT_Debugv8p1 is implemented"
              desc: "用于与 CONTEXTIDR 进行比较的上下文 ID 值。"
              condition: "当DBGBCR<n>.BT IN {'x11x'}时，实现了EL2，并且实现了FEAT_Debugv8p1；布局： DBGBCR<n>.BT==0bx11x，实现了EL2，实现了FEAT_Debugv8p1"
              reset_info: "冷复位；AU"
        - name: "DBGBXVR<n>"
          desc: "保存一个用于断点匹配的值，以支持 VMID 匹配。与控制寄存器DBGBCR<n>和值寄存器DBGBVR<n>结合使用，其中实现EL2，断点n支持上下文匹配。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:16"
              source_condition: "When DBGBCR<n>.BT IN {'10xx'} and EL2 is implemented；Layout: DBGBCR<n>.BT==0b10xx and EL2 is implemented"
              desc: "保留，RES0。"
              condition: "当实现 DBGBCR<n>.BT IN {'10xx'} 和 EL2 时；布局：DBGBCR<n>.BT==0b10xx 和EL2已实现"
            - name: "VMID[15:8]"
              bits: "15:8"
              source_condition: "When DBGBCR<n>.BT IN {'10xx'} and EL2 is implemented；Layout: DBGBCR<n>.BT==0b10xx and EL2 is implemented；When FEAT_VMID16 is implemented and VTCR_EL2.VS == '1'"
              desc: "扩展至VMID[7:0]。欲了解更多信息，请参阅VMID[7:0]。"
              condition: "当实现 DBGBCR<n>.BT IN {'10xx'} 和 EL2 时；布局：DBGBCR<n>.BT==0b10xx 和EL2被实现；当FEAT_VMID16被实现且VTCR_EL2.VS == '1'时"
              reset_info: "冷复位；AU"
            - name: "RES0"
              bits: "15:8"
              source_condition: "When DBGBCR<n>.BT IN {'10xx'} and EL2 is implemented；Layout: DBGBCR<n>.BT==0b10xx and EL2 is implemented；Otherwise"
              desc: "保留，RES0。"
              condition: "当实现 DBGBCR<n>.BT IN {'10xx'} 和 EL2 时；布局：DBGBCR<n>.BT==0b10xx 和EL2已实现；否则"
            - name: "VMID[7:0]"
              bits: "7:0"
              source_condition: "When DBGBCR<n>.BT IN {'10xx'} and EL2 is implemented；Layout: DBGBCR<n>.BT==0b10xx and EL2 is implemented"
              desc: "VMID 值进行比较。当满足以下任一条件时，VMID 为 8 位：\nEL2 正在使用 AArch32。 VTCR_EL2.VS 为 0。FEAT_VMID16 未实现。"
              condition: "当实现 DBGBCR<n>.BT IN {'10xx'} 和 EL2 时；布局：DBGBCR<n>.BT==0b10xx 和EL2已实现"
              reset_info: "冷复位；AU"
            - name: "ContextID2"
              bits: "31:0"
              source_condition: "When DBGBCR<n>.BT IN {'11xx'} and EL2 is implemented；Layout: DBGBCR<n>.BT==0b11xx and EL2 is implemented；When FEAT_Debugv8p1 is implemented"
              desc: "用于与 CONTEXTIDR_EL2 进行比较的上下文 ID 值。"
              condition: "当实现 DBGBCR<n>.BT IN {'11xx'} 和 EL2 时；布局：DBGBCR<n>.BT==0b11xx 和EL2被实现；当FEAT_Debugv8p1被实现时"
              reset_info: "冷复位；AU"
            - name: "RES0"
              bits: "31:0"
              source_condition: "When DBGBCR<n>.BT IN {'11xx'} and EL2 is implemented；Layout: DBGBCR<n>.BT==0b11xx and EL2 is implemented；Otherwise"
              desc: "保留，RES0。"
              condition: "当实现 DBGBCR<n>.BT IN {'11xx'} 和 EL2 时；布局：DBGBCR<n>.BT==0b11xx 和EL2已实现；否则"
        - name: "DBGCLAIMCLR"
          desc: "由软件用来读取CLAIM标签位的值，并将CLAIM标签位清0。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RAZ/WI"
              bits: "31:8"
              desc: "保留，RAZ/WI。"
            - name: "CLAIM<m>"
              bits: "7:0"
              desc: "索赔标签清晰。指示声明标签位<m>的当前状态，用于将声明标签位<m>清除为0。"
              reset_info: "冷复位；'0'"
              values:
                - value: "0b0"
                  desc: "读取时：声明标签位 <m> 未设置。写入时：忽略。"
                - value: "0b1"
                  desc: "读取时：声明标签位 <m> 被设置。写入时：将声明标记位 <m> 清除为 0。"
        - name: "DBGCLAIMSET"
          desc: "由软件用来将 CLAIM 标记位设置为 1。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RAZ/WI"
              bits: "31:8"
              desc: "保留，RAZ/WI。"
            - name: "CLAIM<m>"
              bits: "7:0"
              desc: "声明标签集。用于将声明标签位 <m> 设置为 1。"
              values:
                - value: "0b0"
                  desc: "写入时：忽略。"
                - value: "0b1"
                  desc: "写入时：将声明标签位 <m> 设置为 1。"
        - name: "DBGDCCINT"
          desc: "允许根据 DCC 状态标志发出中断请求信号。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31"
              desc: "保留，RES0。"
            - name: "RX"
              bits: "30"
              desc: "DCC对DTRRX的中断请求使能控制。允许根据 DCC 状态标志发出通用 COMMIRQ 中断请求信号。如果实现了传统的 COMMRX 和 COMMTX 信号，则这些信号不受该位值的影响。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "DTRRX没有产生中断请求。"
                - value: "0b1"
                  desc: "中断请求将在 RXfull == 1 时生成。"
            - name: "TX"
              bits: "29"
              desc: "DCC对DTRTX的中断请求使能控制。允许根据 DCC 状态标志发出通用 COMMIRQ 中断请求信号。如果实现了传统的 COMMRX 和 COMMTX 信号，则这些信号不受该位值的影响。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "DTRTX没有产生中断请求。"
                - value: "0b1"
                  desc: "中断请求将在 TXfull == 0 时生成。"
            - name: "RES0"
              bits: "28:0"
              desc: "保留，RES0。"
        - name: "DBGDEVID2"
          desc: "保留用于将来描述调试实现的功能。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:0"
              desc: "保留，RES0。"
        - name: "DBGDRAR"
          desc: "定义4KB对齐的内存映射调试组件的基物理地址，通常是一个ROM表，用于定位和描述系统中的内存映射调试组件。不推荐使用该寄存器。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "RES0"
              bits: "63:48"
              desc: "保留，RES0。"
            - name: "ROMADDR[47:12]"
              bits: "47:12"
              desc: "ROM表物理地址的位[47:12]。如果物理地址大小（以位为单位）（PAsize）小于 48，则对应于 ROMADDR [47:PAsize] 的寄存器位为 RES0。 ROM表物理地址的位[11:0]为零。 Arm 强烈建议在实现仅支持在 AArch32 状态下执行的任何系统中，将位 ROMADDR[(PAsize-1):32] 设置为零。如果DBGDRAR.Valid == 0b00，则该位域为 UNKNOWN。在包括EL3的实现中，ROMADDR是非安全存储器中的地址。 IMPLEMENTATION DEFINED ROM 表是否也可以在安全内存中访问。"
            - name: "RES0"
              bits: "11:2"
              desc: "保留，RES0。"
            - name: "Valid"
              bits: "1:0"
              desc: "该位域指示ROM表地址是否有效。其他值保留。 Arm 建议实现将此位域设置为零。"
              values:
                - value: "0b00"
                  desc: "ROM 表地址无效。软件必须忽略 ROMADDR。"
                - value: "0b11"
                  desc: "ROM 表地址有效。"
        - name: "DBGDSAR"
          desc: "在 Arm 架构的早期版本中，该寄存器定义了 PE 的调试寄存器的物理基地址与 DBGDRAR 中定义的基地址的偏移量。不推荐使用该寄存器。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "RES0"
              bits: "63:2"
              desc: "保留，RES0。"
            - name: "RAZ"
              bits: "1:0"
              desc: "保留，RAZ。该位域指示调试自地址偏移是否有效。对于ARMv8，该位域始终为0b00，偏移量无效。"
        - name: "DBGDSCRext"
          desc: "用于调试实现的主控制寄存器。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "TFO"
              bits: "31"
              source_condition: "When FEAT_TRF is implemented"
              desc: "跟踪过滤器覆盖。用于保存/恢复EDSCR.TFO。当OS锁解锁时，DBGOSLSR.OSLK == 0，软件必须将此位视为UNK/SBZP。当OS锁被锁定时，DBGOSLSR.OSLK == 1，该位保存EDSCR.TFO的值。对该位的读写是对EDSCR.TFO的间接访问。"
              condition: "当实现FEAT_TRF时"
              reset_info: "冷复位；'0'"
            - name: "RES0"
              bits: "31"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RXfull"
              bits: "30"
              desc: "DTRRX已满。用于保存/恢复EDSCR.RXfull。当DBGOSLSR.OSLK == 0时，软件必须将该位视为UNK/SBZP。当DBGOSLSR.OSLK == 1时，该位​​保存EDSCR.RXfull的值。对该位的读写是对EDSCR.RXfull的间接访问。 Arm 不建议使用该位，除非用于保存/恢复。使用 DBGDSCRint 访问 DTRRX 完整状态。"
              reset_info: "冷复位；'0'"
            - name: "TXfull"
              bits: "29"
              desc: "DTRTX已满。用于保存/恢复EDSCR.TXfull。当DBGOSLSR.OSLK == 0时，软件必须将该位视为UNK/SBZP。当DBGOSLSR.OSLK == 1时，该位​​保存EDSCR.TXfull的值。对该位的读写是对EDSCR.TXfull的间接访问。 Arm 不建议使用该位，除非用于保存/恢复。使用 DBGDSCRint 访问 DTRTX 完整状态。"
              reset_info: "冷复位；'0'"
            - name: "RES0"
              bits: "28"
              desc: "保留，RES0。"
            - name: "RXO"
              bits: "27"
              desc: "用于保存/恢复EDSCR.RXO。当DBGOSLSR.OSLK == 0时，软件必须将该位视为UNK/SBZP。当DBGOSLSR.OSLK == 1时，该位​​保存EDSCR.RXO的值。对该位的读写是对EDSCR.RXO的间接访问。当DBGOSLSR.OSLK == 1时，如果写入DBGDSCRext的值的位[27,6]为{1,0}，即RXO位为1，ERR位为0，则PE置位EDSCR。{RXO，ERR} 到 UNKNOWN 值。"
              reset_info: "冷复位；'0'"
            - name: "TXU"
              bits: "26"
              desc: "用于保存/恢复EDSCR.TXU。当DBGOSLSR.OSLK == 0时，软件必须将该位视为UNK/SBZP。当DBGOSLSR.OSLK == 1时，该位​​保存EDSCR.TXU的值。对该位的读写是对EDSCR.TXU的间接访问。当DBGOSLSR.OSLK == 1时，如果写入DBGDSCRext的值的位[26,6]为{1,0}，即TXU位为1，ERR位为0，则PE置位EDSCR。{TXU，ERR} 到 UNKNOWN 值。"
              reset_info: "冷复位；'0'"
            - name: "RES0"
              bits: "25:24"
              desc: "保留，RES0。"
            - name: "INTdis"
              bits: "23:22"
              desc: "用于保存/恢复EDSCR.INTdis。当DBGOSLSR.OSLK == 0时，软件必须将其视为UNK/SBZP。当DBGOSLSR.OSLK == 1时，该位域保存EDSCR.INTdis的值。该位域的读写都是对EDSCR.INTdis的间接访问。"
              reset_info: "冷复位；'00'"
            - name: "TDA"
              bits: "21"
              desc: "用于保存/恢复EDSCR.TDA。当DBGOSLSR.OSLK == 0时，软件必须将该位视为UNK/SBZP。当DBGOSLSR.OSLK == 1时，该位​​保存EDSCR.TDA的值。对该位的读写是对EDSCR.TDA的间接访问。"
              reset_info: "冷复位；'0'"
            - name: "RES0"
              bits: "20"
              desc: "保留，RES0。"
            - name: "SC2"
              bits: "19"
              source_condition: "When FEAT_PCSRv8 is implemented, FEAT_VHE is implemented, and FEAT_PCSRv8p2 is not implemented"
              desc: "用于保存/恢复EDSCR.SC2。当DBGOSLSR.OSLK == 0时，软件必须将该位视为UNK/SBZP。当DBGOSLSR.OSLK == 1时，该位​​保存EDSCR.SC2的值。对该位的读写是对EDSCR.SC2的间接访问。"
              condition: "当实现FEAT_PCSRv8时，实现FEAT_VHE，不实现FEAT_PCSRv8p2"
              reset_info: "冷复位；'0'"
            - name: "RES0"
              bits: "19"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "NS"
              bits: "18"
              desc: "非安全状态。 Arm 不赞成使用该位域。"
              values:
                - value: "0b0"
                  desc: "安全状态。"
                - value: "0b1"
                  desc: "非安全状态。"
            - name: "SPNIDdis"
              bits: "17"
              source_condition: "When EL3 is implemented"
              desc: "安全特权分析禁用状态位。如果满足以下任一条件，则该位域读取为 0，否则读取为 1：\nFEAT_Debugv8p2 未实现，ExternalSecureNoninvasiveDebugEnabled() 返回 TRUE。 EL3 正在使用 AArch32，SDCR.SPME 的值为 1。EL3 正在使用 AArch64，MDCR_EL3.SPME 的值为 1。Arm 不建议使用此位域。"
              condition: "当实现EL3时"
              values:
                - value: "0b0"
                  desc: "安全特权模式下允许进行分析。"
                - value: "0b1"
                  desc: "安全特权模式下禁止进行分析。"
            - name: "RES0"
              bits: "17"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "SPIDdis"
              bits: "16"
              source_condition: "When EL3 is implemented"
              desc: "安全特权 AArch32 侵入式自托管调试禁用状态位。该位的值取决于SDCR.SPD的值和伪代码函数AArch32.SelfHostedSecurePrivilegedInvasiveDebugEnabled()。如果以下任一条件为真，则该位读为 1，否则读为 0：\nEL3 正在使用 AArch32，且 SDCR.SPD 的值为 0b10。 EL3 正在使用 AArch64，且 MDCR_EL3.SPD32 的值为 0b10。 EL3 正在使用 AArch32，SDCR.SPD 的值为 0b00，并且 AArch32.SelfHostedSecurePrivilegedInvasiveDebugEnabled() 返回 FALSE。 EL3 正在使用 AArch64，MDCR_EL3.SPD32 的值为 0b00，而 AArch32.SelfHostedSecurePrivilegedInvasiveDebugEnabled() 返回 FALSE。 Arm 不赞成使用该位域。"
              condition: "当实现EL3时"
              values:
                - value: "0b0"
                  desc: "在安全特权 AArch32 模式下启用自托管调试。"
                - value: "0b1"
                  desc: "在安全特权 AArch32 模式下禁用自托管调试。"
            - name: "RES0"
              bits: "16"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "MDBGen"
              bits: "15"
              desc: "启用监视调试事件。启用断点、观察点和向量捕获异常。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "禁用断点、观察点和向量捕获异常。"
                - value: "0b1"
                  desc: "启用断点、观察点和向量捕获异常。"
            - name: "HDE"
              bits: "14"
              desc: "用于保存/恢复EDSCR.HDE。当DBGOSLSR.OSLK == 0时，软件必须将该位视为UNK/SBZP。当DBGOSLSR.OSLK == 1时，该位​​保存EDSCR.HDE的值。对该位的读写是对EDSCR.HDE的间接访问。"
              reset_info: "冷复位；'0'"
            - name: "RES0"
              bits: "13"
              desc: "保留，RES0。"
            - name: "UDCCdis"
              bits: "12"
              desc: "陷阱 EL0 对 DCC 寄存器的访问为未定义模式。对这些寄存器的所有访问都会被捕获，包括对 DBGDTRTXint 和 DBGDTRRXint 的 LDC 和 STC 访问，以及对 DBGDSAR 和 DBGDRAR 的 MRRC 访问。在调试状态下，EL0 访问 DBGDTRRXint 和 DBGDTRTXint 的陷阱将被忽略。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "EL0 访问 DBGDSCRint、DBGDTRRXint、DBGDTRTXint、DBGDIDR、DBGDSAR 和 DBGDRAR 被捕获为未定义模式。"
            - name: "RES0"
              bits: "11:7"
              desc: "保留，RES0。"
            - name: "ERR"
              bits: "6"
              desc: "用于保存/恢复EDSCR.ERR。当DBGOSLSR.OSLK == 0时，软件必须将该位视为UNK/SBZP。当DBGOSLSR.OSLK == 1时，该位​​保存EDSCR.ERR的值。对该位的读写是对EDSCR.ERR的间接访问。"
              reset_info: "冷复位；'0'"
            - name: "MOE"
              bits: "5:2"
              desc: "调试异常的入口方法。当使用 AArch32 将调试异常置于异常级别时，该位域将设置为指示导致异常的事件："
              reset_info: "温复位；AU"
              values:
                - value: "0b0001"
                  desc: "断点。"
                - value: "0b0011"
                  desc: "软件断点（BKPT）指令。"
                - value: "0b0101"
                  desc: "矢量捕捉。"
                - value: "0b1010"
                  desc: "观察点。"
            - name: "RES0"
              bits: "1:0"
              desc: "保留，RES0。"
        - name: "DBGDSCRint"
          desc: "用于调试实现的主控制寄存器。这是一个内部只读视图。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "RES0"
              bits: "31"
              desc: "保留，RES0。"
            - name: "RXfull"
              bits: "30"
              desc: "DTRRX已满。 EDSCR 中等效位的只读视图。"
            - name: "TXfull"
              bits: "29"
              desc: "DTRTX已满。 EDSCR 中等效位的只读视图。"
            - name: "RES0"
              bits: "28:19"
              desc: "保留，RES0。"
            - name: "NS"
              bits: "18"
              desc: "非安全状态。 DBGDSCRext 中等效位的只读视图。 Arm 不赞成使用该位域。"
            - name: "SPNIDdis"
              bits: "17"
              desc: "安全特权非侵入式调试禁用。 DBGDSCRext 中等效位的只读视图。 Arm 不赞成使用该位域。"
            - name: "SPIDdis"
              bits: "16"
              desc: "安全特权侵入式调试禁用。 DBGDSCRext 中等效位的只读视图。 Arm 不赞成使用该位域。"
            - name: "MDBGen"
              bits: "15"
              desc: "启用监视调试事件。 DBGDSCRext 中等效位的只读视图。"
            - name: "RES0"
              bits: "14:13"
              desc: "保留，RES0。"
            - name: "UDCCdis"
              bits: "12"
              desc: "用户模式对调试通信通道的访问禁用。 DBGDSCRext 中等效位的只读视图。 Arm 不赞成使用该位域。"
            - name: "RES0"
              bits: "11:6"
              desc: "保留，RES0。"
            - name: "MOE"
              bits: "5:2"
              desc: "调试异常的入口方法。当使用 AArch32 将调试异常置于异常级别时，该位域将设置为指示导致异常的事件：\nDBGDSCRext 中等效位的只读视图。"
              values:
                - value: "0b0001"
                  desc: "断点"
                - value: "0b0011"
                  desc: "软件断点（BKPT）指令"
                - value: "0b0101"
                  desc: "矢量捕捉"
                - value: "0b1010"
                  desc: "观察点"
            - name: "RES0"
              bits: "1:0"
              desc: "保留，RES0。"
        - name: "DBGDTRRXext"
          desc: "用于保存/恢复 DBGDTRRXint。它是调试通信通道的一个组件。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "DTRRX"
              bits: "31:0"
              desc: "更新 DTRRX，无副作用 更新 DTRRX，无副作用。写入该寄存器会更新 DTRRX 中的值，并且不会更改 RXfull。读取该寄存器将返回写入 DTRRX 的最后一个值，并且不会更改 RXfull。有关调试通信通道的完整行为，请参阅“调试通信通道和指令传输寄存器”。"
              reset_info: "温复位；AU"
        - name: "DBGDTRRXint"
          desc: "将数据从外部调试器传输到 PE。例如，调试器使用它向调试目标传输命令和数据。有关其他架构映射，请参阅 DBGDTR_EL0。它是调试通信通道的一个组件。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "DTRRX"
              bits: "31:0"
              desc: "更新DTRRX 更新DTRRX。读取该寄存器：\n如果 RXfull 为 1，则返回最后写入到 DTRRX 的值。如果 RXfull 为 0，则返回 UNKNOWN 值。读取后，RXfull 被清除为 0。有关调试通信通道的完整行为，请参阅“调试通信通道和指令传输寄存器”。"
              reset_info: "冷复位；AU"
        - name: "DBGDTRTXext"
          desc: "用于保存/恢复 DBGDTRTXint。它是调试通信通道的一个组件。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "DTRTX"
              bits: "31:0"
              desc: "返回 DTRTX，无副作用 返回 DTRTX，无副作用。读取该寄存器将返回 DTRTX 中的值，并且不会更改 TXfull。写入该寄存器会更新 DTRTX 中的值，但不会更改 TXfull。有关调试通信通道的完整行为，请参阅“调试通信通道和指令传输寄存器”。"
              reset_info: "冷复位；AU"
        - name: "DBGDTRTXint"
          desc: "将数据从 PE 传输到外部调试器。例如，调试目标使用它来将数据传输到调试器。有关其他架构映射，请参阅 DBGDTR_EL0。它是调试通信通道的一个组件。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "DTRTX"
              bits: "31:0"
              desc: "返回 DTRTX DTRTX。写入该寄存器：\n如果 TXfull 为 1，则 DTRTX 设置为 UNKNOWN 值。如果TXfull为0，则更新DTRTX中的值。写入后，TXfull 设置为 1。有关调试通信通道的完整行为，请参阅“调试通信通道和指令传输寄存器”。"
              reset_info: "冷复位；AU"
        - name: "DBGOSDLR"
          desc: "锁定外部调试接口。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:1"
              desc: "保留，RES0。"
            - name: "DLK"
              bits: "0"
              source_condition: "When FEAT_DoubleLock is implemented"
              desc: "OS 双锁控制位。"
              condition: "当实现FEAT_DoubleLock时"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "OS 双锁已解锁。"
                - value: "0b1"
                  desc: "OS 双锁锁定，如果 DBGPRCR.CORENPDRQ（内核无断电请求）位设置为 0 并且 PE 处于非调试状态。"
            - name: "RAZ/WI"
              bits: "0"
              source_condition: "Otherwise"
              desc: "保留，RAZ/WI。"
              condition: "否则"
        - name: "DBGOSECCR"
          desc: "为操作系统提供一种机制来访问软件不可见的 EDECCR 的内容，因此它可以代表外部调试器在断电时保存/恢复 EDECCR 的内容。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "EDECCR"
              bits: "31:0"
              source_condition: "When DBGOSLSR.OSLK == '1'；Layout: DBGOSLSR.OSLK==1"
              desc: "用于断电时保存/恢复到EDECCR。对该位域的读取或写入是对EDECCR的间接访问。"
              condition: "当DBGOSLSR.OSLK == '1'时；布局：DBGOSLSR.OSLK==1"
              reset_info: "冷复位；0x00"
        - name: "DBGOSLAR"
          desc: "为调试寄存器提供锁。 OS 锁还会禁用一些调试异常和调试事件。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "OSLA"
              bits: "31:0"
              desc: "OS 锁定访问。将值 0xC5ACCE55 写入 DBGOSLAR 会将 OS 锁定设置为 1。写入任何其他值会将 OS 锁定设置为 0。使用 DBGOSLSR.OSLK 检查锁定的当前状态。"
        - name: "DBGOSLSR"
          desc: "提供 OS 锁的状态信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:4"
              desc: "保留，RES0。"
            - name: "OSLM"
              bits: "3,0"
              desc: "已实现 OS 锁模型。标识所实现的 OS 保存和恢复机制的形式。所有其他值均被保留。在 Armv8 实现中，不允许使用值 0b00。 OSLM位域拆分如下：\nOSLM[1]为DBGOSLSR[3]。 OSLM[0]为DBGOSLSR[0]。"
              values:
                - value: "0b00"
                  desc: "OS 锁定未实现。"
                - value: "0b10"
                  desc: "OS 已实现锁定。"
            - name: "nTT"
              bits: "2"
              desc: "不是 32 位访问。该位始终为 RAZ。它表示需要 32 位访问才能将密钥写入 OS 锁定访问寄存器。该位域的值是 IMPLEMENTATION DEFINED。"
            - name: "OSLK"
              bits: "1"
              desc: "OS 锁定状态。通过写入 OS 锁访问寄存器来锁定和解锁 OS 锁。"
              reset_info: "冷复位；'1'"
              values:
                - value: "0b0"
                  desc: "OS 锁已解锁。"
                - value: "0b1"
                  desc: "OS 锁已锁定。"
        - name: "DBGPRCR"
          desc: "控制 PE 在断电请求时的行为。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:1"
              desc: "保留，RES0。"
            - name: "CORENPDRQ"
              bits: "0"
              source_condition: "When FEAT_DoPD is implemented"
              desc: "核心没有断电请求。请求模拟掉电。该请求通常被传递到外部电源控制器。这意味着请求是否导致上电取决于系统的 IMPLEMENTATION DEFINED 性质。当该位为 1 时，电源控制器不得允许内核电源域关闭。在包含推荐的外部调试接口的实现中，该位驱动 DBGNOPWRDWN 信号。 IMPLEMENTATION DEFINED 在从 IMPLEMENTATION DEFINED 软件可见保留状态退出时是否将该位复位为冷复位值。有关保留状态的更多信息，请参阅“核心电源域电源状态”。 IMPLEMENTATION DEFINED 认证接口不禁止写入该位。这意味着无论是否允许侵入式调试，调试器都可以请求模拟掉电。"
              condition: "当实现FEAT_DoPD时"
              reset_info: "冷复位时，如果实现了加电请求并且已断言加电请求，则该位域设置为 IMPLEMENTATION DEFINED 选择 0 或 1。如果未断言加电请求，则该位域设置为 0。"
              values:
                - value: "0b0"
                  desc: "如果系统响应断电请求，则会关闭核心电源域。"
                - value: "0b1"
                  desc: "如果系统响应断电请求，它不会对核心电源域断电，而是模拟该域的断电。"
            - name: "CORENPDRQ"
              bits: "0"
              source_condition: "Otherwise"
              desc: "核心没有断电请求。请求模拟掉电。该请求通常被传递到外部电源控制器。这意味着请求是否导致上电取决于系统的 IMPLEMENTATION DEFINED 性质。当该位为 1 时，电源控制器不得允许内核电源域关闭。在包含推荐的外部调试接口的实现中，该位驱动 DBGNOPWRDWN 信号。从 IMPLEMENTATION DEFINED 软件可见保留状态退出时，该位是否复位为 EDPRCR.COREPURQ 的值是 IMPLEMENTATION DEFINED。有关保留状态的更多信息，请参阅“核心电源域电源状态”。 IMPLEMENTATION DEFINED 认证接口不禁止写入该位。这意味着无论是否允许侵入式调试，调试器都可以请求模拟掉电。"
              condition: "否则"
              reset_info: "冷复位；其他位域扩展：EDPRCR.COREPURQ"
              values:
                - value: "0b0"
                  desc: "如果系统响应断电请求，则会关闭核心电源域。"
                - value: "0b1"
                  desc: "如果系统响应断电请求，它不会对核心电源域断电，而是模拟该域的断电。"
        - name: "DBGVCR"
          desc: "控制 Vector Catch 调试事件。"
