              desc: "预取中止向量捕获在监控模式下启用。异常向量偏移量为0x0C。"
              condition: "当实现 EL3 且 EL3 使用 AArch32 时；布局：实现 EL3 并使用 AArch32"
              reset_info: "温复位；AU"
            - name: "MS"
              bits: "10"
              source_condition: "When EL3 is implemented and EL3 is using AArch32；Layout: EL3 is implemented and using AArch32"
              desc: "安全监控呼叫 (SMC) 在监控模式下启用矢量捕获。异常向量偏移量为0x08。"
              condition: "当实现 EL3 且 EL3 使用 AArch32 时；布局：实现 EL3 并使用 AArch32"
              reset_info: "温复位；AU"
