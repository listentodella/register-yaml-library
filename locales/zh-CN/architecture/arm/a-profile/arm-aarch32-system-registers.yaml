            - name: "AET"
              bits: "15:14"
              desc: "当使用 AArch32 对 EL1 产生虚拟 SError 异常时，DFSR[15:14] 设置为 VDFSR.AET。当虚拟 SError 异常被 ESB 指令延迟时，VDISR[15:14] 设置为 VDFSR.AET。"
