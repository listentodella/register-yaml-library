              condition: "当TTBCR.EAE == '0'时；布局：AArch32-TTBCR.EAE==0"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "内存是不可共享的。"
                - value: "0b1"
                  desc: "内存是可共享的。 TTBR1.NOS位域指示存储器是内部可共享的还是外部可共享的。"
            - name: "RES0"
              bits: "63:56"
              source_condition: "When TTBCR.EAE == '1'；Layout: AArch32-TTBCR.EAE==1"
              desc: "保留，RES0。"
              condition: "当TTBCR.EAE == '1'时；布局：AArch32-TTBCR.EAE==1"
            - name: "ASID"
              bits: "55:48"
              source_condition: "When TTBCR.EAE == '1'；Layout: AArch32-TTBCR.EAE==1"
              desc: "转换表基地址的 ASID。 TTBCR.A1 位域选择 TTBR0.ASID 或 TTBR1.ASID。"
              condition: "当TTBCR.EAE == '1'时；布局：AArch32-TTBCR.EAE==1"
              reset_info: "温复位；AU"
            - name: "BADDR"
              bits: "47:1"
              source_condition: "When TTBCR.EAE == '1'；Layout: AArch32-TTBCR.EAE==1"
              desc: "转换表基地址，位[47:x]，位[x-1:1]是 RES0，附加要求是，如果位[x-1:3]不全为零，则这是一个未对齐的转换表基地址，其影响是 CONSTRAINED UNPREDICTABLE，并且必须是以下之一：\n寄存器位 [x-1:3] 被视为所有位均为零。从这些位读回的值要么是写入的值，要么是零。使用该寄存器计算转换表遍历的地址的结果可能会在那些非零位中被破坏。 x 由 TTBCR.T1SZ 的值确定，如下所示：\n如果 TTBCR.T1SZ 为 0 或 1，则 x = 5 - TTBCR.T1SZ。如果 TTBCR.T1SZ 大于 1，则 x = 14 - TTBCR.T1SZ。如果转换表基地址的位[47:40]不为零，则会生成地址大小错误。"
              condition: "当TTBCR.EAE == '1'时；布局：AArch32-TTBCR.EAE==1"
              reset_info: "温复位；AU"
            - name: "CnP"
              bits: "0"
              source_condition: "When TTBCR.EAE == '1'；Layout: AArch32-TTBCR.EAE==1；When FEAT_TTCNP is implemented"
              desc: "共同而非私人。当 TTBCR.EAE ==1 时，该位指示 TTBR1 指向的每个条目是否是可由 [TTBR1.CnP 的值] 的内部共享域中的每个 PE 使用的公共集的成员 为 1。当 TLB 将阶段 1 转换和阶段 2 转换的条目合并为单个条目时，如果阶段 1 和阶段 2 的 CnP 位的值为 1，则该条目只能在不同 PE 之间共享。如果 [TTBR1.CnP 的值] 位在同一内部共享域中的多个 PE 上为 1，并且当为 CnP 的值为 1 的情况指定的其他条件适用时，这些 TTBR1s 不指向相同的转换表条目，则转换结果为 CONSTRAINED UNPREDICTABLE，请参阅“CONSTRAINED UNPREDICTABLE 由于缓存控件或数据值而导致的行为”。"
              condition: "当TTBCR.EAE == '1'时；布局：AArch32-TTBCR.EAE==1；当FEAT_TTCNP实现时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "对于当前 ASID，TTBR1 实例指向的转换表条目允许与内部可共享域中其他 PE 的 TTBR1 实例的对应条目不同。这不受以下因素影响：\n这些其他 PE 上的 TTBR1.CnP 的值。这些其他 PE 上的 TTBCR.EAE 的值。当前 ASID 的值，或者对于 TTBR1 的非安全实例，当前 VMID 的值。"
                - value: "0b1"
                  desc: "此 TTBR1 实例指向的转换表条目与内部可共享域中每个其他 PE 的转换表条目相同，对于此 TTBR1 实例，TTBR1.CnP 的值为 1，并且所有以下适用：\nTTBR1 的这个实例指向转换表条目。适用的TTBCR.EAE位域的值为1。ASID与当前的ASID相同。对于 TTBR1 的非安全实例，VMID 与当前 VMID 相同。"
