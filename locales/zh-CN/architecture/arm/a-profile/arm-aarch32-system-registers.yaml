              desc: "保留，RES0。"
        - name: "DBGWVR<n>"
          desc: "保存用于观察点匹配的数据地址值。与控制寄存器 DBGWCR<n> 一起构成观察点 n。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "VA"
              bits: "31:2"
              desc: "用于比较的地址值的位[31:2]。 Arm 不赞成设置 DBGWVR<n>[2] == 1。"
              reset_info: "冷复位；AU"
            - name: "RES0"
              bits: "1:0"
              desc: "保留，RES0。"
        - name: "TRFCR"
          desc: "为 Trace 提供 EL1 控件。"
          condition: "当实现 FEAT_AA32EL1 且实现 FEAT_TRF 时"
          fields:
            - name: "RES0"
              bits: "31:7"
              desc: "保留，RES0。"
            - name: "TS"
              bits: "6:5"
              desc: "时间戳控制。控制用于跟踪时间戳的时基。所有其他值均被保留。当以下任一情况为真时，PE 会忽略该位域：\nEL2 已实现且 HTRFCR.TS != 0b00。 SelfHostedTraceEnabled() == FALSE。"
              reset_info: "温复位；AU"
              values:
                - value: "0b01"
                  desc: "虚拟时间戳。跟踪的时间戳是物理计数器值减去 CNTVOFF 的值。"
                - value: "0b10"
                  source_condition: "When FEAT_ECV is implemented"
                  desc: "访客物理时间戳。跟踪的时间戳是物理计数器值减去物理偏移量。如果满足以下任一条件，则物理偏移量为零，否则物理偏移量为 CNTPOFF_EL2 的值：\nEL3 已实现并使用 AArch32。 EL3 已实现，使用 AArch64，SCR_EL3.ECVEn 为 0。EL2 正在使用 AArch32。 EL2 使用 AArch64，CNTHCTL_EL2.ECV 为 0。FEAT_ECV_POFF 未实现。"
                  condition: "当实现FEAT_ECV时"
                - value: "0b11"
                  desc: "物理时间戳。跟踪的时间戳是物理计数器值。"
            - name: "RES0"
              bits: "4:2"
              desc: "保留，RES0。"
            - name: "E1TRE"
              bits: "1"
              desc: "EL1 跟踪启用。如果 SelfHostedTraceEnabled() == FALSE，则忽略该位域。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "PL1 模式下禁止跟踪。"
                - value: "0b1"
                  desc: "PL1 模式下允许跟踪。"
            - name: "E0TRE"
              bits: "0"
              desc: "EL0 跟踪启用。如果满足以下任一条件，则忽略此位域：\nSelfHostedTraceEnabled() == FALSE。 EL2 在当前安全状态下实现并启用，且 HCR.TGE == 1。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "EL0 禁止跟踪。"
                - value: "0b1"
                  desc: "EL0 允许跟踪。"
    - name: "Exception"
      title: "异常"
      access: "MRS / MSR 系统寄存器接口"
      desc: "Arm AArch32 架构系统寄存器：异常"
      registers:
        - name: "DFAR"
          desc: "保存导致同步数据中止异常的故障地址的虚拟地址。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "VA"
              bits: "31:0"
              desc: "同步数据中止异常的故障地址 VA 同步数据中止异常的故障地址 VA。"
              reset_info: "温复位；AU"
        - name: "DFSR"
          desc: "保存有关上次数据故障的状态信息。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:17"
              source_condition: "When TTBCR.EAE == '0'；Layout: TTBCR.EAE==0"
              desc: "保留，RES0。"
              condition: "当TTBCR.EAE == '0'时；布局：TTBCR.EAE==0"
            - name: "FnV"
