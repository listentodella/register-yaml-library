              condition: "否则"
            - name: "evtCount[9:0]"
              bits: "9:0"
              desc: "要计数的事件。由事件计数器PMEVCNTR<n>计数的事件的事件号。分配给每种事件类型的事件编号范围显示在“PMU事件编号空间的分配”中。如果 FEAT_PMUv3p8 已实现，并且 PMEVTYPER<n>.evtCount 被编程为保留的或 PE 不支持的事件，则不会对任何事件进行计数，并且返回的值是直接或外部读取PMEVTYPER<n>.evtCount 位域是写入该位域的值。 Arm 建议 FEAT_PMUv3.Otherwise 的所有实现都采用此行为，如果 PMEVTYPER<n>.evtCount 被编程为 PE 保留或不支持的事件，则该行为取决于写入的值：\n对于 0x0000 到 0x003F 范围，不会对任何事件进行计数，直接或外部读取 PMEVTYPER<n>.evtCount 位域返回的值是写入该位域的值。如果实现 FEAT_PMUv3p1，则对于 0x4000 至 0x403F 范围，不会对任何事件进行计数，直接或外部读取 PMEVTYPER<n>.evtCount 位域返回的值是写入该位域的值。对于其他值，UNPREDICTABLE 对什么事件（如果有）进行计数，并且直接或外部读取 PMEVTYPER<n>.evtCount 位域返回的值是 UNKNOWN。 UNPREDICTABLE 表示该事件不得泄露特权信息。"
