              desc: "陷阱ID寄存器。陷阱EL0对公共事件识别寄存器的读访问。受此控制影响的寄存器访问是：\nMRC 读取 PMCEID0、PMCEID1、PMCEID2 和 PMCEID3。当被捕获时，读取是UNDEFINED。"
