              bits: "4:0"
              desc: "事件计数器选择。选择后续访问 PMXEVTYPER 和 PMXEVCNTR 时访问的计数器。有关事件计数器访问结果的更多信息，包括当 PMSELR.SEL 设置为未实现或不可访问的事件计数器的索引时，请参阅 PMXEVTYPER 和 PMXEVCNTR。"
              reset_info: "温复位；AU"
              values:
                - value: "0b00000..0b11110"
                  desc: "选择事件计数器 PMEVCNTR<n>，其中 n 是该位域的值：\nPMXEVTYPER 的 MRC 和 MCR 访问 PMEVTYPER<n>。 PMXEVCNTR 的 MRC 和 MCR 访问 PMEVCNTR<n>。"
                - value: "0b11111"
                  desc: "选择周期计数器，PMCCNTR：\nPMXEVTYPER 的 MRC 和 MCR 访问 PMCCFILTR。 PMXEVCNTR 的 MRC 和 MCR 是 CONSTRAINED UNPREDICTABLE。有关详细信息，请参阅PMXEVCNTR。"
