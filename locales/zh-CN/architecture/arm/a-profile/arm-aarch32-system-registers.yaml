              desc: "故障状态位。位 [10] 和 [3:0] 一起解释。所有其他值均被保留。有关与故障关联的查找级别的更多信息，请参阅“与短描述符转换表查找上的 MMU 故障关联的级别”。 FS位域拆分如下：\nFS[4]为IFSR[10]。 FS[3:0]是IFSR[3:0]。"
              condition: "当TTBCR.EAE == '0'时；布局：TTBCR.EAE==0"
              reset_info: "温复位；AU"
              values:
                - value: "0b00001"
                  desc: "PC 对准故障。"
                - value: "0b00010"
                  desc: "调试异常。"
                - value: "0b00011"
