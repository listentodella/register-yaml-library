        - name: "DBGWCR<n>"
          desc: "保存观察点的控制信息。与值寄存器 DBGWVR<n> 一起构成观察点 n。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:29"
              desc: "保留，RES0。"
            - name: "MASK"
              bits: "28:24"
              desc: "地址掩码。使用单个遮罩只能观看最大 2GB 的对象。所有其他值均被保留。表示掩码地址位的数量，从 0b00011 掩码 3 个地址位（0x00000007 地址掩码）到 0b11111 掩码 31 个地址位（0x7FFFFFFF 地址掩码）。如果使用保留值进行编程，则观察点的行为就像：\nDBGWCR<n>.MASK 已使用定义的值进行编程，该值可能为 0（无掩码），而不是直接读取 DBGWCR<n>。观察点已禁用。"
              reset_info: "冷复位；AU"
              values:
                - value: "0b00000"
                  desc: "没有面具。"
                - value: "0b00011..0b11111"
                  desc: "屏蔽的地址位数。"
            - name: "RES0"
              bits: "23:21"
              desc: "保留，RES0。"
            - name: "WT"
              bits: "20"
              desc: "观察点类型。可能的值为："
              reset_info: "冷复位；AU"
              values:
                - value: "0b0"
                  desc: "未链接的数据地址匹配。"
                - value: "0b1"
                  desc: "链接数据地址匹配。"
            - name: "LBN"
              bits: "19:16"
              desc: "链接断点编号。对于链接数据地址观察点，这指定链接到的上下文匹配断点的索引。"
              reset_info: "冷复位；AU"
            - name: "SSC"
              bits: "15:14"
              desc: "安全状态控制。确定生成观察点 n 的观察点调试事件的安全状态。该位域必须与 HMC 和 PAC 位域一起解释。有关详细信息，请参阅“观察点生成观察点异常的执行条件”和“保留的 DBGWCR<n>.{SSC、HMC、PAC} 值”。"
              reset_info: "冷复位；AU"
            - name: "HMC"
              bits: "13"
              desc: "更高的模式控制。确定调试视角，以决定何时生成观察点 n 的观察点调试事件。该位域必须与 SSC 和 PAC 位域一起解释。有关 SSC、HMC 和 PAC 位域操作的更多信息，请参阅“观察点生成观察点异常的执行条件”。"
              reset_info: "冷复位；AU"
            - name: "BAS"
              bits: "12:5"
              desc: "字节地址选择。该位域的每一位选择是否监视由 DBGWVR<n> 寻址的字或双字内的字节。 DBGWVR<n>处的 BASDescription0bxxxxxxx1Match 字节 0bxxxxxx1xDBGWVR<n>+10bxxxxx1xx 处的匹配字节 DBGWVR<n>+20bxxxx1xxx 处的匹配字节 DBGWVR<n>+3 处的匹配字节DBGWVR<n> 寻址双字：\nBAS描述，如果 DBGWVR<n>[2] == 00bxxx1xxxx 在 DBGWVR<n>+40bxx1xxxxxx 处匹配字节 在 DBGWVR<n>+50bx1xxxxxx 处匹配字节 DBGWVR<n>+60b1xxxxxxx 处匹配字节DBGWVR<n>+7 如果 DBGWVR<n>[2] == 1，则仅使用 BAS[3:0]，而忽略 BAS[7:4]。 Arm 不推荐设置 DBGWVR<n>[2] == 1。BAS 的有效值是非零二进制数，其所有设置位都是连续的。所有其他值均被保留，不得由软件使用。请参阅“保留的 DBGWCR<n>.BAS 值”。"
              reset_info: "冷复位；AU"
            - name: "LSC"
              bits: "4:3"
              desc: "加载/存储控制。该位域支持对所进行的访问类型进行观察点匹配。该位域的可能值有：\n所有其他值都被保留，但必须表现得就像观察点被禁用一样。软件不得依赖此属性，因为保留值的行为可能会在体系结构的未来修订中发生变化。"
              reset_info: "冷复位；AU"
              values:
                - value: "0b01"
                  desc: "匹配从观察点地址加载的指令。"
                - value: "0b10"
                  desc: "匹配存储到观察点地址的指令。"
                - value: "0b11"
                  desc: "匹配从观察点地址加载或存储到观察点地址的指令。"
            - name: "PAC"
              bits: "2:1"
              desc: "访问控制权限。确定生成观察点 n 的观察点调试事件的一个或多个异常级别。该位域必须与 SSC 和 HMC 位域一起解释。有关 SSC、HMC 和 PAC 位域操作的更多信息，请参阅“观察点生成观察点异常的执行条件”。"
              reset_info: "冷复位；AU"
            - name: "E"
              bits: "0"
              desc: "启用观察点 n。可能的值为："
              reset_info: "冷复位；AU"
              values:
                - value: "0b0"
                  desc: "观察点已禁用。"
                - value: "0b1"
                  desc: "观察点已启用。"
        - name: "DBGWFAR"
          desc: "先前返回有关访问观察点地址的指令地址的信息。现已弃用，RES0。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
