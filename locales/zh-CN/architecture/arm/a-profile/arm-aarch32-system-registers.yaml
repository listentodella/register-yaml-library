            - name: "IRGN"
              bits: "6,0"
              source_condition: "When TTBCR.EAE == '0'；Layout: AArch32-TTBCR.EAE==0"
              desc: "内部区域位。 IRGN[1:0] 指示与转换表遍历关联的内存的内部可缓存性属性。 IRGN[1:0] 的可能值为：\nIRGN 位的编码是违反直觉的，寄存器位[6]为IRGN[0]，寄存器位[0]为IRGN[1]。选择此编码是为了提供内存区域类型的一致编码，并确保为没有多处理扩展的 Armv7 编写的软件可以在包含 ARMv7 多处理 Extensions.The IRGN 引入的功能的实现上运行，无需修改。位域拆分如下：\nIRGN[1] 是 TTBR1[6]。 IRGN[0] 是 TTBR1[0]。"
