            - name: "LPAE"
              bits: "9"
              source_condition: "When TTBCR.EAE == '0'；Layout: TTBCR.EAE==0"
              desc: "在发生数据中止异常时，该位设置如下：\n硬件不会解释该位来确定内存系统的行为，因此软件可以将该位设置为 0 或 1，而不影响操作。"
              condition: "当TTBCR.EAE == '0'时；布局：TTBCR.EAE==0"
