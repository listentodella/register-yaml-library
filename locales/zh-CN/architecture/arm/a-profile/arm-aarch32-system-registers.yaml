              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "5:4"
              desc: "保留，RES0。"
            - name: "ER"
              bits: "3"
              desc: "事件计数器读使能。当 PMUSERENR.EN 为 0 时，PMUSERENR.ER 使能事件计数器的 EL0 读取以及选择寄存器的 EL0 读取和写入。受此控制影响的寄存器访问是：\nMRC 读取 PMEVCNTR<n> 和 PMXEVCNTR。 MRC 和 MCR 访问 PMSELR。禁用时，读取和写入为UNDEFINED。当 PMUSERENR.EN == 1 时，PE 会忽略该位域。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "事件计数器的 EL0 读取和选择寄存器的 EL0 读取和写入被禁用，除非由 PMUSERENR.EN 启用。"
                - value: "0b1"
                  desc: "启用事件计数器的 EL0 读取和选择寄存器的 EL0 读取和写入，除非被其他控制捕获。"
            - name: "CR"
              bits: "2"
              desc: "周期计数器读使能。当 PMUSERENR.EN 为 0 时，PMUSERENR.CR 启用周期计数器的 EL0 读取。受此控制影响的寄存器访问是：\nMRC 读取 PMCCNTR。 MRRC 读取 PMCCNTR。禁用时，读取结果为 UNDEFINED。当 PMUSERENR.EN == 1 时，PE 会忽略该位域。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "EL0 循环计数器的读取被禁用，除非由 PMUSERENR.EN 启用。"
                - value: "0b1"
                  desc: "EL0 循环计数器的读取被启用，除非被另一个控制捕获。"
            - name: "SW"
