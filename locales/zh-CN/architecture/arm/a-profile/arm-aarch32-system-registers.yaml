              desc: "保留，RES0。"
            - name: "ExT"
              bits: "12"
              desc: "当使用 AArch32 对 EL1 产生虚拟 SError 异常时，DFSR[12] 设置为 VDFSR.ExT。当虚拟 SError 异常被 ESB 指令延迟时，VDISR[12] 设置为 VDFSR.ExT。"
              reset_info: "温复位；AU"
            - name: "RES0"
              bits: "11:0"
              desc: "保留，RES0。"
