                  desc: "普通内存，外部不可缓存。"
                - value: "0b01"
                  desc: "普通内存，外写回写分配可缓存。"
                - value: "0b10"
                  desc: "普通内存，外部直写式可缓存。"
                - value: "0b11"
                  desc: "正常内存，外部回写式，无写入分配可缓存。"
            - name: "IMP"
              bits: "2"
              source_condition: "When TTBCR.EAE == '0'；Layout: AArch32-TTBCR.EAE==0"
              desc: "该位的作用是 IMPLEMENTATION DEFINED。如果转换表实现不包含任何 IMPLEMENTATION DEFINED 功能，则该位为 RES0。"
              condition: "当TTBCR.EAE == '0'时；布局：AArch32-TTBCR.EAE==0"
              reset_info: "温复位；AU"
            - name: "S"
