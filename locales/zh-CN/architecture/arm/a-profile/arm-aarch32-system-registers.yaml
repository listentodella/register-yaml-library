              desc: "软件增量寄存器写使能。当 PMUSERENR.EN 为 0 时，PMUSERENR.SW 使能 EL0 写入软件增量寄存器。受此控制影响的寄存器访问是：\nMCR 写入 PMSWINC。禁用时，写入为UNDEFINED。当 PMUSERENR.EN == 1 时，PE 会忽略该位域。"
              reset_info: "温复位；AU"
              values:
