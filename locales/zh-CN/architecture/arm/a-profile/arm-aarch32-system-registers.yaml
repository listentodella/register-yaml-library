    - name: "Special-purpose PSTATE"
      title: "专用 PSTATE"
      access: "MRS / MSR 系统寄存器接口"
      desc: "Arm AArch32 架构系统寄存器：专用 PSTATE"
      registers:
        - name: "APSR"
          desc: "保存程序状态和控制信息。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "N"
              bits: "31"
              desc: "否定条件标志；设置为最后一个标志设置指令结果的位[31]。如果结果被视为二进制补码有符号整数，则如果结果为负，则将 N 设置为 1；如果结果为正或零，则将 N 设置为 0。"
            - name: "Z"
              bits: "30"
              desc: "零条件标志。如果最后一个标志设置指令的结果为零，则设置为 1，否则设置为 0。结果为零通常表示比较结果相等。"
            - name: "C"
              bits: "29"
              desc: "携带条件标志。如果最后一个标志设置指令导致进位条件，例如加法时的无符号溢出，则设置为 1。"
            - name: "V"
              bits: "28"
              desc: "溢出条件标志。如果最后一个标志设置指令导致溢出情况（例如加法时有符号溢出），则设置为 1。"
            - name: "Q"
              bits: "27"
              desc: "累积饱和位；设置为1表示某些指令发生溢出或饱和。"
            - name: "RES0"
              bits: "26:23"
              desc: "保留，RES0。"
            - name: "PAN"
              bits: "22"
              source_condition: "When FEAT_PAN is implemented"
              desc: "特权访问从不。该位域为 UNKNOWN，但允许返回PSTATE.PAN位域的值。写入时，该位域被视为“请勿修改”。"
              condition: "当实现 FEAT_PAN 时"
              reset_info: "温复位；AU"
            - name: "RES0"
              bits: "22"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "21:20"
              desc: "保留，RES0。"
            - name: "GE"
              bits: "19:16"
              desc: "大于或等于标志，用于并行加法和减法。"
            - name: "RES0"
              bits: "15:10"
              desc: "保留，RES0。"
            - name: "E"
              bits: "9"
              desc: "字节序。该位域为 UNKNOWN，但允许返回PSTATE.E位域的值。写入时，该位域被视为“请勿修改”。"
              reset_info: "温复位；AU"
            - name: "A"
              bits: "8"
              desc: "SError 异常掩码。该位域为 UNKNOWN，但允许返回PSTATE.A位域的值。写入时，该位域被视为“请勿修改”。"
              reset_info: "温复位；AU"
            - name: "I"
              bits: "7"
              desc: "IRQ中断屏蔽。该位域为 UNKNOWN，但允许返回PSTATE.I位域的值。写入时，该位域被视为“请勿修改”。"
              reset_info: "温复位；AU"
            - name: "F"
              bits: "6"
              desc: "FIQ中断屏蔽。该位域为 UNKNOWN，但允许返回PSTATE.F位域的值。写入时，该位域被视为“请勿修改”。"
              reset_info: "温复位；AU"
            - name: "RES0"
              bits: "5"
              desc: "保留，RES0。"
            - name: "M[4:0]"
              bits: "4:0"
              desc: "模式。该位域为 UNKNOWN，但允许返回PSTATE.M[4:0]位域的值。写入时，该位域被视为“请勿修改”。"
              reset_info: "温复位；AU"
        - name: "CPSR"
          desc: "保存PE状态和控制信息。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "N"
              bits: "31"
              desc: "否定条件标志；设置为最后一个标志设置指令结果的位[31]。如果结果被视为二进制补码有符号整数，则如果结果为负，则将 N 设置为 1；如果结果为正或零，则将 N 设置为 0。"
            - name: "Z"
              bits: "30"
              desc: "零条件标志。如果最后一个标志设置指令的结果为零，则设置为 1，否则设置为 0。结果为零通常表示比较结果相等。"
            - name: "C"
              bits: "29"
              desc: "携带条件标志。如果最后一个标志设置指令导致进位条件，例如加法时的无符号溢出，则设置为 1。"
            - name: "V"
              bits: "28"
              desc: "溢出条件标志。如果最后一个标志设置指令导致溢出情况（例如加法时有符号溢出），则设置为 1。"
            - name: "Q"
              bits: "27"
              desc: "累积饱和位；设置为1表示某些指令发生溢出或饱和。"
            - name: "RES0"
              bits: "26:24"
              desc: "保留，RES0。"
            - name: "SSBS"
              bits: "23"
              source_condition: "When FEAT_SSBS is implemented"
              desc: "投机存储绕过安全。禁止实际上可能允许缓存计时侧通道的推测加载或存储。如果寄存器中的推测值用于形成地址、生成条件代码或生成供推测序列中的其他指令使用的 SVE 谓词值，或者如果推测序列中任何其他指令的执行时序是推测下加载的数据的函数，则以潜在推测可利用的方式使用寄存器中的推测值。对于除 Hyp 模式之外的任何模式的异常情况，该位的值通常设置为 SCTLR.DSSBS 位描述的值，对于 Hyp 模式的异常情况，设置为 HSCTLR.DSSBS 位描述的值。"
              condition: "当实现FEAT_SSBS时"
              reset_info: "温复位；ID"
              values:
                - value: "0b0"
                  desc: "如果加载寄存器的推测读取在一致性顺序中比使用与加载指令相同的虚拟地址的最新存储生成的条目更早，则不允许硬件以潜在推测可利用的方式使用推测寄存器值。"
                - value: "0b1"
                  desc: "当 PSTATE.SSBS 的值为 1 时，如果加载寄存器的推测读取的一致性顺序早于使用与加载指令相同的虚拟地址的最新存储到该位置生成的条目，则允许硬件以潜在推测可利用的方式使用推测寄存器值。"
            - name: "RES0"
              bits: "23"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "PAN"
              bits: "22"
              source_condition: "When FEAT_PAN is implemented"
              desc: "特权访问从不。该位的值通常在发生异常时保留，但以下情况除外：\n当异常的目标为 EL1 且当前 Security 状态的 SCTLR.SPAN 位的值为 0 时，该位设置为 1。当异常的目标为 EL3 时，从 Secure 状态开始，Secure SCTLR.SPAN 的值 为 0，该位设置为 1。当异常的目标是 EL3 时，从非安全状态，无论安全 SCTLR.SPAN 位的值如何，该位都设置为 0。"
              condition: "当实现 FEAT_PAN 时"
              values:
                - value: "0b0"
                  desc: "地址转换系统与Armv8.0相同。"
                - value: "0b1"
                  desc: "禁止对 EL0 处可访问的地址进行特权读写访问。"
            - name: "RES0"
              bits: "22"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "DIT"
              bits: "21"
              source_condition: "When FEAT_DIT is implemented"
              desc: "数据独立时序。数据处理指令描述的操作信息部分指示该指令是否受该位影响。"
              condition: "当实现FEAT_DIT时"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "该架构没有声明任何指令的时序属性。"
                - value: "0b1"
                  desc: "该架构要求数据无关时间代码序列的执行时间必须独立于所有数据无关时间值。有关详细信息，请参阅关于 DIT 位。"
            - name: "RES0"
              bits: "21"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "20"
              desc: "保留，RES0。"
            - name: "GE"
              bits: "19:16"
              desc: "大于或等于标志，用于并行加法和减法。"
            - name: "RES0"
              bits: "15:10"
              desc: "保留，RES0。"
            - name: "E"
              bits: "9"
              desc: "字节顺序状态位。控制数据访问的加载和存储字节顺序：\n取指令忽略该位。如果实现不提供 Big-endian 支持，则该位为 RES0。如果不提供Little-endian支持，则该位为 RES1。如果实现提供 Big-endian 支持，但仅在 EL0，则该位为 RES0，以便异常返回到除 EL0 之外的任何异常级别。同样，如果它仅在 EL0 处提供 Little-endian 支持，则对于异常返回到除 EL0 之外的任何异常级别的异常，该位为 RES1。"
              reset_info: "当 SCTLR.EE 位的复位值由配置输入信号定义时，该值也适用于复位时的 CPSR.E 位，因此适用于复位时的软件执行。"
              values:
                - value: "0b0"
                  desc: "小端操作"
                - value: "0b1"
                  desc: "大端操作。"
            - name: "A"
              bits: "8"
              desc: "SError 异常掩码位。"
              values:
                - value: "0b0"
                  desc: "未屏蔽异常。"
                - value: "0b1"
                  desc: "异常被屏蔽。"
            - name: "I"
              bits: "7"
              desc: "IRQ屏蔽位。"
              values:
                - value: "0b0"
                  desc: "未屏蔽异常。"
                - value: "0b1"
                  desc: "异常被屏蔽。"
            - name: "F"
              bits: "6"
              desc: "FIQ掩码位。"
              values:
                - value: "0b0"
                  desc: "未屏蔽异常。"
                - value: "0b1"
                  desc: "异常被屏蔽。"
            - name: "RES0"
              bits: "5"
              desc: "保留，RES0。"
            - name: "RES1"
              bits: "4"
              desc: "保留，RES1。"
            - name: "M"
              bits: "3:0"
              desc: "当前PE模式。"
              values:
                - value: "0b0000"
                  desc: "用户。"
                - value: "0b0011"
                  desc: "监事。"
                - value: "0b0110"
                  desc: "监控。"
                - value: "0b0111"
                  desc: "中止。"
                - value: "0b1010"
                  desc: "炒作。"
                - value: "0b1011"
                  desc: "未定义。"
                - value: "0b1111"
                  desc: "系统。"
    - name: "Thread"
      title: "线程"
      access: "MRS / MSR 系统寄存器接口"
      desc: "Arm AArch32 架构系统寄存器：Thread"
      registers:
        - name: "TPIDRPRW"
          desc: "提供一个位置，在 EL1 或更高版本上执行的软件可以存储在 EL0 上执行的软件不可见的线程标识信息，以用于 OS 管理目的。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "TID"
              bits: "31:0"
              desc: "线程 ID 线程 ID。在此异常级别运行的软件存储的线程标识信息。"
              reset_info: "温复位；AU"
        - name: "TPIDRURO"
          desc: "提供一个位置，在 EL1 或更高版本上执行的软件可以存储在 EL0 上执行的软件可见的线程标识信息，以用于 OS 管理目的。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "TID"
              bits: "31:0"
              desc: "线程 ID 线程 ID。在此异常级别运行的软件存储的线程标识信息。"
              reset_info: "温复位；AU"
        - name: "TPIDRURW"
          desc: "提供一个位置，在 EL0 上执行的软件可以存储线程标识信息，以用于 OS 管理目的。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "TID"
              bits: "31:0"
              desc: "线程 ID 线程 ID。在此异常级别运行的软件存储的线程标识信息。"
              reset_info: "温复位；AU"
    - name: "Timer"
      title: "定时器"
      access: "MRS / MSR 系统寄存器接口"
      desc: "Arm AArch32 架构系统寄存器：定时器"
      registers:
        - name: "CNTFRQ"
          desc: "提供该寄存器是为了软件能够发现系统计数器的有效频率。作为系统初始化的一部分，必须使用该值对其进行编程。寄存器的值不由硬件解释。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "ClockFreq"
              bits: "31:0"
              desc: "时钟频率 时钟频率。表示系统计数器的有效频率，单位为Hz。"
              reset_info: "温复位；AU"
        - name: "CNTHP_CTL"
          desc: "Hyp 模式物理定时器的控制寄存器。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "RES0"
              bits: "31:3"
              desc: "保留，RES0。"
            - name: "ISTATUS"
              bits: "2"
              desc: "计时器的状态。该位指示定时器条件是否满足：\n当ENABLE位的值为1时，ISTATUS指示定时器条件是否满足。 ISTATUS 不考虑 IMASK 位的值。如果 ISTATUS 的值为 1 并且 IMASK 的值为 0，则定时器中断有效。当ENABLE位的值为0时，ISTATUS位域为 UNKNOWN。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "不满足定时器条件。"
                - value: "0b1"
                  desc: "满足定时器条件。"
            - name: "IMASK"
              bits: "1"
              desc: "定时器中断屏蔽位。允许的值为：\n欲了解更多信息，请参见ISTATUS位的描述。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "定时器中断不被IMASK位屏蔽。"
                - value: "0b1"
                  desc: "定时器中断由IMASK位屏蔽。"
            - name: "ENABLE"
              bits: "0"
              desc: "启用计时器。允许的值为：\n将该位设置为 0 将禁用定时器输出信号，但可从 CNTHP_TVAL 访问的定时器值继续递减计数。禁用输出信号可能是一种节能选择。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "定时器已禁用。"
                - value: "0b1"
                  desc: "定时器已启用。"
        - name: "CNTHPS_CTL"
          desc: "提供从 EL0 到安全 EL2 物理定时器的 AArch32 访问。"
          condition: "当实现 FEAT_AA32 且实现 FEAT_SEL2 时"
          fields:
            - name: "RES0"
              bits: "31:3"
              desc: "保留，RES0。"
            - name: "ISTATUS"
              bits: "2"
              desc: "计时器的状态。该位指示定时器条件是否满足：\n当CNTHPS_CTL.ENABLE位的值为1时，ISTATUS指示定时器条件是否满足。 ISTATUS 不考虑 IMASK 位的值。如果 ISTATUS 的值为 1 并且 IMASK 的值为 0，则定时器中断有效。当CNTHPS_CTL.ENABLE位的值为0时，ISTATUS位域为 UNKNOWN。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "不满足定时器条件。"
                - value: "0b1"
                  desc: "满足定时器条件。"
            - name: "IMASK"
              bits: "1"
              desc: "定时器中断屏蔽位。允许的值为：\n欲了解更多信息，请参见ISTATUS位的描述。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "定时器中断不被IMASK位屏蔽。"
                - value: "0b1"
                  desc: "定时器中断由IMASK位屏蔽。"
            - name: "ENABLE"
              bits: "0"
              desc: "启用计时器。允许的值为：\n将该位设置为 0 将禁用定时器输出信号，但可从 CNTHPS_TVAL 访问的定时器值继续递减计数。禁用输出信号可能是一种节能选择。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "定时器已禁用。"
                - value: "0b1"
                  desc: "定时器已启用。"
        - name: "CNTHPS_CVAL"
          desc: "提供从 EL0 到安全 EL2 物理定时器的比较值的 AArch32 访问。"
          condition: "当实现 FEAT_AA32 且实现 FEAT_SEL2 时"
          fields:
            - name: "CompareValue"
              bits: "63:0"
              desc: "保存EL2物理定时器CompareValue。当 CNTHPS_CTL.ENABLE 为 1 时，当 (CNTPCT - CompareValue) 大于或等于 0 时，满足定时器条件。这意味着 CompareValue 的作用类似于 64 位向上计数器定时器。当定时器条件满足时：\nCNTHPS_CTL.ISTATUS 设置为 1。如果 CNTHPS_CTL.IMASK 为 0，则生成中断。当CNTHPS_CTL.ENABLE为0时，定时器条件不满足，但CNTPCT继续计数。如果通用计数器以小于64 位的大小实现，则允许该位域以与计数器相同的宽度实现，并且高位为 RES0。在所有计数器计算中，该位域的值被视为零扩展。"
              reset_info: "温复位；AU"
        - name: "CNTHPS_TVAL"
          desc: "提供从 EL0 到安全 EL2 物理定时器的定时器值的 AArch32 访问。"
          condition: "当实现 FEAT_AA32 且实现 FEAT_SEL2 时"
          fields:
            - name: "TimerValue"
              bits: "31:0"
              desc: "EL2物理定时器的TimerValue视图。读取该寄存器时：\n如果CNTHPS_CTL.ENABLE为0，则返回值为 UNKNOWN。如果 CNTHPS_CTL.ENABLE 为 1，则返回值为 (CNTHPS_CVAL - CNTPCT)。写入该寄存器时，CNTHPS_CVAL 设置为 (CNTPCT + TimerValue)，其中 TimerValue 被视为有符号 32 位整数。当 CNTHPS_CTL.ENABLE 为 1 时，当 (CNTPCT - CNTHPS_CVAL) 大于或等于 0 时，满足定时器条件。这意味着 TimerValue 的作用类似于 32 位递减计数器定时器。当定时器条件满足时：\nCNTHPS_CTL.ISTATUS 设置为 1。如果 CNTHPS_CTL.IMASK 为 0，则生成中断。当CNTHPS_CTL.ENABLE为0时，TimerValue无法读取，但继续递减。当定时器启用时，TimerValue 表示经过的时间，无论该时间是启用还是禁用。"
              reset_info: "温复位；AU"
        - name: "CNTHV_CTL"
          desc: "提供 AArch32 对 EL2 虚拟定时器的控制寄存器的访问。"
          condition: "当实现 FEAT_AA32 且实现 FEAT_VHE 时"
          fields:
            - name: "RES0"
              bits: "31:3"
              desc: "保留，RES0。"
            - name: "ISTATUS"
              bits: "2"
              desc: "计时器的状态。该位指示定时器条件是否满足：\n当ENABLE位的值为1时，ISTATUS指示定时器条件是否满足。 ISTATUS 不考虑 IMASK 位的值。如果 ISTATUS 的值为 1 并且 IMASK 的值为 0，则定时器中断有效。当ENABLE位的值为0时，ISTATUS位域为 UNKNOWN。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "不满足定时器条件。"
                - value: "0b1"
                  desc: "满足定时器条件。"
            - name: "IMASK"
              bits: "1"
              desc: "定时器中断屏蔽位。允许的值为：\n欲了解更多信息，请参见ISTATUS位的描述。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "定时器中断不被IMASK位屏蔽。"
                - value: "0b1"
                  desc: "定时器中断由IMASK位屏蔽。"
            - name: "ENABLE"
              bits: "0"
              desc: "启用计时器。允许的值为：\n将该位设置为 0 将禁用定时器输出信号，但可从 CNTHV_TVAL 访问的定时器值继续递减计数。禁用输出信号可能是一种节能选择。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "定时器已禁用。"
                - value: "0b1"
                  desc: "定时器已启用。"
        - name: "CNTHV_CVAL"
          desc: "提供 AArch32 对 EL2 虚拟定时器的比较值的访问。"
          condition: "当实现 FEAT_AA32 且实现 FEAT_VHE 时"
          fields:
            - name: "CompareValue"
              bits: "63:0"
              desc: "保存EL2虚拟定时器CompareValue。当 CNTHV_CTL.ENABLE 为 1 时，当 (CNTVCT - CompareValue) 大于或等于 0 时，满足定时器条件。这意味着 CompareValue 的作用类似于 64 位向上计数器定时器。当定时器条件满足时：\nCNTHV_CTL.ISTATUS 设置为 1。如果 CNTHV_CTL.IMASK 为 0，则生成中断。当CNTHV_CTL.ENABLE为0时，不满足定时器条件，但CNTVCT继续计数。如果通用计数器以小于 64 位的大小实现，则允许以与计数器相同的宽度实现该位域，并且高位为 RES0。在所有计数器计算中，该位域的值被视为零扩展。"
        - name: "CNTHV_TVAL"
          desc: "提供 AArch32 对 EL2 虚拟计时器的计时器值的访问。"
          condition: "当实现 FEAT_AA32 且实现 FEAT_VHE 时"
          fields:
            - name: "TimerValue"
              bits: "31:0"
              desc: "EL2虚拟定时器的TimerValue视图。读取该寄存器时：\n如果CNTHV_CTL.ENABLE为0，则返回值为 UNKNOWN。如果 CNTHV_CTL.ENABLE 为 1，则返回值为 (CNTHV_CVAL - CNTVCT)。写入该寄存器时，CNTHV_CVAL 设置为 (CNTVCT + TimerValue)，其中 TimerValue 被视为有符号 32 位整数。当 CNTHV_CTL.ENABLE 为 1 时，当 (CNTVCT - CNTHV_CVAL) 大于或等于 0 时，满足定时器条件。这意味着 TimerValue 的作用类似于 32 位递减计数器定时器。当定时器条件满足时：\nCNTHV_CTL.ISTATUS 设置为 1。如果 CNTHV_CTL.IMASK 为 0，则生成中断。当CNTHV_CTL.ENABLE为0时，TimerValue无法读取，但继续递减。当定时器启用时，TimerValue 表示经过的时间，无论该时间是启用还是禁用。"
        - name: "CNTHVS_CTL"
          desc: "提供从 EL0 到安全 EL2 虚拟计时器的 AArch32 访问。"
          condition: "当实现 FEAT_AA32 且实现 FEAT_SEL2 时"
          fields:
            - name: "RES0"
              bits: "31:3"
              desc: "保留，RES0。"
            - name: "ISTATUS"
              bits: "2"
              desc: "计时器的状态。该位指示定时器条件是否满足：\n当ENABLE位的值为1时，ISTATUS指示定时器条件是否满足。 ISTATUS 不考虑 IMASK 位的值。如果 ISTATUS 的值为 1 并且 IMASK 的值为 0，则定时器中断有效。当ENABLE位的值为0时，ISTATUS位域为 UNKNOWN。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "不满足定时器条件。"
                - value: "0b1"
                  desc: "满足定时器条件。"
            - name: "IMASK"
              bits: "1"
              desc: "定时器中断屏蔽位。允许的值为：\n欲了解更多信息，请参见ISTATUS位的描述。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "定时器中断不被IMASK位屏蔽。"
                - value: "0b1"
                  desc: "定时器中断由IMASK位屏蔽。"
            - name: "ENABLE"
              bits: "0"
              desc: "启用计时器。允许的值为：\n将该位设置为 0 将禁用定时器输出信号，但可从 CNTHVS_TVAL 访问的定时器值继续递减计数。禁用输出信号可能是一种节能选择。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "定时器已禁用。"
                - value: "0b1"
                  desc: "定时器已启用。"
        - name: "CNTHVS_CVAL"
          desc: "提供 AArch32 对安全 EL2 虚拟计时器的比较值的访问。"
          condition: "当实现 FEAT_AA32 且实现 FEAT_SEL2 时"
          fields:
            - name: "CompareValue"
              bits: "63:0"
              desc: "保存EL2虚拟定时器CompareValue。当 CNTHVS_CTL.ENABLE 为 1 时，当 (CNTVCT - CompareValue) 大于或等于 0 时，满足定时器条件。这意味着 CompareValue 的作用类似于 64 位向上计数器定时器。当定时器条件满足时：\nCNTHVS_CTL.ISTATUS 设置为 1。如果 CNTHVS_CTL.IMASK 为 0，则生成中断。当CNTHVS_CTL.ENABLE为0时，不满足定时器条件，但CNTVCT继续计数。如果通用计数器以小于 64 位的大小实现，则允许以与计数器相同的宽度实现该位域，并且高位为 RES0。在所有计数器计算中，该位域的值被视为零扩展。"
        - name: "CNTHVS_TVAL"
          desc: "提供 AArch32 对安全 EL2 虚拟计时器的计时器值的访问。"
          condition: "当实现 FEAT_AA32 且实现 FEAT_SEL2 时"
          fields:
            - name: "TimerValue"
              bits: "31:0"
              desc: "EL2虚拟定时器的TimerValue视图。读取该寄存器时：\n如果CNTHVS_CTL.ENABLE为0，则返回值为 UNKNOWN。如果 CNTHVS_CTL.ENABLE 为 1，则返回值为 (CNTHVS_CVAL - CNTVCT)。写入该寄存器时，CNTHVS_CVAL 设置为 (CNTVCT + TimerValue)，其中 TimerValue 被视为有符号 32 位整数。当 CNTHVS_CTL.ENABLE 为 1 时，当 (CNTVCT - CNTHVS_CVAL) 大于或等于 0 时，满足定时器条件。这意味着 TimerValue 的作用类似于 32 位递减计数器定时器。当定时器条件满足时：\nCNTHVS_CTL.ISTATUS 设置为 1。如果 CNTHVS_CTL.IMASK 为 0，则生成中断。当CNTHVS_CTL.ENABLE为0时，TimerValue无法读取，但继续递减。当定时器启用时，TimerValue 表示经过的时间，无论该时间是启用还是禁用。"
        - name: "CNTKCTL"
          desc: "控制从虚拟计数器生成事件流，以及从 EL0 模式到物理计数器、虚拟计数器、EL1 物理定时器和虚拟定时器的访问。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:18"
              desc: "保留，RES0。"
            - name: "EVNTIS"
              bits: "17"
              source_condition: "When FEAT_ECV is implemented"
              desc: "控制事件流生成的规模。无论 CNTHCTL_EL2.ECV 位的值如何，该控制都适用。"
              condition: "当实现FEAT_ECV时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "CNTKCTL.EVNTI位域适用于CNTVCT[15:0]。"
                - value: "0b1"
                  desc: "CNTKCTL.EVNTI位域适用于CNTVCT[23:8]。"
            - name: "RES0"
              bits: "17"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "16:10"
              desc: "保留，RES0。"
            - name: "PL0PTEN"
              bits: "9"
              desc: "陷阱PL0对物理定时器寄存器的访问进入未定义模式。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "PL0 对 CNTP_CTL、CNTP_CVAL 和 CNTP_TVAL 寄存器的访问被捕获为未定义模式。"
                - value: "0b1"
                  desc: "该控制不会导致任何指令被捕获。"
            - name: "PL0VTEN"
              bits: "8"
              desc: "陷阱PL0对虚拟定时器寄存器的访问为未定义模式。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "PL0 对 CNTV_CTL、CNTV_CVAL 和 CNTV_TVAL 寄存器的访问被捕获为未定义模式。"
                - value: "0b1"
                  desc: "该控制不会导致任何指令被捕获。"
            - name: "EVNTI"
              bits: "7:4"
              desc: "从 EL1 中可以看出，选择 CNTVCT 的哪一位是启用该流时从该计数器生成的事件流的触发器。如果FEAT_ECV被实现，并且CNTKCTL.EVNTIS为1，则该位域选择CNTVCT的8到23范围内的触发位。否则，该位域选择CNTVCT范围0到15中的触发位。"
              reset_info: "温复位；AU"
            - name: "EVNTDIR"
              bits: "3"
              desc: "控制 CNTVCT 触发位（从 EL1 中看出并由 EVNTI 定义）在事件流使能时生成事件。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "触发位从 0 到 1 的转变会触发一个事件。"
                - value: "0b1"
                  desc: "触发位从 1 到 0 的转换会触发一个事件。"
            - name: "EVNTEN"
              bits: "2"
              desc: "允许从 CNTVCT 生成事件流，如 EL1 所示。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "禁用事件流。"
                - value: "0b1"
                  desc: "启用事件流。"
            - name: "PL0VCTEN"
              bits: "1"
              desc: "陷阱PL0对频率寄存器和虚拟计数器寄存器的访问为未定义模式。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "PL0 对 CNTVCT 的访问被捕获为未定义模式。如果 CNTKCTL.PL0PCTEN 也为 0，则对 CNTFRQ 寄存器的 PL0 访问将陷入未定义模式。"
                - value: "0b1"
                  desc: "该控制不会导致任何指令被捕获。"
            - name: "PL0PCTEN"
              bits: "0"
              desc: "陷阱PL0对频率寄存器和物理计数器寄存器的访问进入未定义模式。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "PL0 对 CNTPCT 的访问被捕获为未定义模式。如果 CNTKCTL.PL0VCTEN 也为 0，则 PL0 访问 CNTFRQ 寄存器将陷入未定义模式。"
                - value: "0b1"
                  desc: "该控制不会导致任何指令被捕获。"
        - name: "CNTP_CTL"
          desc: "EL1物理定时器的控制寄存器。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "RES0"
              bits: "31:3"
              desc: "保留，RES0。"
            - name: "ISTATUS"
              bits: "2"
              desc: "计时器的状态。该位指示定时器条件是否满足：\n当ENABLE位的值为1时，ISTATUS指示定时器条件是否满足。 ISTATUS 不考虑 IMASK 位的值。如果 ISTATUS 的值为 1 并且 IMASK 的值为 0，则定时器中断有效。当ENABLE位的值为0时，ISTATUS位域为 UNKNOWN。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "不满足定时器条件。"
                - value: "0b1"
                  desc: "满足定时器条件。"
            - name: "IMASK"
              bits: "1"
              desc: "定时器中断屏蔽位。允许的值为：\n欲了解更多信息，请参见ISTATUS位的描述。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "定时器中断不被IMASK位屏蔽。"
                - value: "0b1"
                  desc: "定时器中断由IMASK位屏蔽。"
            - name: "ENABLE"
              bits: "0"
              desc: "启用计时器。允许的值为：\n将该位设置为 0 将禁用定时器输出信号，但可从 CNTP_TVAL 访问的定时器值继续递减计数。禁用输出信号可能是一种节能选择。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "定时器已禁用。"
                - value: "0b1"
                  desc: "定时器已启用。"
        - name: "CNTP_CVAL"
          desc: "保存EL1物理定时器的比较值。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "CompareValue"
              bits: "63:0"
              desc: "保存EL1物理定时器CompareValue。当CNTP_CTL.ENABLE为1时，当(CNTPCT - CompareValue)大于或等于0时满足定时器条件。这意味着 CompareValue 的作用类似于 64 位向上计数器定时器。当定时器条件满足时：\nCNTP_CTL.ISTATUS 设置为 1。如果 CNTP_CTL.IMASK 为 0，则生成中断。当CNTP_CTL.ENABLE为0时，不满足定时器条件，但CNTPCT继续计数。如果通用计数器以小于 64 位的大小实现，则允许以与计数器相同的宽度实现该位域，并且高位为 RES0。在所有计数器计算中，该位域的值被视为零扩展。"
              reset_info: "温复位；AU"
        - name: "CNTP_TVAL"
          desc: "保存EL1物理定时器的定时器值。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "TimerValue"
              bits: "31:0"
              desc: "EL1 物理定时器的 TimerValue 视图。读取该寄存器时：\n如果CNTP_CTL.ENABLE为0，则返回值为 UNKNOWN。如果CNTP_CTL.ENABLE为1，则返回值为(CNTP_CVAL - CNTPCT)。写入该寄存器时，CNTP_CVAL 设置为 (CNTPCT + TimerValue)，其中 TimerValue 被视为有符号 32 位整数。当CNTP_CTL.ENABLE为1时，当(CNTPCT - CNTP_CVAL)大于或等于0时满足定时器条件。这意味着 TimerValue 的作用类似于 32 位递减计数器定时器。当定时器条件满足时：\nCNTP_CTL.ISTATUS 设置为 1。如果 CNTP_CTL.IMASK 为 0，则生成中断。当CNTP_CTL.ENABLE为0时，TimerValue无法读取，但继续递减。当定时器启用时，TimerValue 表示经过的时间，无论该时间是启用还是禁用。"
              reset_info: "温复位；AU"
        - name: "CNTPCT"
          desc: "保存 64 位物理计数值。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "PhysicalCount"
              bits: "63:0"
              desc: "物理计数值 物理计数值。"
              reset_info: "温复位；AU"
        - name: "CNTPCTSS"
          desc: "保存 64 位物理计数值。"
          condition: "当实现 FEAT_AA32 且实现 FEAT_ECV 时"
          fields:
            - name: "SSPhysicalCount"
              bits: "63:0"
              desc: "自同步物理计数值 自同步物理计数值。"
              reset_info: "温复位；AU"
        - name: "CNTV_CTL"
          desc: "虚拟定时器的控制寄存器。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "RES0"
              bits: "31:3"
              desc: "保留，RES0。"
            - name: "ISTATUS"
              bits: "2"
              desc: "计时器的状态。该位指示定时器条件是否满足：\n当ENABLE位的值为1时，ISTATUS指示定时器条件是否满足。 ISTATUS 不考虑 IMASK 位的值。如果 ISTATUS 的值为 1 并且 IMASK 的值为 0，则定时器中断有效。当ENABLE位的值为0时，ISTATUS位域为 UNKNOWN。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "不满足定时器条件。"
                - value: "0b1"
                  desc: "满足定时器条件。"
            - name: "IMASK"
              bits: "1"
              desc: "定时器中断屏蔽位。允许的值为：\n欲了解更多信息，请参见ISTATUS位的描述。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "定时器中断不被IMASK位屏蔽。"
                - value: "0b1"
                  desc: "定时器中断由IMASK位屏蔽。"
            - name: "ENABLE"
              bits: "0"
              desc: "启用计时器。允许的值为：\n将该位设置为 0 将禁用定时器输出信号，但可从 CNTV_TVAL 访问的定时器值继续递减计数。禁用输出信号可能是一种节能选择。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "定时器已禁用。"
                - value: "0b1"
                  desc: "定时器已启用。"
        - name: "CNTV_CVAL"
          desc: "保存虚拟定时器的比较值。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "CompareValue"
              bits: "63:0"
              desc: "保存EL1虚拟定时器CompareValue。当 CNTV_CTL.ENABLE 为 1 时，当 (CNTVCT - CompareValue) 大于或等于 0 时，满足定时器条件。这意味着 CompareValue 的作用类似于 64 位向上计数器定时器。当定时器条件满足时：\nCNTV_CTL.ISTATUS 设置为 1。如果 CNTV_CTL.IMASK 为 0，则生成中断。当CNTV_CTL.ENABLE为0时，不满足定时器条件，但CNTVCT继续计数。如果通用计数器以小于 64 位的大小实现，则允许以与计数器相同的宽度实现该位域，并且高位为 RES0。在所有计数器计算中，该位域的值被视为零扩展。"
              reset_info: "温复位；AU"
        - name: "CNTV_TVAL"
          desc: "保存虚拟计时器的计时器值。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "TimerValue"
              bits: "31:0"
              desc: "虚拟定时器的TimerValue视图。读取该寄存器时：\n如果CNTV_CTL.ENABLE为0，则返回值为 UNKNOWN。如果CNTV_CTL.ENABLE为1，则返回值为(CNTV_CVAL - CNTVCT)。写入该寄存器时，CNTV_CVAL 设置为 (CNTVCT + TimerValue)，其中 TimerValue 被视为有符号 32 位整数。当 CNTP_CTL.ENABLE 为 1 时，当 (CNTVCT - CNTP_CVAL) 大于或等于 0 时，满足定时器条件。这意味着 TimerValue 的作用类似于 32 位递减计数器定时器。当定时器条件满足时：\nCNTV_CTL.ISTATUS 设置为 1。如果 CNTV_CTL.IMASK 为 0，则生成中断。当CNTV_CTL.ENABLE为0时，TimerValue无法读取，但继续递减。当定时器启用时，TimerValue 表示经过的时间，无论该时间是启用还是禁用。"
              reset_info: "温复位；AU"
        - name: "CNTVCT"
          desc: "保存 64 位虚拟计数值。虚拟计数值等于物理计数值减去CNTVOFF中可见的虚拟偏移量。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "VirtualCount"
              bits: "63:0"
              desc: "虚拟计数值 虚拟计数值。"
              reset_info: "温复位；AU"
        - name: "CNTVCTSS"
          desc: "保存 64 位虚拟计数值。虚拟计数值等于CNTPCT中可见的物理计数值减去CNTVOFF中可见的虚拟偏移量。"
          condition: "当实现 FEAT_AA32 且实现 FEAT_ECV 时"
          fields:
            - name: "SSVirtualCount"
              bits: "63:0"
              desc: "自同步虚拟计数值 自同步虚拟计数值。"
              reset_info: "温复位；AU"
    - name: "Virt"
      title: "虚拟化"
      access: "MRS / MSR 系统寄存器接口"
      desc: "Arm AArch32 架构系统寄存器：Virt"
      registers:
        - name: "CNTHCTL"
          desc: "控制从物理计数器生成事件流，以及从非安全 EL1 模式到物理计数器和非安全 EL1 物理定时器的访问。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "RES0"
              bits: "31:18"
              desc: "保留，RES0。"
            - name: "EVNTIS"
              bits: "17"
              source_condition: "When FEAT_ECV is implemented"
              desc: "控制事件流生成的规模。"
              condition: "当实现FEAT_ECV时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "CNTHCTL.EVNTI位域适用于CNTPCT[15:0]。"
                - value: "0b1"
                  desc: "CNTHCTL.EVNTI位域适用于CNTPCT[23:8]。"
            - name: "RES0"
              bits: "17"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "16:8"
              desc: "保留，RES0。"
            - name: "EVNTI"
              bits: "7:4"
              desc: "从 EL2 中可以看出，选择 CNTPCT 的哪一位是启用该流时从该计数器生成的事件流的触发器。如果FEAT_ECV被实现，并且CNTHCTL.EVNTIS为1，则该位域选择CNTPCT的8到23范围内的触发位。否则，该位域选择CNTPCT范围0到15中的触发位。"
              reset_info: "温复位；AU"
            - name: "EVNTDIR"
              bits: "3"
              desc: "控制 CNTPCT 触发位（从 EL2 中看出并由 EVNTI 定义）在事件流使能时生成事件。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "触发位从 0 到 1 的转变会触发一个事件。"
                - value: "0b1"
                  desc: "触发位从 1 到 0 的转换会触发一个事件。"
            - name: "EVNTEN"
              bits: "2"
              desc: "允许从 CNTPCT 生成事件流，如 EL2 所示。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "禁用事件流。"
                - value: "0b1"
                  desc: "启用事件流。"
            - name: "PL1PCEN"
              bits: "1"
              desc: "陷阱非安全 EL0 和 EL1 MRC 或 MCR 访问，使用 EC 综合征值 0x03 和 MRRC 或 MCRR 访问，使用 EC 综合征值 0x04 报告到物理定时器寄存器到 Hyp 模式。如果实现了EL3并且未实现EL2，则除了直接读取之外，行为就像该位为1一样。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "对 CNTP_CTL、CNTP_CVAL 和 CNTP_TVAL 的非安全 EL0 和 EL1 访问将被捕获为 Hyp 模式，除非被捕获CNTKCTL.PL0PTEN。"
                - value: "0b1"
                  desc: "该控制不会导致任何指令被捕获。"
            - name: "PL1PCTEN"
              bits: "0"
              desc: "陷阱非安全 EL0 和 EL1 MRRC 或 MCRR 访问，使用 EC 综合征值 0x04 报告到物理计数器寄存器到 Hyp 模式。如果实现了 EL3 而未实现 EL2，则除了直接读取之外，行为就像该位为 1 一样。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "对 CNTPCT 的非安全 EL0 和 EL1 访问将陷入 Hyp 模式，除非它被 CNTKCTL.PL0PCTEN 捕获。"
                - value: "0b1"
                  desc: "该控制不会导致任何指令被捕获。"
        - name: "CNTHP_CVAL"
          desc: "保存 Hyp 模式物理定时器的比较值。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "CompareValue"
              bits: "63:0"
              desc: "保存EL2物理定时器CompareValue。当CNTHP_CTL.ENABLE为1时，当(CNTPCT - CompareValue)大于或等于0时，定时器条件满足。这意味着 CompareValue 的作用类似于 64 位向上计数器定时器。当定时器条件满足时：\nCNTHP_CTL.ISTATUS 设置为 1。如果 CNTHP_CTL.IMASK 为 0，则生成中断。当CNTHP_CTL.ENABLE为0时，不满足定时器条件，但CNTPCT继续计数。如果通用计数器以小于 64 位的大小实现，则允许以与计数器相同的宽度实现该位域，并且高位为 RES0。在所有计数器计算中，该位域的值被视为零扩展。"
              reset_info: "温复位；AU"
        - name: "CNTHP_TVAL"
          desc: "保存 Hyp 模式物理定时器的定时器值。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "TimerValue"
              bits: "31:0"
              desc: "EL2物理定时器的TimerValue视图。读取该寄存器时：\n如果CNTHP_CTL.ENABLE为0，则返回值为 UNKNOWN。如果 CNTHP_CTL.ENABLE 为 1，则返回值为 (CNTHP_CVAL - CNTPCT)。写入该寄存器时，CNTHP_CVAL 设置为 (CNTPCT + TimerValue)，其中 TimerValue 被视为有符号 32 位整数。当CNTHP_CTL.ENABLE为1时，当(CNTPCT - CNTHP_CVAL)大于或等于0时，定时器条件满足。这意味着 TimerValue 的作用类似于 32 位递减计数器定时器。当定时器条件满足时：\nCNTHP_CTL.ISTATUS 设置为 1。如果 CNTHP_CTL.IMASK 为 0，则生成中断。当CNTHP_CTL.ENABLE为0时，TimerValue无法读取，但继续递减。当定时器启用时，TimerValue 表示经过的时间，无论该时间是启用还是禁用。"
              reset_info: "温复位；AU"
        - name: "CNTVOFF"
          desc: "保存 64 位虚拟偏移量。这是CNTPCT中可见的物理计数值与CNTVCT中可见的虚拟计数值之间的偏移。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "VOffset"
              bits: "63:0"
              desc: "虚拟偏移 虚拟偏移。如果通用计数器以小于 64 位的大小实现，则允许以与计数器相同的宽度实现该位域，并且高位为 RES0。在所有计数器计算中，该位域的值被视为零扩展。"
              reset_info: "温复位；AU"
        - name: "HACR"
          desc: "控制非安全 EL1 或 EL0 操作的 IMPLEMENTATION DEFINED 方面的 Hyp 模式捕获。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "IMPLEMENTATION DEFINED"
              bits: "31:0"
              desc: "IMPLEMENTATION DEFINED。"
              reset_info: "温复位；AU"
        - name: "HCPTR"
          desc: "控制："
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "TCPAC"
              bits: "31"
              desc: "陷阱非安全 EL1 MRC 和 MCR 对 CPACR 的访问到 Hyp 模式，使用 EC 综合征值 0x03 进行报告。 CPACR 无法在 EL0 处访问。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "对 CPACR 的非安全 EL1 访问将陷入 Hyp 模式。"
            - name: "TAM"
              bits: "30"
              source_condition: "When FEAT_AMUv1 is implemented"
              desc: "陷阱活动监视器访问。陷阱对所有活动的非安全 EL1 和 EL0 MRC、MCR、MRRC 和 MCRR 访问监控系统寄存器 EL2，使用 EC 综合征值 0x03 和 0x04 进行报告。"
              condition: "当实现 FEAT_AMUv1 时"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "从非安全 EL1 和 EL0 到活动监视器系统寄存器的访问被捕获为 Hyp 模式。"
            - name: "RES0"
              bits: "30"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "29:21"
              desc: "保留，RES0。"
            - name: "TTA"
              bits: "20"
              desc: "陷阱非安全系统寄存器 MRC、MCR、MRRC 和 MCRR 访问所有已实现的跟踪系统寄存器至 Hyp 模式，使用 EC 综合征值进行报告0x05 和 0x0C。如果实现不包含跟踪单元，或者不包含跟踪单元寄存器的系统寄存器接口，则 IMPLEMENTATION DEFINED 该位是否：\n是 RES0。是 RES1。当 SCR.NS 为 1 时，可以从 Hyp 模式和安全监控模式写入。如果 EL3 已实现并使用 AArch32，并且 NSACR.NSTRCDIS 的值为 1，则在非安全状态下此位域的行为为 RAO/WI，无论其实际值如何。 FEAT_ETMv4 和 FEAT_ETE 不允许 EL0 访问跟踪系统寄存器。 EL0 对跟踪系统寄存器的访问是UNDEFINED。产生的未定义指令异常的优先级高于 HCPTR.TTA Hyp 陷阱异常。 Arm 架构不通过可选的内存映射调试 interface.System 寄存器访问跟踪寄存器访问提供陷阱。对跟踪系统寄存器的访问可能会产生副作用。当系统寄存器访问被捕获时，在发生异常之前不会发生通常与该访问相关的任何副作用。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "对已实现的跟踪系统寄存器的任何非安全系统寄存器访问都会陷入 Hyp 模式，除非该访问被 CPACR 或 NSACR 控制陷入 EL1，或者访问来自非安全 EL0 且寄存器中的定义适当的跟踪架构规范表明该寄存器无法从 EL0 访问。捕获指令生成：\nHyp 陷阱异常，如果该异常取自非安全 EL0 或 EL1。如果异常是从 Hyp 模式获取的，则未定义指令异常将进入 Hyp 模式。"
            - name: "RES0"
              bits: "19:16"
              desc: "保留，RES0。"
            - name: "TASE"
              bits: "15"
              desc: "陷阱高级 SIMD 指令非安全执行到 Hyp 模式，当 HCPTR.TCP10 的值为 0 时，使用 EC 综合征值 0x07 报告。当 HCPTR.TCP10 的值为 1 时，该位域的值将被忽略。如果实现不包括高级 SIMD 和浮点功能，则该位域为 RES1。否则，该位域是否实现为RW位域是 IMPLEMENTATION DEFINED。如果它没有实现为 RW 位域，那么它是 RAZ/WI。如果 EL3 已实现并使用 AArch32，且 NSACR.NSASEDIS 的值为 1，则在非安全状态下，此位域的行为为 RAO/WI，无论其实际值如何。即使该位域实现为 RAZ/WI，这也适用。有关受此位域影响的指令列表，请参阅“不适用于浮点运算的高级 SIMD 操作的控制”。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "当 HCPTR.TCP10 的值为 0 时，任何在非安全状态下执行高级 SIMD 指令的尝试都会陷入 Hyp 模式，除非它被 CPACR 或 NSACR 陷入 EL1控制。捕获指令生成：\nHyp 陷阱异常，如果该异常取自非安全 EL0 或 EL1。如果异常是从 Hyp 模式获取的，则未定义指令异常将进入 Hyp 模式。"
            - name: "RES0"
              bits: "14"
              desc: "保留，RES0。"
            - name: "RES1"
              bits: "13:12"
              desc: "保留，RES1。"
            - name: "TCP11"
              bits: "11"
              source_condition: "When FEAT_FP is implemented and FEAT_AdvSIMD is implemented"
              desc: "该位域的值将被忽略。如果该位域编程为与 TCP10 位不同的值，则直接读取 HCPTR 时该位域为 UNKNOWN。如果实现不包括高级 SIMD 和浮点功能，则该位域为 RES1。如果 EL3 已实现并使用 AArch32，且 NSACR.cp10 的值为 0，则在非安全状态下，此位域的行为为 RAO/WI，无论其实际值如何。"
              condition: "当实现FEAT_FP并且实现FEAT_AdvSIMD时"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
            - name: "RES1"
              bits: "11"
              source_condition: "Otherwise"
              desc: "保留，RES1。"
              condition: "否则"
            - name: "TCP10"
              bits: "10"
              source_condition: "When FEAT_FP is implemented and FEAT_AdvSIMD is implemented"
              desc: "捕获对高级 SIMD 的非安全访问和 Hyp 模式的浮点功能，使用 EC 综合征值 0x07 报告：\n这些位域控制的高级 SIMD 和浮点功能包括：\n执行任何浮点或高级 SIMD 指令。对高级 SIMD 和浮点寄存器 D0-D31 的任何访问及其视图为 S0-S31 和 Q0-Q15。对 FPSCR、FPSID、MVFR0、MVFR1、MVFR2 或 FPEXC 系统的任何访问寄存器。如果实现不包括高级 SIMD 和浮点功能，则该位域为 RES1。如果 EL3 已实现并使用 AArch32，且 NSACR.cp10 的值为 0，则在非安全状态下，此位域的行为为 RAO/WI，无论其实际值如何。"
              condition: "当实现FEAT_FP并且实现FEAT_AdvSIMD时"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "任何从非安全状态访问高级 SIMD 和浮点功能的尝试都会陷入 Hyp 模式，除非它被 CPACR 或 NSACR 控制陷入 EL1。捕获指令生成：\nHyp 陷阱异常，如果该异常取自非安全 EL0 或 EL1。如果异常是从 Hyp 模式获取的，则未定义指令异常将进入 Hyp 模式。"
            - name: "RES1"
              bits: "10"
              source_condition: "Otherwise"
              desc: "保留，RES1。"
              condition: "否则"
            - name: "RES1"
              bits: "9:0"
              desc: "保留，RES1。"
        - name: "HCR"
          desc: "提供虚拟化的配置控制，包括定义各种非安全操作是否陷入 Hyp 模式。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "RES0"
              bits: "31"
              desc: "保留，RES0。"
            - name: "TRVM"
              bits: "30"
              desc: "虚拟内存控件的陷阱读取。当在当前安全状态下启用 EL2 时，会将虚拟内存控制寄存器的非安全 EL1 读取陷入 EL2。使用 EC 综合征值 0x03 捕获并报告以下寄存器的 MRC 读取，使用 EC 综合征值 0x04 捕获并报告 MRRC 读取：\nSCTLR、TTBR0、TTBR1、TTBCR、TTBCR2、DACR、DFSR、IFSR、DFAR、IFAR、ADFSR、AIFSR、PRRR、NMRR、MAIR0、MAIR1、AMAIR0、AMAIR1、CONTEXTIDR。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "对指定虚拟内存控件的非安全 EL1 读取访问将陷入 EL2。"
            - name: "HCD"
              bits: "29"
              source_condition: "When EL3 is not implemented"
              desc: "HVC 指令禁用。当在当前安全状态下启用 EL2 时，禁用 HVC 指令的非安全 EL1 和 EL2 执行，使用 EC 综合征值 0x00 进行报告。 HVC 指令在 EL0 处始终为 UNDEFINED。"
              condition: "当 EL3 未实现时"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "在 EL2 和 EL1 处启用 HVC 指令执行。"
                - value: "0b1"
                  desc: "HVC 指令在 EL2 和非安全 EL1 处为 UNDEFINED。未定义指令异常被带到执行 HVC 指令的异常级别。"
            - name: "RES0"
              bits: "29"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "28"
              desc: "保留，RES0。"
            - name: "TGE"
              bits: "27"
              desc: "陷阱一般异常，来自非安全 EL0。另外，当HCR.TGE为1时：\n如果 EL3 使用 AArch32，尝试通过将 SCR.NS 从 0 更改为 1 来从安全 PL1 模式更改为非安全 EL1 模式会导致SCR.NS 保留为 0。 HDCR.{TDRA、TDOSA、TDA、TDE} 位为忽略并视为 1，除非是为了直接读取 HDCR。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制对 EL0 处的执行没有影响。"
                - value: "0b1"
                  desc: "当当前安全状态下EL2未使能时，该控制对EL0处的执行没有影响。当当前安全状态下使能EL2时，则：\n所有将路由到 EL1 的异常都将路由到 EL2。除了返回直接读取 SCTLR 的结果之外，SCTLR.M 位被视为 0。 HCR.{FMO、IMO、AMO} 位被视为 1，除了返回直接读取 HCR 的结果之外的所有目的。所有虚拟中断均被禁用。任何用于发出虚拟中断信号的 IMPLEMENTATION DEFINED 机制均被禁用。异常返回到EL1被视为非法异常返回。在监视模式下执行将 PSTATE.M 更改为非安全 EL1 模式的 MSR 或 CPS 指令是对 PSTATE.M 的非法更改。有关更多信息，请参阅“对 PSTATE.M 的非法更改”。"
            - name: "TVM"
              bits: "26"
              desc: "陷阱虚拟内存控制。当当前安全状态下启用 EL2 时，陷阱非安全 EL1 将虚拟内存控制寄存器写入 EL2。使用 EC 综合征值 0x03 捕获并报告以下寄存器的 MCR 写入，使用 EC 综合征值 0x04 捕获并报告 MCRR 写入：\nSCTLR、TTBR0、TTBR1、TTBCR、TTBCR2、DACR、DFSR、IFSR、DFAR、IFAR、ADFSR、AIFSR、PRRR、NMRR、MAIR0、MAIR1、AMAIR0、AMAIR1、CONTEXTIDR。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "对指定虚拟内存控制寄存器的非安全 EL1 写访问陷入 EL2。"
            - name: "TTLB"
              bits: "25"
              desc: "疏水阀【TLB】保养说明。当在当前安全状态下启用 EL2 时，将非安全 EL1 执行的 TLBI 指令陷入 EL2。 MCR 和 MRC 对以下系统指令的访问将被捕获并使用 EC 综合征值 0x03 进行报告：\nTLBIALLIS、TLBIMVAIS、TLBIASIDIS、TLBIMVAAIS、TLBIMVALIS、TLBIMVAALIS, ITLBIALL, ITLBIMVA, ITLBIASID, DTLBIALL, DTLBIMVA, DTLBIASID、TLBIALL、TLBIMVA、TLBIASID、TLBIMVAA、TLBIMVAL、 TLBIMVAAL"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "对指定 TLB 维护指令的非安全 EL1 访问将陷入 EL2。"
            - name: "TPU"
              bits: "24"
              desc: "操作到统一点的陷阱缓存维护指令。当在当前安全状态下启用 EL2 时，会将这些高速缓存维护指令的非安全 EL1 执行陷入 EL2。以下系统指令的 MRC 和 MCR 访问将被捕获并使用 EC 综合征值 0x03 进行报告：\nICIMVAU、ICIALLU、ICIALLUIS、DCCMVAU。 EL0 处生成的未定义指令异常的优先级高于 EL2 的陷阱，并且这些指令在 EL0 处始终为 UNDEFINED。如果统一点在任意一级数据缓存之前，则 IMPLEMENTATION DEFINED 当该控制的值为1时，是否可以捕获通过VA对统一点指令进行的任何数据或统一缓存清理的执行。如果统一点在任意级别指令缓存之前，则[实现定义]当该控制值为1时，是否可以捕获任何指令缓存无效到统一点指令的执行。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "指定缓存维护指令的非安全 EL1 执行陷入 EL2。"
            - name: "TPC"
              bits: "23"
              desc: "捕获数据或统一缓存维护指令，操作到一致性点。当在当前安全状态下启用 EL2 时，会将这些高速缓存维护指令的非安全 EL1 执行陷入 EL2。以下系统指令的 MRC 和 MCR 访问将被捕获并使用 EC 综合征值 0x03 进行报告：\nDCIMVAC、DCCIMVAC、DCCMVAC。 EL0 处生成的未定义指令异常的优先级高于 EL2 的陷阱，并且这些指令在 EL0 处始终为 UNDEFINED。如果一致性点在任何一级数据缓存之前，则 IMPLEMENTATION DEFINED 当该控制的值为1时，是否可以捕获通过VA操作到一致性点的任何数据或统一缓存清理、无效或清理和无效指令的执行。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "指定缓存维护指令的非安全 EL1 执行陷入 EL2。"
            - name: "TSW"
              bits: "22"
              desc: "由Set/Way操作的Trap数据或统一缓存维护指令。当在当前安全状态下启用 EL2 时，通过设置/方式将这些高速缓存维护指令的非安全 EL1 执行陷入 EL2。以下系统指令的 MRC 和 MCR 访问将被捕获并使用 EC 综合征值 0x03 进行报告：\nDCISW、DCCSW、DCCISW。 EL0 处生成的未定义指令异常的优先级高于 EL2 的陷阱，并且这些指令在 EL0 处始终为 UNDEFINED。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "指定缓存维护指令的非安全 EL1 执行陷入 EL2。"
            - name: "TAC"
              bits: "21"
              desc: "陷阱辅助控制寄存器。当在当前安全状态下启用 EL2 时，从两个执行状态捕获对 EL2 辅助控制寄存器的非安全 EL1 访问。以下寄存器的 MRC 和 MCR 访问将被捕获并使用 EC 综合征值 0x03 进行报告：\nACTLR，如果实现，ACTLR2。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "对指定寄存器的非安全 EL1 访问将陷入 EL2。"
            - name: "TIDCP"
              bits: "20"
              desc: "陷阱 IMPLEMENTATION DEFINED 功能。当在当前安全状态下启用 EL2 时，陷阱非安全 EL1 对 EL2 系统寄存器的 IMPLEMENTATION DEFINED 编码的访问。以下编码的 MRC 和 MCR 访问将被捕获并使用 EC 综合征值 0x03 进行报告：\n所有 coproc==p15, CRn==c9, Opcode1 = {0-7}, CRm == {c0-c2, c5-c8}, opcode2 == {0-7}。所有 coproc==p15, CRn==c10, Opcode1 =={0-7}, CRm == {c0, c1, c4, c8}, opcode2 == {0-7}。所有 coproc==p15, CRn==c11, Opcode1=={0-7}, CRm == {c0-c8, c15}, opcode2 == {0-7}。当 HCR.TIDCP 设置为 1 时，IMPLEMENTATION DEFINED 从非安全 EL0 访问的任何此功能是否陷入 EL2。否则，它是UNDEFINED并且PE采取未定义指令异常到非安全未定义模式。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "对 IMPLEMENTATION DEFINED 功能的指定系统寄存器编码的非安全 EL1 访问陷入 EL2。"
            - name: "TSC"
              bits: "19"
              desc: "陷阱SMC指令。将 SMC 指令的非安全 EL1 执行陷入 Hyp 模式。 Armv8-A 架构允许但不要求将此陷阱应用于未通过条件代码检查的条件 SMC 指令，与其他条件指令上的陷阱相同。仅当实现包含 EL3 时，才会实现此陷阱。 SMC 指令在 PL0 处始终为 UNDEFINED。该位捕获 SMC 指令的执行，使用 EC 综合征值 0x13 报告。它不是 SMC 异常的路由控制。 Hyp Trap 异常和 SMC 异常具有不同的首选返回地址。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "无论 SCR.SCD 的值如何，任何在非安全 EL1 上执行 SMC 指令的尝试都会陷入 Hyp 模式。"
            - name: "TID3"
              bits: "18"
              desc: "陷阱ID组3。当当前安全状态下使能EL2时，陷阱非安全EL1读取以下寄存器到EL2，如下：\nVMRS 对 MVFR0、MVFR1 和 MVFR2 的访问，使用 EC 综合征值 0x08 进行报告，除非访问也被 [HCPTR 捕获] 优先。 MRC 使用 EC 综合征值 0x03 报告对以下寄存器的访问：\nID_PFR0、ID_PFR1、ID_PFR2、ID_DFR0、ID_AFR0、ID_MMFR0、ID_MMFR1、ID_MMFR2、ID_MMFR3、ID_ISAR0、ID_ISAR1、ID_ISAR2、ID_ISAR3、ID_ISAR4 和 ID_ISAR5。如果实现FEAT_FGT：\nID_MMFR4 和 ID_MMFR5 陷入 EL2。 ID_ISAR6 陷入 EL2。 ID_DFR1 陷入 EL2。该位域捕获对以下范围内尚未提及的寄存器的所有 MRC 访问\n该位域描述中：coproc == p15, opc1 == 0, CRn == c0, CRm == {c2-c7}, opc2 == {0-7}。如果FEAT_FGT未实现：\nID_MMFR4和ID_MMFR5陷入 EL2，除非实现为 RAZ，当它是 IMPLEMENTATION DEFINED 时是否访问ID_MMFR4 或 ID_MMFR5 被捕获。 ID_ISAR6 陷入 EL2，除非实现为 RAZ，当它是 IMPLEMENTATION DEFINED 时，对 ID_ISAR6 的访问是否陷入 EL2。 ID_DFR1 陷入 EL2，除非实现为 RAZ，当它是 IMPLEMENTATION DEFINED 时，对 ID_DFR1 的访问是否陷入 EL2。否则，该位是否捕获MRC对未提及的寄存器的访问由 IMPLEMENTATION DEFINED 决定，其中coproc == p15，opc1==0，CRn==c0，CRm == {c2-c7}，opc2 == {0-7}。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "对 ID 第 3 组寄存器的指定非安全 EL1 读取访问陷入 EL2。"
            - name: "TID2"
              bits: "17"
              desc: "陷阱ID组2。陷阱以下寄存器MRC和MCR对EL2的访问，使用EC报告综合征值0x03，当EL2在当前安全状态下启用：\n非安全 EL1 和 EL0 读取 CTR、CCSIDR、CCSIDR2、CLIDR、和CSSELR。非安全 EL1 和 EL0 写入 CSSELR。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "对 ID 第 2 组寄存器的指定非安全 EL1 和 EL0 访问陷入 EL2。"
            - name: "TID1"
              bits: "16"
              desc: "陷阱 ID 组 1。陷阱非安全 EL1 MRC 将以下寄存器读取到 EL2，使用 EC 综合征值 0x03 进行报告，当 EL2 时在当前安全状态下启用：\nTCMTR、TLBTR、REVIDR、AIDR。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "对 ID 组 1 寄存器的指定非安全 EL1 读取访问陷入 EL2。"
            - name: "TID0"
              bits: "15"
              desc: "陷阱ID组0。当在当前安全状态下启用EL2时，陷阱对EL2的以下寄存器访问：\n使用 EC 综合征值 0x08 报告的 FPSID 的非安全 EL1 VMRS 读取。使用 EC 综合征值报告 JIDR 的非安全 EL0 和 EL1 MCR 和 MRC 访问0x05。 JIDR 是 EL0 处的 RAZ 还是 UNDEFINED，它是 IMPLEMENTATION DEFINED。如果 EL0 处为 UNDEFINED，则未定义指令异常优先于该陷阱。 FPSID 无法在 EL0 处访问。对 FPSID 的写入将被忽略，并且不会被此控件捕获。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "对 ID 组 0 寄存器的指定非安全 EL1 读取访问陷入 EL2。"
            - name: "TWE"
              bits: "14"
              desc: "陷阱非安全 EL0 和 EL1 执行 WFE 指令到 EL2，使用 EC 综合征值 0x01 报告，当 EL2 时在当前安全状态下启用。仅当指令通过其条件代码检查时，才会捕获尝试执行条件 WFE 指令。由于WFE可以随时完成，即使没有唤醒事件，因此即使在没有唤醒事件时执行WFE，也不能保证WFE上的陷阱被采取。唯一的保证是，如果在没有唤醒事件的情况下指令未在有限时间内完成，则会捕获陷阱。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "任何在非安全 EL0 或 EL1 上执行 WFE 指令的尝试都会陷入 EL2，如果该指令会导致 PE 进入低功耗状态，并且没有被SCTLR.nTWE困住。"
            - name: "TWI"
              bits: "13"
              desc: "陷阱非安全 EL0 和 EL1 执行 WFI 指令到 EL2，使用 EC 综合征值 0x01 报告，当 EL2 时在当前安全状态下启用。仅当指令通过其条件代码检查时，才会捕获尝试执行条件 WFI 指令。由于WFI可以随时完成，即使没有唤醒事件，因此即使在没有唤醒事件时执行WFI，也不能保证WFI上的陷阱被采取。唯一的保证是，如果在没有唤醒事件的情况下指令未在有限时间内完成，则会捕获陷阱。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "任何在非安全 EL0 或 EL1 上执行 WFI 指令的尝试都会陷入 EL2，如果该指令会导致 PE 进入低功耗状态，并且没有被SCTLR.nTWI捕获。"
            - name: "DC"
              bits: "12"
              desc: "默认可缓存性。该位域对 EL2 和 EL3 地址转换机制没有影响。该位允许缓存在TLB中。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "此控制对非安全 EL1&0 地址转换机制没有影响。"
                - value: "0b1"
                  desc: "在非安全状态下：\n除了直接读取位域值之外，对于所有用途，SCTLR.M 位域都表现为 0。除了直接读取位域值之外，对于所有用途，HCR.VM 位域都表现为 1。 EL1&0 地址转换机制第一阶段产生的内存类型是正常不可共享、内部回写读分配写分配、外部写回读分配写分配。"
            - name: "BSU"
              bits: "11:10"
              desc: "屏障共享性升级。该位域确定应用于从非安全 EL1 或非安全 EL0 执行的任何屏障指令的最小可共享域：\n该值与其指令中保存的屏障的指定级别相结合，使用与组合来自地址转换的两个阶段的可共享性属性相同的原理。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'00'；温复位；否则；AU"
              values:
                - value: "0b00"
                  desc: "没有效果。"
                - value: "0b01"
                  desc: "内部可共享。"
                - value: "0b10"
                  desc: "外部可共享。"
                - value: "0b11"
                  desc: "完整的系统。"
            - name: "FB"
              bits: "9"
              desc: "强制广播。当从非安全 EL1 执行时，导致以下指令在内部共享域内广播：\nBPIALL、TLBIALL、TLBIMVA、TLBIASID、DTLBIALL、DTLBIMVA、 DTLBIASID、ITLBIALL、ITLBIMVA、ITLBIASID、TLBIMVAA、ICIALLU，TLBIMVAL，TLBIMVAAL。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该位域对指定指令的操作没有影响。"
                - value: "0b1"
                  desc: "当在非安全 EL1 执行指定指令之一时，该指令在内部可共享共享域内广播。"
            - name: "VA"
              bits: "8"
              desc: "虚拟SError异常。仅当HCR.{TGE, AMO}的值为{0, 1}时，才会启用虚拟SError异常。来宾OS无法区分虚拟异常和相应的物理异常。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "此机制不会使虚拟 SError 异常挂起。"
                - value: "0b1"
                  desc: "由于此机制，虚拟 SError 异常处于待处理状态。"
            - name: "VI"
              bits: "7"
              desc: "虚拟IRQ异常。仅当 HCR.{TGE, IMO} 的值为 {0, 1} 时，才启用虚拟 IRQ。来宾OS无法区分虚拟异常和相应的物理异常。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "此机制不会使虚拟 IRQ 挂起。"
                - value: "0b1"
                  desc: "由于此机制，虚拟 IRQ 处于待处理状态。"
            - name: "VF"
              bits: "6"
              desc: "虚拟FIQ异常。仅当HCR.{TGE, FMO}的值为{0, 1}时，虚拟FIQ才启用。来宾OS无法区分虚拟异常和相应的物理异常。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "此机制不会使虚拟 FIQ 挂起。"
                - value: "0b1"
                  desc: "由于此机制，虚拟 FIQ 处于待处理状态。"
            - name: "AMO"
              bits: "5"
              desc: "SError 异常掩码覆盖。当该位设置为 1 时，它会覆盖 PSTATE.A 的效果，并通过 VA 位启用虚拟异常信号。如果HCR.TGE的值为0，则在非安全状态下启用虚拟SError异常。如果 HCR.TGE 的值为 1，则在非安全状态下，HCR.AMO 位在除直接读取该位值之外的所有用途中都表现为 1。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
            - name: "IMO"
              bits: "4"
              desc: "IRQ 掩码覆盖。当该位设置为 1 时，它会覆盖 PSTATE.I 的效果，并通过 VI 位启用虚拟异常信号。如果HCR.TGE的值为0，则在非安全状态下启用虚拟IRQ中断。如果 HCR.TGE 的值为 1，则在非安全状态下，HCR.IMO 位在除直接读取该位值之外的所有用途中都表现为 1。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
            - name: "FMO"
              bits: "3"
              desc: "FIQ 掩码覆盖。当该位设置为 1 时，它会覆盖 PSTATE.F 的效果，并通过 VF 位启用虚拟异常信号。如果HCR.TGE的值为0，则在非安全状态下启用虚拟FIQ中断。如果 HCR.TGE 的值为 1，则在非安全状态下，HCR.FMO 位在除直接读取该位值之外的所有用途中都表现为 1。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
            - name: "PTW"
              bits: "2"
              desc: "受保护的桌子行走。在非安全 PL1&0 地址转换机制中，作为第 1 阶段转换表遍历的一部分进行的转换表访问将受到第 2 阶段转换的影响。来自两个地址转换阶段的存储器类型属性的组合意味着可以对设备存储器的类型进行访问。如果发生这种情况，则该位的值决定行为：\n该位允许缓存在TLB中。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "转换表的遍历就像是到普通的不可缓存内存一样。这意味着它可以推测性地进行。"
                - value: "0b1"
                  desc: "内存访问会生成第 2 阶段权限错误。"
            - name: "SWIO"
              bits: "1"
              desc: "设置/方式失效覆盖。导致数据缓存无效 EL1 执行非安全，按设置/方式指令执行数据缓存清理并按设置/方式无效。当该位设置为 1 时，DCISW 执行与 DCCISW 指令相同的无效操作。由于 DCISW 行为发生更改，该位在 Armv8 中是多余的。该位可实现为 RES1。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制对 set/way 指令的数据缓存无效操作没有影响。"
                - value: "0b1"
                  desc: "数据缓存按设置/方式无效指令执行数据缓存清理并按设置/方式无效。"
            - name: "VM"
              bits: "0"
              desc: "虚拟化启用。启用非安全 EL1&0 地址转换机制的第 2 阶段地址转换。如果 HCR.DC 位设置为 1，则 PE 在 Hyp 模式以外的非安全模式下执行时的行为与 HCR.VM 为 1 一致，无论 HCR.VM 的实际值如何，除了显式读取 HCR.VM 返回的值。当该位的值为 1 时，在非安全 EL1 下执行的数据缓存无效指令将执行数据缓存清理和无效。对于通过设置/方式无效指令，无论 HCR.SWIO 位的值如何，此行为都适用。该位允许缓存在TLB中。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "非安全 EL1&0 第 2 阶段地址转换已禁用。"
                - value: "0b1"
                  desc: "启用非安全 EL1&0 第 2 阶段地址转换。"
        - name: "HCR2"
          desc: "为虚拟化提供额外的配置控制。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "RES0"
              bits: "31:23"
              desc: "保留，RES0。"
            - name: "TTLBIS"
              bits: "22"
              source_condition: "When FEAT_EVT is implemented"
              desc: "在内部共享域上运行的陷阱TLB维护指令。捕获 EL1 至 EL2 处以下 TLB 维护指令的执行：\nTLBIALLIS、TLBIASIDIS、TLBIMVAAIS、TLBIMVAALIS、TLBIMVAIS 和 TLBIMVALIS当HCR_EL2.{E2H, TGE}的有效值为{1, 1}时，该位域的有效值为0。"
              condition: "当实现FEAT_EVT时"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "指定 TLB 维护指令的非安全 EL1 执行陷入 EL2。"
            - name: "RES0"
              bits: "22"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "21"
              desc: "保留，RES0。"
            - name: "TOCU"
              bits: "20"
              source_condition: "When FEAT_EVT is implemented"
              desc: "操作到统一点的陷阱缓存维护指令。在 EL1 到 EL2 处捕获 DCCMVAU、ICIALLU 和 ICIMVAU 的执行。如果统一点在任意一级数据缓存之前，则 IMPLEMENTATION DEFINED 当该控制的值为1时，是否可以捕获通过VA对统一点指令进行的任何数据或统一缓存清理的执行。如果统一点在任意级别指令缓存之前，则[实现定义]当该控制值为1时，是否可以捕获任何指令缓存无效到统一点指令的执行。当HCR_EL2.{E2H, TGE}的有效值为{1, 1}时，有效值为该位域的值为 0。"
              condition: "当实现FEAT_EVT时"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "指定缓存维护指令的非安全执行陷入 EL2。"
            - name: "RES0"
              bits: "20"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "19"
              desc: "保留，RES0。"
            - name: "TICAB"
              bits: "18"
              source_condition: "When FEAT_EVT is implemented"
              desc: "陷阱ICIALLUIS缓存维护指令。捕获 EL1 到 EL2 处的高速缓存维护指令的执行。\n这适用于以下指令：\nICIALLUIS。\n如果统一点在任何一级指令缓存之前，则 IMPLEMENTATION DEFINED 当该控制的值为1时，是否可以捕获任何指令缓存对统一点指令无效的执行。\n当HCR_EL2.{E2H, TGE}的有效值为{1, 1}时，该位域的有效值为0。"
              condition: "当实现FEAT_EVT时"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "指定缓存维护指令的非安全 EL1 执行陷入 EL2。"
            - name: "RES0"
              bits: "18"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "TID4"
              bits: "17"
              source_condition: "When FEAT_EVT is implemented"
              desc: "捕获ID组4。捕获对EL2的以下寄存器访问：\nEL1 读取 CCSIDR、CCSIDR2、CLIDR 和 CSSELR。 EL1 写入 CSSELR。当HCR_EL2.{E2H, TGE}的有效值为{1, 1}时，该位域的有效值为0。"
              condition: "当实现FEAT_EVT时"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "对 ID 组 4 寄存器的指定非安全 EL1 和 EL0 访问陷入 EL2。"
            - name: "RES0"
              bits: "17"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "16:6"
              desc: "保留，RES0。"
            - name: "TEA"
              bits: "5"
              source_condition: "When FEAT_RAS is implemented"
              desc: "将同步外部中止异常从 EL0 和 EL1 路由到 EL2。"
              condition: "当实现FEAT_RAS时"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "不将同步外部中止异常从非安全 EL0 和 EL1 路由到 EL2。"
                - value: "0b1"
                  desc: "如果未路由到 EL3，则将同步外部中止异常从非安全 EL0 和 EL1 路由到 EL2。"
            - name: "RES0"
              bits: "5"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "TERR"
              bits: "4"
              source_condition: "When FEAT_RAS is implemented"
              desc: "陷阱错误记录从EL1访问到EL2。陷阱 MRC 或 MCR 访问，使用 EC 综合征值 0x03 和 MRRC 或 MCRR 报告访问，使用 EC 综合征值 0x04 报告，从 EL1 到 EL2 的以下寄存器：\nERRIDR、ERRSELR、ERXADDR、ERXADDR2、ERXCTLR、ERXCTLR2、ERXFR、ERXFR2、ERXMISC0、ERXMISC1、ERXMISC2、 ERXMISC3 和 ERXSTATUS。实现 FEAT_RASv1p1 时，ERXMISC4、ERXMISC5、ERXMISC6 和 ERXMISC7。"
              condition: "当实现FEAT_RAS时"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "从 EL1 访问指定寄存器会生成 EL2 的陷阱异常。"
            - name: "RES0"
              bits: "4"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "3:2"
              desc: "保留，RES0。"
            - name: "ID"
              bits: "1"
              desc: "第 2 阶段 指令访问可缓存性禁用。对于非安全 PL1&0 地址转换机制，当 HCR.VM==1 时，此控制强制所有指令访问普通内存的第 2 阶段转换为不可缓存。该位对 EL2 地址转换机制没有影响。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "此控制对非安全 PL1&0 地址转换机制的第 2 阶段没有影响。"
                - value: "0b1"
                  desc: "对于非安全 PL1&0 地址转换机制，强制对普通内存的指令访问的所有第 2 阶段转换为不可缓存。"
            - name: "CD"
              bits: "0"
              desc: "第 2 阶段 数据访问可缓存性禁用。当 HCR.VM==1 时，这会强制数据访问的所有第 2 阶段转换和到普通内存的转换表步行对于非安全 PL1&0 地址转换机制是不可缓存的。该位对 EL2 地址转换机制没有影响。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "此控制对数据访问和转换表遍历的非安全 PL1&0 地址转换机制的第 2 阶段没有影响。"
                - value: "0b1"
                  desc: "对于非安全 PL1&0 地址转换机制，强制数据访问的所有第 2 阶段转换和到普通内存的转换表均不可缓存。"
        - name: "HDCR"
          desc: "控制对调试和跟踪架构以及性能监视器扩展提供的功能的非安全访问的 Hyp 模式的捕获（在 EL1 或更低）。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "RES0"
              bits: "31:30"
              desc: "保留，RES0。"
            - name: "HPMFZO"
              bits: "29"
              source_condition: "When FEAT_PMUv3p7 is implemented"
              desc: "Hyp 性能监视器溢出时冻结。溢出时停止事件计数器。如果 HDCR.HPMN 小于 PMCR.N，则该位域影响 [HDCR.HPMN .. (PMCR.N-1)] 范围内事件计数器的操作。该位域不影响其他事件计数器和PMCCNTR的操作。即使在当前安全状态下EL2被禁用，该位域的操作也适用。"
              condition: "当实现 FEAT_PMUv3p7 时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "溢出时不要冻结。"
                - value: "0b1"
                  desc: "当 PMOVSR[(PMCR.N-1):HDCR.HPMN] 非零时，事件计数器不计数。"
            - name: "RES0"
              bits: "29"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "MTPME"
              bits: "28"
              source_condition: "When FEAT_MTPMU is implemented and EL3 is not implemented"
              desc: "多线程PMU启用。允许使用 PMEVTYPER<n>.MT 位。\n如果系统中与 PE 具有相同 1 级亲和力的任何其他 PE 禁用 FEAT_MTPMU， PE 是否表现为该位为 0，由 IMPLEMENTATION DEFINED 决定。"
              condition: "当实现FEAT_MTPMU且未实现EL3时"
              reset_info: "冷复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'1'；冷复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "FEAT_MTPMU 已禁用。 PMEVTYPER<n>.MT 的有效值为 0。"
                - value: "0b1"
                  desc: "PMEVTYPER<n>.MT 位不受该位影响。"
            - name: "RES0"
              bits: "28"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "TDCC"
              bits: "27"
              source_condition: "When FEAT_FGT is implemented"
              desc: "陷阱DCC。捕获 EL1 和 EL0 到 EL2 处调试通信通道的使用。该控制捕获的 DCC 系统寄存器是：\nDBGDTRRXext、DBGDTRTXext、DBGDSCRint、DBGDCCINT，以及当PE处于非调试状态时，DBGDTRRXint 和 DBGDTRTXint。陷阱报告为 EC 综合征值：\n0x05 用于捕获 MRC 和 MCR 访问，且 coproc == 0b1110。 0x06 用于陷入 DBGDTRTXint 的 LDC 和来自 DBGDTRRXint 的 STC。当PE处于调试状态时，HDCR.TDCC不会捕获对以下内容的任何访问：\nDBGDTRRXint 和 DBGDTRTXint。"
              condition: "当实现FEAT_FGT时"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何寄存器访问被捕获。"
                - value: "0b1"
                  desc: "如果在当前安全状态下实现并启用了 EL2，则访问 EL1 和 EL0 处的 DCC 系统寄存器会生成 Hyp 陷阱异常，除非该访问还生成更高优先级的异常。当PE处于调试状态时，DCC数据传输寄存器上的陷阱将被忽略。"
            - name: "RES0"
              bits: "27"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "HLP"
              bits: "26"
              source_condition: "When FEAT_PMUv3p5 is implemented"
              desc: "管理程序长事件计数器启用。确定事件计数器溢出位何时记录无符号溢出。如果最高实现的异常级别使用AArch32，则无论该位是读/写还是 RAZ/WI，都是 IMPLEMENTATION DEFINED。如果 HDCR.HPMN 小于 PMCR.N，则该位影响 [HDCR.HPMN..(PMCR.N-1)] 范围内事件计数器的操作。该位域不影响其他事件计数器的操作。即使在当前安全状态下EL2被禁用，该位域的操作也适用。 PMEVCNTR<n>[63:32]在AArch32 状态下无法直接访问。"
              condition: "当实现 FEAT_PMUv3p5 时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "事件计数器增量溢出，导致 PMEVCNTR<n>[31:0] 无符号溢出。"
                - value: "0b1"
                  desc: "事件计数器增量溢出，导致 PMEVCNTR<n>[63:0] 无符号溢出。"
            - name: "RES0"
              bits: "26"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "25:24"
              desc: "保留，RES0。"
            - name: "HCCD"
              bits: "23"
              source_condition: "When FEAT_PMUv3p5 is implemented"
              desc: "管理程序周期计数器禁用。禁止PMCCNTR在EL2处计数。该位域不会影响 CPU_CYCLES 事件或任何其他计算周期的事件。"
              condition: "当实现 FEAT_PMUv3p5 时"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "PMCCNTR 的周期计数不受此机制的影响。"
                - value: "0b1"
                  desc: "EL2 禁止通过 PMCCNTR 进行循环计数。"
            - name: "RES0"
              bits: "23"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "22:20"
              desc: "保留，RES0。"
            - name: "TTRF"
              bits: "19"
              source_condition: "When FEAT_TRF is implemented"
              desc: "捕获 MRC 或 MCR 访问对 EL1 至 EL2 处跟踪过滤器控制寄存器的使用，使用 EC 综合征值 0x03 进行报告。"
              condition: "当实现FEAT_TRF时"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "对 EL1 处的 TRFCR 的访问不受该控制位的影响。"
                - value: "0b1"
                  desc: "访问 EL1 处的 TRFCR 会生成 Hyp 陷阱异常。"
            - name: "RES0"
              bits: "19"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "18"
              desc: "保留，RES0。"
            - name: "HPMD"
              bits: "17"
              source_condition: "When FEAT_PMUv3p1 is implemented and FEAT_Debugv8p2 is implemented"
              desc: "来宾性能监视器禁用。控制 Hyp 模式下的 PMU 操作。受该位域影响的计数器有：\nn 值小于 HDCR.HPMN 的事件计数器 PMEVCNTR<n>。如果PMCR.DP为1，则循环计数器PMCCNTR。其他事件计数器不受此位域的影响。当PMCR.DP为0时，PMCCNTR不受该位域影响。"
              condition: "当实现FEAT_PMUv3p1并且实现FEAT_Debugv8p2时"
              reset_info: "温复位；FEAT_AA64未实现；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "计数器不受此机制的影响。"
                - value: "0b1"
                  desc: "受影响的计数器禁止在 Hyp 模式下计数。如果 PMCR.DP 为 1，则在 Hyp 模式下禁用 PMCCNTR。否则，PMCCNTR不受此机制的影响。"
            - name: "HPMD"
              bits: "17"
              source_condition: "When FEAT_PMUv3p1 is implemented"
              desc: "来宾性能监视器禁用。当 ExternalSecureNoninvasiveDebugEnabled() 为 FALSE 时，控制 Hyp 模式下的 PMU 操作。如果 ExternalSecureNoninvasiveDebugEnabled() 为 TRUE，则事件计数器和 PMCCNTR 不受此位域的影响。否则，受该位域影响的计数器为：\nn 值小于 HDCR.HPMN 的事件计数器 PMEVCNTR<n>。如果PMCR.DP为1，则周期计数器为PMCCNTR。其他事件计数器不受此位域的影响。当PMCR.DP为0时，PMCCNTR不受该位域影响。"
              condition: "当实现 FEAT_PMUv3p1 时"
              reset_info: "温复位；FEAT_AA64未实现；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "计数器不受此机制的影响。"
                - value: "0b1"
                  desc: "如果 ExternalSecureNoninvasiveDebugEnabled() 为 FALSE，则以下所有内容均适用：\n受影响的事件计数器禁止在 Hyp 模式下计数。如果 PMCR.DP 为 1，则 PMCCNTR 在 Hyp 模式下禁用。否则，PMCCNTR不受此机制的影响。"
            - name: "RES0"
              bits: "17"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "16:12"
              desc: "保留，RES0。"
            - name: "TDRA"
              bits: "11"
              desc: "陷阱调试ROM 地址寄存器访问。陷阱非安全 EL0 和 EL1 系统寄存器 MRC 或 MCR 访问，使用 EC 综合征值 0x05 和 MRRC访问，使用EC综合征值0x0C报告，到调试ROM寄存器到Hyp模式。如果 HCR.TGE 或 HDCR.TDE 为 1，则行为如同该位为 1，除非用于直接读取。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "非安全 EL0 和 EL1 对 DBGDRAR 或 DBGDSAR 的系统寄存器访问被捕获为 Hyp 模式，除非它被 DBGDSCRext.UDCCdis。"
            - name: "TDOSA"
              bits: "10"
              source_condition: "When FEAT_DoubleLock is implemented"
              desc: "陷阱调试OS相关寄存器访问。陷阱非安全 EL1 系统寄存器 MRC 或 MCR 访问，使用 EC 综合征值 0x05 报告，以将系统寄存器掉电调试为 Hyp 模式。访问被捕获的寄存器如下：\nDBGOSLSR、DBGOSLAR、DBGOSDLR 和 DBGPRCR。具有类似功能且实现指定为由该位捕获的任何 IMPLEMENTATION DEFINED 寄存器。这些寄存器在 EL0.If 处不可访问。如果 HCR.TGE 或 HDCR.TDE 为 1，则行为如同该位为 1，除非用于直接读取。"
              condition: "当实现FEAT_DoubleLock时"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "非安全 EL1 对掉电调试的系统寄存器访问 系统寄存器被捕获为 Hyp 模式。"
            - name: "TDOSA"
              bits: "10"
              source_condition: "Otherwise"
              desc: "陷阱调试OS相关寄存器访问。陷阱非安全 EL1 系统寄存器 MRC 或 MCR 访问，使用 EC 综合征值 0x05 报告，以将系统寄存器掉电调试为 Hyp 模式。访问被捕获的寄存器如下：\nDBGOSLSR、DBGOSLAR 和 DBGPRCR。具有类似功能且实现指定为由该位捕获的任何 IMPLEMENTATION DEFINED 寄存器。是否捕获对 DBGOSDLR 的访问由 IMPLEMENTATION DEFINED 决定。这些寄存器在 EL0.If 处不可访问。如果 HCR.TGE 或 HDCR.TDE 为 1，则行为如同该位为 1，除非用于直接读取。"
              condition: "否则"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "非安全 EL1 对掉电调试的系统寄存器访问 系统寄存器被捕获为 Hyp 模式。"
            - name: "TDA"
              bits: "9"
              desc: "陷阱调试访问。陷阱非安全 EL0 和 EL1 系统寄存器 MRC 或 MCR 访问，使用 EC 综合征值 0x05 报告到这些调试系统寄存器(coproc==0b1110) 不被以下任一情况捕获的编码空间：\nHDCR.TDRA。 HDCR.TDOSA。在调试状态下，AArch32 访问 DBGDTRRXint 和 DBGDTRTXint 的陷阱将被忽略。如果 HCR.TGE 或 HDCR.TDE 为 1，则除了直接读取之外，行为就像该位为 1 一样。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "非安全 EL0 或 EL1 系统寄存器对调试的访问 除由 HDCR.TDRA 和 HDCR.TDOSA 捕获的寄存器外，系统寄存器均被捕获为 Hyp 模式，除非它被DBGDSCRext.UDCCdis。"
            - name: "TDE"
              bits: "8"
              desc: "捕获调试异常。控制调试异常的路由，并定义调试目标异常级别 ELD。有关详细信息，请参阅“路由调试异常”。当 HCR.TGE == 1 时，除了返回直接读取寄存器的值之外，PE 的行为就像该位域的值为 1 一样。"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "调试目标异常级别为EL1。"
                - value: "0b1"
                  desc: "如果 SCR.NS 的当前有效值启用了 EL2，则调试目标异常级别为 EL2，否则调试目标异常级别为 EL1。 HDCR.{TDRA、TDOSA、TDA} 位域在除返回直接读取寄存器的结果之外的所有用途中都被视为 1。"
            - name: "HPME"
              bits: "7"
              source_condition: "When FEAT_PMUv3 is implemented"
              desc: "炒作启用。受此位域影响的计数器是事件计数器 PMEVCNTR<n>（n 的值大于或等于 HDCR.HPMN 且小于 PMCR.N。即使在当前安全状态下禁用EL2，这也适用。其他事件计数器和PMCCNTR不受该位域影响。如果HDCR.HPMN等于PMCR.N，则该位域无效。"
              condition: "当实现 FEAT_PMUv3 时"
              reset_info: "温复位；FEAT_AA64未实现；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "受影响的计数器被禁用并且不计数。"
                - value: "0b1"
                  desc: "受影响的计数器由 PMCNTENSET 启用。"
            - name: "RES0"
              bits: "7"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "TPM"
              bits: "6"
              source_condition: "When FEAT_PMUv3 is implemented"
              desc: "PMU 系统寄存器的陷阱访问。在访问 PMU 系统寄存器时启用对 EL2 的陷阱。受此控制影响的指令是：\nMRC 和 MCR 访问 PMCCFILTR、PMCCNTR、PMCNTENCLR、PMCNTENSET、PMCR、PMEVCNTR<n>、PMEVTYPER<n>、PMINTENCLR、PMINTENSET、PMOVSR、PMOVSSET、PMSELR、PMSWINC、PMUSERENR、PMXEVCNTR和PMXEVTYPER。 MRC 访问 PMCEID0 和 PMCEID1。 MRRC 和 MCRR 访问 PMCCNTR。如果实现 FEAT_PMUv3p1，则 MRC 访问 PMCEID2 和 PMCEID3。如果实现FEAT_PMUv3p4，则MRC访问PMMIR。除非指令生成更高优先级的异常，否则被捕获的指令将生成 Hyp Trap 异常。对于 MRC 和 MCR 访问，使用 EC 综合征值 0x03 报告，对于 MRRC 使用 0x04 报告捕获的指令和MCRR访问。"
              condition: "当实现 FEAT_PMUv3 时"
              reset_info: "温复位；FEAT_AA64未实现；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "此机制不会捕获指定PMU系统寄存器的访问。"
                - value: "0b1"
                  desc: "对 EL1 和 EL0 处指定的 PMU 系统寄存器的访问将陷入 EL2，除非指令生成更高优先级的异常。"
            - name: "RES0"
              bits: "6"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "TPMCR"
              bits: "5"
              source_condition: "When FEAT_PMUv3 is implemented"
              desc: "陷阱 PMCR 访问。将对 PMCR 的非安全 EL0 和 EL1 MCR 或 MRC 访问陷入 Hyp 模式，使用 EC综合征值0x03。 EL2 不通过可选的内存映射外部调试接口提供性能监视器系统寄存器访问的陷阱。"
              condition: "当实现 FEAT_PMUv3 时"
              reset_info: "温复位；最高实现的异常级别为EL3或最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "对 PMCR 的非安全 EL0 和 EL1 访问将被捕获为 Hyp 模式，除非它被 PMUSERENR.EN 捕获。"
            - name: "RES0"
              bits: "5"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "HPMN"
              bits: "4:0"
              source_condition: "When FEAT_PMUv3 is implemented"
              desc: "定义可从 EL1 以及（如果允许）从 EL0 访问的事件计数器 PMEVCNTR<n> 的数量。 HDCR.HPMN将事件计数器分为第一范围和第二范围。如果 HDCR.HPMN 不为 0 并且小于 PE 实现的 PMU 事件计数器的数量，NUM_PMU_COUNTERS，则事件计数器 HDCR.HPMN-1)] 在第一范围内，其余事件计数器 [HDCR.HPMN..(NUM_PMU_COUNTERS-1)] 在第二范围内。如果实现 FEAT_HPMN0 并且 HDCR.HPMN 为 0，则以下所有内容均适用：\n第一范围内没有事件计数器。所有事件计数器都在第二范围内。如果 HDCR.HPMN 等于 NUM_PMU_COUNTERS，或者 EL2 未实现，则\n以下所有条件均适用：\n所有事件计数器都在第一个范围内。第二范围内没有事件计数器。以下所有内容都适用于第一个范围内的事件计数器 PMEVCNTR<n>：\n可从 EL1、EL2 和 EL3 访问计数器。如果 PMUSERENR 允许，可以从 EL0 访问计数器。如果实现 FEAT_PMUv3p5，则 PMCR.LP 确定是否在 PMEVCNTR<n>[31:0] 或 PMEVCNTR 的无符号溢出时设置计数器溢出标志 PMOVSSET[n]<n>[63:0]。 PMEVCNTR<n>[63:32]在AArch32 状态下无法直接访问。 PMCR.E 和 PMCNTENSET[n] 使能事件计数器的操作。以下所有内容都适用于第二个范围内的事件计数器 PMEVCNTR<n>：\n可从EL2和EL3访问计数器。如果在当前安全状态下禁用 EL2，则可从 EL1 访问事件计数器，如果 PMUSERENR 允许，则可从 EL0 访问事件计数器。如果实现 FEAT_PMUv3p5，则 HDCR.HLP 确定是否在 PMEVCNTR<n>[31:0] 或 PMEVCNTR 的无符号溢出时设置计数器溢出标志 PMOVSSET[n]<n>[63:0]。 PMEVCNTR<n>[63:32]在AArch32 状态下无法直接访问。 HDCR.HPME 和 PMCNTENSET[n] 启用事件计数器的操作。大于 NUM_PMU_COUNTERS 的值被保留。如果未实现FEAT_HPMN0，则保留值0。如果该位域设置为保留值，则适用以下 CONSTRAINED UNPREDICTABLE 行为：\n直接读取HDCR.HPMN返回的值为 UNKNOWN。第一和第二范围中的每一个中的事件计数器的数量是 UNKNOWN。也就是说，要么： PE 的行为就好像 HDCR.HPMN 设置为小于或等于 NUM_PMU_COUNTERS 的 UNKNOWN 非零值。所有计数器都在第二范围内，没有一个计数器在第一范围内。"
              condition: "当实现 FEAT_PMUv3 时"
              reset_info: "温复位；NUM_PMU_COUNTERS"
            - name: "RES0"
              bits: "4:0"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
        - name: "HDFAR"
          desc: "保存导致进入 Hyp 模式的同步数据中止异常的故障地址的虚拟地址。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "VA"
              bits: "31:0"
              desc: "进入 Hyp 模式的同步数据中止异常的故障地址的 VA 进入 Hyp 模式的同步数据中止异常的故障地址的 VA。在预取中止异常时，该寄存器为 UNKNOWN。在非安全 EL1 或非安全 EL0 模式下的任何执行都会使该寄存器 UNKNOWN。"
              reset_info: "温复位；AU"
        - name: "HIFAR"
          desc: "保存导致进入 Hyp 模式的同步预取中止异常的故障地址的虚拟地址。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "VA"
              bits: "31:0"
              desc: "进入 Hyp 模式的同步预取中止异常的故障地址的 VA 进入 Hyp 模式的同步预取中止异常的故障地址的 VA。在数据中止异常时，该寄存器为 UNKNOWN。在非安全 EL1 或非安全 EL0 模式下的任何执行都会使该寄存器 UNKNOWN。"
              reset_info: "温复位；AU"
        - name: "HPFAR"
          desc: "保留故障 IPA，以处理进入 Hyp 模式的第 2 阶段转换中的某些中止。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "FIPA[39:12]"
              bits: "31:4"
              desc: "故障中间物理地址的位[39:12]。"
              reset_info: "温复位；AU"
            - name: "RES0"
              bits: "3:0"
              desc: "保留，RES0。"
        - name: "HRMR"
          desc: "如果 EL2 是最高实现的异常级别并且该寄存器被实现："
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "RES0"
              bits: "31:2"
              desc: "保留，RES0。"
            - name: "RR"
              bits: "1"
              desc: "重置请求。将此位设置为 1 请求温复位。"
              reset_info: "温复位；'0'"
            - name: "AA64"
              bits: "0"
              source_condition: "When Implementation can reset into AArch64 state"
              desc: "确定热重置后 PE 启动进入的执行状态：\n退出温复位后，将从指定执行状态的 IMPLEMENTATION DEFINED 复位向量地址开始执行。"
              condition: "当实现可以重置为 AArch64 状态时"
              reset_info: "冷复位；'0'"
              values:
                - value: "0b0"
                  desc: "AArch32。"
                - value: "0b1"
                  desc: "AArch64。"
            - name: "RAZ/WI"
              bits: "0"
              source_condition: "Otherwise"
              desc: "保留，RAZ/WI。"
              condition: "否则"
        - name: "HSCTLR"
          desc: "在 Hyp 模式下提供系统操作的顶层控制。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "DSSBS"
              bits: "31"
              source_condition: "When FEAT_SSBS is implemented"
              desc: "异常条目上的默认 PSTATE.SSBS 值。定义的值为："
              condition: "当实现FEAT_SSBS时"
              reset_info: "温复位；ID"
              values:
                - value: "0b0"
                  desc: "在 Hyp 模式异常情况下，PSTATE.SSBS 设置为 0。"
                - value: "0b1"
                  desc: "在 Hyp 模式异常情况下，PSTATE.SSBS 设置为 1。"
            - name: "RES0"
              bits: "31"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "TE"
              bits: "30"
              desc: "T32 异常启用。该位控制 EL2 异常是否进入 A32 或 T32 状态："
              reset_info: "温复位；ID"
              values:
                - value: "0b0"
                  desc: "异常（包括复位）进入 A32 状态。"
                - value: "0b1"
                  desc: "异常（包括复位）进入 T32 状态。"
            - name: "RES1"
              bits: "29:28"
              desc: "保留，RES1。"
            - name: "RES0"
              bits: "27:26"
              desc: "保留，RES0。"
            - name: "EE"
              bits: "25"
              source_condition: "When FEAT_MixedEnd is implemented"
              desc: "进入 Hyp 模式时 PSTATE.E 位的值，第 1 阶段转换表的字节序遵循 EL2 地址转换机制，第 2 阶段转换表的字节序遵循 PL1&0 地址转换机制。"
              condition: "当实现FEAT_MixedEnd时"
              reset_info: "温复位；ID"
              values:
                - value: "0b0"
                  desc: "小端法。进入 Hyp 模式时，PSTATE.E 被清除为 0。第 1 阶段地址转换表在 EL2 地址转换体系中行走，第 2 阶段地址转换表在 PL1&0 地址转换体系中行走是小端。"
                - value: "0b1"
                  desc: "大端。进入 Hyp 模式时，PSTATE.E 设置为 1。第 1 阶段地址转换表在 EL2 地址转换体系中行走，第 2 阶段地址转换表在 PL1&0 地址转换体系中行走，均为大端序。"
            - name: "RES1"
              bits: "25"
              source_condition: "When FEAT_BigEnd is implemented"
              desc: "EL1 处的显式数据访问以及 EL1&0 地址转换机制中的第 1 阶段转换表遍历都是大端字节序。保留，RES1。"
              condition: "当实现FEAT_BigEnd时"
            - name: "RES1"
              bits: "25"
              source_condition: "Otherwise"
              desc: "EL1 处的显式数据访问以及 EL1&0 地址转换机制中的第 1 阶段转换表遍历都是小端字节序。保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "24"
              desc: "保留，RES0。"
            - name: "RES1"
              bits: "23:22"
              desc: "保留，RES1。"
            - name: "RES0"
              bits: "21:20"
              desc: "保留，RES0。"
            - name: "WXN"
              bits: "19"
              desc: "写权限意味着XN（从不执行）。对于 EL2 地址转换机制，该位可以强制所有可写的内存区域被视为 XN。该位仅在 HSCTLR.M 位设置时适用。该位允许缓存在TLB中。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "此控制对内存访问权限没有影响。"
                - value: "0b1"
                  desc: "在 EL2 地址转换机制中可写的任何区域都被强制为 XN，以便从在 EL2 执行的软件进行访问。"
            - name: "RES1"
              bits: "18"
              desc: "保留，RES1。"
            - name: "RES0"
              bits: "17"
              desc: "保留，RES0。"
            - name: "RES1"
              bits: "16"
              desc: "保留，RES1。"
            - name: "RES0"
              bits: "15:13"
              desc: "保留，RES0。"
            - name: "I"
              bits: "12"
              desc: "指令访问高速缓存能力控制，用于 EL2 处的访问：\n该位对 PL1&0 地址转换机制没有影响。"
              reset_info: "温复位；最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "所有从EL2访问普通内存的指令对于所有级别的指令和统一缓存都是不可缓存的。如果 HSCTLR.M 的值为 0，则来自 EL2 地址转换机制的阶段 1 的指令访问为正常、外部可共享、内部不可高速缓存、外部不可高速缓存存储器。"
                - value: "0b1"
                  desc: "所有从EL2访问Normal内存的指令都可以被各级指令缓存并统一缓存。如果 HSCTLR.M 的值为 0，则来自 EL2 地址转换机制的阶段 1 的指令访问为正常、外部可共享、内部直写、外部直写存储器。"
            - name: "RES1"
              bits: "11"
              desc: "保留，RES1。"
            - name: "RES0"
              bits: "10:9"
              desc: "保留，RES0。"
            - name: "SED"
              bits: "8"
              desc: "SETEND指令禁用。禁用 EL2 处的 SETEND 指令。如果实现不支持 EL2 处的混合端操作，则该位为 RES1。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "SETEND指令在EL2处启用。"
                - value: "0b1"
                  desc: "SETEND 指令在 EL2 处为 UNDEFINED。"
            - name: "ITD"
              bits: "7"
              desc: "IT 禁用。禁用 EL2 处 IT 指令的某些使用。如果活动 IT 块中的一条指令将被该位域禁用，则将该位域设置为 1，则行为为 CONSTRAINED UNPREDICTABLE。有关详细信息，请参阅“通过 IT 块中的指令对 ITD 控制进行更改”。 ITD 是可选的，但如果它在 HSCTLR 中实现，那么它也必须在 SCTLR_EL1、SCTLR_EL2 和 SCTLR。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "所有 IT 指令功能均在 EL2 处启用。"
                - value: "0b1"
                  desc: "任何在 EL2 执行以下任何操作的尝试都是 UNDEFINED：\nIT指令的所有编码为hw1[3:0]!=1000。 hw1：0b11xxxxxxxxxxxxxx：所有 32 位指令以及 16 位指令 B、UDF、SVC、LDM 和 STM 的后续指令的所有编码。 0b1011xxxxxxxxxxxx：“杂项 16 位指令”中的所有指令。 0b10100xxxxxxxxxxx：ADD路，PC，#imm 0b01001xxxxxxxxxxx：LDR路，[PC，#imm] 0b0100x1xxx1111xxx：ADD Rdn，PC； CMPRn，PC； MOV路，PC； BXPC; BLX PC。 0b010001xx1xxxx111：ADDPC，Rm； CMPPC，Rm； MOV PC，房间。此模式还涵盖了 BLX 不可预测的情况\nRN。这些指令始终为 UNDEFINED，无论它们是否因位于 IT 块中而通过或未通过适用于它们的条件代码检查。 IT 指令是否被视为： IMPLEMENTATION DEFINED\n一条 16 位指令，后面只能跟另一条 16 位指令。 32 位指令的前半部分。这意味着，对于UNDEFINED的情况，第二个16 位指令或32 位指令是UNDEFINED。关于 IT 是否被视为 16 位指令或 32 位指令的前半部分，实现可能会动态变化。"
            - name: "RES0"
              bits: "6"
              desc: "保留，RES0。"
            - name: "CP15BEN"
              bits: "5"
              desc: "系统指令内存屏障启用。允许从 EL2 访问 (coproc==0b1111) 编码空间中的 DMB、DSB 和 ISB 系统指令：\nCP15BEN 是可选的，但如果它在 HSCTLR 中实现，那么它也必须在 SCTLR_EL1、SCTLR_EL2 和 SCTLR。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "EL2 CP15DMB、CP15DSB 和 CP15ISB 指令的执行是 UNDEFINED。"
                - value: "0b1"
                  desc: "EL2 允许执行 CP15DMB、CP15DSB 和 CP15ISB 指令。"
            - name: "LSMAOE"
              bits: "4"
              source_condition: "When FEAT_LSMAOC is implemented"
              desc: "加载多个和存储多个原子性和排序启用。该位允许缓存在TLB中。"
              condition: "当实现FEAT_LSMAOC时"
              reset_info: "温复位；最高实现的异常级别为EL2；'1'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "对于 EL2、T32 和 A32 处的所有存储器访问，Load Multiple 和 Store Multiple 可以在顺序存储器访问期间发生中断，并且存储器访问不需要排序。"
                - value: "0b1"
                  desc: "T32 和 A32 在 EL2 处加载多个和存储多个的排序和中断行为与 Armv8.0 的定义相同。"
            - name: "RES1"
              bits: "4"
              source_condition: "Otherwise"
              desc: "保留，RES1。"
              condition: "否则"
            - name: "nTLSMD"
              bits: "3"
              source_condition: "When FEAT_LSMAOC is implemented"
              desc: "无陷阱加载多个并将多个存储到设备-nGRE/设备-nGnRE/设备-nGnRnE内存。该位允许缓存在TLB中。"
              condition: "当实现FEAT_LSMAOC时"
              reset_info: "温复位；最高实现的异常级别为EL2；'1'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "T32 和 A32 在 EL2 处加载多个和存储多个的所有内存访问在阶段 1 标记为 Device-nGRE/Device-nGnRE/Device-nGnRnE 内存被捕获并生成第 1 阶段对齐故障。"
                - value: "0b1"
                  desc: "T32 和 A32 在 EL2 处加载多个和存储多个的所有内存访问在阶段 1 标记为 Device-nGRE/Device-nGnRE/Device-nGnRnE 内存未捕获。"
            - name: "RES1"
              bits: "3"
              source_condition: "Otherwise"
              desc: "保留，RES1。"
              condition: "否则"
            - name: "C"
              bits: "2"
              desc: "缓存能力控制，用于 EL2 处的数据访问：\n该位对 PL1&0 地址转换机制没有影响。"
              reset_info: "温复位；最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "所有从EL2到Normal内存的数据访问，以及所有对EL2转换表的访问，对于所有级别的数据和统一缓存都是不可缓存的。"
                - value: "0b1"
                  desc: "所有从EL2到Normal内存的数据访问，以及所有对EL2转换表的访问，都可以被各级数据缓存并统一缓存。"
            - name: "A"
              bits: "1"
              desc: "启用对齐检查。这是 EL2 处的对齐故障检查的使能位：\n无论 A 位的值如何，加载/存储独占和加载获取/存储释放指令都会进行对齐检查。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "在 EL2 执行时禁用对齐故障检查。加载或存储一个或多个寄存器的指令（除了加载/存储独占和加载-获取/存储-释放之外）不检查正在访问的地址是否与正在访问的一个或多个数据元素的大小对齐。"
                - value: "0b1"
                  desc: "在 EL2 执行时启用对齐错误检查。加载或存储一个或多个寄存器的所有指令都具有对齐检查，以确保正在访问的地址与正在访问的一个或多个数据元素的大小对齐。如果此检查失败，则会导致对齐错误，这被视为数据中止异常。"
            - name: "M"
              bits: "0"
              desc: "MMU 启用 EL2 第 1 阶段地址转换。该位的可能值为："
              reset_info: "温复位；最高实现的异常级别为EL2；'0'；温复位；否则；AU"
              values:
                - value: "0b0"
                  desc: "EL2 阶段 1 地址转换已禁用。有关指令访问普通内存的行为，请参阅 HSCTLR.I 位域。"
                - value: "0b1"
                  desc: "EL2 启用第 1 阶段地址转换。"
        - name: "HSR"
          desc: "保存进入 Hyp 模式的异常的综合征信息。"
          condition: "当实现 FEAT_AA32EL2 时"
          fields:
            - name: "EC"
              bits: "31:26"
              desc: "异常类。指示该寄存器保存信息的异常原因。该位域的可能值有：\n所有其他 EC 值均由 Arm 保留，并且：\n0b000000 - 0b101100 (0x00 - 0x2C) 范围内未使用的值保留供将来用于同步异常。 0b101101 - 0b111111 (0x2D - 0x3F) 范围内未使用的值保留供将来使用，并且可能用于同步或异步异常。将此位域编程为保留值的效果是行为 CONSTRAINED UNPREDICTABLE。"
              reset_info: "温复位；AU"
              values:
                - value: "0b000000"
                  desc: "原因不明。"
                - value: "0b000001"
                  desc: "被困WFI或WFE指令执行。条件代码检查失败的条件 WFE 和 WFI 指令不会导致异常。"
                - value: "0b000011"
                  desc: "使用 (coproc==0b1111) 捕获的 MCR 或 MRC 访问未使用 EC 值 0b000000 进行报告。"
                - value: "0b000100"
                  desc: "使用 (coproc==0b1111) 捕获的 MCRR 或 MRRC 访问未使用 EC 值 0b000000 进行报告。"
                - value: "0b000101"
                  desc: "使用 (coproc==0b1110) 捕获 MCR 或 MRC 访问。"
                - value: "0b000110"
                  desc: "被困 LDC 或 STC 访问。这些指令的唯一架构用途是：\n将数据从 DBGDTRRXint 写入内存的 STC。一个LDC从内存读取数据到DBGDTRTXint。"
                - value: "0b000111"
                  desc: "访问高级 SIMD 或由 HCPTR.{TASE、TCP10} 控件捕获的浮点功能。排除由于未实现高级 SIMD 和浮点而生成的异常。这些报告的 EC 值为 0b000000。"
                - value: "0b001000"
                  desc: "来自 ID 组陷阱的 VMRS 访问被捕获，未使用 EC 值 0b000111 报告。"
                - value: "0b001100"
                  desc: "使用 (coproc==0b1110) 捕获 MRRC 访问。"
                - value: "0b001110"
                  desc: "非法异常返回AArch32 状态。"
                - value: "0b010001"
