    - name: "Reset Management"
      title: "复位管理"
      access: "MRS / MSR 系统寄存器接口"
      desc: "Arm AArch32 架构系统寄存器：复位管理"
      registers:
        - name: "RMR"
          desc: "如果EL1或EL3是最高实现的异常级别并且该寄存器被实现："
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:2"
              desc: "保留，RES0。"
            - name: "RR"
              bits: "1"
              desc: "重置请求。将此位设置为 1 请求温复位。"
              reset_info: "温复位；'0'"
            - name: "AA64"
              bits: "0"
              source_condition: "When Implementation can reset into AArch64 state"
              desc: "确定热重置后 PE 启动进入的执行状态：\n退出温复位后，将从指定执行状态的 IMPLEMENTATION DEFINED 复位向量地址开始执行。"
              condition: "当实现可以重置为 AArch64 状态时"
              reset_info: "冷复位；'0'"
              values:
                - value: "0b0"
                  desc: "AArch32。"
                - value: "0b1"
                  desc: "AArch64。"
            - name: "RAZ/WI"
              bits: "0"
              source_condition: "Otherwise"
              desc: "保留，RAZ/WI。"
              condition: "否则"
        - name: "RVBAR"
          desc: "如果EL3未实现，则包含在AArch32 状态下执行时复位后开始执行的 IMPLEMENTATION DEFINED 地址。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "ResetAddress"
              bits: "31:1"
              desc: "在 32 位状态下执行时，复位后开始执行的 IMPLEMENTATION DEFINED 地址的位 [31:1]。该位域具有 IMPLEMENTATION DEFINED 值。"
            - name: "RES1"
              bits: "0"
              desc: "保留，RES1。"
    - name: "Secure"
      title: "安全"
      access: "MRS / MSR 系统寄存器接口"
      desc: "Arm AArch32 架构系统寄存器：安全"
      registers:
        - name: "MVBAR"
          desc: "当EL3被实现并且可以使用AArch32 时，保存进入监控模式的任何异常的向量基地址。"
          condition: "当实现 FEAT_AA32EL3 时"
          fields:
            - name: "VBA"
              bits: "31:5"
              source_condition: "When programmed with a vector base address"
              desc: "向量基地址 向量基地址。进入此异常级别的异常的异常向量基地址的位[31:5]。异常向量的位[4:0]是异常偏移量。"
              condition: "当使用向量基地址编程时"
            - name: "Reserved"
              bits: "4:0"
              source_condition: "When programmed with a vector base address"
              desc: "保留，请参阅配置。"
              condition: "当使用向量基地址编程时"
        - name: "NSACR"
          desc: "当实现EL3并可以使用AArch32 时，定义对跟踪、高级SIMD和浮点功能的非安全访问权限。还包括 IMPLEMENTATION DEFINED 位，可以定义 IMPLEMENTATION DEFINED 功能的非安全访问权限。"
          condition: "当实现 FEAT_AA32EL1 时"
          fields:
            - name: "RES0"
              bits: "31:21"
              desc: "保留，RES0。"
            - name: "NSTRCDIS"
              bits: "20"
              desc: "禁用对所有已实现的跟踪系统寄存器的非安全系统寄存器访问。该位域的实现必须对应于CPACR.TRCDIS位域的实现：\n如果CPACR.TRCDIS为 RAZ/WI，则该位域为 RAZ/WI。如果CPACR.TRCDIS为RW，则该位域为RW。 FEAT_ETMv4 和 FEAT_ETE 不允许 EL0 访问跟踪系统寄存器。 EL0 对跟踪系统寄存器的访问是UNDEFINED。 Arm 架构不通过可选的内存映射外部调试 interface.System 寄存器访问来提供对跟踪寄存器访问的非安全访问控制。对跟踪系统寄存器的访问可能会产生副作用。当系统寄存器访问被捕获时，在发生异常之前不会发生通常与该访问相关的任何副作用。"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "该控制对以下方面没有影响：\n系统寄存器访问已实现的跟踪系统寄存器。 CPACR.TRCDIS 和 HCPTR.TTA 的行为。"
                - value: "0b1"
                  desc: "对所有已实现的跟踪系统寄存器的非安全系统寄存器访问被禁用，这意味着：\nCPACR.TRCDIS 在非安全状态下的行为与 RAO/WI 相同，无论其实际值如何。 HCPTR.TTA 的行为与 RAO/WI 相同，无论其实际值如何。"
            - name: "RES0"
              bits: "19"
              desc: "保留，RES0。"
            - name: "IMPLEMENTATION DEFINED"
              bits: "18:16"
              desc: "IMPLEMENTATION DEFINED。"
            - name: "NSASEDIS"
              bits: "15"
              desc: "禁用对高级 SIMD 功能的非安全访问。该位域的实现必须对应于 CPACR.ASEDIS 位域的实现：\n如果CPACR.ASEDIS为 RES0，则该位域为 RES0。如果实现不包括高级 SIMD 和浮点功能，则该位域为 RES0。如果CPACR.ASEDIS为 RAZ/WI，则该位域为 RAZ/WI。如果CPACR.ASEDIS为RW，则该位域为RW。"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "该控制对以下方面没有影响：\n对高级 SIMD 功能的非安全访问。 CPACR.ASEDIS 和 HCPTR.TASE 的行为。"
                - value: "0b1"
                  desc: "对高级 SIMD 功能的非安全访问已禁用，这意味着：\nCPACR.ASEDIS 在非安全状态下的行为与 RAO/WI 相同，无论其实际值如何。 HCPTR.TASE 的行为与 RAO/WI 相同，无论其实际值如何。"
            - name: "RES0"
              bits: "14:12"
              desc: "保留，RES0。"
            - name: "cp11"
              bits: "11"
              desc: "该位域的值将被忽略。如果该位域编程为与 cp10 位域不同的值，则直接读取 NSACR 时该位域为 UNKNOWN。如果实现不包括高级 SIMD 和浮点功能，则该位域为 RES0。"
              reset_info: "温复位；AU"
            - name: "cp10"
              bits: "10"
              desc: "启用对高级 SIMD 和浮点功能的非安全访问。这些位域的可能值为：\n如果启用了对高级 SIMD 和浮点功能的非安全访问，则必须检查 CPACR 以确定允许的访问级别。这些位域控制的高级 SIMD 和浮点功能包括：\n执行任何浮点或高级 SIMD 指令。对高级 SIMD 和浮点寄存器 D0-D31 及其视图 S0-S31 和 Q0 的任何访问-Q15。对 FPSCR、FPSID、MVFR0、MVFR1、MVFR2 或 FPEXC 系统的任何访问寄存器。如果实现不包括高级 SIMD 和浮点功能，则该位域为 RES0。"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "高级 SIMD 和浮点功能只能从安全状态访问。任何从非安全状态访问此功能的尝试都是UNDEFINED。当【PE】处于非安全状态时：\nCPACR.{cp11, cp10} 位域忽略写入并读取为 0b00，访问被拒绝。 HCPTR.{TCP11、TCP10} 位域的行为与 RAO/WI 相同，无论其实际值如何。"
                - value: "0b1"
                  desc: "可以从两种安全状态访问高级 SIMD 和浮点功能。"
            - name: "RES0"
              bits: "9:0"
              desc: "保留，RES0。"
        - name: "SCR"
          desc: "当EL3被实现并且可以使用AArch32 时，定义当前安全状态的配置。它指定："
          condition: "当实现 FEAT_AA32EL3 时"
          fields:
            - name: "RES0"
              bits: "31:16"
              desc: "保留，RES0。"
            - name: "TERR"
              bits: "15"
              source_condition: "When FEAT_RAS is implemented"
              desc: "陷阱错误记录访问。在 MRC、MCR、MRRC 或 MCRR 从监控模式以外的模式访问以下寄存器时生成监控陷阱异常，使用 EC 综合征值报告0x03 和 0x04：\nERRIDR、ERRSELR、ERXADDR、ERXADDR2、ERXCTLR、ERXCTLR2、ERXFR、ERXFR2、ERXMISC0、ERXMISC1、ERXMISC2、 ERXMISC3 和 ERXSTATUS。实现 FEAT_RASv1p1 时，ERXMISC4、ERXMISC5、ERXMISC6、ERXMISC7。"
              condition: "当实现FEAT_RAS时"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "从监控模式以外的模式访问指定寄存器会生成监控陷阱异常。"
            - name: "RES0"
              bits: "15"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "14"
              desc: "保留，RES0。"
            - name: "TWE"
              bits: "13"
              desc: "将 WFE 指令陷入 监视模式。仅当指令通过其条件代码检查时，才会捕获尝试执行条件 WFE 指令。由于 WFE 或 WFI 可以随时完成，即使没有唤醒事件，因此也不保证 WFI 的 WFE 上的陷阱会被捕获，即使 WFE或当没有唤醒事件时执行WFI。唯一的保证是，如果在没有唤醒事件的情况下指令未在有限时间内完成，则会捕获陷阱。"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "如果指令会导致 PE 进入低功耗状态，并且尝试的执行不会生成由 EL1 或 EL2 引发的异常，那么在监控模式以外的任何模式下执行 WFE 指令的任何尝试都会陷入 监控模式。 SCTLR.nTWE 或 HCR.TWE。 EL1 或 EL2 发生的任何异常均优先于该陷阱。"
            - name: "TWI"
              bits: "12"
              desc: "将 WFI 指令陷入 监控模式。仅当指令通过其条件代码检查时，才会捕获尝试执行条件 WFI 指令。由于 WFE 或 WFI 可以随时完成，即使没有唤醒事件，因此也不保证 WFI 的 WFE 上的陷阱会被捕获，即使 WFE或当没有唤醒事件时执行WFI。唯一的保证是，如果在没有唤醒事件的情况下指令未在有限时间内完成，则会捕获陷阱。"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何指令被捕获。"
                - value: "0b1"
                  desc: "如果指令会导致 PE 进入低功耗状态，并且尝试执行不会生成由 EL1 或 EL2 引发的异常，那么在监控模式以外的任何模式下执行 WFI 指令的任何尝试都会陷入 监控模式。 SCTLR.nTWI 或 HCR.TWI。 EL1 或 EL2 发生的任何异常均优先于该陷阱。"
            - name: "RES0"
              bits: "11:10"
              desc: "保留，RES0。"
            - name: "SIF"
              bits: "9"
              desc: "安全指令获取。当PE处于安全状态时，该位禁止从非安全存储器执行指令。该位允许缓存在TLB中。"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "允许从非安全存储器执行安全状态指令。"
                - value: "0b1"
                  desc: "不允许从非安全存储器执行安全状态指令。"
            - name: "HCE"
              bits: "8"
              desc: "管理程序调用指令启用。如果实现了EL2，则允许在非安全EL1和EL2处执行HVC指令。 HVC 指令在 EL0 处始终为 UNDEFINED 且处于安全状态。如果EL2未实现，则该位为 RES0 且HVC为UNDEFINED。"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "HVC指令为：\nUNDEFINED 位于非安全 EL1。未定义指令异常取自PL1至PL1。 UNPREDICTABLE 在 EL2。行为为以下之一：指令为 UNDEFINED。该指令作为 NOP 执行。"
                - value: "0b1"
                  desc: "HVC 指令在非安全 EL1 和 EL2 下启用。"
            - name: "SCD"
              bits: "7"
              desc: "安全监控呼叫禁用。禁用SMC指令。 SMC 指令在 PL0 处始终为 UNDEFINED。"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "SMC 指令已启用。"
                - value: "0b1"
                  desc: "在非安全状态下，SMC指令为UNDEFINED。未定义指令异常是从当前异常级别取出到当前异常级别。在安全状态下，行为是以下之一：\n该指令是UNDEFINED。该指令作为 NOP 执行。"
            - name: "nET"
              bits: "6"
              desc: "不提前终止。该位禁用提前终止。此 IMPLEMENTATION DEFINED 机制可以禁用乘法和数据操作中的数据相关时序优化。它可以提供系统支持，防止可能被定时相关类型的攻击所利用的信息泄漏。在不支持提前终止或不支持禁用提前终止的实现中，该位为 RES0。"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "允许提前终止。数据操作的执行时间可以取决于数据值。"
                - value: "0b1"
                  desc: "禁用提前终止。数据操作所需的周期数被迫与数据值无关。"
            - name: "AW"
              bits: "5"
              desc: "当SCR.EA的值为1并且HCR.AMO的值为0时，该位控制PSTATE.A是否屏蔽从非安全状态采取的外部中止。当SCR.EA为0或HCR.AMO为1时，该位无效。"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "从非安全状态获取的外部中止不会被 PSTATE.A 屏蔽，并被带到 EL3。从安全状态获取的外部中止由 PSTATE.A 屏蔽。"
                - value: "0b1"
                  desc: "从任一安全状态获取的外部中止均由 PSTATE.A 屏蔽。当PSTATE.A为0时，中止到EL3。"
            - name: "FW"
              bits: "4"
              desc: "当SCR.FIQ的值为1且HCR.FMO的值为0时，该位控制PSTATE.F是否屏蔽从非安全状态获取的FIQ中断。当SCR.FIQ为0或HCR.FMO为1时，该位无效。"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "从非安全状态获取的 FIQ 不会被 PSTATE.F 屏蔽，并被带到 EL3。从安全状态获取的 FIQ 被 PSTATE.F 屏蔽。"
                - value: "0b1"
                  desc: "从任一安全状态获取的 FIQ 由 PSTATE.F 屏蔽。当PSTATE.F为0时，FIQ被取至EL3。"
            - name: "EA"
              bits: "3"
              desc: "外部中止处理程序。该位控制哪种模式采用外部中止和 SError 异常。"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "外部中止进入中止模式。"
                - value: "0b1"
                  desc: "外部中止进入监控模式。"
            - name: "FIQ"
              bits: "2"
              desc: "FIQ 处理程序。该位控制哪种模式采用 FIQ 异常。"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "FIQ 进入 FIQ 模式。"
                - value: "0b1"
                  desc: "FIQ 进入监控模式。"
            - name: "IRQ"
              bits: "1"
              desc: "IRQ 处理程序。该位控制哪种模式采用 IRQ 异常。"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "IRQ 进入 IRQ 模式。"
                - value: "0b1"
                  desc: "IRQ 进入监控模式。"
            - name: "NS"
              bits: "0"
              desc: "非安全位。除了当PE处于监控模式时，该位决定PE的安全状态："
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "PE 处于安全状态。"
                - value: "0b1"
                  desc: "PE 处于非安全状态。"
        - name: "SDCR"
          desc: "提供用于自承载调试、跟踪和性能监视器扩展的 EL3 配置选项。"
          condition: "当实现 FEAT_AA32EL3 时"
          fields:
            - name: "RES0"
              bits: "31:29"
              desc: "保留，RES0。"
            - name: "MTPME"
              bits: "28"
              source_condition: "When FEAT_MTPMU is implemented"
              desc: "多线程PMU启用。允许使用 PMEVTYPER<n>.MT 位。\n如果系统中与 PE 具有相同 1 级亲和力的任何其他 PE 禁用 FEAT_MTPMU， PE 是否表现为该位域为 0，由 IMPLEMENTATION DEFINED 决定。"
              condition: "当实现FEAT_MTPMU时"
              reset_info: "冷复位；最高实现的异常级别为EL3；'1'"
              values:
                - value: "0b0"
                  desc: "FEAT_MTPMU 已禁用。 PMEVTYPER<n>.MT的有效值为0。"
                - value: "0b1"
                  desc: "PMEVTYPER<n>.MT 位不受此位域影响。"
            - name: "RES0"
              bits: "28"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "TDCC"
              bits: "27"
              source_condition: "When FEAT_FGT is implemented"
              desc: "陷阱DCC。捕获在监视模式以外的模式下对调试通信通道的使用。该控制捕获的DCC寄存器是：\nDBGDTRRXext、DBGDTRTXext、DBGDSCRint、DBGDCCINT，以及当 PE 处于非调试状态时，DBGDTRRXint 和 DBGDTRTXint。当PE处于调试状态时，SDCR.TDCC不会捕获对以下内容的任何访问：\nDBGDTRRXint 和 DBGDTRTXint。"
              condition: "当实现FEAT_FGT时"
              reset_info: "温复位；AU"
              values:
                - value: "0b0"
                  desc: "该控制不会导致任何寄存器访问被捕获。"
                - value: "0b1"
                  desc: "在监控模式以外的模式下访问 DCC 寄存器会生成监控陷阱异常，除非该访问还生成更高优先级的异常。当 PE 处于调试状态时，DCC 数据传输寄存器上的陷阱将被忽略。"
            - name: "RES0"
              bits: "27"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "26:24"
              desc: "保留，RES0。"
            - name: "SCCD"
              bits: "23"
              source_condition: "When FEAT_PMUv3p5 is implemented"
              desc: "安全循环计数器禁用。禁止PMCCNTR在安全状态下计数和EL3。该位域不会影响 CPU_CYCLES 事件或任何其他计算周期的事件。"
              condition: "当实现 FEAT_PMUv3p5 时"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "PMCCNTR 的周期计数不受此机制的影响。"
                - value: "0b1"
                  desc: "在安全状态和 EL3 下禁止通过 PMCCNTR 进行周期计数。"
            - name: "RES0"
              bits: "23"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "22"
              desc: "保留，RES0。"
            - name: "EPMAD"
              bits: "21"
              source_condition: "When FEAT_Debugv8p4 is implemented and FEAT_PMUv3_EXT is implemented"
              desc: "外部性能监视器非安全访问禁用。控制外部调试器对性能监视器寄存器的非安全访问。否则，如果EL3未实现且SCR.NS的有效值为0，则该位域的有效值为1。"
              condition: "当实现 FEAT_Debugv8p4 且实现 FEAT_PMUv3_EXT 时"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "该控制不禁止外部调试器对性能监视器寄存器的访问。"
                - value: "0b1"
                  desc: "禁止从外部调试器对受影响的性能监视器寄存器进行非安全访问。"
            - name: "EPMAD"
              bits: "21"
              source_condition: "When FEAT_PMUv3_EXT is implemented"
              desc: "外部性能监视器访问禁用。控制外部调试器对性能监视器寄存器的访问。否则，如果EL3未实现且SCR.NS的有效值为0，则该位域的有效值为1。"
              condition: "当实现 FEAT_PMUv3_EXT 时"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "该控制不禁止外部调试器对性能监视器寄存器的访问。"
                - value: "0b1"
                  desc: "如果 IMPLEMENTATION DEFINED 身份验证接口函数 ExternalSecureInvasiveDebugEnabled() 返回 FALSE，则禁止从外部调试器访问受影响的性能监视器寄存器。"
            - name: "RES0"
              bits: "21"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "EDAD"
              bits: "20"
              source_condition: "When FEAT_Debugv8p4 is implemented"
              desc: "外部调试非安全访问禁用。控制外部调试器对断点、观察点和 OSLAR_EL1 寄存器的非安全访问。如果EL3没有实现，并且SCR.NS的有效值为0，则该位域的有效值为1。"
              condition: "当实现FEAT_Debugv8p4时"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "该控制不禁止外部调试器对调试寄存器的访问。"
                - value: "0b1"
                  desc: "禁止从外部调试器对受影响的调试寄存器进行非安全访问。"
            - name: "EDAD"
              bits: "20"
              source_condition: "When FEAT_Debugv8p2 is implemented"
              desc: "外部调试访问禁用。控制外部调试器对断点、观察点和 OSLAR_EL1 寄存器的访问。如果EL3没有实现，并且SCR.NS的有效值为0，则该位域的有效值为1。"
              condition: "当实现FEAT_Debugv8p2时"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "该控制不禁止外部调试器对调试寄存器的访问。"
                - value: "0b1"
                  desc: "如果 IMPLEMENTATION DEFINED 身份验证接口函数 ExternalSecureInvasiveDebugEnabled() 返回 FALSE，则禁止从外部调试器访问受影响的调试寄存器。"
            - name: "EDAD"
              bits: "20"
              source_condition: "Otherwise"
              desc: "外部调试访问禁用。控制外部调试器对断点、观察点和可选的 OSLAR_EL1 寄存器的访问。从外部调试器访问 OSLAR_EL1 是否受此控制影响由 IMPLEMENTATION DEFINED 决定。如果EL3没有实现，并且SCR.NS的有效值为0，则该位域的有效值为1。"
              condition: "否则"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "该控制不禁止外部调试器对调试寄存器的访问。"
                - value: "0b1"
                  desc: "如果 IMPLEMENTATION DEFINED 身份验证接口函数 ExternalSecureInvasiveDebugEnabled() 返回 FALSE，则禁止从外部调试器访问受影响的调试寄存器。"
            - name: "TTRF"
              bits: "19"
              source_condition: "When FEAT_TRF is implemented"
              desc: "陷阱跟踪过滤器控件。控制在监控模式以外的模式下对跟踪过滤器控制寄存器的访问是否生成监控陷阱异常。"
              condition: "当实现FEAT_TRF时"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "对HTRFCR和TRFCR的访问不受该控制位的影响。"
                - value: "0b1"
                  desc: "当不在监控模式下时，访问 HTRFCR 和 TRFCR 会生成监控陷阱异常，除非该访问生成更高优先级的异常。"
            - name: "RES0"
              bits: "19"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "STE"
              bits: "18"
              source_condition: "When FEAT_TRF is implemented"
              desc: "安全跟踪启用。此位域启用安全状态下的跟踪，并控制外部调试器启用外部跟踪所需的身份验证级别。该位域还控制外部调试器启用外部跟踪所需的身份验证级别。请参阅“注册控件以启用自承载跟踪”。如果EL3未实现并且SCR.NS的有效值为0，则PE的行为就像该位域设置为1一样。"
              condition: "当实现FEAT_TRF时"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "除非被 IMPLEMENTATION DEFINED 身份验证接口覆盖，否则在安全状态下禁止跟踪。"
                - value: "0b1"
                  desc: "处于安全状态的跟踪不受此位域的影响。"
            - name: "RES0"
              bits: "18"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "SPME"
              bits: "17"
              source_condition: "When FEAT_PMUv3 is implemented and FEAT_Debugv8p2 is implemented"
              desc: "启用安全性能监视器。控制安全状态下的事件计数。该位域影响所有事件计数器在 Secure 状态下的操作，如果 PMCR.DP 为 1，则 PMCCNTR 在 Secure 状态下的操作。当PMCR.DP为0时，PMCCNTR不受该位域影响。如果EL3没有实现，并且SCR.NS的有效值为0，则该位域的有效值为1。"
              condition: "当实现FEAT_PMUv3并且实现FEAT_Debugv8p2时"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "安全状态下禁止事件计数。如果 PMCR.DP 为 1，则在安全状态下禁用 PMCCNTR。否则，PMCCNTR不受此机制的影响。"
                - value: "0b1"
                  desc: "事件计数和PMCCNTR不受此机制的影响。"
            - name: "SPME"
              bits: "17"
              source_condition: "When FEAT_PMUv3 is implemented"
              desc: "启用安全性能监视器。控制安全状态下的事件计数。如果 ExternalSecureNoninvasiveDebugEnabled() 为 TRUE，则事件计数器和 PMCCNTR 不受此位域的影响。否则，该位域影响所有事件计数器在 Secure 状态下的操作，如果 PMCR.DP 为 1，则 PMCCNTR 在 Secure 状态下的操作。当PMCR.DP为0时，PMCCNTR不受该位域影响。如果EL3没有实现，并且SCR.NS的有效值为0，则该位域的有效值为1。"
              condition: "当实现 FEAT_PMUv3 时"
              reset_info: "温复位；最高实现的异常级别为EL3；'0'"
              values:
                - value: "0b0"
                  desc: "如果ExternalSecureNoninvasiveDebugEnabled()为FALSE，则在安全状态下禁止事件计数，如果PMCR.DP为1，则在安全状态下禁用PMCCNTR。"
                - value: "0b1"
                  desc: "事件计数和PMCCNTR不受此机制的影响。"
            - name: "RES0"
              bits: "17"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "16"
              desc: "保留，RES0。"
            - name: "SPD"
              bits: "15:14"
              desc: "AArch32 安全的自托管特权调试。启用或禁用来自 EL3 的调试异常，断点指令异常除外。其他值被保留，并且具有 CONSTRAINED UNPREDICTABLE 行为，它们必须具有与 0b00 相同的行为。软件不得依赖此属性，因为保留值的行为可能会在体系结构的未来修订中发生变化。该位域对断点指令异常没有影响。这些始终处于启用状态。在非安全状态下该位域被忽略。如果启用了来自 EL3 的调试异常，则也启用了来自安全 EL0 的调试异常。否则，仅当 SDER.SUIDEN 的值为 1 时，才会启用来自安全 EL0 的调试异常。如果未实现 EL3 并且 SCR.NS 的有效值为 0，则该位域的有效值为0b11。"
              reset_info: "温复位；最高实现的异常级别为EL3；'00'"
              values:
                - value: "0b00"
                  desc: "传统模式。 EL3 的调试异常由身份验证接口启用。"
                - value: "0b10"
                  desc: "安全特权调试已禁用。 EL3 的调试异常被禁用。"
                - value: "0b11"
                  desc: "启用安全特权调试。来自 EL3 的调试异常已启用。"
            - name: "RES0"
              bits: "13:0"
              desc: "保留，RES0。"
        - name: "SDER"
          desc: "在安全 EL0 模式下控制侵入式和非侵入式调试。"
          condition: "当（EL3被实现并且FEAT_AA32EL3被实现）或（FEAT_AA32EL1被实现时，安全EL1被实现，并且FEAT_Secure已实现)"
          fields:
            - name: "RES0"
              bits: "31:2"
              desc: "保留，RES0。"
            - name: "SUNIDEN"
              bits: "1"
              desc: "安全用户非侵入式调试启用。当EL3或安全EL1使用AArch32 时，受该控制影响的非侵入式调试形式为：\nPC 基于示例的分析扩展。请参阅关于 PC 基于示例的分析扩展。当 SelfHostedTraceEnabled() == FALSE 时，处理器跟踪。当实现EL3时，性能监视器。当Secure EL1使用AArch64 时，该位无效。"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "该位对非侵入式调试没有影响。"
                - value: "0b1"
                  desc: "使用 AArch32 在安全 EL0 中允许非侵入式调试。"
            - name: "SUIDEN"
              bits: "0"
              source_condition: "When EL3 is implemented"
              desc: "安全用户侵入式调试启用。"
              condition: "当实现EL3时"
              reset_info: "温复位；'0'"
              values:
                - value: "0b0"
                  desc: "该位不影响安全 EL0 处调试异常的生成。"
                - value: "0b1"
                  desc: "如果EL3或EL1正在使用AArch32，则启用来自安全EL0的调试异常。"
            - name: "RES0"
              bits: "0"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
    - name: "Special-purpose"
      title: "专用寄存器"
      access: "MRS / MSR 系统寄存器接口"
      desc: "Arm AArch32 架构系统寄存器：特殊用途"
      registers:
        - name: "DLR"
          desc: "在调试状态下，保存重新启动的地址。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "ADDR"
              bits: "31:0"
              desc: "重启地址 重启地址。"
        - name: "DSPSR"
          desc: "保存已保存的调试状态进程状态。进入调试状态时，PSTATE信息被写入该寄存器。退出调试状态时，值会从此寄存器复制到 PSTATE。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "N"
              bits: "31"
              desc: "否定条件标志。进入调试状态时设置为 PSTATE.N 的值，并在退出调试状态时复制到 PSTATE.N。"
              reset_info: "温复位；AU"
            - name: "Z"
              bits: "30"
              desc: "零条件标志。进入调试状态时设置为 PSTATE.Z 的值，并在退出调试状态时复制到 PSTATE.Z。"
              reset_info: "温复位；AU"
            - name: "C"
              bits: "29"
              desc: "携带条件标志。进入调试状态时设置为 PSTATE.C 的值，并在退出调试状态时复制到 PSTATE.C。"
              reset_info: "温复位；AU"
            - name: "V"
              bits: "28"
              desc: "溢出条件标志。进入调试状态时设置为 PSTATE.V 的值，并在退出调试状态时复制到 PSTATE.V。"
              reset_info: "温复位；AU"
            - name: "Q"
              bits: "27"
              desc: "溢出或饱和标志。进入调试状态时设置为 PSTATE.Q 的值，并在退出调试状态时复制到 PSTATE.Q。"
              reset_info: "温复位；AU"
            - name: "IT"
              bits: "15:10,26:25"
              desc: "如果-那么。进入调试状态时设置为 PSTATE.IT 的值，并在退出调试状态时复制到 PSTATE.IT。退出调试状态时，DSPSR.IT 必须包含对返回的指令有效的值。 IT位域拆分如下：\nIT[1:0]是DSPSR[26:25]。 IT[7:2]是DSPSR[15:10]。"
              reset_info: "温复位；AU"
            - name: "DIT"
              bits: "24"
              source_condition: "When FEAT_DIT is implemented"
              desc: "数据独立时序。进入调试状态时设置为 PSTATE.DIT 的值，并在退出调试状态时复制到 PSTATE.DIT。"
              condition: "当实现FEAT_DIT时"
              reset_info: "温复位；AU"
            - name: "RES0"
              bits: "24"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "SSBS"
              bits: "23"
              source_condition: "When FEAT_SSBS is implemented"
              desc: "投机商店绕过。进入调试状态时设置为 PSTATE.SSBS 的值，并在退出调试状态时复制到 PSTATE.SSBS。"
              condition: "当实现FEAT_SSBS时"
              reset_info: "温复位；AU"
            - name: "RES0"
              bits: "23"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "PAN"
              bits: "22"
              source_condition: "When FEAT_PAN is implemented"
              desc: "特权访问从不。进入调试状态时设置为 PSTATE.PAN 的值，并在退出调试状态时复制到 PSTATE.PAN。"
              condition: "当实现 FEAT_PAN 时"
              reset_info: "温复位；AU"
            - name: "RES0"
              bits: "22"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "SS"
              bits: "21"
              desc: "软件步骤。进入调试状态时设置为 PSTATE.SS 的值，并在退出调试状态时有条件地复制到 PSTATE.SS。"
              reset_info: "温复位；AU"
            - name: "IL"
              bits: "20"
              desc: "非法执行状态。进入调试状态时设置为 PSTATE.IL 的值，并在退出调试状态时复制到 PSTATE.IL。"
              reset_info: "温复位；AU"
            - name: "GE"
              bits: "19:16"
              desc: "大于或等于标志。进入调试状态时设置为 PSTATE.GE 的值，并在退出调试状态时复制到 PSTATE.GE。"
              reset_info: "温复位；AU"
            - name: "E"
              bits: "9"
              desc: "字节序。进入调试状态时设置为 PSTATE.E 的值，并在退出调试状态时复制到 PSTATE.E。如果实现不支持大端操作，则 DSPSR.E 为 RES0。如果实现不支持小端操作，则 DSPSR.E 为 RES1。退出调试状态时，如果实现在返回的异常级别不支持大端操作，则 DSPSR.E 为 RES0，如果实现在返回的异常级别不支持小端操作，则 DSPSR.E 为 RES1。"
              reset_info: "温复位；AU"
            - name: "A"
              bits: "8"
              desc: "SError 异常掩码。进入调试状态时设置为 PSTATE.A 的值，并在退出调试状态时复制到 PSTATE.A。"
              reset_info: "温复位；AU"
            - name: "I"
              bits: "7"
              desc: "IRQ中断屏蔽。进入调试状态时设置为 PSTATE.I 的值，并在退出调试状态时复制到 PSTATE.I。"
              reset_info: "温复位；AU"
            - name: "F"
              bits: "6"
              desc: "FIQ中断屏蔽。进入调试状态时设置为 PSTATE.F 的值，并在退出调试状态时复制到 PSTATE.F。"
              reset_info: "温复位；AU"
            - name: "T"
              bits: "5"
              desc: "T32指令集状态。进入调试状态时设置为 PSTATE.T 的值，并在退出调试状态时复制到 PSTATE.T。"
              reset_info: "温复位；AU"
            - name: "M[4:0]"
              bits: "4:0"
              desc: "模式。进入调试状态时设置为PSTATE.M[4:0]的值，退出调试状态时复制到PSTATE.M[4:0]。其他值保留。如果 DSPSR.M[4:0] 具有保留值或未实现的异常级别的值，则退出调试状态是非法返回事件，如“来自 AArch32 状态的非法返回事件”中所述。"
              reset_info: "温复位；AU"
              values:
                - value: "0b10000"
                  desc: "用户。"
                - value: "0b10011"
                  desc: "监事。"
                - value: "0b10110"
                  source_condition: "When FEAT_EL3 is implemented"
                  desc: "监控。"
                  condition: "当实现FEAT_EL3时"
                - value: "0b10111"
                  desc: "中止。"
                - value: "0b11010"
                  source_condition: "When FEAT_EL3 is implemented"
                  desc: "炒作。"
                  condition: "当实现FEAT_EL3时"
                - value: "0b11011"
                  desc: "未定义。"
                - value: "0b11111"
                  desc: "系统。"
        - name: "DSPSR2"
          desc: "保存已保存的调试状态进程状态。进入调试状态时，PSTATE信息被写入该寄存器。退出调试状态时，值会从此寄存器复制到 PSTATE。"
          condition: "当实现 FEAT_Debugv8p9 并实现 FEAT_AA32 时"
          fields:
            - name: "RES0"
              bits: "31:5"
              desc: "保留，RES0。"
            - name: "UINJ"
              bits: "4"
              source_condition: "When FEAT_UINJ is implemented"
              desc: "注入未定义指令异常。进入调试状态时设置为 PSTATE.UINJ 的值，并在退出调试状态时复制到 PSTATE.UINJ。"
              condition: "当实现FEAT_UINJ时"
              reset_info: "温复位；AU"
            - name: "RES0"
              bits: "4"
              source_condition: "Otherwise"
              desc: "保留，RES0。"
              condition: "否则"
            - name: "RES0"
              bits: "3:0"
              desc: "保留，RES0。"
        - name: "ELR_hyp"
          desc: "当 Hyp 模式发生异常时，保存要返回的地址。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "ADDR"
              bits: "31:0"
              desc: "返回地址 返回地址。"
              reset_info: "温复位；AU"
        - name: "SPSR"
          desc: "保存当前模式的已保存进程状态。"
          condition: "当执行 FEAT_AA32 时"
          fields:
            - name: "N"
              bits: "31"
              desc: "否定条件标志。在当前模式下发生异常时设置为PSTATE.N的值，并在当前模式下执行异常返回操作时复制到PSTATE.N。"
              reset_info: "温复位；AU"
            - name: "Z"
              bits: "30"
              desc: "零条件标志。在当前模式下发生异常时设置为PSTATE.Z的值，并在当前模式下执行异常返回操作时复制到PSTATE.Z。"
              reset_info: "温复位；AU"
            - name: "C"
              bits: "29"
              desc: "携带条件标志。在当前模式下发生异常时设置为PSTATE.C的值，并在当前模式下执行异常返回操作时复制到PSTATE.C。"
              reset_info: "温复位；AU"
            - name: "V"
              bits: "28"
              desc: "溢出条件标志。在当前模式下发生异常时设置为PSTATE.V的值，并在当前模式下执行异常返回操作时复制到PSTATE.V。"
              reset_info: "温复位；AU"
            - name: "Q"
              bits: "27"
              desc: "溢出或饱和标志。在当前模式下发生异常时设置为PSTATE.Q的值，并在当前模式下执行异常返回操作时复制到PSTATE.Q。"
              reset_info: "温复位；AU"
            - name: "IT"
              bits: "15:10,26:25"
              desc: "如果-那么。在当前模式下发生异常时设置为PSTATE.IT的值，并在当前模式下执行异常返回操作时复制到PSTATE.IT。在当前模式下执行异常返回操作时，SPSR.IT 必须包含对要返回的指令有效的值。 IT位域拆分如下：\nIT[1:0]是SPSR[26:25]。 IT[7:2]是SPSR[15:10]。"
              reset_info: "温复位；AU"
            - name: "J"
              bits: "24"
              desc: "在该架构的早期版本中，{J, T} 位确定 AArch32 指令集状态。 Armv8 不支持 Jazelle 状态或 T32EE 状态，T 位决定指令集状态。"
            - name: "SSBS"
              bits: "23"
              source_condition: "When FEAT_SSBS is implemented"
              desc: "投机商店绕过。在当前模式下发生异常时设置为PSTATE.SSBS的值，并在当前模式下执行异常返回操作时复制到PSTATE.SSBS。"
