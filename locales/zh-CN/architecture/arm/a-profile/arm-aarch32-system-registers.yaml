                  desc: "普通内存，内部不可缓存。"
                - value: "0b01"
                  desc: "普通内存，内部回写式写入分配可缓存。"
                - value: "0b10"
                  desc: "普通内存，内部直写式可缓存。"
                - value: "0b11"
                  desc: "普通内存，内部回写式，无写分配可缓存。"
            - name: "NOS"
