        - name: "mcyclecfg"
          desc: "机器模式循环计数器配置\n\n`mcyclecfg` CSR 是一个 64-bit 机器级寄存器，用于配置周期计数器的特权模式过滤。每个抑制位（xINH）在置位时会抑制相应特权模式下事件的计数。\n\n| 位域 | 说明 | |---------|---------------------------------------------------------| | MINH | 若置位，则禁止在 M 模式中事件计数。| | SINH | 若置位，则禁止在 S/HS 模式中事件计数。| | UINH | 若置位，则禁止在 U 模式中事件计数。| | VSINH | 若置位，则禁止在 VS 模式中事件计数。| | VUINH | 若置位，则禁止在 VU 模式中事件计数。|\n\n当所有 xINH 位为零时，所有模式下的事件计数功能启用。\n\n对于 61:58 中的每一位，如果对应的特权模式未实现，则该位读为零。\n\n位 63 被硬件固定为 0，因为这些计数器不会产生溢出陷阱。\n\n位域 [57:0] 为保留 (WPRI) 且读为零。\n\n对于 RV32，`mcyclecfg` 的高位 32 位通过 `mcyclecfgh`（CSR 0x721）访问。\n\n注：尽管 CSR 地址分配给 0x320 会更为自然，但它已被分配给 `mcountinhibit`。"
          fields: []
        - name: "minstretcfg"
          desc: "机器模式指令-退役计数器配置\n\n`minstretcfg` CSR 是一个 64-bit 级别寄存器，用于配置监管者模式的特权模式过滤功能，针对 `minstret`（机器模式指令-退役计数器）。每个抑制位（xINH）用于禁用相关特权模式下退役指令的计数功能。\n\n| 位域 | 说明 | |---------|-----------------------------------------------------------| | MINH | 若置位，则禁止在 M 模式中事件计数。| | SINH | 若置位，则禁止在 S/HS 模式中事件计数。| | UINH | 若置位，则禁止在 U 模式中事件计数。| | VSINH | 若置位，则禁止在 VS 模式中事件计数。| | VUINH | 若置位，则禁止在 VU 模式中事件计数。|\n\n当所有抑制位清零时，指令退役在所有特权模式下均被计数。\n\n对于 61:58 中的每一位，如果对应的特权模式未实现，则该位读为零。\n\n位 63（OF）始终读为零，表示计数器不产生溢出中断。\n\n位域 [57:0] 为保留 (WPRI)，读操作视为零；写操作被忽略。\n\n对于 RV32 系统，`minstretcfg` 的高位 32 位可通过 `minstretcfgh` CSR（0x722）访问。"
          fields: []
