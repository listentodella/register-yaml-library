          condition: "全部满足： Smstateen，Ssstateen"
        - name: "sstateen3"
          desc: "监管者状态使能 3 寄存器\n\n每个 `stateen` CSR 位控制较低特权级对扩展状态的访问，针对那些未被判定为“值得”拥有 XS 位域的扩展，例如在 `sstatus` 中的 FS 和 VS 位域，用于 F 和 V 扩展。\n\n每个级别提供的寄存器数量为四个，因为认为 4 * 64 = 256 位用于机器和虚拟机级别，而 4 * 32 = 128 位用于监管者级别，将足以满足未来多年的需求，或许至少能延续到 RISC-V ISA 仍被使用为止。确切的数值为四，是试图在一方面提供过少位数与另一方面过度设计将永不使用的 CSR 之间取得的平衡。\n\n`stateen` 寄存器在每一级控制对所有较低特权级状态的访问，但不控制对其自身级状态的访问。\n\n当 `stateen` CSR 阻止特权模式访问状态时，尝试在该特权模式下执行隐式更新状态但不读取状态的指令，可能引发非法指令或虚拟指令异常，也可能不引发。此类情况必须通过明确指定一种方式来区分。在某些情况下，`stateen` 的 CSR 位域将具有双重作用，作为启用 ISA 扩展功能的使能位，这些扩展功能引入了受控状态。\n\n对于 `sstateen` CSR 中每个有明确定义用途的位，对应的 `mstateen` CSR 中也定义了相同的位，用于控制机器级以下对相同状态的访问。`mstateen` CSR 的高 32 位（对于 RV32，则为对应的高半 CSR）控制对用户级本质上不可访问状态的访问，因此监管者级 `sstateen` CSR 中不适用对应的使能位。计划从最高有效端的第 63 位开始分配这些位，依次到第 32 位，然后继续分配到下一个编号更高的 `mstateen` CSR。 若从`sstateen` CSR的最低有效位端分配位的速率足够低，则允许从`mstateen` CSR的最高有效位端的位分配延伸至32位的低位区域，从而在跳转至更高层级的`mstateen` CSR之前发生侵入。在此情况下，被“侵入”的位在对应的`sstateen` CSR中的位位置将永久保持为只读零。\n\n对于 `mstateen` CSR 中每个为零的位（无论是只读零还是被置为零），该位在对应的 `hstateen` 和 `sstateen` 的 CSR 中同样表现为只读零。对于 `hstateen` CSR 中每个为零的位（无论是只读零还是被置为零），当在 VS 模式中访问时，该位在 `sstateen` 中同样表现为只读零。\n\n一个位于监管者模式的 `sstateen` CSR 中的位若为只读零，则必须在对应的匹配的 `mstateen` CSR 中该位也为只读零，且如果存在，则在对应的匹配的 `hstateen` CSR 中也必须为只读零。每个 `mstateen` CSR 的位域 63 可为只读零，仅当虚拟机扩展未实现且对应的监管者模式 `sstateen` CSR 所有位均为只读零。"
          fields:
            - name: "DATA"
              bits: "31:0"
              desc: "数据值"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
          condition: "全部满足： Smstateen，Ssstateen"
        - name: "sscratch"
          desc: "监管者临时寄存器\n\n软件使用的一般寄存器。位域不被硬件解释。"
          fields:
            - name: "SCRATCH"
              bits: "31:0"
              desc: "暂存值"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "sepc"
          desc: "监管者异常程序计数器\n\n在异常或中断发生时，由指令的 PC 指定，且在 (H)S 模式中记录。\n\n也控制在异常返回时hart跳转到HS 模式。"
          fields:
            - name: "PC"
              bits: "31:0"
              desc: "当发生陷阱并进入 S 模式时，`sepc.PC` 被写入引起中断或异常的指令的虚拟地址。否则，`sepc.PC` 从不被实现写入，尽管软件可以显式地写入它。\n\n在从 S 模式（由 SRET 指令触发）的异常返回时，控制转移至从 `sepc.PC` 读出的虚拟地址。\n\n因为程序计数器始终为 <% if ext?(:C) %>半字<% else %>字<% end %>对齐\n<% if ext?(:C) %>位 0 <% else %>位 1:0 <% end %>位为 `sepc.PC` 的始终\n只读 0。\n\n[when,\"ext?(:C) && MUTABLE_MISA_C == true\"]\n当 `misa.C` 为零时，位 1 被屏蔽为零。对位 1 的写入仍会被捕获，且\n可能在下一次读取时可见，当 `misa.C` 位被置位时。\n\n持有与异常相关的虚拟地址的位域 [SXLEN-1:<%= ext?(:C) ? 2 : 1 %>]。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "scause"
          desc: "监管者原因\n\n报告最新异常的原因。"
          fields:
            - name: "INT"
              bits: "31"
              desc: "硬件在发生陷阱时写入 S 模式。\n\n当置位时，最后一次异常是由异步中断引起的。\n\n`scause.INT` 是可写入的。\n\n[when,\"TRAP_ON_ILLEGAL_WLRL == true\"]\n若将 `scause` 写入未定义原因（`scause.INT` 和 `scause.CODE` 的组合），则发生 `Illegal Instruction` 异常。\n\n[when,\"TRAP_ON_ILLEGAL_WLRL == false\"]\n若将 `scause` 写入未定义原因（`scause.INT` 和 `scause.CODE` 的组合），则既不修改 `scause.INT` 也不修改 `scause.CODE`。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "CODE"
              bits: "30:0"
              desc: "硬件在发生陷阱时写入 S 模式。\n\n保存最后一次触发陷阱的中断或异常代码。\n\n`scause.CODE` 可写。\n\n[when,\"TRAP_ON_ILLEGAL_WLRL == true\"]\n若将 `scause` 写入未定义原因（`scause.INT` 和 `scause.CODE` 的组合），则发生 `Illegal Instruction` 异常。\n\n[when,\"TRAP_ON_ILLEGAL_WLRL == false\"]\n若将 `scause` 写入未定义原因（`scause.INT` 和 `scause.CODE` 的组合），则既不修改 `scause.INT` 也不修改 `scause.CODE`。\n\n有效中断码为：\n[separator=\"!\"]\n!===\n<%- implemented_interrupt_codes.sort_by { |code| code.num }.each do |code| -%>\n! <%= code.num %> ! <%= code.name %>\n<%- end -%>\n!===\n\n有效异常码为：\n[separator=\"!\"]\n!===\n<%- implemented_exception_codes.sort_by { |code| code.num }.each do |code| -%>\n! <%= code.num %> ! <%= code.name %>\n<%- end -%>\n!==="
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "stval"
          desc: "监管者陷阱值\n\n持有陷阱特定信息"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "在发生陷阱时，于 S 模式中填写与陷阱相关的特定信息。\n\n值为：\n\n[separator=\"!\"]\n!===\n! 异常类型 ! 值\n\n! [0] 指令地址未对齐 ! 未对齐的虚拟 PC（与写入 `mepc` 的值相同）。 ! [1] 指令访问故障 ! 导致访问故障的虚拟 PC<% if ext?(:C) %> 部分<% end %><%- unless ext?(:C) -%>（与写入 `mepc` 的值相同）<%- end -%>。 ! [2] 非法指令 ! 非法指令的编码。 ! [3] 断点 ! [when,\"REPORT_VA_IN_STVAL_ON_BREAKPOINT == true\"] 当由 EBREAK 指令引起时，为断点指令的虚拟 PC。\n\n [when,\"REPORT_VA_IN_STVAL_ON_BREAKPOINT == false\"]\n当由 EBREAK 指令引起时，值为零。\n\n由数据地址（即断点）引起的故障，其故障的虚拟地址。由指令地址断点引起的故障，其故障的虚拟地址为 PC。! [4] 负载地址未对齐 ! 未对齐的虚拟负载地址。! [5] 负载访问故障 ! 导致访问故障的虚拟负载地址部分。\n\n当加载操作未对齐时，报告的值是导致故障的页面中最小地址（_例如_，若一个 8-byte 加载操作均匀分布在页面内，且故障发生在第二页，将报告地址 + 4）。\n\n（尽管访问故障发生在物理地址上，但报告的是虚拟地址）! [6] 存储/AMO 地址未对齐 ! 未对齐的虚拟存储/AMO 地址。! [7] 存储/AMO 访问故障 ! 导致访问故障的虚拟存储/AMO 地址。\n\n当 store/AMO 未对齐时，报告的值是导致故障的页面中最小地址（_例如_，若一个 8-byte 存储操作均分于一个页面内，且故障发生在第二个页面，将报告地址 + 4）。\n\n（尽管访问故障发生在物理地址上，但报告的是虚拟地址）\n! [8] 来自 U 模式 <% if ext?(:H) %> 或 VU 模式 <% end %> ! 零\n! [9] 客户机调用来自 (H)S 模式 ! 零寄存器\n<%- if ext?(:H) -%>\n! [10] 来自 VS 模式 ! 零的环境调用\n<%- end -%>\n! [12] 指令页故障\n! <% if ext?(:C) %> 部分的 <% end %> 虚拟 PC 引发页故障\n<% unless ext?(:C) %>（值同写入`mepc`）<% end %>。\n! [13] 页加载故障\n! 导致页故障的虚拟加载地址的部分。\n\n当加载操作未对齐时，报告的值是导致故障的页面中最小地址（_例如_，若一个 8-byte 加载操作均匀分布在页面内，且故障发生在第二个页面，将报告地址 + 4）。! [15] 存储/AMO 页面故障 ! 该虚拟存储/AMO 操作中导致页面故障的地址。\n\n当 store/AMO 未对齐时，报告的值是导致故障的页面中最小地址\n（例如，如果一个 8-byte 存储操作在页面内均分，且故障发生在第二个页面，将报告地址 + 4）。\n<%- if ext?(:H) -%>\n! [20] 指令客户机页故障\n! <% if ext?(:C) %> 部分的 <% end %> 虚拟 PC 导致故障 <% unless ext?(:C) %>（与写入到 `mepc` 的值相同）<% end %>。\n\n客户机物理地址在 `mtval2` 中报告。! [21] 加载客户机页故障 ! 指造成故障的虚拟地址部分。\n\n当加载操作未对齐时，报告的值是导致故障的页面中最小地址（_例如_，若一个 8-byte 加载操作均匀分布在页面内，且故障发生在第二页，将报告地址 + 4）。\n\n客户机物理地址报告于`mtval2`。! [22] 虚拟指令 ! 的故障虚拟指令编码。! [23] 存储/AMO 客户机页故障 ! 引发故障的虚拟地址部分。\n\n当 store/AMO 未对齐时，报告的值是导致故障的页面中最小地址（_例如_，若一个 8-byte 存储操作均分于一个页面内，且故障发生在第二个页面，将报告地址 + 4）。\n\n客户机物理地址在 `htval` 中报告。\n<%- end -%>\n!==="
        - name: "sip"
          desc: "监管者中断待处理\n\n`mip` 中断待处理位的受限视图。\n\n虚拟机监控器相关的中断（VS 模式中断和监管者客户机中断）即使可以在HS 模式中被处理，也不会反映在`sip`中。相反，它们通过`hip`进行报告。"
          fields:
            - name: "SSIP"
              bits: "1"
              desc: "*监管者软件中断待处理*\n\n报告当前待处理状态的 (H)S 模式软件中断。\n\n当监管者软件中断未被委派至（H）S 模式（`mideleg.SSI` 被清除）时，`sip.SSIP` 为只读 0。\n\n否则，`sip.SSIP` 是 `mip.SSIP` 的别名。\n\n<%- if ext?(:Smaia) -%>\n当使用 AIA/IMSIC 时，IPIs 预期以外部中断的形式交付\n且 SSIP 未由任何硬件更新支持（除任何别名效应外）。\n\n然而，SSIP 仍可由 S 模式软件写入，且写入时可被用于\n生成一个 S 模式软件中断。\n<%- end -%>\n\n由于是别名，对 `sip.SSIP` 的写操作也将反映在 `mip.SSIP`<% if ext?(:Smaia) %> 和 `mvip.SSIP`<% end %> 中。\n\n<% if ext?(:Smaia) %>_别名_<% else %>_别名_<% end %>:\n\n* `mip.SSIP` 当 `mideleg.SSI` 被置位时\n<%- if ext?(:Smaia) -%>\n* `mvip.SSIP` 当 `mideleg.SSI` 被置位时\n<%- end -%>\n\n概要：\n[separator=\"!\",%autowidth]\n!===\n! `mideleg.SSI` ! `sip.SSIP` 行为\n\n! 0 ! 仅读 0\n! 1 ! 为 `mip.SSIP` <% if ext?(:Smaia) %> 和 `mvip.SSIP` <% end %> 的可写别名\n!===\n\n别名：sip.SSIP, mvip.SSIP\n\n受影响来源：Smaia"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "STIP"
              bits: "5"
              desc: "*监管者定时器中断待处理*\n\n报告当前待处理状态的 (H)S 模式定时器中断。\n\n当监管者定时器中断未被委派给（H）S 模式（即 `mideleg.STI` 被清零）时，`sip.STIP` 为只读 0。\n\n否则，`sip.STIP` 是 `mip.STIP` 的只读视图。\n\n<% if ext?(:Smaia) %>_别名_<% else %>_别名_<% end %>:\n\n* `mip.STIP` 当 `mideleg.STI` 被置位时\n<%- if ext?(:Smaia) -%>\n* 当 `mideleg.SSI` 被置位且 `menvcfg.STCE` 为清零时，`mvip.STIP` 有效。\n<%- end -%>\n\n概要：\n[separator=\"!\",%autowidth]\n!===\n! `mideleg.STI` ! `sip.STIP` 行为\n\n! 0 ! 仅读 0\n! 1 ! 为只读别名，指向 `mip.STIP` <% if ext?(:Smaia) %>（当 `menvcfg.STCE` 清零时指向 `mvip.STIP`）<% end %>\n!===\n\n别名：mip.STIP, mvip.STIP\n\n受影响内容：Sstc"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "SEIP"
              bits: "9"
              desc: "*监管者外部中断待处理*\n\n报告当前待处理状态的 (H)S 模式外部中断。\n\n当监管者外部中断未被委派给（H）S 模式（即 `mideleg.SEI` 为零），`sip.SEIP` 为只读 0。\n\n否则，`sip.SEIP` 是 `mip.SEIP` 的只读视图。\n\n概要：\n[separator=\"!\",%autowidth]\n!===\n! `mideleg.SEI` ! `sip.SEIP` 行为\n\n! 0 ! 仅读 0\n! 1 ! 是 `mip.SEIP` 的只读别名\n!===\n\n别名：mip.SEIP\n\n受影响来源：Smaia"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "LCOFIP"
              bits: "13"
              desc: "*本地计数器溢出中断待处理*\n\n报告本地计数器溢出中断的当前挂起状态。\n\n当本地计数器溢出中断未被委派给（H）S 模式（即`mideleg.LCOFI`为零时），`sip.LCOFIP`在读取时为只读0。\n\n否则，`sip.LCOFIP` 是 `mip.LCOFIP` 的别名。\n\n软件将 0 写入 `sip.LCOFIP` 以清除待处理中断。\n\n概要：\n[separator=\"!\",%autowidth]\n!===\n! `mideleg.LCOFI` ! `sip.LCOFIP` 行为\n\n! 0 ! 仅读 0\n! 1\na! `mip.LCOFIP`（以及当 `hideleg.LCOFI` 被置位时的 `vsip.LCOFIP`）的可写别名\n!===\n\n别名：mip.LCOFIP, vsip.LCOFIP"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "sctrctl"
          desc: "监管者控制传输记录控制寄存器\n\n`sctrctl` 寄存器在 S 模式下启用并配置控制传输记录能力。"
          fields:
            - name: "U"
              bits: "0"
              desc: "在用户模式启用传输记录。\n\n别名：mctrctl.U"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "S"
              bits: "1"
              desc: "在监管者模式下启用传输记录。\n\n别名：mctrctl.S"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "RASEMU"
              bits: "7"
              desc: "当置位时，启用 RAS（返回地址栈）仿真模式。\n\n别名：mctrctl.RASEMU"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "STE"
              bits: "8"
              desc: "在 S=0 时，启用将陷阱记录至 S 模式。\n\n别名：mctrctl.STE"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "BPFRZ"
              bits: "11"
              desc: "在断点异常陷阱到 M 或 S 模式时，设置 `sctrstatus.FROZEN`。\n\n别名：mctrctl.BPFRZ"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "LCOFIFRZ"
              bits: "12"
              desc: "在本地计数器溢出中断（LCOFI）上设置 `sctrstatus.FROZEN`，该中断触发转向 M 或 S 模式。\n\n别名：mctrctl.LCOFIFRZ"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "satp"
          desc: "监管者地址转换与保护\n\n控制 (H)S 模式和 U 模式中的翻译模式，并保持当前 ASID 及页表基指针。"
          fields:
            - name: "MODE"
              bits: "31"
              desc: "*翻译模式*\n\n根据下表控制当前的翻译模式。\n\n[separator=\"!\",%autowidth]\n!===\n! 值 ! 名称 ! 描述\n\n! 0 ! 仅在寄存器中保留 a! 无翻译 -> 虚拟地址 == 物理地址\n<%- if ext?(:Sv39) -%>\n! 8 ! Sv39 ! 39-bit 虚拟地址转换\n<%- end -%>\n<%- if ext?(:Sv48) -%>\n! 9 ! Sv48 ! 48-bit 虚拟地址转换\n<%- end -%>\n<%- if ext?(:Sv57) -%>\n! 10 ! Sv57 ! 57-bit 虚拟地址转换\n<%- end -%>\n!===\n\n任何其他值在写入时将被忽略。"
            - name: "ASID"
              bits: "30:22"
              desc: "*地址空间 ID*"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "PPN"
              bits: "21:0"
              desc: "*物理页号*\n\n当前活动根页表的物理地址为 PPN << 12。\n\n只能持有对应有效页表基地址的值，该值将取决于实现。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "srmcfg"
          desc: "监管者资源管理配置\n\n`srmcfg` 寄存器用于配置一个资源控制 ID（`RCID`）和一个监控计数器 ID（`MCID`）。`RCID` 和 `MCID` 均为 WARL 位域。\n\n`RCID` 和 `MCID` 随每个由 hart 提出的对共享资源控制器的请求而产生。`RCID` 用于确定资源分配（例如，缓存占用限制、内存带宽限制等）以实施。`MCID` 用于标识一个计数器以监控资源使用情况。\n\n`RCID` 和 `MCID` 在 `srmcfg` CSR 中配置的寄存器适用于该 hart 上软件执行的所有特权模式，除非未来扩展定义了例外情况。\n\n若扩展名 `Smstateen` 与 `Ssqosid` 一同实现，则 `Ssqosid` 也要求在 `mstateen0` 中实现 `SRMCFG` 位。若 `mstateen0.SRMCFG` 为 `0`，则在低于 M 模式的特权模式下尝试访问 `srmcfg` 会引发非法指令异常。\n\n若 `mstateen0.SRMCFG` 等于 `1` 或当扩展名 `Smstateen` 未实现时，尝试访问 `srmcfg` 且 `V=1` 发生虚拟指令异常。\n\n建议将 `RCID` 位域的复位值设为 `0`，这与资源控制器默认将全部容量关联到 `RCID=0` 的行为一致。\n\n`MCID` 的复位值不影响功能，且可能为实现定义。\n\n通常，`RCID`（例如，以支持数十个`RCID`）分配的位数少于`MCID`（例如，以支持数百个`MCID`）。\n\n共享的 `RCID` 通常用于对应用或虚拟机分组，通过汇集资源分配满足整体 SLA。\n\n若发生 SLA 陷落，则启用唯一的 `MCID` 实现细粒度监控，辅助进行资源调整决策、为成员子集关联不同的 `RCID`，或将成员迁移到其他机器。更大规模的 `MCID` 数量加速了该分析过程。\n\n`RCID` 和 `MCID` 在 `srmcfg` 中对 hart 的所有特权级别均有效。通常，特权等级较高的模式不会修改 `srmcfg`，因为它们通常服务于特权等级较低的任务。若需区分，高特权代码可更新 `srmcfg` 并在返回较低特权级别前恢复之。\n\n在 VM 环境中，虚拟机监控器通常负责资源分配管理，使 Guest OS 不参与 QoS 流的调度。若需要，虚拟机监控器可以利用在客户机访问时触发的虚拟指令异常，对 `srmcfg` CSR 进行虚拟化，以供 VM 使用。\n\n若 VM 对 `RCID` 和 `MCID` 的直接选择变得普遍且仿真开销成为一个问题，未来扩展可能允许 VS 模式使用选择器以访问由虚拟机监控器配置的一组控制状态寄存器（CSRs），该组寄存器持有为该 Guest OS 使用而指定的 `RCID` 和 `MCID` 值。\n\n在上下文切换期间，监管者可选择使用退出上下文的 `srmcfg` 来执行，并将执行归因于该上下文。在恢复新上下文之前，它会切换到新上下文的 VM 的 `srmcfg`。监管者还可以使用单独的配置，使执行不归因于任一上下文。"
          fields:
            - name: "RCID"
              bits: "11:0"
              desc: "资源控制 ID\n\n`RCID` 用于确定资源分配（例如，缓存占用限制、内存带宽限制等）以实施。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "MCID"
              bits: "27:16"
              desc: "监控计数器 ID\n\n`MCID` 用于标识一个计数器以监控资源使用情况。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "scountovf"
          desc: "监管者计数溢出\n\n一个 32-bit 读取仅寄存器，其中包含 29 `mhpmevent` 控制寄存器（`mhpmevent3` - `mhpmevent31`）中 OF 位的影子副本——其中 `scountovf` 位 X 对应于 `mhpmeventX`。\n\n该寄存器使监管者级溢出中断处理程序能够快速且简便地确定哪些计数器已溢出，而无需调用执行环境至 M 模式。\n\n对位 X 的读访问需遵守与 `mcounteren`（或 `mcounteren` 和 `hcounteren`）寄存器相同的访问控制规则，这些寄存器用于通过 S 模式（或 VS 模式）调解对 `hpmcounter` 寄存器的访问。\n\n在 M 模式中，`scountovf` 位 X 始终可读。在 S/HS 模式中，`scountovf` 位 X 在 `mcounteren` 位 X 被置位时可读，否则读为零。类似地，在 VS 模式中，当 `mcounteren` 位 X 和 `hcounteren` 位 X 均被置位时方可读。"
          fields:
            - name: "OF3"
              bits: "3"
              desc: "[when=\"HPM_COUNTER_EN[3] == true\"]\nmhpmevent3 溢出（OF）位的影子副本。\n\n[when=\"HPM_COUNTER_EN[3] == false\"]\n该位域读为零，因为计数器未启用。\n\n别名：mhpmevent3.OF"
              reset_info: "Unified DB reset_value() 表达式： return HPM_COUNTER_EN[3] ? UNDEFINED_LEGAL : 0;"
