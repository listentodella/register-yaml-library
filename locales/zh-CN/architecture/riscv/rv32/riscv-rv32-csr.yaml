        - name: "htimedelta"
          desc: "虚拟机监控器时间差\n\n`htimedelta` CSR 是一个 64-bit 读/写寄存器，其中包含 `time` CSR 与 VS 模式或 VU 模式中返回值之间的差值。即，在读取 `time` CSR 时，若处于 VS 或 VU 模式，则返回 `htimedelta` 内容与 `time` 实际值之和。\n\n[NOTE]\n因为当求和 `htimedelta` 和 `time` 时溢出被忽略，因此大值的\n`htimedelta` 可用于表示负时间偏移。"
          fields:
            - name: "DELTA"
              bits: "31:0"
              desc: "有符号增量"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "hcounteren"
          desc: "虚拟机监控器计数器使能\n\n与 `scounteren` 一起，将硬件性能监控计数器的控制权委托给 VS/VU 模式\n\n参见 `cycle` 获取描述异常发生方式的表格。"
          fields:
            - name: "CY"
              bits: "0"
              desc: "当 `scounteren.CY`、`mcounteren.CY` 和 `hcounteren.CY` 均置位时，`cycle` CSR（即 `mcycle` 的别名）可被 VU 模式访问。\n\n当 `mcounteren.CY` 和 `hcounteren.CY` 被置位时，`cycle` CSR（即 `mcycle` 的别名）可被 VS 模式访问。\n\n当 `hcounteren.CY` 为零且 `mcounteren.CY` 为一时，任何对 `cycle` 在 VU 模式或 VS 模式中的访问将引发虚拟指令异常。\n\n摘要：\n\n[separator=\"!\",cols=\"1,1,1,4,4\"]\n!===\n.2+h! [.rotate]#`hcounteren.CY`# .2+h! [.rotate]#`mcounteren.CY`# .2+h! [.rotate]#`scounteren.CY`# 2+^.>! `cycle` 访问行为\n.>h! VS 模式 .>h! VU 模式\n\n! 0 ! 0 ! - ! `IllegalInstruction` ! `IllegalInstruction`\n! 0 ! 1 ! - ! `VirtualInstruction` ! `VirtualInstruction`\n! 1 ! 0 ! - ! `IllegalInstruction` ! `IllegalInstruction`\n! 1 ! 1 ! 0 ! 允许 ! `VirtualInstruction`\n! 1 ! 1 ! 1 ! 允许 ! 允许\n!==="
              reset_info: "Unified DB reset_value() 表达式： if (HCOUNTENABLE_EN[0]) { return UNDEFINED_LEGAL; } else { return 0; }"
            - name: "TM"
              bits: "1"
              desc: "当 `scounteren.TM`、`mcounteren.TM` 和 `hcounteren.TM` 均置位时，`time` CSR（即 `mtime` 内存映射的 CSR）可被 VU 模式访问。\n\n当 `mcounteren.TM` 和 `hcounteren.TM` 被置位时，`time` CSR（即 `mtime` 的别名）可被 VS 模式访问。\n\n当 `hcounteren.TM` 为零且 `mcounteren.TM` 为一时，任何对 `time` 在 VU 模式或 VS 模式中的访问将引发虚拟指令异常。\n\n摘要：\n\n[separator=\"!\",%autowidth]\n!===\n.2+h! [.rotate]#`hcounteren.TM`# .2+h! [.rotate]#`mcounteren.TM`# .2+h! [.rotate]#`scounteren.TM`# 2+^.>! `time` 访问行为\n.>h! VS 模式 .>h! VU 模式\n\n! 0 ! 0 ! - ! `IllegalInstruction` ! `IllegalInstruction`\n! 0 ! 1 ! - ! `VirtualInstruction` ! `VirtualInstruction`\n! 1 ! 0 ! - ! `IllegalInstruction` ! `IllegalInstruction`\n! 1 ! 1 ! 0 ! 允许 ! `VirtualInstruction`\n! 1 ! 1 ! 1 ! 允许 ! 允许\n!==="
              reset_info: "Unified DB reset_value() 表达式： if (HCOUNTENABLE_EN[1]) { return UNDEFINED_LEGAL; } else { return 0; }"
            - name: "IR"
              bits: "2"
