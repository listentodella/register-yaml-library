translations:
  sensor: "RISC-V RV32 架构 CSR"
  family: "RISC-V 特权 ISA"
  pages:
    - name: "User and Unprivileged"
      title: "用户与非特权"
      access: "CSR 指令编码空间"
      desc: "RISC-V 32 位架构 CSR 定义：用户与非特权。CSR 地址使用标准 CSR 编码空间，而非 MMIO 地址。"
      registers:
        - name: "ssp"
          desc: "影子栈指针\n\n`ssp` CSR 是一个无特权的读写（URW）CSR，用于读取和写入影子栈指针的低阶位 XLEN。`ssp` 的宽度始终与当前特权模式的 XLEN 相同。ssp 的 1:0 位域为只读零。如果 UXLEN 或 SXLEN 永远不会为 32，则位 2 也为只读零。"
          fields:
            - name: "VALUE"
              bits: "31:2"
              desc: "ssp 中的值指向影子栈顶部，即为影子栈中最后一个存储元素的地址。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "jvt"
          desc: "表跳转基向量和控制寄存器\n\n`jvt` 寄存器是一个 XLEN 位的 WARL 读/写寄存器，用于保存跳转表配置，包括跳转表基地址（BASE）和跳转表模式（MODE）。\n\n`jvt` CSR 为系统软件上下文（如 OS 进程）增加了架构状态，因此必须在上下文切换时保存/恢复。"
          fields:
            - name: "BASE"
              bits: "31:6"
              desc: "BASE 位域中的值必须始终对齐于 64-byte 边界。注意，CSR 位域仅包含地址基址的 XLEN 至 1 位（包含 6 位）。在计算跳转表访问时，基址的低六位将被置零，以获得一个 XLEN 位的跳转表基址 `jvt.base`，该地址始终对齐于 64-byte 边界。\n\n`jvt.base` 是一个虚拟地址，每当启用虚拟内存时。\n\n`jvt.base` 所指向的内存被当作指令内存用于执行表跳转指令，意味着具有执行访问权限。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "MODE"
              bits: "5:0"
              desc: "`jvt.mode` 是一个 WARL 位域，因此只能被编程为已实现的模式。因此发现机制是尝试编程不同的模式并读回值以确定哪些模式可用。跳转表模式必须被实现。"
    - name: "Floating Point and Vector"
      title: "浮点与向量"
      access: "CSR 指令编码空间"
      desc: "RISC-V 32 位架构 CSR 定义：浮点与向量。CSR 地址使用标准 CSR 编码空间，而非 MMIO 地址。"
      registers:
        - name: "fflags"
          desc: "浮点累加异常\n\n累加的异常标志指示自该位域上次被软件复位以来，任一浮点算术指令所引发的异常条件。\n\n基地址 RISC-V ISA 不支持在设置浮点异常标志时生成陷阱。\n\n根据标准规定，我们在 F 扩展中不支持浮点异常的陷阱，而是要求软件显式检查标志位。我们曾考虑添加由浮点累积异常标志位直接控制的分支指令，但最终决定省略这些指令以保持 ISA 的简洁性。"
          fields:
            - name: "NV"
              bits: "4"
              desc: "无效操作\n\n硬件在浮点运算无效时置位，并在软件显式清除前保持置位。\n\n别名：fcsr.NV"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "DZ"
              bits: "3"
              desc: "零除异常\n\n硬件在浮点除法尝试除以零时置位，并在软件显式清除前保持置位。\n\n别名：fcsr.DZ"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "OF"
              bits: "2"
              desc: "溢出\n\n硬件在浮点运算溢出时置位，并在软件显式清除前保持置位。\n\n别名：fcsr.OF"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "UF"
              bits: "1"
              desc: "下溢\n\n硬件在浮点运算下溢时置位，并在软件显式清除前保持置位。\n\n别名：fcsr.UF"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "NX"
              bits: "0"
              desc: "不精确\n\n硬件在浮点运算不精确时置位，并在软件显式清除前保持置位。\n\n别名：fcsr.NX"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "frm"
          desc: "浮点动态舍入模式\n\n舍入模式编码如下：\n\n[[rm]]\n.舍入模式编码。\n[%autowidth,float=\"center\",align=\"center\",cols=\"^,^,<\",options=\"header\"]\n!===\n!舍入模式 | 指令名 | 含义\n!000 !RNE ! 四舍五入，等值时取偶数\n!001 !RTZ ! 向零舍入\n!010 !RDN ! 向下取整（朝向 latexmath:[$-\\infty$]）\n!011 ! RUP ! 四舍五入（朝向 latexmath:[$+\\infty$]）\n!100 !RMM ! 四舍五入，平局时取最大值\n!101 ! !_保留用于未来使用._\n!110 ! !_保留用于未来使用._\n!111 !DYN ! 在指令的 _rm_ 位域中，选择动态舍入模式；在舍入模式寄存器中，_保留_。\n!===\n\n执行时依赖舍入模式的浮点指令，在遇到保留的舍入模式时其行为为_保留_，包括静态保留的舍入模式（101-110）和动态保留的舍入模式（101-111）。\n\n某些指令，包括扩展转换，包含 _rm_ 位域，但其数学运算实际上不受舍入模式的影响；软件应将它们的 _rm_ 位域设置为 RNE（000），但实现必须按通常方式处理 _rm_ 位域（特别是关于解码合法与保留编码的判断）。"
          fields:
            - name: "ROUNDINGMODE"
              bits: "2:0"
              desc: "舍入模式数据。\n\n别名：fcsr.FRM"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "fcsr"
          desc: "浮点控制和状态寄存器（`frm` + `fflags`）\n\n浮点控制和状态寄存器 `fcsr` 是 RISC-V 控制与状态寄存器（CSR）。它是一个 32-bit 可读写寄存器，用于选择浮点算术运算的动态舍入模式，并保存累积的异常标志，如 <<fcsr>> 所示。\n\n[[fcsr, Floating-Point Control and Status Register]]\n.浮点控制和状态寄存器\ninclude::images/wavedrom/float-csr.adoc[]\n\n`fcsr` 寄存器可通过 FRCSR 和 FSCSR 指令读取和写入，这两条指令为汇编伪指令，基于底层的 CSR 访问指令构建。FRCSR 指令通过将 `fcsr` 的值复制到整数寄存器 _rd_ 中实现读取操作。FSCSR 指令通过将 `fcsr` 的原值复制到整数寄存器 _rd_，然后将来自整数寄存器 _rs1_ 的新值写入 `fcsr` 实现值交换。\n\n`fcsr` 内部的位域也可通过不同的 CSR 地址单独访问，并为此类访问定义了独立的汇编伪指令。FRRM 指令读取舍入模式位域 `frm`（`fcsr` 位 7--5）并将该值复制到整数寄存器 _rd_ 的最低三位，其余位全部置零。FSRM 将 `frm` 中的值进行交换，其操作是先将原值复制到整数寄存器 _rd_，然后将整数寄存器 _rs1_ 的最低三位所得值写入 `frm`。FRFLAGS 和 FSFLAGS 对异常累积标志位域 `fflags`（`fcsr` 位 4--0）的访问定义方式类似。\n\n31--8 寄存器的 `fcsr` 位域保留给其他标准扩展。如果这些扩展不存在，实现必须忽略对这些位的写操作，并在读取时提供零值。标准软件应保留这些位的值。\n\n浮点运算使用指令中编码的静态舍入模式，或保存在 `frm` 中的动态舍入模式。舍入模式的编码如 <<rm>> 所示。指令的 _rm_ 位域取值为 111 时，选择 `frm` 中保存的动态舍入模式。依赖舍入模式的浮点指令若在保留舍入模式下执行，其行为为 _reserved_；这包括静态保留舍入模式（101-110）和动态保留舍入模式（101-111）。某些指令（包括加宽转换）虽然具有 _rm_ 位域，但其数学结果不受舍入模式影响； 软件应将他们的 _rm_ 位域设置为 RNE（000），但实现必须将 _rm_ 位域按常规处理（特别是关于合法与保留编码的解码）。\n\n[NOTE]\n====\nC99 语言标准有效强制要求提供一个\n动态舍入模式寄存器。在典型实现中，对\n动态舍入模式 CSR 状态将使流水线串行化。静态\n舍入模式用于实现专用的算术运算\n经常需要在不同的舍入模式之间频繁切换。\n\nF 规范的正式版本规定，非法指令将触发异常\n当执行一条指令时，若该指令使用了保留的位域，则产生异常\n动态舍入模式。该功能已被弱化为保留，这与规范一致。\n静态舍入模式指令的行为。引发一个\n非法指令异常在遇到一个\n保留编码，因此与经认证规范兼容的实现\n与削弱版规范兼容。\n====\n\n累加的异常标志指示自该位域上次由软件复位以来，任一浮点算术指令所引发的异常条件，如<<bitdef>>所示。基础RISC-V ISA不支持在浮点异常标志置位时生成陷阱。(((浮点，异常标志)))\n\n[[bitdef]]\n.异常标志位编码。\n[%autowidth,float=\"center\",align=\"center\",cols=\"^,<\",options=\"header\",]\n|===\n|标志简写 | 标志含义\n|NV | 无效操作\n|DZ | 除零\n|OF | 溢出\n|UF | 下溢\n|NX | 未精确\n|===\n\n[NOTE]\n====\n根据标准规定，我们不支持浮点陷阱\nF 扩展中的异常，但反而需要显式检查的\n软件中的标志。我们考虑过添加直接控制的分支。\n由浮点累加异常标志的值决定，但\n最终决定省略这些指令以保持 ISA 简单。\n===="
          fields:
            - name: "FRM"
              bits: "7:5"
              desc: "舍入模式编码如下：\n\n[[rm]]\n.舍入模式编码。\n[%autowidth,float=\"center\",align=\"center\",cols=\"^,^,<\",options=\"header\"]\n!===\n!舍入模式 | 指令名 | 含义\n!000 !RNE ! 四舍五入，等值时取偶数\n!001 !RTZ ! 向零舍入\n!010 !RDN ! 向下取整（朝向 latexmath:[$-\\infty$]）\n!011 ! RUP ! 四舍五入（朝向 latexmath:[$+\\infty$]）\n!100 !RMM ! 四舍五入，平局时取最大值\n!101 ! !_保留用于未来使用._\n!110 ! !_保留用于未来使用._\n!111 !DYN ! 在指令的 _rm_ 位域中，选择动态舍入模式；在舍入模式寄存器中，_保留_。\n!===\n\n在指令的 _rm_ 位域中取值为 111 时，将选择当前在 `frm` 中保持的动态舍入模式。当执行依赖舍入模式的浮点指令且使用保留的舍入模式时，其行为为保留，包括静态保留舍入模式（101-110）和动态保留舍入模式（101-111）。部分指令（包括扩展转换）虽包含 _rm_ 位域，但其数学运算不受舍入模式影响；软件应将它们的 _rm_ 位域设置为 RNE（000），但实现必须按常规处理 _rm_ 位域（特别是关于解码合法与保留编码的判断）。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "NV"
              bits: "4"
              desc: "*无效操作*\n\n浮点运算的累积误差标志位。\n\n硬件在浮点运算无效时置位，并在软件显式清除前保持置位。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "DZ"
              bits: "3"
              desc: "*除零*\n\n浮点运算的累积误差标志位。\n\n硬件在浮点除法尝试除以零时置位，并在软件显式清除前保持置位。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "OF"
              bits: "2"
              desc: "*溢出*\n\n浮点运算的累积误差标志位。\n\n硬件在浮点运算溢出时置位，并在软件显式清除前保持置位。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "UF"
              bits: "1"
              desc: "*下溢*\n\n浮点运算的累积误差标志位。\n\n硬件在浮点运算下溢时置位，并在软件显式清除前保持置位。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "NX"
              bits: "0"
              desc: "*不精确*\n\n浮点运算的累积误差标志位。\n\n硬件在浮点运算不精确时置位，并在软件显式清除前保持置位。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "vstart"
          desc: "向量起始索引\n\n指定向量指令执行的第一个元素的索引。"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "通常情况下，vstart 仅由硬件在向量指令触发陷阱时写入，其中 vstart 的值表示陷阱发生的元素（无论是同步异常还是异步中断），以及陷阱处理后应恢复执行的元素。所有向量指令均被定义为以 vstart CSR 中指定的元素编号开始执行，此前向量中的其他元素保持不变，执行完毕后将把 vstart CSR 清零。\n\n[NOTE]\n所有向量指令，包括 vset{i}vl{i}，均会将 vstart CSR 清零。\nvstart 寄存器不会被引发非法指令异常的向量指令修改。\nvstart CSR 被定义仅有足够可写位以容纳最大元素索引（一个）\n小于最大值 VLMAX)。\n\n[NOTE]\n最大向量长度通过最大的 LMUL 设置（8）和最小的\nSEW 设置（8），所以 VLMAX_max = 8*VLEN/8 = VLEN。例如，对于 VLEN=256，\nvstart 将有 8 位来表示从 0 到 255 的索引。\n\n对于当前 vtype 设置而言，大于最大元素索引的 vstart 值的使用是保留的。\n\n[NOTE]\n建议实现中若 vstart 超出范围则触发陷阱。无需强制要求\n用于陷阱，作为上 vstart 位的未来可能用途是存储不精确的陷阱\n信息。\n\nvstart CSR 可由非特权代码写入，但非零的 vstart 值在某些实现上可能导致向量指令运行速度显著变慢，因此应用程序员不应使用 vstart。少数向量指令在非零的 vstart 值下无法执行，将引发如下定义的非法指令异常。\n\n[NOTE]\n使 vstart 对非特权代码可见，以支持用户级线程库。\n\n实现可在此尝试执行值为vstart的向量指令时，若实现无法在相同vtype设置下执行该指令产生该值，则可引发非法指令异常。\n\n[NOTE]\n例如，某些实现将在向量执行期间从不响应中断\n算术指令，而不是等待指令完成时才触发\n中断。此类实现可引发非法指令异常\n当尝试执行向量算术指令时，若 vstart 非零。\n\n[NOTE]\n在将软件线程在具有不同微架构的两个 hart 之间迁移时，\nvstart 的值可能不被新的 hart 微架构支持。运行时\n在接收 hart 时，可能需要模拟指令执行直到下个\n支持 vstart 元素位置。或者，可以将迁移事件限制到\n仅在相互支持的 vstart 位置发生。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "vxsat"
          desc: "向量定点饱和标志\n\n指示固定点指令是否因输出值超出范围而需饱和以适应目标格式"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "vxsat CSR 拥有一个读写最低位（vxsat[0]），用于指示固定点指令是否因输出值超出范围而需饱和以适应目标格式。位域 vxsat[XLEN-1:1] 应写为零。\n\nvxsat 位在 vcsr 中被镜像。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "vxrm"
          desc: "向量定点舍入模式\n\n持有 2-bit 读写舍入模式位域于最低有效位"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "向量定点舍入模式寄存器包含一个两位读写舍入模式位域，位于最低有效位（vxrm[1:0]）。高位位域vxrm[XLEN-1:2]应写为零。向量定点舍入模式被赋予独立的CSR地址以支持独立访问，但同时也作为位域反映在vcsr中。\n\n[NOTE]\n可使用单条 csrwi 指令在保存原始舍入模式的同时设置新的舍入模式。\n\n定点舍入算法规定如下。假设预舍入结果为 v，需舍去该结果的 d 位，则舍入结果为 (v >> d) + r，其中 r 根据以下表中 vxrm[1:0] 值指定的舍入模式确定。\n\n[separator=\"!\"]\n!===\n! vxrm[1:0] ! 缩写 ! 四舍五入模式 ! 四舍五入增量，r\n! 00 ! rnu ! 向上舍入（加法 +0.5 LSB） ! v[d-1]\n! 01 ! rne ! 舍入到最近值，等值时取偶数 ! v[d-1] & (v[d-2:0]\\!=0 | v[d])\n! 10 ! rdn ! 向下舍入（截断） ! 0\n! 11 ! rod ! 舍入到奇数（将各位 OR 到 LSB，即“粘滞”） ! \\!v[d] & v[d-1:0]\\!=0"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "vcsr"
          desc: "向量控制和状态寄存器\n\n包含对 vxrm 和 vxsat 寄存器的别名"
          fields:
            - name: "VXRM"
              bits: "2:1"
              desc: "见 vxrm。\n\n别名：vxrm.VALUE[1:0]"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "VXSAT"
              bits: "0"
              desc: "见 vxsat。\n\n别名：vxsat.VALUE[0]"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "vsstatus"
          desc: "虚拟监管者状态\n\nvsstatus 寄存器追踪并控制 hart 的当前运行状态。\n\n它是 VS 模式的 `sstatus` 版本，在 VS 模式下替代该寄存器（_i.e._，在 VS 模式下 CSR 地址 0x100 为 `vsstatus`，而不是 `sstatus`）。\n\n不同于 `sstatus` 与 `mstatus` 之间的位关系，`vsstatus` 中的任一比特均不与其他位域构成别名。\n\n虚拟地址：256"
          fields:
            - name: "SD"
              bits: "31"
              desc: "*状态脏*\n\n只读位，用于汇总 `vsstatus.FS`、<% if ext?(:V) %>、`vsstatus.VS`、<% end %> 或 `vsstatus.XS` 位域中是否指示了某种脏状态（_即_，其中任一字段持有值 `11`）。\n\n此位并非 `mstatus.SD` 的别名，因为它仅反映对 VS 模式可见的状态（例如，`status.FS` 不影响 `vsstatus.SD`）。\n\n受影响的：F, D, V"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "SPELP"
              bits: "23"
              desc: "VS 模式之前期望的着陆垫状态\n\n在从陷阱进入 VS 模式时保存先前的预期着陆垫（`ELP`）状态，并在从 VS 模式进入 `SRET` 时恢复至 `ELP`。\n\n由 Zicfilp 扩展定义。\n\n根据特权架构，当 V=0 时，对 `sstatus.SPELP` 的访问解析到 `mstatus.SPELP`；当 V=1 时，解析到 `vsstatus.SPELP`；V=1 的路由由 H 扩展的 CSR 地址重映射（本 CSR 中的 `virtual_address`）处理，因此该位域为独立状态——并非 `mstatus.SPELP` 的别名。\n\n编码形式为：\n\n* 0 - `NO_LP_EXPECTED` - 无着陆垫指令预期。\n* 1 - `LP_EXPECTED` - 预期出现着陆指令。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "MXR"
              bits: "19"
              desc: "*使可执行页可读*\n\n允许在有效 VU-mode 或 VS-mode 下加载时读取可执行页（通常情况下，可执行页不可读）。\n\n* 当值为 1 时，如果页面在 G-stage 地址转换中标记为可读，或标记为可执行且 `status.MXR` 已置位，则允许有效 VU-mode 或 VS-mode 下的加载访问。\n* 当值为 0 时，有效 VU-mode 或 VS-mode 下从可执行页加载会引发页故障异常；如果 `sstatus.MXR` 也已置位，则适用上述规则。\n\n'vsstatus.MXR' 影响有效 VU-mode 或 VS-mode 下的所有加载：\n\n* VU-mode 下的所有加载\n* VS-mode 下的所有加载\n* `mstatus.MPRV` == 1、`mstatus.MPV` == 1 且 `mstatus.MPP`[1] == 0 时 M-mode 下的加载\n* 任一 `hlv.*` 指令产生的加载。\n\n别名：mstatus.MXR"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "SUM"
              bits: "18"
              desc: "*允许监管者内存访问*\n\n允许 VS 模式读取用户页。\n\n适用于以下加载和存储操作：\n\n* VS 模式中的所有加载和存储操作。\n* 当 `mstatus.MPRV` == 1、`mstatus.MPP` == 1 且 `mstatus.MPV` == 1 时，M 模式所有加载和存储操作。\n* 由 `hlv.*`、`hlvx.*` 或 `hsv.*` 指令生成的加载和存储操作。\n\n当 `vsstatus.SUM` 等于 0 时，上述类别的加载和存储操作在进行 VS 级别翻译时若访问到用户页，则引发 `Illegal Instruction` 异常。否则，在进行 VS 级别翻译时，上述类别的加载或存储操作被允许访问用户页。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "XS"
              bits: "16:15"
              desc: "*自定义（X）扩展上下文状态*\n\n汇总任意自定义扩展状态的当前值。取值为 0 - 关闭，1 - 初始，2 - 清洁，3 - 污染。由于不存在自定义扩展，该位域为只读 0。\n\n别名：mstatus.XS"
            - name: "FS"
              bits: "14:13"
              desc: "*浮点上下文状态*\n\n当 0 为 1 时，若在 VS 模式或 VU 模式模式下禁用浮点指令（来自 F 和 D 扩展），将引发 ILLEGAL INSTRUCTION 异常。在所有模式（包括 VS 模式和 VU 模式）中，当 `mstatus.FS` 为 0 时，同样禁用所有浮点指令。\n\n当一个浮点寄存器，或 `fcsr` 寄存器在 VS 模式或 VU 模式中被写入时，`vsstatus.FS` 寄存器将被写入值 3。\n\n值 1 和 2 为软件的有效写入值，但硬件除可能启用先前已禁用的浮点单元外，不会对此进行解释。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "VS"
              bits: "10:9"
              desc: "*向量上下文状态*\n\n当 0 为 1 时，向量指令（来自 V 扩展）被禁用，并引发 ILLEGAL INSTRUCTION 异常。当向一个向量寄存器或向量 CSR 写入时，VS 获取值 3。值 1 和 2 为软件的有效写入值，但硬件仅将其用于可能启用先前已禁用的向量单元。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "SPP"
              bits: "8"
              desc: "*VS 模式上一特权级*\n\n以进入 VS 模式时的先前名义特权级（即 0 对应 VU 模式和 1 对应 VS 模式）写入，也可由软件在无即时副作用的情况下写入。\n\n在从 VS 模式发生异常返回时，机器将进入存储于 `vsstatus.SPP` 中的正常特权级。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "UBE"
              bits: "6"
              desc: "*VU 模式大端序*\n\n控制 VU 模式的字节序（0 = 小端，1 = 大端）。\n\n[when,\"VU_MODE_ENDIANNESS == 'little'\"]\n由于 CPU 不支持大端模式，此设置被硬编码为 0。\n\n[when,\"VU_MODE_ENDIANNESS == 'big'\"]\n由于 CPU 不支持大端模式，此设置被硬编码为 1。"
              reset_info: "Unified DB reset_value() 表达式： if (VU_MODE_ENDIANNESS == \"little\") { return 0; } else if (VU_MODE_ENDIANNESS == \"big\") { return 1; } else { return UNDEFINED_LEGAL; }"
            - name: "SPIE"
              bits: "5"
              desc: "*VS 模式之前中断使能*\n\n硬件在两种情况下写入：\n\n* 在从异常/中断进入 VS 模式时，使用进入 `vsstatus.SIE` 时的原值。\n* 在发生异常返回至 VS 模式时，使用值 1（通过 `sret` 指令）设置。\n\n也可由软件写入，且无即时副作用。\n\n除作为上述描述的嵌套陷阱记录之外，`vsstatus.SPIE` 不影响执行。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "SIE"
              bits: "1"
              desc: "*VS 模式中断使能*\n\n硬件在两种情况下写入：\n\n* 以 0 的值进入 VS 模式时，从异常/中断中退出。\n* 在从 VS 模式的异常返回时，使用返回时 `vsstatus.SPIE` 的先前值（通过 `sret`）。\n\n通过以下方式影响执行：\n\n* 当 0 为 1 时，当前特权级别为 VS（即 H）的 VS 模式中断被禁用（S 模式和 M 模式中断仍保持启用）。\n* 当 1、VS 模式中未通过 `vsie` 中的位域其他方式禁用的中断被启用。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "vstvec"
          desc: "虚拟监管者陷阱向量\n\n控制陷阱跳转的目标位置。\n\n虚拟地址：261"
          fields:
            - name: "BASE"
              bits: "31:2"
              desc: "<%- va_size = ext?(:Sv57) ? 57 : (ext?(:Sv48) ? 48 : 39) -%>\n任何进入 VS 模式的陷阱所对应的异常向量的虚拟地址的位域 [VSXLEN-1:2]。\n\n若基地址使用非规范地址（即位[VSXLEN-1:<%= va_size %>]与位<%= va_size-1 %>不匹配），则该写操作应被忽略。"
            - name: "MODE"
              bits: "1:0"
              desc: "异步中断的向量模式进入 VS 模式。\n\n0 - 直接，1 - 向量化\n\n当直接时，所有同步异常和异步中断跳转至（`vstvec.BASE` << 2）。\n\n当带向量的异步中断跳转至 (`vstvec.BASE` << 2 + `vscause.CODE`*4) 而同步异常继续跳转至 (`vstvec.BASE` << 2)。"
              reset_info: "Unified DB reset_value() 表达式： return ($array_size(VSTVEC_MODES) == 1) ? VSTVEC_MODES[0] : UNDEFINED_LEGAL;"
        - name: "vsepc"
          desc: "虚拟监管者异常程序计数器\n\n在 PC 中写入一条指令，该指令在发生 VS 模式的异常或中断时执行。\n\n也控制在 VS 模式发生异常返回时 hart 的跳转目标。\n\n虚拟地址：321"
          fields:
            - name: "PC"
              bits: "31:0"
              desc: "当发生陷阱并进入 VS 模式时，`vsepc.PC` 被写入引起中断或异常的指令的虚拟地址。否则，`vsepc.PC` 从不被实现写入，尽管软件可以显式地写入它。\n\n在从 VS 模式（由 SRET 指令触发）的异常返回时，控制转移至从 `vsepc.PC` 读出的虚拟地址。\n\n因为程序计数器始终为 <% if ext?(:C) %>半字<% else %>字<% end %>对齐\n<% if ext?(:C) %>位 0 <% else %>位 1:0 <% end %>位为 `vsepc.PC` 的始终\n只读 0。\n\n[when,\"ext?(:C) && MUTABLE_MISA_C == true\"]\n当 `misa.C` 为零时，位 1 被屏蔽为零。对位 1 的写入仍会被捕获，且\n可能在下一次读取时可见，当 `misa.C` 位被置位时。\n\n持有与异常相关的虚拟地址的位域 [VSXLEN-1:<%= ext?(:C) ? 2 : 1 %>]。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "vscause"
          desc: "虚拟监管者原因\n\n报告在 VS 模式中发生异常的原因为何。\n\n虚拟地址：322"
          fields:
            - name: "INT"
              bits: "31"
              desc: "硬件在发生陷阱时写入 VS 模式。\n\n当置位时，最后一次异常是由异步中断引起的。\n\n`vscause.INT` 可写。\n\n[when,\"TRAP_ON_ILLEGAL_WLRL == true\"]\n若将 `vscause` 写入未定义原因（`vscause.INT` 和 `vscause.CODE` 的组合），则发生 `Illegal Instruction` 异常。\n\n[when,\"TRAP_ON_ILLEGAL_WLRL == false\"]\n若将 `vscause` 写入未定义原因（`vscause.INT` 和 `vscause.CODE` 的组合），则既不修改 `vscause.INT` 也不修改 `vscause.CODE`。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "CODE"
              bits: "30:0"
              desc: "硬件在发生陷阱时写入 VS 模式。\n\n保存最后一次触发陷阱的中断或异常代码。\n\n`vscause.CODE` 可写。\n\n[when,\"TRAP_ON_ILLEGAL_WLRL == true\"]\n若将 `vscause` 写入未定义原因（`vscause.INT` 和 `vscause.CODE` 的组合），则发生 `Illegal Instruction` 异常。\n\n[when,\"TRAP_ON_ILLEGAL_WLRL == false\"]\n若将 `vscause` 写入未定义原因（`vscause.INT` 和 `vscause.CODE` 的组合），则既不修改 `vscause.INT` 也不修改 `vscause.CODE`。\n\n有效中断码为：\n[separator=\"!\"]\n!===\n<%- implemented_interrupt_codes.sort_by { |code| code.num }.each do |code| -%>\n! <%= code.num %> ! <%= code.name %>\n<%- end -%>\n!===\n\n有效异常码为：\n[separator=\"!\"]\n!===\n<%- implemented_exception_codes.sort_by { |code| code.num }.each do |code| -%>\n! <%= code.num %> ! <%= code.name %>\n<%- end -%>\n!==="
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "vstval"
          desc: "虚拟监管者陷阱值\n\n持有陷阱特定信息\n\n虚拟地址：323"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "在发生陷阱时，于 VS 模式中填写与陷阱相关的特定信息。\n\n值为：\n\n[separator=\"!\"]\n!===\n! 异常类型 ! 值\n\n! [0] 指令地址未对齐 ! 未对齐的虚拟 PC（与写入 `mepc` 的值相同）。 ! [1] 指令访问故障 ! 导致访问故障的虚拟 PC<% if ext?(:C) %> 部分<% end %><%- unless ext?(:C) -%>（与写入 `mepc` 的值相同）<%- end -%>。 ! [2] 非法指令 ! 非法指令的编码。 ! [3] 断点 ! [when,\"REPORT_VA_IN_VSTVAL_ON_BREAKPOINT == true\"] 当由 EBREAK 指令引起时，为断点指令的虚拟 PC。\n\n [when,\"REPORT_VA_IN_VSTVAL_ON_BREAKPOINT == false\"]\n当由 EBREAK 指令引起时，值为零。\n\n由数据地址（即断点）引起的故障，其故障的虚拟地址。由指令地址断点引起的故障，其故障的虚拟地址为 PC。! [4] 负载地址未对齐 ! 未对齐的虚拟负载地址。! [5] 负载访问故障 ! 导致访问故障的虚拟负载地址部分。\n\n当加载操作未对齐时，报告的值是导致故障的页面中最小地址（_例如_，若一个 8-byte 加载操作均匀分布在页面内，且故障发生在第二页，将报告地址 + 4）。\n\n（尽管访问故障发生在物理地址上，但报告的是虚拟地址）! [6] 存储/AMO 地址未对齐 ! 未对齐的虚拟存储/AMO 地址。! [7] 存储/AMO 访问故障 ! 导致访问故障的虚拟存储/AMO 地址。\n\n当 store/AMO 未对齐时，报告的值是导致故障的页面中最小地址（_例如_，若一个 8-byte 存储操作均分于一个页面内，且故障发生在第二个页面，将报告地址 + 4）。\n\n（尽管访问故障发生在物理地址上，但报告的是虚拟地址）\n! [8] 来自 U 模式 <% if ext?(:H) %> 或 VU 模式 <% end %> ! 零\n! [9] 客户机调用来自 (H)S 模式 ! 零寄存器\n<%- if ext?(:H) -%>\n! [10] 来自 VS 模式 ! 零的环境调用\n<%- end -%>\n! [12] 指令页故障\n! <% if ext?(:C) %> 部分的 <% end %> 虚拟 PC 引发页故障\n<% unless ext?(:C) %>（值同写入`mepc`）<% end %>。\n! [13] 页加载故障\n! 导致页故障的虚拟加载地址的部分。\n\n当加载操作未对齐时，报告的值是导致故障的页面中最小地址（_例如_，若一个 8-byte 加载操作均匀分布在页面内，且故障发生在第二个页面，将报告地址 + 4）。! [15] 存储/AMO 页面故障 ! 该虚拟存储/AMO 操作中导致页面故障的地址。\n\n当 store/AMO 未对齐时，报告的值是导致故障的页面中最小地址\n（例如，如果一个 8-byte 存储操作在页面内均分，且故障发生在第二个页面，将报告地址 + 4）。\n<%- if ext?(:H) -%>\n! [20] 指令客户机页故障\n! <% if ext?(:C) %> 部分的 <% end %> 虚拟 PC 导致故障 <% unless ext?(:C) %>（与写入到 `mepc` 的值相同）<% end %>。\n\n客户机物理地址在 `mtval2` 中报告。! [21] 加载客户机页故障 ! 指造成故障的虚拟地址部分。\n\n当加载操作未对齐时，报告的值是导致故障的页面中最小地址（_例如_，若一个 8-byte 加载操作均匀分布在页面内，且故障发生在第二页，将报告地址 + 4）。\n\n客户机物理地址报告于`mtval2`。! [22] 虚拟指令 ! 的故障虚拟指令编码。! [23] 存储/AMO 客户机页故障 ! 引发故障的虚拟地址部分。\n\n当 store/AMO 未对齐时，报告的值是导致故障的页面中最小地址（_例如_，若一个 8-byte 存储操作均分于一个页面内，且故障发生在第二个页面，将报告地址 + 4）。\n\n客户机物理地址在 `htval` 中报告。\n<%- end -%>\n!==="
        - name: "vsctrctl"
          desc: "虚拟监管者控制传输记录控制寄存器\n\n`vsctrctl` 寄存器是监管者模式寄存器 `sctrctl` 的 VS 模式版本，用于配置控制传输记录能力。当 `V=1`、vsctrctl 替代通常的 `sctrctl` 时，原本读取或修改 `sctrctl` 的指令实际上会访问 `vsctrctl`。\n\n虚拟地址：334"
          fields:
            - name: "U"
              bits: "0"
              desc: "在 VU 模式下启用传输记录。\n\n别名：sctrctl.U"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "S"
              bits: "1"
              desc: "在 VS 模式下启用传输记录。\n\n别名：sctrctl.S"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "RASEMU"
              bits: "7"
              desc: "当置位时，启用 RAS（返回地址栈）仿真模式。\n\n别名：mctrctl.RASEMU"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "STE"
              bits: "8"
              desc: "在 S=0 时，启用将陷阱记录到 VS 模式。\n\n别名：mctrctl.STE"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "BPFRZ"
              bits: "11"
              desc: "在断点异常陷阱到 VS 模式时，设置 `sctrstatus.FROZEN`。\n\n别名：mctrctl.BPFRZ"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "LCOFIFRZ"
              bits: "12"
              desc: "在本地计数器溢出中断（LCOFI）上设置 `sctrstatus.FROZEN`，该中断导致陷入 VS 模式。\n\n别名：mctrctl.LCOFIFRZ"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "vsiselect"
          desc: "虚拟监管者间接寄存器选择\n\n`vsiselect` 寄存器将至少支持值范围 0..0xFFF。未来扩展可能定义超出该最小范围的值范围。只有当此类扩展被实现时，`vsiselect` 才需要支持更大的值。\n\n要求为 0-0xFFF 范围内的 `vsiselect` 提供支持，即使该范围内的大部分或全部空间被保留或不可访问，也允许虚拟机监控器在该实现范围内间接模拟访问寄存器，包括未来可能被标准化的寄存器。\n\n建议 `vsiselect` 和 `siselect` 使用相同的位数。此举可避免因二者宽度存在可观测差异而产生虚拟化漏洞。\n\n`vsiselect` 的值在最高有效位置位时（位域 XLEN - 1 = 1）仅用于定制用途， 可能用于通过别名 CSRs 访问定制寄存器。最高有效位清零的值仅用于标准用途，并保留直至被分配给标准架构扩展。\n\n若 XLEN 发生改变，`vsiselect` 的最高有效位将移至新位置，保持其先前的值。\n\n虚拟地址：592"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "间接寄存器选择值\n\n索引值用于选择通过 `vsireg*` 别名寄存器访问的寄存器。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "vsireg"
          desc: "虚拟监管者间接寄存器别名\n\n`vsireg` 和 CSR 是一组用于间接访问 VS 模式或 VU 模式中虚拟监管者级 CSR 的别名寄存器。\n\n地址为 `vsireg` 的寄存器由当前 `vsiselect` CSR 的值选定。\n\n别名机制允许间接 CSR 访问，有助于虚拟化及未来可扩展性。\n\n对于来自 VS 模式或 VU 模式的直接访问 `vsiselect` 或 `vsireg`，或来自 VU 模式的访问 `siselect` 或 `sireg` 的尝试，将引发虚拟指令异常。\n\n当 `vsireg` 的访问行为在 `vsiselect` 持有在 HS 级未实现的值时，其行为为 UNSPECIFIED。\n\n实现建议对通过 `vsireg` 访问未实现目标的访问引发非法指令异常。\n\n`vsireg` 的宽度始终为当前的 `XLEN`，而非 `VSXLEN`。例如，若 `HSXLEN = 64` 和 `VSXLEN = 32`，则当从 HS 模式（RV64）访问时，`vsireg` 的宽度为 64 位，当从 VS 模式（RV32）访问时，其宽度为 32 位。\n\n虚拟地址：593"
