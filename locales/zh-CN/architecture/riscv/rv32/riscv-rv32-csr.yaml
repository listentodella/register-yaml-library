            - name: "EM"
              bits: "11"
              desc: "*来自 M 模式的环境调用*\n\n来自 M 模式的环境调用无法委派，因此该字段为只读字段。\n\n所有来自 M 模式的环境调用异常由 M 模式捕获。"
            - name: "IPF"
              bits: "12"
              desc: "*指令页故障*\n\n将指令页故障异常委托给 (H)S 模式。\n<%- if ext?(:H) -%>\n指令页故障异常可能进一步委派给 VS 模式，如果 `hedeleg.IPF` 也置位。\n<%- end -%>\n\n异常永远不会进入更低特权级模式，无论`medeleg`如何。\n\n处理模式的确定方式如下：\n\n<%- if ext?(:H) -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.IPF`# .2+! [.rotate]#`hedeleg.IPF`# 4+^.>! 当前模式\n.>h! `M 模式` .>h! `HS 模式` .>h! `VS 模式` .>h! `VU 模式`\n\n! 0 ! 0 ! M ! M ! M ! M\n! 0 ! 1 ! M ! M ! M ! M\n! 1 ! 0 ! M ! HS ! HS ! HS\n! 1 ! 1 ! M ! HS ! VS ! VS\n!===\n<%- else -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.IPF`# 2+^.>! 当前模式\n.>h! `M 模式` .>h! `S 模式`\n\n! 0 ! M ! M\n! 1 ! M ! S\n!===\n<%- end -%>"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "LPF"
              bits: "13"
              desc: "*加载页故障*\n\n将加载页故障异常委托给 (H)S 模式。\n<%- if ext?(:H) -%>\n页加载页故障异常可能进一步委派给 VS 模式，如果 `hedeleg.LPF` 也置位。\n<%- end -%>\n\n异常永远不会进入更低特权级模式，无论`medeleg`如何。\n\n处理模式的确定方式如下：\n\n<%- if ext?(:H) -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.LPF`# .2+! [.rotate]#`hedeleg.LPF`# 4+^.>! 当前模式\n.>h! `M 模式` .>h! `HS 模式` .>h! `VS 模式` .>h! `VU 模式`\n\n! 0 ! 0 ! M ! M ! M ! M\n! 0 ! 1 ! M ! M ! M ! M\n! 1 ! 0 ! M ! HS ! HS ! HS\n! 1 ! 1 ! M ! HS ! VS ! VS\n!===\n<%- else -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.LPF`# 2+^.>! 当前模式\n.>h! `M 模式` .>h! `S 模式`\n\n! 0 ! M ! M\n! 1 ! M ! S\n!===\n<%- end -%>"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "SPF"
              bits: "15"
              desc: "*存储/AMO 页故障*\n\n将 Store/AMO 页故障异常委托给 (H)S 模式。\n<%- if ext?(:H) -%>\n存储/AMO 页故障异常可能进一步委派给 VS 模式，如果 `hedeleg.SPF` 也置位。\n<%- end -%>\n\n异常永远不会进入更低特权级模式，无论`medeleg`如何。\n\n处理模式的确定方式如下：\n\n<%- if ext?(:H) -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.SPF`# .2+! [.rotate]#`hedeleg.SPF`# 4+^.>! 当前模式\n.>h! `M 模式` .>h! `HS 模式` .>h! `VS 模式` .>h! `VU 模式`\n\n! 0 ! 0 ! M ! M ! M ! M\n! 0 ! 1 ! M ! M ! M ! M\n! 1 ! 0 ! M ! HS ! HS ! HS\n! 1 ! 1 ! M ! HS ! VS ! VS\n!===\n<%- else -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.LPF`# 2+^.>! 当前模式\n.>h! `M 模式` .>h! `S 模式`\n\n! 0 ! M ! M\n! 1 ! M ! S\n!===\n<%- end -%>"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "IGPF"
              bits: "20"
              desc: "*指令客户机页故障*\n\n将客户机页故障异常委托给 (H)S 模式。\n<%- if ext?(:H) -%>\n指令客户机页故障异常_不能被委派给VS模式_。\n<%- end -%>\n\n异常永远不会进入更低特权级模式，无论`medeleg`如何。\n\n处理模式的确定方式如下：\n\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.IGPF`# 2+^.>! 当前模式\n.>h! `M 模式` .>h! `(H)S 模式`\n\n! 0 ! M ! M\n! 1 ! M ! HS\n!==="
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "LGPF"
              bits: "21"
              desc: "*加载客户机页故障*\n\n将客户机页故障异常委托给 (H)S 模式。\n<%- if ext?(:H) -%>\n加载客户机页故障异常_不能被委派给VS模式_。\n<%- end -%>\n\n异常永远不会进入更低特权级模式，无论`medeleg`如何。\n\n处理模式的确定方式如下：\n\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.LGPF`# 2+^.>! 当前模式\n.>h! `M 模式` .>h! `(H)S 模式`\n\n! 0 ! M ! M\n! 1 ! M ! HS\n!==="
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "VI"
              bits: "22"
              desc: "*虚拟指令*\n\n将虚拟指令异常委托给 (H)S 模式。\n<%- if ext?(:H) -%>\n虚拟指令异常_不能被委派给VS模式_。\n<%- end -%>\n\n异常永远不会进入更低特权级模式，无论`medeleg`如何。\n\n处理模式的确定方式如下：\n\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.VI`# 2+^.>! 当前模式\n.>h! `M 模式` .>h! `(H)S 模式`\n\n! 0 ! M ! M\n! 1 ! M ! HS\n!==="
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "SGPF"
              bits: "23"
              desc: "*存储/AMO 客户机页故障*\n\n将 Store/AMO 客户机页故障异常委托给 (H)S 模式。\n<%- if ext?(:H) -%>\n存储/AMO 客户机页故障异常_不能被委派给 VS 模式_。\n<%- end -%>\n\n异常永远不会进入更低特权级模式，无论`medeleg`如何。\n\n处理模式的确定方式如下：\n\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.SGPF`# 2+^.>! 当前模式\n.>h! `M 模式` .>h! `(H)S 模式`\n\n! 0 ! M ! M\n! 1 ! M ! HS\n!==="
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "mideleg"
          desc: "机器模式中断委派\n\n控制从 M 模式到 HS/S 模式的异常委托\n\n默认情况下，所有特权级的陷阱均在机器模式下处理，尽管机器模式处理程序可通过 `MRET` 指令将陷阱重定向回适当的特权级。为提高性能，实现可提供 `mideleg` 中的独立读/写位，以指示某些异常和中断应直接由较低特权级处理。\n\n在具有 S 模式的 hart 中，`mideleg` 寄存器必须\n存在，并设置位 `mideleg` 将委派该\n相应的陷阱，当在 S 模式或 U 模式发生时，指向 S 模式\n陷阱处理程序\n<%- if ext?(:H) -%>\n（可进一步委托给 VS 模式通过 hideleg）\n<%- end -%>\n.\n<%- if ext?(:S, \"> 1.9.1\") -%>\n在没有 S 模式的 hart 中，`mideleg` 寄存器不应存在。\n\n[NOTE]\n====\n在 1.9.1 及更早版本中，该寄存器存在但为\n在 M 模式中硬连线为零，或在没有 N 个 hart 的 M/U 中。没有\n原因要求它们在那些情况下返回零，即 `misa`\n寄存器指示它们是否存在。\n====\n<%- else -%>\n在没有 S 模式的 hart 中，`mideleg` 寄存器为只读零。\n<%- end -%>\n\n实现可以选择裁剪可委托的陷阱，通过将每个位位置写为1，然后读回`mideleg`中的值以查看哪些位位置保持为1，从而确定所支持的可委托位。\n\n[NOTE]\n====\n版本 1.11 及更早版本禁止有任何位为 `mideleg` 被设置\n只读位。平台标准可能始终添加此类限制。\n====\n\n陷阱永远不会从更高特权级模式过渡到更低特权级模式。例如，如果 M 模式将非法指令异常委托给 S 模式，而 M 模式软件随后执行非法指令，则陷阱将在 M 模式中发生，而不是被委托到 S 模式。相反，陷阱可以水平发生。使用相同的例子，如果 M 模式将非法指令异常委托给 S 模式，而 S 模式软件随后执行非法指令，则陷阱将在 S 模式中发生。\n\n委托中断会导致该中断在委托者特权级别被屏蔽。例如，如果通过设置 `mideleg`[5] 将监管者定时器中断（STI）委托给 S 模式，则在执行于 M 模式时不会产生监管者中断（STIs）。相反，如果 `mideleg`[5] 为零，则无论当前模式如何，均可产生 STIs，并且无论当前模式都将控制权转移至 M 模式。\n\n`mideleg` 包含各个中断的陷阱委托位，位布局与 `mip` 寄存器中的布局一致（即，STIP 中断委托控制位于位 5）。\n\n对于在较低特权模式下无法发生的异常，相应的 `medeleg` 位应为只读零。特别地，`medeleg`[11] 为只读零。\n\n[when,\"ext?(:Smdbltrp) || ext?(:Ssdbltrp)\"]\n`medeleg`[16] 为只读零，因为双陷阱不可委托。"
          fields:
            - name: "SSI"
              bits: "1"
              desc: "*监管者软件中断委托*\n\n当 1、监管者软件中断被委派给 HS/S 模式。"
            - name: "VSSI"
              bits: "2"
              desc: "*虚拟监管者软件中断委托*\n\n当 1，虚拟监管者软件中断被委派给 HS 模式。\n\n虚拟监管者软件中断始终被委派给 HS 模式，因此该位域为只读位域。"
            - name: "MSI"
              bits: "3"
              desc: "*机器模式软件中断委托*\n\n由于 M 模式中断无法被委派，该位域为只读零。"
            - name: "STI"
              bits: "5"
              desc: "*监管者定时器中断委托*\n\n当 1、监管者定时器中断被委派给 HS/S 模式。"
            - name: "VSTI"
              bits: "6"
              desc: "*虚拟监管者定时器中断委托*\n\n当 1，虚拟监管者定时器中断被委派给 HS 模式。\n\n虚拟监管者时钟中断始终被委派给 HS 模式，因此该位域为只读位域。"
            - name: "MTI"
              bits: "7"
              desc: "*机器模式定时器中断委托*\n\n由于 M 模式中断无法被委派，该位域为只读零。"
            - name: "SEI"
              bits: "9"
              desc: "*监管者外部中断委托*\n\n当 1、监管者外部中断被委派给 HS/S 模式。"
            - name: "VSEI"
              bits: "10"
              desc: "*虚拟监管者外部中断委托*\n\n虚拟监管者外部中断始终被委派给 HS 模式，因此该位域为只读位域。"
            - name: "MEI"
              bits: "11"
              desc: "*机器模式外部中断委托*\n\n由于 M 模式中断无法被委派，该位域为只读零。"
            - name: "SGEI"
              bits: "12"
              desc: "监管者客户机外部中断委托\n\n监管者客户机外部中断始终被委派给 HS 模式，因此该位域为只读位域。"
            - name: "LCOFI"
              bits: "13"
              desc: "*本地计数器溢出中断委托*\n\n当 1，本地计数器溢出中断被委派给 (H)S 模式。"
          condition: "任一满足： Sm \"<= 1.9.1\"，全部满足： S \"> 1.9.1\"，Sm \"> 1.9.1\""
        - name: "mie"
          desc: "机器模式中断使能\n\nmip.yaml#/描述"
          fields:
            - name: "SSIE"
              bits: "1"
              desc: "启用监管者软件中断。"
            - name: "VSSIE"
              bits: "2"
              desc: "启用虚拟监管者软件中断。"
            - name: "MSIE"
              bits: "3"
              desc: "启用机器模式软件中断。"
            - name: "STIE"
              bits: "5"
              desc: "启用监管者定时器中断。"
            - name: "VSTIE"
              bits: "6"
              desc: "启用虚拟监管者定时器中断。"
            - name: "MTIE"
              bits: "7"
              desc: "启用机器模式定时器中断。"
            - name: "SEIE"
              bits: "9"
              desc: "启用监管者外部中断。"
            - name: "VSEIE"
              bits: "10"
              desc: "启用虚拟监管者外部中断。"
            - name: "MEIE"
              bits: "11"
              desc: "启用机器模式外部中断。"
            - name: "SGEIE"
              bits: "12"
              desc: "启用监管者客户机外部中断"
            - name: "LCOFIE"
              bits: "13"
              desc: "启用本地计数器溢出中断。"
        - name: "mtvec"
          desc: "机器模式陷阱向量控制\n\n控制陷阱跳转的目标位置。"
          fields:
            - name: "BASE"
              bits: "31:2"
              desc: "任何在 M 模式中发生的陷阱所对应的异常向量物理地址的位域 [MXLEN-1:2]。\n\n实现的物理内存映射可能限制该位域中哪些值是合法的。"
            - name: "MODE"
              bits: "1:0"
              desc: "异步中断的向量模式。\n\n0 - 直接，1 - 向量化\n\n当直接时，所有同步异常和异步中断跳转至（`mtvec.BASE` << 2）。\n\n当带向量的异步中断跳转至 (`mtvec.BASE` << 2 + `mcause.CODE`*4) 而同步异常继续跳转至 (`mtvec.BASE` << 2)。"
              reset_info: "Unified DB reset_value() 表达式： return ($array_size(MTVEC_MODES) == 1) ? MTVEC_MODES[0] : UNDEFINED_LEGAL;"
        - name: "menvcfg"
          desc: "机器模式环境配置\n\n包含用于控制低于 M 模式的特权等级的执行环境特性的位域。\n\n`menvcfg` CSR 控制低于 M 权限模式的执行环境特性。\n\n如果在 `menvcfg` 中将位 FIOM（Fence of I/O implies Memory）置为一，则在比 M 更低特权模式下执行的 FENCE 指令的访问顺序要求将被修改，使得对设备 I/O 的访问顺序要求也扩展至对主存访问的顺序要求。<<menvcfg-FIOM>> 详细说明了当 FIOM=1 时，在比 M 更低特权模式下 FENCE 指令的位域 PI、PO、SI 和 SO 的修改解释。\n\n同样，当模式的特权等级低于 M 且 FIOM=1 时，若一个访问被标记为设备 I/O 区域的原子指令其 _aq_ 和/或 _rl_ 位被置位，则该指令的顺序将被视为同时访问设备 I/O 和内存。\n\n若不支持 S 模式，或若 `satp`.MODE 为只读零（始终为 Bare），实现可能将 FIOM 设为只读零。\n\n[[menvcfg-FIOM]]\n.FENCE 前驱和后继集在 FIOM=1 且权限等级低于 M 时的修改解释。\n[separator=\"!\",%autowidth,float=\"center\",align=\"center\",cols=\"^,<\",options=\"header\"]\n!===\n!指令位 | 设置时的含义\n!PI +\nPO\n!前代设备输入及内存读取（PR 隐式）+\n前驱设备输出及内存写入（PW 隐含）\n!SI +\nSO\n!后继设备输入及内存读取（SR 隐含）+\n后继设备输出及内存写入（SW 隐含）\n!===\n\n[NOTE]\n====\n位 FIOM 需要在 `menvcfg` 中设置，以便 M 模式能够模拟 `H`（虚拟机监控器）\n扩展，其具有一个\n虚拟机监控器中 FIOM 位对应的等效位在 CSR `henvcfg` 中。\n====\n\nPBMTE 位控制 Svpbmt 扩展是否可用于 S 模式阶段和 G 阶段的地址转换（即，用于由 `satp` 或 `hgatp` 指向的页表）。当 PBMTE=1 时，Svpbmt 可用于 S 模式和 G 阶段的地址转换。当 PBMTE=0 时，实现行为等同于未实现 Svpbmt。如果未实现 Svpbmt，则 PBMTE 为只读零。此外，对于具有虚拟机扩展的实现，若 `menvcfg`.PBMTE 为零，则 `henvcfg`.PBMTE 为只读零。\n\n修改 `menvcfg`.PBMTE 后，执行一条 _rs1_=`x0` 且 _rs2_=`x0` 的 SFENCE.VMA 指令即可使地址转换缓存与页表项的 PBMT 位域的修改解释保持同步。当实现虚拟机扩展时，参见 <<hyp-mm-fences>> 以获取额外的同步要求。\n\n若实现 Svadu 扩展，ADUE 位控制是否启用硬件更新 PTE A/D 位，用于 S 模式和 G 阶段地址转换。当 ADUE=1 时，在 S 模式地址转换期间启用硬件更新 PTE A/D 位，且实现行为等同于未实现 Svade 扩展，用于 S 模式地址转换。当实现虚拟机扩展时，若 ADUE=1，则在 G 阶段地址转换期间启用硬件更新 PTE A/D 位，且实现行为等同于未实现 Svade 扩展，用于 G 阶段地址转换。当 ADUE=0 时，实现行为等同于已实现 Svade，用于 S 模式和 G 阶段地址转换。 若未实现 Svadu，则 ADUE 为只读零。此外，对于具有虚拟机扩展的实现，若 `menvcfg`.ADUE 为零，则 `henvcfg`.ADUE 为只读零。\n\nNOTE：Svade扩展要求在需要设置PTE A/D位时触发页故障异常，因此当ADUE=0时实现Svade。\n\n若实现 Smcdeleg 扩展，CDE（计数器委托使能）位控制 Zicntr 和 Zihpm 计数器是否可委托给 S 模式。当 CDE=1 时，启用 Smcdeleg 扩展，参见 <<smcdeleg>>。当 CDE=0 时，Smcdeleg 和 Ssccfg 扩展被视为未实现。若未实现 Smcdeleg，则 CDE 为只读零。\n\nSTCE 位域的定义由 Sstc 扩展提供。\n\nCBZE 位域的定义由 Zicboz 扩展提供。\n\nCBCFE 和 CBIE 位域的定义由 Zicbom 扩展提供。\n\nPMM 位域的定义将由即将推出的 Smnpm 扩展提供。其在 `menvcfg` 中的分配在该扩展定稿前可能发生变化。\n\nZicfilp 扩展在 `menvcfg` 中增加 `LPE` 位域。当 `LPE` 位域设置为 1 且 S 模式被实现时，Zicfilp 扩展在 S 模式中启用。如果 `LPE` 位域设置为 1 且 S 模式未实现，则 Zicfilp 扩展在 U 模式中启用。当 `LPE` 位域为 0 时，Zicfilp 扩展在 S 模式中不启用，且以下规则适用于 S 模式。如果 `LPE` 位域为 0 且 S 模式未实现，则相同的规则适用于 U 模式。\n\n* hart 不更新 `ELP` 状态；其保持为 `NO_LP_EXPECTED`。\n* `LPAD` 指令操作为无操作。\n\nZicfiss 扩展在 `menvcfg` 中增加 `SSE` 位域。当 `SSE` 位域置为 1 时，Zicfiss 扩展在 S 模式中被激活。当 `SSE` 位域为 0 时，以下规则适用于特权模式且其等级小于 M 的情况：\n\n* 32-bit Zicfiss 指令将恢复为 Zimop 定义的行为。\n* 16-bit Zicfiss 指令将恢复为 Zcmop 所定义的行为。\n* `pte.xwr=010b` 编码在 VS/S 阶段页表中变为保留。\n* `henvcfg.SSE` 和 `senvcfg.SSE` 位域将读为零且为只读。\n* `SSAMOSWAP.W/D` 发生非法指令异常。\n\nSsdbltrp 扩展在 `menvcfg` 中增加了一个双陷阱使能（`DTE`）位域。当 `menvcfg.DTE` 为零时，实现行为等同于 Ssdbltrp 未实现。当 Ssdbltrp 未实现时，`sstatus.SDT`、`vsstatus.SDT` 和 `henvcfg.DTE` 位域读为只读零。\n\n当 XLEN=32 时，`menvcfgh` 是一个 32-bit 读/写寄存器，其别名了 `menvcfg` 寄存器的位域 63:32。当 XLEN=64 时，`menvcfgh` 寄存器不存在。\n\n若不支持 U 模式，则寄存器 `menvcfg` 和 `menvcfgh` 不存在。"
          fields:
            - name: "CBZE"
              bits: "7"
              desc: "*缓存块零指令使能*\n\n启用缓存块零指令的执行，`CBO.ZERO`\n<% if ext?(:S) %>\n在 S 模式中\n<% elsif ext?(:U) %>\n在 U 模式中\n<% end %>。\n\n * `0`：该指令引发非法指令或虚拟指令异常\n * `1`：该指令被执行"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "CBCFE"
              bits: "6"
              desc: "*缓存块清除和刷新指令使能*\n\n启用缓存块清除指令的执行，`CBO.CLEAN`，以及\n缓存块清除指令，`CBO.FLUSH`\n<% if ext?(:S) %>\n在 S 模式中\n<% elsif ext?(:U) %>\n在 U 模式中\n<% end %>。\n\n * `0`：该指令引发非法指令或虚拟指令异常\n * `1`：该指令被执行"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "CBIE"
              bits: "5:4"
              desc: "*缓存块无效化指令使能*\n\n启用缓存块无效指令的执行，`CBO.INVAL`\n<% if ext?(:S) %>\n在 S 模式中\n<% elsif ext?(:U) %>\n在 U 模式中\n<% end %>。\n\n * `00`：该指令引发非法指令或虚拟指令异常\n * `01`：该指令被执行并执行刷新操作\n * `10`: _保留_\n * `11`：指令执行并执行无效操作"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "SSE"
              bits: "3"
              desc: "*影栈使能*\n\n当 SSE 位域设置为 1 时，激活 Zicfiss 扩展，该扩展在 S 模式中生效。当 SSE 位域为 0 时，以下规则适用于特权模式，且该模式等级低于 M：\n\n-32-bit Zicfiss 指令将恢复为 Zimop 定义的行为。\n\n-16-bit Zicfiss 指令将恢复为 Zcmop 所定义的行为。\n\n-VS/S 阶段页表中 pte.xwr=010b 编码变为保留。\n\n- SSAMOSWAP.W/D 引发非法指令异常。\n\n当 menvcfg.SSE 为 0 时，henvcfg.SSE 和 senvcfg.SSE 位域为只读零。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "LPE"
              bits: "2"
              desc: "*着陆垫使能*\n\n当 LPE 位域设置为 1 且 S 模式被实现时，Zicfilp 扩展在 S 模式中被启用。如果 LPE 位域设置为 1 且 S 模式未被实现，则 Zicfilp 扩展在 U 模式中被启用。当 LPE 位域为 0 时，Zicfilp 扩展在 S 模式中不被启用（或在 U 模式中，如果 S 模式未被实现），并遵循以下规则：\n\n * hart 不更新 `ELP` 状态；其保持为 `NO_LP_EXPECTED`。\n * `LPAD` 指令操作为无操作。\n\n当 `menvcfg.LPE` 等于 0 时，`henvcfg.LPE` 和 `senvcfg.LPE` 为只读零。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "FIOM"
              bits: "0"
              desc: "*内存屏障 I/O 意味着内存*\n\n当 `menvcfg.FIOM` 被置位时，FENCE 指令的 I/O 区域在任何低于 M 模式的特权级别的模式下执行时，也隐式地对内存区域进行排序。\n\n[separator=\"!\",%autowidth,float=\"center\",align=\"center\",cols=\"^,<\",options=\"header\"]\n!===\n!指令位 ! 设置时的含义\n!PI +\nPO\n!前代设备输入及内存读取（PR 隐式）+\n前驱设备输出及内存写入（PW 隐含）\n!SI +\nSO\n!后继设备输入及内存读取（SR 隐含）+\n后继设备输出及内存写入（SW 隐含）\n!===\n\n同样，当模式的特权等级低于 M 且 FIOM=1 时，若一个访问被标记为设备 I/O 区域的原子指令其 _aq_ 和/或 _rl_ 位被置位，则该指令的顺序将被视为同时访问设备 I/O 和内存。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
          condition: "全部满足： Sm \">=1.12\"，U"
        - name: "mstateen0"
          desc: "机器模式状态使能 0 寄存器\n\n每个 `stateen` CSR 位控制较低特权级对扩展状态的访问，或对未被视为“值得”拥有完整 XS 位域的扩展的访问，例如在 `sstatus` 中的 FS 和 VS 位域，用于控制 F 和 V 扩展。\n\n每个级别提供的寄存器数量为四个，因为认为 4 * 64 = 256 位用于机器和虚拟机级别，而 4 * 32 = 128 位用于监管者级别，将足以满足未来多年的需求，或许至少能延续到 RISC-V ISA 仍被使用为止。确切的数值为四，是试图在一方面提供过少位数与另一方面过度设计将永不使用的 CSR 之间取得的平衡。\n\n`stateen` 寄存器在每一级控制对所有较低特权级状态的访问，但不控制对其自身级状态的访问。\n\n当 `stateen` CSR 阻止特权模式访问状态时，尝试在该特权模式下执行隐式更新状态但不读取状态的指令，可能引发非法指令或虚拟指令异常，也可能不引发。此类情况必须通过明确指定一种方式来区分。在某些情况下，`stateen` 的 CSR 位域将具有双重作用，作为启用 ISA 扩展功能的使能位，这些扩展功能引入了受控状态。\n\n对于 `sstateen` CSR 中每个有明确定义用途的位，对应的 `mstateen` CSR 中也定义了相同的位，用于控制机器级以下对相同状态的访问。`mstateen` CSR 的高 32 位（对于 RV32，则为对应的高半 CSR）控制对用户级本质上不可访问状态的访问，因此监管者级 `sstateen` CSR 中不适用对应的使能位。计划从最高有效端的第 63 位开始分配这些位，依次到第 32 位，然后继续分配到下一个编号更高的 `mstateen` CSR。 若从`sstateen` CSR的最低有效位端分配位的速率足够低，则允许从`mstateen` CSR的最高有效位端的位分配延伸至32位的低位区域，从而在跳转至更高层级的`mstateen` CSR之前发生侵入。在此情况下，被“侵入”的位在对应的`sstateen` CSR中的位位置将永久保持为只读零。\n\n对于 `mstateen` CSR 中每一个为零的位（无论是只读零还是被设置为零），相同的位在对应的 `hstateen` 和 `sstateen` 控制状态寄存器（CSR）中也表现为只读零。\n\n一个位于监管者模式的 `sstateen` CSR 寄存器中的位若为只读一位，则必须在对应的匹配的 `mstateen` CSR 寄存器中同样为只读一位，且如果存在，则在对应的匹配的 `hstateen` CSR 寄存器中也必须为只读一位。一个位于 `hstateen` CSR 寄存器中的位若为只读一位，则必须在对应的匹配的 `mstateen` CSR 寄存器中同样为只读一位。每个 `mstateen` CSR 寄存器中的位 63 可仅设为只读零，当且仅当虚拟机扩展未实现，且对应的监管者级 `sstateen` CSR 寄存器的所有位均为只读零。"
          fields:
            - name: "JVT"
              bits: "2"
              desc: "jvt 访问控制\n\nJVT 位控制对 `jvt` 提供的 CSR 的访问，该功能由 Zcmt 扩展提供。"
            - name: "FCSR"
              bits: "1"
              desc: "fcsr 访问控制\n\nFCSR 位控制浮点指令操作 `x` 寄存器而非 `f` 寄存器时对 `fcsr` 的访问，该行为由 Zfinx 及相关扩展（如 Zdinx 等）指定。每当 `misa.F` = 1 时，FCSR 位在 `mstateen0` 中为只读零（因此在 `hstateen0` 和 `sstateen0` 中同样为只读零）。为方便起见，当实现 `stateen` CSRs 且 `misa.F` = 0 时，若控制 `stateen0` CSR 的 FCSR 位为零，则所有浮点指令将引发非法指令陷阱（或虚拟指令陷阱，视情况而定），如同它们均访问 `fcsr`，无论实际是否如此。"
            - name: "C"
              bits: "0"
              desc: "自定义状态访问控制\n\nC 位控制对任何和全部自定义状态的访问。这些寄存器中的 C 位本身并非自定义状态；它是一个标准位域，属于标准 CSR 寄存器中的位域，即 `mstateen0`、`hstateen0` 或 `sstateen0` 之一。"
        - name: "mstateen1"
          desc: "机器模式状态使能 1 寄存器\n\n每个 `stateen` CSR 位控制较低特权级对扩展状态的访问，或对未被视为“值得”拥有完整 XS 位域的扩展的访问，例如在 `sstatus` 中的 FS 和 VS 位域，用于控制 F 和 V 扩展。\n\n每个级别提供的寄存器数量为四个，因为认为 4 * 64 = 256 位用于机器和虚拟机级别，而 4 * 32 = 128 位用于监管者级别，将足以满足未来多年的需求，或许至少能延续到 RISC-V ISA 仍被使用为止。确切的数值为四，是试图在一方面提供过少位数与另一方面过度设计将永不使用的 CSR 之间取得的平衡。\n\n`stateen` 寄存器在每一级控制对所有较低特权级状态的访问，但不控制对其自身级状态的访问。\n\n当 `stateen` CSR 阻止特权模式访问状态时，尝试在该特权模式下执行隐式更新状态但不读取状态的指令，可能引发非法指令或虚拟指令异常，也可能不引发。此类情况必须通过明确指定一种方式来区分。在某些情况下，`stateen` 的 CSR 位域将具有双重作用，作为启用 ISA 扩展功能的使能位，这些扩展功能引入了受控状态。\n\n对于 `sstateen` CSR 中每个有明确定义用途的位，对应的 `mstateen` CSR 中也定义了相同的位，用于控制机器级以下对相同状态的访问。`mstateen` CSR 的高 32 位（对于 RV32，则为对应的高半 CSR）控制对用户级本质上不可访问状态的访问，因此监管者级 `sstateen` CSR 中不适用对应的使能位。计划从最高有效端的第 63 位开始分配这些位，依次到第 32 位，然后继续分配到下一个编号更高的 `mstateen` CSR。 若从`sstateen` CSR的最低有效位端分配位的速率足够低，则允许从`mstateen` CSR的最高有效位端的位分配延伸至32位的低位区域，从而在跳转至更高层级的`mstateen` CSR之前发生侵入。在此情况下，被“侵入”的位在对应的`sstateen` CSR中的位位置将永久保持为只读零。\n\n对于 `mstateen` CSR 中每一个为零的位（无论是只读零还是被设置为零），相同的位在对应的 `hstateen` 和 `sstateen` 控制状态寄存器（CSR）中也表现为只读零。\n\n一个位于监管者模式的 `sstateen` CSR 寄存器中的位若为只读一位，则必须在对应的匹配的 `mstateen` CSR 寄存器中同样为只读一位，且如果存在，则在对应的匹配的 `hstateen` CSR 寄存器中也必须为只读一位。一个位于 `hstateen` CSR 寄存器中的位若为只读一位，则必须在对应的匹配的 `mstateen` CSR 寄存器中同样为只读一位。每个 `mstateen` CSR 寄存器中的位 63 可仅设为只读零，当且仅当虚拟机扩展未实现，且对应的监管者级 `sstateen` CSR 寄存器的所有位均为只读零。"
          fields: []
        - name: "mstateen2"
          desc: "机器模式状态使能 2 寄存器\n\n每个 `stateen` CSR 位控制较低特权级对扩展状态的访问，或对未被视为“值得”拥有完整 XS 位域的扩展的访问，例如在 `sstatus` 中的 FS 和 VS 位域，用于控制 F 和 V 扩展。\n\n每个级别提供的寄存器数量为四个，因为认为 4 * 64 = 256 位用于机器和虚拟机级别，而 4 * 32 = 128 位用于监管者级别，将足以满足未来多年的需求，或许至少能延续到 RISC-V ISA 仍被使用为止。确切的数值为四，是试图在一方面提供过少位数与另一方面过度设计将永不使用的 CSR 之间取得的平衡。\n\n`stateen` 寄存器在每一级控制对所有较低特权级状态的访问，但不控制对其自身级状态的访问。\n\n当 `stateen` CSR 阻止特权模式访问状态时，尝试在该特权模式下执行隐式更新状态但不读取状态的指令，可能引发非法指令或虚拟指令异常，也可能不引发。此类情况必须通过明确指定一种方式来区分。在某些情况下，`stateen` 的 CSR 位域将具有双重作用，作为启用 ISA 扩展功能的使能位，这些扩展功能引入了受控状态。\n\n对于 `sstateen` CSR 中每个有明确定义用途的位，对应的 `mstateen` CSR 中也定义了相同的位，用于控制机器级以下对相同状态的访问。`mstateen` CSR 的高 32 位（对于 RV32，则为对应的高半 CSR）控制对用户级本质上不可访问状态的访问，因此监管者级 `sstateen` CSR 中不适用对应的使能位。计划从最高有效端的第 63 位开始分配这些位，依次到第 32 位，然后继续分配到下一个编号更高的 `mstateen` CSR。 若从`sstateen` CSR的最低有效位端分配位的速率足够低，则允许从`mstateen` CSR的最高有效位端的位分配延伸至32位的低位区域，从而在跳转至更高层级的`mstateen` CSR之前发生侵入。在此情况下，被“侵入”的位在对应的`sstateen` CSR中的位位置将永久保持为只读零。\n\n对于 `mstateen` CSR 中每一个为零的位（无论是只读零还是被设置为零），相同的位在对应的 `hstateen` 和 `sstateen` 控制状态寄存器（CSR）中也表现为只读零。\n\n一个位于监管者模式的 `sstateen` CSR 寄存器中的位若为只读一位，则必须在对应的匹配的 `mstateen` CSR 寄存器中同样为只读一位，且如果存在，则在对应的匹配的 `hstateen` CSR 寄存器中也必须为只读一位。一个位于 `hstateen` CSR 寄存器中的位若为只读一位，则必须在对应的匹配的 `mstateen` CSR 寄存器中同样为只读一位。每个 `mstateen` CSR 寄存器中的位 63 可仅设为只读零，当且仅当虚拟机扩展未实现，且对应的监管者级 `sstateen` CSR 寄存器的所有位均为只读零。"
          fields: []
        - name: "mstateen3"
          desc: "机器模式状态使能 3 寄存器\n\n每个 `stateen` CSR 位控制较低特权级对扩展状态的访问，或对未被视为“值得”拥有完整 XS 位域的扩展的访问，例如在 `sstatus` 中的 FS 和 VS 位域，用于控制 F 和 V 扩展。\n\n每个级别提供的寄存器数量为四个，因为认为 4 * 64 = 256 位用于机器和虚拟机级别，而 4 * 32 = 128 位用于监管者级别，将足以满足未来多年的需求，或许至少能延续到 RISC-V ISA 仍被使用为止。确切的数值为四，是试图在一方面提供过少位数与另一方面过度设计将永不使用的 CSR 之间取得的平衡。\n\n`stateen` 寄存器在每一级控制对所有较低特权级状态的访问，但不控制对其自身级状态的访问。\n\n当 `stateen` CSR 阻止特权模式访问状态时，尝试在该特权模式下执行隐式更新状态但不读取状态的指令，可能引发非法指令或虚拟指令异常，也可能不引发。此类情况必须通过明确指定一种方式来区分。在某些情况下，`stateen` 的 CSR 位域将具有双重作用，作为启用 ISA 扩展功能的使能位，这些扩展功能引入了受控状态。\n\n对于 `sstateen` CSR 中每个有明确定义用途的位，对应的 `mstateen` CSR 中也定义了相同的位，用于控制机器级以下对相同状态的访问。`mstateen` CSR 的高 32 位（对于 RV32，则为对应的高半 CSR）控制对用户级本质上不可访问状态的访问，因此监管者级 `sstateen` CSR 中不适用对应的使能位。计划从最高有效端的第 63 位开始分配这些位，依次到第 32 位，然后继续分配到下一个编号更高的 `mstateen` CSR。 若从`sstateen` CSR的最低有效位端分配位的速率足够低，则允许从`mstateen` CSR的最高有效位端的位分配延伸至32位的低位区域，从而在跳转至更高层级的`mstateen` CSR之前发生侵入。在此情况下，被“侵入”的位在对应的`sstateen` CSR中的位位置将永久保持为只读零。\n\n对于 `mstateen` CSR 中每一个为零的位（无论是只读零还是被设置为零），相同的位在对应的 `hstateen` 和 `sstateen` 控制状态寄存器（CSR）中也表现为只读零。\n\n一个位于监管者模式的 `sstateen` CSR 寄存器中的位若为只读一位，则必须在对应的匹配的 `mstateen` CSR 寄存器中同样为只读一位，且如果存在，则在对应的匹配的 `hstateen` CSR 寄存器中也必须为只读一位。一个位于 `hstateen` CSR 寄存器中的位若为只读一位，则必须在对应的匹配的 `mstateen` CSR 寄存器中同样为只读一位。每个 `mstateen` CSR 寄存器中的位 63 可仅设为只读零，当且仅当虚拟机扩展未实现，且对应的监管者级 `sstateen` CSR 寄存器的所有位均为只读零。"
          fields: []
        - name: "mstatush"
          desc: "机器模式状态高\n\nmstatus 寄存器追踪并控制 hart 的当前运行状态。"
          fields:
            - name: "MDT"
              bits: "10"
              desc: "见 `mstatus.MDT`\n\n别名：mstatus.MDT"
            - name: "MPELP"
              bits: "9"
              desc: "见 `mstatus.MPELP`\n\n别名：mstatus.MPELP"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "MPV"
              bits: "7"
              desc: "见 `mstatus.MPV`\n\n别名：mstatus.MPV"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "GVA"
              bits: "6"
              desc: "见 `mstatus.GVA`\n\n别名：mstatus.GVA"
            - name: "MBE"
              bits: "5"
              desc: "见 `mstatus.MBE`\n\n别名：mstatus.MBE"
              reset_info: "Unified DB reset_value() 表达式： return (M_MODE_ENDIANNESS == \"big\") ? 1 : 0;"
            - name: "SBE"
              bits: "4"
              desc: "见 `mstatus.SBE`\n\n别名：mstatus.SBE"
              reset_info: "Unified DB reset_value() 表达式： if (S_MODE_ENDIANNESS == \"little\") { return 0; } else if (S_MODE_ENDIANNESS == \"big\") { return 1; } else { return UNDEFINED_LEGAL; }"
          condition: "全部满足： XLEN=32，Sm \">= 1.12\""
        - name: "medelegh"
          desc: "机器模式异常委派，高位位域\n\n`medeleg` 上部 32 位的别名。"
          fields: []
          condition: "全部满足： XLEN=32，S \">= 1.13\""
        - name: "menvcfgh"
          desc: "机器模式环境配置\n\n包含用于启用/禁用扩展的位域"
          fields:
            - name: "STCE"
              bits: "31"
              desc: "*STimecmp 启用*\n\n`menvcfg.STCE` 的别名\n\n别名：menvcfg.STCE"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "PBMTE"
              bits: "30"
              desc: "*基于页的内存类型使能*\n\n`menvcfg.PBMTE` 的别名\n\n别名：menvcfg.PBMTE"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "ADUE"
              bits: "29"
              desc: "`menvcfg.ADUE` 的别名\n\n别名：menvcfg.ADUE"
              reset_info: "Unified DB reset_value() 表达式： return (implemented?(ExtensionName::Svadu)) ? UNDEFINED_LEGAL : 0;"
          condition: "全部满足： XLEN=32，全部满足： Sm \">=1.12\"，U"
        - name: "mstateen0h"
          desc: "32 位的上部机器模式状态使能 0 寄存器\n\n对于 RV64 hart，Smstateen 扩展在机器级增加了四个新的 64-bit 控制和状态寄存器（CSRs）：`mstateen0`（机器模式状态使能 0）、`mstateen1`、`mstateen2` 和 `mstateen3`。对于 RV32，上述寄存器为 32-bit，而对于机器级的 CSRs，存在一组对应的高位半寄存器，用于表示每个寄存器的高 32 位：`mstateen0h`、`mstateen1h`、`mstateen2h` 和 `mstateen3h`。"
          fields:
            - name: "SE0"
              bits: "31"
              desc: "hstateen0、hstateen0h 和 sstateen0 访问控制\n\nSE0 位在 `mstateen0h` 中控制对 `hstateen0`、`hstateen0h` 和 `sstateen0` CSRs 的访问。\n\n别名：mstateen0.SE0"
            - name: "ENVCFG"
              bits: "30"
              desc: "henvcfg、henvcfgh 和 senvcfg 访问控制\n\nENVCFG 位在 `mstateen0h` 中控制对 `henvcfg`、`henvcfgh` 和 `senvcfg` CSRs 的访问。\n\n别名：mstateen0.ENVCFG"
            - name: "CSRIND"
              bits: "28"
              desc: "siselect、sireg*、vsiselect 和 vsireg* 的访问控制\n\nCSRIND 位在 `mstateen0h` 中控制对 `siselect`、`sireg*`、`vsiselect` 以及由 Sscsrind 扩展提供的 `vsireg*` CSRs 的访问。\n\n别名：mstateen0.CSRIND"
            - name: "AIA"
              bits: "27"
              desc: "Ssaia 状态访问控制\n\n`mstateen0h` 寄存器中的 AIA 位控制对 Ssaia 扩展引入的所有状态的访问，并且不受 CSRIND 位或 IMSIC 位的控制。\n\n别名：mstateen0.AIA"
            - name: "IMSIC"
              bits: "26"
              desc: "IMSIC 状态访问控制\n\n`mstateen0h` 寄存器中的 IMSIC 位控制对 IMSIC 状态的访问，包括由 Ssaia 扩展提供的 CSRs `stopei` 和 `vstopei`。\n\n别名：mstateen0.IMSIC"
            - name: "CONTEXT"
              bits: "25"
              desc: "scontext 和 hcontext 访问控制\n\n`mstateen0h` 寄存器中的 CONTEXT 位控制对 `scontext` 和 `hcontext` CSRs 的访问，这些 CSR 由 Sdtrig 扩展提供。\n\n别名：mstateen0.CONTEXT"
            - name: "P1P13"
              bits: "24"
              desc: "hedelegh 访问控制\n\nP1P13 位在 `mstateen0h` 中控制对由特权规范版本 1.13 引入的 `hedelegh` 的访问。\n\n别名：mstateen0.P1P13"
            - name: "SRMCFG"
              bits: "23"
              desc: "srmcfg 访问控制\n\n`mstateen0h` 寄存器中的 SRMCFG 位控制对 `srmcfg`` CSR 的访问，该功能由 Ssqosid 章节 18 扩展引入。\n\n别名：mstateen0.SRMCFG"
            - name: "CTR"
              bits: "22"
              desc: "ctr 访问控制\n\n当 Smstateen 被实现时，`mstateen0.CTR` 位控制来自低于 M 模式的特权模式对 CTR 寄存器状态的访问。\n\n别名：mstateen0.CTR"
          condition: "全部满足： XLEN=32，Smstateen"
        - name: "mstateen1h"
          desc: "32 位的上部机器模式状态使能 1 寄存器\n\n对于 RV64 hart，Smstateen 扩展在机器级增加了四个新的 64-bit 控制和状态寄存器（CSRs）：`mstateen0`（机器模式状态使能 0）、`mstateen1`、`mstateen2` 和 `mstateen3`。对于 RV32，上述寄存器为 32-bit，而对于机器级的 CSRs，存在一组对应的高位半寄存器，用于表示每个寄存器的高 32 位：`mstateen0h`、`mstateen1h`、`mstateen2h` 和 `mstateen3h`。"
          fields:
            - name: "SE0"
              bits: "31"
              desc: "hstateen1、hstateen1h 和 sstateen1 访问控制\n\nSE0 位在 `mstateen1h` 中控制对 `hstateen1`、`hstateen1h` 和 `sstateen1` CSRs 的访问。\n\n别名：mstateen1.SE0"
          condition: "全部满足： XLEN=32，Smstateen"
        - name: "mstateen2h"
          desc: "32 位的上部机器模式状态使能 2 寄存器\n\n对于 RV64 hart，Smstateen 扩展在机器级增加了四个新的 64-bit 控制和状态寄存器（CSRs）：`mstateen0`（机器模式状态使能 0）、`mstateen1`、`mstateen2` 和 `mstateen3`。对于 RV32，上述寄存器为 32-bit，而对于机器级的 CSRs，存在一组对应的高位半寄存器，用于表示每个寄存器的高 32 位：`mstateen0h`、`mstateen1h`、`mstateen2h` 和 `mstateen3h`。"
          fields:
            - name: "SE0"
              bits: "31"
              desc: "hstateen2、hstateen2h 和 sstateen2 访问控制\n\nSE0 位在 `mstateen2h` 中控制对 `hstateen2`、`hstateen2h` 和 `sstateen2` CSRs 的访问。\n\n别名：mstateen2.SE0"
          condition: "全部满足： XLEN=32，Smstateen"
        - name: "mstateen3h"
          desc: "32 位的上部机器模式状态使能 3 寄存器\n\n对于 RV64 hart，Smstateen 扩展在机器级增加了四个新的 64-bit 控制和状态寄存器（CSRs）：`mstateen0`（机器模式状态使能 0）、`mstateen1`、`mstateen2` 和 `mstateen3`。对于 RV32，上述寄存器为 32-bit，而对于机器级的 CSRs，存在一组对应的高位半寄存器，用于表示每个寄存器的高 32 位：`mstateen0h`、`mstateen1h`、`mstateen2h` 和 `mstateen3h`。"
          fields:
            - name: "SE0"
              bits: "31"
              desc: "hstateen3、hstateen3h 和 sstateen3 访问控制\n\nSE0 位在 `mstateen3h` 中控制对 `hstateen3`、`hstateen3h` 和 `sstateen3` CSRs 的访问。\n\n别名：mstateen3.SE0"
          condition: "全部满足： XLEN=32，Smstateen"
        - name: "mscratch"
          desc: "机器模式临时寄存器\n\n软件使用的一般寄存器。位域不被硬件解释。"
          fields:
            - name: "SCRATCH"
              bits: "31:0"
              desc: "暂存值"
        - name: "mepc"
          desc: "机器模式异常程序计数器\n\n在 PC 中写入一条指令，该指令在发生 M 模式的异常或中断时执行。\n\n也控制在 M 模式发生异常返回时 hart 的跳转目标。"
          fields:
            - name: "PC"
              bits: "31:0"
              desc: "当发生陷阱并进入 M 模式时，`mepc.PC` 被写入引起中断或异常的指令的虚拟地址。否则，`mepc.PC` 从不被实现写入，尽管软件可以显式地写入它。\n\n在从 M 模式（由 MRET 指令触发）的异常返回时，控制转移至从 `mepc.PC` 读出的虚拟地址。\n\n[when,\"ext?(:C)\"]\n因为程序计数器始终为半字对齐，因此 `mepc.PC` 寄存器的 0 位域始终为\n只读 0。\n\n[when,\"!ext?(:C)\"]\n因为程序计数器始终为字对齐，因此 1:0 寄存器的 `mepc.PC` 位域始终为\n只读 0。\n\n[when,\"ext?(:C) && MUTABLE_MISA_C == true\"]\n当 `misa.C` 为零时，位 1 被屏蔽为零。对位 1 的写入仍会被捕获，且\n可能在下一次读取时可见，当 `misa.C` 位被置位时。"
        - name: "mcause"
          desc: "机器模式原因\n\n报告最新异常的原因。"
          fields:
            - name: "INT"
              bits: "31"
              desc: "硬件在发生陷阱时写入 M 模式。\n\n当置位时，最后一次异常是由异步中断引起的。\n\n`mcause.INT` 是可写入的。\n\n[when,\"TRAP_ON_ILLEGAL_WLRL == true\"]\n若将 `mcause` 写入未定义原因（`mcause.INT` 和 `mcause.CODE` 的组合），则发生 `Illegal Instruction` 异常。\n\n[when,\"TRAP_ON_ILLEGAL_WLRL == false\"]\n若将 `mcause` 写入未定义原因（`mcause.INT` 和 `mcause.CODE` 的组合），则既不修改 `mcause.INT` 也不修改 `mcause.CODE`。"
            - name: "CODE"
              bits: "30:0"
              desc: "硬件在发生陷阱时写入 M 模式。\n\n保存最后一次触发陷阱的中断或异常代码。\n\n`mcause.CODE` 可写。\n\n[when,\"TRAP_ON_ILLEGAL_WLRL == true\"]\n若将 `mcause` 写入未定义原因（`mcause.INT` 和 `mcause.CODE` 的组合），则发生 `Illegal Instruction` 异常。\n\n[when,\"TRAP_ON_ILLEGAL_WLRL == false\"]\n若将 `mcause` 写入未定义原因（`mcause.INT` 和 `mcause.CODE` 的组合），则既不修改 `mcause.INT` 也不修改 `mcause.CODE`。\n\n有效中断码为：\n[separator=\"!\"]\n!===\n<%- implemented_interrupt_codes.sort_by{ |code| code.num }.each do |code| -%>\n! <%= code.num %> ! <%= code.name %>\n<%- end -%>\n!===\n\n有效异常码为：\n[separator=\"!\"]\n!===\n<%- implemented_exception_codes.sort_by{ |code| code.num }.each do |code| -%>\n! <%= code.num %> ! <%= code.name %>\n<%- end -%>\n!==="
        - name: "mtval"
          desc: "机器模式陷阱值\n\n持有陷阱特定信息"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "在发生陷阱时，于 M 模式中填写与陷阱相关的特定信息。\n\n值为：\n\n[separator=\"!\"]\n!===\n! 异常类型 ! 值\n\n! [0] 指令地址未对齐 ! 未对齐的虚拟 PC（与写入 `mepc` 的值相同）。 ! [1] 指令访问故障 ! 导致访问故障的虚拟 PC<% if ext?(:C) %> 部分<% end %><%- unless ext?(:C) -%>（与写入 `mepc` 的值相同）<%- end -%>。 ! [2] 非法指令 ! 非法指令的编码。 ! [3] 断点 ! [when,\"REPORT_VA_IN_MTVAL_ON_BREAKPOINT == true\"] 当由 EBREAK 指令引起时，为断点指令的虚拟 PC。\n\n [when,\"REPORT_VA_IN_MTVAL_ON_BREAKPOINT == false\"]\n当由 EBREAK 指令引起时，值为零。\n\n由数据地址（即断点）引起的故障，其故障的虚拟地址。由指令地址断点引起的故障，其故障的虚拟地址为 PC。! [4] 负载地址未对齐 ! 未对齐的虚拟负载地址。! [5] 负载访问故障 ! 导致访问故障的虚拟负载地址部分。\n\n当加载操作未对齐时，报告的值是导致故障的页面中最小地址（_例如_，若一个 8-byte 加载操作均匀分布在页面内，且故障发生在第二页，将报告地址 + 4）。\n\n（尽管访问故障发生在物理地址上，但报告的是虚拟地址）! [6] 存储/AMO 地址未对齐 ! 未对齐的虚拟存储/AMO 地址。! [7] 存储/AMO 访问故障 ! 导致访问故障的虚拟存储/AMO 地址。\n\n当 store/AMO 未对齐时，报告的值是导致故障的页面中最小地址（_例如_，若一个 8-byte 存储操作均分于一个页面内，且故障发生在第二个页面，将报告地址 + 4）。\n\n（尽管访问故障发生在物理地址上，但报告的是虚拟地址）\n! [8] 来自 U 模式 <% if ext?(:H) %> 或 VU 模式 <% end %> ! 零\n! [9] 客户机调用来自 (H)S 模式 ! 零寄存器\n<%- if ext?(:H) -%>\n! [10] 来自 VS 模式 ! 零的环境调用\n<%- end -%>\n! [11] 来自 M 模式 ! 零的环境调用\n! [12] 指令页故障\n! <% if ext?(:C) %> 部分的 <% end %> 虚拟 PC 引发页故障\n<% unless ext?(:C) %>（值同写入`mepc`）<% end %>。\n! [13] 页加载故障\n! 导致页故障的虚拟加载地址的部分。\n\n当加载操作未对齐时，报告的值是导致故障的页面中最小地址（_例如_，若一个 8-byte 加载操作均匀分布在页面内，且故障发生在第二个页面，将报告地址 + 4）。! [15] 存储/AMO 页面故障 ! 该虚拟存储/AMO 操作中导致页面故障的地址。\n\n当 store/AMO 未对齐时，报告的值是导致故障的页面中最小地址\n（例如，如果一个 8-byte 存储操作在页面内均分，且故障发生在第二个页面，将报告地址 + 4）。\n<%- if ext?(:H) -%>\n! [20] 指令客户机页故障\n! <% if ext?(:C) %> 部分的 <% end %> 虚拟 PC 导致故障 <% unless ext?(:C) %>（与写入到 `mepc` 的值相同）<% end %>。\n\n客户机物理地址在 `mtval2` 中报告。! [21] 加载客户机页故障 ! 指造成故障的虚拟地址部分。\n\n当加载操作未对齐时，报告的值是导致故障的页面中最小地址（_例如_，若一个 8-byte 加载操作均匀分布在页面内，且故障发生在第二页，将报告地址 + 4）。\n\n客户机物理地址报告于`mtval2`。! [22] 虚拟指令 ! 的故障虚拟指令编码。! [23] 存储/AMO 客户机页故障 ! 引发故障的虚拟地址部分。\n\n当 store/AMO 未对齐时，报告的值是导致故障的页面中最小地址（_例如_，若一个 8-byte 存储操作均分于一个页面内，且故障发生在第二个页面，将报告地址 + 4）。\n\n客户机物理地址在 `mtval2` 中报告。\n<%- end -%>\n!==="
        - name: "mip"
          desc: "机器模式中断待处理\n\n当 CLINT 或 PLIC 中断控制器存在时，`mie` 和 `mip` CSR 是 MXLEN 位的可读写寄存器。请注意，CLINT 是部分 RISC-V 实现使用的中断控制器，但并非 RISC-V International 正式批准的标准。\n\n`mip` 和 CSR 包含有关待处理中断的信息，而 `mie` 对应于 CSR，其中包含中断使能位。中断原因编号 _i_（如在 `mcause` CSR 中报告）对应于 `mip` 和 `mie` 中的第 _i_ 位。位 15:0 仅分配给标准中断原因，而位 16 及以上位指定用于平台用途。\n\nNOTE：为平台使用设计的中断可能由平台酌情指定为定制使用。\n\n一个中断 _i_ 将会触发陷阱至 M 模式（导致特权模式更改为 M 模式），当且仅当以下所有条件均成立：\n\n * 要么当前特权模式是 M，且 `mstatus` 寄存器中的 MIE 位是\n设，或当前特权模式的特权等级低于M 模式；\n * 位 _i_ 在 `mip` 和 `mie` 中均被置位\n * 若寄存器 `mideleg` 存在，则位 _i_ 在 `mideleg` 中不置位。\n\n从中断在 `mip` 中变为或不再处于待处理状态起，必须在有限时间内评估这些中断陷阱条件；在执行 __x__RET 指令，或显式写入这些条件明确依赖的 CSR（包括 `mip`、`mie`、`mstatus` 和 `mideleg`）后，也必须立即评估这些条件。\n\n中断发送至 M 模式优先于发送至较低特权模式的任何中断。\n\n寄存器 `mip` 中的每一位可以是可写或只读。当寄存器 `mip` 中第 _i_ 位为可写时，可通过将 0 写入该位来清除待处理的中断 _i_。如果中断 _i_ 可以变为待处理状态，但寄存器 `mip` 中的第 _i_ 位为只读，则实现必须提供其他机制来清除待处理的中断。\n\n`mie` 中的每一位若对应的中断可能变为挂起状态，则该位必须可写；`mie` 中未定义为可写的位必须为只读零。\n\n[NOTE]\n====\n机器级中断寄存器处理少数根中断源，\n这些中断源为简化实现而分配了固定的服务优先级，\n而独立的外部中断控制器可以在更大的中断集合上实现更复杂的\n优先级方案，这些中断随后\n被复用到机器级中断源中。\n\n'''\n\n不可屏蔽中断不通过 `mip` 寄存器显现为\n其存在在执行 NMI 陷阱处理程序时隐式已知。\n====\n\n若实现监管者模式，则位 `mip`.SEIP 和 `mie`.SEIE 为监管者级外部中断的中断待处理和中断使能位。SEIP 在 `mip` 中可写，且可由 M 模式软件写入，以通知 S 模式有外部中断待处理。此外，平台级中断控制器可生成监管者级外部中断。监管者级外部中断的待处理状态由软件可写位 SEIP 的逻辑-OR 以及来自外部中断控制器的信号决定。 当使用 CSR 指令读取 `mip` 时，写入 `rd` 目标寄存器的 SEIP 位的值是软件可写位与中断控制器中断信号的逻辑OR，但中断控制器的信号不参与计算写入 SEIP 的值。只有软件可写的 SEIP 位参与 CSRRS 或 CSRRC 指令的读-修改-写序列。\n\n[NOTE]\n====\n例如，如果我们把软件可写 SEIP 位命名为 `B` 并且\n外部中断控制器 `E` 发出的信号，然后如果\n`csrrs t0, mip, t1` 被执行，`t0[9]` 用 `B || E` 写入，然后\n`B` 被写入 `B || t1[9]`。若执行 `csrrw t0, mip, t1`，\n然后 `t0[9]` 被写入 `B || E`，且 `B` 仅被写入\n`t1[9]`。在任一情况下，`B` 并不依赖于 `E`。\n\nSEIP 位域行为旨在允许更高特权层级\n干净地模拟外部中断，不丢失任何真实外部\n中断。CSR 指令的行为略有修改\n来自常规 CSR 访问的结果。\n====\n\n若实现监管者模式，则位域 `mip`.STIP 和 `mie`.STIE 为监管者级定时器中断的中断待处理和中断使能位。STIP 在 `mip` 中可写，且可被 M 模式软件写入，以向 S 模式交付定时器中断。\n\n若实现监管者模式，则位域 `mip`.SSIP 和 `mie`.SSIE 为监管者级软件中断的中断待处理和中断使能位域。SSIP 在 `mip` 中可写，并且可由特定平台的中断控制器设置为 1。\n\n<% if ext?(:Sscofpmf) -%>\n位域 `mip`.LCOFIP 和 `mie`.LCOFIE\n本地计数器溢出的中断挂起位和中断使能位是否有效\n中断。\nLCOFIP 在 `mip` 中为读写，反映本地的出现\n计数器溢出导致的溢出中断请求，源自任一的\n`mhpmevent__n__`.OF 位被置位。\n<% end -%>\n\n针对 M 模式的多个同时到达的中断，按照以下优先级递减顺序进行处理：MEI、MSI、MTI、SEI、SSI、STI、LCOFI。\n\n[NOTE]\n====\n机器级中断固定优先级排序规则的制定\n以下为相关理由。\n\n更高特权模式的中断必须在较低特权模式的中断之前得到服务，以支持抢占。\n\n位域 16 及以上的平台特定机器级中断源具有平台特定的优先级，但通常被选择为最高服务优先级，以支持快速的本地向量中断。\n\n外部中断在内部（定时器/软件）中断之前处理，因为外部中断通常由可能需要低中断服务时间的设备生成。\n\n软件中断在内部定时器中断之前被处理，\n因为内部定时器中断通常用于时间分片，\n其中时间精度不重要，而软件中断是\n用于处理器间消息传递。软件中断可以被避免。\n当需要高精度定时时，或需要高精度定时器\n中断可通过不同的中断路径进行路由。软件\n中断位于`mip`的最低四位中，因为这些位是\n常由软件写入，此位允许使用单个\n带有五位立即数的CSR指令。\n====\n\n`mip` 和 `mie` 寄存器的受限视图在监管者模式下表现为 `sip` 和 `sie` 寄存器。若通过在 `mideleg` 寄存器中置位将中断委派给 S 模式，则该中断在 `sip` 寄存器中可见，并可通过 `sie` 寄存器进行屏蔽。否则，`sip` 和 `sie` 寄存器中对应的位域读取值为只读零。"
          fields:
            - name: "SSIP"
              bits: "1"
              desc: "*监管者软件中断待处理*\n\n报告当前待处理状态的 (H)S 模式软件中断，该中断由向此位域写入生成。\n\n<%- if ext?(:Smaia) -%>\n当使用 AIA/IMSIC 时，IPIs 预期以外部中断的形式交付\n且 SSIP 未由任何硬件更新支持（除任何别名效应外）。\n然而，SSIP 仍可由 M 模式软件写入，且写入时可被用于\n生成一个 S 模式软件中断。\n<%- end -%>\n\n<% if ext?(:Smaia) %>_别名_<% else %>_别名_<% end %>:\n\n* `sip.SSIP` 当 `mideleg.SSI` 被置位时\n<%- if ext?(:Smaia) -%>\n* `mvip.SSIP`\n<%- end -%>\n\n别名：sip.SSIP, mvip.SSIP\n\n受影响来源：Smaia"
            - name: "VSSIP"
              bits: "2"
              desc: "*虚拟监管者软件中断待处理*\n\n报告当前待处理状态的 VS 模式软件中断，该中断由向此位域写入而生成。\n\n<%- if ext?(:Smaia) -%>\n当使用 AIA/IMSIC 时，IPIs 预期以外部中断的形式交付，且 VSSIP 无任何硬件更新支持（除任何别名写入外）。\n然而，VSSIP 仍可由 M 模式软件写入，且写入时可被用于\n生成一个 VS 模式软件中断。\n<%- end -%>\n\n别名：\n\n* `hip.VSSIP`\n* `hvip.VSSIP`\n* `vsip.SSIP` 当 `hideleg.VSSI` 被置位时\n\n别名：hip.VSSIP，hvip.VSSIP，vsip.SSIP，sip.SSIP\n\n受影响来源：Smaia"
            - name: "MSIP"
              bits: "3"
              desc: "*机器模式软件中断待处理*\n\n未使用位域。\n\n<%- if ext?(:Smaia) -%>\n在 AIA/IMSIC 中，IPI 以外部中断的形式送达。因此，该位是\n未使用且硬连线至 0。\n<%- end -%>"
            - name: "STIP"
              bits: "5"
              desc: "*监管者定时器中断待处理*\n\n报告当前待处理状态的 (H)S 模式定时器中断\n<%- if ext?(:Sstc) -%>\n，通常由 `stimecmp` CSR 控制。\n<%- else -%>\n由软件通过向 `mip.STIP`<% if ext?(:Smaia) %> 或其别名 `mvip.STIP`<% end %> 写入生成的异常。\n<%- end -%>\n\n<%-if ext?(:Sstc) -%>\n当 `menvcfg.STCE` 被置位时，`mip.STIP` 等于 RO-H，且完全由定时中断设备（使用 `stimecmp`）控制。\n\n当 `menvcfg.STCE` 为 0 时，`mip.STIP` 等于 RW，且软件可写入 M 模式位以注入监管者定时器中断。\n<%- end -%>\n\n<% if ext?(:Smaia) %>_别名_<% else %>_别名_<% end %>:\n\n* `sip.STIP` 当 `mideleg.STI` 被置位时（尽管 `sip.STIP` 为只读视图）\n<%- if ext?(:Smaia) -%>\n* `mvip.STIP` 当 `menvcfg.STCE` 为零时\n<%- end -%>\n\n别名：sip.STIP, mvip.STIP\n\n受影响内容：Sstc"
            - name: "VSTIP"
              bits: "6"
              desc: "*虚拟监管者定时器中断待处理*\n\n报告 VS 模式定时器中断的当前挂起状态\n<%- if ext?(:Sstc) -%>\n，通常由 `vstimecmp` CSR 控制，但也可通过虚拟机监控器通过 `hvip.VSTIP` 注入。\n<%- else -%>\n由 M 模式和/或 HS 模式软件通过向 `hvip.VSTIP` 写入生成。\n<%- end -%>\n\n<%-if ext?(:Sstc) -%>\n当 `menvcfg.STCE` 被置位（启用 `Sstc` 扩展）时，`mip.VSTIP` 是 OR 对 `hvip.VSTIP` 的逻辑映射，且为时钟设备生成的 VS 级中断信号（由 `vstimecmp` 的值控制）。\n\n当 `menvcfg.STCE` 为零（禁用 `Sstc` 扩展）时，`mip.VSTIP` 的值恰好等于 `hvip.VSTIP`。\n<%- end -%>\n\n`mip.VSTIP` 从不可写。若 VS 模式软件希望清除该位，必须如此\n<%- if ext?(:Sstc) -%>\n通过写入 `vstimecmp` 寄存器或\n<%- end -%>\n通过调用到虚拟机监控器（虚拟机监控器）（后者可以随后清除 `hvip.VSTIP`）。\n\n别名：\n\n* `hip.VSTIP`\n* `vsip.STIP` 当 `hideleg.VSTI` 被置位时\n* `hvip.VSTIP` <% if ext?(:Sstc) %> 当 `menvcfg.STCE` 为零时 <% end %>（尽管 `hvip.VSTIP` 可写）\n\n别名：hip.VSTIP\n\n受影响内容：Sstc"
            - name: "MTIP"
              bits: "7"
              desc: "*机器模式定时器中断待处理*\n\n报告当前待处理状态的 M 模式定时器中断。\n\n该位由定时器设备（使用 `mtimecmp`）控制，不可写。"
            - name: "SEIP"
              bits: "9"
              desc: "*监管者外部中断待处理*\n\n报告当前待处理状态的 (H)S 模式外部中断。\n\n该位域包含两个部分：一个可由软件写入的影子值和来自中断控制器的连线。软件在执行 CSR 读操作时，所看到的该位值为软件可写值和中断控制器值的逻辑 OR。当软件写入该位时，仅更新影子值（中断控制器不会被通知此次写入操作）。\n\n<%- if ext?(:Smaia) -%>\n软件可写影子值在 `mvip.SEIP`（`Smaia` 扩展）中被别名。\n<%- end -%>\n\n别名：\n\n* `sip.SEIP` 当 `mideleg.SEI` 被置位时（尽管 `sip.SEIP` 为只读）\n\n别名：sip.SEIP\n\n受影响来源：Smaia"
            - name: "VSEIP"
              bits: "10"
              desc: "*虚拟监管者外部中断待处理*\n\n报告 VS 模式外部中断的当前挂起状态。\n\n该位域是 OR 的逻辑 `hvip.VSEIP` 以及来自中断控制器的信号线。\n\n该位域不可由软件写入\n<%- if ext?(:Smaia) -%>\n（即，与 `mip.SEIP`/`mvip.SEIP` 的行为不同，对 `mip.VSEIP` 的写操作不会传播到 `hvip.VSEIP`）\n<%- end -%>\n.\n\n别名：\n\n* `hip.VSEIP`\n* `vsip.SEIP` 当 `hideleg.VSEI` 被置位时\n\n别名：hip.VSEIP，vsip.SEIP，sip.SEIP\n\n受影响来源：Smaia"
            - name: "MEIP"
              bits: "11"
              desc: "*机器模式外部中断待处理*\n\n报告当前待处理状态的 M 模式外部中断。\n\nMEIP 由外部中断控制器 <% if ext?(:Smaia) %>（AIA）<% end %> 控制。它不可由软件写入。"
            - name: "SGEIP"
              bits: "12"
              desc: "*监管者客户机外部中断待处理*\n\n只读摘要的任何待处理监管者客户机外部中断待处理，即：`hgeip` 寄存器的逻辑-OR 运算结果。\n\n别名：\n\n* `hip.SGEIP`\n\n别名：hip.SGEIP"
            - name: "LCOFIP"
              bits: "13"
              desc: "*本地计数器溢出中断待处理*\n\n<%- if ext?(:H) -%>\n当 `hideleg.LCOFI` 被置位时，\n`vsip.LCOFIP`、`sip.LCOFIP` 和 `mip.LCOFIP` 均为别名。\n<%- end -%>\n\n当计数器溢出中断发生时，设置一个隐藏的保持位。\n\n软件将 0 写入 `mip.LCOFIP` 以清除待处理中断。\n\n<% if ext?(:H) %>_别名_<% else %>_别名_<% end %>:\n\n* `sip.LCOFIP` 当 `mideleg.LCOFI` 被置位时\n<%- if ext?(:H) -%>\n* `vsip.LCOFIP` 当 `hideleg.LCOFI` 被置位时\n<%- end -%>\n\n别名：sip.LCOFIP, vsip.LCOFIP"
        - name: "mctrctl"
          desc: "机器模式控制传输记录控制寄存器\n\n`mctrctl` 寄存器在 M 模式下启用并配置控制传输记录能力。"
          fields:
            - name: "U"
              bits: "0"
              desc: "在用户模式启用传输记录。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "S"
              bits: "1"
              desc: "在监管者模式下启用传输记录。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "M"
              bits: "2"
              desc: "在机器模式模式下启用传输记录。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "RASEMU"
              bits: "7"
              desc: "当置位时，启用 RAS（返回地址栈）仿真模式。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "STE"
              bits: "8"
              desc: "在 S=0 时，启用将陷阱记录至 S 模式。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "MTE"
              bits: "9"
              desc: "在 M=0 时，启用将陷阱记录至 M 模式。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "BPFRZ"
              bits: "11"
              desc: "在断点异常陷阱到 M 或 S 模式时，设置 `sctrstatus.FROZEN`。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "LCOFIFRZ"
              bits: "12"
              desc: "在本地计数器溢出中断（LCOFI）上设置 `sctrstatus.FROZEN`，该中断触发转向 M 或 S 模式。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "mnscratch"
          desc: "机器模式临时寄存器\n\n软件在 NMI / 双陷阱中使用的暂存寄存器。位域不被硬件解释。"
          fields:
            - name: "SCRATCH"
              bits: "31:0"
              desc: "暂存值"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "mnepc"
          desc: "机器模式异常程序计数器\n\n在 PC 中写入一条指令，该指令在发生 M 模式的异常或中断时执行。\n\n也控制在 M 模式发生异常返回时 hart 的跳转目标。"
          fields:
            - name: "PC"
              bits: "31:0"
              desc: "当发生 NMI / 双重陷阱并进入 M 模式时，将虚拟地址写入 `mnepc.PC`，该地址为被中断的指令或触发异常的指令的虚拟地址。否则，`mnepc.PC` 由实现永不写入，尽管软件可显式写入该字段。\n\n在异常返回至 M 模式 NMI / 双陷阱（源自 MNRET 指令）时，控制转移至从 `mnepc.PC` 读出的虚拟地址。\n\n[when,\"ext?(:C)\"]\n因为程序计数器始终为半字对齐，因此 `mnepc.PC` 寄存器的 0 位域始终为\n只读 0。\n\n[when,\"!ext?(:C)\"]\n因为程序计数器始终为字对齐，因此 1:0 寄存器的 `mnepc.PC` 位域始终为\n只读 0。\n\n[when,\"ext?(:C) && MUTABLE_MISA_C == true\"]\n当 `misa.C` 为零时，位 1 被屏蔽为零。对位 1 的写入仍会被捕获，且\n可能在下一次读取时可见，当 `misa.C` 位被置位时。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "mncause"
          desc: "可恢复 NMI 原因\n\nmncause CSR 存储了 NMI 的原因。若该原因为中断，则置位位域 MXLEN-1 为 1，且在最低有效位中编码 NMI 原因。若该原因为中断且不支持 NMI 类型的中断，则置位位域 MXLEN-1 为 1，且最低有效位写为零。若该原因为 M 模式内部的异常并导致如 Smdbltrp 扩展中所规定的双陷阱，则置位位域 MXLEN-1 为 0，且最低有效位设置为引发双陷阱的异常对应的异常码。"
          fields:
            - name: "INT"
              bits: "31"
              desc: "硬件在发生可恢复 NMI 转入 M 模式时写入。\n\n当置位时，最后一个不可屏蔽异常是由异步中断引起的。\n\n[when,\"TRAP_ON_ILLEGAL_WLRL == true\"]\n若将 `mcause` 写入未定义原因（`mcause.INT` 和 `mcause.CODE` 的组合），则发生 `Illegal Instruction` 异常。\n\n[when,\"TRAP_ON_ILLEGAL_WLRL == false\"]\n若将 `mcause` 写入未定义原因（`mcause.INT` 和 `mcause.CODE` 的组合），则既不修改 `mcause.INT` 也不修改 `mcause.CODE`。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "CODE"
              bits: "30:0"
              desc: "TODO"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "mnstatus"
          desc: "机器模式 NMI 状态\n\nmnstatus 寄存器追踪并控制 hart 的当前 NMI 操作状态。"
          fields:
            - name: "MNPP"
              bits: "12:11"
              desc: "M 模式 NMI 之前特权。\n\n硬件在两种情况下写入：\n\n* 以进入 M 模式 NMI 时的先前名义特权级别编写。\n* 使用 0 在执行 `mnret` 指令以从双重异常 / NMI 返回时写入 M 模式。\n\n也可由软件在无立即副作用的情况下写入。\n\n影响执行的两种情况：\n\n* 在从双重异常/NMI 返回至 M 模式时，机器将\n在清除该位域之前，进入存储在 MNPP 中的特权级别。\n* 当 `mnstatus.MNPRV` 被置位时，加载和存储操作的行为如同当前特权级别为 MNPP。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "MNPELP"
              bits: "9"
              desc: "M 模式 NMI 之前预期的着陆垫状态。\n\n由 Zicfilp 扩展定义。在进入 M 模式 NMI 时保存先前的预期着陆垫（ELP）状态。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "MNPV"
              bits: "7"
              desc: "*机器模式上一版 NMI 虚拟化模式*\n\n在从异常/中断进入 M 模式的先前虚拟化模式时。当通过 MRET 指令返回时，虚拟化模式变为 MPV 的值，除非 MPP=3，此时虚拟化模式始终为 0。软件也可进行写入。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "NMIE"
              bits: "3"
              desc: "*M 模式 NMI 启用*\n\n硬件在两种情况下写入：\n\n* 以 0 的值进入 M 模式 NMI 时设置。\n* 以 0 的值进入 M 模式双重陷阱时写入。\n\n仅在一种情况下由软件写入：\n\n* NMIE 在复位时等于 0，用于引导代码初始化系统以响应非屏蔽中断（NMIs）。一旦 SW 将 NMIE 写入 1，此后 SW 再也无法更改该值。\n\n通过以下方式影响执行：\n\n* 当 0 有效时，若当前特权级别为 M，则所有不可屏蔽中断和异常被禁用。\n* 当 1、NMI 或双陷阱可能发生时。"
        - name: "mseccfg"
          desc: "机器模式安全配置\n\n机器模式安全配置"
          fields: []
          condition: "全部满足： Sm \">= 1.12\"，任一满足： Zkr，Smmpm，Zicfilp，Smepmp"
        - name: "mseccfgh"
          desc: "机器模式安全配置的最高有效 32 位\n\n机器模式安全配置"
          fields: []
          condition: "全部满足： XLEN=32，全部满足： Sm \">= 1.12\"，任一满足： Zkr，Smmpm，Zicfilp，Smepmp"
        - name: "mvendorid"
          desc: "机器模式生产商 ID\n\n报告核心制造商为JEDEC的ID。"
          fields:
            - name: "Bank"
              bits: "31:7"
              desc: "JEDEC 制造商 ID 银行减 1"
              reset_info: "Unified DB reset_value() 表达式： return VENDOR_ID_BANK;"
            - name: "Offset"
              bits: "6:0"
              desc: "JEDEC 制造商 ID 偏移量"
              reset_info: "Unified DB reset_value() 表达式： return VENDOR_ID_OFFSET;"
        - name: "marchid"
          desc: "机器模式架构 ID\n\n`marchid` CSR 是一个 MXLEN 位的只读寄存器，用于编码 hart 的基微架构。该寄存器在任何实现中都必须可读，但可返回 0 的值以指示该位域未实现。`mvendorid` 和 `marchid` 的组合应唯一标识所实现的 hart 微架构类型。\n\n开放源代码项目架构 ID 由 RISC-V 国际全局分配，其架构 ID 非零且最高有效位为零（MSB）。商业架构 ID 由各商业供应商独立分配，但必须设置 MSB 位，且其余 MXLEN 至 1 位不得包含零。\n\n[NOTE]\n====\n意图是让架构 ID 代表微架构\n与开发发生所围绕的代码仓库相关联，而非一个\n特定组织。开源设计的商业制造\n应（且可能因许可证要求）保留原始\n架构 ID。此将有助于减少碎片化和工具\n支持成本，以及提供署名。开源架构\nIDs 由 RISC-V 国际管理，并且应仅由\n分配至释放，运行中的开源项目。商业\n架构 ID 可以由任何注册供应商独立管理\n但必须具有与开源架构ID不重叠的ID\nIDs （MSB 已置位） 以防止碰撞，若厂商希望同时使用\n闭源和开源微架构。\n\n以下实现位域中采用的约定可以\n用于分离同一架构设计的分支，包括由\n组织。`misa` 寄存器也帮助区分不同的\n设计的变体。\n===="
          fields:
            - name: "Architecture"
              bits: "31:0"
              desc: "厂商特定的微架构 ID。"
              reset_info: "Unified DB reset_value() 表达式： return ARCH_ID_VALUE;"
        - name: "mimpid"
          desc: "机器模式 Implementation ID\n\n报告供应商特定的实现 ID。\n\n`mimpid` CSR 提供了处理器实现版本的唯一编码。该寄存器在任何实现中都必须可读，但可返回 0 值以指示该位域未实现。Implementation 值应反映 RISC-V 处理器本身的设计，而不应反映任何外围系统的特性。\n\n[NOTE]\n====\n该位域的格式由架构提供者决定\n源代码，但通常会被标准工具打印为一个\n十六进制字符串不包含前导零或尾随零，因此\nImplementation 的值可以左对齐（即从高位填充）\n最显著的四比特向下对齐，其子位域在四比特边界对齐\n边界，以便于人工阅读。\n===="
          fields:
            - name: "Implementation"
              bits: "31:0"
              desc: "供应商特定实现 ID。"
              reset_info: "Unified DB reset_value() 表达式： return IMP_ID_VALUE;"
        - name: "mhartid"
          desc: "机器模式 hart ID\n\n报告系统中唯一的 hart 特定 ID。"
          fields:
            - name: "ID"
              bits: "31:0"
              desc: "hart 特定 ID。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "mconfigptr"
          desc: "机器模式配置指针\n\n持有指向内存中统一发现数据结构的物理地址指针。\n\n`mconfigptr` 存储了配置数据结构的物理地址。软件可遍历该数据结构以发现关于 hart、平台及其配置的信息。\n\n位中的指针对齐必须不小于 MXLEN：即，若 MXLEN 等于 latexmath:[$8\\times n$]，则 `mconfigptr`[latexmath:[$\\log_2n$]-1:0] 必须为零。\n\n`mconfigptr` 寄存器必须实现，但其值可为零以指示配置数据结构不存在或必须使用其他机制来定位它。\n\n[NOTE]\n====\n配置数据结构的格式和架构尚待确定\n标准化。\n\n***\n\n而 `mconfigptr` 寄存器在某些实现中将直接硬件固化。\n其他实现可能提供一种手段来配置该值\n在 CSR 读取时返回。例如，`mconfigptr` 可能呈现该值\n一个映射到内存的寄存器，由平台或由\nM 模式软件在引导过程的初期加载。\n===="
          fields:
            - name: "ADDRESS"
              bits: "31:0"
              desc: "指向统一发现配置数据结构的物理地址的指针。"
              reset_info: "Unified DB reset_value() 表达式： return CONFIG_PTR_ADDRESS;"
    - name: "Counters and Timers"
