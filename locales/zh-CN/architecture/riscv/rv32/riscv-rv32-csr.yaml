            - name: "STIE"
              bits: "5"
              desc: "监管者定时器中断使能\n\n别名：mie.STIE"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "SEIE"
              bits: "9"
              desc: "监管者外部中断使能\n\n别名：mie.SEIE"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "LCOFIE"
              bits: "13"
              desc: "本地计数器溢出中断使能\n\n别名：mie.LCOFIE"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "stvec"
          desc: "监管者陷阱向量\n\n控制陷阱跳转的目标位置。"
          fields:
            - name: "BASE"
              bits: "31:2"
              desc: "<%- va_size = ext?(:Sv57) ? 57 : (ext?(:Sv48) ? 48 : 39) -%>\n任何进入 S 模式的陷阱所对应的异常向量的虚拟地址的位域 [SXLEN-1:2]。\n\n若基地址使用非规范地址（即位 [SXLEN-1:<%= va_size %>] 与位 <%= va_size-1 %> 不匹配），则该写操作应被忽略。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "MODE"
              bits: "1:0"
              desc: "异步中断的向量模式。\n\n0 - 直接，1 - 向量化\n\n当直接时，所有同步异常和异步中断跳转至（`stvec.BASE` << 2）。\n\n当带向量的异步中断跳转至 (`stvec.BASE` << 2 + `scause.CODE`*4) 而同步异常继续跳转至 (`stvec.BASE` << 2)。"
              reset_info: "Unified DB reset_value() 表达式： return ($array_size(STVEC_MODES) == 1) ? STVEC_MODES[0] : UNDEFINED_LEGAL;"
        - name: "senvcfg"
          desc: "监管者环境配置\n\n包含控制 U 模式执行环境特定特性的位域。"
          fields:
            - name: "CBZE"
              bits: "7"
              desc: "*缓存块零指令使能*\n\n该位在 `menvcfg.CBZE` 为零时为只读 0。\n\n启用缓存块零指令的执行，`cbo.zero`，在U 模式<% if ext?(:H) %>中，并且（与`henvcfg.CBZE`一起）在VU 模式<% end %>中。\n\n * `0`：该指令引发非法指令异常<% if ext?(:H) %> 或虚拟指令异常<% end %>\n * `1`：该指令被执行\n\n总结访问：\n[separator=\"!\",%autowidth]\n!===\n! `menvcfg.CBZE` ! `senvcfg.CBZE` 行为\n\n! 0 ! 仅读 0\n! 1\na! 可写，与 `menvcfg.CBZE` 位独立\n!===\n\n参见 `cbo.zero` 获取效果摘要。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "CBCFE"
              bits: "6"
              desc: "*缓存块清除和刷新指令使能*\n\n启用缓存块清除指令的执行，`cbo.clean`，以及\n缓存块清除指令，`cbo.flush`\n<% if ext?(:S) %>\n在 S 模式中\n<% elsif ext?(:U) %>\n在 U 模式中\n<% end %>。\n\n * `0`：该指令引发非法指令 <% if ext?(:H) %> 或虚拟指令异常 <% end %>\n * `1`：该指令被执行\n\n总结访问：\n[separator=\"!\",%autowidth]\n!===\n! `menvcfg.CBCFE` ! `senvcfg.CBCFE` 行为\n\n! 0 ! 仅读 0\n! 1\na! 可写，与 `menvcfg.CBCFE` 位独立\n!===\n\n参见 `cbo.clean` 和/或 `cbo.flush` 获取效果摘要。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "CBIE"
              bits: "5:4"
              desc: "*缓存块无效化指令使能*\n\n该位域的取值受`menvcfg.CBIE`值的限制。当写入无效值时，该值将被忽略，位域保持不变。\n\n[separator=\"!\",%autowidth,cols=\",.>\"]\n!===\n! [.rotate]#`menvcfg.CBIE`# ! 有效值 of `senvcfg.CBIE`\n\n! 00 ! 00\n! 01 ! 00, 01\n! 11 ! 00, 01, 11\n!===\n\n控制缓存块无效指令的执行，`cbo.inval`\n在 U 模式中\n<% if ext?(:H) %>\n和 VU 模式（连同 `henvcfg.CBIE`）\n<% end %>\n.\n\n * `00`：该指令引发非法指令或虚拟指令异常\n * `01`：该指令被执行并执行刷新操作\n * `10`: _保留_\n * `11`：指令执行并执行无效操作\n\n详见 `cbo.inval`。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "UKTE"
              bits: "8"
              desc: "若实现 Svukte 扩展，UKTE 位域将影响指令获取和显式内存访问的行为。当 UKTE=0 时，指令获取和显式内存访问的行为如同未实现 Svukte 扩展一样。当 UKTE=1 时，有效特权模式为 U 或 VU 的指令获取和显式内存访问将被 Svukte-限定，具体行为如 <<sec:svukte>> 所述。若未实现 Svukte，UKTE 位域读为保留零。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "SSE"
              bits: "3"
              desc: "*影栈使能*\n\n当 SSE 位域设置为 1 时，Zicfiss 扩展在 VU/U 模式中被激活。当 SSE 位域为 0 时，Zicfiss 扩展在 VU/U 模式中保持非活动状态，且以下规则适用：\n\n-32-bit Zicfiss 指令将恢复为 Zimop 定义的行为。\n\n-16-bit Zicfiss 指令将恢复为 Zcmop 所定义的行为。\n\n当 menvcfg.SSE 为 1 时，SSAMOSWAP.W/D 在 U 模式中引发非法指令异常，在 VU 模式中引发虚拟指令异常。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "LPE"
              bits: "2"
              desc: "*着陆垫使能*\n\n当 LPE 位域设置为 1 且 `menvcfg.LPE` 为 1 时，Zicfilp 扩展在 U/VU 模式中启用。当 `menvcfg.LPE` 为 0 时，该位域读为零。当 LPE 位域为 0 时，Zicfilp 扩展在 U/VU 模式中未启用，并适用以下规则：\n\n * hart 不更新 `ELP` 状态；其保持为 `NO_LP_EXPECTED`。\n * `LPAD` 指令操作为无操作。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "FIOM"
              bits: "0"
              desc: "*内存屏障 I/O 意味着内存*\n\n当 `senvcfg.FIOM` 或 `menvcfg.FIOM` 被置位时，FENCE 指令的 I/O 区域在以 U 模式执行时，也隐式地对内存区域进行排序，具体如下：\n\n[separator=\"!\",%autowidth,float=\"center\",align=\"center\",cols=\"^,<\",options=\"header\"]\n!===\n!指令位 ! 设置时的含义\n!PI +\nPO\n!前代设备输入及内存读取（PR 隐式）+\n前驱设备输出及内存写入（PW 隐含）\n!SI +\nSO\n!后继设备输入及内存读取（SR 隐含）+\n后继设备输出及内存写入（SW 隐含）\n!===\n\n同样，在 U 模式中当 FIOM=1 时，若一个访问被标记为设备 I/O 区域的原子指令其 _aq_ 和/或 _rl_ 位被置位，则该指令的顺序将等同于它同时访问了设备 I/O 和内存。\n\n详见 `fence`。"
          condition: "全部满足： S \">=1.12\"，U"
        - name: "sstateen0"
          desc: "监管者状态使能 0 寄存器\n\n每个 `stateen` CSR 位控制较低特权级对扩展状态的访问，针对那些未被判定为“值得”拥有 XS 位域的扩展，例如在 `sstatus` 中的 FS 和 VS 位域，用于 F 和 V 扩展。\n\n每个级别提供的寄存器数量为四个，因为认为 4 * 64 = 256 位用于机器和虚拟机级别，而 4 * 32 = 128 位用于监管者级别，将足以满足未来多年的需求，或许至少能延续到 RISC-V ISA 仍被使用为止。确切的数值为四，是试图在一方面提供过少位数与另一方面过度设计将永不使用的 CSR 之间取得的平衡。\n\n`stateen` 寄存器在每一级控制对所有较低特权级状态的访问，但不控制对其自身级状态的访问。\n\n当 `stateen` CSR 阻止特权模式访问状态时，尝试在该特权模式下执行隐式更新状态但不读取状态的指令，可能引发非法指令或虚拟指令异常，也可能不引发。此类情况必须通过明确指定一种方式来区分。在某些情况下，`stateen` 的 CSR 位域将具有双重作用，作为启用 ISA 扩展功能的使能位，这些扩展功能引入了受控状态。\n\n对于 `sstateen` CSR 中每个有明确定义用途的位，对应的 `mstateen` CSR 中也定义了相同的位，用于控制机器级以下对相同状态的访问。`mstateen` CSR 的高 32 位（对于 RV32，则为对应的高半 CSR）控制对用户级本质上不可访问状态的访问，因此监管者级 `sstateen` CSR 中不适用对应的使能位。计划从最高有效端的第 63 位开始分配这些位，依次到第 32 位，然后继续分配到下一个编号更高的 `mstateen` CSR。 若从`sstateen` CSR的最低有效位端分配位的速率足够低，则允许从`mstateen` CSR的最高有效位端的位分配延伸至32位的低位区域，从而在跳转至更高层级的`mstateen` CSR之前发生侵入。在此情况下，被“侵入”的位在对应的`sstateen` CSR中的位位置将永久保持为只读零。\n\n对于 `mstateen` CSR 中每个为零的位（无论是只读零还是被置为零），该位在对应的 `hstateen` 和 `sstateen` 的 CSR 中同样表现为只读零。对于 `hstateen` CSR 中每个为零的位（无论是只读零还是被置为零），当在 VS 模式中访问时，该位在 `sstateen` 中同样表现为只读零。\n\n一个位于监管者模式的 `sstateen` CSR 中的位若为只读零，则必须在对应的匹配的 `mstateen` CSR 中该位也为只读零，且如果存在，则在对应的匹配的 `hstateen` CSR 中也必须为只读零。每个 `mstateen` CSR 的位域 63 可为只读零，仅当虚拟机扩展未实现且对应的监管者模式 `sstateen` CSR 所有位均为只读零。"
          fields:
            - name: "JVT"
              bits: "2"
              desc: "jvt 访问控制\n\nJVT 位控制对 `jvt` 提供的 CSR 的访问，该功能由 Zcmt 扩展提供。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "FCSR"
              bits: "1"
              desc: "fcsr 访问控制\n\nFCSR 位控制浮点指令操作 `x` 寄存器而非 `f` 寄存器时对 `fcsr` 的访问，该行为由 Zfinx 及相关扩展（如 Zdinx 等）指定。每当 `misa.F` = 1 时，FCSR 位在 `mstateen0` 中为只读零（因此在 `hstateen0` 和 `sstateen0` 中同样为只读零）。为方便起见，当实现 `stateen` CSRs 且 `misa.F` = 0 时，若控制 `stateen0` CSR 的 FCSR 位为零，则所有浮点指令将引发非法指令陷阱（或虚拟指令陷阱，视情况而定），如同它们均访问 `fcsr`，无论实际是否如此。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "C"
              bits: "0"
              desc: "自定义状态访问控制\n\nC 位控制对任何和全部自定义状态的访问。这些寄存器中的 C 位本身并非自定义状态；它是一个标准位域，属于标准 CSR 寄存器中的位域，即 `mstateen0`、`hstateen0` 或 `sstateen0` 之一。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
          condition: "全部满足： Smstateen，Ssstateen"
        - name: "sstateen1"
          desc: "监管者状态使能 1 寄存器\n\n每个 `stateen` CSR 位控制较低特权级对扩展状态的访问，针对那些未被判定为“值得”拥有 XS 位域的扩展，例如在 `sstatus` 中的 FS 和 VS 位域，用于 F 和 V 扩展。\n\n每个级别提供的寄存器数量为四个，因为认为 4 * 64 = 256 位用于机器和虚拟机级别，而 4 * 32 = 128 位用于监管者级别，将足以满足未来多年的需求，或许至少能延续到 RISC-V ISA 仍被使用为止。确切的数值为四，是试图在一方面提供过少位数与另一方面过度设计将永不使用的 CSR 之间取得的平衡。\n\n`stateen` 寄存器在每一级控制对所有较低特权级状态的访问，但不控制对其自身级状态的访问。\n\n当 `stateen` CSR 阻止特权模式访问状态时，尝试在该特权模式下执行隐式更新状态但不读取状态的指令，可能引发非法指令或虚拟指令异常，也可能不引发。此类情况必须通过明确指定一种方式来区分。在某些情况下，`stateen` 的 CSR 位域将具有双重作用，作为启用 ISA 扩展功能的使能位，这些扩展功能引入了受控状态。\n\n对于 `sstateen` CSR 中每个有明确定义用途的位，对应的 `mstateen` CSR 中也定义了相同的位，用于控制机器级以下对相同状态的访问。`mstateen` CSR 的高 32 位（对于 RV32，则为对应的高半 CSR）控制对用户级本质上不可访问状态的访问，因此监管者级 `sstateen` CSR 中不适用对应的使能位。计划从最高有效端的第 63 位开始分配这些位，依次到第 32 位，然后继续分配到下一个编号更高的 `mstateen` CSR。 若从`sstateen` CSR的最低有效位端分配位的速率足够低，则允许从`mstateen` CSR的最高有效位端的位分配延伸至32位的低位区域，从而在跳转至更高层级的`mstateen` CSR之前发生侵入。在此情况下，被“侵入”的位在对应的`sstateen` CSR中的位位置将永久保持为只读零。\n\n对于 `mstateen` CSR 中每个为零的位（无论是只读零还是被置为零），该位在对应的 `hstateen` 和 `sstateen` 的 CSR 中同样表现为只读零。对于 `hstateen` CSR 中每个为零的位（无论是只读零还是被置为零），当在 VS 模式中访问时，该位在 `sstateen` 中同样表现为只读零。\n\n一个位于监管者模式的 `sstateen` CSR 中的位若为只读零，则必须在对应的匹配的 `mstateen` CSR 中该位也为只读零，且如果存在，则在对应的匹配的 `hstateen` CSR 中也必须为只读零。每个 `mstateen` CSR 的位域 63 可为只读零，仅当虚拟机扩展未实现且对应的监管者模式 `sstateen` CSR 所有位均为只读零。"
          fields:
            - name: "DATA"
              bits: "31:0"
              desc: "数据值"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
          condition: "全部满足： Smstateen，Ssstateen"
        - name: "sstateen2"
          desc: "监管者状态使能 2 寄存器\n\n每个 `stateen` CSR 位控制较低特权级对扩展状态的访问，针对那些未被判定为“值得”拥有 XS 位域的扩展，例如在 `sstatus` 中的 FS 和 VS 位域，用于 F 和 V 扩展。\n\n每个级别提供的寄存器数量为四个，因为认为 4 * 64 = 256 位用于机器和虚拟机级别，而 4 * 32 = 128 位用于监管者级别，将足以满足未来多年的需求，或许至少能延续到 RISC-V ISA 仍被使用为止。确切的数值为四，是试图在一方面提供过少位数与另一方面过度设计将永不使用的 CSR 之间取得的平衡。\n\n`stateen` 寄存器在每一级控制对所有较低特权级状态的访问，但不控制对其自身级状态的访问。\n\n当 `stateen` CSR 阻止特权模式访问状态时，尝试在该特权模式下执行隐式更新状态但不读取状态的指令，可能引发非法指令或虚拟指令异常，也可能不引发。此类情况必须通过明确指定一种方式来区分。在某些情况下，`stateen` 的 CSR 位域将具有双重作用，作为启用 ISA 扩展功能的使能位，这些扩展功能引入了受控状态。\n\n对于 `sstateen` CSR 中每个有明确定义用途的位，对应的 `mstateen` CSR 中也定义了相同的位，用于控制机器级以下对相同状态的访问。`mstateen` CSR 的高 32 位（对于 RV32，则为对应的高半 CSR）控制对用户级本质上不可访问状态的访问，因此监管者级 `sstateen` CSR 中不适用对应的使能位。计划从最高有效端的第 63 位开始分配这些位，依次到第 32 位，然后继续分配到下一个编号更高的 `mstateen` CSR。 若从`sstateen` CSR的最低有效位端分配位的速率足够低，则允许从`mstateen` CSR的最高有效位端的位分配延伸至32位的低位区域，从而在跳转至更高层级的`mstateen` CSR之前发生侵入。在此情况下，被“侵入”的位在对应的`sstateen` CSR中的位位置将永久保持为只读零。\n\n对于 `mstateen` CSR 中每个为零的位（无论是只读零还是被置为零），该位在对应的 `hstateen` 和 `sstateen` 的 CSR 中同样表现为只读零。对于 `hstateen` CSR 中每个为零的位（无论是只读零还是被置为零），当在 VS 模式中访问时，该位在 `sstateen` 中同样表现为只读零。\n\n一个位于监管者模式的 `sstateen` CSR 中的位若为只读零，则必须在对应的匹配的 `mstateen` CSR 中该位也为只读零，且如果存在，则在对应的匹配的 `hstateen` CSR 中也必须为只读零。每个 `mstateen` CSR 的位域 63 可为只读零，仅当虚拟机扩展未实现且对应的监管者模式 `sstateen` CSR 所有位均为只读零。"
