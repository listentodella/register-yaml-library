        - name: "mcountinhibit"
          desc: "机器模式计数器抑制\n\n抑制位（停止计数）性能计数器。\n\n计数器抑制寄存器 `mcountinhibit` 是一个 *WARL* 寄存器，用于控制哪些硬件性能监控计数器递增。该寄存器中的设置仅控制计数器是否递增；其可访问性不受该寄存器设置的影响。\n\n当 CY、IR 或 HPM__n__ 位在 `mcountinhibit` 寄存器中为零时，`mcycle`、`minstret` 或 `mhpmcountern` 寄存器正常递增。当 CY、IR 或 HPM_n_ 位被置位时，相应的计数器不递增。\n\n`mcycle` CSR 可能被同一核心中的多个 hart 共享，在此情况下 `mcountinhibit.CY` 位域也将在这些 hart 之间共享，因此对 `mcountinhibit.CY` 的写操作将对这些 hart 可见。\n\n若未实现 `mcountinhibit` 寄存器，则实现行为等同于该寄存器被设置为零。\n\n[NOTE]\n====\n当不需要 `mcycle` 和 `minstret` 计数器时，希望\n以条件抑制它们以降低能耗。提供一个\n单个 CSR 用于禁止所有计数器，也允许计数器被\n原子采样。\n\n因为 `mtime` 计数器可被多个核心共享，它\n无法通过 `mcountinhibit` 机制抑制。\n===="
          fields:
            - name: "CY"
              bits: "0"
              desc: "当置位时，`mcycle.COUNT`在所有特权模式下停止计数。"
              reset_info: "Unified DB reset_value() 表达式： return COUNTINHIBIT_EN[0] ? UNDEFINED_LEGAL : 0;"
            - name: "IR"
              bits: "2"
              desc: "当置位时，`minstret.COUNT`在所有特权模式下停止计数。"
              reset_info: "Unified DB reset_value() 表达式： return COUNTINHIBIT_EN[2] ? UNDEFINED_LEGAL : 0;"
            - name: "HPM3"
              bits: "3"
              desc: "[when=\"COUNTINHIBIT_EN[3] == true\"]\n当置位时，`hpmcounter3.COUNT`在所有特权模式下停止计数。\n\n[when=\"COUNTINHIBIT_EN[3] == false\"]\n由于 hpmcounter3 未实现，该位域读为零。"
              condition: "全部满足： Sm，HPM_COUNTER_EN[3] == true"
              reset_info: "Unified DB reset_value() 表达式： return COUNTINHIBIT_EN[3] ? UNDEFINED_LEGAL : 0;"
            - name: "HPM4"
              bits: "4"
              desc: "[when=\"COUNTINHIBIT_EN[4] == true\"]\n当置位时，`hpmcounter4.COUNT`在所有特权模式下停止计数。\n\n[when=\"COUNTINHIBIT_EN[4] == false\"]\n由于 hpmcounter4 未实现，该位域读为零。"
              condition: "全部满足： Sm，HPM_COUNTER_EN[4] == true"
              reset_info: "Unified DB reset_value() 表达式： return COUNTINHIBIT_EN[4] ? UNDEFINED_LEGAL : 0;"
            - name: "HPM5"
              bits: "5"
              desc: "[when=\"COUNTINHIBIT_EN[5] == true\"]\n当置位时，`hpmcounter5.COUNT`在所有特权模式下停止计数。\n\n[when=\"COUNTINHIBIT_EN[5] == false\"]\n由于 hpmcounter5 未实现，该位域读为零。"
              condition: "全部满足： Sm，HPM_COUNTER_EN[5] == true"
              reset_info: "Unified DB reset_value() 表达式： return COUNTINHIBIT_EN[5] ? UNDEFINED_LEGAL : 0;"
            - name: "HPM6"
              bits: "6"
              desc: "[when=\"COUNTINHIBIT_EN[6] == true\"]\n当置位时，`hpmcounter6.COUNT`在所有特权模式下停止计数。\n\n[when=\"COUNTINHIBIT_EN[6] == false\"]\n由于 hpmcounter6 未实现，该位域读为零。"
              condition: "全部满足： Sm，HPM_COUNTER_EN[6] == true"
              reset_info: "Unified DB reset_value() 表达式： return COUNTINHIBIT_EN[6] ? UNDEFINED_LEGAL : 0;"
