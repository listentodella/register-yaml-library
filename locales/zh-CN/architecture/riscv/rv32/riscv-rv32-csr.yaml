    - name: "Physical Memory Protection"
      title: "物理内存保护"
      access: "CSR 指令编码空间"
      desc: "RISC-V 32 位架构 CSR 定义：物理内存保护。CSR 地址使用标准 CSR 编码空间，而非 MMIO 地址。"
      registers:
        - name: "pmpcfg0"
          desc: "PMP 配置寄存器 0\n\nPMP 入口配置"
          fields:
            - name: "pmp0cfg"
              bits: "7:0"
              desc: "*PMP 配置用于进入 0*\n\n位域如下：\n\n[separator=\"!\",%autowidth]\n!===\n! 名称 ! 位置 ! 描述\n\nh! L ! 7 ! 锁定条目免于进一步修改。此外，当置位时，PMP 的检查也适用于 M 模式对该条目的访问。h! MT ! 6:5 ! 当实现 `Smpmpmt` 扩展时，MT（内存类型）是一个 WARL 位域，用于覆盖匹配此 PMP 条目访问的内存类型。参见 `Smpmpmt` 扩展定义中的编码规则。当未实现 `Smpmpmt` 扩展时，MT 为 _保留_ 写入将被忽略。h! 一个 ! 4:3 a! 地址匹配模式。编码如下：\n\n * *OFF* (0) - 空区域（禁用）\n * *TOR* (1) - 范围上限\n * *NA4* (2) - 自然对齐的四字节区域\n * *NAPOT* (3) - 自然对齐的2的幂\n\nh! X ! 2 ! 当清除时，指令获取会引发匹配区域和特权模式的 `Access Fault`。\nh! W ! 1 ! 当清除时，存储操作和原子操作（AMOs）会针对匹配的区域和特权模式引发 `Access Fault`。\nh! R ! 0 ! 当清除时，加载操作将引发匹配区域和特权模式的陷阱 `Access Fault`。\n!===\n\nR = 0、W = 1 的组合是保留的。"
            - name: "pmp1cfg"
              bits: "15:8"
              desc: "*PMP 配置用于进入 1*\n\n位域如下：\n\n[separator=\"!\",%autowidth]\n!===\n! 名称 ! 位置 ! 描述\n\nh! L ! 15 ! 锁定条目免于进一步修改。此外，当置位时，PMP 的检查也适用于 M 模式对该条目的访问。h! MT ! 14:13 ! 当实现 `Smpmpmt` 扩展时，MT（内存类型）是一个 WARL 位域，用于覆盖匹配此 PMP 条目访问的内存类型。参见 `Smpmpmt` 扩展定义中的编码规则。当未实现 `Smpmpmt` 扩展时，MT 为 _保留_ 写入将被忽略。h! 一个 ! 12:11 a! 地址匹配模式。编码如下：\n\n * *OFF* (0) - 空区域（禁用）\n * *TOR* (1) - 范围上限\n * *NA4* (2) - 自然对齐的四字节区域\n * *NAPOT* (3) - 自然对齐的2的幂\n\nh! X ! 10 ! 当清除时，指令获取会引发匹配区域和特权模式的 `Access Fault`。\nh! W ! 9 ! 当清除时，存储操作和原子操作（AMOs）会针对匹配的区域和特权模式引发 `Access Fault`。\nh! R ! 8 ! 当清除时，加载操作将引发匹配区域和特权模式的陷阱 `Access Fault`。\n!===\n\nR = 0、W = 1 的组合是保留的。"
            - name: "pmp2cfg"
              bits: "23:16"
              desc: "*PMP 配置用于进入 2*\n\n位域如下：\n\n[separator=\"!\",%autowidth]\n!===\n! 名称 ! 位置 ! 描述\n\nh! L ! 23 ! 锁定条目免于进一步修改。此外，当置位时，PMP 的检查也适用于 M 模式对该条目的访问。h! MT ! 22:21 ! 当实现 `Smpmpmt` 扩展时，MT（内存类型）是一个 WARL 位域，用于覆盖匹配此 PMP 条目访问的内存类型。参见 `Smpmpmt` 扩展定义中的编码规则。当未实现 `Smpmpmt` 扩展时，MT 为 _保留_ 写入将被忽略。h! 一个 ! 20:19 a! 地址匹配模式。编码如下：\n\n * *OFF* (0) - 空区域（禁用）\n * *TOR* (1) - 范围上限\n * *NA4* (2) - 自然对齐的四字节区域\n * *NAPOT* (3) - 自然对齐的2的幂\n\nh! X ! 18 ! 当清除时，指令获取会引发匹配区域和特权模式的 `Access Fault`。\nh! W ! 17 ! 当清除时，存储操作和原子操作（AMOs）会针对匹配的区域和特权模式引发 `Access Fault`。\nh! R ! 16 ! 当清除时，加载操作将引发匹配区域和特权模式的陷阱 `Access Fault`。\n!===\n\nR = 0、W = 1 的组合是保留的。"
            - name: "pmp3cfg"
              bits: "31:24"
              desc: "*PMP 配置用于进入 3*\n\n位域如下：\n\n[separator=\"!\",%autowidth]\n!===\n! 名称 ! 位置 ! 描述\n\nh! L ! 31 ! 锁定条目免于进一步修改。此外，当置位时，PMP 的检查也适用于 M 模式对该条目的访问。h! MT ! 30:29 ! 当实现 `Smpmpmt` 扩展时，MT（内存类型）是一个 WARL 位域，用于覆盖匹配此 PMP 条目访问的内存类型。参见 `Smpmpmt` 扩展定义中的编码规则。当未实现 `Smpmpmt` 扩展时，MT 为 _保留_ 写入将被忽略。h! 一个 ! 28:27 a! 地址匹配模式。编码如下：\n\n * *OFF* (0) - 空区域（禁用）\n * *TOR* (1) - 范围上限\n * *NA4* (2) - 自然对齐的四字节区域\n * *NAPOT* (3) - 自然对齐的2的幂\n\nh! X ! 26 ! 当清除时，指令获取会引发匹配区域和特权模式的 `Access Fault`。\nh! W ! 25 ! 当清除时，存储操作和原子操作（AMOs）会针对匹配的区域和特权模式引发 `Access Fault`。\nh! R ! 24 ! 当清除时，加载操作将引发匹配区域和特权模式的陷阱 `Access Fault`。\n!===\n\nR = 0、W = 1 的组合是保留的。"
