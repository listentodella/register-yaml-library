        - name: "vsireg4"
          desc: "虚拟监管者间接寄存器别名 4\n\n`vsireg4` 和 CSR 是一组用于间接访问 VS 模式或 VU 模式中虚拟监管者级 CSR 的别名寄存器。\n\n地址为 `vsireg4` 的寄存器由当前 `vsiselect` CSR 的值选定。\n\n别名机制允许间接 CSR 访问，有助于虚拟化及未来可扩展性。\n\n对于来自 VS 模式或 VU 模式的直接访问 `vsiselect` 或 `vsireg4`，或来自 VU 模式的访问 `siselect` 或 `siregX` 的尝试，将引发虚拟指令异常。\n\n当 `vsireg4` 的访问行为在 `vsiselect` 持有在 HS 级未实现的值时，其行为为 UNSPECIFIED。\n\n实现建议对通过 `vsireg4` 访问未实现目标的访问引发非法指令异常。\n\n`vsireg4` 的宽度始终为当前的 `XLEN`，而非 `VSXLEN`。例如，若 `HSXLEN = 64` 和 `VSXLEN = 32`，则当从 HS 模式（RV64）访问时，`vsireg4` 的宽度为 64 位，当从 VS 模式（RV32）访问时，其宽度为 32 位。\n\n虚拟地址：597"
