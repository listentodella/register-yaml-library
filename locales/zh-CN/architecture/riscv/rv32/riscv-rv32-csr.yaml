        - name: "sireg6"
          desc: "监管者间接寄存器别名 6\n\n访问 `sireg6` 从 M 模式或 S 模式而当 `siselect` 持有一个在标准定义且已实现范围内的数值时，将产生特定行为，对于每个 `siselect` 和 `sireg6` 的组合，其行为由 `siselect` 值所分配的扩展决定。\n\n通常情况下，`sireg6` 将访问寄存器状态，读取只读 0 状态，或在未在虚拟机中执行时引发非法指令异常。\n\n注意，`siselect` 和 `sireg6` 的位宽始终为当前的 XLEN，而非 SXLEN。因此，例如，若 MXLEN = 64 且 SXLEN = 32，则当当前特权模式为 64（运行 M 指令）时，该寄存器为 RV64 位，而当特权模式为 32（运行 S 指令）时，该寄存器为 RV32 位。\n\n在访问 `sireg6` 从 M 模式或 S 模式时，若 `siselect` 持有在监管者模式下未实现的值，则行为为 UNSPECIFIED。\n\n建议实现对这类访问产生非法指令异常，以促进这些访问的可能仿真（由 M 模式实现）。\n\n例如，如果机器级别已通过 CSR `menvcfg` 中某些位域的设置禁用了 S 模式的该扩展，则该扩展被视为在监管者级别未实现。"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "间接选择寄存器值\n\n由当前 `siselect` 值选定的寄存器读取或写入的数据。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "miselect"
          desc: "机器模式间接寄存器选择\n\n上表列出的 CSRs 提供了间接访问寄存器状态的窗口。`miselect` 的值决定在读取或写入每个机器间接别名 CSR（`mireg*`）时访问的寄存器。`miselect` 的值范围分配给各扩展模块，以指定每个 `miregi` 寄存器在每个 `miselect` 值下可访问的寄存器状态。`miselect` 是一个 WARL 寄存器。\n\n`miselect` 寄存器提供至少足够位数以支持所有已实现的 `miselect` 值（对应于利用 `miselect`/`mireg*` 间接访问寄存器状态的已实现扩展）。`miselect` 寄存器在没有实现利用它的扩展时可能为只读零。\n\n`miselect` 的值在最高位置位（位 XLEN - 1 = 1）时仅用于定制用途， 可能用于通过别名 CSRs 访问定制寄存器。`miselect` 的值在最高位置0时仅用于标准用途，并保留直至被分配给标准架构扩展。\n\n若 XLEN 发生改变，`miselect` 的最高有效位将移至新位置，保持其先前的值。\n\n实现无需支持任何自定义值用于 `miselect`。"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "间接寄存器选择器\n\n通过 `mireg*` 选择访问哪个间接寄存器。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "mireg"
          desc: "机器模式间接寄存器别名\n\nmireg 机器间接别名 CSR 用于在读或写操作时，根据 miselect 的值间接访问另一个 CSR 的状态。\n\n访问 mireg 从 M 模式的行为，当 miselect 持有未实现的值时，为 UNSPECIFIED。\n\n预期实现将对这类访问通常引发非法指令异常，以便例如将其识别为软件错误。平台规范、配置规范以及/或特权 ISA 规范可能对这类访问的行为施加更严格的限制。\n\n尝试访问 mireg 而 miselect 持有一个位于已分配且已实现范围内的数值时，将产生特定行为，对于每个 miselect 和 mireg 的组合，其行为由 miselect 值所分配的扩展决定。\n\n通常情况下，mireg 将访问寄存器状态，访问只读 0 状态，或引发非法指令异常。\n\n对于 RV32，若某扩展将一个间接访问的寄存器定义为 64 位宽，则建议该寄存器的低位域（低 32 位）通过 mireg 进行访问，而高位域（高 32 位）通过 mireg4 进行访问。"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "间接选择寄存器值\n\n当前 `miselect` 值所选择的 CSR 的寄存器状态"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "mireg2"
          desc: "机器模式间接寄存器别名 2\n\n`mireg2` 机器间接别名 CSR 用于在读或写操作时间接访问寄存器状态，具体行为由 `miselect` 的值决定。\n\n访问 `mireg2` 从 M 模式的行为，当 `miselect` 持有未实现的值时，为 UNSPECIFIED。\n\n预期实现将对这类访问通常引发非法指令异常，以便例如将其识别为软件错误。平台规范、配置规范以及/或特权 ISA 规范可能对这类访问的行为施加更严格的限制。\n\n尝试访问 `mireg2` 而 `miselect` 持有一个位于已分配且已实现范围内的数值时，将产生特定行为，对于每个 `miselect` 和 `mireg2` 的组合，其行为由 `miselect` 值所分配的扩展决定。\n\n通常情况下，`mireg2` 将访问寄存器状态，访问只读 0 状态，或引发非法指令异常。\n\n对于 RV32，若某扩展将一个间接访问的寄存器定义为 64 位宽，则建议该寄存器的低位域（低 32 位）通过 `mireg2` 进行访问，而高位域（高 32 位）通过 `mireg5` 进行访问。"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "间接寄存器值\n\n当前 `miselect` 值所选择的 CSR 的寄存器状态"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "mireg3"
          desc: "机器模式间接寄存器别名 3\n\n`mireg3` 机器间接别名 CSR 用于在读或写操作时间接访问寄存器状态，具体行为由 `miselect` 的值决定。\n\n访问 `mireg3` 从 M 模式的行为，当 `miselect` 持有未实现的值时，为 UNSPECIFIED。\n\n预期实现将对这类访问通常引发非法指令异常，以便例如将其识别为软件错误。平台规范、配置规范以及/或特权 ISA 规范可能对这类访问的行为施加更严格的限制。\n\n尝试访问 `mireg3` 而 `miselect` 持有一个位于已分配且已实现范围内的数值时，将产生特定行为，对于每个 `miselect` 和 `mireg3` 的组合，其行为由 `miselect` 值所分配的扩展决定。\n\n通常情况下，`mireg3` 将访问寄存器状态，访问只读 0 状态，或引发非法指令异常。\n\n对于 RV32，若某扩展将一个间接访问的寄存器定义为 64 位宽，则建议该寄存器的低位域（低 32 位）通过 `mireg3` 进行访问，而高位域（高 32 位）通过 `mireg6` 进行访问。"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "间接选择寄存器值\n\n当前 `miselect` 值所选择的 CSR 的寄存器状态"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "mireg4"
          desc: "机器模式间接寄存器别名 4\n\n`mireg4` 机器间接别名 CSR 用于在读或写操作时间接访问寄存器状态，具体行为由 `miselect` 的值决定。\n\n访问 `mireg4` 从 M 模式的行为，当 `miselect` 持有未实现的值时，为 UNSPECIFIED。\n\n预期实现将对这类访问通常引发非法指令异常，以便例如将其识别为软件错误。平台规范、配置规范以及/或特权 ISA 规范可能对这类访问的行为施加更严格的限制。\n\n尝试访问 `mireg4` 而 `miselect` 持有一个位于已分配且已实现范围内的数值时，将产生特定行为，对于每个 `miselect` 和 `mireg4` 的组合，其行为由 `miselect` 值所分配的扩展决定。\n\n通常情况下，`mireg4` 将访问寄存器状态，访问只读 0 状态，或引发非法指令异常。\n\n对于 RV32，如果某扩展将一个间接访问的寄存器定义为 64 位宽，则建议该寄存器的高位 32 位通过 `mireg4` 进行访问，而低位 32 位通过 `mireg`、`mireg2` 或 `mireg3` 进行访问。"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "间接选择寄存器值\n\n当前 `miselect` 值所选择的 CSR 的寄存器状态"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "mireg5"
          desc: "机器模式间接寄存器别名 5\n\n`mireg5` 机器间接别名 CSR 用于在读或写操作时间接访问寄存器状态，具体行为由 `miselect` 的值决定。\n\n访问 `mireg5` 从 M 模式的行为，当 `miselect` 持有未实现的值时，为 UNSPECIFIED。\n\n预期实现将对这类访问通常引发非法指令异常，以便例如将其识别为软件错误。平台规范、配置规范以及/或特权 ISA 规范可能对这类访问的行为施加更严格的限制。\n\n尝试访问 `mireg5` 而 `miselect` 持有一个位于已分配且已实现范围内的数值时，将产生特定行为，对于每个 `miselect` 和 `mireg5` 的组合，其行为由 `miselect` 值所分配的扩展决定。\n\n通常情况下，`mireg5` 将访问寄存器状态，访问只读 0 状态，或引发非法指令异常。\n\n对于 RV32，如果某扩展将一个间接访问的寄存器定义为 64 位宽，则建议通过 `mireg5` 访问该寄存器的高位部分（最高 32 位），而通过 `mireg2` 访问该寄存器的低位部分（最低 32 位）。"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "间接选择寄存器值\n\n当前 `miselect` 值所选择的 CSR 的寄存器状态"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "mireg6"
          desc: "机器模式间接寄存器别名 6\n\n`mireg6` 机器间接别名 CSR 用于在读或写操作时间接访问寄存器状态，具体行为由 `miselect` 的值决定。\n\n访问 `mireg6` 从 M 模式的行为，当 `miselect` 持有未实现的值时，为 UNSPECIFIED。\n\n预期实现将对这类访问通常引发非法指令异常，以便例如将其识别为软件错误。平台规范、配置规范以及/或特权 ISA 规范可能对这类访问的行为施加更严格的限制。\n\n尝试访问 `mireg6` 而 `miselect` 持有一个位于已分配且已实现范围内的数值时，将产生特定行为，对于每个 `miselect` 和 `mireg6` 的组合，其行为由 `miselect` 值所分配的扩展决定。\n\n通常情况下，`mireg6` 将访问寄存器状态，访问只读 0 状态，或引发非法指令异常。\n\n对于 RV32，如果某扩展将一个间接访问的寄存器定义为 64 位宽，则建议通过 `mireg6` 访问该寄存器的高位部分（最高 32 位），而通过 `mireg3` 访问该寄存器的低位部分（最低 32 位）。"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "间接选择寄存器值\n\n当前 `miselect` 值所选择的 CSR 的寄存器状态"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
    - name: "Debug and Triggers"
      title: "调试与触发器"
      access: "CSR 指令编码空间"
      desc: "RISC-V 32 位架构 CSR 定义：调试与触发器。CSR 地址使用标准 CSR 编码空间，而非 MMIO 地址。"
      registers:
        - name: "scontext"
          desc: "监管者上下文\n\n该可选寄存器仅在 S/HS 模式、VS 模式、M 模式和调试模式下可访问。该 CSR 的可访问性由 `mstateen0[57]` 和 `hstateen0[57]` 在 Smstateen 扩展中控制。在具有不交换 `scontext` 的虚拟化系统中启用 `scontext` 可能带来安全风险。"
          fields:
            - name: "DATA"
              bits: "31:0"
              desc: "监管者模式软件可以将上下文编号写入该寄存器，可用于设置仅在特定上下文触发的触发器。\n\n实现可能将此字段中的任意数量高位位域连接至0。建议在RV32上实现16位，在RV64上实现32位。"
          condition: "全部满足： Sdtrig，S"
        - name: "hcontext"
          desc: "虚拟机监控器上下文\n\n该可选寄存器仅在实现 H 扩展时才可实现。若实现该寄存器，则必须同时实现 `mcontext`。\n\n该寄存器仅在 HS 模式、M 模式模式和调试模式下可访问。若实现了 Smstateen，则在 HS 模式下的可访问性由 `mstateen0[57]` 控制。\n\n该寄存器是 `mcontext` 寄存器的别名，提供对来自 HS-模式的 HCONTEXT 位域的访问。"
          fields:
            - name: "HCONTEXT"
              bits: "13:0"
              desc: "`mcontext.HCONTEXT` 的别名。\n\n别名：mcontext.HCONTEXT"
          condition: "全部满足： Sdtrig，H"
        - name: "tselect"
          desc: "触发选择\n\n该寄存器确定通过其他触发模块寄存器可访问的触发类型。\n\n若未实现任何触发器，则该功能可选。可访问的触发器集合必须从 0 开始，并且必须连续。该寄存器为 WARL。写入大于或等于支持的触发器数量的值时，可能导致该寄存器中的值与写入值不同，或指向类型=0 的触发器。\n\n为验证所写入的值是否为有效索引，调试器可以读回该值，并检查 tselect 是否保持了其写入的内容，同时读取 tdata1 以确认类型字段非零。由于触发器既可由调试模式使用，也可由 M 模式使用，因此外部调试器在修改该寄存器时必须将其恢复。"
          fields:
            - name: "INDEX"
              bits: "31:0"
              desc: "索引值"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "tdata1"
          desc: "触发数据 1\n\n该寄存器提供对 `tselect` 选定的触发器的访问。此处列出的复位值适用于每个底层触发器。\n\n该寄存器在未实现任何触发器时可选。将 0 写入该寄存器必须导致一个被禁用的触发器。如果该触发器支持多种类型，则硬件应通过将类型更改为 15 来禁用它。"
          fields:
            - name: "TYPE"
              bits: "31:28"
              desc: "0 (none):: 该 `tselect` 无触发。1 (legacy):: 该触发为遗留的 SiFive 地址匹配触发。这些触发不应实现，此处未进一步文档化。2 (mcontrol):: 该触发为地址/数据匹配触发。该寄存器中其余位域的含义如 `mcontrol` 所述。3 (icount):: 该触发为指令计数触发。该寄存器中其余位域的含义如 `icount` 所述。4 (itrigger):: 该触发为中断触发。该寄存器中其余位域的含义如 `itrigger` 所述。5 (etrigger):: 该触发为异常触发。该寄存器中其余位域的含义如 `etrigger` 所述。6 (mcontrol6):: 该触发为地址/数据匹配触发。 该寄存器中剩余的位域作用如 `mcontrol6` 所述。这类似于类型为 2 的触发，但提供了额外功能，并且在新实现中应优先使用类型为 2 的触发。7 (tmexttrigger):: 此触发源为位于 TM 之外的外部触发源。该寄存器中剩余的位域作用如 `tmexttrigger` 所述。12—14 (custom):: 这些触发类型可供非标准用途使用。15 (disabled):: 此触发被禁用。在此状态下，`tdata2` 和 `tdata3` 可以写入任何支持的值，这些值适用于该触发所实现的任一类型。该寄存器中除 `DMODE` 外的其余位域均被忽略。\n\n其他值保留供将来使用。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "DMODE"
              bits: "27"
              desc: "如果类型为 0，则该位被硬连线为 0。\n\n0（两者）：Debug 模式和 M 模式均可向选定的 `tselect` 写入 `tdata` 寄存器。1（dmode）：仅 Debug 模式可向选定的 `tselect` 写入 `tdata` 寄存器，其他模式的写入操作将被忽略。\n\n该位仅能由调试模式写入。在普通使用中，外部调试器在配置触发器时总是会设置该位。清除该位时，调试器还应将动作位域（其位置取决于类型）设置为非 1 的值。"
            - name: "DATA"
              bits: "26:0"
              desc: "如果类型为 0，则该位域被硬连线为 0。触发特定数据。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "tdata2"
          desc: "触发数据 2\n\n该寄存器提供对 `tselect` 选定的触发器的访问。此处列出的复位值适用于每个底层触发器。\n\n触发特定数据。若无实现的触发使用该数据，则该字段可选。若触发被禁用，则可向该寄存器写入任何被支持的触发类型所支持的值。若 XLEN 小于 DXLEN，则对本寄存器的写操作将进行符号扩展。"
          fields:
            - name: "DATA"
              bits: "31:0"
              desc: "数据值"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "tdata3"
          desc: "触发数据 3\n\n该寄存器提供对 `tselect` 选定的触发器的访问。此处列出的复位值适用于每个底层触发器。\n\n触发特定数据。若无实现的触发使用该数据，则该字段可选。若触发被禁用，则可向该寄存器写入任何被支持的触发类型所支持的值。若 XLEN 小于 DXLEN，则对本寄存器的写操作将进行符号扩展。"
          fields:
            - name: "DATA"
              bits: "31:0"
              desc: "数据值"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "mcontext"
          desc: "机器模式上下文\n\n该寄存器在 `hcontext` 被实现时必须实现，否则为可选。仅在 M 模式和调试模式下可访问。\n\n`hcontext` 主要用于在虚拟机系统中设置触发条件，仅当执行特定的 VM 时才会触发。它在 M 模式直接实现类似虚拟机系统的系统中也具有实用性。"
          fields:
            - name: "HCONTEXT"
              bits: "13:0"
              desc: "M-模式或HS-模式（使用`hcontext`）软件可以将上下文编号写入该寄存器，可用于设置仅在特定上下文中触发的触发器。\n\n实现可能将此字段中的任意数量高位连接至0。若未实现H扩展，建议在RV32和RV64位上实现6位和13位（通过`mcontext`寄存器可见）。若实现了H扩展，建议在RV32和RV64位上实现7位和14位。"
        - name: "mscontext"
          desc: "机器模式监管者上下文\n\n该可选寄存器是 `scontext` 的别名。它仅在 S/HS 模式、M 模式和调试模式下可访问。该寄存器为与版本 0.13 的向后兼容性保留。\n\n该 CSR 的编码不符合特权规范中规定的 CSR 地址映射约定。预期新实现将不支持此编码，且新调试器在存在 `scontext` 时将不再使用此 CSR。"
          fields:
            - name: "DATA"
              bits: "31:0"
              desc: "监管者模式软件可以将上下文编号写入该寄存器，可用于设置仅在特定上下文触发的触发器。\n\n实现可能将此字段中的任意数量高位位域连接至0。建议在RV32上实现16位，在RV64上实现32位。"
          condition: "全部满足： Sdtrig，S"
        - name: "dcsr"
          desc: "调试控制和状态寄存器\n\n进入调试模式时，v 和 prv 会被更新为 hart 进入调试模式前的特权级别，cause 会被更新为进入调试模式的原因。除这些字段和 nmip 外，dcsr 的其他字段仅能由外部调试器写入。\n\n进入调试模式的原因优先级（从高到低）如下所示。5:: resethaltreq 6:: halt group 3:: haltreq 2:: trigger 1:: ebreak 4:: step\n\n为兼容旧版本规范，resethaltreq 和 haltreq 允许位于所示位置不同，只要：1。resethaltreq 优先级高于 haltreq 2。其他四个原因的相对顺序保持不变\n\n此 CSR 为读/写。"
          fields:
            - name: "DEBUGVER"
              bits: "31:28"
              desc: "0 (none)：无调试支持。4 (1.0)：存在调试支持，如本文件所述。15 (custom)：存在调试支持，但不遵循本规范中的任何可用版本。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "EXTCAUSE"
              bits: "26:24"
              desc: "当 cause 为 7 时，该可选字段包含比“其他”更具体的停止原因值；否则其值为 0。\n\n0（严重错误）：hart 进入了根据 Smdbltrp 扩展定义的严重错误状态。\n\n所有其他值均保留给本规范未来版本，或供其他 RISC-V 扩展使用。"
            - name: "CETRIG"
              bits: "19"
              desc: "该位属于 Smdbltrp 部分，仅在该扩展实现时存在。0（禁用）:: 当 hart 处于严重错误状态时，不会进入调试模式，而是向平台assert严重错误信号。1（启用）:: 当 hart 处于严重错误状态时，将进入调试模式，而不是向平台assert严重错误信号。进入调试模式后，原因字段设置为 7，扩展原因字段设置为 0，表示由严重错误触发了调试模式的进入。该原因在所有触发调试模式的原因中具有最高优先级。从严重错误状态触发进入调试模式后恢复，将使 hart 返回至严重错误状态。\n\n当 cetrig 为 1 时，由于严重错误导致进入调试模式后恢复将因该严重错误立即重新进入调试模式。调试器可将 cetrig 设置为 0 以允许平台定义的严重错误信号处理动作发生。其他可能的动作包括使用调试模块复位控制发起 hart 或平台复位。"
            - name: "PELP"
              bits: "18"
              desc: "该位是 Zicfilp 的一部分，仅在该扩展实现时存在。0（NO_LP_EXPECTED）:: 无需预期落地垫指令。1（LP_EXPECTED）:: 预期存在落地垫指令。"
            - name: "EBREAKVS"
              bits: "17"
              desc: "0 (异常):: VS 模式中的 ebreak 指令行为如特权规范所述。1 (调试模式):: VS 模式中的 ebreak 指令进入调试模式。如果 hart 不支持虚拟化模式，则该位由硬件固定为 0。"
            - name: "EBREAKVU"
              bits: "16"
              desc: "0 (异常):: VU 模式中的 ebreak 指令行为如特权规范所述。1 (调试模式):: VU 模式中的 ebreak 指令进入调试模式。如果 hart 不支持虚拟化模式，则该位由硬件固定为 0。"
            - name: "EBREAKM"
              bits: "15"
              desc: "0 (异常):: M 模式中的 ebreak 指令行为符合特权规范描述。1 (调试模式):: M 模式中的 ebreak 指令进入调试模式。"
            - name: "EBREAKS"
              bits: "13"
              desc: "0 (异常):: S 模式中的 ebreak 指令行为如特权规范所述。1 (调试模式):: S 模式中的 ebreak 指令进入调试模式。如果 hart 不支持 S 模式，则该位由硬件固定为 0。"
            - name: "EBREAKU"
              bits: "12"
              desc: "0 (异常):: U 模式中的 ebreak 指令行为如特权规范所述。1 (调试模式):: U 模式中的 ebreak 指令进入调试模式。如果 hart 不支持 U 模式，则该位由硬件固定为 0。"
            - name: "STEPIE"
              bits: "11"
              desc: "0（中断禁用）：在单步执行且启用了单步模式时，中断（包括NMI）被禁用。该值应被支持。1（中断启用）：在单步执行且启用了单步模式时，中断（包括NMI）被启用。实现可将该位硬连线至0。在此情况下，中断行为可通过调试器进行模拟。调试器在hart运行期间不得更改该位的值。"
              reset_info: "Unified DB reset_value() 表达式： if (DCSR_STEPIE_TYPE == \"read-only-0\") { return 0; } else if (DCSR_STEPIE_TYPE == \"read-only-1\") { return 1; } assert(DCSR_STEPIE_TYPE == \"rw\", \"Unhandled DCSR_STEPIE_TYPE value\"); return UNDEFINED_LEGAL;"
            - name: "STOPCOUNT"
              bits: "10"
              desc: "0（正常）：正常递增计数器。1（冻结）：在调试模式下或在触发进入调试模式的 ebreak 指令时，不递增任何 hart-本地计数器。这些计数器包括 instret 和 CSR。在单核 hart 核心中应停止时钟周期，但在多核 hart 核心中必须持续递增。实现可将该位硬连线至 0 或 1。"
              reset_info: "Unified DB reset_value() 表达式： if (DCSR_STOPCOUNT_TYPE == \"read-only-0\") { return 0; } else if (DCSR_STOPCOUNT_TYPE == \"read-only-1\") { return 1; } assert(DCSR_STOPCOUNT_TYPE == \"rw\", \"Unhandled DCSR_STOPCOUNT_TYPE value\"); return UNDEFINED_LEGAL;"
            - name: "STOPTIME"
              bits: "9"
              desc: "0（正常）:: 时间持续反映 mtime。1（冻结）:: 时间在进入调试模式时被冻结。退出调试模式时，时间将再次反映 mtime 的最新值。当所有 hart 的 stoptime=1 且均处于调试模式时，允许 mtime 停止递增。实现可能将该位硬编码为 0 或 1。"
              reset_info: "Unified DB reset_value() 表达式： if (DCSR_STOPTIME_TYPE == \"read-only-0\") { return 0; } else if (DCSR_STOPTIME_TYPE == \"read-only-1\") { return 1; } assert(DCSR_STOPTIME_TYPE == \"rw\", \"Unhandled DCSR_STOPTIME_TYPE value\"); return UNDEFINED_LEGAL;"
            - name: "CAUSE"
              bits: "8:6"
              desc: "说明进入调试模式的原因。当一个周期内同时存在多个进入调试模式的原因时，硬件应将 cause 设置为优先级最高的原因。1 (ebreak):: 执行了一条 ebreak 指令。2 (trigger):: 触发模块以 action=1 触发。3 (haltreq):: 调试器通过 haltreq 请求进入调试模式。4 (step):: 由于 step 已置位，hart 执行了单步。5 (resethaltreq):: 由于 resethaltreq，hart 在复位后直接停止；此时也允许报告 3。6 (group):: hart 因属于停止组而停止；也可报告 3。7 (other):: hart 因上述原因以外的原因停止；extcause 可包含更具体的原因。"
            - name: "V"
              bits: "5"
              desc: "在 prv 位域中扩展虚拟化模式字段，该字段表示 hart 进入调试模式时所处的虚拟化模式。调试器可更改该值以在退出调试模式时改变 hart 的虚拟化模式。该位在不支持虚拟化模式的 hart 上被硬件固定为 0。"
            - name: "MPRVEN"
              bits: "4"
              desc: "0（禁用）:: 在调试模式下，mstatus 中的 mprv 位被忽略。1（启用）:: 在调试模式下，mstatus 中的 mprv 位生效。实现该位是可选的。它可被连接至 0 或 1 之一。"
              reset_info: "Unified DB reset_value() 表达式： if (DCSR_MPRVEN_TYPE == \"read-only-0\") { return 0; } else if (DCSR_MPRVEN_TYPE == \"read-only-1\") { return 1; } assert(DCSR_MPRVEN_TYPE == \"rw\", \"Unhandled DCSR_MPRVEN_TYPE value\"); return UNDEFINED_LEGAL;"
            - name: "NMIP"
              bits: "3"
              desc: "当该位被置位时，表示存在一个不可屏蔽中断（NMI）待处理，针对 hart（hart）。由于一个 NMI 可能指示硬件错误条件，一旦该位被置位，可靠的调试可能已不再可行。此行为为实现定义。"
            - name: "STEP"
              bits: "2"
              desc: "当该位被置位且未处于调试模式时，hart 将仅执行一条指令然后进入调试模式。调试器在 hart 运行期间不得更改该位的值。"
            - name: "PRV"
              bits: "1:0"
              desc: "包含 hart 进入调试模式时所处的特权模式。调试器可以更改该值以在退出调试模式时改变 hart 的特权模式。\n\n并非所有特权模式都在所有 hart 上得到支持。如果所写的编码不被支持，或调试器被禁止切换至该模式，hart 可能会变为任意一个被支持的特权模式。"
        - name: "dpc"
          desc: "调试 PC 寄存器\n\n进入调试模式时，dpc 被更新为将要执行的下一条指令的虚拟地址。\n\n执行程序缓冲区可能会导致 dpc 的值变为 UNSPECIFIED。若情况属实，则必须能够使用 postexec 未设置的抽象命令读写 dpc。调试器必须在暂停和执行程序缓冲区之间尝试保存 dpc，并在退出调试模式前恢复 dpc。\n\n若访问寄存器抽象命令在hart运行时支持读取dpc，则读取的值应为最近执行指令的地址。\n\n若访问寄存器抽象命令支持在 hart 运行时写入 dpc，则执行程序应在写入操作发生后不久跳转至所写入的地址。\n\ndpc 的可写性遵循特权规范中定义的 mepc 的规则。特别地，dpc 必须能够容纳所有有效的虚拟地址，且低位的可写性取决于 IALIGN。\n\n恢复时，hart的PC被更新为存储在dpc中的虚拟地址。调试器可写入dpc以改变hart恢复的位置。\n\n此 CSR 为读/写。"
          fields:
            - name: "DPC"
              bits: "31:0"
              desc: "调试 PC 值"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "dscratch0"
          desc: "调试暂存寄存器\n\n可选的暂存寄存器，可用于需要该寄存器的实现。调试器在 hartinfo 明确提及之前不得向该寄存器写入（调试模块可内部使用该寄存器）。"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "Scratch 位域用于存放调试例程使用的值。"
        - name: "dscratch1"
          desc: "调试暂存寄存器\n\n可选的暂存寄存器，可用于需要该寄存器的实现。调试器在 hartinfo 明确提及之前不得向该寄存器写入（调试模块可内部使用该寄存器）。"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "Scratch 位域用于存放调试例程使用的值。"
