    - name: "Hypervisor"
      title: "虚拟机监控器"
      access: "CSR 指令编码空间"
      desc: "RISC-V 32 位架构 CSR 定义：虚拟机监控器。CSR 地址使用标准 CSR 编码空间，而非 MMIO 地址。"
      registers:
        - name: "mtinst"
          desc: "机器模式陷阱指令寄存器\n\n当发生陷阱时，若陷阱向量指向 M 模式，则将值写入 mtinst，若该值非零，则提供有关引发陷阱的指令的信息，以协助软件处理该陷阱。在陷阱情况下可写入 mtinst 的值在 TODO 中有详细说明。\n\nmtinst 是一个 WARL 寄存器，仅需能够持有实现可能在陷阱发生时自动写入它的值。"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "进入 M 模式时的异常特定信息。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "mtval2"
          desc: "机器模式第二陷阱值寄存器\n\n当从虚拟模式触发陷阱进入 M 模式时，mtval2 将被写入附加的异常特定信息，与 mtval 一起，以协助软件处理该陷阱。\n\n当发生客户机页故障陷阱并被送入M 模式时，mtval2被写入零或故障的客户机物理地址，该地址右移2位。对于其他陷阱，mtval2被置为零，但未来的标准或扩展可能重新定义其他陷阱下mtval2的设置。\n\n若客户机页故障由第一级（VS阶段）地址转换期间的隐式内存访问引起，则写入mtval2的客户机物理地址即为引发故障的隐式内存访问的物理地址。有关此类情况的额外信息见CSR mtinst以进行区分。\n\n否则，对于因客户机页故障而引发的未对齐加载和存储操作，mtval2 中的非零客户机物理地址对应于由 mtval 中虚拟地址指示的访问故障部分。对于具有可变长度指令的系统中发生的指令客户机页故障，非零的 mtval2 对应于由 mtval 中虚拟地址指示的指令故障部分。\n\nmtval2 是一个 WARL 寄存器，必须能够保存零值，并且可能仅能保存其他 2-bit-左移的客户机物理地址的任意子集，如果存在的话。"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "进入 M 模式时的异常特定信息。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "hstatus"
          desc: "虚拟机监控器状态\n\nhstatus 寄存器追踪和控制一个 VS 模式客户机。\n\n不同于 `sstatus` 中的位域，所有位域均为 `mstatus` 位域的别名，`hstatus` 中的位域是独立位域且无别名。"
          fields:
            - name: "HUKTE"
              bits: "24"
              desc: "虚拟机监控器 UKTE\n\n若实现了 Svukte 扩展，HUKTE 位域确定当在 U 模式中执行 HLV、HLVX 和 HSV 指令时，这些指令是否为 Svukte-合格。当在 U 模式中执行其中任一指令时，其行为等同于将 `senvcfg`.UKTE 设置为 HUKTE 的值。若未实现 Svukte，则 HUKTE 读为零。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "VTSR"
              bits: "22"
              desc: "虚拟陷阱 SRET\n\n当 `hstatus.VTSR` 被置位时，在 VS 模式中执行 `sret` 指令将引发一个 `Virtual Instruction` 异常。\n\n当 `hstatus.VTSR` 为零时，执行 `sret` 指令的 VS 模式将控制权返回至存储于 `vsstatus.SPP` 的模式。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "VTW"
              bits: "21"
              desc: "虚拟陷阱 WFI\n\n当 `hstatus.VTW` 被置位时，在 VS 模式中执行 `wfi` 指令将在等待一个实现定义的时间量（该时间量可为 0）后引发 `Virtual Instruction` 异常。\n\n当 `hstatus.VTW` 和 `mstatus.TW` 均为零时，`wfi` 指令在 VS 模式中执行且不设置超时周期。\n\n`wfi` 指令同样受 `mstatus.TW` 影响，如下所示：\n\n[separator=\"!\",%autowidth,%footer]\n!===\n.2+! [.rotate]#`mstatus.TW`# .2+! [.rotate]#`hstatus.VTW`# 4+^.>! `wfi` 行为\nh! HS 模式 h! U 模式 h! VS 模式 h! VU 模式\n\n! 0 ! 0 ! 等待 ! 陷阱（I） ! 等待 ! 陷阱（V） ! 0 ! 1 ! 等待 ! 陷阱（I） ! 陷阱（V） ! 陷阱（V） ! 1 ! - ! 陷阱（I） ! 陷阱（I） ! 陷阱（I） ! 陷阱（I）\n\n6+! 陷阱（I）- 代码为 `Illegal Instruction` 的陷阱 +\n陷阱 (V) - 带有 `Virtual Instruction` 代码的陷阱\n!==="
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "VTVM"
              bits: "20"
              desc: "虚拟陷阱虚拟内存\n\n置位后，在 VS 模式下执行 `sfence.vma`、`sinval.vma`，或显式访问 `satp`（实际为 `vsatp`）CSR 时，将产生“虚拟指令”陷阱。\n\n当清零时，指令在 VS 模式中正常执行。\n\n值得注意的是，`hstatus.VTVM` 不会引起 `hfence.vvma`、`sfence.w.inval` 或 `sfence.inval.ir` 产生陷阱。\n\n`mstatus.TVM` 不影响由 `hstatus.VTVM` 控制的 VS 模式指令。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "VGEIN"
              bits: "17:12"
              desc: "虚拟客户机外部中断编号\n\n选择客户机外部中断源用于 VS 级外部中断。\n\n当 `hstatus.VGEIN` == 0 时，未选择外部中断源。\n\n当 `hstatus.VGEIN` != 0 时，它选择 `hgeip` 中当前在 VS 模式中有效的位。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "HU"
              bits: "9"
              desc: "虚拟机监控器在 U 模式中\n\n当置位时，虚拟机加载/存储指令（`hlv`、`hlvx` 和 `hsv`）可以在 U 模式中执行。\n\n当清零时，虚拟机加载/存储指令引发一个 `Illegal Instruction` 陷阱。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "SPVP"
              bits: "8"
              desc: "监管者先前虚拟特权\n\n硬件写入：\n\n* 当从 VS 模式或 VU 模式进入 HS 模式发生陷阱时，`hstatus.SPVP` 被写入名义特权模式\n\n值得注意的是，与它的类比版本 `mstatus.SPP` 不同，`hstatus.SPVP` 在返回陷阱时*不会*被清除。\n\n也可由软件在无立即副作用的情况下写入。\n\n通过以下方式影响执行：\n\n* 控制应用于虚拟机监控器加载/存储指令的有效特权级别，`hlv`、`hlvx` 和 `hsv`。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "SPV"
              bits: "7"
              desc: "监管者之前虚拟化模式\n\n硬件写入：\n\n* 在进入 HS 模式时发生陷阱，硬件在先前模式为 VS 模式或 VU 模式时写入 1，否则写入 0。\n\n也可由软件在无立即副作用的情况下写入。\n\n通过以下方式影响执行：\n\n* 当在 HS 模式或 M 模式执行一条 `sret` 指令时，\n控制返回至 VS 模式或 VU 模式（由 `mstatus.SPP` 选定）时\n`hstatus.SPV` 等于 1 且等于 HS 模式或 U 模式否则。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "GVA"
              bits: "6"
              desc: "客户机虚拟地址\n\n硬件在发生陷阱时写入 HS 模式：\n\n* 当陷阱导致客机虚拟地址写入 `stval`（`Breakpoint`、`* Address Misaligned`、`* Access Fault`、`* Page Fault` 或 `* Guest-Page Fault`）时，写入 1。\n* 写入 0 否则\n\n不影响执行。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "VSBE"
              bits: "5"
              desc: "VS 模式大端序\n\n控制数据的字节序。VS 模式（0 = little，1 = big）。指令始终为小端序，无论数据设置如何。\n\n当返回 VS_MODE_ENDIANNESS == \"little\";：由于 CPU 不支持大端模式在 VS 模式中，此设置被硬件固定为 0。\n\n当返回 VS_MODE_ENDIANNESS == \"big\";：由于 CPU 不支持小端模式在 VS 模式中，此设置被硬件固定为 1。"
              reset_info: "Unified DB reset_value() 表达式： if (VS_MODE_ENDIANNESS == \"little\") { return 0; } else if (VS_MODE_ENDIANNESS == \"big\") { return 1; } else { return UNDEFINED_LEGAL; }"
        - name: "hedeleg"
          desc: "虚拟机监控器异常委派\n\n控制从 HS 模式到 VS 模式的异常委托。\n\n默认情况下，所有特权级的陷阱均在 M 模式中处理，尽管 M 模式通常使用 `medeleg` 和 `mideleg` 寄存器将部分陷阱委派给 HS 模式。`hedeleg` 和 `hideleg` 寄存器可将这些陷阱进一步委派给 VS 模式客户机；其布局与 `medeleg` 和 `mideleg` 相同。\n\n一个被委派至 HS 模式（使用 `medeleg`）的同步陷阱，若在陷阱发生前 V=1 且相应的 `hedeleg` 位被置位，则将进一步委派至 VS 模式。`hedeleg` 的每一位必须为可写或只读零。`hedeleg` 的许多位必须具体指定为可写或零。若 IALIGN=32，则与指令地址未对齐异常对应的位 0 必须为可写。\n\n[NOTE]\n====\n要求某些 `hedeleg` 位域可写可减少部分的\n给虚拟机监控器带来处理实现差异的负担。\n====\n\n当 XLEN=32 时，`hedelegh` 是一个 32-bit 读/写寄存器，其别名指向 `hedeleg` 的位域 63:32。当 XLEN=64 时，寄存器 `hedelegh` 不存在。"
          fields:
            - name: "IAM"
              bits: "0"
              desc: "*指令地址未对齐*\n\n控制将指令地址未对齐异常的委派至 VS 模式。\n\n详见 `medeleg.IAM`。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "IAF"
              bits: "1"
              desc: "*指令访问故障*\n\n控制将指令访问故障异常委派至 VS 模式。\n\n详见 `medeleg.IAF`。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "II"
              bits: "2"
              desc: "*非法指令*\n\n控制将非法指令异常委派至 VS 模式。\n\n详见 `medeleg.II`。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "B"
              bits: "3"
              desc: "*断点*\n\n控制将断点异常委派至 VS 模式。\n\n详见 `medeleg.B`。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "LAM"
              bits: "4"
              desc: "*加载地址未对齐*\n\n控制将加载地址未对齐异常委派至 VS 模式。\n\n详见 `medeleg.LAM`。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "LAF"
              bits: "5"
              desc: "*加载访问故障*\n\n控制将加载访问故障异常委派至 VS 模式。\n\n详见 `medeleg.LAF`。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "SAM"
              bits: "6"
              desc: "*存储/AMO 地址未对齐*\n\n控制将 Store/AMO 地址未对齐异常委托给 VS 模式。\n\n详见 `medeleg.SAM`。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "SAF"
              bits: "7"
              desc: "*存储/AMO 访问故障*\n\n控制将 Store/AMO 访问故障异常委派至 VS 模式。\n\n详见 `medeleg.SAF`。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "EU"
              bits: "8"
              desc: "*来自 VU 模式的环境调用*\n\n控制将来自 VU 模式异常的环境调用委派给 VS 模式。\n\n详见 `medeleg.EU`。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "ES"
              bits: "9"
              desc: "*来自 HS 模式的环境调用*\n\n来自 HS 模式环境调用的异常 _无法委派给 VS 模式_，因此该位域为只读 0。\n\n详见 `medeleg.ES`。"
            - name: "EVS"
              bits: "10"
              desc: "*来自 VS 模式的环境调用*\n\n来自 VS 模式环境调用的异常 _无法委派给 VS 模式_，因此该位域为只读 0。\n\n详见 `medeleg.EVS`。"
            - name: "EM"
              bits: "11"
              desc: "*来自 M 模式的环境调用*\n\n来自 M 模式环境调用的异常 _无法委派给 VS 模式_，因此该位域为只读 0。\n\n详见 `medeleg.EM`。"
            - name: "IPF"
              bits: "12"
              desc: "*指令页故障*\n\n控制将指令页故障异常委派至 VS 模式。\n\n详见 `medeleg.IPF`。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "LPF"
              bits: "13"
              desc: "*加载页故障*\n\n控制将加载页故障异常委派给 VS 模式。\n\n详见 `medeleg.LPF`。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "SPF"
              bits: "15"
              desc: "*存储/AMO 页故障*\n\n控制将 Store/AMO 页故障异常委派给 VS 模式。\n\n详见 `medeleg.SPF`。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "IGPF"
              bits: "20"
              desc: "*指令客户机页故障*\n\n指令客户机页故障异常_不能被委派给VS模式_，因此该位域为只读0。\n\n详见 `medeleg.IGPF`。"
            - name: "LGPF"
              bits: "21"
              desc: "*加载客户机页故障*\n\n加载客户机页故障异常_不能被委派给VS模式_，因此该位域为只读0。\n\n详见 `medeleg.LGPF`。"
            - name: "VI"
              bits: "22"
              desc: "*虚拟指令*\n\n虚拟指令异常_不能被委派给VS模式_，因此该位域为只读0。\n\n详见 `medeleg.VI`。"
            - name: "SGPF"
              bits: "23"
              desc: "*存储/AMO 客户机页故障*\n\n存储/AMO 客户机页故障异常_不能被委派给VS模式_，因此该位域为只读0。\n\n详见 `medeleg.SGPF`。"
        - name: "henvcfg"
          desc: "虚拟机监控器环境配置\n\nhenvcfg CSR 是一个 64-bit 读/写寄存器，用于控制在虚拟化模式 V=1 下执行环境的某些特性。\n\n如果在 henvcfg 中将位域 `henvcfg.FIOM`（Fence of I/O implies Memory）置为一，则当 V=1 时执行的 `fence` 指令会修改其行为，使得对设备 I/O 有顺序访问要求时，也必须对主存访问进行顺序化。\n\n<<henvcfg-FIOM>> 详细说明了在 FENCE 指令位 PI、PO、SI 和 SO 的修改解释情形下的情形。\nFIOM=1 且 V=1。\n\n同样，当 `henvcfg.FIOM`=1 且 V=1 时，若一个访问被指定为设备 I/O 区域的原子指令其 _aq_ 和/或 _rl_ 位被置位，则该指令的顺序将等同于它同时访问设备 I/O 和内存。\n\n[[henvcfg-FIOM]]\n.FENCE 前驱和后继集的修改解释当 FIOM=1 且虚拟化模式 V=1 时。\n[%autowidth,float=\"center\",align=\"center\",cols=\"^,<\",options=\"header\"]\n|===\n|指令位 | 设置时的含义\n|PI +\nPO\n|前代设备输入及内存读取（PR 隐式）+\n前驱设备输出及内存写入（PW 隐含）\n|SI +\nSO\n|后继设备输入及内存读取（SR 隐含）+\n后继设备输出及内存写入（SW 隐含）\n|===\n\nPBMTE 位控制 Svpbmt 扩展是否可用于 VS 阶段地址转换。当 PBMTE=1 时，Svpbmt 可用于 VS 阶段地址转换。当 PBMTE=0 时，实现行为等同于 Svpbmt 未实现于 VS 阶段地址转换。若 Svpbmt 未实现，则 PBMTE 读为保留零。\n\n若实现了 Svadu 扩展，ADUE 位控制是否在 VS 阶段地址翻译中启用硬件更新 PTE A/D 位。当 ADUE=1 时，在 VS 阶段地址翻译期间启用硬件更新 PTE A/D 位，且实现行为等同于未实现 Svade 扩展的 VS 模式阶段地址翻译。当 ADUE=0 时，实现行为等同于实现了 Svade 扩展的 VS 阶段地址翻译。若未实现 Svadu，则 ADUE 为只读零。\n\nSTCE 位域的定义由 Sstc 扩展提供。\n\nCBZE 位域的定义由 Zicboz 扩展提供。\n\nCBCFE 和 CBIE 位域的定义由 Zicbom 扩展提供。\n\nPMM 位域的定义将由即将发布的 Ssnpm 扩展提供。其在 `henvcfg` 中的分配在该扩展定稿前可能发生变化。\n\nZicfilp 扩展在 `henvcfg` 中增加 `LPE` 位域。当 `LPE` 位域设置为 1 时，Zicfilp 扩展在 VS 模式中启用。当 `LPE` 位域为 0 时，Zicfilp 扩展在 VS 模式中未启用，以下规则适用于 VS 模式：\n\n* hart 不更新 `ELP` 状态；其保持为 `NO_LP_EXPECTED`。\n* `LPAD` 指令操作为无操作。\n\nZicfiss 扩展在 `henvcfg` 中增加 `SSE` 位域。若 `SSE` 位域设置为 1，则在 VS 模式中激活 Zicfiss 扩展。当 `SSE` 位域为 0 时，Zicfiss 扩展在 VS 模式中保持非激活状态，且在 `V=1` 下适用以下规则：\n\n* 32-bit Zicfiss 指令将恢复为 Zimop 定义的行为。\n* 16-bit Zicfiss 指令将恢复为 Zcmop 所定义的行为。\n* `pte.xwr=010b` 编码在 VS 阶段页表中变为保留。\n* `senvcfg.SSE` 位域将读为零且为只读。\n* 当 `menvcfg.SSE` 为 1 时，`SSAMOSWAP.W/D` 触发虚拟指令\n异常。\n\nSsdbltrp 扩展在 `henvcfg` 中增加了一个双陷阱使能（`DTE`）位域。当 `henvcfg.DTE` 为零时，实现行为等同于对 VS 模式来说未实现 Ssdbltrp，且 `vsstatus.SDT` 位为只读零。\n\n当 XLEN=32 时，`henvcfgh` 是一个 32-bit 读/写寄存器，其别名指向 `henvcfg` 的位域 63:32。当 XLEN=64 时，寄存器 `henvcfgh` 不存在。"
          fields:
            - name: "CBZE"
              bits: "7"
              desc: "*缓存块零指令使能*\n\n启用缓存块零指令的执行，`CBO.ZERO`\n<% if ext?(:S) %>\n在 S 模式中\n<% elsif ext?(:U) %>\n在 U 模式中\n<% end %>。\n\n * `0`：该指令引发非法指令或虚拟指令异常\n * `1`：该指令被执行"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "CBCFE"
              bits: "6"
              desc: "*缓存块清除和刷新指令使能*\n\n启用缓存块清除指令的执行，`CBO.CLEAN`，以及\n缓存块清除指令，`CBO.FLUSH`\n<% if ext?(:S) %>\n在 S 模式中\n<% elsif ext?(:U) %>\n在 U 模式中\n<% end %>。\n\n * `0`：该指令引发非法指令或虚拟指令异常\n * `1`：该指令被执行"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "CBIE"
              bits: "5:4"
              desc: "*缓存块无效化指令使能*\n\n启用缓存块无效指令的执行，`CBO.INVAL`\n<% if ext?(:S) %>\n在 S 模式中\n<% elsif ext?(:U) %>\n在 U 模式中\n<% end %>。\n\n * `00`：该指令引发非法指令或虚拟指令异常\n * `01`：该指令被执行并执行刷新操作\n * `10`: _保留_\n * `11`：指令执行并执行无效操作"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "SSE"
              bits: "3"
              desc: "*影栈使能*\n\n如果 SSE 位域设置为 1，则在 VS 模式中激活 Zicfiss 扩展。当 SSE 位域为 0 时，Zicfiss 扩展在 VS 模式中保持非激活状态，并且当 V=1 时，适用以下规则：\n\n-32-bit Zicfiss 指令将恢复为 Zimop 定义的行为。\n\n-16-bit Zicfiss 指令将恢复为 Zcmop 所定义的行为。\n\n-VS阶段页表中pte.xwr=010b编码变为保留。\n\n-senvcfg.SSE 位域将读为零且为只读。\n\n当 menvcfg.SSE 为 1 时，SSAMOSWAP.W/D 产生虚拟指令异常。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "LPE"
              bits: "2"
              desc: "*着陆垫使能*\n\n当 LPE 位域设置为 1 时，Zicfilp 扩展在 VS 模式中启用。当 LPE 位域为 0 时，Zicfilp 扩展在 VS 模式中未启用，并且以下规则适用于 VS 模式：\n\n * hart 不更新 `ELP` 状态；其保持为 `NO_LP_EXPECTED`。\n * `LPAD` 指令操作为无操作。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "FIOM"
              bits: "0"
              desc: "*内存屏障 I/O 意味着内存*\n\n当 `menvcfg.FIOM` 被置位时，FENCE 指令的 I/O 区域在任何低于 M 模式的特权级别的模式下执行时，也隐式地对内存区域进行排序。\n\n[separator=\"!\",%autowidth,float=\"center\",align=\"center\",cols=\"^,<\",options=\"header\"]\n!===\n!指令位 ! 设置时的含义\n!PI +\nPO\n!前代设备输入及内存读取（PR 隐式）+\n前驱设备输出及内存写入（PW 隐含）\n!SI +\nSO\n!后继设备输入及内存读取（SR 隐含）+\n后继设备输出及内存写入（SW 隐含）\n!===\n\n同样，当模式的特权等级低于 M 且 FIOM=1 时，若一个访问被标记为设备 I/O 区域的原子指令其 _aq_ 和/或 _rl_ 位被置位，则该指令的顺序将被视为同时访问设备 I/O 和内存。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
          condition: "全部满足： Sm \">=1.12\"，H"
        - name: "hstateen0"
          desc: "虚拟机监控器状态使能 0 寄存器\n\n每个 `stateen` CSR 位控制较低特权级对扩展状态的访问，针对那些未被判定为“值得”拥有 XS 位域的扩展，例如在 `sstatus` 中的 FS 和 VS 位域，用于 F 和 V 扩展。\n\n每个级别提供的寄存器数量为四个，因为认为 4 * 64 = 256 位用于机器和虚拟机级别，而 4 * 32 = 128 位用于监管者级别，将足以满足未来多年的需求，或许至少能延续到 RISC-V ISA 仍被使用为止。确切的数值为四，是试图在一方面提供过少位数与另一方面过度设计将永不使用的 CSR 之间取得的平衡。\n\n`stateen` 寄存器在每一级控制对所有较低特权级状态的访问，但不控制对其自身级状态的访问。\n\n当 `stateen` CSR 阻止特权模式访问状态时，尝试在该特权模式下执行隐式更新状态但不读取状态的指令，可能引发非法指令或虚拟指令异常，也可能不引发。此类情况必须通过明确指定一种方式来区分。在某些情况下，`stateen` 的 CSR 位域将具有双重作用，作为启用 ISA 扩展功能的使能位，这些扩展功能引入了受控状态。\n\n在虚拟机扩展中，`hstateen` 的 CSR 编码与 `mstateen` 的 CSR 编码相同，仅在虚拟机访问控制方面存在差异（来自 VS 和 VU 模式）。\n\n对于 `hstateen` 中每个在 CSR 中为零的位（无论是只读零还是被置为零），当在 VS 模式中访问时，该位在 `sstateen` 中同样表现为只读零。\n\n`hstateen` 中的某位在 CSR 中不能被定义为只读，除非同一位置在匹配的 `mstateen` CSR 中同样被定义为只读。"
          fields:
            - name: "JVT"
              bits: "2"
              desc: "jvt 访问控制\n\nJVT 位控制对 `jvt` 提供的 CSR 的访问，该功能由 Zcmt 扩展提供。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "FCSR"
              bits: "1"
              desc: "fcsr 访问控制\n\nFCSR 位控制浮点指令操作 `x` 寄存器而非 `f` 寄存器时对 `fcsr` 的访问，该行为由 Zfinx 及相关扩展（如 Zdinx 等）指定。每当 `misa.F` = 1 时，FCSR 位在 `mstateen0` 中为只读零（因此在 `hstateen0` 和 `sstateen0` 中同样为只读零）。为方便起见，当实现 `stateen` CSRs 且 `misa.F` = 0 时，若控制 `stateen0` CSR 的 FCSR 位为零，则所有浮点指令将引发非法指令陷阱（或虚拟指令陷阱，视情况而定），如同它们均访问 `fcsr`，无论实际是否如此。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "C"
              bits: "0"
              desc: "自定义状态访问控制\n\nC 位控制对任何和全部自定义状态的访问。这些寄存器中的 C 位本身并非自定义状态；它是一个标准位域，属于标准 CSR 寄存器中的位域，即 `mstateen0`、`hstateen0` 或 `sstateen0` 之一。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
          condition: "全部满足： H，Smstateen，Ssstateen"
        - name: "hstateen1"
          desc: "虚拟机监控器状态使能 1 寄存器\n\n每个 `stateen` CSR 位控制较低特权级对扩展状态的访问，针对那些未被判定为“值得”拥有 XS 位域的扩展，例如在 `sstatus` 中的 FS 和 VS 位域，用于 F 和 V 扩展。\n\n每个级别提供的寄存器数量为四个，因为认为 4 * 64 = 256 位用于机器和虚拟机级别，而 4 * 32 = 128 位用于监管者级别，将足以满足未来多年的需求，或许至少能延续到 RISC-V ISA 仍被使用为止。确切的数值为四，是试图在一方面提供过少位数与另一方面过度设计将永不使用的 CSR 之间取得的平衡。\n\n`stateen` 寄存器在每一级控制对所有较低特权级状态的访问，但不控制对其自身级状态的访问。\n\n当 `stateen` CSR 阻止特权模式访问状态时，尝试在该特权模式下执行隐式更新状态但不读取状态的指令，可能引发非法指令或虚拟指令异常，也可能不引发。此类情况必须通过明确指定一种方式来区分。在某些情况下，`stateen` 的 CSR 位域将具有双重作用，作为启用 ISA 扩展功能的使能位，这些扩展功能引入了受控状态。\n\n在虚拟机扩展中，`hstateen` 的 CSR 编码与 `mstateen` 的 CSR 编码相同，仅在虚拟机访问控制方面存在差异（来自 VS 和 VU 模式）。\n\n对于 `hstateen` 中每个在 CSR 中为零的位（无论是只读零还是被置为零），当在 VS 模式中访问时，该位在 `sstateen` 中同样表现为只读零。\n\n`hstateen` 中的某位在 CSR 中不能被定义为只读，除非同一位置在匹配的 `mstateen` CSR 中同样被定义为只读。"
          fields: []
          condition: "全部满足： H，Smstateen，Ssstateen"
        - name: "hstateen2"
          desc: "虚拟机监控器状态使能 2 寄存器\n\n每个 `stateen` CSR 位控制较低特权级对扩展状态的访问，针对那些未被判定为“值得”拥有 XS 位域的扩展，例如在 `sstatus` 中的 FS 和 VS 位域，用于 F 和 V 扩展。\n\n每个级别提供的寄存器数量为四个，因为认为 4 * 64 = 256 位用于机器和虚拟机级别，而 4 * 32 = 128 位用于监管者级别，将足以满足未来多年的需求，或许至少能延续到 RISC-V ISA 仍被使用为止。确切的数值为四，是试图在一方面提供过少位数与另一方面过度设计将永不使用的 CSR 之间取得的平衡。\n\n`stateen` 寄存器在每一级控制对所有较低特权级状态的访问，但不控制对其自身级状态的访问。\n\n当 `stateen` CSR 阻止特权模式访问状态时，尝试在该特权模式下执行隐式更新状态但不读取状态的指令，可能引发非法指令或虚拟指令异常，也可能不引发。此类情况必须通过明确指定一种方式来区分。在某些情况下，`stateen` 的 CSR 位域将具有双重作用，作为启用 ISA 扩展功能的使能位，这些扩展功能引入了受控状态。\n\n在虚拟机扩展中，`hstateen` 的 CSR 编码与 `mstateen` 的 CSR 编码相同，仅在虚拟机访问控制方面存在差异（来自 VS 和 VU 模式）。\n\n对于 `hstateen` 中每个在 CSR 中为零的位（无论是只读零还是被置为零），当在 VS 模式中访问时，该位在 `sstateen` 中同样表现为只读零。\n\n`hstateen` 中的某位在 CSR 中不能被定义为只读，除非同一位置在匹配的 `mstateen` CSR 中同样被定义为只读。"
          fields: []
          condition: "全部满足： H，Smstateen，Ssstateen"
        - name: "hstateen3"
          desc: "虚拟机监控器状态使能 3 寄存器\n\n每个 `stateen` CSR 位控制较低特权级对扩展状态的访问，针对那些未被判定为“值得”拥有 XS 位域的扩展，例如在 `sstatus` 中的 FS 和 VS 位域，用于 F 和 V 扩展。\n\n每个级别提供的寄存器数量为四个，因为认为 4 * 64 = 256 位用于机器和虚拟机级别，而 4 * 32 = 128 位用于监管者级别，将足以满足未来多年的需求，或许至少能延续到 RISC-V ISA 仍被使用为止。确切的数值为四，是试图在一方面提供过少位数与另一方面过度设计将永不使用的 CSR 之间取得的平衡。\n\n`stateen` 寄存器在每一级控制对所有较低特权级状态的访问，但不控制对其自身级状态的访问。\n\n当 `stateen` CSR 阻止特权模式访问状态时，尝试在该特权模式下执行隐式更新状态但不读取状态的指令，可能引发非法指令或虚拟指令异常，也可能不引发。此类情况必须通过明确指定一种方式来区分。在某些情况下，`stateen` 的 CSR 位域将具有双重作用，作为启用 ISA 扩展功能的使能位，这些扩展功能引入了受控状态。\n\n在虚拟机扩展中，`hstateen` 的 CSR 编码与 `mstateen` 的 CSR 编码相同，仅在虚拟机访问控制方面存在差异（来自 VS 和 VU 模式）。\n\n对于 `hstateen` 中每个在 CSR 中为零的位（无论是只读零还是被置为零），当在 VS 模式中访问时，该位在 `sstateen` 中同样表现为只读零。\n\n`hstateen` 中的某位在 CSR 中不能被定义为只读，除非同一位置在匹配的 `mstateen` CSR 中同样被定义为只读。"
          fields: []
          condition: "全部满足： H，Smstateen，Ssstateen"
        - name: "hedelegh"
          desc: "虚拟机监控器异常委派高\n\n控制从 HS 模式到 VS 模式的异常委托。\n\n`hedeleg`[63:32]高层位的别名。"
          fields: []
          condition: "全部满足： XLEN=32，H"
        - name: "henvcfgh"
          desc: "32 寄存器中最高有效位的虚拟机监控器环境配置位\n\nhenvcfgh CSR 是一个用于读写 32-bit 寄存器的 32 位的 `henvcfg` 寄存器。"
          fields:
            - name: "STCE"
              bits: "31"
              desc: "*STimecmp 启用*\n\n当置位时，`stimecmp` 在 VS 模式中处于操作状态，前提是 `menvcfg.STCE` 也置位。\n\n当 `menvcfg.STCE` 为零时：\n * `henvcfg.STCE` 读为零\n * 访问 `vstimecmp` 引发一个 `IllegalInstruction` 异常。\n * `hip.VSTIP` 退化为定义行为，如同 Sstc 未实现一样。\n * VS 模式定时器中断将不会被生成\n\n当 `menvcfg.STCE` 为一且 `henvcfg.STCE` 为零时：\n * 访问 `stimecmp` 在 VS 模式或 VU 模式（实际上是 `vstimecmp`）中引发虚拟中断异常\n * `hip.VSTIP` 退化为定义行为，如同 Sstc 未实现一样。\n * VS 模式定时器中断将不会被生成\n\n别名：henvcfg.STCE"
              reset_info: "Unified DB reset_value() 表达式： return (implemented?(ExtensionName::Sstc)) ? UNDEFINED_LEGAL : 0;"
            - name: "PBMTE"
              bits: "30"
              desc: "*基于页的内存类型使能*\n\nPBMTE 位控制 `Svpbmt` 扩展是否可用于 VS 阶段地址转换。\n\n当 PBMTE=1 时，Svpbmt 可用于 VS 阶段的地址转换。\n\n当 PBMTE=0 时，实现行为等同于 `Svpbmt` 未在 VS 阶段地址转换中实现。\n\n若未实现 `Svpbmt`，则 PBMTE 读为零。\n\n`henvcfg.PBMTE` 在 `menvcfg.PBMTE` 为零时读为零。\n\n若将 PBMTE 位在 `menvcfg` 中的设置发生改变，则只需执行一条 _rs1_=_x0_ 且 _rs2_=_x0_ 的 `hfence.gvma` 指令，即可与 G 阶段和 VS 阶段 PTEs 的 PBMT 位域的更新解释保持同步。\n\n相比之下，如果将 PBMTE 位在 `henvcfg` 中修改，执行一条 _rs1_=_x0_ 且 _rs2_=_x0_ 的 `hfence.vvma` 指令即可同步至当前激活的 VMID 的 VS 阶段页表项（PTE）的 PBMT 位域的修改解释。\n\n[NOTE]\n--\n未提供机制以原子性地同时修改 `vsatp` 和 `hgatp`。\n因此，为防止推测执行导致一个客户机的 VS 阶段译码出现\n在另一客户机的 VMID 中缓存时，世界切换代码应将 `vsatp` 清零，然后交换 `hgatp`。\n然后最终写入新的 `vsatp` 值。\n同样，若 `henvcfg.PBMTE` 需要进行世界切换，应在其清零后进行切换\n`vsatp` 但写入新的 `vsatp` 值之前，省略执行一个\n`hfence.vvma` 指令。\n--\n\n别名：henvcfg.PBMTE"
              reset_info: "Unified DB reset_value() 表达式： return (implemented?(ExtensionName::Svpbmt)) ? UNDEFINED_LEGAL : 0;"
            - name: "ADUE"
              bits: "29"
              desc: "若实现 `Svadu` 扩展，则 ADUE 位控制是否启用硬件更新 PTE A/D 位，以支持 VS 阶段地址转换。\n\n当 ADUE=1 时，在 VS 阶段地址转换期间启用 PTE 的 A/D 位硬件更新，并且实现行为等同于在 VS 模式地址转换中未实现 Svade 扩展。\n\n当 ADUE=0 时，实现行为等同于在 VS 阶段地址翻译中启用了 Svade。\n\n若未实现 Svadu，则 ADUE 读为零。\n\n此外，对于具有虚拟机监控器扩展的实现，若 menvcfg.ADUE 为零，则 henvcfg.ADUE 为只读零。\n\n别名：henvcfg.ADUE"
              reset_info: "Unified DB reset_value() 表达式： return (implemented?(ExtensionName::Svadu)) ? UNDEFINED_LEGAL : 0;"
          condition: "全部满足： XLEN=32，全部满足： Sm \">=1.12\"，H"
        - name: "hstateen0h"
          desc: "32 位的上部虚拟机监控器状态使能 0 寄存器\n\n对于 RV64 hart，Smstateen/Ssstateen 扩展在机器级增加了四个新的 64-bit CSRs：`mstateen0`（机器模式状态使能 0）、`mstateen1`、`mstateen2` 和 `mstateen3`。如果实现了监管者模式，另在监管者级定义了四个 CSRs：`sstateen0`、`sstateen1`、`sstateen2` 和 `sstateen3`。如果实现了虚拟机扩展，再增加一组 CSRs：`hstateen0`、`hstateen1`、`hstateen2` 和 `hstateen3`。\n\n对于 RV32，上述寄存器为 32-bit，而对于机器级和虚拟机监控器 CSR，存在一组对应于每个寄存器上半部分（即最高 32 位）的高半 CSR：`mstateen0h`、`mstateen1h`、`mstateen2h`、`mstateen3h`、`hstateen0h`、`hstateen1h`、`hstateen2h` 和 `hstateen3h`。"
          fields:
            - name: "SE0"
              bits: "31"
              desc: "sstateen0 访问控制\n\nSE0 位在 `hstateen0h` 中控制对 `sstateen0` CSR 的访问。\n\n别名：hstateen0.SE0"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "ENVCFG"
              bits: "30"
              desc: "senvcfg 访问控制\n\n`hstateen0h` 寄存器中的 ENVCFG 位控制对 `senvcfg` CSRs 的访问。\n\n别名：hstateen0.ENVCFG"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "CSRIND"
              bits: "28"
              desc: "siselect 和 sireg* 的访问控制\n\n`hstateen0h` 寄存器中的 CSRIND 位控制对 `siselect` 和 `sireg*`（实际上是 `vsiselect` 和 `vsireg*`）CSR 的访问，这些 CSR 由 Sscsrind 扩展提供。\n\n别名：hstateen0.CSRIND"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "AIA"
              bits: "27"
              desc: "Ssaia 状态访问控制\n\nAIA 位域在 `hstateen0h` 中控制对 Ssaia 扩展引入的所有状态的访问，并且不受 `hstateen0` 中 CSRIND 或 IMSIC 位的控制。\n\n别名：hstateen0.AIA"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "IMSIC"
              bits: "26"
              desc: "IMSIC 状态访问控制\n\n`hstateen0h` 寄存器中的 IMSIC 位控制对客户机 IMSIC 状态的访问，包括由 Ssaia 扩展提供的 CSRs `stopei`（实际为 `vstopei`）。\n\n将 `hstateen0h` 寄存器中的 IMSIC 位设为零，可防止虚拟机访问 hart 的 IMSIC，效果等同于设置 `hstatus.`VGEIN = 0。\n\n别名：hstateen0.IMSIC"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "CONTEXT"
              bits: "25"
              desc: "scontext 访问控制\n\nCONTEXT 位在 `hstateen0h` 中控制对 `scontext` 提供的 CSR 的访问，该访问由 Sdtrig 扩展提供。\n\n别名：hstateen0.CONTEXT"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "CTR"
              bits: "22"
              desc: "ctr 访问控制\n\n如果实现了 H 扩展且 `mstateen0.CTR=1`，`hstateen0.CTR` 位控制在 V=1 时对监管者 CTR 状态的访问。该状态包括 `sctrctl`（实际上是 `vsctrctl`）、`sctrstatus` 和 `sireg*`（实际上是 `vsireg*`），当 `siselect`（实际上是 `vsiselect`）处于 0x200..0x2FF 时。`hstateen0.CTR` 在 `mstateen0.CTR=0` 时为只读 0。\n\n别名：hstateen0.CTR"
          condition: "全部满足： XLEN=32，全部满足： H，Smstateen，Ssstateen"
        - name: "hstateen1h"
          desc: "32 位的上部虚拟机监控器状态使能 1 寄存器\n\n对于 RV64 hart，Smstateen/Ssstateen 扩展在机器级增加了四个新的 64-bit CSRs：`mstateen0`（机器模式状态使能 0）、`mstateen1`、`mstateen2` 和 `mstateen3`。如果实现了监管者模式，另在监管者级定义了四个 CSRs：`sstateen0`、`sstateen1`、`sstateen2` 和 `sstateen3`。如果实现了虚拟机扩展，再增加一组 CSRs：`hstateen0`、`hstateen1`、`hstateen2` 和 `hstateen3`。\n\n对于 RV32，上述寄存器为 32-bit，而对于机器级和虚拟机监控器 CSR，存在一组对应于每个寄存器上半部分（即最高 32 位）的高半 CSR：`mstateen0h`、`mstateen1h`、`mstateen2h`、`mstateen3h`、`hstateen0h`、`hstateen1h`、`hstateen2h` 和 `hstateen3h`。"
          fields:
            - name: "SE0"
              bits: "31"
              desc: "sstateen1 访问控制\n\nSE0 位在 `hstateen1h` 中控制对 `sstateen1` CSR 的访问。\n\n别名：hstateen1.SE0"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
          condition: "全部满足： XLEN=32，全部满足： H，Smstateen，Ssstateen"
        - name: "hstateen2h"
          desc: "32 位的上部虚拟机监控器状态使能 2 寄存器\n\n对于 RV64 hart，Smstateen/Ssstateen 扩展在机器级增加了四个新的 64-bit CSRs：`mstateen0`（机器模式状态使能 0）、`mstateen1`、`mstateen2` 和 `mstateen3`。如果实现了监管者模式，另在监管者级定义了四个 CSRs：`sstateen0`、`sstateen1`、`sstateen2` 和 `sstateen3`。如果实现了虚拟机扩展，再增加一组 CSRs：`hstateen0`、`hstateen1`、`hstateen2` 和 `hstateen3`。\n\n对于 RV32，上述寄存器为 32-bit，而对于机器级和虚拟机监控器 CSR，存在一组对应于每个寄存器上半部分（即最高 32 位）的高半 CSR：`mstateen0h`、`mstateen1h`、`mstateen2h`、`mstateen3h`、`hstateen0h`、`hstateen1h`、`hstateen2h` 和 `hstateen3h`。"
          fields:
            - name: "SE0"
              bits: "31"
              desc: "sstateen2 访问控制\n\nSE0 位在 `hstateen2h` 中控制对 `sstateen2` CSR 的访问。\n\n别名：hstateen2.SE0"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
          condition: "全部满足： XLEN=32，全部满足： H，Smstateen，Ssstateen"
        - name: "hstateen3h"
          desc: "32 位的上部虚拟机监控器状态使能 3 寄存器\n\n对于 RV64 hart，Smstateen/Ssstateen 扩展在机器级增加了四个新的 64-bit CSRs：`mstateen0`（机器模式状态使能 0）、`mstateen1`、`mstateen2` 和 `mstateen3`。如果实现了监管者模式，另在监管者级定义了四个 CSRs：`sstateen0`、`sstateen1`、`sstateen2` 和 `sstateen3`。如果实现了虚拟机扩展，再增加一组 CSRs：`hstateen0`、`hstateen1`、`hstateen2` 和 `hstateen3`。\n\n对于 RV32，上述寄存器为 32-bit，而对于机器级和虚拟机监控器 CSR，存在一组对应于每个寄存器上半部分（即最高 32 位）的高半 CSR：`mstateen0h`、`mstateen1h`、`mstateen2h`、`mstateen3h`、`hstateen0h`、`hstateen1h`、`hstateen2h` 和 `hstateen3h`。"
          fields:
            - name: "SE0"
              bits: "31"
              desc: "sstateen3 访问控制\n\nSE0 位在 `hstateen3h` 中控制对 `sstateen3` CSR 的访问。\n\n别名：hstateen3.SE0"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
          condition: "全部满足： XLEN=32，全部满足： H，Smstateen，Ssstateen"
        - name: "htval"
          desc: "虚拟机监控器陷阱值寄存器\n\n当发生陷阱时，HS 模式写入 htval，同时写入 stval，附加异常特定信息，以协助软件处理该陷阱。\n\n当发生客户机页故障陷阱并被送入HS 模式时，htval被写入零或故障的客户机物理地址，该地址右移2位。对于其他陷阱，htval被置为零，但未来的标准或扩展可能重新定义其他陷阱下htval的设置。\n\n客户机页故障可能源于一级（VS阶段）地址转换过程中的隐式内存访问，此时写入htval的客户机物理地址即为引发故障的隐式内存访问地址，例如无法读取的VS级页表项地址。（当VS阶段地址转换未能完成时，原虚拟地址对应的客户机物理地址未知。）有关此类情况的额外信息由CSR htinst提供以进行区分。\n\n否则，对于因客户机页故障而引发的未对齐加载和存储操作，htval 中的非零客户机物理地址对应于由 stval 中虚拟地址指示的访问故障部分。对于具有可变长度指令的系统中发生的指令客户机页故障，非零的 htval 对应于由 stval 中虚拟地址指示的指令故障部分。\n\nhtval 是一个 WARL 寄存器，必须能够保存零值，并且可能仅能保存其他 2-bit-左移的客户机物理地址的任意子集，如果存在的话。"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "进入 HS 模式时的异常特定信息。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "htinst"
          desc: "虚拟机监控器陷阱指令寄存器\n\n当发生陷阱时，若陷阱向量指向 HS 模式，则将值写入 htinst，若该值非零，则提供有关引发陷阱的指令的信息，以协助软件处理该陷阱。在陷阱情况下可写入 htinst 的值在 TODO 中有详细说明。\n\nhtinst 是一个 WARL 寄存器，仅需能够持有实现可能在陷阱发生时自动写入它的值。"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "进入 HS 模式时的异常特定信息。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "hgatp"
          desc: "虚拟机监控器客户机地址转换与保护\n\nhgatp 寄存器是一个 HSXLEN-bit 可读写寄存器，用于控制 G-stage 地址转换与保护，即客户机虚拟地址两阶段转换的第二阶段。与 CSR `satp` 类似，该寄存器保存客户机物理根页表的物理页号（PPN）、虚拟机标识符（VMID）以及 MODE 位域；VMID 用于按虚拟机执行地址转换栅栏，MODE 用于选择客户机物理地址的地址转换方案。当 `mstatus.TVM`=1 时，在 HS 模式下执行代码若尝试读写 `hgatp`，将引发 `IllegalInstruction` 异常。\n\n<<hgatp-mode>> 显示了 MODE 位域在何种情况下的编码当\nHSXLEN=32 且 HSXLEN=64。当 MODE=Bare 时，客户机物理地址为\n等于监管者物理地址，且无进一步内存\n对客户机虚拟机的物理内存之外的保护\n<<pmp>> 所描述的保护方案。在此\n当该情况成立时，`hgatp` 中其余的位域必须设置为零。\n\n[[hgatp-mode]]\n.`hgatp` MODE 位域编码。\n[%autowidth,float=\"center\",align=\"center\",cols=\"^,^,<\",options=\"header\"]\n|===\n3+|HSXLEN=32\n|值 | 名称 | 描述\n|0 +\n1\n|Bare +\nSv32x4\n|无翻译或保护。+\n基于页的 34-bit 虚拟寻址（2-bit 扩展）\nSv32）。\n3+s| HSXLEN=64\n|值 | 名称 | 描述\n|0 +\n1-7 +\n8 +\n9 +\n10 +\n11-15\n|Bare +\n-- +\nSv39x4 +\nSv48x4 +\nSv57x4 +\n--\n|无翻译或保护。+\n_保留_ +\n基于页的 41-bit 虚拟寻址（2-bit 扩展）\nSv39). +\n基于页的 50-bit 虚拟寻址（2-bit 扩展）\nSv48). +\n基于页的 59-bit 虚拟寻址（2-bit 扩展）\nSv57). +\n_保留_\n|===\n\n当 HSXLEN=64 时，实现无需支持所有定义的 MODE 设置。\n\n向 `hgatp` 写入不支持的 MODE 值时，并不会像对 `satp` 一样被忽略。相反，当指示时，`hgatp` 的位域将以正常方式被 *WARL*。\n\n如<<guest-addr-translation>>所述，对于分页虚拟内存方案（Sv32x4、Sv39x4、Sv48x4 和 Sv57x4），根页表大小为 16 KiB，且必须对齐到 16-KiB 的边界。在这些模式下，`hgatp` 中物理页号（PPN）的最低两位在读取时始终为零。支持仅定义的分页虚拟内存方案和/或裸机的实现可将 PPN[1:0] 设置为只读零。\n\nVMID 位的数量为 UNSPECIFIED，可能为零。实现的 VMID 位数量，称为 _VMIDLEN_，可通过将 VMID 字段中的每一位置为 1，然后读回 `hgatp` 字段中的值，以确定 VMID 字段中哪些位位置为 1 来确定。VMID 的最低有效位优先实现：即若 VMIDLEN > 0，则 VMID[VMIDLEN-1:0] 可写。VMIDLEN 的最大值，称为 VMIDMAX，对于 Sv32x4 为 7，对于 Sv39x4、Sv48x4 和 Sv57x4 为 14。\n\n`hgatp` 寄存器在地址转换算法中被视为 _active_，除非有效特权模式为 U 且 `hstatus`.HU=0。\n\n[NOTE]\n====\n此定义简化了投机执行的实现\nof `hlv`, `hlvx`, 和 'hsv' 指令。\n====\n\n注意，写入 `hgatp` 不意味着页表更新与后续 G 阶段地址转换之间存在任何顺序约束。如果新虚拟机的客户机物理页表已被修改，或若复用 VMID，则可能需要在写入 `hgatp` 之前或之后执行 HFENCE.GVMA 指令（参见 <<hfence.vma>>）。"
          fields:
            - name: "MODE"
              bits: "31"
              desc: "当 MODE=Bare 时，客户机物理地址等于监管者物理地址，且客户机虚拟机在物理内存保护方案之外没有进一步的内存保护。在此情况下，hgatp 的其余位域必须置为零。\n\n当 HSXLEN=32 时，MODE 的唯一其他有效设置为 Sv32x4，其为通常的 Sv32 分页虚拟内存方案的修改版本，扩展以支持 34-bit 客户机物理地址。当 HSXLEN=64 时，Sv39x4、Sv48x4 和 Sv57x4 模式被定义为 Sv39、Sv48 和 Sv57 分页虚拟内存方案的修改版本。\n\n向 hgatp 写入不支持的 MODE 值时，并不会像对 `satp` 的写入那样被忽略。相反，当指示时，hgatp 的位域将按正常方式被置为 WARL。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "VMID"
              bits: "28:22"
              desc: "虚拟机 ID。\n\nVMID 位数由参数 VMID_WIDTH 决定。VMID_WIDTH 可由软件通过将 VMID 字段中的每一位置 1，然后读取 hgatp 字段中的值来确定，以查看 VMID 字段中哪些位位置为 1。VMID 的最低有效位首先实现：即若 VMID_WIDTH > 0，则 VMID[VMID_WIDTH-1:0] 可写。VMID_WIDTH 的最大值（称为 VMIDMAX）在 Sv32x4 情况下为 7，在 Sv39x4、Sv48x4 和 Sv57x4 情况下为 14。"
              reset_info: "Unified DB reset_value() 表达式： if (VMID_WIDTH == 0) { return 0; } else { return UNDEFINED_LEGAL; }"
            - name: "PPN"
              bits: "21:0"
              desc: "客机物理根页表的物理页号（PPN）。"
              reset_info: "Unified DB reset_value() 表达式： if (!SV32X4_TRANSLATION && !SV39X4_TRANSLATION && !SV48X4_TRANSLATION && !SV57X4_TRANSLATION) { return 0; } else { return UNDEFINED_LEGAL_DETERMINISTIC; }"
    - name: "Machine"
      title: "机器模式"
      access: "CSR 指令编码空间"
      desc: "RISC-V 32 位架构 CSR 定义：机器模式。CSR 地址使用标准 CSR 编码空间，而非 MMIO 地址。"
      registers:
        - name: "mstatus"
          desc: "机器模式状态\n\nmstatus 寄存器追踪并控制 hart 的当前运行状态。"
          fields:
            - name: "SD"
              bits: "31"
              desc: "状态脏\n\n只读位，用于汇总 FS、XS 或 VS 位域中任一指示存在某些脏状态。"
              condition: "任一满足： F，Zvl32b"
              reset_info: "Unified DB reset_value() 表达式： if (mstatus_sd_has_known_reset()) { return mstatus_sd_reset_value(); } else { return UNDEFINED_LEGAL; }"
            - name: "SPELP"
              bits: "23"
              desc: "S 模式之前期望的着陆垫状态\n\n持有进入陷阱（H）时的先前预期着陆垫（`ELP`）状态，并在退出（S 模式）时恢复为（`ELP`），在（`SRET`）时恢复。\n\n由 Zicfilp 扩展定义。\n\n编码形式为：\n\n* 0 - `NO_LP_EXPECTED` - 无着陆垫指令预期。\n* 1 - `LP_EXPECTED` - 预期出现着陆指令。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "TSR"
              bits: "22"
              desc: "陷阱 SRET\n\n当 1、在执行 HS/S 模式模式下尝试执行 `sret` 指令时，将引发非法指令异常。\n\n[when,\"ext?(:H)\"]\n不影响 VS_mode 下 `sret` 的行为（参见 `hstatus.VTSR`）。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "TW"
              bits: "21"
              desc: "超时等待\n\n当 1 时，WFI 指令在非 M 模式模式下执行将经历一个实现定义的等待周期后引发非法指令陷阱。\n\n当 0 时，`wfi` 指令被允许在 (H)S 模式中无限期等待，但在 U 模式中必须在实现定义的等待周期后触发陷阱。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "TVM"
              bits: "20"
              desc: "陷阱虚拟内存\n\n当 1，出现 `Illegal Instruction` 陷阱时\n\n* 写入 `satp` CSR，执行一个 `sfence.vma`，或在 (H)S 模式（但非 VS 模式）模式下执行一个 `sinval.vma`\n* 写入 `hgtap` CSR，执行一个 `hfence.gvma`，或在 HS 模式模式下执行一个 `hinval.gvma`\n\n值得注意的是，`mstatus.TVM` 并不会导致\n\n*`hfence.vvma`, `sfence.w.inval`, 或 `sfence.inval.ir` 产生陷阱。\n* VS 模式中的任何其他陷阱（通过 `hstatus.VTVM` 控制）。"
              reset_info: "Unified DB reset_value() 表达式： if (CSR[misa].S == 1'b0) { return 0; } else if (!(implemented?(ExtensionName::Sv32) || implemented?(ExtensionName::Sv39) || implemented?(ExtensionName::Sv48) || implemented?(ExtensionName::Sv57))) { return 0; } else { return UNDEFINED_LEGAL; }"
            - name: "MXR"
              bits: "19"
              desc: "使可执行读取able\n\n当 1 时，允许从标记为可读 *或* 可执行的页面进行加载。当 0 时，从标记为可执行的页面加载将引发页故障异常。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "SUM"
              bits: "18"
              desc: "允许监管者内存访问\n\n当 0、一个 S 模式读操作或一个带有 mstatus.MPRV=1 且 mstatus.MPP=01 的 M 模式读操作访问一个‘U’（用户）页时，将引发一个 ILLEGAL INSTRUCTION 异常。"
              reset_info: "Unified DB reset_value() 表达式： if (has_virt_mem?()) { return UNDEFINED_LEGAL; } else { return 0; }"
            - name: "MPRV"
              bits: "17"
              desc: "修改 PRiVilege\n\n当 1 时，加载和存储操作的行为如同当前虚拟化模式：特权级为 `mstatus.MPV`:`mstatus.MPP`。\n\n`mstatus.MPRV` 在任何异常返回时被清零（包括 `mret` 或 `sret` 指令，无论陷阱处理程序的特权模式如何）。"
            - name: "XS"
              bits: "16:15"
              desc: "自定义（X）扩展上下文状态\n\n汇总任何自定义扩展状态的当前值。取值为：0 - 关闭，1 - 初始，2 - 清洁，3 - 污染。由于基线规范中未定义自定义扩展，该位域为只读 0。"
            - name: "FS"
              bits: "14:13"
              desc: "浮点上下文状态\n\n当 0 为 1 时，浮点指令（来自 F 和 D 扩展）被禁用，并引发 `ILLEGAL INSTRUCTION` 异常。当对浮点寄存器或 fCSR 寄存器进行写操作时，FS 获取值 3。值 1 和 2 为软件的有效写入值，但硬件仅将其用于可能启用先前已禁用的浮点单元。"
              condition: "任一满足： F，S"
              reset_info: "Unified DB reset_value() 表达式： if (MISA_CSR_IMPLEMENTED && (CSR[misa].S == 1'b0) && (CSR[misa].F == 1'b0)) { return 0; } return $array_size(MSTATUS_FS_LEGAL_VALUES) == 1 ? MSTATUS_FS_LEGAL_VALUES[0] : UNDEFINED_LEGAL;"
            - name: "MPP"
              bits: "12:11"
              desc: "M 模式之前特权\n\n硬件在两种情况下写入：\n\n* 进入 M 模式时，使用先前的名义特权级别，该级别在发生异常/中断时确定。\n* 使用 0 在执行 `mret` 指令以从 M 模式异常中返回时写入。\n\n也可由软件在无立即副作用的情况下写入。\n\n影响执行的两种情况：\n\n* 在从 M 模式的异常返回时，机器将\n在清除该位域之前，进入存储在 MPP 中的特权级别。\n* 当 `mstatus.MPRV` 被置位时，加载和存储操作的行为如同当前特权级别为 MPP。"
              reset_info: "Unified DB reset_value() 表达式： return 2'b11;"
            - name: "VS"
              bits: "10:9"
              desc: "向量上下文状态\n\n当 0 为 1 时，向量指令（来自 V 扩展）被禁用，并引发 ILLEGAL INSTRUCTION 异常。当向一个向量寄存器或向量 CSR 写入时，VS 获取值 3。值 1 和 2 为软件的有效写入值，但硬件仅将其用于可能启用先前已禁用的向量单元。"
              condition: "任一满足： Zvl32b，S"
              reset_info: "Unified DB reset_value() 表达式： if ((!implemented?(ExtensionName::S) && !implemented?(ExtensionName::V)) || (MISA_CSR_IMPLEMENTED && (CSR[misa].S == 1'b0) && (CSR[misa].V == 1'b0))) { return 0; } return $array_size(MSTATUS_VS_LEGAL_VALUES) == 1 ? MSTATUS_VS_LEGAL_VALUES[0] : UNDEFINED_LEGAL;"
            - name: "SPP"
              bits: "8"
              desc: "S 模式之前特权\n\n硬件在两种情况下写入：\n\n* 进入异常/中断时，以先前的名义特权级别设定（H）S 模式。\n* 使用 0 在执行 `sret` 指令以从 (H)S 模式或 (不太可能) M 模式异常中返回时写入。\n\n也可由软件在无立即副作用的情况下写入。\n\n在一种情况下影响执行：\n\n* 在使用 `sret` 指令从异常返回时，若在 (H)S 模式或（不太可能）M 模式情况下，\n机器将在清除该位域之前进入存储在SPP中的特权级别。\n\n值得注意的是，`mstatus.SPP` 不影响 VS 模式中的异常返回（参见 `vsstatus.SPP`）。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "MPIE"
              bits: "7"
              desc: "M 模式之前中断使能\n\n硬件在两种情况下写入：\n\n* 在从异常/中断进入 M 模式时，使用进入 `mstatus.MIE` 时的原值。\n* 在发生异常返回至 M 模式时，使用值 1（通过 `mret` 指令）设置。\n\n也可由软件写入，且无即时副作用。\n\n除作为上述描述的嵌套陷阱记录之外，`mstatus.MPIE` 不影响执行。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "UBE"
              bits: "6"
              desc: "U 模式大端序\n\n控制 U 模式的字节序（0 = 小端，1 = 大端）。无论数据设置如何，指令始终为小端格式。\n\n[when,\"U_MODE_ENDIANNESS == 'little'\"]\n由于 CPU 在 U 模式中不支持大端模式，此特性被硬编码至 0。\n\n[when,\"U_MODE_ENDIANNESS == 'big'\"]\n由于 CPU 在 U 模式中不支持小端模式，此特性被硬编码至 1。"
              reset_info: "Unified DB reset_value() 表达式： if (U_MODE_ENDIANNESS == \"little\") { return 0; } else if (U_MODE_ENDIANNESS == \"big\") { return 1; } else { return UNDEFINED_LEGAL; }"
            - name: "SPIE"
              bits: "5"
              desc: "S 模式之前中断使能\n\n硬件在两种情况下写入：\n\n* 以进入异常/中断时 `mstatus.SIE` 的原始值写入 (H)S 模式。\n* 在通过 `sret` 指令从异常返回时，写入值 1，该异常来自 (H)S 模式或（不太可能）M 模式。\n\n也可由软件写入，且无即时副作用。\n\n除作为上述描述的嵌套陷阱记录之外，`mstatus.SPIE` 不影响执行。"
              reset_info: "Unified DB reset_value() 表达式： return (CSR[misa].S == 1'b1) ? UNDEFINED_LEGAL : 0;"
            - name: "MIE"
              bits: "3"
              desc: "M 模式中断使能\n\n硬件在两种情况下写入：\n\n* 以 0 的值进入 M 模式时，从异常/中断中退出。\n* 在从 M 模式的异常返回时，使用返回时 `mstatus.MPIE` 的先前值（通过 `mret`）。\n\n通过以下方式影响执行：\n\n* 当 0 时，当前特权级别为 M 的情况下，所有中断被禁用。\n* 当 1 为 1 时，若未通过 `mie` 中的位域禁用的中断将被使能。"
            - name: "SIE"
              bits: "1"
              desc: "S 模式中断使能\n\n硬件在两种情况下写入：\n\n* 以 0 的值进入（H）S 模式时，从异常/中断触发。\n* 在通过 `sret` 返回异常时，使用返回时 `mstatus.SPIE` 的先前值，在 (H)S 模式或 (不太可能) M 模式中。\n\n通过以下方式影响执行：\n\n* 当 0 时，当前特权级为 (H)S 模式的所有中断被禁用（H)S（M 模式中断仍保持启用）。\n* 当 1，（H）S 模式中未通过 `sie` 中的位域其他方式禁用的中断被启用。"
              reset_info: "Unified DB reset_value() 表达式： return (CSR[misa].S == 1'b1) ? UNDEFINED_LEGAL : 0;"
        - name: "misa"
          desc: "机器模式 ISA 控制\n\n报告 XLEN 和“主要”扩展功能由 ISA 支持。"
          fields:
            - name: "MXL"
              bits: "31:30"
              desc: "XLEN 在 M 模式中。"
              reset_info: "Unified DB reset_value() 表达式： return (MXLEN == 32) ? 2'b01 : 2'b10;"
            - name: "A"
              bits: "0"
              desc: "指示支持 `A`（原子）扩展。\n\n[when,\"MUTABLE_MISA_A == true\"]\n将 0 写入该位域将导致所有原子指令引发一个 `IllegalInstruction` 异常。"
              reset_info: "Unified DB reset_value() 表达式： return implemented?(ExtensionName::A) ? 1 : 0;"
            - name: "B"
              bits: "1"
              desc: "指示支持 `B`（bitmanip）扩展。\n\n[when,\"MUTABLE_MISA_B == true\"]\n将 0 写入该位域将导致所有 bitmanip 指令引发一个 `IllegalInstruction` 异常。"
              reset_info: "Unified DB reset_value() 表达式： return implemented?(ExtensionName::B) ? 1 : 0;"
            - name: "C"
              bits: "2"
              desc: "指示支持 `C`（压缩）扩展。\n\n[when,\"MUTABLE_MISA_C == true\"]\n将 0 写入该位域将导致所有压缩指令引发一个 `IllegalInstruction` 异常。\n此外，IALIGN 变为 32。"
              reset_info: "Unified DB reset_value() 表达式： return implemented?(ExtensionName::C) ? 1 : 0;"
            - name: "D"
              bits: "3"
              desc: "指示支持 `D`（双精度浮点）扩展。\n\n[when,\"MUTABLE_MISA_D == true\"]\n--\n将 0 写入该位域将导致所有双精度浮点指令引发一个 `IllegalInstruction` 异常。\n\n此外，f 寄存器的高位 32 位将读为零。"
              reset_info: "Unified DB reset_value() 表达式： return implemented?(ExtensionName::D) ? 1 : 0;"
            - name: "F"
              bits: "5"
              desc: "指示支持 `F`（单精度浮点）扩展。\n\n[when,\"MUTABLE_MISA_F == true\"]\n--\n将 0 写入该位域将导致所有浮点（单精度和双精度）指令引发一个 `IllegalInstruction` 异常。\n\n将 0 写入该位域且 `misa.D` 位被置位将导致 UNDEFINED 行为。--"
              reset_info: "Unified DB reset_value() 表达式： return implemented?(ExtensionName::F) ? 1 : 0;"
            - name: "G"
              bits: "6"
              desc: "指示支持以下所有扩展：`I`, `A`, `M`, `F`, `D`。"
              reset_info: "Unified DB reset_value() 表达式： return ( implemented?(ExtensionName::A) && implemented?(ExtensionName::M) && implemented?(ExtensionName::F) && implemented?(ExtensionName::D)) ? 1 : 0;"
            - name: "H"
              bits: "7"
              desc: "指示支持 `H`（虚拟机监控器）扩展。\n\n[when,\"MUTABLE_MISA_H == true\"]\n将 0 写入该位域将导致所有尝试进入 VS- 或 VU- 模式、执行虚拟机指令或访问虚拟机 CSR 的操作均引发一个 `IllegalInstruction` 异常。"
              reset_info: "Unified DB reset_value() 表达式： return implemented?(ExtensionName::H) ? 1 : 0;"
            - name: "I"
              bits: "8"
              desc: "指示支持 `I`（基础）扩展。"
            - name: "M"
              bits: "12"
              desc: "指示支持 `M`（整数乘/除）扩展。\n\n[when,\"MUTABLE_MISA_M == true\"]\n将 0 写入该位域将导致所有尝试执行整数乘法或除法指令的操作引发一个 `IllegalInstruction` 异常。"
              reset_info: "Unified DB reset_value() 表达式： return implemented?(ExtensionName::M) ? 1 : 0;"
            - name: "Q"
              bits: "16"
              desc: "指示支持 `Q`（四精度浮点）扩展。\n\n[when,\"MUTABLE_MISA_Q == true\"]\n--\n将 0 写入该位域将导致所有四精度浮点指令引发一个 `IllegalInstruction` 异常。\n--"
            - name: "S"
              bits: "18"
              desc: "指示支持 `S`（监管者模式）扩展。\n\n[when,\"MUTABLE_MISA_S == true\"]\n将 0 写入该位域将导致所有尝试进入 S 模式或访问 S 模式状态的操作引发异常。"
              reset_info: "Unified DB reset_value() 表达式： return implemented?(ExtensionName::S) ? 1 : 0;"
            - name: "U"
              bits: "20"
              desc: "指示支持 `U`（用户模式）扩展。\n\n[when,\"MUTABLE_MISA_U == true\"]\n将 0 写入该位域将导致所有尝试进入 U 模式的操作引发异常。"
              reset_info: "Unified DB reset_value() 表达式： return implemented?(ExtensionName::U) ? 1 : 0;"
            - name: "V"
              bits: "21"
              desc: "指示支持 `V`（向量）扩展。\n\n[when,\"MUTABLE_MISA_V == true\"]\n将 0 写入该位域将导致所有尝试执行向量指令的操作均引发一个 `IllegalInstruction` 陷阱。"
              reset_info: "Unified DB reset_value() 表达式： return implemented?(ExtensionName::V) ? 1 : 0;"
        - name: "medeleg"
          desc: "机器模式异常委派\n\n控制从 M 模式到 (H)S 模式的异常委托\n<%- if ext?(:H) -%>\n或与 `hedeleg` 一起，用于 VS 模式\n<%- end -%>\n.\n\n当以下所有条件成立时，异常原因被委派给（H）S 模式：\n\n* `medeleg` 中对应的位域被置位。\n* 当前特权级别不是 M 模式。\n<%- if ext?(:H) -%>\n* `hedeleg` 中相同的位域被清零。\n<%- end -%>\n\n<%- if ext?(:H) -%>\n当以下所有条件成立时，异常原因被委派给 VS 模式：\n\n* `medeleg` 中对应的位域被置位。\n* `hedeleg` 中对应的位域被置位。\n* 当前特权级别不是 M 模式或 HS 模式。\n<%- end -%>\n\n否则，异常原因由 M 模式处理。\n\n参见 xref:prose:interrupts.adoc[interrupt 文档] 以获取更多详情。"
          fields:
            - name: "IAM"
              bits: "0"
              desc: "*指令地址未对齐*\n\n将指令地址未对齐异常委托给 (H)S 模式。\n<%- if ext?(:H) -%>\n指令地址未对齐异常可能进一步委派给 VS 模式，如果 `hedeleg.IAM` 也置位。\n<%- end -%>\n\n异常永远不会进入更低特权级模式，无论`medeleg`如何。\n\n处理模式的确定方式如下：\n\n<%- if ext?(:H) -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.IAM`# .2+! [.rotate]#`hedeleg.IAM`# 4+^.>! 当前模式\n.>h! `M 模式` .>h! `HS 模式` .>h! `VS 模式` .>h! `VU 模式`\n\n! 0 ! 0 ! M ! M ! M ! M\n! 0 ! 1 ! M ! M ! M ! M\n! 1 ! 0 ! M ! HS ! HS ! HS\n! 1 ! 1 ! M ! HS ! VS ! VS\n!===\n<%- else -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.IAM`# 2+^.>! 当前模式\n.>h! `M 模式` .>h! `S 模式`\n\n! 0 ! M ! M\n! 1 ! M ! S\n!===\n<%- end -%>"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "IAF"
              bits: "1"
              desc: "*指令访问故障*\n\n将指令访问故障异常委托给 (H)S 模式。\n<%- if ext?(:H) -%>\n指令访问故障异常可能进一步委派给 VS 模式，如果 `hedeleg.IAM` 也置位。\n<%- end -%>\n\n异常永远不会进入更低特权级模式，无论`medeleg`如何。\n\n处理模式的确定方式如下：\n\n<%- if ext?(:H) -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.IAF`# .2+! [.rotate]#`hedeleg.IAF`# 4+^.>! 当前模式\n.>h! `M 模式` .>h! `HS 模式` .>h! `VS 模式` .>h! `VU 模式`\n\n! 0 ! 0 ! M ! M ! M ! M\n! 0 ! 1 ! M ! M ! M ! M\n! 1 ! 0 ! M ! HS ! HS ! HS\n! 1 ! 1 ! M ! HS ! VS ! VS\n!===\n<%- else -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.IAF`# 2+^.>! 当前模式\n.>h! `M 模式` .>h! `S 模式`\n\n! 0 ! M ! M\n! 1 ! M ! S\n!===\n<%- end -%>"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "II"
              bits: "2"
              desc: "*非法指令*\n\n将非法指令异常委托给 (H)S 模式。\n<%- if ext?(:H) -%>\n非法指令异常可能进一步委派给 VS 模式，如果 `hedeleg.II` 也置位。\n<%- end -%>\n\n异常永远不会进入更低特权级模式，无论`medeleg`如何。\n\n处理模式的确定方式如下：\n\n<%- if ext?(:H) -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.II`# .2+! [.rotate]#`hedeleg.II`# 4+^.>! 当前模式\n.>h! `M 模式` .>h! `HS 模式` .>h! `VS 模式` .>h! `VU 模式`\n\n! 0 ! 0 ! M ! M ! M ! M\n! 0 ! 1 ! M ! M ! M ! M\n! 1 ! 0 ! M ! HS ! HS ! HS\n! 1 ! 1 ! M ! HS ! VS ! VS\n!===\n<%- else -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.II`# 2+^.>! 当前模式\n.>h! `M 模式` .>h! `S 模式`\n\n! 0 ! M ! M\n! 1 ! M ! S\n!===\n<%- end -%>"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "B"
              bits: "3"
              desc: "*断点*\n\n将断点异常委托给 (H)S 模式。\n<%- if ext?(:H) -%>\n断点异常可能进一步委派给 VS 模式，如果 `hedeleg.B` 也置位。\n<%- end -%>\n\n异常永远不会进入更低特权级模式，无论`medeleg`如何。\n\n处理模式的确定方式如下：\n\n<%- if ext?(:H) -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.B`# .2+! [.rotate]#`hedeleg.B`# 4+^.>! 当前模式\n.>h! `M 模式` .>h! `HS 模式` .>h! `VS 模式` .>h! `VU 模式`\n\n! 0 ! 0 ! M ! M ! M ! M\n! 0 ! 1 ! M ! M ! M ! M\n! 1 ! 0 ! M ! HS ! HS ! HS\n! 1 ! 1 ! M ! HS ! VS ! VS\n!===\n<%- else -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.B`# 2+^.>! 当前模式\n.>h! `M 模式` .>h! `S 模式`\n\n! 0 ! M ! M\n! 1 ! M ! S\n!===\n<%- end -%>"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "LAM"
              bits: "4"
              desc: "*加载地址未对齐*\n\n将加载地址未对齐异常委托给 (H)S 模式。\n<%- if ext?(:H) -%>\n负载地址未对齐异常可能进一步委派给 VS 模式，如果 `hedeleg.LAM` 也置位。\n<%- end -%>\n\n异常永远不会进入更低特权级模式，无论`medeleg`如何。\n\n[when,\"MISALIGNED_LDST == true\"]\n注意，由于该实现支持未对齐加载，因此此异常将永远不会发生。\n然而，可写位仍应存在。\n\n处理模式的确定方式如下：\n\n<%- if ext?(:H) -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.LAM`# .2+! [.rotate]#`hedeleg.LAM`# 4+^.>! 当前模式\n.>h! `M 模式` .>h! `HS 模式` .>h! `VS 模式` .>h! `VU 模式`\n\n! 0 ! 0 ! M ! M ! M ! M\n! 0 ! 1 ! M ! M ! M ! M\n! 1 ! 0 ! M ! HS ! HS ! HS\n! 1 ! 1 ! M ! HS ! VS ! VS\n!===\n<%- else -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.LAM`# 2+^.>! 当前模式\n.>h! `M 模式` .>h! `S 模式`\n\n! 0 ! M ! M\n! 1 ! M ! S\n!===\n<%- end -%>"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "LAF"
              bits: "5"
              desc: "*加载访问故障*\n\n将加载访问故障异常委托给 (H)S 模式。\n<%- if ext?(:H) -%>\n若同时设置 `hedeleg.LAF`，则加载访问故障异常可进一步委派至 VS 模式。\n<%- end -%>\n\n异常永远不会进入更低特权级模式，无论`medeleg`如何。\n\n处理模式的确定方式如下：\n\n<%- if ext?(:H) -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.LAF`# .2+! [.rotate]#`hedeleg.LAF`# 4+^.>! 当前模式\n.>h! `M 模式` .>h! `HS 模式` .>h! `VS 模式` .>h! `VU 模式`\n\n! 0 ! 0 ! M ! M ! M ! M\n! 0 ! 1 ! M ! M ! M ! M\n! 1 ! 0 ! M ! HS ! HS ! HS\n! 1 ! 1 ! M ! HS ! VS ! VS\n!===\n<%- else -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.LAF`# 2+^.>! 当前模式\n.>h! `M 模式` .>h! `S 模式`\n\n! 0 ! M ! M\n! 1 ! M ! S\n!===\n<%- end -%>"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "SAM"
              bits: "6"
              desc: "*存储/AMO 地址未对齐*\n\n将存储/AMO 地址未对齐的异常委托给 (H)S 模式。\n<%- if ext?(:H) -%>\n存储/AMO 地址未对齐异常可能进一步委派给 VS 模式，如果 `hedeleg.SAM` 也置位。\n<%- end -%>\n\n异常永远不会进入更低特权级模式，无论`medeleg`如何。\n\n[when,\"MISALIGNED_LDST == true && MISALIGNED_AMO == true\"]\n注意，由于该实现支持未对齐的存储操作和未对齐的原子操作（或不支持原子操作），此异常将永远不会发生。\n即使如此，可写位也应予以保留。\n\n处理模式的确定方式如下：\n\n<%- if ext?(:H) -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.SAM`# .2+! [.rotate]#`hedeleg.SAM`# 4+^.>! 当前模式\n.>h! `M 模式` .>h! `HS 模式` .>h! `VS 模式` .>h! `VU 模式`\n\n! 0 ! 0 ! M ! M ! M ! M\n! 0 ! 1 ! M ! M ! M ! M\n! 1 ! 0 ! M ! HS ! HS ! HS\n! 1 ! 1 ! M ! HS ! VS ! VS\n!===\n<%- else -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.SAM`# 2+^.>! 当前模式\n.>h! `M 模式` .>h! `S 模式`\n\n! 0 ! M ! M\n! 1 ! M ! S\n!===\n<%- end -%>"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "SAF"
              bits: "7"
              desc: "*存储/AMO 访问故障*\n\n将 Store/AMO 访问故障异常委托给 (H)S 模式。\n<%- if ext?(:H) -%>\n存储/AMO 访问故障异常可能进一步委派给 VS 模式，如果 `hedeleg.SAM` 也置位。\n<%- end -%>\n\n异常永远不会进入更低特权级模式，无论`medeleg`如何。\n\n处理模式的确定方式如下：\n\n<%- if ext?(:H) -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.SAF`# .2+! [.rotate]#`hedeleg.SAF`# 4+^.>! 当前模式\n.>h! `M 模式` .>h! `HS 模式` .>h! `VS 模式` .>h! `VU 模式`\n\n! 0 ! 0 ! M ! M ! M ! M\n! 0 ! 1 ! M ! M ! M ! M\n! 1 ! 0 ! M ! HS ! HS ! HS\n! 1 ! 1 ! M ! HS ! VS ! VS\n!===\n<%- else -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.SAF`# 2+^.>! 当前模式\n.>h! `M 模式` .>h! `S 模式`\n\n! 0 ! M ! M\n! 1 ! M ! S\n!===\n<%- end -%>"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "EU"
              bits: "8"
              desc: "*来自 U 模式的环境调用*\n\n将 U 模式异常的环境调用委派给 (H)S 模式。\n<%- if ext?(:H) -%>\n来自 U 模式环境调用的异常可能进一步委派给 VS 模式，如果 `hedeleg.EU` 也置位。\n<%- end -%>\n\n异常永远不会进入更低特权级模式，无论`medeleg`如何。\n\n处理模式的确定方式如下：\n\n<%- if ext?(:H) -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.EU`# .2+! [.rotate]#`hedeleg.EU`# 4+^.>! 当前模式\n.>h! `M 模式` .>h! `HS 模式` .>h! `VS 模式` .>h! `VU 模式`\n\n! 0 ! 0 ! M ! M ! M ! M\n! 0 ! 1 ! M ! M ! M ! M\n! 1 ! 0 ! M ! HS ! HS ! HS\n! 1 ! 1 ! M ! HS ! VS ! VS\n!===\n<%- else -%>\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.EU`# 2+^.>! 当前模式\n.>h! `M 模式` .>h! `S 模式`\n\n! 0 ! M ! M\n! 1 ! M ! S\n!===\n<%- end -%>"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "ES"
              bits: "9"
              desc: "*来自 S 模式的环境调用*\n\n将 S 模式异常的环境调用委派给 (H)S 模式。\n<%- if ext?(:H) -%>\n来自 S 模式环境调用的异常 _不能委派给 VS 模式_。\n<%- end -%>\n\n异常永远不会进入更低特权级模式，无论`medeleg`如何。\n\n处理模式的确定方式如下：\n\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.ES`# 2+^.>! 当前模式\n.>h! `M 模式` .>h! `(H)S 模式`\n\n! 0 ! M ! M\n! 1 ! M ! (H)S\n!==="
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "EVS"
              bits: "10"
              desc: "*来自 VS 模式的环境调用*\n\n将 VS 模式异常的环境调用委派给 (H)S 模式。\n<%- if ext?(:H) -%>\n来自 S 模式环境调用的异常 _不能委派给 VS 模式_。\n<%- end -%>\n\n异常永远不会进入更低特权级模式，无论`medeleg`如何。\n\n处理模式的确定方式如下：\n\n[separator=\"!\",%autowidth, %footer]\n!===\n.2+! [.rotate]#`medeleg.EVS`# 2+^.>! 当前模式\n.>h! `M 模式` .>h! `(H)S 模式`\n\n! 0 ! M ! M\n! 1 ! M ! (H)S\n!==="
