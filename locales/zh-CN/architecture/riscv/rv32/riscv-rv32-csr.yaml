              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "vsireg6"
          desc: "虚拟监管者间接寄存器别名 6\n\n`vsireg6` 和 CSR 是一组用于间接访问 VS 模式或 VU 模式中虚拟监管者级 CSR 的别名寄存器。\n\n地址为`vsireg6`的寄存器由`vsiselect` CSR的当前值选择。\n\n别名机制允许间接 CSR 访问，有助于虚拟化及未来可扩展性。\n\n对于来自 VS 模式或 VU 模式的直接访问 `vsiselect` 或 `vsireg6`，或来自 VU 模式的访问 `siselect` 或 `siregX` 的尝试，将引发虚拟指令异常。\n\n当 `vsireg6` 的访问行为在 `vsiselect` 持有在 HS 级未实现的值时，其行为为 UNSPECIFIED。\n\n实现建议对未实现目标的此类访问引发非法指令异常。\n\n`vsireg6` 的宽度始终为当前的 `XLEN`，而非 `VSXLEN`。例如，若 `HSXLEN = 64` 和 `VSXLEN = 32`，则当从 HS 模式（RV64）访问时，`vsireg6` 的宽度为 64 位，当从 VS 模式（RV32）访问时，其宽度为 32 位。\n\n虚拟地址：599"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "间接选择寄存器值\n\n从当前 `vsiselect` 所选寄存器中读取或写入的数据。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "vsatp"
          desc: "虚拟地址翻译与保护监管者\n\n`vsatp` 寄存器是一个 VSXLEN 位的读/写寄存器，是监管者寄存器 `satp` 的 VS 模式版本。当 V=1 时，`vsatp` 代替通常的 `satp`，因此原本读取或修改 `satp` 的指令实际上访问 `vsatp`。`vsatp` 控制 VS 阶段的地址转换，即客户机虚拟地址两阶段地址转换的第一阶段。\n\n`vsatp` 寄存器在地址转换算法中被视为有效，除非有效特权模式为 U 且 `hstatus.HU`=0。然而，即使 `vsatp` 有效，由于推测执行导致的 VS 阶段页表条目 A 位也不得被置位，除非有效特权模式为 VS 或 VU。\n\n[NOTE]\n特别是，虚拟机加载/存储（`hlv`，'hlvx' 或 'hsv'）指令，这些指令在\n未对齐执行的指令不得导致 VS 阶段 A 位被置位。\n\n当 V=0 时，向 `vsatp` 写入一个不支持的 MODE 值的操作要么被忽略，如同对 `satp` 的操作一样，要么正常方式将 `vsatp` 的位域视为 WARL。然而，当 V=1 时，向 `satp` 写入一个不支持的 MODE 值的操作被忽略，且不会对 `vsatp` 发生写入。\n\n虚拟地址：384"
          fields:
            - name: "MODE"
              bits: "31"
              desc: "*翻译模式*\n\n根据下表控制 VS 模式中当前的翻译模式。\n\n[separator=\"!\",%autowidth]\n!===\n! 值 ! 名称 ! 描述\n\n! 0 ! 仅在寄存器中保留 a! 无翻译 -> 虚拟地址 == 物理地址\n<%- if ext?(:Sv39) -%>\n! 8 ! Sv39 ! 39-bit 虚拟地址转换\n<%- end -%>\n<%- if ext?(:Sv48) -%>\n! 9 ! Sv48 ! 48-bit 虚拟地址转换\n<%- end -%>\n<%- if ext?(:Sv57) -%>\n! 10 ! Sv57 ! 57-bit 虚拟地址转换\n<%- end -%>\n!===\n\n任何其他值在写入时将被忽略。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "ASID"
              bits: "30:22"
              desc: "*地址空间 ID*"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
            - name: "PPN"
              bits: "21:0"
              desc: "*物理页号*\n\n当前活动根页表的物理地址为 PPN << 12。\n\n只能持有对应有效页表基地址的值，该值将取决于实现。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "vl"
          desc: "向量长度\n\n持有无符号整数，指定需用向量指令结果更新的元素数量。"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "vl 寄存器持有无符号整数，指定需用向量指令结果更新的元素数量，具体细节参见章节 31.5.4。\n\n[NOTE]\nvl 中实现的位数取决于实现的最大向量长度\n最小支持类型长度。最小向量实现中 VLEN=32\n并且支持 SEW=8 需要至少六个比特在 vl 中持有值 0-32\n(VLEN=32，其中 LMUL=8 且 SEW=8，推出 VLMAX=32)。"
              reset_info: "Unified DB reset_value() 表达式： return (FOLLOW_VTYPE_RESET_RECOMMENDATION)? 0 : UNDEFINED_LEGAL;"
        - name: "vtype"
          desc: "向量类型\n\n提供用于解释向量寄存器文件内容的默认类型。"
          fields:
            - name: "VILL"
              bits: "31"
              desc: "vill 位用于编码此前的 vset{i}vl{i} 指令尝试将一个不支持的值写入 vtype。\n\n[NOTE]\nvill 位被置于 XLEN 到 1 位域的 CSR 中，以支持对非法值的检测。\n根据符号位分支。\n\n若 vill 位被置位，则任何尝试执行依赖于 vtype 的向量指令都将引发非法指令异常。\n\n当 vill 位被置位时，vtype 中的其他 XLEN-1 位应为零。\n\n建议在复位时，vill 被置位。"
              reset_info: "Unified DB reset_value() 表达式： return (FOLLOW_VTYPE_RESET_RECOMMENDATION)? 1 : UNDEFINED_LEGAL;"
            - name: "VMA"
              bits: "7"
              desc: "向量掩码无关位。修改向量指令执行过程中目标非活动的被掩码关闭元素的行为。\n\n0 的值表示无效元素保持不变，即向量寄存器组中对应的目标元素保留其先前持有的值。\n\n1 的值表示非活动元素是无关的，即任一向量目的操作数中对应的一组目的元素，要么保持其先前持有的值，要么被写入 1。在单条向量指令中，每个目的元素可以任选保持不变或被写入 1，组合方式任意，且当指令以相同输入执行时，未扰动或被写入 1 的模式无需是确定性的。\n\n建议在复位时，vill 被置位，vtype 中其余位域为零。"
              reset_info: "Unified DB reset_value() 表达式： return (FOLLOW_VTYPE_RESET_RECOMMENDATION)? 0 : UNDEFINED_LEGAL;"
            - name: "VTA"
              bits: "6"
              desc: "向量尾无关位。修改向量指令执行过程中目的尾元素的行为。\n\n0 的值表示尾部元素保持不变，即向量寄存器组中对应的目标元素保留其先前持有的值。\n\n1 的值表示尾部元素是无关的，即任一向量目的操作数中对应的目标元素要么保持其先前持有的值，要么被写入 1。在单条向量指令中，每个目的元素可以任选保持不变或被写入 1，组合方式任意，且当指令以相同输入执行时，未扰动或被写入 1 的模式无需是确定性的。\n\n建议在复位时，vill 被置位，vtype 中其余位域为零。"
              reset_info: "Unified DB reset_value() 表达式： return (FOLLOW_VTYPE_RESET_RECOMMENDATION)? 0 : UNDEFINED_LEGAL;"
            - name: "VSEW"
              bits: "5:3"
              desc: "vsew 中的值设置动态选定元素宽度（SEW）。\n\n[separator=\"!\"]\n!===\n! vsew[2:0] ! SEW ! 元素每向量寄存器\n! 000 ! 8 ! 16\n! 001 ! 16 ! 8\n! 010 ! 32 ! 4\n! 011 ! 64 ! 2\n! 1XX ! 保留 ! 保留\n!===\n\n建议在复位时，vill 被置位，vtype 中其余位域为零。"
              reset_info: "Unified DB reset_value() 表达式： return (FOLLOW_VTYPE_RESET_RECOMMENDATION)? 0 : UNDEFINED_LEGAL;"
            - name: "VLMUL"
              bits: "2:0"
              desc: "向量寄存器组乘法器。\n\n多个向量寄存器可以被分组在一起，使得单条向量指令能够对多个向量寄存器进行操作。本文中将“向量寄存器组”一词用于指代作为单个操作数被向量指令使用的一个或多个向量寄存器。向量寄存器组可用于提升对较长应用向量的执行效率，但其主要用途是允许双宽度或更宽的元素以与单宽度元素相同的向量长度进行操作。向量长度乘数 LMUL，在大于 1 时，表示默认组合成一个向量寄存器组的向量寄存器数量。实现必须支持 LMUL 个整数值，即 1、2、4 和 8。\n\n[NOTE]\n向量架构包含取多个源操作数和多个目的操作数的指令\n元素宽度不同的向量操作数，但元素数量相同。\n每个向量操作数的有效 LMUL (EMUL) 由寄存器的数量决定\n需持有元素。例如，对于扩展加法操作，如 add 32-\n产生 64-bit 结果的位值，双精度结果需要两倍的 LMUL。\n单精度宽度输入。\n\nLMUL 也可以为分数值，从而减少单个向量寄存器中使用的位数。分数 LMUL 用于在处理混合宽度值时增加有效可用向量寄存器组的数量。\n\n建议在复位时，vill 被置位，vtype 中其余位域为零。"
              reset_info: "Unified DB reset_value() 表达式： return (FOLLOW_VTYPE_RESET_RECOMMENDATION)? 0 : UNDEFINED_LEGAL;"
        - name: "vlenb"
          desc: "向量字节长度\n\n持有值 VLEN/8，表示向量寄存器的字节长度。"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "vlenb 位域中的值在任何实现中均为设计时常量。若无此 CSR，需使用若干条指令计算 VLEN（单位：字节），且代码必须干扰当前 vl 和 vtype 的设置，这要求将它们保存并恢复。"
              reset_info: "Unified DB reset_value() 表达式： return VLEN / 8;"
