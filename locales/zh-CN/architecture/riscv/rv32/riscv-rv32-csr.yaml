        - name: "mcycle"
          desc: "机器模式周期计数器\n\n统计运行hart的处理器核心执行的时钟周期数。该计数器在所有64-bit和RV32类型的hart上具有RV64精度。\n\n`mcycle` CSR 可能被同一核心中的多个 hart 共享，在此情况下对 `mcycle` 的写操作将对这些 hart 可见。平台应提供机制以指示哪些 hart 共享一个 `mcycle` CSR。"
          fields:
            - name: "COUNT"
              bits: "31:0"
              desc: "周期计数器。\n\n<%- if ext?(:Zicntr) -%>\n别名设为 `cycle.COUNT`。\n<%- end -%>\n\n每周期递增，除非：\n\n * `mcountinhibit.CY` <%- if ext?(:Smcdeleg) -%> 或其别名 `scountinhibit.CY` <%- end -%> 被置位\n <%- if ext?(:Smcntrpmf) -%>\n * `mcyclecfg.MINH` 被置位且当前特权级别为 M\n <%- if ext?(:S) -%>\n * `mcyclecfg.SINH` <%- if ext?(:Ssccfg) -%> 或其别名 `cyclecfg.SINH` <%- end -%> 被置位且当前特权级别为 (H)S\n <%- end -%>\n <%- if ext?(:U) -%>\n * `mcyclecfg.UINH` <%- if ext?(:Ssccfg) -%> 或其别名 `cyclecfg.UINH` <%- end -%> 被置位且当前特权级别为 U\n <%- end -%>\n <%- if ext?(:H) -%>\n * `mcyclecfg.VSINH` <%- if ext?(:Ssccfg) -%> 或其别名 `cyclecfg.VSINH` <%- end -%> 被置位且当前特权级别为 VS\n * `mcyclecfg.VUINH` <%- if ext?(:Ssccfg) -%> 或其别名 `cyclecfg.VUINH` <%- end -%> 被置位且当前特权级别为 VU\n <%- end -%>\n <%- end -%>\n\n别名：cycle.COUNT\n\n受影响的：Zicntr, Smcntrpmf, Smcdeleg, Ssccfg"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "minstret"
          desc: "机器模式指令退役计数器\n\n统计自某个任意起始点以来，本 hart 从该起始点起所退役的指令数。\n\n[NOTE]\n引起同步异常的指令，包括 `ecall` 和 `ebreak`，不予处理\n视为退役因而不递增 `minstret` CSR。"
          fields:
            - name: "COUNT"
              bits: "31:0"
              desc: "退役指令计数器。\n\n<%- if ext?(:Zicntr) -%>\n别名为 `instret.COUNT`。\n<%- end -%>\n\n每次指令退役时递增，除非：\n\n * `mcountinhibit.IR` <%- if ext?(:Smcdeleg) -%> 或其别名 `scountinhibit.IR` <%- end -%> 被置位\n <%- if ext?(:Smcntrpmf) -%>\n * `minstretcfg.MINH` 被置位且当前特权级别为 M\n <%- if ext?(:S) -%>\n * `minstretcfg.SINH` <%- if ext?(:Ssccfg) -%> 或其别名 `instretcfg.SINH` <%- end -%> 被置位且当前特权级别为 (H)S\n <%- end -%>\n <%- if ext?(:U) -%>\n * `minstretcfg.UINH` <%- if ext?(:Ssccfg) -%> 或其别名 `instretcfg.UINH` <%- end -%> 被置位且当前特权级别为 U\n <%- end -%>\n <%- if ext?(:H) -%>\n * `minstretcfg.VSINH` <%- if ext?(:Ssccfg) -%> 或其别名 `instretcfg.VSINH` <%- end -%> 被置位且当前特权级别为 VS\n * `minstretcfg.VUINH` <%- if ext?(:Ssccfg) -%> 或其别名 `instretcfg.VUINH` <%- end -%> 被置位且当前特权级别为 VU\n <%- end -%>\n <%- end -%>\n\n引起异常的指令，特别是包括 MRET/SRET 的指令，不会被退役，且不会导致 `minstret.COUNT` 计数器递增。\n\n受影响的：Zicntr, Smcntrpmf, Smcdeleg, Ssccfg"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "mhpmcounter3"
          desc: "机器模式硬件性能计数器 3\n\n可编程硬件性能计数器。\n\n`hpmcounter3` CSR 是本 CSR 的只读影子寄存器。对 `hpmcounter3` 的访问\n由 `mcounteren.HPM3` 控制\n<%- if ext?(:S) -%>\n, `scounteren.HPM3`\n<%- if ext?(:H) -%>\n，以及 `hcounteren.HPM3`\n<%- end -%>\n<%- end -%>\n如下：\n\n<%- if ext?(:H) -%>\n[%autowidth,cols=\"1,1,1,1,1,1,1\",separator=\"!\"]\n!===\n.2+h![.rotate]#`mcounteren.HPM3`# .2+h! [.rotate]#`scounteren.HPM3`# .2+h! [.rotate]#`hcounteren.HPM3`#\n4+^.>h! `hpmcounter3` 行为\n.^h! S 模式 .^h! U 模式 .^h! VS 模式 .^h! VU 模式\n\n! 0 ! - ! - ! `IllegalInstruction` ! `IllegalInstruction` ! `IllegalInstruction` ! `IllegalInstruction`\n! 1 ! 0 ! 0 ! 仅读 ! `IllegalInstruction` ! `VirtualInstruction` ! `VirtualInstruction`\n! 1 ! 1 ! 0 ! 仅读 ! 仅读 ! `VirtualInstruction` ! `VirtualInstruction`\n! 1 ! 0 ! 1 ! 仅读 ! `IllegalInstruction` ! 仅读 ! `VirtualInstruction`\n! 1 ! 1 ! 1 ! 仅读 ! 仅读 ! 仅读 ! 仅读\n!===\n<%- elsif ext?(:S) -%>\n[%autowidth,cols=\"1,1,1,1\",separator=\"!\"]\n!===\n.2+h![.rotate]#`mcounteren.HPM3`# .2+h! [.rotate]#`scounteren.HPM3`#\n2+^.>h! `hpmcounter3` 行为\n.^h! S 模式 .^h! U 模式\n\n! 0 ! - ! `IllegalInstruction` ! `IllegalInstruction`\n! 1 ! 0 ! 仅读 ! `IllegalInstruction`\n! 1 ! 1 ! 仅读 ! 仅读\n!===\n<%- else -%>\n[%autowidth,cols=\"1,1\",separator=\"!\"]\n!===\n.2+h![.rotate]#`mcounteren.HPM3`#\n^.>h! `hpmcounter3` 行为\n.^h! U 模式\n\n! 0 ! `IllegalInstruction`\n! 1 ! 仅读\n!===\n<%- end -%>"
          fields:
            - name: "COUNT"
              bits: "31:0"
              desc: "[when=\"HPM_COUNTER_EN[3] == true\"]\n--\n事件由 `mhpmevent3.EVENT` 选定的性能计数器。\n\n每次事件发生时递增，除非：\n\n * `mcountinhibit.HPM3` <%- if ext?(:Smcdeleg) -%> 或其别名 `scountinhibit.HPM3` <%- end -%> 被置位\n <%- if ext?(:Sscofpmf) -%>\n * `mhpmevent3.MINH` 被置位且当前特权级别为 M\n <%- if ext?(:S) -%>\n * `mhpmevent3.SINH` <%- if ext?(:Ssccfg) -%> 或其别名 `hpmevent3.SINH` <%- end -%> 被置位且当前特权级别为 (H)S\n <%- end -%>\n <%- if ext?(:U) -%>\n * `mhpmevent3.UINH` <%- if ext?(:Ssccfg) -%> 或其别名 `hpmevent3.UINH` <%- end -%> 被置位且当前特权级别为 U\n <%- end -%>\n <%- if ext?(:H) -%>\n * `mhpmevent3.VSINH` <%- if ext?(:Ssccfg) -%> 或其别名 `hpmevent3.VSINH` <%- end -%> 被置位且当前特权级别为 VS\n * `mhpmevent3.VUINH` <%- if ext?(:Ssccfg) -%> 或其别名 `hpmevent3.VUINH` <%- end -%> 被置位且当前特权级别为 VU\n <%- end -%>\n <%- end -%>\n--\n\n[when=\"HPM_COUNTER_EN[3] == false\"]\n未实现的性能计数器。必须为只读 0（访问不会引发陷阱）。"
              reset_info: "Unified DB reset_value() 表达式： return (HPM_COUNTER_EN[3]) ? UNDEFINED_LEGAL : 0;"
          condition: "全部满足： Sm，HPM_COUNTER_EN[3] == true"
