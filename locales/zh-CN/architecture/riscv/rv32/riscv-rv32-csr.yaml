    - name: "Indirect CSR Access"
      title: "间接 CSR 访问"
      access: "CSR 指令编码空间"
      desc: "RISC-V 32 位架构 CSR 定义：间接 CSR 访问。CSR 地址使用标准 CSR 编码空间，而非 MMIO 地址。"
      registers:
        - name: "siselect"
          desc: "监管者间接寄存器选择\n\n`siselect` 寄存器将至少支持值范围 0..0xFFF。未来扩展可能定义超出该最小范围的值范围。只有当此类扩展被实现时，`siselect` 才需要支持更大的值。\n\n要求为 `siselect` 提供 0-0xFFF 范围，即使该范围内的大部分或全部空间被保留或不可访问，也允许 M 模式间接模拟该实现范围内的寄存器，包括未来可能被标准化的寄存器。\n\n`siselect` 的值在最高位置位（位域 XLEN - 1 = 1）时仅用于定制用途， 可能用于通过别名 CSRs 访问定制寄存器。`siselect` 的值在最高位清零时仅用于标准用途，并保留至被分配给标准架构扩展之前。若 XLEN 发生改变，则 `siselect` 的最高位将移至新位置，并保留其先前的值。"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "间接寄存器选择值\n\n值范围被分配给依赖的扩展，以指定每个 `sireg*` 寄存器在每个 `siselect` 值下可访问的寄存器状态。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "sireg"
          desc: "监管者间接寄存器别名\n\n访问 `sireg` 从 M 模式或 S 模式而当 `siselect` 持有一个在标准定义且已实现范围内的数值时，将产生特定行为，对于每个 `siselect` 和 `sireg` 的组合，其行为由 `siselect` 值所分配的扩展决定。\n\n通常情况下，`sireg` 将访问寄存器状态，读取只读 0 状态，或在未在虚拟机中执行时引发非法指令异常。\n\n注意，`siselect` 和 `sireg` 的位宽始终为当前的 XLEN，而非 SXLEN。因此，例如，若 MXLEN = 64 且 SXLEN = 32，则当当前特权模式为 64（运行 M 指令）时，该寄存器为 RV64 位，而当特权模式为 32（运行 S 指令）时，该寄存器为 RV32 位。\n\n访问 `sireg` 从 M 模式或 S 模式发生时，而 `siselect` 持有在监管者模式下未实现的值，其行为为 UNSPECIFIED。\n\n建议实现对这类访问产生非法指令异常，以促进这些访问的可能仿真（由 M 模式实现）。\n\n例如，如果机器级别已通过 CSR `menvcfg` 中某些位域的设置禁用了 S 模式的该扩展，则该扩展被视为在监管者级别未实现。"
          fields:
            - name: "VALUE"
              bits: "31:0"
              desc: "间接选择寄存器值\n\n由当前 `siselect` 值选定的寄存器读取或写入的数据。"
              reset_info: "Unified DB 复位值： UNDEFINED_LEGAL"
        - name: "sireg2"
          desc: "监管者间接寄存器别名 2\n\n访问 `sireg2` 从 M 模式或 S 模式而当 `siselect` 持有一个在标准定义且已实现范围内的数值时，将产生特定行为，对于每个 `siselect` 和 `sireg2` 的组合，其行为由 `siselect` 值所分配的扩展决定。\n\n通常情况下，`sireg2` 将访问寄存器状态，读取只读 0 状态，或在未在虚拟机中执行时引发非法指令异常。\n\n注意，`siselect` 和 `sireg2` 的位宽始终为当前的 XLEN，而非 SXLEN。因此，例如，若 MXLEN = 64 且 SXLEN = 32，则当当前特权模式为 64（运行 M 指令）时，该寄存器为 RV64 位，而当特权模式为 32（运行 S 指令）时，该寄存器为 RV32 位。\n\n在访问 `sireg2` 从 M 模式或 S 模式时，若 `siselect` 持有在监管者模式下未实现的值，则行为为 UNSPECIFIED。\n\n建议实现对这类访问产生非法指令异常，以促进这些访问的可能仿真（由 M 模式实现）。\n\n例如，如果机器级别已通过 CSR `menvcfg` 中某些位域的设置禁用了 S 模式的该扩展，则该扩展被视为在监管者级别未实现。"
