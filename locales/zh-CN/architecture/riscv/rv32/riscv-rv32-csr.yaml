        - name: "mcounteren"
          desc: "机器模式计数器使能\n\n计数器使能 `mcounteren` 寄存器是一个 32-bit 寄存器，用于控制可用性\n硬件性能监控计数器到\n<%- if ext?(:S) -%>\nS 模式\n<%- elsif ext?(:U) -%>\nU 模式\n<%- else -%>\n下一低特权模式\n<%- end -%>\n.\n\n该寄存器中的设置仅控制可访问性。读取或写入该寄存器的操作不会影响底层计数器，计数器在不可访问时仍持续递增。\n\n当 CY、TM、IR 或 HPMn 位在 mcounteren 寄存器中为零时，尝试读取的\n`cycle`、`time`、`instret` 或 `hpmcountern` 寄存器在执行时\n<%- if ext?(:S) -%>\nS 模式\n<%- elsif ext?(:U) -%>\nU 模式\n<%- else -%>\nS 模式或 U 模式\n<%- end -%>\n将引发一个 `IllegalInstruction` 异常。当这些位中的任意一位被置位时，对寄存器的访问将触发该异常。\n相应的寄存器在...中允许\n<%- if ext?(:S) -%>\nS 模式\n<%- elsif ext?(:U) -%>\nU 模式\n<%- else -%>\n下一个实现的特权模式（若实现，则为 S 模式，否则为 U 模式）。\n<%- end -%>\n\n[NOTE]\n计数器使能位支持两种常见使用场景，且硬件开销极小。\n对于不需要高性能计时器和计数器的 hart，机器模式软件可以\n陷阱访问并以软件方式实现所有特性。对于需要高性能的 hart\n定时器和计数器，但不涉及混淆底层硬件计数器，\n计数器可直接暴露给较低特权模式。\n\n`cycle`、`instret` 和 `hpmcountern` 的 CSR 是 `mcycle`、`minstret` 的只读影子寄存器。\n和 `mhpmcounter n` 相应。`time` CSR 是内存映射的只读影子寄存器。\n`mtime` 寄存器。\n<%- if possible_xlens.include?(32) -%>\n类比地，在 RV32I 上的 `cycleh`、`instreth` 和 `hpmcounternh` 寄存器是\n`mcycleh`、`minstreth` 和 `mhpmcounternh` 的只读影子寄存器，分别对应。\n在 RV32I 中，`timeh` CSR 是一个只读的影子寄存器，其值对应于内存映射 `mtime` 的高 32 位。\n寄存器，而时间影子仅保留 `mtime` 的低位 32 位。\n<%- end -%>\n\n[NOTE]\n实现可以将 `time` 和 `timeh` 寄存器的读操作转换为对寄存器的加载操作到\n内存映射 `mtime` 寄存器，或代表较低特权级的实体模拟此功能\nM 模式软件中的模式。\n\n<%- if !ext?(:U) -%>\n在具有 U 模式的 hart 中，必须实现 `mcounteren` CSR，但所有位域均为 WARL 且可能\n为只读零，表示对相应计数器的读取将引发一个\n`IllegalInstruction` 异常在较低特权模式下执行时发生。\n在没有 U 模式的 hart 中，`mcounteren` 寄存器不应存在。\n<%- end -%>\n\n<%- if ext?(:S) -%>\n[INFO]\n`cycle`、`instret` 和 `hpmcountern` 的 CSR 也可提供给 U 模式\n通过 `scounteren` CSR\n<%- if ext?(:H) -%>\n以及 VS 模式和/或 VU 模式通过 `hcounteren`\n<%- end -%>\n.\n<%- end -%>"
          fields:
            - name: "CY"
              bits: "0"
              desc: "当置位时，`cycle` CSR（`mcycle`的别名）可被访问到\n<%- if ext?(:S) -%>\nS 模式。\n<%- else -%>\nU 模式。\n<%- end -%>\n\n<%- if ext?(:S) -%>\n当 `scounteren.CY` 也置位时，`cycle` 可进一步被 U 模式访问。\n<%- end -%>\n\n<%- if ext?(:H) -%>\n当 `hcounteren.CY` 也置位时，`cycle` 可进一步被 VS 模式访问。\n\n当 `hcounteren.CY` 且 `scounteren.CY` 均置位时，`cycle` 可进一步被 VU 模式访问。\n<%- end -%>"
              reset_info: "Unified DB reset_value() 表达式： if (MCOUNTENABLE_EN[0]) { return UNDEFINED_LEGAL; } else { return 0; }"
            - name: "TM"
              bits: "1"
              desc: "`time` 的占位符用于委派至权限较低的模式；然而，由于 `time` 是内存映射而非一个 CSR，该位域始终为只读零。"
            - name: "IR"
              bits: "2"
              desc: "当置位时，`instret` CSR（`minstret`的别名）可被访问到\n<%- if ext?(:S) -%>\nS 模式。\n<%- else -%>\nU 模式。\n<%- end -%>\n\n<%- if ext?(:S) -%>\n当 `scounteren.IR` 也置位时，`instret` 可进一步被 U 模式访问。\n<%- end -%>\n\n<%- if ext?(:H) -%>\n当 `hcounteren.IR` 也置位时，`instret` 可进一步被 VS 模式访问。\n\n当 `hcounteren.IR` 且 `scounteren.IR` 均置位时，`instret` 可进一步被 VU 模式访问。\n<%- end -%>"
              reset_info: "Unified DB reset_value() 表达式： if (MCOUNTENABLE_EN[2]) { return UNDEFINED_LEGAL; } else { return 0; }"
            - name: "HPM3"
