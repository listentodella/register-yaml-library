translations:
  sensor: "RK3588 DWC3 控制器"
  family: "DesignWare USB 3 双角色设备控制器"
  pages:
    - name: "MMIO"
      title: "内存映射寄存器（MMIO）"
      access: "32 位MMIO"
      registers:
        - name: "USB3OTG_GSBUSCFG0"
          desc: "全局 SoC 总线配置寄存器 0"
          fields:
            - name: "datrdreqinfo"
              bits: "31:28"
              desc: "AXI-用于数据读取的缓存(DatRdReqInfo)。"
            - name: "desrdreqinfo"
              bits: "27:24"
              desc: "AXI-用于描述符读取的缓存（DesRdReqInfo）。"
            - name: "datwrreqinfo"
              bits: "23:20"
              desc: "AXI-用于数据写入的缓存(DatWrReqInfo)。"
            - name: "deswrreqinfo"
              bits: "19:16"
              desc: "AXI-用于描述符写入的缓存（DesWrReqInfo）。"
            - name: "reserved_15_12"
              bits: "15:12"
              desc: "保留。"
            - name: "datbigend"
              bits: "11:11"
              desc: "该位控制数据访问的字节序模式。\n1'b0：小端（默认）\n1'b1：大端字节序"
            - name: "desbigend"
              bits: "10:10"
              desc: "该位控制描述符访问的字节序模式。\n1'b0：小端（默认）\n1'b1：大端字节序"
            - name: "reserved_9_8"
              bits: "9:8"
              desc: "保留。"
            - name: "incr256brstena"
              bits: "7:7"
              desc: "如果软件将该位设置为 1，则 AXI 主设备使用 INCR 进行 256 节拍突发。"
            - name: "incr128brstena"
              bits: "6:6"
              desc: "如果软件将该位设置为 1，则 AXI 主设备使用 INCR 进行 128 节拍突发。"
            - name: "incr64brstena"
              bits: "5:5"
              desc: "如果软件将该位设置为 1，AXI 主设备使用 INCR 进行 64beat 突发。"
            - name: "incr32brstena"
              bits: "4:4"
              desc: "如果软件将该位设置为 1，则 AXI 主设备使用 INCR 进行 32 节拍突发。"
            - name: "incr16brstena"
              bits: "3:3"
              desc: "如果软件将该位设置为 1，则 AXI 主设备使用 INCR 进行 16 节拍突发。"
            - name: "incr8brstena"
              bits: "2:2"
              desc: "如果软件将该位设置为 1，则 AXI 主设备使用 INCR 进行 8 节拍突发。"
            - name: "incr4brstena"
              bits: "1:1"
              desc: "启用该位后，控制器可以执行节拍长度为 1、2、3 和 4 的突发。强烈建议启用该位，以防止描述符读取和写入被分解为单独的传输。"
            - name: "incrbrstena"
              bits: "0:0"
              desc: "该位确定主接口使用的突发长度集。它与 GSBUSCFG0[7:1] 使能 (INCR256/128/64/32/16/8/4) 结合使用。 0：INCRX 突发模式 ARLEN/AWLEN 不使用 INCR。它们仅使用以下突发长度：\n4（如果 GSBUSCFG0.INCR4BrstEna = 1）； 8（如果 GSBUSCFG0.INCR8BrstEna = 1）； 16（如果 GSBUSCFG0.INCR16BrstEna = 1）； 32（如果 GSBUSCFG0.INCR32BrstEna = 1）； 64（如果 GSBUSCFG0.INCR64BrstEna = 1）； 128（如果 GSBUSCFG0.INCR128BrstEna = 1）； 256（如果 GSBUSCFG0.INCR256BrstEna = 1）； 1：INCR（未定义长度）突发模式； ARLEN/AWLEN 使用小于或等于 INCR4/8/16/32/64/128/256 最大启用突发长度的任意长度。对于缓存行对齐应用，该位通常设置为 0，以确保主接口仅使用 2 的幂突发长度（通过 GSBUSCFG0[7:0] 启用）。"
        - name: "USB3OTG_GSBUSCFG1"
          desc: "全局 SoC 总线配置寄存器 1"
          fields:
            - name: "reserved_31_13"
              bits: "31:13"
              desc: "保留。"
            - name: "en1kpage"
              bits: "12:12"
              desc: "1K 页边界启用。默认情况下（该位被禁用），AXI 在 4k 页边界处中断传输。当该位使能时，AXI 主设备（DMA 数据）在 1k 页边界处中断传输。"
            - name: "pipe_trans_limit"
              bits: "11:8"
              desc: "AXI 管道传输突发请求限制。该位域控制 AXI 主站推送到 AXI 从站的未完成管道传输请求的数量。当 AXI 主设备达到此限制时，它不会在 AXI、ARADDR 和 AWADDR 总线上发出任何更多请求，直到相关数据阶段完成。该位域编码如下：\n4'h0：1 个请求\n4'h1：2 个请求\n4'h2：3 个请求\n4'h3：4 个请求\n...\n4'hF：16 个请求"
            - name: "reserved_7_0"
              bits: "7:0"
              desc: "保留。"
        - name: "USB3OTG_GTXTHRCFG"
          desc: "全局 Tx 阈值控制寄存器"
          fields:
            - name: "reserved_31_30"
              bits: "31:30"
              desc: "保留。"
            - name: "USBTxPktCntSel"
              bits: "29:29"
              desc: "该位域启用/禁用 USB 传输多数据包阈值：\n1'b0：USB传输多包阈值禁用；只有在整个数据包被提取到相应的 TXFIFO 中后，内核才能开始在 USB 上传输。\n1'b1：USB 传输多包阈值启用。只有在 USB 传输数据包计数（USB 事务（突发）的数据包数量已在相应的 TXFIFO 中之后，内核才能在 USB 上开始传输。该模式仅在主机模式下有效。仅用于SuperSpeed。"
            - name: "reserved_28"
              bits: "28:28"
              desc: "保留。"
            - name: "USBTxPktCnt"
              bits: "27:24"
              desc: "该位域指定在核心可以开始传输相应的 USB 事务（突发）之前 TXFIFO 中必须存在的数据包数量。仅当 USB 发送数据包计数启用位域设置为 1 时，该位域才有效。有效值为 1 到 15。\n注意：此位域必须小于或等于 USB 最大 TX 突发大小位域。"
            - name: "USBMaxTxBurstSize"
              bits: "23:16"
              desc: "当 USBTxPktCntSel 为 1 时，该位域指定内核可以执行的最大批量 OUT 突发。当系统总线慢于 USB 时，TX FIFO 可能会在长突发期间欠载运行。您可以为此位域编程一个较小的值，以限制内核可以执行的 TX 突发大小。主机模式：仅适用于 SS 批量、同步和中断 OUT 端点。设备模式：该值在设备模式下不使用，但用户在使用 TX 阈值功能时需要编程一个值，以确保 USBTxPktCnt 中编程的值小于该值。有效值为 1 到 16。"
            - name: "reserved_15_0"
              bits: "15:0"
              desc: "保留。"
        - name: "USB3OTG_GRXTHRCFG"
          desc: "全局接收阈值控制寄存器"
          fields:
            - name: "reserved_31_30"
              bits: "31:30"
              desc: "保留。"
            - name: "usb_rx_pkt_cntsel"
              bits: "29:29"
              desc: "USB ReceivePacket 计数使能。该位域启用/禁用 USB 接收多数据包阈值：\n1'b0：当RX FIFO有至少一个数据包的空间时，核心才能在USB上开始接收。\n1'b1：不适用。如果您使用外部缓冲区控制 (EBC) 功能，请通过将 USBRxPktCntSel 设置为 0 来禁用此模式。"
            - name: "reserved_28_13"
              bits: "28:13"
              desc: "保留。"
            - name: "resvl_socout_spc"
              bits: "12:0"
              desc: "rx fifo 中为 ISOC OUT 保留的空间。在主机模式下，该位域不适用，必须编程为 0。在设备模式下，该值表示为 ISOC OUT 数据包保留的空间量。应选择要编程的值，以确保非 ISOC 数据包不会被完全丢弃。如果不需要为 ISOC OUT 数据包保留空间，请将该位域编程为 0。该位域仅在设备模式下有效。 rx fifo 的最大可配置深度为 8192。因此，该位域为 13 位宽。对于HS/FS，预留空间为实际值。"
        - name: "USB3OTG_GCTL"
          desc: "全局核心控制寄存器"
          fields:
            - name: "pwrdnscale"
              bits: "31:19"
              desc: "未应用。"
            - name: "masterfiltbypass"
              bits: "18:18"
              desc: "主滤波器旁路 当该位设置为 1'b1 时，所有滤波器均被旁路。过滤器之前的 mac clk 双同步器也被绕过。为了启用过滤器，该位必须是 1'b0。"
            - name: "bypassetaddr"
              bits: "17:17"
              desc: "在设备模式下绕过 SetAddress。当 BYPSSETADDR 位置位为 1 时，器件内核直接使用 DCFG[DevAddr] 位中的值来比较令牌中的器件地址。对于仿真，您可以使用此功能来避免在 USB 上发送实际的 SET ADDRESS 控制传输，并使设备内核响应新地址。\n注意：您只能出于模拟目的设置该位。在实际硬件中，该位必须设置为1'b0。"
            - name: "u2rstecn"
              bits: "16:16"
              desc: "如果该位设置为零，USB 2.0 复位上的设备控制器每次尝试检查接收器终止八次，如果该位设置为 1，则每次尝试仅检查一次。\n注：该位仅适用于设备模式。"
            - name: "frmscldwn"
              bits: "15:14"
              desc: "该位域缩小 SOF/USOF 持续时间的设备视图。对于 HS 模式：\n2'h3 的值实现间隔为 15.625 us 2'h2 的值实现间隔为 31.25 us 2'h1 的值实现间隔为 62.5 us 2'h0 的值实现间隔为 125us 对于 FS 模式，按比例缩小值乘以 8。该位域还会缩小 IN 和 OUT 批量端点的 MaxPacketSize，以在模拟期间允许更多流量。它只能在仿真期间从非零值更改。\n2'h0：1024字节\n2'h1：512字节\n2'h2：256字节\n2'h3：128字节"
            - name: "prtcapdir"
              bits: "13:12"
              desc: "PRTCAPDIR：端口能力方向（PrtCapDir）\n2'b01：用于主机配置\n2'b10：对于设备配置 SW 应基于 IDDIG 输入将 USB 控制器设置为 OTG\n2.0 设备有 A 设备或 B 设备。"
            - name: "coresoftreset"
              bits: "11:11"
              desc: "内核软复位（CoreSoftReset）\n1'b0：无软复位；\n1'b1：使内核软复位。 清除中断和所有 CSR（以下寄存器除外）：\nGCTL； GUCTL； GSTS; GSNPSID； GGPIO； GUID； GUSB2PHYCFGn寄存器； GUSB3PIPECTLn寄存器； DCFG； DCTL； DEVTEN； DSTS。"
            - name: "sofitpsync"
              bits: "10:10"
              desc: "未应用。"
            - name: "u1u2_timescale"
              bits: "9:9"
              desc: "未应用。"
            - name: "debugattach"
              bits: "8:8"
              desc: "调试附加。未应用。"
            - name: "ramclksel"
              bits: "7:6"
              desc: "RAM 时钟选择 (RAMClkSel)\n2'b00：总线时钟\n2'b01：管道时钟（仅在设备模式下使用）\n2'b10：设备模式下，管道/2时钟。在主机模式下，控制器根据 U2 端口的状态在 pipeline/2 时钟、mac2_clk 和 bus_clk 之间切换 ram_clk\n2'b11：在设备模式下，选择mac2_clk为ram_clk（当使用8 位UTMI或ULPI时。16 位UTMI模式不支持）；在主机模式下，控制器根据 U2 端口的状态在 pipe_clk、mac2_clk 和 bus_clk 之间切换 ram_clk。在设备模式下，在 USB 复位和 USB 断开连接时，硬件将这些位清除为 2'b00。"
            - name: "scaledown"
              bits: "5:4"
              desc: "缩小模式 (ScaleDown) 当启用缩小模式进行仿真时，内核使用缩小的时序值，从而加快仿真速度。禁用按比例缩小模式时，将使用实际时序值。这是硬件操作所必需的。 HS/FS/LS 模式：\n2'b00：禁用所有缩小。使用实际计时值。\n2'b01：启用除设备模式挂起和恢复之外的所有时序值的按比例缩小。其中包括速度枚举、HNP/SRP 以及主机模式挂起和恢复\n2'b10：仅启用设备模式挂起和恢复时序值的按比例缩小。\n2'b11：启用位 0 和位 1 缩小时序值。"
            - name: "disscramble"
              bits: "3:3"
              desc: "禁用加扰 (DisScramble) 在下次转换到恢复或轮询时将请求传输到链路伙伴。"
            - name: "u2exit_lfps"
              bits: "2:2"
              desc: "如果该位是：\n1'b0：链接将 248ns LFPS 视为有效的 U2 退出。\n1'b1：链路等待 8us 的 LFPS，然后才检测到有效的 U2 退出。添加该位是为了提高与第三方主机控制器的互操作性。该主机控制器在执行接收器检测时处于 U2 状态，会生成持续时间约为 4ms 的 LFPS 毛刺。这会导致器件退出 U2 状态，因为 LFPS 滤波器值为 248ns。启用新功能后，设备可以保持在 U2，同时忽略主机控制器的此故障。"
            - name: "gbl_hibernation_en"
              bits: "1:1"
              desc: "该位启用全局级别的休眠。如果未通过该位使能休眠，则 PMU 立即接受 D0->D3 和 D3->D0 电源状态更改请求，但不保存或恢复任何内核状态。此外，PMU 从不驱动 PHY 接口，而让内核继续驱动 PHY 接口。"
            - name: "dsblclkgtng"
              bits: "0:0"
              desc: "禁用时钟门控。该位设置为 1，内核处于低功耗模式，内部时钟门控被禁用。上电复位后，您可以将该位设置为 1'b1。"
        - name: "USB3OTG_GSTS"
          desc: "全局状态寄存器"
          fields:
            - name: "cbelt"
              bits: "31:20"
              desc: "当前 BELT 值。在主机模式下，该位域指示所有接收到的设备 BELT 值和通过设置延迟容差值命令设置的 BELT 值的最小值。"
            - name: "reserved_19_12"
              bits: "19:12"
              desc: "保留。"
            - name: "SSIC_IP"
              bits: "11:11"
              desc: "未应用。"
            - name: "OTG_IP"
              bits: "10:10"
              desc: "OTG 中断待处理。该位域指示 OEVT 寄存器中存在与 OTG 相关的待处理中断。"
            - name: "bc_ip"
              bits: "9:9"
              desc: "电池充电器中断挂起 该位域指示 BCEVT 寄存器中存在与 BC 相关的挂起中断。"
            - name: "adp_ip"
              bits: "8:8"
              desc: "ADP 中断待处理。该位域指示 ADPEVT 寄存器中存在与 ADP 相关的待处理中断。"
            - name: "host_ip"
              bits: "7:7"
              desc: "主机中断待处理。该位域表示主机事件队列中存在与 xHC 相关的待处理中断。"
            - name: "device_ip"
              bits: "6:6"
              desc: "设备中断挂起 该位域表示设备事件队列中存在与外设（设备）操作相关的挂起中断。"
            - name: "csr_timeout"
              bits: "5:5"
              desc: "当该位为 1'b1 时，表示软件对内核寄存器执行了写入或读取，但该写入或读取无法在 DWC_USB3_CSR_ACCESS_TIMEOUT 总线时钟周期内完成（默认值：h1FFFF）。"
            - name: "buserraddrvld"
              bits: "4:4"
              desc: "us 错误地址有效 表示 GBUSERRADDR 寄存器有效，并报告遇到总线错误的第一个总线地址。"
            - name: "reserved_3_2"
              bits: "3:2"
              desc: "保留。"
            - name: "curmod"
              bits: "1:0"
              desc: "当前的操作模式。"
        - name: "USB3OTG_GUCTL1"
          desc: "全局用户控制寄存器1"
          fields:
            - name: "reserved_31_30"
              bits: "31:30"
              desc: "保留。"
            - name: "filter_se0_fsls_eop"
              bits: "29:29"
              desc: "1'b0：默认行为，FS/LS 中 SE0 检测的线路状态检查没有变化。\n1'b1：功能启用，FS/LS SE0 被过滤 2 个时钟以检测 EOP。该位适用于 FS/LS 操作。如果启用此功能，则 Linestate 上的 SE0 将针对 2 个连续 utmi/ulpi 时钟边沿进行验证，以进行 EOP 检测。此功能仅适用于设备模式下的 FS 和主机模式下的 FS/LS 操作模式。设备模式：FS - 如果设置了 GUCTL1.FILTER_SE0_FSLS_EOP，则对于设备 LPM 握手，内核将在传输期间忽略 Linestate 上的单个 SE0 毛刺。 FS 上只有 2 个或更多 SE0 才被视为有效的 EOP。主机模式：FS/LS - 如果设置了 GUCTL1.FILTER_SE0_FSLS_EOP，则内核将在传输期间忽略 Linestate 上的单个 SE0 毛刺。 FS/LS 端口上只有 2 个或更多 SE0 被视为有效的 EOP。如果 Linestate 在传输过程中出现 SE0 故障，请启用此功能。该位是准静态位，i.e.，不应在器件操作期间更改。"
            - name: "tx_ipgap_linecheck_dis"
              bits: "28:28"
              desc: "1'b0：默认行为，线路状态检查没有变化。\n1'b1：功能启用，2.0 MAC 在 HS 传输期间禁用线路状态检查。该位适用于 u2mac 的 HS 操作。如果启用此功能，则在 HS 中运行的 2.0 mac 在传输令牌期间（在令牌到令牌和令牌到数据 IPGAP 期间）将忽略 UTMI/ULPI 线路状态。启用后，控制器在 UTMI 上给出数据包后实现固定的 40 位 TxEndDelay，并在此期间忽略线路状态。此功能仅适用于 HS 操作模式。设备模式：如果设置了 GUCTL1.TX_IPGAP_LINECHECK_DIS，则对于设备 LPM 握手，内核将忽略 TX 之后的 Linestate，并在 utmi 上传输 ACK 后等待固定时钟（40 位时间等效）。主机模式：如果设置了 GUCTL1.TX_IPGAP_LINECHECK_DIS，则（tkn 到 tkn/数据）之间的 ipgap 加上 TXENDDELAY 的 40 位时间，并且在这 40 位时间延迟期间忽略线路状态。如果 LineState 在传输期间无法反映预期的线路状态 (J)，则启用该位。该位是准静态的，i.e.，在器件操作期间不应更改。"
            - name: "dev_trb_out_spr_ind"
              bits: "27:27"
              desc: "1'b0：默认行为，TRB 状态双字没有变化。\n1'b1：功能使能，OUT TRB状态指示短数据包。该位仅适用于设备模式（在主机模式下被忽略）。如果设备应用程序（SW/HW）想要知道是否在 TRB 状态下收到了 OUT 的短数据包，则可以启用此功能，以便在 buf_size 双字中的 TRB 写回中设置一个位。位 [26] - trbstatus 的 SPR、RSVD、SPR、PCM1、bufsize 双字将在 OUT 传输期间设置 TRB 回写（如果这是用于该传输的最后一个 TRB）描述符。该位是准静态的，i.e.，不应在器件操作期间更改。"
            - name: "dve_force_20clk_for_30clk"
              bits: "26:26"
              desc: "未应用。"
            - name: "p3_in_u2"
              bits: "25:25"
              desc: "未应用。"
            - name: "dev_l1_exit_by_hw"
              bits: "24:24"
              desc: "1'b0：默认行为，禁用设备 L1 硬件退出逻辑。\n1'b1：功能已启用 该位仅适用于设备模式 (2.0)。如果设备在 L1 状态下准备好发送/接受数据，则该位域使设备控制器能够为 L1 发送远程唤醒。如果主机在进入流控状态 L1 后希望设备发送远程 wkp 信号来恢复，则可以设置该位以在设备控制器准备就绪时自动发送远程唤醒信号。 HW 远程唤醒功能仅适用于批量和中断传输，不适用于 Isoch/Control 当控制传输正在进行时，LPM 将被拒绝（NYET 响应）。只有在控制传输完成后（无论是 ACK/STALL），LPM 才会被接受。 对于 Isoch 传输，主机需要唤醒并开始传输。当 Isoch 端点准备好时，设备控制器不会执行远程唤醒。器件 SW 需要保持 GUSB2PHYCFG[EnblSlpM] 复位，以保持 PHY 时钟运行以跟踪 SOF 间隔。当 L1 休眠启用时，控制器不会对通过 L1 的休眠请求自动退出。该位是准静态位 i.e.，不应在器件操作期间更改。"
            - name: "ip_gap_add_on"
              bits: "23:21"
              desc: "该寄存器位域用于添加 USB 2.0 MAC 中的默认数据包间间隙设置。"
            - name: "dev_lsp_tail_lock_dis"
              bits: "20:20"
              desc: "1'b0：默认行为，为尾 TRB 更新启用设备 lsp 锁定逻辑。\n1'b1：修复已禁用 这是 STAR 9000716195 的错误修复，影响设备模式下 OUT 端点的 CSP 模式。问题在于尾部 TRB 索引与缓存暂存器字节计数更新不同步。如果快进请求介于新获取的 TRB 上的字节计数更新和 TPF 中的尾部索引写入更新之间，则 RDP 会处理不正确的尾部索引，并在快进过程中错过新获取的 TRB 的字节计数递减。此修复需要始终存在。"
            - name: "nak_per_enh_fs"
              bits: "19:19"
              desc: "1'b1：在存在 NAK 的情况下启用 FS 异步端点的性能增强。\n1'b0：未应用增强。如果存在周期性端点，并且设备正在否认同样处于活动状态的批量端点，则这可能会导致设备确认的其他全速批量端点的性能下降。将此位设置为 1，将使主机控制器能够将更多事务安排到异步端点（批量/控制），从而提高批量端点的性能。仅当默认设置的现有性能不足以满足您的 FullSpeed 应用程序时，才应启用此控制位；设置该位仅用于控制，并且仅在全速传输时需要。"
            - name: "nak_per_enh_hs"
              bits: "18:18"
              desc: "1'b1：在存在 NAK 的情况下启用 HS 异步端点的性能增强。\n1'b0：未应用增强。如果存在周期性端点，并且设备正在否认同样处于活动状态的批量端点，则这可能会导致设备确认的其他高速批量端点的性能下降。将此位设置为 1，将使主机控制器能够将更多事务安排到异步端点（批量/控制），从而提高批量端点的性能。仅当默认设置的现有性能不足以满足您的 HighSpeed 应用程序时，才应启用此控制位；设置该位仅用于控制，并且仅在高速传输时才需要。"
            - name: "parkmode_disbale_ss"
              bits: "17:17"
              desc: "未应用。"
            - name: "parkmode_disable_hs"
              bits: "16:16"
              desc: "该位仅在主机模式下使用。当该位设置为 1 时，所有 HS 总线实例停放模式均被禁用。为了提高停放模式下的性能，xHCI 调度程序在三个请求中排队，每个请求有 4 个数据包，每个请求针对微帧中的高速异步端点。但如果设备速度较慢并且 NAK 次数超过 3 次，则仅在下一个微帧中重新调度。这可能会进一步降低慢速设备的性能。在一些高速设备中（例如 Sandisk Cruzer Blade 4GB VID: 1921、PID: 21863 和 Flex Drive VID: 3744、PID: 8552），当 IN 请求在 900ns 内发送时，前面的数据包为 ACK，这些设备发送了 NAK。连接到这些设备时，如果您发现系统性能下降，如果需要，该软件可以禁用停放模式。当禁用停放模式时，多个数据包的流水线操作将被禁用，而是由调度程序一次请求一个数据包。这允许微帧中最多有 12 个 NAK，并提高了这些慢速设备的性能。"
            - name: "parkmod_disavale_fsls"
              bits: "15:15"
              desc: "该位仅在主机模式下使用，并且仅用于调试目的。当该位设置为 1 时，暂停模式下的所有 FS/LS 总线实例均被禁用。"
            - name: "reserved_14_9"
              bits: "14:9"
              desc: "保留。"
            - name: "l1_susp_thrld_en_for_host"
              bits: "8:8"
              desc: "该位仅在主机模式下使用。主机控制器断言 utmi_l1_suspend_n 和 utmi_sleep_n 输出信号（请参阅数据手册中的 LPM 接口信号表），如下所示：\n当以下两个条件都成立时，控制器置位 utmi_l1_suspend_n 信号，将 PHY 置于 L1 的深度低功耗模式：\n使用的HIRD/BESL值大于或等于L1_SUSP_THRLD_FOR_HOST位域中的值。 L1_SUSP_THRLD_EN_FOR_HOST 位设置为 1'b1。当以下任一情况为真时，控制器在 L1 上置位 utmi_sleep_n：\n使用的HIRD/BESL值小于L1_SUSP_THRLD_FOR_HOST位域中的值。 L1_SUSP_THRLD_EN_FOR_HOST 位设置为 1'b0。"
            - name: "l1_susp_thrld_for_host"
              bits: "7:4"
              desc: "仅当 L1_SUSP_THRLD_EN_FOR_HOST 位设置为 1 时，该位域才有效。更多详细信息，请参见 L1_SUSP_THRLD_EN_FOR_HOST 位的说明。"
            - name: "hc_errata_enable"
              bits: "3:3"
              desc: "未应用。"
            - name: "hc_parchk_disable"
              bits: "2:2"
              desc: "主机参数检查禁用。当该位设置为 0（默认情况下）时，xHC 检查输入槽/EP 上下文位域是否符合 xHCI 规范。在命令执行期间检测到参数错误时，xHC 会生成事件 TRB，其完成代码指示 PARAMETER ERROR。当该位设置为 1 时，xHC 不执行参数检查，也不生成 PARAMETER ERROR 完成代码。"
            - name: "ovrld_l1_susp_com"
              bits: "1:1"
              desc: "如果该位置位，则 utmi_l1_suspend_com_n 信号将导致 utmi_sleep_n 过载。如果 PHY 在 L1 睡眠条件期间停止端口时钟，则通常会设置该位。"
            - name: "loa_filter_en"
              bits: "0:0"
              desc: "如果该位被设置，则在禁用端口之前至少连续检查三次 USB 2.0 端口杂音。这可以防止在使用低质量电缆时误触发乱码情况。\n注：该位仅在主机模式下有效。"
        - name: "USB3OTG_GSNPSID"
          desc: "全局 SNPS ID 寄存器"
          fields:
            - name: "snpsid"
              bits: "31:0"
              desc: "SNPSID[31:16]表示核心识别号。 0x5533 是 ASCII 对于 U3 (DWC_usb3)。 SNPSID[15:0]表示版本号。当前版本是\n3.00a。软件使用该寄存器来配置驱动程序中特定于版本的功能。"
        - name: "USB3OTG_GGPIO"
          desc: "全局通用输入/输出寄存器"
          fields:
            - name: "gpo"
              bits: "31:16"
              desc: "通用输出 该位域的值在 gp_out[15:0] 内核输出端口上输出。"
            - name: "gpi"
              bits: "15:0"
              desc: "通用输入 该位域的读取值反映 gp_in[15:0] 内核输入值。"
        - name: "USB3OTG_GUID"
          desc: "全局用户 ID 寄存器"
          fields:
            - name: "userid"
              bits: "31:0"
              desc: "应用程序可编程 ID 位域。"
        - name: "USB3OTG_GUCTL"
          desc: "全局用户控制寄存器"
          fields:
            - name: "refclkper"
              bits: "31:22"
              desc: "该位域以纳秒为单位指示 ref_clk 的周期。该寄存器的默认值设置为“h8 (8ns/125 MHz)”。如果 GCTL.SOFITPSYNC 或 GFLADJ.GFLADJ_REFCLK_LPM_SEL 设置为\n1. 可编程最大值为62ns，最小值为8ns。必须使用周期为整数倍的参考时钟，这样ITP才能满足32ns的抖动裕度。 ref_clk 允许的周期不是整数倍的频率为 16/17/19.2/24/39.7MHz。该位域任何时候都不能设置为 0。如果您从不打算使用此功能，请将此位域设置为默认值“h8”。"
            - name: "no_extr_di"
              bits: "21:21"
              desc: "SOF 和第一个之间没有额外的延迟。当主机在 SOF 之后立即发送数据包时，某些 HS 设备会出现异常行为。但是，在 SOF 和第一个数据包之间添加额外的延迟可能会降低 USB 的数据速率和性能。该位用于控制主机是否必须等待 2 微秒才能发送 SOF 后的第一个数据包。如果这些有问题的设备在用户的主机环境中不是问题，用户可以将该位设置为 1 以提高性能。\n1'b0：主机在 SOF 之后等待 2 微秒，然后再发送第一个 USB 数据包。\n1'b1：主机在发送第一个 USB 数据包之前不会在 SOF 之后等待。"
            - name: "reserved_20_18"
              bits: "20:18"
              desc: "保留。"
            - name: "sprs_ctrl_trans_en"
              bits: "17:17"
              desc: "稀疏控制事务启用。某些设备对控制传输的响应速度很慢。在一个微帧/帧中安排多个事务可能会导致这些设备行为异常。如果该位设置为 1'b1，则主机控制器在不同的微帧/帧中调度控制传输的事务。"
            - name: "res_bw_hs_esp"
              bits: "16:16"
              desc: "为HS周期EP保留85%带宽。默认情况下，HC 为周期性EP 保留80%的带宽。如果设置该位，则带宽放宽至 85%，以容纳两个高速、高带宽 ISOC EP。 USB 2.0 需要为 ISOC 流量分配 80% 的带宽。如果连接两个高带宽 ISOC 设备（HD 网络摄像头），并且每个微帧需要 1024 字节 X 3 数据包，则所需带宽约为 82%。如果设置了该位，则可以连接两个每个微帧 1024 字节 X 3 有效负载的网络摄像头。否则，您可能必须降低网络摄像头的分辨率。该位在主机和 DRD 配置中有效，并且仅在主机模式操作中使用。在设备模式下忽略该位。"
            - name: "cm_dev_addr"
              bits: "15:15"
              desc: "设备地址的合规模式。当该位为 1'b1 时，如果 max_slot_enabled < 128，则插槽 ID 的值可能与设备地址不同。\n1'b1：在每个地址设备命令上递增设备地址。\n1'b0：设备地址等于插槽 ID。 xHCI 合规性要求将该位设置为 1。0 模式仅用于调试目的。这使您可以在硬件调试期间轻松识别连接到 Lecroy 或 Eliisys 跟踪中的端口的设备。该位在主机和 DRD 配置中有效，并且仅在主机模式操作中使用。在设备模式下忽略该位。"
            - name: "usb_host_in_auto_retry_en"
              bits: "14:14"
              desc: "主机IN自动重试。\n1'b0：自动重试已禁用\n1'b1：自动重试已启用\n注：该位也适用于设备模式。"
            - name: "en_overlap_chk"
              bits: "13:13"
              desc: "未应用。"
            - name: "ext_cap_suppt_en"
              bits: "12:12"
              desc: "外部扩展功能支持启用 当设置时，该位域允许在内核外部实现扩展功能。当 ExtCapSupEN 被置位并且调试能力使能时，调试能力中的下一个能力指针返回\n16. 读取最后一个内部扩展功能的第一个 DWORD（当调试功能未启用时，“xHCI 支持的 USB 3.0 的协议功能”）在下一个功能指针位域中返回值 4。这向软件表明在该功能之后还有四个 DWORD 的另一个功能（例如，在地址 N+16 处，其中 N 是该 DWORD 的地址）。如果启用，则必须实现监听 xHC 从接口的外部地址解码器。如果它看到对 N+16 或更大的访问，则从属访问将重新路由到一个硬件，该硬件返回新功能的外部功能指针寄存器，并处理对此新功能的读/写和副作用。如果禁用，则读取最后一个内部扩展功能的第一个 DWORD 将在“下一个功能指针”位域中返回 0。这表明没有更多的能力。"
            - name: "insrt_extr_fsbodi"
              bits: "11:11"
              desc: "在 FS 批量 OUT 之间插入额外延迟。某些 FS 设备接收批量 OUT 数据的速度很慢，并且在存在事务间延迟较短的连续批量 OUT 事务时可能会卡住。该位用于控制主机是否在到 FS 端点的连续批量 OUT 事务之间插入额外延迟。\n1'b0：主机不会在到 FS 端点的连续批量 OUT 事务之间插入额外的延迟。\n1'b1：主机在到 FS 端点的连续批量 OUT 事务之间插入约 12us 的额外延迟，以解决设备问题。\n注：将此位设置为 1 将降低大多数 FS 器件的批量 OUT 传输性能。"
            - name: "dtct"
              bits: "10:9"
              desc: "设备超时粗调。该位域是主机模式参数，用于确定主机在考虑超时之前等待设备响应的时间。内核首先检查DTCT值。如果为0，则超时值由DTFT定义。如果它非零，则它使用以下超时值：\n2'b00：0 usec -> 使用 DTFT 值代替\n2'b01：500微秒\n2'b10：1.5毫秒\n2'b11：6.5 毫秒"
            - name: "ctft"
              bits: "8:0"
              desc: "设备超时微调。该位域是主机模式参数，用于确定主机在考虑超时之前等待设备响应的时间。为了使DTFT位域生效，DTCT必须设置为2'b00。 DTFT 值是在考虑设备超时之前要计数的 125 MHz 时钟数 * 256。 DTFT 的最小值为 2。例如，如果 mac3_clk 为 125 MHz clk（8 ns 周期），则计算如下：\n（DTFT 值）* 256 * (8 ns) 快速参考：\n如果 DTFT = 0x2, 2*256*8 = 4usec 超时 如果 DTFT = 0x5, 5*256*8 = 10usec 超时 如果 DTFT = 0xA, 10*256*8 = 20usec 超时 如果 DTFT = 0x10、16*256*8 = 32usec 超时（如果 DTFT = 0x19）、25*256*8 = 51usec 超时（如果 DTFT = 0x31）、49*256*8 = 100usec 超时（如果 DTFT = 0x62）、 98*256*8 = 200 微秒超时"
        - name: "USB3OTG_GBUSERRADDRLO"
          desc: "全局 SoC 总线错误地址寄存器 - 低"
          fields:
            - name: "buserraddr"
              bits: "31:0"
              desc: "总线地址 - 低。该寄存器包含遇到 SoC 总线错误的第一个总线地址的低 32 位。当GSTS.BusErrAddrVld位域为1时有效。只能通过复位内核来清除。\n注意：仅在 AHB 和 AXI 配置中受支持。"
        - name: "USB3OTG_GBUSERRADDRHI"
          desc: "全局 SoC 总线错误地址寄存器 - 高"
          fields:
            - name: "buserraddr"
              bits: "31:0"
              desc: "总线地址 - 高。该寄存器包含遇到 SoC 总线错误的第一个总线地址的高 32 位。当GSTS.BusErrAddrVld位域为1时有效。只能通过复位内核来清除。\n注意：仅在 AHB 和 AXI 配置中受支持。"
        - name: "USB3OTG_GPRTBIMAPLO"
          desc: "全局 SS 端口到总线实例映射寄存器"
          fields:
            - name: "reserved_31_4"
              bits: "31:4"
              desc: "保留。"
            - name: "BINUM1"
              bits: "3:0"
              desc: "SS USB 端口 1 应用程序可编程 ID 位域的实例编号。"
        - name: "USB3OTG_GHWPARAMS0"
          desc: "全局硬件参数寄存器0"
          fields:
            - name: "ghwparams0"
              bits: "31:0"
              desc: "全局硬件参数寄存器 0。"
        - name: "USB3OTG_GHWPARAMS1"
          desc: "全局硬件参数寄存器1"
          fields:
            - name: "ghwparams1"
              bits: "31:0"
              desc: "全局硬件参数寄存器 1。"
        - name: "USB3OTG_GHWPARAMS2"
          desc: "全局硬件参数寄存器2"
          fields:
            - name: "ghwparams2"
              bits: "31:0"
              desc: "全局硬件参数寄存器 2。"
        - name: "USB3OTG_GHWPARAMS3"
          desc: "全局硬件参数寄存器3"
          fields:
            - name: "ghwparams3"
              bits: "31:0"
              desc: "全局硬件参数寄存器 3。"
        - name: "USB3OTG_GHWPARAMS4"
          desc: "全局硬件参数寄存器4"
          fields:
            - name: "ghwparams4"
              bits: "31:0"
              desc: "全局硬件参数寄存器 4。"
        - name: "USB3OTG_GHWPARAMS5"
          desc: "全局硬件参数寄存器5"
          fields:
            - name: "ghwparams5"
              bits: "31:0"
              desc: "全局硬件参数寄存器 5。"
        - name: "USB3OTG_GHWPARAMS6"
          desc: "全局硬件参数寄存器 6"
          fields:
            - name: "ghwparams6"
              bits: "31:0"
              desc: "全局硬件参数寄存器 6。"
        - name: "USB3OTG_GHWPARAMS7"
          desc: "全局硬件参数寄存器 7"
          fields:
            - name: "ghwparams7"
              bits: "31:0"
              desc: "全局硬件参数寄存器 7。"
        - name: "USB3OTG_GDBGFIFOSPACE"
          desc: "全局调试队列/FIFO 空间可用寄存器"
          fields:
            - name: "space_available"
              bits: "31:16"
              desc: "可用空间。"
            - name: "reserved_15_9"
              bits: "15:9"
              desc: "保留。"
            - name: "fifo_queue_select"
              bits: "8:0"
              desc: "FIFO/队列选择（或）端口选择。 FIFO/队列选择[8:5]表示FIFO/队列类型。 FIFO/队列选择[4:0]表示FIFO/队列号。 Port-Select[3:0]在访问GDBGLTSSM寄存器时选择端口号。"
        - name: "USB3OTG_GDBGLNMCC"
          desc: "全局调试 LNMCC 寄存器"
          fields:
            - name: "reserved_31_9"
              bits: "31:9"
              desc: "保留。"
            - name: "lnmcc_berc"
              bits: "8:0"
              desc: "该位域指示GDBGFIFOSPACE.PortSelect位域中选择的端口的误码率信息。该位域仅用于调试目的。"
        - name: "USB3OTG_GDBGBMU"
          desc: "全局调试 BMU 寄存器"
          fields:
            - name: "bmu_bcu"
              bits: "31:8"
              desc: "BMU_BCU 调试信息。"
            - name: "bmu_dcu"
              bits: "7:4"
              desc: "BMU_DCU 调试信息。"
            - name: "bmu_ccu"
              bits: "3:0"
              desc: "BMU_CCU 调试信息。"
        - name: "USB3OTG_GDBGLSPMUX"
          desc: "全局调试 LSP MUX 寄存器 - 器件"
          fields:
            - name: "reserved_31_24"
              bits: "31:24"
              desc: "保留。"
            - name: "logic_analyzer_trace"
              bits: "23:16"
              desc: "逻辑分析仪跟踪端口 MUX 选择。目前仅使用位[21:16]。 6'h3F 的值驱动 logic_analyzer_trace 信号上的“0”。如果您计划将此信号 OR（而不是使用多路复用器）与系统中的其他跟踪信号一起生成公共跟踪信号，则可以使用此功能。"
            - name: "endbc"
              bits: "15:15"
              desc: "在主机模式下启用调试功能 LSP 的调试。使用 HostSelect 选择 GDBGLSP 寄存器中提供的 DbC LSP 调试信息。"
            - name: "reserved_14"
              bits: "14:14"
              desc: "保留。"
            - name: "hostselect"
              bits: "13:8"
              desc: "主机 LSP 选择。选择主机模式下 GDBGLSP 寄存器中显示的 LSP 调试信息。"
            - name: "devselect"
              bits: "7:4"
              desc: "设备 LSP 选择。选择设备模式下 GDBGLSP 寄存器中显示的 LSP 调试信息。或者 HOSTSELECT 的位[7:4]，选择主机模式下 GDBGLSP 寄存器中呈现的 LSP 调试信息。"
            - name: "epselect"
              bits: "3:0"
              desc: "设备端点选择。选择设备模式下 GDBGEPINFO 寄存器中显示的端点调试信息。或者 HOSTSELECT 的位[3:0]，选择主机模式下 GDBGLSP 寄存器中呈现的 LSP 调试信息。"
        - name: "USB3OTG_GDBGLSP"
          desc: "全局调试 LSP 寄存器"
          fields:
            - name: "lspdebug"
              bits: "31:0"
              desc: "LSP 调试信息。"
        - name: "USB3OTG_GDBGEPINFO0"
          desc: "全局调试端点信息寄存器0"
          fields:
            - name: "epdebug"
              bits: "31:0"
              desc: "端点调试信息低 32 位。"
        - name: "USB3OTG_GDBGEPINFO1"
          desc: "全局调试端点信息寄存器 1"
          fields:
            - name: "epdebug"
              bits: "31:0"
              desc: "端点调试信息高 32 位。"
        - name: "USB3OTG_GPRTBIMAP_HSLO"
          desc: "全局高速端口到总线实例映射寄存器 - 低"
          fields:
            - name: "reserved_31_4"
              bits: "31:4"
              desc: "保留。"
            - name: "binum1"
              bits: "3:0"
              desc: "HS USB 端口 1 的实例编号。应用程序可编程 ID 位域。"
        - name: "USB3OTG_GPRTBIMAP_FSLO"
          desc: "全局全速端口到总线实例映射寄存器 - 低"
          fields:
            - name: "reserved_31_4"
              bits: "31:4"
              desc: "保留。"
            - name: "binum1"
              bits: "3:0"
              desc: "FS USB 端口 1 的实例编号。应用程序可编程 ID 位域。"
        - name: "USB3OTG_GUSB2PHYCFG0"
          desc: "全局 USB2 PHY 配置寄存器 0"
          fields:
            - name: "physoftrst"
              bits: "31:31"
              desc: "UTMI PHY 软复位。导致 usb2phy_reset 信号被置位以复位 UTMI PHY。不适用于 ULPI，因为 ULPI PHY 通过其 FunctionControl 进行重置。复位寄存器，当内核复位时，内核自动写入该寄存器（vcc_reset_n、USBCMD.HCRST、DCTL.SoftReset 或 GCTL.SoftReset）。"
            - name: "u2_freeclk_exists"
              bits: "30:30"
              desc: "指定 USB 2.0 PHY 是否提供自由运行的 PHY 时钟，该时钟在时钟控制输入有效时有效。如果您的 USB 2.0 PHY 提供自由运行的 PHY 时钟，则必须将其连接到 utmi_clk[0] 输入。其余的 utmi_clk[n] 必须连接到相应的端口时钟。内核使用 Port-0 时钟来生成内部 mac2 时钟。\n1'b0：USB 2.0空闲时钟不存在\n1'b1：USB 2.0空闲时钟存在\n注意：当内核配置为仅设备时，请勿将该位设置为 1。"
            - name: "reserved_29_25"
              bits: "29:25"
              desc: "保留。"
            - name: "lstrd"
              bits: "24:22"
              desc: "LS 周转时间。该位域指示 LS 设备的 Rx-to-Tx 数据包间隙值。编码如下：\n3'h0：2 位时间\n3'h1：2.5 位时间\n3'h2：3 位时间\n3'h3：3.5 位时间\n3'h4：4 位时间\n3'h5：4.5 位时间\n3'h6：5 位时间\n3'h7：5.5 位时间\n注意：\n该位域仅适用于 主机模式。对于正常操作（与大多数 LS 器件配合使用），请将此位域的默认值设置为 3'h0（2 位时间）。提供可编程 LS 器件数据包间间隙和周转延迟，以支持某些传统 LS 器件，这些器件可能需要与默认/固定器件不同的延迟。例如，Open LS 鼠标需要 3 位时间的数据包间间隙才能正常工作。"
            - name: "lsipd"
              bits: "21:19"
              desc: "LS 数据包间时间。该位域指示 LS 设备的 Tx-to-Tx 数据包间隙值。编码如下：\n3'h0：2 位时间\n3'h1：2.5 位时间\n3'h2：3 位时间\n3'h3：3.5 位时间\n3'h4：4 位时间\n3'h5：4.5 位时间\n3'h6：5 位时间\n3'h7：5.5 位时间\n注意：\n该位域仅适用于 主机模式。对于正常操作（与大多数 LS 器件配合使用），请将此位域的默认值设置为 3'h2（3 位时间）。提供可编程 LS 器件数据包间间隙和周转延迟，以支持某些传统 LS 器件，这些器件可能需要与默认/固定器件不同的延迟。例如，AOpen LS 鼠标需要 3 位时间的数据包间隙才能正常工作。"
            - name: "reserved_18_14"
              bits: "18:14"
              desc: "保留。"
            - name: "usbtrdim"
              bits: "13:10"
              desc: "USB 2.0 周转时间。\n设置 PHY 时钟的周转时间。\n指定 MAC 请求对数据包 FIFO 的响应时间\n控制器（PFC）从DFIFO（SPRAM）获取数据。\n以下是最小 SoC 总线所需的值\n频率为 60 MHz。 USB 周转时间至关重要\n使用长电缆和五个集线器级别时的认证标准。\n该位域所需的值：\n4'h5：当MAC接口为16 位UTMI+时。\n4'h9：当MAC接口为8 位UTMI+/ULPI时。\n如果 SoC 总线时钟小于 60 MHz，且 USB 周转时间为\n并不重要，该位域可以设置为更大的值。\n注意：该位域仅在设备模式下有效。"
            - name: "xcvrdly"
              bits: "9:9"
              desc: "收发器延迟。在 HS 线性调频期间，启用 UTMI/ULPI 收发器选择信号（对于 HS）的置位和 TxValid 信号的置位之间的延迟。当该位设置为 1 时，从收发器选择设置为\n2'b00 (HS) 到 TxValid 被驱动为 0 以发送 chirp-K 的时间。某些 UTMI/ULPI PHY 需要此延迟。\n注意：\n如果在设备内核断电后启用休眠功能，则必须使用适当的值重新初始化该位，因为内核在休眠期间不会保存和恢复该位值。该位仅在设备模式下有效。"
            - name: "enblslpm"
              bits: "8:8"
              desc: "启用 utmi_sleep_n 和 utmi_l1_suspend_n。应用程序使用该位控制 utmi_sleep_n 和 utmi_l1_suspend_n 在 L1 状态下对 PHY 的断言。\n1'b0：来自内核的 utmi_sleep_n 和 utmi_l1_suspend_n 断言不会传输到外部 PHY。\n1'b1：utmi_sleep_n 和 utmi_l1_suspend_n 的断言从内核传输到外部 PHY。\n注意：\n如果使用 SNPS PHY，则对于 Port0，该位必须设置为高。在设备模式下 - 在以 2.0 速度运行时发出任何设备端点命令之前，请禁用该位并在命令完成后启用它。在不禁用该位的情况下，如果在器件处于 L1 状态时发出命令，并且 mac2_clk（utmi_clk/ulpi_clk）被门控关闭，则该命令将无法完成。"
            - name: "physel"
              bits: "7:7"
              desc: "USB 2.0 高速 PHY 或 USB 1.1 全速。\n1'b0：USB 2.0高速UTMI+或ULPI PHY。\n1'b1：USB 1.1全速串行收发器。"
            - name: "suspendusb20"
              bits: "6:6"
              desc: "暂停 USB2.0 HS/FS/LS PHY；设置后，如果挂起条件有效，USB2.0 PHY 进入挂起模式。如果设置为 1，则应用程序必须在上电复位后清除该位。应用程序需要在核心初始化完成后将其设置为1。对于所有其他配置，该位可以在核心配置期间设置为 1。\n注意：\n在主机模式下，复位时，该位设置为 1。软件可以在复位后覆盖该位。在设备模式下，在以 2.0 速度运行时发出任何设备端点命令之前，请禁用该位并在命令完成后启用它。如果在器件处于 L2 状态时发出命令而不禁用该位，并且 mac2_clk (utmi_clk/ulpi_clk) 被关闭，则该命令将无法完成。"
            - name: "reserved_5"
              bits: "5:5"
              desc: "保留。"
            - name: "ulpi_utmi_sel"
              bits: "4:4"
              desc: "ULPI 或 UTMI+ 选择。\n1'b0：UTMI+接口\n1'b1：ULPI 接口"
            - name: "phyif"
              bits: "3:3"
              desc: "如果选择 UTMI+，应用程序使用该位来配置内核以支持具有 8 位或 16 位接口的 UTMI+ PHY。\n1'b0：8 位\n1'b1：16 位"
            - name: "tout_cal"
              bits: "2:0"
              desc: "HS/FS 超时校准。本领域的应用所指示的PHY时钟的数量乘以位时间因子；该因素被添加到内核中的高速/全速数据包间超时持续时间中，以解决 PHY 引入的额外延迟。这可能是必需的，因为 PHY 在生成线状态条件时引入的延迟可能因 PHY 而异。 USB 高速操作的标准超时值为 736 至 816（含）位时间。 USB全速操作的标准超时值为16至18（含）位时间。应用程序必须根据连接速度对该位域进行编程。每个 PHY 时钟添加的位时间数为：\n高速运行：\n1 个 30 MHz PHY 时钟 = 16 位时间 1 个 60 MHz PHY 时钟 = 8 位时间 全速运行：\n1 个 30 MHz PHY 时钟 = 0.4 位时间 1 个 60 MHz PHY 时钟 = 0.2 位时间"
        - name: "USB3OTG_GUSB3PIPECTL0"
          desc: "全局 PIPE PHY 配置寄存器 0"
          fields:
            - name: "PHYSoftRst"
              bits: "31:31"
              desc: "USB3 PHY 软复位 该位设置为 1 后，软件需要清零该位。"
            - name: "HstPrtCmpl"
              bits: "30:30"
              desc: "此功能可测试 PIPE PHY 一致性模式，而无需在 USB 3.0 电缆上安装测试夹具。该位允许将 SS 端口链路置于合规状态。默认情况下，该位必须设置为 1'b0。在合规性实验室测试中，SS 端口链路在通电后的第一个轮询序列失败后进入合规性。当您运行合规性测试时，将此位设置为 0。使用此功能的顺序如下：\n1. 断开所有插入的设备。\n2. 执行USBCMD.HCRST 或片上电复位。\n3. 设置PORTSC.PP=0。\n4. 设置GUSB3PIPECTL。 HstPrtCmpl=1。这会将链接置于合规状态。要推进合规模式，请遵循以下顺序（切换设置 GUSB3PIPECTL.HstPrtCmpl）：\n1. 设置GUSB3PIPECTL.HstPrtCmpl=0。\n2. 设置GUSB3PIPECTL.HstPrtCmpl=1。这会将链接推进到下一个合规模式。要退出合规状态，请执行 USBCMD.HCRST 或片上电复位。"
            - name: "U2SSInactP3ok"
              bits: "29:29"
              desc: "1'b0：链接状态U2/SS.Inactive时，将PHY放入P2（默认）\n1'b1：链接状态U2/SS.Inactive时，将PHY放入P3"
            - name: "DisRxDetP3"
              bits: "28:28"
              desc: "P3 中禁用接收器检测\n1'b0：如果PHY在P3中并且Core需要执行接收器检测，则Core在P3中执行接收器检测。 （默认）\n1'b1：如果PHY在P3并且Core需要执行接收器检测，则Core将PHY电源状态更改为P2，然后执行接收器检测。接收器检测后，内核将 PHY 电源状态更改为 P3。"
            - name: "Ux_exit_in_Px"
              bits: "27:27"
              desc: "1'b0：内核在 PHY 电源状态 P0 下退出 U1/U2/U3（默认行为）。\n1'b1：内核分别在 PHY 电源状态 P1/P2/P3 下退出 U1/U2/U3。"
            - name: "ping_enhancement_en"
              bits: "26:26"
              desc: "Ping 增强启用 设置后，下游端口 U1 ping 接收超时变为 500 毫秒，而不是 300 毫秒。 Ping.LFPS 的最小接收持续时间为 8 ns（一个 mac3_clk）。该位域仅对下游端口有效。"
            - name: "u1u2exitfail_to_recov"
              bits: "25:25"
              desc: "U1U2exitfail 恢复 当设置时，U1/U2 LFPS 握手失败，LTSSM 从 U1/U2 转换为恢复而不是 SS 无效。如果恢复失败，则 LTSSM 可以进入 SS.Inactive。这只是一个增强。如果远程链路未进行正确的握手，它可以防止出现互操作性问题。"
            - name: "request_p1p2p3"
              bits: "24:24"
              desc: "始终请求 U1/U2/U3 对应的 P1/P2/P3 设置后，内核始终请求 PHY 功率从 P0 更改为P1/P2/P3 在 U0 到 U1/U2/U3 转换期间。如果该位为 0，并且发生立即 Ux 退出（远程启动或本地启动），则内核不会请求 P1/P2/P3 电源状态更改。"
            - name: "StartRxDetU3RxDet"
              bits: "23:23"
              desc: "在 U3/Rx.Detect (StartRxdetU3RxDet) 中启动接收器检测 如果 DWC_USB3_GUSB3PIPECTL_INIT[22] 被置位，并且链路处于 U3 或 Rx.Detect 状态，则内核在此位的上升沿启动接收器检测。这只能用于下游端口。对于上游端口，该位必须设置为“0”。正常操作时不得启用此功能。"
            - name: "DisRxDetU3RxDet"
              bits: "22:22"
              desc: "禁用 U3/Rx.Det 状态下的接收器检测 设置后，内核不处理 U3 或 Rx.Detect 状态下的接收器检测。必须使用DWC_USB3_GUSB3PIPECTL_INIT[23]手动启动接收器检测。该位只能用于下游端口。对于上游端口，该位必须设置为 0。正常操作时不得启用此功能。如果您必须使用此功能，请联系SNPS。"
            - name: "DelayP1P2P3"
              bits: "21:19"
              desc: "延迟 P1P2P3 当输入 U1/U2/U3 时延迟 P0 到 P1/P2/P3 请求，直到(DWC_USB3_GUSB3PIPECTL_INIT[21:19]*8) 发生8B10B错误，或Pipe3_RxValid降至0。DWC_USB3_GUSB3PIPECTL_INIT[18]必须为1才能启用此功能。"
            - name: "DELAYP1TRANS"
              bits: "18:18"
              desc: "DELAYP1TRANS\n当链路状态时，延迟PHY功率从P0到P1/P2/P3\n分别从 U0 更改为 U1/U2/U3。\n1'b1：进入U1/U2/U3时，延迟过渡到P1/P2/P3\n直到 pipe3 发出信号，Pipe3_RxElecIlde 为 1，pipe3_RxValid 为\n0\n1'b0：进入U1/U2/U3时，过渡到P1/P2/P3，无\n检查 Pipe3_RxElecIlde 和 pipe3_RxValid。\n注：对于 SNPS PHY，该位必须设置为“1”。它也被使用\n第三方 SS PHY。"
            - name: "SUSPENDENABLE"
              bits: "17:17"
              desc: "挂起 USB3.0 SS PHY (Suspend_en) 设置后，如果挂起条件有效，则 USB 3.0 PHY 进入挂起模式。核心初始化完成后，应用程序需要将其设置为“1”。"
            - name: "DATWIDTH"
              bits: "16:15"
              desc: "2'b00：32 位\n2'b01：16 位\n2'b10：8 位 复位后一个时钟，这些位接收 pipe3_DataBusWidth 上看到的值。"
            - name: "AbortRxDetInU2"
              bits: "14:14"
              desc: "Abort Rx Detect in U2 (AbortRxDetInU2) 设置后，并且链接状态为 U2，则如果内核从远程链接伙伴接收到 U2 exit LFPS，则内核将中止接收器检测。该位仅适用于下游端口。"
            - name: "SkipRxDet"
              bits: "13:13"
              desc: "跳过接收检测：\n设置后，如果 pipe3_RxElecIdle 为低电平，则内核会跳过 Rx 检测。跳过定义为等待适当的超时，然后重复操作。"
            - name: "LFPSP0Algn"
              bits: "12:12"
              desc: "LFPS P0 对齐 设置时：\n1. 当退出 U1、U2 或 U3 低功耗状态时，内核在请求 PHY 功耗状态 0 的时钟边沿取消断言 LFPS 传输。否则，LFPS 传输会提前一个时钟断言。\n2. 由于 PHY 从 P1 或 P2 状态切换到 P0 状态，在 PHY 置位 PhyStatus 后，内核请求符号传输两个 pipe3_rx_pclks 周期。目前，该位仅在 USB 3.0 HUB 和 SNPS PHY 中使用。对于其他 USB 3.0 主机、设备和 DRD 内核，不需要该位。"
            - name: "P3P2TranOK"
              bits: "11:11"
              desc: "P3 P2 转换 OK (P3P2TranOK) 设置时，内核直接从 PHY 电源状态 P2 转换到 P3 或从状态 P3 转换到P2。如果未设置，则在 P2 和 P3 之间转换期间，P0 始终作为中间状态进入，如 PIPE3 规范中所定义。根据PIPE3规范，P3和P2之间的任何直接转换都是非法的。"
            - name: "P3ExSigP2"
              bits: "10:10"
              desc: "P3 P2 中的退出信号 当该位置位时，在尝试 U3 退出握手之前，内核始终将 PHY 电源状态更改为 P2。该位仅用于某些无法在 P3 中执行 LFPS 的非 SNPS PHY。"
            - name: "LFPSFILTER"
              bits: "9:9"
              desc: "LFPS 过滤器 设置后，在 PHY 电源状态 P0 下使用 pipe3_RxValid 过滤 LFPS 接收，即忽略来自 PHY 的 LFPS 接收，除非 pipe3_Rxelecidle 和pipe3_RxValid 无效。"
            - name: "RX_DETECT_to_Polling_L"
              bits: "8:8"
              desc: "RX_DETECT 至 Polling.LFPS 控制\n1'b0（默认）：启用 400us 延迟以在 RX_DETECT 之后开始轮询 LFPS。这允许 VCM 偏移稳定到适当的水平。\n1'b1：禁用在 RX_DETECT 之后开始轮询 LFPS 的 400us 延迟。在与第三方 PHY 进行控制器认证期间，观察到如果链路在 80us 内开始轮询，则 PHY 无法满足 Tx AC 共模电压有效 (VTX-CM-ACPP_ACTIVE <100mv)执行rx.detect。为了满足 VTX-CM-ACPP_ACTIVE 规范，必须进一步延迟轮询。如果 PHY 没有问题，那么他们可以将该位设置为 1，从而允许在 80us 内开始轮询。"
            - name: "reserved_7"
              bits: "7:7"
              desc: "保留。"
            - name: "TX_SWING"
              bits: "6:6"
              desc: "Tx Swing (TxSwing) 请参阅 PIPE3 规格。"
            - name: "TX_MARGIN"
              bits: "5:3"
              desc: "Tx Margin[2:0] (TxMargin) 请参阅 PIPE3 规范的表 5-3。"
            - name: "TX_DE_EPPHASIS"
              bits: "2:1"
              desc: "Tx 去加重 在 USB3 合规模式期间，驱动到 PHY 的值由 LTSSM 控制。"
            - name: "ELASTIC_BUFFER_MODE"
              bits: "0:0"
              desc: "弹性缓冲模式（ElasticBufferMode）（参见PIPE3规范表5-3）"
        - name: "USB3OTG_GTXFIFOSIZn"
          desc: "全局发送 FIFO 大小寄存器 n，偏移量 (0xc300 + 4*n)，n=0~6"
          fields:
            - name: "txfstaddr_n"
              bits: "31:16"
              desc: "发送 FIFOn RAM 起始地址。该位域包含 64 位字中 TxFIFOn 的存储器起始地址。"
            - name: "txfdep_n"
              bits: "15:0"
              desc: "TxFIFO 深度。该位域包含 64 位字中 TxFIFOn 的深度。最小值：32；最大值：32,768。"
        - name: "USB3OTG_GRXFIFOSIZn"
          desc: "全局接收 FIFO 大小寄存器 n"
          fields:
            - name: "rxfstaddr_n"
              bits: "31:16"
              desc: "RxFIFOn RAM 起始地址。该位域包含 64 位字中 RxFIFOn 的存储器起始地址。"
            - name: "rxfdep_n"
              bits: "15:0"
              desc: "RxFIFOn RAM 起始地址。该位域包含 64 位字中 RxFIFOn 的存储器起始地址。"
        - name: "USB3OTG_GEVNTADRLO0"
          desc: "全局事件缓冲区地址（低）寄存器 0"
          fields:
            - name: "evntadrlo"
              bits: "31:0"
              desc: "事件缓冲区地址。保存事件缓冲区外部存储器起始地址的低 32 位。在操作期间，硬件不会更新该地址。"
        - name: "USB3OTG_GEVNTADRHI0"
          desc: "全局事件缓冲区地址（高）寄存器 0"
          fields:
            - name: "evntadrhi"
              bits: "31:0"
              desc: "事件缓冲区地址。保存事件缓冲区外部存储器起始地址的高 32 位。在操作期间，硬件不会更新该地址。"
        - name: "USB3OTG_GEVNTSIZ0"
          desc: "全局事件缓冲区大小寄存器 0"
          fields:
            - name: "evntintrptmask"
              bits: "31:31"
              desc: "事件中断掩码。当设置为“1”时，可以防止生成中断。但是，即使设置了掩码，事件也会排队。"
            - name: "reserved_30_16"
              bits: "30:16"
              desc: "保留。"
            - name: "eventsiz"
              bits: "15:0"
              desc: "事件缓冲区大小（以字节为单位）。保存事件缓冲区的大小（以字节为单位）；必须是四的倍数。这是在初始化期间由软件编程一次。事件缓冲区的最小大小为 32 字节。"
        - name: "USB3OTG_GEVNTCOUNT0"
          desc: "全局事件缓冲区计数寄存器 0"
          fields:
            - name: "reserved_31_16"
              bits: "31:16"
              desc: "保留。"
            - name: "evntcount"
              bits: "15:0"
              desc: "事件计数。读取时，返回事件缓冲区中有效事件的数量（以字节为单位）。写入时，硬件会将计数递减写入的值。当计数不为 0 时，中断线保持高电平。"
        - name: "USB3OTG_GHWPARAMS8"
          desc: "全局硬件参数寄存器8"
        - name: "USB3OTG_GTXFIFOPRIDEV"
          desc: "全局器件 TX FIFO DMA 优先级寄存器"
          fields:
            - name: "reserved_31_7"
              bits: "31:7"
              desc: "保留。"
            - name: "gtxfifopridev"
              bits: "6:0"
              desc: "设备TxFIFO优先。该寄存器指定设备 TXFIFO 之间的相对 DMA 优先级（每个 IN 端点一个）。每个寄存器位[n]控制每个TXFIFO[n]的优先级（1：高，0：低）。当多个 TXFIFO 在给定时间竞争 DMA 服务时（即，多个 TXQ 包含 TX DMA 请求且其对应的 TXFIFO 有可用空间），TX DMA 仲裁器按以下方式授予基于数据包的访问权限：\n1. 使用循环仲裁授予高优先级 TXFIFO 访问权限\n2. 仅当高优先级 TXFIFO 没有进一步的处理要做（即 TXQ 为空或相应的 TXFIFO 已满）后，才使用循环仲裁授予低优先级 TXFIFO 访问权限。对于分散-聚集数据包，仲裁器将连续的 DMA 请求授予同一 FIFO，直到整个数据包完成。配置周期性 IN 端点时，软件必须设置寄存器位[n]=1，其中 n 是 TXFIFO 分配。这可确保同步或中断 IN 端点的 DMA 优先于批量或控制 IN 端点。仅当内核配置为在设备模式下运行时，该寄存器才存在。寄存器大小对应于设备 IN 端点的数量。"
        - name: "USB3OTG_GTXFIFOPRIHST"
          desc: "全局主机 TX FIFO DMA 优先级寄存器"
          fields:
            - name: "reserved_31_3"
              bits: "31:3"
              desc: "保留。"
            - name: "gtxfifoprihst"
              bits: "2:0"
              desc: "主机TxFIFO优先。该寄存器指定关联速度组 (HS/FSLS) 内主机 TXFIFO 之间的相对 DMA 优先级（每个 USB 总线实例一个）。每个寄存器位[n]控制TXFIFO[n]在一个速度组内的优先级（1：高，0：低）。当多个 TXFIFO 在给定时间竞争 DMA 服务时（i.e.，多个 TXQ 包含 TX DMA 请求，并且它们相应的 TXFIFO 有可用空间），TX DMA 仲裁器在以下方式：\n1. 同速度组的 FIFO 中（HS/FSLS）：\na.使用循环仲裁授予高优先级 TXFIFO 访问权 b．仅当高优先级 TXFIFO 没有进一步的处理要做（即 TXQ 为空或相应的 TXFIFO 已满）后，低优先级 TXFIFO 才被授予使用循环仲裁的访问权限。\n2. TX DMA 仲裁器根据 GDMAHLRATIO 寄存器中编程的比率对 HS/FSLS 速度组进行优先级排序。对于分散-聚集数据包，仲裁器将连续的 DMA 请求授予同一 FIFO，直到整个数据包完成。仅当内核配置为在主机模式（包括 DRD 和 OTG 模式）下运行时，该寄存器才存在。寄存器大小对应配置的USB总线实例的数量；例如，在默认配置中，有 2 个 USB 总线实例（1 个 HS 和 1 个 FSLS）。"
        - name: "USB3OTG_GRXFIFOPRIHST"
          desc: "全局主机 RX FIFO DMA 优先级寄存器"
          fields:
            - name: "reserved_31_3"
              bits: "31:3"
              desc: "保留。"
            - name: "grxfifoprihst"
              bits: "2:0"
              desc: "主机 RxFIFO 优先级 该寄存器指定关联速度组 (HS/FSLS) 内主机 RXFIFO（每个 USB 总线实例一个）之间的相对 DMA 优先级。每个寄存器位[n]控制RXFIFO[n]在一个速度组内的优先级（1：高，0：低）。当多个 RXFIFO 在给定时间竞争 DMA 服务时（i.e.，多个 RXQ 包含 RX DMA 请求，并且其相应的 RXFIFO 有可用数据），RX DMA 仲裁器在以下方式：\n1. 同速度组的 FIFO 中（HS/FSLS）：\na.使用循环仲裁授予高优先级 RXFIFO 访问权限 b．仅当高优先级 RXFIFO 没有进一步的处理要做（即 RXQ 为空或相应的 RXFIFO 没有所需数据）后，低优先级 RXFIFO 才被授予使用循环仲裁的访问权限。\n2. RX DMA 仲裁器根据 GDMAHLRATIO 寄存器中编程的比率对 HS/FSLS 速度组进行优先级排序。对于分散-聚集数据包，仲裁器将连续的 DMA 请求授予同一 FIFO，直到整个数据包完成。仅当内核配置为在主机模式（包括 DRD 和 OTG 模式）下运行时，该寄存器才存在。寄存器大小对应配置的USB总线实例的数量；例如，在默认配置中，有 2 个 USB 总线实例（1 个 HS 和 1 个 FSLS）。"
        - name: "USB3OTG_GFIFOPRIDBC"
          desc: "全局主机调试能力 DMA 优先级寄存器"
          fields:
            - name: "reserved_31_2"
              bits: "31:2"
              desc: "保留。"
            - name: "gfifopridbc"
              bits: "1:0"
              desc: "主机 DbC DMA 优先。该寄存器指定与 DbC 模式相关的 RXFIFO 和 TXFIFO 的相对优先级。当 DbC 模式使能时，它会覆盖主机 RXFIFO 和 TXFIFO DMA 优先级寄存器的相应索引中分配的优先级。"
        - name: "USB3OTG_GDMAHLRATIO"
          desc: "全局主机 FIFO DMA 高低优先级比寄存器"
          fields:
            - name: "reserved_31_22"
              bits: "31:22"
              desc: "保留。"
            - name: "hstrxfifo"
              bits: "21:8"
              desc: "主机 RXFIFO DMA 高-低优先级。"
            - name: "reserved_7_5"
              bits: "7:5"
              desc: "保留。"
            - name: "hsttxfifo"
              bits: "4:0"
              desc: "主机 TXFIFO DMA 高-低优先级。"
        - name: "USB3OTG_GFLADJ"
          desc: "全局帧长度调整寄存器"
          fields:
            - name: "gfladj_refclk_240mhzdecr_pls1"
              bits: "31:31"
              desc: "该位域表示控制器对每个 ref_clk 应用的减量值必须是 GFLADJ_REFCLK_240MHZ_DECR 和 GFLADJ_REFCLK_240MHZ_DECR +1，或者在每个 ref_clk 上。仅当 GFLADJ_REFCLK_LPM_SEL 设置为 1 并且 240/ref_frequency 的小数部分大于或等于 0.5 时，才将该位设置为 1。\n示例：\n如果 ref_clk 为 24 MHz，则\n1. GUCTL.REF_CLK_PERIOD = 41\n2. GFLADJ.GFLADJ_REFCLK_240MHZ_DECR = (240/24) = 10\n3. GFLADJ.GFLADJ_REFCLK_240MHZDECR_PLS1 = 0"
            - name: "gfladj_refclk_240mhz_decr"
              bits: "30:24"
              desc: "该位域指示控制器为每个 ref_clk 应用的递减值，以便根据 240 MHz 时钟导出帧定时器。仅当 GFLADJ_REFCLK_LPM_SEL 设置为 1 时，该位域才必须编程为非零值。该值的推导如下：\nGFLADJ_REFCLK_240MHZ_DECR = 240/ref_clk_frequency\n示例：如果 ref_clk 为 24 MHz，则\n1. GUCTL.REF_CLK_PERIOD = 41\n2. GFLADJ.GFLADJ_REFCLK_240MHZ_DECR = 240/24 = 10"
            - name: "gfladj_refclk_lpm_sel"
              bits: "23:23"
              desc: "该位启用在 ref_clk 上运行 SOF 计数器的功能。如果 GCTL.SOFITPSYNC 位设置为 1，则该位不得设置为 1。同样，如果 GFLADJ_REFCLK_LPM_SEL 设置为 1，则 GCTL.SOFITPSYNC 不得设置为 1。\n请注意，该模式下支持的 ref_clk 频率为 16/17/19.2/20/24/39.7/40 MHz。内核的utmi_clk[0]信号必须连接到PHY的FREECLK。\n注：如果将此位设置为 1，则 GUSB2PHYCFG.U2_FREECLK_EXISTS 位必须设置为 0。"
            - name: "reserved_22"
              bits: "22:22"
              desc: "保留。"
            - name: "gfladj_refclk_fladj"
              bits: "21:8"
              desc: "该位域指示当 SOF 计数器在 ref_clk 上运行时要应用的帧长度调整。当 GLADJ.GFLADJ_REFCLK_LPM_SEL 设置为 1 时的 SOF 间隔。仅当 GFLADJ_REFCLK_LPM_SEL 设置为 1 或 GCTL.SOFITPSYNC 设置为 1 时，该位域才必须编程为非零值。该值的推导如下：\nFLADJ_REF_CLK_FLADJ=((125000/ref_clk_period_integer) - (125000/ref_clk_period)) * ref_clk_period 其中：\n1. ref_clk_period_integer 是通过截断 GUCTL.REF_CLK_PERIOD 位域中编程的十进制（小数）值得到的 ref_clk 周期的整数值。\n2. ref_clk_period 是包含小数值的 ref_clk 周期。\n示例：如果 ref_clk 为 24 MHz，则\n1. GUCTL.REF_CLK_PERIOD = 41\n2. GFLADJ.GLADJ_REFCLK_FLADJ = ((125000/41) - (125000/41.6666)) * 41.6666 = 2032（忽略小数值）。"
            - name: "gfladj_30mhz_sdbnd_sel"
              bits: "7:7"
              desc: "该位域选择是否使用输入信号 fladj_30mhz_reg 或 GFLADJ.GFLADJ_30MHZ 来调整 SOF 的帧长度。当该位设置为：\n1'b1：控制器使用寄存器位域GFLADJ.GFLADJ_30MHZ的值\n1'b0：控制器使用输入信号fladj_30mhz_reg值。"
            - name: "reserved_6"
              bits: "6:6"
              desc: "保留。"
            - name: "gfadj_30mhz"
              bits: "5:0"
              desc: "该位域指示用于帧长度调整的值，而不是从边带输入信号fladj_30mhz_reg考虑。如果输入信号 fladj_30mhz_reg 连接到错误值或无效，则可以进行硅后帧长度调整。有关如何设置该值的详细信息，请参阅《xHCI 规范》的第 5.2.4 节“帧长度调整寄存器（FLADJ）”。"
        - name: "USB3OTG_DCFG"
          desc: "设备配置寄存器"
          fields:
            - name: "reserved_31_24"
              bits: "31:24"
              desc: "保留。"
            - name: "ignstrmpp"
              bits: "23:23"
              desc: "该位仅影响支持流的批量端点。未应用。"
            - name: "lpmcap"
              bits: "22:22"
              desc: "LPM 有能力。未应用。"
            - name: "nump"
              bits: "21:17"
              desc: "接收缓冲区的数量。未应用。"
            - name: "intrnum"
              bits: "16:12"
              desc: "中断号。指示生成非端点特定设备相关中断（请参阅 DEVT）的中断/EventQ 编号。"
            - name: "reserved_11_10"
              bits: "11:10"
              desc: "保留。"
            - name: "devaddr"
              bits: "9:3"
              desc: "设备地址。应用程序必须执行以下操作：\n1. 在每次 SetAddress 请求后对该位域进行编程。\n2. USB 复位后将该位域复位为零。"
            - name: "devspd"
              bits: "2:0"
              desc: "设备速度。表示应用程序需要核心连接的速度，或者应用程序可以支持的最大速度。然而，实际总线速度仅在 chirp 序列完成后确定，并且基于内核所连接的 USB 主机的速度。\n3'b000：高速（USB 2.0 PHY 时钟为 30 MHz 或 60 MHz）\n3'b001：全速（USB 2.0 PHY 时钟为 30 MHz 或 60 MHz）"
        - name: "USB3OTG_DCTL"
          desc: "设备控制寄存器"
          fields:
            - name: "run_stop"
              bits: "31:31"
              desc: "软件向该位写入 1 以启动设备控制器操作。要停止设备控制器操作，软件必须终止所有活动传输并向该位写入 0。当控制器停止时，当内核空闲且下层完成断开连接过程时，它会设置 DSTS.DevCtrlHlt 位。在指定的以下情况下必须使用运行/停止位：\n1. 上电复位和 CSR 初始化后，软件必须向该位写入 1 才能启动设备控制器。在设置该位之前，控制器不会发出连接到主机的信号。\n2. 软件使用该位控制设备控制器执行软断开。当软件向该位写入0时，主机看不到设备已连接。设备控制器保持断开状态，直到软件向该位写入 1。保持该位清零的最短持续时间在下面的注释中指定。如果软件在软断开后尝试连接或检测到断开事件，则必须在重新置位运行/停止位之前将 DCTL[8:5] 设置为 5。\n3. 当 USB 处于较低功耗状态并且选择两个电源轨配置时，软件向该位写入 0 以指示它将关闭核心电源轨。软件再次打开核心电源轨并重新初始化设备控制器后，必须设置该位以启动设备控制器。\n注：以下是在各种条件下必须设置软断开（SftDiscon）位以使 USB 主机检测设备断开连接的最短持续时间：\n10ms：对于高速，当设备状态为挂起、空闲或非空闲/非挂起（正在执行事务）时；对于全速/低速，当设备状态为挂起、空闲或非空闲/非挂起（正在执行事务）时。为了适应时钟抖动，建议应用程序在指定的最短持续时间内添加额外的延迟。"
            - name: "csftrst"
              bits: "30:30"
              desc: "内核软复位。\n按如下方式复位所有时钟域：\n1. 该位清除中断和所有 CSR，但 GSTS、GSNPSID、GGPIO、GUID、GUSB2PHYCFGn、GUSB3PIPECTLn、DCFG、DCTL、DEVTEN 和 DSTS 寄存器除外。\n2. 所有模块状态机（SoC 总线从设备单元除外）复位到 IDLE 状态，并清空所有 TxFIFOs 和 RxFIFO。\n3. SoC 总线主设备上的事务会在妥善完成最后一个数据阶段后尽快终止；USB 上的事务立即终止。\n应用程序可随时向该位写值以复位内核。该位会自行清零；内核中的所有必要逻辑复位完成后，内核会清除该位。所需时间取决于内核当前状态，可能持续数个时钟周期。该位清零后，软件必须等待至少 3 个 PHY 时钟周期，才能访问 PHY 时钟域（同步延迟）。\n软件复位通常用于软件开发，也用于动态更改上述 USB 配置寄存器中的 PHY 选择位。更改 PHY 后，相应的 PHY 时钟会被选中并用于 PHY 时钟域。选择新时钟后，必须复位 PHY 时钟域才能正常工作。"
            - name: "reserved_29"
              bits: "29:29"
              desc: "保留。"
            - name: "hirdthres"
              bits: "28:24"
              desc: "HIRD 阈值。内核根据该信号断言输出信号 utmi_l1_suspend_n 和 utmi_sleep_n：\n当以下两个条件都成立时，内核断言 utmi_l1_suspend_n 将 PHY 置于 L1 中的深度低功耗模式：\n1. HIRD值大于等于DCTL.HIRD_Thres[3:0]中的值\n2. HIRD_Thres[4]设置为1'b1。当以下任一情况为真时，内核在 L1 上置位 utmi_sleep_n：\n1. 如果HIRD值小于HIRD_Thres[3:0]或\n2. HIRD_Thres[4]设置为1'b0。\n注：在 SuperSpeed 操作模式期间，该位域必须设置为“0”。"
            - name: "lpm_nyet_thres"
              bits: "23:20"
              desc: "LPM NYET 阈值。器件应用程序通过该位域指定对 LPM 令牌的握手响应。响应取决于 DCFG.LPMCap：\nDCFG.LPMCap 为 1'b0：内核始终超时，即不作响应。\nDCFG.LPMCap 为 1'b1：满足以下全部条件时，内核对成功的 LPM 事务响应 ACK：\n1. EXT 令牌和 LPM 令牌均无 PID 或 CRC5 错误；否则，无活动将导致超时错误（ERROR）。\n2. 发送 FIFO 中没有待发送数据，且 OUT 端点不处于流量控制状态；否则响应 NYET。\n3. LPM 令牌中的 BESL 值小于或等于 LPM_NYET_thres[3:0]。"
            - name: "keep_connect"
              bits: "19:19"
              desc: "当为 1 时，该位通过在 DCTL.RunStop 设置为 0 时防止内核与主机断开连接来启用保存和恢复编程模型。当 DCTL.RunStop 设置为 0 时，器件内核与主机断开连接。该位指示是否保留此行为 (0)，或者当 RunStop 设置为 0 时内核是否不得断开连接 (1)。"
            - name: "l1_hibernation_en"
              bits: "18:18"
              desc: "当该位与 KeepConnect 一起设置时，如果 L1 使能并且 LPM 令牌中的 HIRD 值大于 DCTL.HIRD_Thres 中编程的阈值，则器件内核将生成休眠请求事件。在软件将 Recovery 写入 DCTL.ULStChngReq 位域之前，内核不会退出 LPM L1 状态。这可以防止在主机尝试退出 L1 的同时设备进入休眠状态的极端情况。"
            - name: "crs"
              bits: "17:17"
              desc: "控制器恢复状态。该命令类似于主机模式下的 USBCMD.CRS 位，启动恢复过程。当软件将该位设置为 1 时，控制器立即将 DSTS.RSS 设置为 1。当控制器完成恢复过程后，将 DSTS.RSS 设置为 0。\n注意：读取时，该位域始终返回 0。"
            - name: "css"
              bits: "16:16"
              desc: "控制器保存状态。该命令类似于主机模式下的 USBCMD.CSS 位，启动保存过程。当软件将该位设置为 1 时，控制器立即将 DSTS.SSS 设置为 1。当控制器完成保存过程后，将 DSTS.SSS 设置为 0。\n注意：读取时，该位域始终返回 0。"
            - name: "reserved_15_13"
              bits: "15:13"
              desc: "保留。"
            - name: "initu2ena"
              bits: "12:12"
              desc: "未应用。"
            - name: "acceptu2ena"
              bits: "11:11"
              desc: "未应用。"
            - name: "initu1ena"
              bits: "10:10"
              desc: "未应用。"
            - name: "acceptu1ena"
              bits: "9:9"
              desc: "未应用。"
            - name: "ulstchngreq"
              bits: "8:5"
              desc: "软件写入该位域以发出 USB 状态更改请求。该位域发生变化表示向内核发出了新请求。若软件需要连续发出相同请求，必须在两次请求之间先向该位域写入 0。状态更改请求的结果反映在 DSTS 的 USB 状态中；MAC 层退出挂起状态时，这些位会自行清零。若软件只是更新 DCTL 寄存器的其他位域，并不打算强制更改链路状态，则必须向该位域写入 0。\n在 HS/FS/LS 模式下：\n值：请求的 USB 状态转换\n8：远程唤醒请求\n其他：保留\n器件进入挂起状态（DSTS[21:18] 为 3）2 us 后，才能发出远程唤醒请求。\n注意：退出休眠后，软件必须向该位域写入 8（Recovery），以确认已退出挂起状态。"
            - name: "tstctl"
              bits: "4:1"
              desc: "测试控制。\n4'b000：测试模式禁用\n4'b001：Test_J模式\n4'b010：Test_K模式\n4'b011：Test_SE0_NAK模式\n4'b100：Test_Packet模式\n4'b101：Test_Force_Enable 其他：保留"
            - name: "reserved_0"
              bits: "0:0"
              desc: "保留。"
        - name: "USB3OTG_DEVTEN"
          desc: "设备事件使能寄存器"
          fields:
            - name: "reserved_31_13"
              bits: "31:13"
              desc: "保留。"
            - name: "vendevtstrcvden"
              bits: "12:12"
              desc: "供应商设备测试 LMP 收到事件。\n1'b0：禁用该事件\n1'b1：启用该事件"
            - name: "reserved_11_10"
              bits: "11:10"
              desc: "保留。"
            - name: "errticerrevten"
              bits: "9:9"
              desc: "不稳定错误事件启用。\n1'b0：禁用该事件\n1'b1：启用该事件"
            - name: "reserved_8"
              bits: "8:8"
              desc: "保留。"
            - name: "softevten"
              bits: "7:7"
              desc: "(u) 帧开始事件启用。\n1'b0：禁用该事件\n1'b1：启用该事件"
            - name: "u3l2l1_susp_en"
              bits: "6:6"
              desc: "U3/L2-L1 暂停事件使能。\n1'b0：禁用该事件\n1'b1：启用该事件"
            - name: "hibernation_req_evt_en"
              bits: "5:5"
              desc: "休眠请求事件启用。\n1'b0：禁用该事件\n1'b1：启用该事件"
            - name: "wkupevten"
              bits: "4:4"
              desc: "恢复/远程唤醒检测到的事件启用。\n1'b0：禁用该事件\n1'b1：启用该事件"
            - name: "ulstcngen"
              bits: "3:3"
              desc: "USB 状态改变事件使能。\n1'b0：禁用该事件\n1'b1：启用该事件"
            - name: "connectdoneevten"
              bits: "2:2"
              desc: "连接完成事件启用。\n1'b0：禁用该事件\n1'b1：启用该事件"
            - name: "usbrstevten"
              bits: "1:1"
              desc: "USB 复位事件使能。\n1'b0：禁用该事件\n1'b1：启用该事件"
            - name: "disconnevten"
              bits: "0:0"
              desc: "断开检测到的事件启用。\n1'b0：禁用该事件\n1'b1：启用该事件"
        - name: "USB3OTG_DSTS"
          desc: "设备状态寄存器"
          fields:
            - name: "reserved_31_30"
              bits: "31:30"
              desc: "保留。"
            - name: "dcnrd"
              bits: "29:29"
              desc: "设备控制器未就绪。该位指示内核在退出休眠后正在完成状态转换。要完成状态转换，从设置 DCTL[31].Run/Stop 起需要 256 个总线时钟周期。休眠期间，如果 UTMI/ULPI PHY 处于挂起状态，则 PHY 退出挂起状态后，256 总线时钟周期延迟开始。在处理 DSTS.USBLnkSt 之前，软件必须将 DCTL[31].Run/Stop 设置为 1，并等待该位被置为 0。"
            - name: "reserved_28_26"
              bits: "28:26"
              desc: "保留。"
            - name: "rss"
              bits: "25:25"
              desc: "恢复状态状态。该位与主机模式下的 USBSTS.RSS 类似。当控制器完成恢复过程时，它通过将 DSTS.RSS 设置为 0 来完成命令。"
            - name: "sss"
              bits: "24:24"
              desc: "保存状态。该位与主机模式下的 USBSTS.SSS 类似。当控制器完成保存过程时，它通过将 DSTS.SSS 设置为 0 来完成命令。"
            - name: "coreidle"
              bits: "23:23"
              desc: "核心空闲。该位指示内核已完成将所有 RxFIFO 数据传输到系统内存、写出所有完成的描述符，并且所有事件计数为零。\n注意：测试重置值时，屏蔽掉读取值。该位代表内核的变化状态，不保存静态值。"
            - name: "devctrlhlt"
              bits: "22:22"
              desc: "设备控制器已停止。当 DCTL 寄存器中的 Run/Stop 位设置为 1 时，该位设置为 0。当 SW 将 Run/Stop 设置为 0 后，内核空闲且下层完成断开连接过程时，内核将该位设置为 1。当 Halted=1 时，内核不生成设备事件。\n注意：如果 GEVNTCOUNTn 具有某个有效值，则内核不会将该位设置为 1。软件在等待该位设置为 1 时需要确认生成的事件（通过写入 GEVNTCOUNTn）。"
            - name: "usblnkst"
              bits: "21:18"
              desc: "USB/链路状态 SS 模式下：LTSSM 状态\n4'h0: U0\n4'h1: U1\n4'h2: U2\n4'h3: U3\n4'h5: RX_DET\n4'h6: SS_INACT\n4'h7: POLL\n4'h8: RECOV\n4'h9: HRESET\n4'ha: CMPLY\n4'hb: LPBK\n4'hf：恢复/复位 在 HS/FS/LS 模式下：\n4'h0：开启状态\n4'h2：睡眠（L1）状态\n4'h3：暂停（L2）状态\n4'h4：断开状态（默认状态）\n4'h5：早期挂起状态（仅当禁用休眠时有效，GCTL[1].GblHibernationEn = 0）\n4'he：复位（仅在休眠使能时有效，GCTL[1].GblHibernationEn = 1）\n4'hf：恢复（仅当启用休眠时有效，GCTL[1].GblHibernationEn = 1） 链路状态恢复/复位表示当链路处于休眠状态时，内核收到来自主机的恢复或 USB 复位请求。软件必须将 8（恢复）写入 DCTL.ULStChngReq 位域以确认恢复/复位请求。当休眠使能时，GCTL[1].GblHibernationEn = 1，仅当 DCTL[31].Run/Stop 设置为 1 且 DSTS[29].DCNRD = 0 时，该位域 USBLnkSt 才有效。"
            - name: "rx_fifo_empty"
              bits: "17:17"
              desc: "Rx Fifo 为空。"
            - name: "reserved_16_3"
              bits: "16:3"
              desc: "保留。"
            - name: "connectspd"
              bits: "2:0"
              desc: "连接速度。指示通过 chirp 序列进行速度检测后 DWC_usb3 内核启动的速度。\n3'b000：高速（PHY时钟以30或60 MHz运行）\n3'b001：全速（PHY时钟以30或60 MHz运行）"
        - name: "USB3OTG_DGCMDPAR"
          desc: "设备通用命令参数寄存器"
          fields:
            - name: "parameter"
              bits: "31:0"
              desc: "该寄存器表示设备命令参数。这必须在设备命令之前或与设备命令一起编程。 DGCMD 寄存器中列出了可用的设备命令。"
        - name: "USB3OTG_DGCMD"
          desc: "设备通用命令寄存器"
          fields:
            - name: "reserved_31_16"
              bits: "31:16"
              desc: "保留。"
            - name: "cmdstatus"
              bits: "15:12"
              desc: "命令状态：\n1'b1： CmdErr：表示设备控制器在处理命令时遇到错误。\n1'b0：表示命令成功"
            - name: "reserved_11_10"
              bits: "11:10"
              desc: "保留。"
            - name: "cmdact"
              bits: "9:9"
              desc: "命令激活。软件将该位设置为 1 以使设备控制器能够执行通用命令。设备控制器执行命令后将该位设置为 0。"
            - name: "cmdioc"
              bits: "8:8"
              desc: "完成时命令中断。当该位被设置时，设备控制器在执行命令后发出通用命令完成事件。\n请注意，该中断映射到 DCFG.IntrNum。\n注意：如果 DCTL.RunStop 位域为 0，则该位域不得设置为 1。"
            - name: "cmdtyp"
              bits: "7:0"
              desc: "命令类型。指定软件驱动程序请求内核执行的命令类型。\n8'h0：保留\n8'h1：设置端点配置，参数为 64 位或 96 位\n8'h2：设置端点传输资源配置，参数为 32 位\n8'h3：获取端点状态，无需参数\n8'h4：清除 STALL（参见设置 STALL），无需参数\n8'h5：开始传输，参数为 64 位\n8'h6：更新传输，无需参数\n8'h7：结束传输，无需参数\n8'h8：开始新配置，无需参数"
        - name: "USB3OTG_DALEPENA"
          desc: "设备活动 USB 端点使能寄存器"
          fields:
            - name: "usbactep"
              bits: "31:0"
              desc: "USB 活动端点。该位域指示 USB 端点在当前配置和接口中是否处于活动状态。适用于 USB IN 端点 0~15 和 OUT 端点 0~15，32 个可能的端点各一位。偶数为 USB OUT 端点，奇数为 USB IN 端点，如下：\n位[0]：USB EP0-OUT 位[1]：USB EP0-IN 位[2]：USB EP1-OUT位[3]：USB EP1-IN\n...对该寄存器进行编程的实体必须设置位 0 和 1，因为它们启用在 USBReset 后映射到物理端点（资源）的控制端点。在检测到 USB 复位事件后，硬件会清除所有端点（EP0-OUT 和 EP0-IN 除外）的这些位。收到 SetConfiguration 和 SetInterface 请求后，应用程序必须相应地对端点寄存器进行编程并设置这些位。"
        - name: "USB3OTG_DEPnCMDPAR2"
          desc: "设备物理端点-n命令参数2寄存器，偏移量(0xc800 + 4*n)，n=0~12"
          fields:
            - name: "parameter"
              bits: "31:0"
              desc: "该寄存器表示物理端点命令参数\n2. 在发出命令之前必须对其进行编程。"
        - name: "USB3OTG_DEPnCMDPAR1"
          desc: "设备物理端点-n命令参数1寄存器，偏移量(0xc804 + 4*n)，n=0~12"
          fields:
            - name: "parameter"
              bits: "31:0"
              desc: "该寄存器表示物理端点命令参数\n1. 发出命令之前必须对其进行编程。"
        - name: "USB3OTG_DEPnCMDPAR0"
          desc: "设备物理端点-n命令参数0寄存器，偏移量(0xc808 + 4*n)，n=0~12"
          fields:
            - name: "parameter"
              bits: "31:0"
              desc: "该寄存器表示物理端点命令参数\n0. 发出命令之前必须对其进行编程。"
        - name: "USB3OTG_DEPnCMD"
          desc: "设备物理端点-n命令寄存器，偏移量(0xc80c + 4*n)，n=0~12"
          fields:
            - name: "commandparam"
              bits: "31:16"
              desc: "写入该寄存器时的命令参数或事件参数：\n对于开始传输命令：分配给此传输的 16 位 StreamID。对于应用于同步端点的开始传输命令：\nStartMicroFramNum，表示第一个TRB适用的（微）帧号。对于更新传输、结束传输和开始新配置命令： [22:16]：传输资源索引 (XferRscIdx)。为传输分配的硬件传输资源索引，该索引是响应“开始传输”命令而返回的。应用程序软件为“开始新配置”命令分配的传输资源索引。读取该寄存器时的事件参数 (EventParam)。"
            - name: "cmdstatus"
              bits: "15:12"
              desc: "命令完成状态。该信息的格式与端点命令完成事件的位 15:12 相同。"
            - name: "hipri_forcerm"
              bits: "11:11"
              desc: "HighPriority：仅对开始传输命令有效。 ForceRM：仅对结束传输命令有效。 ClearPendIN：仅对清除 STALL命令有效。当发出 清除 STALL 命令时，软件置位该位以清除卡在较低层的任何挂起的 IN 事务（在该端点上）。"
            - name: "cmdact"
              bits: "10:10"
              desc: "命令激活。软件将该位设置为 1 以使设备端点控制器能够执行通用命令。当 CmdStatus 位域有效并且端点准备好接受另一个命令时，设备控制器将该位设置为 0。这并不意味着先前发出的命令的所有效果都已发生。"
            - name: "reserved_9"
              bits: "9:9"
              desc: "保留。"
            - name: "cmdioc"
              bits: "8:8"
              desc: "完成时命令中断。当该位被设置时，设备控制器在执行命令后发出通用端点命令完成事件。\n请注意，该中断映射到 DEPCFG.IntrNum。当执行DEPCFG命令时，命令完成中断转到当前命令中DEPCFG.IntrNum指向的中断。\n注意：如果 DCTL.RunStop 位域为 0，则该位域不得设置为 1。"
            - name: "reserved_7_4"
              bits: "7:4"
              desc: "保留。"
            - name: "cmdtyp"
              bits: "3:0"
              desc: "命令类型。指定软件驱动程序请求内核执行的命令类型。\n4'h0：保留\n4'h1：设置端点配置，参数为 64 位或 96 位\n4'h2：设置端点传输资源配置，参数为 32 位\n4'h3：获取端点状态，无需参数\n4'h4：设置 STALL，无需参数\n4'h5：清除 STALL（参见设置 STALL），无需参数\n4'h6：开始传输，参数为 64 位\n4'h7：更新传输，无需参数\n4'h8：结束传输，无需参数\n4'h9：开始新配置，无需参数"
