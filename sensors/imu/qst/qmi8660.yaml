            desc: "INT2 FIFO 满中断使能"
          - name: i2en_f_wtm
            bits: "6:6"
            roles: [interrupt_enable_bit, fifo_watermark_interrupt]
            event: fifo_watermark
            target: int2
            desc: "INT2 FIFO 水位线中断使能"
          - name: i2en_f_ovf
            bits: "5:5"
