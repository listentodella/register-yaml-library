          - name: ibien_tap3p
            bits: "4:4"
            desc: "IBI 三击 Tap 中断使能"
          - name: ibien_tap2
            bits: "3:3"
            desc: "IBI 双击 Tap 中断使能"
          - name: ibien_tap1
            bits: "2:2"
            desc: "IBI 单击 Tap 中断使能"
          - name: ibien_mot_b
            bits: "1:1"
            desc: "IBI Motion B 中断使能"
          - name: ibien_mot_a
            bits: "0:0"
            desc: "IBI Motion A 中断使能"

      - addr: 0x4E
        name: INTIBI_CTL2
        access: RW
        width: 1
        desc: "I2C IBI 中断使能寄存器 2（保留位）"
        fields:
          - name: ibien_rsvd2
            bits: "2:2"
            desc: "保留"
          - name: ibien_rsvd1
            bits: "1:1"
            desc: "保留"
          - name: ibien_rsvd0
            bits: "0:0"
            desc: "保留"

      - addr: 0x4F
        name: FIFO_TRIG_SRC0
        access: RW
        width: 1
        desc: "FIFO 触发源选择寄存器 0，配置哪些事件可触发 FIFO 停止采集"
        fields:
          - name: ftrig_orient
            bits: "7:7"
            desc: "姿态检测事件触发 FIFO"
          - name: ftrig_step_det
            bits: "6:6"
            desc: "计步检测事件触发 FIFO"
          - name: ftrig_step_th
            bits: "5:5"
            desc: "计步阈值事件触发 FIFO"
          - name: ftrig_tap3p
            bits: "4:4"
            desc: "三击 Tap 事件触发 FIFO"
          - name: ftrig_tap2
            bits: "3:3"
            desc: "双击 Tap 事件触发 FIFO"
          - name: ftrig_tap1
            bits: "2:2"
            desc: "单击 Tap 事件触发 FIFO"
          - name: ftrig_mot_b
            bits: "1:1"
            desc: "Motion B 事件触发 FIFO"
          - name: ftrig_mot_a
            bits: "0:0"
            desc: "Motion A 事件触发 FIFO"

      - addr: 0x50
        name: FIFO_TRIG_SRC1
        access: RW
        width: 1
        desc: "FIFO 触发源选择寄存器 1（保留位）"
        fields:
          - name: ftrig_rsvd2
            bits: "2:2"
            desc: "保留"
          - name: trig_rsvd1
            bits: "1:1"
            desc: "保留"
          - name: ftrig_rsvd0
            bits: "0:0"
            desc: "保留"

      - addr: 0x51
        name: FIFO_WTM_TH_L
        access: RW
        width: 1
        desc: "FIFO 水位线阈值低字节（单位为 FIFO frame）"
        fields:
          - name: fwtm_th
            bits: "7:0"
            desc: "FIFO 水位线阈值 [7:0]，单位为 FIFO frame\n注：高位 [9:8] 在 FIFO_CTL0.fwtm_th"

      - addr: 0x52
        name: FIFO_CTL0
        access: RW
        width: 1
        desc: "FIFO 控制寄存器 0，配置各轴数据存储使能及水位线高位"
        fields:
          - name: f_gzen
            bits: "7:7"
            desc: "FIFO 陀螺仪 Z 轴数据存储使能"
          - name: f_gyen
            bits: "6:6"
            desc: "FIFO 陀螺仪 Y 轴数据存储使能"
          - name: f_gxen
            bits: "5:5"
            desc: "FIFO 陀螺仪 X 轴数据存储使能"
          - name: f_azen
            bits: "4:4"
            desc: "FIFO 加速度计 Z 轴数据存储使能"
          - name: f_ayen
            bits: "3:3"
            desc: "FIFO 加速度计 Y 轴数据存储使能"
          - name: f_axen
            bits: "2:2"
            desc: "FIFO 加速度计 X 轴数据存储使能"
          - name: fwtm_th
            bits: "1:0"
            desc: "FIFO 水位线阈值 [9:8]，与 FIFO_WTM_TH_L[7:0] 拼合，单位为 FIFO frame"

      - addr: 0x53
        name: FIFO_CTL1
        access: RW
        width: 1
        desc: "FIFO 控制寄存器 1，配置 FIFO 工作模式及温度数据存储"
        fields:
          - name: f_mode
            bits: "7:6"
            desc: "FIFO 工作模式\n00 = 关闭\n01 = FIFO 模式（满后停止）\n10 = Stream 模式（满后覆盖最旧数据）\n11 = 触发模式（事件触发后停止）"
          - name: f_ten
            bits: "3:3"
            desc: "FIFO 温度数据存储使能\n0 = 不存储\n1 = 存储温度数据"

      - addr: 0x54
        name: FIFO_STATUSL
        access: RO
        width: 1
        roles: [fifo_status, fifo_count]
        desc: "FIFO 状态寄存器低字节，读取当前 FIFO 中的字节数"
        fields:
          - name: fbytecnt
            bits: "7:0"
            roles: [fifo_count_low]
            desc: "FIFO 当前字节数 [7:0]，注：高位 [11:8] 在 FIFO_STATUSH"

      - addr: 0x55
        name: FIFO_STATUSH
        access: RO
        width: 1
        roles: [fifo_status, fifo_count]
        desc: "FIFO 状态寄存器高字节"
        fields:
          - name: f_full
            bits: "7:7"
            roles: [fifo_full]
            event: fifo_full
            desc: "FIFO 满标志\n0 = 未满\n1 = 已满"
          - name: f_wtm
            bits: "6:6"
            roles: [fifo_watermark]
            event: fifo_watermark
            desc: "FIFO 达到水位线标志"
          - name: f_trigseen
            bits: "5:5"
            roles: [fifo_trigger_seen]
            desc: "FIFO 触发事件已发生（仅触发模式有效）"
          - name: f_nemp
            bits: "4:4"
            roles: [fifo_non_empty]
            desc: "FIFO 非空标志\n0 = FIFO 为空\n1 = FIFO 中有数据"
          - name: fbytecnt
            bits: "3:0"
            roles: [fifo_count_high]
            desc: "FIFO 当前字节数 [11:8]，与 FIFO_STATUSL[7:0] 拼合"

      - addr: 0x56
        name: FIFO_PAST
        access: RO
        width: 1
        desc: "FIFO 满后写入尝试计数，读取后自动清零"
        fields:
          - name: f_past
            bits: "7:0"
            desc: "FIFO 满后尝试写入次数，计数器饱和后保持最大值，读取后清零"

      - addr: 0x57
        name: FIFO_DATA
        access: RO
        width: 1
        roles: [fifo_data]
        no_dump: true
        no_dump_reason: "FIFO 顺序读取专用寄存器，单次独立读取会破坏 FIFO 指针和数据顺序，必须通过批量连续读取访问"
        desc: "FIFO 数据输出寄存器，每次读取返回 FIFO 中下一个字节"
        fields:
          - name: f_data
            bits: "7:0"
            roles: [fifo_data_byte]
            desc: "FIFO 读取数据"

      - addr: 0x58
        name: INT_HELPER
        access: RO
        width: 4
        multi_byte: true
        roles: [interrupt_status_snapshot]
        read_clear: true
        desc: "中断状态寄存器逻辑视图（0x58~0x5B 四字节联合读取），读取后清零"
        alias_note: "与 INT_STATUS0/1/2/3 地址重叠，为四字节批量读取视图"
        fields:
          - name: status0
            bits: "7:0"
            desc: "INT_STATUS0 内容 [7:0]，见 INT_STATUS0 寄存器定义"
          - name: status1
            bits: "15:8"
            desc: "INT_STATUS1 内容 [7:0]，见 INT_STATUS1 寄存器定义"
          - name: status2
            bits: "23:16"
            desc: "INT_STATUS2 内容 [7:0]，见 INT_STATUS2 寄存器定义"
          - name: status3
            bits: "31:24"
            desc: "INT_STATUS3 内容 [7:0]，见 INT_STATUS3 寄存器定义"

      - addr: 0x58
        name: INT_STATUS0
        access: RO
        width: 1
        roles: [interrupt_status]
        read_clear: true
        desc: "中断状态寄存器 0，读取后自动清零！"
        alias_note: "与 INT_HELPER 地址重叠，为单字节独立视图"
        fields:
          - name: int_f_full
            bits: "7:7"
            roles: [interrupt_status_bit, fifo_full_interrupt]
            event: fifo_full
            action_hint: clear_fifo
            desc: "FIFO 满中断状态"
          - name: int_f_wtm
            bits: "6:6"
            roles: [interrupt_status_bit, fifo_watermark_interrupt]
            event: fifo_watermark
            action_hint: read_fifo
            desc: "FIFO 水位线中断状态"
          - name: int_f_ovf
            bits: "5:5"
            roles: [interrupt_status_bit, fifo_overflow_interrupt]
            event: fifo_overflow
            action_hint: clear_fifo
            desc: "FIFO 溢出中断状态"
          - name: int_cmddone
            bits: "4:4"
            desc: "命令完成中断状态"
          - name: int_gdrdy_ui
            bits: "1:1"
            roles: [interrupt_status_bit, gyro_drdy_interrupt]
            event: gyro_drdy
            action_hint: read_data
            ignore_by_default: true
            desc: "陀螺仪数据就绪中断状态（UI 接口）"
          - name: int_adrdy_ui
            bits: "0:0"
            roles: [interrupt_status_bit, accel_drdy_interrupt]
            event: accel_drdy
            action_hint: read_data
            ignore_by_default: true
            desc: "加速度计数据就绪中断状态（UI 接口）"

      - addr: 0x59
        name: INT_STATUS1
        access: RO
        width: 1
        roles: [interrupt_status]
        read_clear: true
        desc: "中断状态寄存器 1，读取后自动清零！"
        fields:
          - name: int_orient
            bits: "7:7"
            desc: "姿态检测中断状态"
          - name: int_step_det
            bits: "6:6"
            desc: "计步检测中断状态"
          - name: int_step_th
            bits: "5:5"
            desc: "计步阈值中断状态"
          - name: int_tap3p
            bits: "4:4"
            desc: "三击 Tap 中断状态"
          - name: int_tap2
            bits: "3:3"
            desc: "双击 Tap 中断状态"
          - name: int_tap1
            bits: "2:2"
            desc: "单击 Tap 中断状态"
          - name: int_mot_b
            bits: "1:1"
            roles: [interrupt_status_bit, motion_b_interrupt]
            event: motion_b
            action_hint: report_event
            desc: "Motion B 中断状态"
          - name: int_mot_a
            bits: "0:0"
            desc: "Motion A 中断状态"

      - addr: 0x5A
        name: INT_STATUS2
        access: RO
        width: 1
        roles: [interrupt_status]
        read_clear: true
        desc: "中断状态寄存器 2，读取后自动清零！（保留位）"
        fields:
          - name: int_rsvd2
            bits: "2:2"
            desc: "保留"
          - name: int_rsvd1
            bits: "1:1"
            desc: "保留"
          - name: int_rsvd0
            bits: "0:0"
            desc: "保留"

      - addr: 0x5B
        name: INT_STATUS3
        access: RO
        width: 1
        roles: [interrupt_status]
        read_clear: true
        desc: "中断状态寄存器 3，读取后自动清零！OIS 接口数据就绪状态"
        fields:
          - name: int_gdrdy_ois
            bits: "1:1"
            desc: "陀螺仪数据就绪中断状态（OIS 接口）"
          - name: int_adrdy_ois
            bits: "0:0"
            desc: "加速度计数据就绪中断状态（OIS 接口）"

      - addr: 0x5D
        name: RSVD_5D
        access: RO
        width: 1
        desc: "保留寄存器，请勿写入"
        no_dump: false

      - addr: 0x5E
        name: RSVD_5E
        access: RO
        width: 1
        desc: "保留寄存器，请勿写入"
        no_dump: false

      - addr: 0x5F
        name: RSVD_5F
        access: RO
        width: 1
        desc: "保留寄存器，请勿写入"
        no_dump: false

      - addr: 0x60
        name: DATA_ALL
        access: RO
        width: 14
        multi_byte: true
        roles: [data_block, telemetry_raw]
        desc: "传感器数据批量读取寄存器（0x60~0x6D，共 14 字节），小端序"
        fields:
          - name: gyr
            bits: "47:0"
            desc: "陀螺仪原始数据，6 字节小端序\ngx[15:0] @ byte0~1\ngy[15:0] @ byte2~3\ngz[15:0] @ byte4~5"
          - name: acc
            bits: "95:48"
            desc: "加速度计原始数据，6 字节小端序\nax[15:0] @ byte6~7\nay[15:0] @ byte8~9\naz[15:0] @ byte10~11"
          - name: tmp
            bits: "111:96"
            desc: "温度原始数据，2 字节小端序\ntemp[15:0] @ byte12~13"

      - addr: 0x7A
        name: RSVD_7A
        access: RO
        width: 1
        desc: "保留寄存器"
        no_dump: false

      - addr: 0x7B
        name: RESET
        access: WO
        width: 1
        desc: "软复位寄存器，写入特定值触发芯片复位"
        fields:
          - name: soft_reset_key
            bits: "7:0"
            desc: "软复位魔数：写入 0x98 触发软复位，复位后需等待至少 50ms 再进行通信"

      - addr: 0x7C
        name: TESTMOD0
        access: WO
        width: 1
        desc: "测试模式寄存器 0（仅内部使用）"
        fields:
          - name: test_mode0_key
            bits: "7:0"
            desc: "测试模式 0 密钥，正常使用请勿写入"

      - addr: 0x7D
        name: TESTMOD1
        access: WO
        width: 1
        desc: "测试模式寄存器 1（仅内部使用）"
        fields:
          - name: test_mode1_key
            bits: "7:0"
            desc: "测试模式 1 密钥，正常使用请勿写入"

      - addr: 0x7E
        name: PAGE0
        access: RW
        width: 1
        desc: "页切换寄存器低字节"
        alias_note: "与 PAGE_SWITCH 地址重叠，为单字节视图"
        fields:
          - name: page
            bits: "7:0"
            desc: "目标页编号低字节"

      - addr: 0x7F
        name: PAGE1
        access: RW
        width: 1
        desc: "页切换寄存器高字节"
        alias_note: "与 PAGE_SWITCH 地址重叠，为单字节视图"
        fields:
          - name: page
            bits: "7:0"
            desc: "目标页编号高字节"

      - addr: 0x7E
        name: PAGE_SWITCH
        access: RW
        width: 2
        multi_byte: true
        desc: "页切换寄存器（0x7E~0x7F 两字节联合视图），写入目标页编号完成页切换"
        alias_note: "与 PAGE0/PAGE1 地址重叠，为双字节批量操作视图"
        fields:
          - name: page0
            bits: "7:0"
            desc: "页编号低字节 [7:0]"
          - name: page1
            bits: "15:8"
            desc: "页编号高字节 [15:8]"
  OIS:
    page_id: 0xFF
    access: "SPI2 only"
    desc: "OIS 接口专用寄存器页，只能通过第二路 SPI 访问，无法通过主接口切换进入"
    registers:
      - addr: 0x00
        name: MANIDL
        access: RO
        width: 1
        desc: "制造商 ID 低字节"
        fields:
          - name: manid
            bits: "7:0"
            desc: "制造商 ID [7:0]"

      - addr: 0x01
        name: MANIDH
        access: RO
        width: 1
        desc: "制造商 ID 高字节"
        fields:
          - name: manid
            bits: "6:0"
            desc: "制造商 ID [14:8]"

      - addr: 0x02
        name: WHOAMI
        access: RO
        width: 1
        desc: "芯片身份识别寄存器，默认值 0x06"
        fields:
          - name: value
            bits: "7:0"
            desc: "WHO_AM_I 值，默认 0x06"

      - addr: 0x03
        name: PARTREV
        access: RO
        width: 1
        desc: "零件版本号"
        fields:
          - name: partrev
            bits: "7:0"
            desc: "零件版本号 [7:0]"

      - addr: 0x0B
        name: COMM_CTL
        access: RW
        width: 1
        desc: "OIS 接口通信控制寄存器"
        fields:
          - name: spi3_en_ois
            bits: "7:7"
            desc: "OIS 接口 SPI 3 线模式使能\n0 = 4 线 SPI\n1 = 3 线 SPI"

      - addr: 0x31
        name: ACTL_OIS0
        access: RW
        width: 1
        desc: "加速度计 OIS 接口控制寄存器 0，配置 ODR 及低功耗模式"
        fields:
          - name: alpmode_ois
            bits: "6:4"
            desc: "加速度计低功耗模式控制（OIS 接口）\n0 = 全功耗模式\n1 = 占空比模式，采样窗口约 80us\n2 = 占空比模式，采样窗口约 160us\n3 = 占空比模式，采样窗口约 320us\n4 = 占空比模式，采样窗口约 640us\n5 = 占空比模式，采样窗口约 1280us\n6 = 占空比模式，采样窗口约 2560us\n7 = 占空比模式，采样窗口约 5120us"
          - name: aodr_ois
            bits: "3:0"
            desc: "加速度计输出数据率（OIS 接口）\n0 = 保留\n1 = 0.78125Hz\n2 = 1.5625Hz\n3 = 3.125Hz\n4 = 6.25Hz\n5 = 12.5Hz\n6 = 25Hz\n7 = 50Hz\n8 = 100Hz\n9 = 200Hz\n10 = 400Hz\n11 = 800Hz\n12 = 1600Hz\n13 = 3200Hz\n14 = 6400Hz\n15 = 12800Hz"

      - addr: 0x32
        name: ACTL_OIS1
        access: RW
        width: 1
        desc: "加速度计 OIS 接口控制寄存器 1，配置低通滤波器及量程"
        fields:
          - name: alpf_ois
            bits: "5:3"
            desc: "加速度计低通滤波器控制（OIS 接口）\n000 = 关闭\n001~100 = 预设滤波器 1~4\n101 = 用户自定义"
          - name: afs_ois
            bits: "1:0"
            desc: "加速度计量程选择（OIS 接口）\n00 = ±4g\n01 = ±8g\n10 = ±16g\n11 = ±32g"

      - addr: 0x33
        name: GCTL_OIS0
        access: RW
        width: 1
        desc: "陀螺仪 OIS 接口控制寄存器 0，配置 ODR"
        fields:
          - name: godr_ois
            bits: "3:0"
            desc: "陀螺仪输出数据率（OIS 接口）\n0~4 = 保留\n5 = 12.5Hz\n6 = 25Hz\n7 = 50Hz\n8 = 100Hz\n9 = 200Hz\n10 = 400Hz\n11 = 800Hz\n12 = 1600Hz\n13 = 3200Hz\n14 = 6400Hz\n15 = 保留"

      - addr: 0x34
        name: GCTL_OIS1
        access: RW
        width: 1
        desc: "陀螺仪 OIS 接口控制寄存器 1，配置低通滤波器及量程"
        fields:
          - name: glpf_ois
            bits: "5:3"
            desc: "陀螺仪低通滤波器控制（OIS 接口）\n000 = 关闭\n001~100 = 预设滤波器 1~4\n101 = 用户自定义"
          - name: gfs_ois
            bits: "2:0"
            desc: "陀螺仪量程选择（OIS 接口）\n0~1 = 未定义（仅内部测试）\n2 = ±128dps\n3 = ±256dps\n4 = ±512dps\n5 = ±1024dps\n6 = ±2048dps\n7 = ±4096dps"

      - addr: 0x37
        name: ENCTL_OIS
        access: RW
        width: 1
        desc: "OIS 接口传感器使能寄存器"
        fields:
          - name: gsn_ois
            bits: "4:4"
            desc: "陀螺仪 Snooze 模式使能（OIS 接口）"
          - name: gen_ois
            bits: "1:1"
            desc: "陀螺仪使能（OIS 接口）\n0 = 关闭\n1 = 使能"
          - name: aen_ois
            bits: "0:0"
            desc: "加速度计使能（OIS 接口）\n0 = 关闭\n1 = 使能"

      - addr: 0x52
        name: DATA_ALL
        access: RO
        width: 14
        multi_byte: true
        desc: "OIS 接口传感器数据批量读取寄存器（0x52~0x5F，共 14 字节），小端序"
        fields:
          - name: gyr
            bits: "47:0"
            desc: "陀螺仪原始数据，6 字节小端序\ngx[15:0] @ byte0~1\ngy[15:0] @ byte2~3\ngz[15:0] @ byte4~5"
          - name: acc
            bits: "95:48"
            desc: "加速度计原始数据，6 字节小端序\nax[15:0] @ byte6~7\nay[15:0] @ byte8~9\naz[15:0] @ byte10~11"
          - name: tmp
            bits: "111:96"
            desc: "温度原始数据，2 字节小端序\ntemp[15:0] @ byte12~13"

      - addr: 0x66
        name: STATUS0
        access: RO
        width: 1
