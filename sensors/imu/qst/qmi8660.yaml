            desc: "超低功耗模式使能\n0 = 正常模式\n1 = 超低功耗模式"
          - name: gsn_ui
            bits: "4:4"
            desc: "陀螺仪 Snooze 模式使能（UI 接口）"
          - name: gen_ui
            bits: "1:1"
            desc: "陀螺仪使能（UI 接口）\n0 = 关闭\n1 = 使能"
          - name: aen_ui
            bits: "0:0"
            desc: "加速度计使能（UI 接口）\n0 = 关闭\n1 = 使能"

      - addr: 0x3E
        name: ENCTL_OIS
        access: RW
        width: 1
        desc: "OIS 接口传感器使能寄存器"
        fields:
          - name: gsn_ois
            bits: "4:4"
            desc: "陀螺仪 Snooze 模式使能（OIS 接口）"
          - name: gen_ois
            bits: "1:1"
            desc: "陀螺仪使能（OIS 接口）\n0 = 关闭\n1 = 使能"
          - name: aen_ois
            bits: "0:0"
            desc: "加速度计使能（OIS 接口）\n0 = 关闭\n1 = 使能"

      - addr: 0x3F
        name: ACTL_OIS0
        access: RW
        width: 1
        desc: "加速度计 OIS 接口控制寄存器 0，配置 ODR 及低功耗模式"
