        desc: "加速度计控制寄存器 0，配置 ODR、低功耗模式及高性能模式"
        fields:
          - name: ahp_mode
            bits: "7:7"
            desc: "加速度计高性能模式\n0 = 正常采样率\n1 = 双倍采样率"
          - name: alpmode_ui
            bits: "6:4"
            desc: "加速度计低功耗模式控制（UI 接口）\n0 = 全功耗模式\n1 = 占空比模式，采样窗口约 80us\n2 = 占空比模式，采样窗口约 160us\n3 = 占空比模式，采样窗口约 320us\n4 = 占空比模式，采样窗口约 640us\n5 = 占空比模式，采样窗口约 1280us\n6 = 占空比模式，采样窗口约 2560us\n7 = 占空比模式，采样窗口约 5120us"
          - name: aodr_ui
            bits: "3:0"
            desc: "加速度计输出数据率（UI 接口）\n0 = 保留\n1 = 0.78125Hz\n2 = 1.5625Hz\n3 = 3.125Hz\n4 = 6.25Hz\n5 = 12.5Hz\n6 = 25Hz\n7 = 50Hz\n8 = 100Hz\n9 = 200Hz\n10 = 400Hz\n11 = 800Hz\n12 = 1600Hz\n13 = 3200Hz\n14 = 6400Hz\n15 = 12800Hz"

      - addr: 0x37
        name: ACTL1
        access: RW
        width: 1
        desc: "加速度计控制寄存器 1，配置自测、低通滤波器及量程"
        fields:
          - name: ast
            bits: "7:7"
            desc: "加速度计自测使能\n0 = 正常模式\n1 = 自测使能"
          - name: ast_pol
            bits: "6:6"
            desc: "加速度计自测极性\n0 = 正向自测输出\n1 = 负向自测输出"
          - name: alpf_ui
            bits: "5:3"
            desc: "加速度计低通滤波器控制（UI 接口）\n000 = 关闭\n001~100 = 预设滤波器 1~4\n101 = 用户自定义\n110~111 = 保留"
          - name: afs_ui
            bits: "1:0"
            desc: "加速度计量程选择（UI 接口）\n00 = ±4g\n01 = ±8g\n10 = ±16g\n11 = ±32g"

      - addr: 0x38
        name: GCTL0
        access: RW
        width: 1
        desc: "陀螺仪控制寄存器 0，配置 ODR 及温度 ODR"
        fields:
          - name: gcal
            bits: "7:7"
            desc: "陀螺仪校准使能"
          - name: todr
            bits: "6:4"
            desc: "温度传感器输出数据率\n0 = 自动（跟随陀螺仪 ODR）\n1 = 0.78125Hz\n2 = 1.5625Hz\n3 = 3.125Hz\n4 = 6.25Hz\n5 = 12.5Hz\n6 = 25Hz\n7 = 50Hz"
          - name: godr_ui
            bits: "3:0"
            desc: "陀螺仪输出数据率（UI 接口）\n0~4 = 保留\n5 = 12.5Hz\n6 = 25Hz\n7 = 50Hz\n8 = 100Hz\n9 = 200Hz\n10 = 400Hz\n11 = 800Hz\n12 = 1600Hz\n13 = 3200Hz\n14 = 6400Hz\n15 = 保留"

      - addr: 0x39
        name: GCTL1
        access: RW
        width: 1
        desc: "陀螺仪控制寄存器 1，配置自测、低通滤波器及量程"
        fields:
          - name: gst
            bits: "7:7"
            desc: "陀螺仪自测使能\n0 = 正常模式\n1 = 自测使能"
          - name: gst_pol
            bits: "6:6"
            desc: "陀螺仪自测极性\n0 = 正向自测输出\n1 = 负向自测输出"
          - name: glpf_ui
            bits: "5:3"
            desc: "陀螺仪低通滤波器控制（UI 接口）\n000 = 关闭\n001~100 = 预设滤波器 1~4\n101 = 用户自定义\n110~111 = 保留"
          - name: gfs_ui
            bits: "2:0"
            desc: "陀螺仪量程选择（UI 接口）\n0~1 = 未定义（仅内部测试）\n2 = ±128dps\n3 = ±256dps\n4 = ±512dps\n5 = ±1024dps\n6 = ±2048dps\n7 = ±4096dps"

      - addr: 0x3A
        name: ECTL0
        access: RW
        width: 1
        desc: "事件引擎控制寄存器 0，配置 Motion A/B 的 ODR"
        fields:
          - name: mot_b_odr
            bits: "7:4"
            desc: "Motion B 输出数据率\n0 = 保留\n1 = 0.78125Hz\n2 = 1.5625Hz\n3 = 3.125Hz\n4 = 6.25Hz\n5 = 12.5Hz\n6 = 25Hz\n7 = 50Hz\n8 = 100Hz\n9 = 200Hz\n10 = 400Hz\n11~15 = 800Hz"
          - name: mot_a_odr
            bits: "3:0"
            desc: "Motion A 输出数据率，编码同 mot_b_odr"

      - addr: 0x3B
        name: ECTL1
        access: RW
        width: 1
        desc: "事件引擎控制寄存器 1，配置 Tap/计步/姿态检测的 ODR"
        fields:
          - name: tap_odr
            bits: "5:4"
            desc: "Tap 检测输出数据率 [1:0]"
          - name: ped_odr
            bits: "3:2"
            desc: "计步器输出数据率 [1:0]"
          - name: orient_odr
            bits: "1:0"
            desc: "姿态检测输出数据率 [1:0]"

      - addr: 0x3C
        name: ENGENCTL
        access: RW
        width: 1
        desc: "事件引擎功能使能寄存器"
        fields:
          - name: ped_en
            bits: "4:4"
            desc: "计步器使能\n0 = 禁用\n1 = 使能"
          - name: orient_en
            bits: "3:3"
            desc: "姿态检测使能\n0 = 禁用\n1 = 使能"
          - name: mot_b_en
            bits: "2:2"
            desc: "Motion B 检测使能\n0 = 禁用\n1 = 使能"
          - name: mot_a_en
            bits: "1:1"
            desc: "Motion A 检测使能\n0 = 禁用\n1 = 使能"
          - name: tap_en
            bits: "0:0"
            desc: "Tap 检测使能\n0 = 禁用\n1 = 使能"

      - addr: 0x3D
        name: ENCTL
        access: RW
        width: 1
        desc: "传感器主使能寄存器，控制加速度计、陀螺仪及超低功耗模式"
        fields:
          - name: ulp_mode
