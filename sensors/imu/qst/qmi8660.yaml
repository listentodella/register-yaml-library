          - name: alpmode_ois
            bits: "6:4"
            desc: "加速度计低功耗模式控制（OIS 接口）\n0 = 全功耗模式\n1 = 占空比模式，采样窗口约 80us\n2 = 占空比模式，采样窗口约 160us\n3 = 占空比模式，采样窗口约 320us\n4 = 占空比模式，采样窗口约 640us\n5 = 占空比模式，采样窗口约 1280us\n6 = 占空比模式，采样窗口约 2560us\n7 = 占空比模式，采样窗口约 5120us"
          - name: aodr_ois
            bits: "3:0"
            desc: "加速度计输出数据率（OIS 接口）\n0 = 保留\n1 = 0.78125Hz\n2 = 1.5625Hz\n3 = 3.125Hz\n4 = 6.25Hz\n5 = 12.5Hz\n6 = 25Hz\n7 = 50Hz\n8 = 100Hz\n9 = 200Hz\n10 = 400Hz\n11 = 800Hz\n12 = 1600Hz\n13 = 3200Hz\n14 = 6400Hz\n15 = 12800Hz"

      - addr: 0x40
        name: ACTL_OIS1
        access: RW
        width: 1
        desc: "加速度计 OIS 接口控制寄存器 1，配置低通滤波器及量程"
        fields:
          - name: alpf_ois
            bits: "5:3"
            desc: "加速度计低通滤波器控制（OIS 接口）\n000 = 关闭\n001~100 = 预设滤波器 1~4\n101 = 用户自定义"
          - name: afs_ois
            bits: "1:0"
            desc: "加速度计量程选择（OIS 接口）\n00 = ±4g\n01 = ±8g\n10 = ±16g\n11 = ±32g"

      - addr: 0x41
        name: GCTL_OIS0
        access: RW
        width: 1
        desc: "陀螺仪 OIS 接口控制寄存器 0，配置 ODR"
        fields:
          - name: godr_ois
            bits: "3:0"
            desc: "陀螺仪输出数据率（OIS 接口）\n0~4 = 保留\n5 = 12.5Hz\n6 = 25Hz\n7 = 50Hz\n8 = 100Hz\n9 = 200Hz\n10 = 400Hz\n11 = 800Hz\n12 = 1600Hz\n13 = 3200Hz\n14 = 6400Hz\n15 = 保留"

      - addr: 0x42
        name: GCTL_OIS1
        access: RW
        width: 1
        desc: "陀螺仪 OIS 接口控制寄存器 1，配置低通滤波器及量程"
        fields:
          - name: glpf_ois
            bits: "5:3"
            desc: "陀螺仪低通滤波器控制（OIS 接口）\n000 = 关闭\n001~100 = 预设滤波器 1~4\n101 = 用户自定义"
          - name: gfs_ois
            bits: "2:0"
            desc: "陀螺仪量程选择（OIS 接口）\n0~1 = 未定义（仅内部测试）\n2 = ±128dps\n3 = ±256dps\n4 = ±512dps\n5 = ±1024dps\n6 = ±2048dps\n7 = ±4096dps"

      - addr: 0x43
        name: INT1_CFG
        access: RW
        width: 1
        roles: [interrupt_pin_config]
        target: int1
        desc: "INT1 引脚配置寄存器，配置触发模式、电平极性及开漏"
        fields:
          - name: i1_1ms_sel
            bits: "4:4"
            roles: [interrupt_pin_pulse_width]
            target: int1
            desc: "INT1 脉冲宽度选择（仅脉冲模式有效）\n0 = 40us 脉冲（默认）\n1 = 1ms 脉冲"
          - name: i1_mode
            bits: "3:2"
            roles: [interrupt_pin_mode]
            target: int1
            desc: "INT1 触发模式\n00 = 禁用\n01 = 原始模式（实时电平）\n10 = 锁存模式（读状态寄存器清除）\n11 = 脉冲模式"
          - name: i1_lvl
            bits: "1:1"
            roles: [interrupt_pin_polarity]
            target: int1
            desc: "INT1 有效电平\n0 = 低电平有效\n1 = 高电平有效（开漏模式下禁止使用）"
          - name: i1_od
            bits: "0:0"
            roles: [interrupt_pin_drive]
            target: int1
            desc: "INT1 开漏输出使能\n0 = 推挽输出\n1 = 开漏输出（不可与 i1_lvl=1 同时使用）"

      - addr: 0x44
        name: INT1_CTL0
        access: RW
        width: 1
