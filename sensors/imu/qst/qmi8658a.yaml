schema_version: 1
sensor: QMI8658A
vendor: QST
family: QMI8658
device_type: imu
source:
  title: "QMI8658A Datasheet"
  version: "Rev D"
  revision: "Rev D"
  document: "QMI8658A Datasheet Rev D"
  url: "https://www.qstcorp.com/imu_prod/QMI8658"
  license: "QST vendor documentation; redistribution terms not specified"
  notice: "Generated register description; verify source-document redistribution rights before reuse"
who_am_i:
  reg: 0x00
  values:
    - value: 0x05
      desc: "QMI8658A 芯片身份识别值"

pages:
  UI:
    page_id: 0x00
    access: "SPI / I2C / I3C"
    desc: "主 UI 寄存器页，通过 SPI、I2C 或 I3C 主接口访问"
    registers:
      - addr: 0x00
        name: WHO_AM_I
        access: RO
        width: 1
        desc: "芯片身份识别寄存器，默认值 0x05"
        fields:
          - name: who_am_i
            bits: "7:0"
            desc: "芯片身份识别值\n0x05 = QMI8658A/QST 传感器标识"

      - addr: 0x01
        name: REVISION_ID
        access: RO
        width: 1
        desc: "芯片版本号寄存器；手册寄存器描述表给出默认值 0x7C，寄存器总览中列出 0x68"
        fields:
          - name: revision_id
            bits: "7:0"
            desc: "芯片版本号"

      - addr: 0x02
        name: CTRL1
        access: RW
        width: 1
        desc: "串行接口和传感器基础控制寄存器，默认值 0x20"
        fields:
          - name: sim
            bits: "7:7"
            desc: "SPI 接口模式\n0 = 4 线 SPI\n1 = 3 线 SPI"
          - name: addr_ai
            bits: "6:6"
            desc: "串行接口地址自增控制\n0 = 地址不自增\n1 = 地址自动递增"
          - name: be
            bits: "5:5"
            desc: "串行接口读数据端序\n0 = 小端序\n1 = 大端序"
          - name: int2_en
            bits: "4:4"
            desc: "INT2 引脚输出使能\n0 = INT2 高阻态\n1 = INT2 输出使能"
          - name: int1_en
            bits: "3:3"
            desc: "INT1 引脚输出使能\n0 = INT1 高阻态\n1 = INT1 输出使能"
          - name: fifo_int_sel
            bits: "2:2"
            desc: "FIFO 中断映射选择\n0 = FIFO 中断映射到 INT2\n1 = FIFO 中断映射到 INT1"
          - name: reserved
            bits: "1:1"
            desc: "保留"
          - name: sensor_disable
            bits: "0:0"
            desc: "内部高速振荡器控制\n0 = 使能内部高速振荡器\n1 = 禁用内部高速振荡器"

      - addr: 0x03
        name: CTRL2
        access: RW
        width: 1
        desc: "加速度计设置寄存器：自测、量程和输出数据率，默认值 0x00"
        fields:
          - name: ast
            bits: "7:7"
            desc: "加速度计自测使能\n0 = 禁用加速度计自测\n1 = 使能加速度计自测"
          - name: afs
            bits: "6:4"
            desc: "加速度计量程选择\n0 = ±2g\n1 = ±4g\n2 = ±8g\n3 = ±16g\n4~7 = 不适用"
          - name: aodr
            bits: "3:0"
            desc: "加速度计输出数据率（ODR）选择；低功耗模式仅在陀螺仪关闭时可用\n0 = 仅加速度计模式不可用，6DOF 7174.4Hz，普通模式，占空比 100%\n1 = 仅加速度计模式不可用，6DOF 3587.2Hz，普通模式，占空比 100%\n2 = 仅加速度计模式不可用，6DOF 1793.6Hz，普通模式，占空比 100%\n3 = 仅加速度计 1000Hz，6DOF 896.8Hz，普通模式，占空比 100%\n4 = 仅加速度计 500Hz，6DOF 448.4Hz，普通模式，占空比 100%\n5 = 仅加速度计 250Hz，6DOF 224.2Hz，普通模式，占空比 100%\n6 = 仅加速度计 125Hz，6DOF 112.1Hz，普通模式，占空比 100%\n7 = 仅加速度计 62.5Hz，6DOF 56.05Hz，普通模式，占空比 100%\n8 = 仅加速度计 31.25Hz，6DOF 28.025Hz，普通模式，占空比 100%\n9 = 不适用\n10 = 不适用\n11 = 不适用\n12 = 仅加速度计 128Hz，6DOF 不适用，低功耗模式，占空比 100%\n13 = 仅加速度计 21Hz，6DOF 不适用，低功耗模式，占空比 58%\n14 = 仅加速度计 11Hz，6DOF 不适用，低功耗模式，占空比 31%\n15 = 仅加速度计 3Hz，6DOF 不适用，低功耗模式，占空比 8.5%"

      - addr: 0x04
        name: CTRL3
        access: RW
        width: 1
        desc: "陀螺仪设置寄存器：自测、量程和输出数据率，默认值 0x00"
        fields:
          - name: gst
            bits: "7:7"
            desc: "陀螺仪自测使能\n0 = 禁用陀螺仪自测\n1 = 使能陀螺仪自测"
          - name: gfs
            bits: "6:4"
            desc: "陀螺仪量程选择\n0 = ±16dps\n1 = ±32dps\n2 = ±64dps\n3 = ±128dps\n4 = ±256dps\n5 = ±512dps\n6 = ±1024dps\n7 = ±2048dps"
          - name: godr
            bits: "3:0"
            desc: "陀螺仪输出数据率（ODR）选择\n0 = 7174.4Hz，普通模式，占空比 100%\n1 = 3587.2Hz，普通模式，占空比 100%\n2 = 1793.6Hz，普通模式，占空比 100%\n3 = 896.8Hz，普通模式，占空比 100%\n4 = 448.4Hz，普通模式，占空比 100%\n5 = 224.2Hz，普通模式，占空比 100%\n6 = 112.1Hz，普通模式，占空比 100%\n7 = 56.05Hz，普通模式，占空比 100%\n8 = 28.025Hz，普通模式，占空比 100%\n9~15 = 不适用"

      - addr: 0x05
        name: RSVD_05
        access: RW
        width: 1
        desc: "保留寄存器"
        no_dump: false

      - addr: 0x06
        name: CTRL5
        access: RW
        width: 1
        desc: "传感器数据处理和低通滤波器设置寄存器，默认值 0x00"
        fields:
          - name: reserved7
            bits: "7:7"
            desc: "保留"
          - name: glpf_mode
            bits: "6:5"
            desc: "陀螺仪低通滤波器带宽模式\n0 = ODR 的 2.66%\n1 = ODR 的 3.63%\n2 = ODR 的 5.39%\n3 = ODR 的 13.37%"
          - name: glpf_en
            bits: "4:4"
            desc: "陀螺仪低通滤波器使能\n0 = 禁用陀螺仪低通滤波器\n1 = 使能陀螺仪低通滤波器，带宽由 gLPF_MODE 选择"
          - name: reserved3
            bits: "3:3"
            desc: "保留"
          - name: alpf_mode
            bits: "2:1"
            desc: "加速度计低通滤波器带宽模式\n0 = ODR 的 2.66%\n1 = ODR 的 3.63%\n2 = ODR 的 5.39%\n3 = ODR 的 13.37%"
          - name: alpf_en
            bits: "0:0"
            desc: "加速度计低通滤波器使能\n0 = 禁用加速度计低通滤波器\n1 = 使能加速度计低通滤波器，带宽由 aLPF_MODE 选择"

      - addr: 0x07
        name: RSVD_07
        access: RW
        width: 1
        desc: "保留寄存器"
        no_dump: false

      - addr: 0x08
        name: CTRL7
        access: RW
        width: 1
        desc: "传感器使能和数据读取配置寄存器，默认值 0x00"
        fields:
          - name: sync_sample
            bits: "7:7"
            desc: "SyncSample 模式使能\n0 = 禁用 SyncSample 模式\n1 = 使能 SyncSample 模式"
          - name: reserved6
            bits: "6:6"
            desc: "保留"
          - name: drdy_dis
            bits: "5:5"
            desc: "DRDY 输出控制\n0 = DRDY 使能并输出到 INT2\n1 = DRDY 禁用，不输出到 INT2"
          - name: gsn
            bits: "4:4"
            desc: "陀螺仪 Snooze 模式控制，仅在 gEN=1 时有效\n0 = 陀螺仪全功能模式\n1 = 陀螺仪 Snooze 模式"
          - name: reserved3_2
            bits: "3:2"
            desc: "保留"
          - name: gen
            bits: "1:1"
            desc: "陀螺仪使能\n0 = 禁用陀螺仪\n1 = 使能陀螺仪"
          - name: aen
            bits: "0:0"
            desc: "加速度计使能\n0 = 禁用加速度计\n1 = 使能加速度计"

      - addr: 0x09
        name: CTRL8
        access: RW
        width: 1
        desc: "运动检测控制寄存器，默认值 0x00"
        fields:
          - name: ctrl9_handshake_type
            bits: "7:7"
            desc: "CTRL9 握手方式选择\n0 = 使用 INT1 作为 CTRL9 握手信号\n1 = 使用 STATUSINT.bit7 作为 CTRL9 握手状态"
          - name: activity_int_sel
            bits: "6:6"
            desc: "活动检测事件中断引脚选择\n0 = 活动检测事件中断输出到 INT2\n1 = 活动检测事件中断输出到 INT1"
          - name: reserved5
            bits: "5:5"
            desc: "保留"
          - name: pedo_en
            bits: "4:4"
            desc: "计步器引擎使能\n0 = 禁用计步器引擎\n1 = 使能计步器引擎"
          - name: sig_motion_en
            bits: "3:3"
            desc: "显著运动检测使能\n0 = 禁用显著运动检测引擎\n1 = 使能显著运动检测引擎"
          - name: no_motion_en
            bits: "2:2"
            desc: "无运动检测使能\n0 = 禁用无运动检测引擎\n1 = 使能无运动检测引擎"
          - name: any_motion_en
            bits: "1:1"
            desc: "任意运动检测使能\n0 = 禁用任意运动检测引擎\n1 = 使能任意运动检测引擎"
          - name: tap_en
            bits: "0:0"
            desc: "Tap 检测引擎使能\n0 = 禁用 Tap 检测引擎\n1 = 使能 Tap 检测引擎"

      - addr: 0x0A
        name: CTRL9
        access: RW
        width: 1
        roles: [host_command]
        desc: "主机命令寄存器。写入预定义命令值执行 CTRL9 协议；命令完成后 STATUSINT.ctrl9_cmd_done 置位，主机需写入 CTRL_CMD_ACK(0x00) 结束协议"
        fields:
          - name: command
            bits: "7:0"
            roles: [host_command_value]
            desc: "CTRL9 命令值\n0x00 = CTRL_CMD_ACK：确认命令完成并结束协议\n0x04 = CTRL_CMD_RST_FIFO：复位 FIFO\n0x05 = CTRL_CMD_REQ_FIFO：请求读取 FIFO 数据\n0x08 = CTRL_CMD_WRITE_WOM_SETTING：配置并使能运动唤醒（Wake on Motion）\n0x09 = CTRL_CMD_ACCEL_HOST_DELTA_OFFSET：修改加速度计偏移\n0x0A = CTRL_CMD_GYRO_HOST_DELTA_OFFSET：修改陀螺仪偏移\n0x0C = CTRL_CMD_CONFIGURE_TAP：配置 Tap 检测\n0x0D = CTRL_CMD_CONFIGURE_PEDOMETER：配置计步器\n0x0E = CTRL_CMD_CONFIGURE_MOTION：配置任意运动、无运动和显著运动检测\n0x0F = CTRL_CMD_RESET_PEDOMETER：复位计步器步数\n0x10 = CTRL_CMD_COPY_USID：复制 USID 和固件版本到 UI 寄存器\n0x11 = CTRL_CMD_SET_RPU：配置 IO 上拉电阻\n0x12 = CTRL_CMD_AHB_CLOCK_GATING：配置内部 AHB 时钟门控\n0xA2 = CTRL_CMD_ON_DEMAND_CALIBRATION：执行陀螺仪按需校准\n0xAA = CTRL_CMD_APPLY_GYRO_GAINS：恢复已保存的陀螺仪增益"

      - addr: 0x0B
        name: CAL1_L
        access: RW
        width: 1
        desc: "CTRL9 参数传输寄存器 CAL1 低字节"
        fields:
          - name: cal1_l
            bits: "7:0"
            desc: "CAL1 低字节"

      - addr: 0x0C
        name: CAL1_H
        access: RW
        width: 1
        desc: "CTRL9 参数传输寄存器 CAL1 高字节"
        fields:
          - name: cal1_h
            bits: "7:0"
            desc: "CAL1 高字节"

      - addr: 0x0D
        name: CAL2_L
        access: RW
        width: 1
        desc: "CTRL9 参数传输寄存器 CAL2 低字节"
        fields:
          - name: cal2_l
            bits: "7:0"
            desc: "CAL2 低字节"

      - addr: 0x0E
        name: CAL2_H
        access: RW
        width: 1
        desc: "CTRL9 参数传输寄存器 CAL2 高字节"
        fields:
          - name: cal2_h
            bits: "7:0"
            desc: "CAL2 高字节"

      - addr: 0x0F
        name: CAL3_L
        access: RW
        width: 1
        desc: "CTRL9 参数传输寄存器 CAL3 低字节"
        fields:
          - name: cal3_l
            bits: "7:0"
            desc: "CAL3 低字节"

      - addr: 0x10
        name: CAL3_H
        access: RW
        width: 1
        desc: "CTRL9 参数传输寄存器 CAL3 高字节"
        fields:
          - name: cal3_h
            bits: "7:0"
            desc: "CAL3 高字节"

      - addr: 0x11
        name: CAL4_L
        access: RW
        width: 1
        desc: "CTRL9 参数传输寄存器 CAL4 低字节"
        fields:
          - name: cal4_l
            bits: "7:0"
            desc: "CAL4 低字节"

      - addr: 0x12
        name: CAL4_H
        access: RW
        width: 1
        desc: "CTRL9 参数传输寄存器 CAL4 高字节"
        fields:
          - name: cal4_h
            bits: "7:0"
            desc: "CAL4 高字节"

      - addr: 0x13
        name: FIFO_WTM_TH
        access: RW
        width: 1
        desc: "FIFO 水位线阈值寄存器，单位为 ODR 样本数"
        fields:
          - name: fifo_wtm
            bits: "7:0"
            desc: "触发 FIFO 水位线所需的 ODR 样本数量"

      - addr: 0x14
        name: FIFO_CTRL
        access: RW
        width: 1
        desc: "FIFO 控制寄存器"
        fields:
          - name: fifo_rd_mode
            bits: "7:7"
            desc: "FIFO 读写模式\n0 = 写模式，使能的传感器数据可写入 FIFO\n1 = 读模式，可通过 FIFO_DATA 读取 FIFO 数据；该位由 CTRL_CMD_REQ_FIFO 置位，读完后必须清零"
          - name: reserved6_4
            bits: "6:4"
            desc: "保留"
          - name: fifo_size
            bits: "3:2"
            desc: "FIFO 样本深度\n0 = 16 个样本\n1 = 32 个样本\n2 = 64 个样本\n3 = 128 个样本"
          - name: fifo_mode
            bits: "1:0"
            desc: "FIFO 工作模式\n0 = 旁路模式（Bypass），FIFO 禁用\n1 = FIFO 模式\n2 = 流模式（Stream）\n3 = 保留"

      - addr: 0x15
        name: FIFO_SMPL_CNT
        access: RO
        width: 1
        roles: [fifo_status, fifo_count]
        desc: "FIFO 样本计数低 8 位，单位为 word（2 字节）"
        fields:
          - name: fifo_smpl_cnt
            bits: "7:0"
            roles: [fifo_count_low]
            desc: "FIFO 样本计数 [7:0]"

      - addr: 0x16
        name: FIFO_STATUS
        access: RO
        width: 1
        roles: [fifo_status, fifo_count]
        desc: "FIFO 状态寄存器"
        fields:
          - name: fifo_full
            bits: "7:7"
            roles: [fifo_full]
            event: fifo_full
            desc: "FIFO 满标志\n0 = FIFO 未满\n1 = FIFO 已满"
          - name: fifo_wtm
            bits: "6:6"
            roles: [fifo_watermark]
            event: fifo_watermark
            desc: "FIFO 水位线标志\n0 = 未达到 FIFO 水位线\n1 = 已达到 FIFO 水位线"
          - name: fifo_ovflow
            bits: "5:5"
            roles: [fifo_overflow]
            event: fifo_overflow
            desc: "FIFO 溢出标志\n0 = 未发生 FIFO 溢出\n1 = 已发生 FIFO 溢出（出现数据丢弃）"
          - name: fifo_not_empty
            bits: "4:4"
            roles: [fifo_non_empty]
            desc: "FIFO 非空标志\n0 = FIFO 为空\n1 = FIFO 非空"
          - name: reserved3_2
            bits: "3:2"
            desc: "保留"
          - name: fifo_smpl_cnt
            bits: "1:0"
            roles: [fifo_count_high]
            desc: "FIFO 样本计数 [9:8]，与 FIFO_SMPL_CNT[7:0] 拼合"

      - addr: 0x17
        name: FIFO_DATA
        access: RO
        width: 1
        roles: [fifo_data]
        no_dump: true
        no_dump_reason: "FIFO 顺序读取专用寄存器，需通过 CTRL_CMD_REQ_FIFO 进入 FIFO 读模式后连续读取，普通单点读取可能破坏读取流程"
        desc: "FIFO 数据输出寄存器"
        fields:
          - name: fifo_data
            bits: "7:0"
            roles: [fifo_data_byte]
            desc: "8 位 FIFO 数据输出"

      - addr: 0x2D
        name: STATUSINT
        access: RO
        width: 1
        roles: [interrupt_status]
        desc: "传感器数据可用、锁定状态和 CTRL9 命令完成状态寄存器"
        fields:
          - name: ctrl9_cmd_done
            bits: "7:7"
            roles: [interrupt_status_bit, ctrl9_done]
            event: ctrl9_done
            action_hint: write_ctrl_cmd_ack
            desc: "CTRL9 命令完成标志\n0 = 未完成\n1 = 已完成"
          - name: reserved6_2
            bits: "6:2"
            desc: "保留"
          - name: locked
            bits: "1:1"
            desc: "SyncSample 数据锁定状态；非 SyncSample 模式下显示 INT1 电平\n0 = 传感器数据未锁定\n1 = 传感器数据已锁定"
          - name: avail
            bits: "0:0"
            roles: [data_ready]
            event: data_ready
            desc: "SyncSample 数据可用状态；非 SyncSample 模式下显示 INT2 电平\n0 = 传感器数据不可用\n1 = 传感器数据可用"

      - addr: 0x2E
        name: STATUS0
        access: RO
        width: 1
        roles: [data_ready_status]
        desc: "输出数据状态寄存器"
        fields:
          - name: reserved7_2
            bits: "7:2"
            desc: "保留"
          - name: gda
            bits: "1:1"
            roles: [gyro_drdy]
            event: gyro_drdy
            desc: "陀螺仪新数据可用\n0 = 上次读取后没有更新\n1 = 有新数据可读"
          - name: ada
            bits: "0:0"
            roles: [accel_drdy]
            event: accel_drdy
            desc: "加速度计新数据可用\n0 = 上次读取后没有更新\n1 = 有新数据可读"

      - addr: 0x2F
        name: STATUS1
        access: RO
        width: 1
        roles: [activity_status]
        desc: "活动检测状态寄存器"
        fields:
          - name: significant_motion
            bits: "7:7"
            event: significant_motion
            desc: "显著运动检测状态\n0 = 未检测到显著运动\n1 = 检测到显著运动"
          - name: no_motion
            bits: "6:6"
            event: no_motion
            desc: "无运动检测状态\n0 = 未检测到无运动事件\n1 = 检测到无运动事件"
          - name: any_motion
            bits: "5:5"
            event: any_motion
            desc: "任意运动检测状态\n0 = 未检测到任意运动\n1 = 检测到任意运动"
          - name: pedometer
            bits: "4:4"
            event: pedometer
            desc: "计步器事件状态\n0 = 未检测到步数事件\n1 = 检测到步数事件"
          - name: reserved3
            bits: "3:3"
            desc: "保留"
          - name: wom
            bits: "2:2"
            event: wake_on_motion
            desc: "运动唤醒（Wake on Motion）检测状态\n0 = 未检测到 WoM 事件\n1 = 检测到 WoM 事件"
          - name: tap
            bits: "1:1"
            event: tap
            desc: "Tap 检测状态\n0 = 未检测到 Tap\n1 = 检测到 Tap"
          - name: reserved0
            bits: "0:0"
            desc: "保留"

      - addr: 0x30
        name: TIMESTAMP
        access: RO
        width: 3
        multi_byte: true
        roles: [timestamp]
        desc: "三字节采样时间戳联合视图（0x30~0x32），计数范围 0x000000~0xFFFFFF"
        alias_note: "与 TIMESTAMP_LOW/MID/HIGH 地址重叠，为三字节联合读取视图"
        fields:
          - name: sample_timestamp
            bits: "23:0"
            roles: [timestamp_value]
            desc: "采样时间戳；传感器最高 ODR 的每个样本计数加一，循环计数"

      - addr: 0x30
        name: TIMESTAMP_LOW
        access: RO
        width: 1
        desc: "采样时间戳低字节"
        alias_note: "与 TIMESTAMP 联合视图地址重叠"
        fields:
          - name: timestamp
            bits: "7:0"
            desc: "采样时间戳 [7:0]"

      - addr: 0x31
        name: TIMESTAMP_MID
        access: RO
        width: 1
        desc: "采样时间戳中字节"
        alias_note: "与 TIMESTAMP 联合视图地址重叠"
        fields:
          - name: timestamp
            bits: "7:0"
            desc: "采样时间戳 [15:8]"

      - addr: 0x32
        name: TIMESTAMP_HIGH
        access: RO
        width: 1
        desc: "采样时间戳高字节"
        alias_note: "与 TIMESTAMP 联合视图地址重叠"
        fields:
          - name: timestamp
            bits: "7:0"
            desc: "采样时间戳 [23:16]"

      - addr: 0x33
        name: DATA_ALL
        access: RO
        width: 14
        multi_byte: true
        roles: [data_block, telemetry_raw]
        desc: "温度、加速度计和陀螺仪批量读取联合视图（0x33~0x40），小端序"
        alias_note: "与 TEMP/AX/AY/AZ/GX/GY/GZ 单字节寄存器地址重叠"
        fields:
          - name: temp
            bits: "15:0"
            desc: "温度原始数据，2 字节小端序；T = TEMP_H + TEMP_L / 256"
          - name: acc
            bits: "63:16"
            desc: "加速度计原始数据，6 字节小端序\nax[15:0]：第 2~3 字节\nay[15:0]：第 4~5 字节\naz[15:0]：第 6~7 字节"
          - name: gyr
            bits: "111:64"
            desc: "陀螺仪原始数据，6 字节小端序\ngx[15:0]：第 8~9 字节\ngy[15:0]：第 10~11 字节\ngz[15:0]：第 12~13 字节"

      - addr: 0x33
        name: TEMP_L
        access: RO
        width: 1
        desc: "温度输出低字节"
        fields:
          - name: temp
            bits: "7:0"
            desc: "温度输出 [7:0]，T = TEMP_H + TEMP_L / 256"

      - addr: 0x34
        name: TEMP_H
        access: RO
        width: 1
        desc: "温度输出高字节"
        fields:
          - name: temp
            bits: "7:0"
            desc: "温度输出 [15:8]，二进制补码"

      - addr: 0x35
        name: AX_L
        access: RO
        width: 1
        desc: "X 轴加速度输出低字节"
        fields:
          - name: ax
            bits: "7:0"
            desc: "X 轴加速度 [7:0]，二进制补码"

      - addr: 0x36
        name: AX_H
        access: RO
        width: 1
        desc: "X 轴加速度输出高字节"
        fields:
          - name: ax
            bits: "7:0"
            desc: "X 轴加速度 [15:8]"

      - addr: 0x37
        name: AY_L
        access: RO
        width: 1
        desc: "Y 轴加速度输出低字节"
        fields:
          - name: ay
            bits: "7:0"
            desc: "Y 轴加速度 [7:0]，二进制补码"

      - addr: 0x38
        name: AY_H
        access: RO
        width: 1
        desc: "Y 轴加速度输出高字节"
        fields:
          - name: ay
            bits: "7:0"
            desc: "Y 轴加速度 [15:8]"

      - addr: 0x39
        name: AZ_L
        access: RO
        width: 1
        desc: "Z 轴加速度输出低字节"
        fields:
          - name: az
            bits: "7:0"
            desc: "Z 轴加速度 [7:0]，二进制补码"

      - addr: 0x3A
        name: AZ_H
        access: RO
        width: 1
        desc: "Z 轴加速度输出高字节"
        fields:
          - name: az
            bits: "7:0"
            desc: "Z 轴加速度 [15:8]"

      - addr: 0x3B
        name: GX_L
        access: RO
        width: 1
        desc: "X 轴角速度输出低字节"
        fields:
          - name: gx
            bits: "7:0"
            desc: "X 轴角速度 [7:0]，二进制补码"

      - addr: 0x3C
        name: GX_H
        access: RO
        width: 1
        desc: "X 轴角速度输出高字节"
        fields:
          - name: gx
            bits: "7:0"
            desc: "X 轴角速度 [15:8]"

      - addr: 0x3D
        name: GY_L
        access: RO
        width: 1
        desc: "Y 轴角速度输出低字节"
        fields:
          - name: gy
            bits: "7:0"
            desc: "Y 轴角速度 [7:0]，二进制补码"

      - addr: 0x3E
        name: GY_H
        access: RO
        width: 1
        desc: "Y 轴角速度输出高字节"
        fields:
          - name: gy
            bits: "7:0"
            desc: "Y 轴角速度 [15:8]"

      - addr: 0x3F
        name: GZ_L
        access: RO
        width: 1
        desc: "Z 轴角速度输出低字节"
        fields:
          - name: gz
            bits: "7:0"
            desc: "Z 轴角速度 [7:0]，二进制补码"

      - addr: 0x40
        name: GZ_H
        access: RO
        width: 1
        desc: "Z 轴角速度输出高字节"
        fields:
          - name: gz
            bits: "7:0"
            desc: "Z 轴角速度 [15:8]"

      - addr: 0x46
        name: COD_STATUS
        access: RO
        width: 1
        roles: [calibration_status]
        desc: "按需校准（Calibration-On-Demand, COD）状态寄存器，仅在 COD 命令后有效"
        fields:
          - name: x_limit_l_fail
            bits: "7:7"
            desc: "X 轴陀螺仪低灵敏度限值检查\n0 = COD 低灵敏度限值检查通过\n1 = COD 低灵敏度限值检查失败"
          - name: x_limit_h_fail
            bits: "6:6"
            desc: "X 轴陀螺仪高灵敏度限值检查\n0 = COD 高灵敏度限值检查通过\n1 = COD 高灵敏度限值检查失败"
          - name: y_limit_l_fail
            bits: "5:5"
            desc: "Y 轴陀螺仪低灵敏度限值检查\n0 = COD 低灵敏度限值检查通过\n1 = COD 低灵敏度限值检查失败"
          - name: y_limit_h_fail
            bits: "4:4"
            desc: "Y 轴陀螺仪高灵敏度限值检查\n0 = COD 高灵敏度限值检查通过\n1 = COD 高灵敏度限值检查失败"
          - name: accel_check
            bits: "3:3"
            desc: "COD 期间加速度计振动检查\n0 = 加速度计检查通过\n1 = 加速度计检查失败"
          - name: startup_failed
            bits: "2:2"
            desc: "陀螺仪启动状态\n0 = 陀螺仪启动成功\n1 = 调用 COD 时发生陀螺仪启动失败"
          - name: gyro_enabled
            bits: "1:1"
            desc: "COD 调用时陀螺仪使能状态\n0 = 调用 COD 时陀螺仪未使能\n1 = 调用 COD 时陀螺仪已使能，COD 返回失败"
          - name: cod_failed
            bits: "0:0"
            desc: "COD 结果\n0 = COD 成功，新增益参数将应用到 GX/GY 数据\n1 = COD 失败，不应用 COD 校正"

      - addr: 0x49
        name: DQW_L
        access: RO
        width: 1
        desc: "通用目的寄存器；CTRL_CMD_COPY_USID 后保存 FW_Version 字节 0"
        fields:
          - name: dqw
            bits: "7:0"
            desc: "通用目的数据 [7:0]"

      - addr: 0x4A
        name: DQW_H
        access: RO
        width: 1
        desc: "通用目的寄存器；CTRL_CMD_COPY_USID 后保存 FW_Version 字节 1"
        fields:
          - name: dqw
            bits: "7:0"
            desc: "通用目的数据 [15:8]"

      - addr: 0x4B
        name: DQX_L
        access: RO
        width: 1
        desc: "通用目的寄存器；CTRL_CMD_COPY_USID 后保存 FW_Version 字节 2"
        fields:
          - name: dqx
            bits: "7:0"
            desc: "通用目的数据 [7:0]"

      - addr: 0x4C
        name: DQX_H
        access: RO
        width: 1
        desc: "保留寄存器"
        no_dump: false

      - addr: 0x4D
        name: DQY_L
        access: RO
        width: 1
        desc: "通用目的寄存器；成功复位后手册说明寄存器 0x4D 等于 0x80"
        fields:
          - name: dqy
            bits: "7:0"
            desc: "通用目的数据 [7:0]"

      - addr: 0x4E
        name: DQY_H
        access: RO
        width: 1
        desc: "保留寄存器"
        no_dump: false

      - addr: 0x4F
        name: DQZ_L
        access: RO
        width: 1
        desc: "保留寄存器"
        no_dump: false

      - addr: 0x50
        name: DQZ_H
        access: RO
        width: 1
        desc: "保留寄存器"
        no_dump: false

      - addr: 0x51
        name: DVX_L
        access: RO
        width: 1
        desc: "通用目的寄存器；CTRL_CMD_COPY_USID 后保存 USID 字节 0"
        fields:
          - name: dvx
            bits: "7:0"
            desc: "通用目的数据 [7:0]"

      - addr: 0x52
        name: DVX_H
        access: RO
        width: 1
        desc: "通用目的寄存器；CTRL_CMD_COPY_USID 后保存 USID 字节 1"
        fields:
          - name: dvx
            bits: "7:0"
            desc: "通用目的数据 [15:8]"

      - addr: 0x53
        name: DVY_L
        access: RO
        width: 1
        desc: "通用目的寄存器；CTRL_CMD_COPY_USID 后保存 USID 字节 2"
        fields:
          - name: dvy
            bits: "7:0"
            desc: "通用目的数据 [7:0]"

      - addr: 0x54
        name: DVY_H
        access: RO
        width: 1
        desc: "通用目的寄存器；CTRL_CMD_COPY_USID 后保存 USID 字节 3"
        fields:
          - name: dvy
            bits: "7:0"
            desc: "通用目的数据 [15:8]"

      - addr: 0x55
        name: DVZ_L
        access: RO
        width: 1
        desc: "通用目的寄存器；CTRL_CMD_COPY_USID 后保存 USID 字节 4"
        fields:
          - name: dvz
            bits: "7:0"
            desc: "通用目的数据 [7:0]"

      - addr: 0x56
        name: DVZ_H
        access: RO
        width: 1
        desc: "通用目的寄存器；CTRL_CMD_COPY_USID 后保存 USID 字节 5"
        fields:
          - name: dvz
            bits: "7:0"
            desc: "通用目的数据 [15:8]"

      - addr: 0x59
        name: TAP_STATUS
        access: RO
        width: 1
        roles: [tap_status]
        desc: "Tap 检测输出状态寄存器"
        fields:
          - name: tap_polarity
            bits: "7:7"
            desc: "Tap 方向极性\n0 = 在 Tap 轴正方向检测到 Tap\n1 = 在 Tap 轴负方向检测到 Tap"
          - name: reserved6
            bits: "6:6"
            desc: "保留"
          - name: tap_axis
            bits: "5:4"
            desc: "Tap 检测轴\n0 = 未检测到 Tap\n1 = 在 X 轴检测到 Tap\n2 = 在 Y 轴检测到 Tap\n3 = 在 Z 轴检测到 Tap"
          - name: reserved3_2
            bits: "3:2"
            desc: "保留"
          - name: tap_num
            bits: "1:0"
            desc: "Tap 次数\n0 = 未检测到 Tap\n1 = 检测到单击 Tap\n2 = 检测到双击 Tap\n3 = 不适用"

      - addr: 0x5A
        name: STEP_COUNT
        access: RO
        width: 3
        multi_byte: true
        roles: [step_count]
        desc: "计步器 24 位步数联合视图（0x5A~0x5C）"
        alias_note: "与 STEP_CNT_LOW/MIDL/HIGH 地址重叠，为三字节联合读取视图"
        fields:
          - name: step_count
            bits: "23:0"
            desc: "计步器引擎检测到的 24 位步数"

      - addr: 0x5A
        name: STEP_CNT_LOW
        access: RO
        width: 1
        roles: [step_count]
        desc: "计步器步数低字节"
        alias_note: "与 STEP_COUNT 联合视图地址重叠"
        fields:
          - name: step_count
            bits: "7:0"
            desc: "步数 [7:0]"

      - addr: 0x5B
        name: STEP_CNT_MIDL
        access: RO
        width: 1
        roles: [step_count]
        desc: "计步器步数中字节"
        alias_note: "与 STEP_COUNT 联合视图地址重叠"
        fields:
          - name: step_count
            bits: "7:0"
            desc: "步数 [15:8]"

      - addr: 0x5C
        name: STEP_CNT_HIGH
        access: RO
        width: 1
        roles: [step_count]
        desc: "计步器步数高字节"
        alias_note: "与 STEP_COUNT 联合视图地址重叠"
        fields:
          - name: step_count
            bits: "7:0"
            desc: "步数 [23:16]"

      - addr: 0x60
        name: RESET
        access: WO
        width: 1
        desc: "软复位寄存器；任意模式下写入 0xB0 会立即触发传感器复位流程"
        fields:
          - name: reset
            bits: "7:0"
            desc: "软复位密钥\n0xB0 = 触发软复位；复位成功后寄存器 0x4D 等于 0x80"
