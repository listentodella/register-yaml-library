    access: "Primary SPI / I2C / I3C interface"
    desc: "Main user-interface register map for configuration, status, sensor output, OIS/EIS data and FIFO access."
    registers:
      - addr: 0x01
        name: FUNC_CFG_ACCESS
        access: RW
        width: 1
        reset: 0x00
        desc: "Enable embedded functions register (R/W)"
        fields:
