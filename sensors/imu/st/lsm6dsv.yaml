              0x06: "120 Hz"
              0x07: "240 Hz"
              0x08: "480 Hz"
              0x09: "960 Hz"
              0x0A: "1.92 kHz"
              0x0B: "3.84 kHz"
              0x0C: "7.68 kHz"
          - name: BDR_GY
            bits: "7:4"
            desc: "Bdr gy field as defined in the LSM6DSV register map."
            values:
              0x00: "Power-down"
              0x01: "1.875 Hz"
              0x02: "7.5 Hz"
              0x03: "15 Hz"
              0x04: "30 Hz"
              0x05: "60 Hz"
              0x06: "120 Hz"
              0x07: "240 Hz"
              0x08: "480 Hz"
              0x09: "960 Hz"
              0x0A: "1.92 kHz"
              0x0B: "3.84 kHz"
