            bits: "0"
            desc: "Ois ctrl from ui field as defined in the LSM6DSV register map."
          - name: SPI2_RESET
            bits: "1"
            desc: "Spi2 reset field as defined in the LSM6DSV register map."
          - name: SW_POR
            bits: "2"
            desc: "Sw por field as defined in the LSM6DSV register map."
          - name: FSM_WR_CTRL_EN
