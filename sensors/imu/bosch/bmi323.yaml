          - name: watchdog_not_ack
            bits: "5"
            desc: "The feature engine did not acknowledge its internal watchdog in time. Perform a soft-reset to re-enable the feature engine."
          - name: disabled_by_host
            bits: "4"
            desc: "Feature engine was disabled by the host. Perform a soft-reset to re-enable the feature engine."
          - name: data_tx_active
            bits: "3"
            desc: "DMA controller has started DMA and DMA transactions are ongoing"
          - name: overload
            bits: "1"
            desc: "Transfer of data to or from the feature engine is ongoing."
          - name: sleep
            bits: "0"
            desc: "Feature engine halted or sleeping."

