        reset: 0x402D
        desc: "Tap detector setting"
        fields:
          - name: max_gesture_dur
            bits: "15:10"
            desc: "Maximum duration from first tap within the second and/or third tap is expected to happen"
          - name: tap_peak_thres
            bits: "9:0"
            desc: "Minimum threshold for peak resulting from the tap"

      - addr: 0x20
        name: TAP_3
