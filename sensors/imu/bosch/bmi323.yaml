  EXTENDED:
    page_id: 0x01
    address_unit_bits: 16
    access: "FEATURE_DATA_ADDR / FEATURE_DATA_TX transaction"
    desc: "Feature-engine extended 16-bit register map. Select the extended address through FEATURE_DATA_ADDR and transfer data through FEATURE_DATA_TX while observing FEATURE_DATA_STATUS."
    registers:
      - addr: 0x02
        name: GEN_SET_1
        access: RW
        width: 2
        address_span: 1
        reset: 0x0006
        desc: "Common register settings"
        fields:
          - name: sw_lock
            bits: "5"
            reserved: "RESERVED"
            desc: "Reserved field; preserve the documented reset value during read-modify-write updates."
          - name: int_hold_dur
            bits: "4:1"
            desc: "Interrupt hold time duration. Range 0 to 13. Hold time = 0.625ms * ( 2 ^interrupt_hold_duration) i.e 0.625ms to 5120ms. If set above 13, then hold time input is considered as 13. Default is 5ms. The hold time is only applicable for interrupts A..I in non-latched mode. Deviation up to +/- 1.25ms + ODR accuracy deviation. If tap detector is active the hold time MUST NOT be 5ms if not applied the enhanced configuration prior via 'bmi3x0_configure_enhanced_flexibility' (sensor driver API)"
          - name: event_report_mode
            bits: "0"
            desc: "Configuration of the reporting mode"
            values:
              0x00: "All detected events are reported."
              0x01: "Report first detected event, then keep silent."

      - addr: 0x03
        name: AXIS_MAP_1
        access: RW
        width: 2
        address_span: 1
        reset: 0x0000
        desc: "Describes axis map settings"
        fields:
          - name: invert_z
            bits: "5"
            desc: "Invert the z axis of accelerometer and gyroscope"
            values:
              0x00: "Clear this bit to not invert the z axis"
              0x01: "Set this bit to invert the z axis"
          - name: invert_y
            bits: "4"
            desc: "Invert the y axis of accelerometer and gyroscope"
            values:
              0x00: "Clear this bit to not invert the y axis"
              0x01: "Set this bit to invert the y axis"
          - name: invert_x
            bits: "3"
            desc: "Invert the x axis of accelerometer and gyroscope"
            values:
              0x00: "Clear this bit to not invert the x axis"
              0x01: "Set this bit to invert the x axis"
          - name: axis_map
            bits: "2:0"
            desc: "Map accelerometer and gyroscope axis to desired configuration"
            values:
              0x00: "x=x; y=y; z=z"
              0x01: "x=y; y=x; z=z"
              0x02: "x=x; y=z; z=y"
              0x03: "x=z; y=x; z=y"
              0x04: "x=y; y=z; z=x"
              0x05: "x=z; y=y; z=x"

      - addr: 0x05
        name: ANYMO_1
        access: RW
        width: 2
        address_span: 1
        reset: 0x100A
        desc: "Configuration of acceleration slope threshold and reference update mode"
        fields:
          - name: acc_ref_up
            bits: "12"
            desc: "Mode of the acceleration reference update."
            values:
              0x00: "On detection of the event"
              0x01: "On update of acceleration signal"
          - name: slope_thres
            bits: "11:0"
            desc: "Minimum slope of acceleration signal for motion detection The field slope_thres has the following properties: Unit g"

      - addr: 0x06
        name: ANYMO_2
        access: RW
        width: 2
        address_span: 1
        reset: 0x0002
        desc: "Configuration for hysteresis of acceleration slope"
        fields:
          - name: hysteresis
            bits: "9:0"
            desc: "Hysteresis for the slope of the acceleration signal"

      - addr: 0x07
        name: ANYMO_3
        access: RW
        width: 2
        address_span: 1
        reset: 0x600A
        desc: "Configuration of timing related parameters for motion detection"
        fields:
          - name: wait_time
            bits: "15:13"
            desc: "Wait time for clearing the event after slope is below threshold The field wait_time has the following properties: Unit s"
          - name: duration
            bits: "12:0"
            desc: "Minimum duration for which the slope shall be greater than threshold for motion detection"

      - addr: 0x08
        name: NOMO_1
        access: RW
        width: 2
        address_span: 1
        reset: 0x100A
        desc: "Configuration of acceleration slope threshold and reference update mode"
        fields:
          - name: acc_ref_up
            bits: "12"
            desc: "Mode of the acceleration reference update."
            values:
              0x00: "On detection of the event"
              0x01: "On update of acceleration signal"
          - name: slope_thres
            bits: "11:0"
            desc: "Maximum slope of acceleration signal for stationary state detection"

      - addr: 0x09
        name: NOMO_2
        access: RW
        width: 2
        address_span: 1
        reset: 0x0002
        desc: "Configuration for hysteresis of acceleration slope"
        fields:
          - name: hysteresis
            bits: "9:0"
            desc: "Hysteresis for the slope of the acceleration signal"

      - addr: 0x0A
        name: NOMO_3
        access: RW
        width: 2
        address_span: 1
        reset: 0x600A
        desc: "Configuration of timing related parameters for stationary detection"
        fields:
          - name: wait_time
            bits: "15:13"
            desc: "Wait time for clearing the event after slope is below threshold The field wait_time has the following properties: Unit s"
          - name: duration
            bits: "12:0"
            desc: "Minimum duration for which the slope shall be less than threshold for stationary detection"

      - addr: 0x0B
        name: FLAT_1
        access: RW
        width: 2
        address_span: 1
        reset: 0x2088
        desc: "Settings for maximum tilt angle for flat state, blocking mode and minimum duration in state for event detection"
        fields:
          - name: hold_time
            bits: "15:8"
            desc: "Minimum duration the device shall be in flat position for status to be asserted"
          - name: blocking
            bits: "7:6"
            desc: "Blocking mode to prevent change of flat status during large movement of device."
            values:
              0x00: "Blocking is disabled"
              0x01: "Block if acceleration on any axis is greater than 1.5g"
              0x02: "half of slope_thres"
              0x03: "slope_thres"
          - name: theta
            bits: "5:0"
            desc: "Maximum allowed tilt angle for device to be in flat state"

      - addr: 0x0C
        name: FLAT_2
        access: RW
        width: 2
        address_span: 1
        reset: 0x09CD
        desc: "Settings for consecutive sample slope and hysteresis"
        fields:
          - name: hysteresis
            bits: "15:8"
            desc: "Angle of hysteresis for flat detection."
          - name: slope_thres
            bits: "7:0"
            desc: "Minimum slope between consecutive acceleration samples to pervent the change of flat status during large movement"

      - addr: 0x0D
        name: SIGMO_1
        access: RW
        width: 2
        address_span: 1
        reset: 0x00FA
        desc: "Size of the segment for detection of significant motion"
        fields:
          - name: block_size
            bits: "15:0"
            desc: "Size of the segment for detection of significant motion of the device"

      - addr: 0x0E
        name: SIGMO_2
