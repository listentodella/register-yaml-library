      - addr: 0x36
        name: FIFO_CONF
        access: RW
        width: 2
        address_span: 1
        reset: 0x0000
        desc: "Configuration of the FIFO data buffer behaviour"
        fields:
          - name: fifo_temp_en
            bits: "11"
            desc: "Write temperature samples into the FIFO data buffer"
            values:
              0x00: "No temperature data is written"
              0x01: "Temperature data is written"
          - name: fifo_gyr_en
            bits: "10"
            desc: "Write 3D angular rate samples from the gyroscope into the FIFO data buffer"
            values:
              0x00: "No gyroscope data is written"
              0x01: "Gyroscope data is written"
          - name: fifo_acc_en
            bits: "9"
            desc: "Write 3D acceleration samples from the accelerometer into the FIFO data buffer"
            values:
              0x00: "No accelerometer data is written"
              0x01: "Accelerometer data is written"
          - name: fifo_time_en
            bits: "8"
            desc: "Write the sensor time into the FIFO data buffer."
            values:
              0x00: "No sensortime is written"
              0x01: "Sensortime is written"
          - name: fifo_stop_on_full
            bits: "0"
            desc: "Configure whether to overwrite oldest samples when the FIFO data buffer is full"
            values:
              0x00: "Continue writing to the data buffer by overwriting oldest samples"
              0x01: "Stop writing into the FIFO data buffer when full"

