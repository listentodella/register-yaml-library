        reset: 0x0000
        desc: "Data path register for the gyroscope re-scale of axis z"
        fields:
          - name: gyr_dp_dgain_z
            bits: "6:0"
            desc: "Data path register for the temperature independent gyroscope re-scale of axis z: covers +/-12.5% of sensitivity"

      - addr: 0x70
        name: I3C_TC_SYNC_TPH
        access: RW
        width: 2
        address_span: 1
        reset: 0x0000
        desc: "I3C Timing Control Sync TPH Register"
        fields:
          - name: i3c_tc_sync_tph
            bits: "15:0"
            desc: "I3C Timing Control Sync TPH Register"

      - addr: 0x71
        name: I3C_TC_SYNC_TU
        access: RW
        width: 2
        address_span: 1
        reset: 0x0000
        desc: "I3C Timing Control Sync TU Register"
        fields:
          - name: i3c_tc_sync_tu
            bits: "7:0"
            desc: "I3C Timing Control Sync TU Register"

      - addr: 0x72
        name: I3C_TC_SYNC_ODR
        access: RW
        width: 2
        address_span: 1
        reset: 0x0000
        desc: "I3C Timing Control Sync ODR Register"
        fields:
          - name: i3c_tc_sync_odr
            bits: "7:0"
            desc: "I3C Timing Control Sync ODR Register"

      - addr: 0x7E
        name: CMD
        access: WO
        width: 2
        address_span: 1
        reset: 0x0000
        roles: [command]
        desc: "Command Register"
        fields:
          - name: cmd
            bits: "15:0"
            desc: "Available commands (Note: Register will always return 0x00 as read result)"
            values:
              0x100: "Trigger accelerometer and gyroscope self-test"
              0x101: "Trigger gyroscope self-calibration"
              0x200: "Abort running gyroscope self-calibration"
              0x201: "Apply I3C timing-control synchronization configuration"
              0x300: "Apply axis mapping and sign-inversion configuration"
              0xDEAF: "Soft reset the device and feature engine"

      - addr: 0x7F
        name: CFG_RES
