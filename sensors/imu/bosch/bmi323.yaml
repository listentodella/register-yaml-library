            desc: "Maximum value of the peak to peak acceleration magnitude"

      - addr: 0x10
        name: SC_1
        access: RW
        width: 2
        address_span: 1
        reset: 0x0000
        desc: "Configuration for step counter watermark and global reset"
        fields:
          - name: reset_counter
            bits: "10"
            desc: "Reset the accumulated step count value"
          - name: watermark_level
            bits: "9:0"
            desc: "An interrupt will be triggered every time the difference in number of steps counted from last event is equal to set value. If 0, the interrupt is disabled."

      - addr: 0x1C
        name: ORIENT_1
        access: RW
        width: 2
        address_span: 1
        reset: 0x2CFC
        desc: "Orientation general configuration flags"
        fields:
          - name: hold_time
            bits: "15:11"
            desc: "Minimum duration the device shall be in new orientation for change detection"
          - name: theta
            bits: "10:5"
            desc: "Maximum allowed tilt angle for device to be in flat state"
          - name: blocking
            bits: "4:3"
            desc: "Blocking allows to prevent change of orientation during large movement of device"
            values:
              0x00: "Blocking is disabled"
              0x01: "Block if acceleration on any axis is greater than 1.5g"
              0x02: "half of slope_thres"
              0x03: "slope_thres"
          - name: mode
            bits: "2:1"
            desc: "Selection of mode for orientation spread in the detection plane"
            values:
              0x00: "Symmetrical spread of area for portrait and landscape orientations"
              0x01: "Area of landscape is more compared to portrait orientation"
              0x02: "Area of portrait is more compared to landscape orientation"
          - name: ud_en
            bits: "0"
            desc: "Selection of upside down orientation detection"
            values:
              0x00: "Disable detection of upside-down position"
              0x01: "Enable detection of upside-down position"

      - addr: 0x1D
        name: ORIENT_2
        access: RW
        width: 2
        address_span: 1
        reset: 0x20CD
        desc: "Settings for acceleration slope and hysteresis in orientation detection"
        fields:
          - name: hysteresis
            bits: "15:8"
            desc: "Hysteresis of acceleration for orientation change detection The field hysteresis has the following properties: Unit g"
          - name: slope_thres
            bits: "7:0"
            desc: "Minimum slope between consecutive acceleration samples to prevent the change of orientation during large movement"

      - addr: 0x1E
        name: TAP_1
        access: RW
        width: 2
        address_span: 1
        reset: 0x0076
        desc: "Selection of the tap detection axis, gesture reporting approach, detection mode"
        fields:
          - name: mode
            bits: "7:6"
            desc: "Mode for detection of tap gesture. Default value = Normal. In stable position of device, to improve detection accuracy, sensitive mode can be used. Under noisy scenarios, the false detection can be suppressed with Robust mode"
            values:
              0x00: "Sensitive detection mode"
              0x01: "Normal detection mode"
              0x02: "Robust detection mode"
          - name: max_peaks_for_tap
            bits: "5:3"
            desc: "Maximum number of threshold crossing expected around a tap"
          - name: wait_for_timeout
            bits: "2"
            desc: "Perform gesture confirmation with wait time set by max_gesture_dur"
            values:
              0x00: "Report the gesture when detected"
              0x01: "Report the gesture after confirmation"
          - name: axis_sel
            bits: "1:0"
            desc: "Dominant sensing axis of accelerometer along which tap gesture is performed"
            values:
              0x00: "Use x-axis for tap detection"
              0x01: "Use y-axis for tap detection"
              0x02: "Use z-axis for tap detection"

      - addr: 0x1F
        name: TAP_2
