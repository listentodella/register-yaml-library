            values:
              0x00: "None selected"
              0x01: "Selection of int A for switch of configuration"
              0x02: "Selection of int B for switch of configuration"
              0x03: "Selection of int C for switch of configuration"
              0x04: "Selection of int D for switch of configuration"
              0x05: "Selection of int E for switch of configuration"
              0x06: "Selection of int F for switch of configuration"
              0x07: "Selection of int G for switch of configuration"
              0x08: "Selection of int H for switch of configuration"
              0x09: "Selection of int I for switch of configuration"
          - name: alt_conf_alt_switch_src_select
