        access: RO
        width: 2
        address_span: 1
        reset: 0x0000
        desc: "Status of the data access to the feature engine"
        fields:
          - name: data_tx_ready
            bits: "1"
            desc: "Data is writable to the feature engine or readable from the feature engine."
          - name: data_outofbound_err
            bits: "0"
            desc: "Too much data read or written to the feature engine. Bit will be reset upon next data transfer to or from the feature engine."

      - addr: 0x45
        name: FEATURE_ENGINE_STATUS
        access: RO
        width: 2
        address_span: 1
        reset: 0x0000
