schema_version: 1
sensor: BMI323
vendor: "Bosch Sensortec"
family: BMI323
device_type: imu
source:
  title: "BMI323 Datasheet"
  version: "BST-BMI323-DS000-11"
  revision: "1.5 (March 27, 2025)"
  document: "BMI323 Datasheet, document BST-BMI323-DS000-11"
  url: "https://www.bosch-sensortec.com/products/motion-sensors/imus/bmi323/"
  license: "Bosch vendor documentation; redistribution terms not specified"
  notice: "Register facts extracted from the user's Zotero PDF attachment; the PDF itself is not redistributed."
who_am_i:
  reg: 0x00
  values:
    - value: 0x43
      desc: "BMI323 chip identifier in CHIP_ID[7:0]"

pages:
  UI:
    page_id: 0x00
    address_unit_bits: 16
    access: "SPI / I2C / I3C"
    desc: "Primary 16-bit word-addressed register map. Each address selects one 16-bit register, so width is 2 bytes and address_span is 1."
    registers:
      - addr: 0x00
        name: CHIP_ID
        access: RO
        width: 2
        address_span: 1
        reset: 0x0043
        roles: [identity]
        desc: "Device identification code. Only bits 0 to 7 contain valid information, the contents of bits 8 to 15 must be ignored."
        fields:
          - name: chip_id
            bits: "7:0"
            desc: "Chip identifier"

      - addr: 0x01
        name: ERR_REG
        access: RW
        width: 2
        address_span: 1
        reset: 0x0000
        read_clear: true
        desc: "Reports sensor error conditions"
        fields:
          - name: i3c_error3
            bits: "11"
            desc: "S0/S1 error occurred. When S0/S1 error occurs, the slave will recover automatically after 60 us as if we see a HDR-exit pattern on the bus while the flag will persist for notification purpose. This flag is clear-on-read type. It is cleared automatically once read."
          - name: i3c_error0
            bits: "8"
            desc: "SDR parity error or read abort condition (maximum clock stall time for I3C read transfer) occurred. This flag is a clear-on-read type. It is cleared automatically once read. Refer to the MIPI I3C specification chapter 'Master Clock Stalling' for detail info regarding the read abort condition."
          - name: gyr_conf_err
            bits: "6"
            desc: "Unsupported gyroscope configuration set by user. This flag will be reset when configuration has been corrected."
          - name: acc_conf_err
            bits: "5"
            desc: "Unsupported accelerometer configuration set by user. This flag will be reset when configuration has been corrected."
          - name: feat_eng_wd
            bits: "4"
            desc: "Watchdog timer of the feature engine triggered. This flag is clear-on-read."
          - name: feat_eng_ovrld
            bits: "2"
            desc: "Overload of the feature engine detected. This flag is clear-on-read."
          - name: fatal_err
            bits: "0"
            desc: "Fatal Error, chip is not in operational state (Boot-, power-system). This flag will be reset only by power-on-reset or softreset."

      - addr: 0x02
        name: STATUS
        access: RW
        width: 2
        address_span: 1
        reset: 0x0001
        read_clear: true
        desc: "Sensor status flags"
        fields:
          - name: drdy_acc
            bits: "7"
            desc: "Data ready for Accelerometer. This flag is clear-on-read."
          - name: drdy_gyr
            bits: "6"
            desc: "Data ready for Gyroscope. This flag is clear-on-read."
          - name: drdy_temp
            bits: "5"
            desc: "Data ready for Temperature. This flag is clear-on-read."
          - name: por_detected
            bits: "0"
            desc: "'1' after device power up or soft-reset. This flag is clear-on-read."

      - addr: 0x03
        name: ACC_DATA_X
        access: RO
        width: 2
        address_span: 1
        reset: 0x8000
        roles: [accel_data]
        desc: "Acceleration sample, x channel in the default axes configuration Signed 16-bit two's-complement sample."
        fields:
          - name: acc_x
            bits: "15:0"
            desc: "Signed 16-bit two's-complement X-axis acceleration sample."

      - addr: 0x04
        name: ACC_DATA_Y
        access: RO
        width: 2
        address_span: 1
        reset: 0x8000
        roles: [accel_data]
        desc: "Acceleration sample, y channel in the default axes configuration Signed 16-bit two's-complement sample."
        fields:
          - name: acc_y
            bits: "15:0"
            desc: "Signed 16-bit two's-complement Y-axis acceleration sample."

      - addr: 0x05
        name: ACC_DATA_Z
        access: RO
        width: 2
        address_span: 1
        reset: 0x8000
        roles: [accel_data]
        desc: "Acceleration sample, z channel in the default axes configuration Signed 16-bit two's-complement sample."
        fields:
          - name: acc_z
            bits: "15:0"
            desc: "Signed 16-bit two's-complement Z-axis acceleration sample."

      - addr: 0x06
        name: GYR_DATA_X
        access: RO
        width: 2
        address_span: 1
        reset: 0x8000
        roles: [gyro_data]
        desc: "Angular rate sample, x channel in the default axes configuration Signed 16-bit two's-complement sample."
        fields:
          - name: gyr_x
            bits: "15:0"
            desc: "Signed 16-bit two's-complement X-axis angular-rate sample."

      - addr: 0x07
        name: GYR_DATA_Y
        access: RO
        width: 2
        address_span: 1
        reset: 0x8000
        roles: [gyro_data]
        desc: "Angular rate sample, y channel in the default axes configuration Signed 16-bit two's-complement sample."
        fields:
          - name: gyr_y
            bits: "15:0"
            desc: "Signed 16-bit two's-complement Y-axis angular-rate sample."

      - addr: 0x08
        name: GYR_DATA_Z
        access: RO
        width: 2
        address_span: 1
        reset: 0x8000
        roles: [gyro_data]
        desc: "Angular rate sample, z channel in the default axes configuration Signed 16-bit two's-complement sample."
        fields:
          - name: gyr_z
            bits: "15:0"
            desc: "Signed 16-bit two's-complement Z-axis angular-rate sample."

      - addr: 0x09
        name: TEMP_DATA
        access: RO
        width: 2
        address_span: 1
        reset: 0x8000
        roles: [temp_data]
        desc: "Temperature Data. The resolution is 512 LSB/K. 0x0000 -> 23 degrees C 0x8000 -> invalid Signed 16-bit temperature output; temperature [deg C] = raw / 512 + 23."
        fields:
          - name: temp_data
            bits: "15:0"
            desc: "Temperature value. T ( degrees C) := temp_data/512 + 23"

      - addr: 0x0A
        name: SENSOR_TIME_0
        access: RO
        width: 2
        address_span: 1
        reset: 0x0000
        desc: "Sensor time, least significant word (15:0) Combine SENSOR_TIME_1:SENSOR_TIME_0 as a 32-bit sensor timestamp."
        fields:
          - name: sensor_time_15_0
            bits: "15:0"
            desc: "Least significant word of the sensor time (15:0) where 1 LSB corresponds to 39.0625 us"

      - addr: 0x0B
        name: SENSOR_TIME_1
        access: RO
        width: 2
        address_span: 1
        reset: 0x0000
        desc: "Sensor time, most significant word (31:16) Combine SENSOR_TIME_1:SENSOR_TIME_0 as a 32-bit sensor timestamp."
        fields:
          - name: sensor_time_31_16
            bits: "15:0"
            desc: "Most significant word of the sensor time (31:16)"

      - addr: 0x0C
        name: SAT_FLAGS
        access: RO
        width: 2
        address_span: 1
        reset: 0x0000
        desc: "Saturation flags for each sensor and axis"
        fields:
          - name: satf_gyr_z
            bits: "5"
            desc: "Saturation flag for the gyroscope z axis in the default axes configuration"
          - name: satf_gyr_y
            bits: "4"
            desc: "Saturation flag for the gyroscope y axis in the default axes configuration"
          - name: satf_gyr_x
            bits: "3"
            desc: "Saturation flag for the gyroscope x axis in the default axes configuration"
          - name: satf_acc_z
            bits: "2"
            desc: "Saturation flag for the accelerometer z axis in the default axes configuration"
          - name: satf_acc_y
            bits: "1"
            desc: "Saturation flag for the accelerometer y axis in the default axes configuration"
          - name: satf_acc_x
            bits: "0"
            desc: "Saturation flag for the accelerometer x axis in the default axes configuration"

      - addr: 0x0D
        name: INT_STATUS_INT1
        access: RO
        width: 2
        address_span: 1
        reset: 0x0000
        read_clear: true
        roles: [interrupt_status]
        desc: "INT1 Status Register. This register is clear-on-read."
        fields:
          - name: int1_ffull
            bits: "15"
            desc: "FIFO full interrupt"
          - name: int1_fwm
            bits: "14"
            desc: "FIFO watermark interrupt"
          - name: int1_acc_drdy
            bits: "13"
            desc: "Accelerometer data ready interrupt"
          - name: int1_gyr_drdy
            bits: "12"
            desc: "Gyroscope data ready interrupt"
          - name: int1_temp_drdy
            bits: "11"
            desc: "Temperature data ready interrupt"
          - name: int1_err_status
            bits: "10"
            desc: "Feature engine error or status change"
          - name: int1_i3c
            bits: "9"
            desc: "I3C tc sync data ready interrupt"
          - name: int1_tap
            bits: "8"
            desc: "Tap detection output"
          - name: int1_tilt
            bits: "7"
            desc: "Tilt detection output"
          - name: int1_sig_motion
            bits: "6"
            desc: "Sigmotion detection output"
          - name: int1_step_counter
            bits: "5"
            desc: "Step counter watermark output"
          - name: int1_step_detector
            bits: "4"
            desc: "Step detector output"
          - name: int1_orientation
            bits: "3"
            desc: "Orientation detection output"
          - name: int1_flat
            bits: "2"
            desc: "Flat detection output"
          - name: int1_any_motion
            bits: "1"
            desc: "Any motion detection output"
          - name: int1_no_motion
            bits: "0"
            desc: "No motion detection output"

      - addr: 0x0E
        name: INT_STATUS_INT2
        access: RO
        width: 2
        address_span: 1
        reset: 0x0000
        read_clear: true
        roles: [interrupt_status]
        desc: "INT2 Status Register. This register is clear-on-read."
        fields:
          - name: int2_ffull
            bits: "15"
            desc: "FIFO full interrupt"
          - name: int2_fwm
            bits: "14"
            desc: "FIFO watermark interrupt"
          - name: int2_acc_drdy
            bits: "13"
            desc: "Accelerometer data ready interrupt"
          - name: int2_gyr_drdy
            bits: "12"
            desc: "Gyroscope data ready interrupt"
          - name: int2_temp_drdy
            bits: "11"
            desc: "Temperature data ready interrupt"
          - name: int2_err_status
            bits: "10"
            desc: "Feature engine error or status change"
          - name: int2_i3c
            bits: "9"
            desc: "I3C tc sync data ready interrupt"
          - name: int2_tap
            bits: "8"
            desc: "Tap detection output"
          - name: int2_tilt
            bits: "7"
            desc: "Tilt detection output"
          - name: int2_sig_motion
            bits: "6"
            desc: "Sigmotion detection output"
          - name: int2_step_counter
            bits: "5"
            desc: "Step counter watermark output"
          - name: int2_step_detector
            bits: "4"
            desc: "Step detector output"
          - name: int2_orientation
            bits: "3"
            desc: "Orientation detection output"
          - name: int2_flat
            bits: "2"
            desc: "Flat detection output"
          - name: int2_any_motion
            bits: "1"
            desc: "Any motion detection output"
          - name: int2_no_motion
            bits: "0"
            desc: "No motion detection output"

      - addr: 0x0F
        name: INT_STATUS_IBI
        access: RO
        width: 2
        address_span: 1
        reset: 0x0000
        read_clear: true
        roles: [interrupt_status]
        desc: "I3C IBI Status Register. This register is clear-on-read."
        fields:
          - name: ibi_ffull
            bits: "15"
            desc: "FIFO full interrupt"
          - name: ibi_fwm
            bits: "14"
            desc: "FIFO watermark interrupt"
          - name: ibi_acc_drdy
            bits: "13"
            desc: "Accelerometer data ready interrupt"
          - name: ibi_gyr_drdy
            bits: "12"
            desc: "Gyroscope data ready interrupt"
          - name: ibi_temp_drdy
            bits: "11"
            desc: "Temperature data ready interrupt"
          - name: ibi_err_status
            bits: "10"
            desc: "Feature engine error or status change"
          - name: ibi_i3c
            bits: "9"
            desc: "I3C tc sync data ready interrupt"
          - name: ibi_tap
            bits: "8"
            desc: "Tap output"
          - name: ibi_tilt
            bits: "7"
            desc: "Tilt output"
          - name: ibi_sig_motion
            bits: "6"
            desc: "Sigmotion output"
          - name: ibi_step_counter
            bits: "5"
            desc: "Step counter watermark output"
          - name: ibi_step_detector
            bits: "4"
            desc: "Step detector output"
          - name: ibi_orientation
            bits: "3"
            desc: "Orientation output"
          - name: ibi_flat
            bits: "2"
            desc: "Flat output"
          - name: ibi_any_motion
            bits: "1"
            desc: "Any_motion output"
          - name: ibi_no_motion
            bits: "0"
            desc: "No_motion output"

      - addr: 0x10
        name: FEATURE_IO0
        access: RW
        width: 2
        address_span: 1
        reset: 0x0000
        desc: "Feature engine configuration, before setting/changing an active configuration the register must be cleared (set to 0)"
        fields:
          - name: i3c_sync_en
            bits: "15"
            desc: "Enables I3C TC-sync feature."
          - name: tap_detector_t_tap_en
            bits: "14"
            desc: "Enables triple tap feature"
          - name: tap_detector_d_tap_en
            bits: "13"
            desc: "Enables double tap feature"
          - name: tap_detector_s_tap_en
            bits: "12"
            desc: "Enables single tap feature"
          - name: tilt_en
            bits: "11"
            desc: "Enables tilt feature"
          - name: sig_motion_en
            bits: "10"
            desc: "Enables significant motion feature"
          - name: step_counter_en
            bits: "9"
            desc: "Enables step counter feature"
          - name: step_detector_en
            bits: "8"
            desc: "Enables step detector feature"
          - name: orientation_en
            bits: "7"
            desc: "Enables orientation feature"
          - name: flat_en
            bits: "6"
            desc: "Enables flat feature"
          - name: any_motion_z_en
            bits: "5"
            desc: "Enables any motion feature for Z-axis"
          - name: any_motion_y_en
            bits: "4"
            desc: "Enables any motion feature for Y-axis"
          - name: any_motion_x_en
            bits: "3"
            desc: "Enables any motion feature for X-axis"
          - name: no_motion_z_en
            bits: "2"
            desc: "Enables no motion feature for Z-axis"
          - name: no_motion_y_en
            bits: "1"
            desc: "Enables no motion feature for Y-axis"
          - name: no_motion_x_en
            bits: "0"
            desc: "Enables no motion feature for X-axis"

      - addr: 0x11
        name: FEATURE_IO1
        access: RO
        width: 2
        address_span: 1
        reset: 0x0000
        desc: "Feature engine I/O register 0"
        fields:
          - name: state
            bits: "12:11"
            desc: "Current state of the system"
            values:
              0x00: "System in feature mode"
              0x01: "System is executing self-calibration of gyroscope in feature mode"
              0x02: "System in self-test mode"
              0x03: "System in error mode"
          - name: axis_map_complete
            bits: "10"
            desc: "Axis mapping completed"
          - name: sample_rate_err
            bits: "7"
            desc: "Insufficient sample rate for either 50Hz or 200Hz or I3C TC-sync feature"
          - name: st_result
            bits: "6"
            desc: "Accelerometer and/or gyroscope self-test result (1=OK, 0=Not OK). Bit sc_st_complete should be 1 prior to reading this bit."
          - name: gyro_sc_result
            bits: "5"
            desc: "Gyroscope self-calibration result (1=OK, 0=Not OK). Bit sc_st_complete should be 1 prior to reading this bit."
          - name: sc_st_complete
            bits: "4"
            desc: "Self-calibration (gyroscope only) or self-test (accelerometer and/or gyroscope) execution status. 0 indicates that the procedure is ongoing. 1 indicates that the procedure is completed."
          - name: error_status
            bits: "3:0"
            desc: "Error and status information"
            values:
              0x00: "Feature engine still inactive"
              0x01: "Feature engine activated"
              0x03: "Configuration string download failed"
              0x05: "No error"
              0x06: "Axis-map command rejected because a sensor, self-calibration, or self-test was active"
              0x08: "I3C timing-control synchronization configuration error"
              0x09: "Gyroscope self-calibration or self-test aborted"
              0x0A: "Gyroscope self-calibration command ignored because another operation was active"
              0x0B: "Self-test command ignored because another operation was active"
              0x0C: "Self-calibration or self-test preconditions were not met"
              0x0D: "Illegal sensor configuration change during self-calibration or self-test"
              0x0E: "I3C synchronization request deferred until self-test completes"
              0x0F: "Illegal sensor configuration change while I3C synchronization was active"

      - addr: 0x12
        name: FEATURE_IO2
        access: RW
        width: 2
        address_span: 1
        reset: 0x0000
        desc: "Feature engine I/O register 1 The detailed table shows read access, but the documented feature-engine initialization protocol writes startup configuration before enable; after enable the same word is a read-only step-counter output."
        fields:
          - name: startup_config_0_or_step_counter_out_0
            bits: "15:0"
            desc: "Before the feature engine is enabled, this is startup configuration word 0; after enable, it is the low word of the step-counter output."

      - addr: 0x13
        name: FEATURE_IO3
        access: RW
        width: 2
        address_span: 1
        reset: 0x0000
        desc: "Feature engine I/O register 2 The detailed table shows read access, but the documented feature-engine initialization protocol writes startup configuration before enable; after enable the same word is a read-only step-counter output."
        fields:
          - name: startup_config_1_or_step_counter_out_1
            bits: "15:0"
            desc: "Before the feature engine is enabled, this is startup configuration word 1; after enable, it is the high word of the step-counter output."

      - addr: 0x14
        name: FEATURE_IO_STATUS
        access: RW
        width: 2
        address_span: 1
        desc: "Feature I/O synchronization status and trigger The register-map overview gives reset 0x0018, while the detailed bit table shows all bits reset to 0; reset is omitted here because the source is internally inconsistent."
        fields:
          - name: feature_io_status
            bits: "0"
            desc: "On read: data has been written by the feature engine On write: data written by the host shall be sent to the feature engine"

      - addr: 0x15
        name: FIFO_FILL_LEVEL
        access: RO
        width: 2
        address_span: 1
        reset: 0x0000
        roles: [fifo_status]
        desc: "FIFO fill state in words"
        fields:
          - name: fifo_fill_level
            bits: "10:0"
            desc: "Current fill level of FIFO buffer An empty FIFO corresponds to 0x000. The word counter may be reset by reading out all frames from the FIFO buffer or when the FIFO is reset through fifo_flush. The word counter is updated each time a complete frame was read or written."

      - addr: 0x16
        name: FIFO_DATA
        access: RW
        width: 2
        address_span: 1
        reset: 0x0000
        no_dump: true
        no_dump_reason: "FIFO stream port; read only as part of a deliberate FIFO transaction."
        roles: [fifo_data]
        desc: "FIFO data output register"
        fields:
          - name: fifo_data
            bits: "15:0"
            desc: "FIFO read data (16 bits) Data format depends on the setting of register FIFO_CONF. The FIFO data are organized in frames. The new data flag is preserved. Read burst access must be used, the address will not increment when the read burst reads at the address of FIFO_DATA. When a frame is only partially read out it is retransmitted including the header at the next readout."

      - addr: 0x20
        name: ACC_CONF
        access: RW
        width: 2
        address_span: 1
        reset: 0x0028
        desc: "Sets the output data rate, bandwidth, range and the mode of the accelerometer"
        fields:
          - name: acc_mode
            bits: "14:12"
            desc: "Operation modes for the accelerometer"
            values:
              0x00: "Accelerometer disabled"
              0x03: "Accelerometer duty-cycling mode"
              0x04: "Accelerometer continuous low-power mode"
              0x07: "Accelerometer high-performance mode"
          - name: acc_avg_num
            bits: "10:8"
            desc: "Numbers of samples to be averaged"
            values:
              0x00: "No averaging; pass sample without filtering"
              0x01: "Averaging of 2 samples"
              0x02: "Averaging of 4 samples"
              0x03: "Averaging of 8 samples"
              0x04: "Averaging of 16 samples"
              0x05: "Averaging of 32 samples"
              0x06: "Averaging of 64 samples"
          - name: acc_bw
            bits: "7"
            desc: "Configure the -3dB cut-off frequency for the accelerometer"
            values:
              0x00: "BW = acc_odr/2"
              0x01: "BW = acc_odr/4"
          - name: acc_range
            bits: "6:4"
            desc: "Full scale, Resolution"
            values:
              0x00: "+/-2g, 16.38 LSB/mg"
              0x01: "+/-4g, 8.19 LSB/mg"
              0x02: "+/-8g, 4.10 LSB/mg"
              0x03: "+/-16g, 2.05 LSB/mg"
          - name: acc_odr
            bits: "3:0"
            desc: "Sample rate (ODR) in Hz"
            values:
              0x01: "ODR = 0.78125Hz"
              0x02: "ODR = 1.5625Hz"
              0x03: "ODR = 3.125Hz"
              0x04: "ODR = 6.25Hz"
              0x05: "ODR = 12.5Hz"
              0x06: "ODR = 25Hz"
              0x07: "ODR = 50Hz"
              0x08: "ODR = 100Hz"
              0x09: "ODR = 200Hz"
              0x0A: "ODR = 400Hz"
              0x0B: "ODR = 800Hz"
              0x0C: "ODR = 1.6kHz"
              0x0D: "ODR = 3.2kHz"
              0x0E: "ODR = 6.4kHz"

      - addr: 0x21
        name: GYR_CONF
        access: RW
        width: 2
        address_span: 1
        reset: 0x0048
        desc: "Sets the output data rate, bandwidth, range and the mode of the Gyroscope in the sensor"
        fields:
          - name: gyr_mode
            bits: "14:12"
            desc: "Operation modes for the gyroscope"
            values:
              0x00: "Disables the gyroscope"
              0x01: "Disables the gyroscope but keep the gyroscope drive enabled"
              0x03: "Enables the gyroscope with sensing operated in duty-cycling"
              0x04: "Enables the gyroscope in a continuous operation mode with reduced current"
              0x07: "Enables the gyroscope in high performance mode"
          - name: gyr_avg_num
            bits: "10:8"
            desc: "Numbers of samples to be averaged"
            values:
              0x00: "No averaging; pass sample without filtering"
              0x01: "averaging of 2 samples"
              0x02: "Averaging of 4 samples"
              0x03: "Averaging of 8 samples"
              0x04: "Averaging of 16 samples"
              0x05: "Averaging of 32 samples"
              0x06: "Averaging of 64 samples"
          - name: gyr_bw
            bits: "7"
            desc: "Configure the -3dB cut-off frequency for the gyroscope"
            values:
              0x00: "BW = gyr_odr/2"
              0x01: "BW = gyr_odr/4"
          - name: gyr_range
            bits: "6:4"
            desc: "Full scale, Resolution"
            values:
              0x00: "+/-125 dps, 262.144 LSB/dps"
              0x01: "+/-250 dps, 131.072 LSB/dps"
              0x02: "+/-500 dps, 65.536 LSB/dps"
              0x03: "+/-1000 dps, 32.768 LSB/dps"
              0x04: "+/-2000 dps, 16.4 LSB/dps"
          - name: gyr_odr
            bits: "3:0"
            desc: "Sample rate (ODR) in Hz"
            values:
              0x01: "ODR = 0.78125Hz"
              0x02: "ODR = 1.5625Hz"
