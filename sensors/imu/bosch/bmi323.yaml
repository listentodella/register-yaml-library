      - addr: 0x42
        name: FEATURE_DATA_TX
        access: RW
        width: 2
        address_span: 1
        reset: 0x0000
        no_dump: true
        no_dump_reason: "Feature-engine transfer port; accesses participate in the selected extended-register transaction."
        desc: "I/O port for the data values of the feature engine"
        fields:
          - name: data_tx_value
            bits: "15:0"
            desc: "Data port for DMA transfers."

      - addr: 0x43
