        desc: "Configuration of minimum value of peak to peak acceleration magnitude and mean crossing rate"
        fields:
          - name: mcr_min
            bits: "15:10"
            desc: "Minimum number of mean crossing per second in acceleration magnitude"
          - name: peak_2_peak_min
            bits: "9:0"
            desc: "Minimum value of the peak to peak acceleration magnitude"

      - addr: 0x0F
