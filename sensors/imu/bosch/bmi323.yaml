          - name: min_quite_dur_between_taps
            bits: "11:8"
            desc: "Mimimum duration between two consecutive tap impact"
          - name: tap_shock_settling_dur
            bits: "7:4"
            desc: "Maximum duration for which tap impact is observed The field tap_shock_settling_dur has the following properties: Unit s"
          - name: max_dur_between_peaks
