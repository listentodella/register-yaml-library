            reset: 0x0185
            desc: "RxFIFOn RAM Start Address.\nThis field contains the memory start address for RxFIFOn in 64bit words."

      - addr: 0xC400
        name: USB3OTG_GEVNTADRLO0
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
