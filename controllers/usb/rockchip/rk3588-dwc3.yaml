            desc: "Event Buffer Size in bytes.\nHolds the size of the Event Buffer in bytes; must be a multiple of\nfour. This is programmed by software once during initialization.\nThe minimum size of the event buffer is 32 bytes."

      - addr: 0xC40C
        name: USB3OTG_GEVNTCOUNT0
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000000
        desc: "Global Event Buffer Count Register 0"
        fields:
          - name: reserved_31_16
            bits: "31:16"
            access: RO
            reset: 0x0000
            desc: "Reserved."
          - name: evntcount
