            reset: 0x0000
            desc: "Transmit FIFOn RAM Start Address.\nThis field contains the memory start address for TxFIFOn in 64bit words."
          - name: txfdep_n
            bits: "15:0"
            access: RW
            reset: 0x0042
            desc: "TxFIFO Depth.\nThis field contains the depth of TxFIFOn in 64-bit words.\nMinimum value: 32; Maximum value: 32,768."

      - addr: 0xC380
        name: USB3OTG_GRXFIFOSIZn
