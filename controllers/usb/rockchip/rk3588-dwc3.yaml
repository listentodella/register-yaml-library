# Source: RK3588 TRM-Part2, Chapter 13 USB3 Controller
# Register facts are extracted only from the Rockchip TRM tables.
schema_version: 1
sensor: RK3588_DWC3
vendor: "Rockchip / Synopsys"
family: "DesignWare USB 3 Dual-Role Device Controller"
device_type: usb_controller
who_am_i:
  reg: 0xC120
  values:
    - value: 0x5533300A
      desc: "RK3588 TRM 中 USB3OTG_GSNPSID 的复位值"

pages:
  MMIO:
    page_id: 0x00
    address_unit_bits: 8
    access: "32-bit MMIO"
    desc: "RK3588 TRM-Part2 Chapter 13 USB3 Controller 寄存器；DWC3 核内部偏移，USB3OTG_0/1/2 的 SoC 基地址见 TRM 13.4.1。"
    registers:
      - addr: 0xC100
        name: USB3OTG_GSBUSCFG0
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000001
        desc: "Global SoC Bus Configuration Register 0"
        fields:
          - name: datrdreqinfo
            bits: "31:28"
            access: RW
            reset: 0x0
            desc: "AXI-cache for Data Read (DatRdReqInfo)."
          - name: desrdreqinfo
            bits: "27:24"
            access: RW
            reset: 0x0
            desc: "AXI-cache for Descriptor Read (DesRdReqInfo)."
          - name: datwrreqinfo
            bits: "23:20"
            access: RW
            reset: 0x0
            desc: "AXI-cache for Data Write (DatWrReqInfo)."
          - name: deswrreqinfo
            bits: "19:16"
            access: RW
            reset: 0x0
            desc: "AXI-cache for Descriptor Write (DesWrReqInfo)."
          - name: reserved_15_12
            bits: "15:12"
            access: RO
            reset: 0x0
            desc: "Reserved."
          - name: datbigend
            bits: "11:11"
            access: RW
            reset: 0x0
            desc: "This bit controls the endian mode for data accesses.\n1'b0: Little-endian (default)\n1'b1: Big-endian"
          - name: desbigend
            bits: "10:10"
            access: RW
            reset: 0x0
            desc: "This bit controls the endian mode for descriptor accesses.\n1'b0: Little-endian (default)\n1'b1: Big-endian"
          - name: reserved_9_8
            bits: "9:8"
            access: RO
            reset: 0x0
            desc: "Reserved."
          - name: incr256brstena
            bits: "7:7"
            access: RW
            reset: 0x0
            desc: "If software set this bit to 1, the AXI master uses INCR to do the\n256-beat burst."
          - name: incr128brstena
            bits: "6:6"
            access: RW
            reset: 0x0
            desc: "If software set this bit to 1, the AXI master uses INCR to do the\n128-beat burst."
          - name: incr64brstena
            bits: "5:5"
            access: RW
            reset: 0x0
            desc: "If software set this bit to 1, AXI master uses INCR to do the 64beat burst."
          - name: incr32brstena
            bits: "4:4"
            access: RW
            reset: 0x0
            desc: "If software set this bit to 1, the AXI master uses INCR to do the\n32-beat burst."
          - name: incr16brstena
            bits: "3:3"
            access: RW
            reset: 0x0
            desc: "If software set this bit to 1, the AXI master uses INCR to do the\n16-beat burst."
          - name: incr8brstena
            bits: "2:2"
            access: RW
            reset: 0x0
            desc: "If software set this bit to 1, the AXI master uses INCR to do the\n8-beat burst."
          - name: incr4brstena
            bits: "1:1"
            access: RW
            reset: 0x0
            desc: "When this bit is enabled the controller is allowed to do bursts of\nbeat length 1, 2, 3, and 4. It is highly recommended that this bit\nis enabled to prevent descriptor reads and writes from being\nbroken up into separate transfers."
          - name: incrbrstena
            bits: "0:0"
            access: RW
            reset: 0x1
            desc: "This bit determines the set of burst lengths the master interface\nuses. It works in conjunction with the GSBUSCFG0[7:1] enables\n(INCR256/128/64/32/16/8/4).\n0: INCRX burst mode\nARLEN/AWLEN do not use INCR. They use only the following\nburst lengths:\n4 (if GSBUSCFG0.INCR4BrstEna = 1);\n8 (if GSBUSCFG0.INCR8BrstEna = 1);\n16 (if GSBUSCFG0.INCR16BrstEna = 1);\n32 (if GSBUSCFG0.INCR32BrstEna = 1);\n64 (if GSBUSCFG0.INCR64BrstEna = 1);\n128 (if GSBUSCFG0.INCR128BrstEna = 1);\n256 (if GSBUSCFG0.INCR256BrstEna = 1);\n1: INCR (undefined length) burst mode;\nARLEN/AWLEN uses any length less than or equal to the largestenabled burst length of INCR4/8/16/32/64/128/256.\nFor cache line-aligned applications, this bit is typically set to 0 to\nensure that the master interface uses only power-of-2 burst\nlengths (as enabled via GSBUSCFG0[7:0])."

      - addr: 0xC104
        name: USB3OTG_GSBUSCFG1
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000300
        desc: "Global SoC Bus Configuration Register 1"
        fields:
          - name: reserved_31_13
            bits: "31:13"
            access: RO
            reset: 0x00000
            desc: "Reserved."
          - name: en1kpage
            bits: "12:12"
            access: RW
            reset: 0x0
            desc: "1K Page Boundary Enable.\nBy default (this bit is disabled) the AXI breaks transfers at the 4k\npage boundary. When this bit is enabled, the AXI master (DMA\ndata) breaks transfers at the 1k page boundary."
          - name: pipe_trans_limit
            bits: "11:8"
            access: RW
            reset: 0x3
            desc: "AXI Pipelined Transfers Burst Request Limit.\nThe field controls the number of outstanding pipelined transfer\nrequests the AXI master pushes to the AXI slave. When the AXI\nmaster reaches this limit, it does not make any more requests on\nthe AXI ARADDR and AWADDR buses until the associated data\nphases complete.\nThis field is encoded as follows:\n4'h0: 1 request\n4'h1: 2 requests\n4'h2: 3 requests\n4'h3: 4 requests\n...\n4'hF: 16 requests"
          - name: reserved_7_0
            bits: "7:0"
            access: RO
            reset: 0x00
            desc: "Reserved."

      - addr: 0xC108
        name: USB3OTG_GTXTHRCFG
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000000
        desc: "Global Tx Threshold Control Register"
        fields:
          - name: reserved_31_30
            bits: "31:30"
            access: RO
            reset: 0x0
            desc: "Reserved."
          - name: USBTxPktCntSel
            bits: "29:29"
            access: RO
            reset: 0x0
            desc: "This field enables/disables the USB transmission multi-packet\nthresholding:\n1'b0: USB transmission multi-packet thresholding is disabled; the\ncore can only start transmission on the USB after the entire\npacket has been fetched into the corresponding TXFIFO.\n1'b1: USB transmission multi-packet thresholding is enabled. The\ncore can only start transmission on the USB after USB Transmit\nPacket Count amounts of packets for the USB transaction (burst)\nare already in the corresponding TXFIFO. This mode is only valid\nin the host mode. It is only used for SuperSpeed."
          - name: reserved_28
            bits: "28:28"
            access: RO
            reset: 0x0
            desc: "Reserved."
          - name: USBTxPktCnt
            bits: "27:24"
            access: RW
            reset: 0x0
            desc: "This field specifies the number of packets that must be in the\nTXFIFO before the core can start transmission for the\ncorresponding USB transaction (burst). This field is only valid\nwhen the USB Transmit Packet Count Enable field is set to one.\nValid values are from 1 to 15.\nNote: This field must be less than or equal to the USB Maximum\nTX Burst Size field."
          - name: USBMaxTxBurstSize
            bits: "23:16"
            access: RW
            reset: 0x00
            desc: "When USBTxPktCntSel is one, this field specifies the Maximum\nBulk OUT burst the core can do. When the system bus is\nslower than the USB, TX FIFO can underrun during a long\nburst.\nYou can program a smaller value to this field to limit the TX\nburst size that the core can execute.\nHost mode: It only applies to SS Bulk, Isochronous, and\nInterrupt\nOUT endpoints.\nDevice mode: This value is not used in device mode, but users\nneed to program a value when using the TX threshold feature\nto make sure that the value programmed in USBTxPktCnt is\nless than this value.\nValid values are from 1 to 16."
          - name: reserved_15_0
            bits: "15:0"
            access: RO
            reset: 0x0000
            desc: "Reserved."

      - addr: 0xC10C
        name: USB3OTG_GRXTHRCFG
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000000
        desc: "Global Rx Threshold Control Register"
        fields:
          - name: reserved_31_30
            bits: "31:30"
            access: RO
            reset: 0x0
            desc: "Reserved."
          - name: usb_rx_pkt_cntsel
            bits: "29:29"
            access: RW
            reset: 0x0
            desc: "USB ReceivePacket Count Enable.\nThis field enables/disables the USB reception multi-packet\nthresholding:\n1'b0: The core can only start reception on the USB when the RX\nFIFO has space for at least one packet.\n1'b1: Not applied.\nIf you are using external buffer control (EBC) feature, disable this\nmode by setting USBRxPktCntSel to 0."
          - name: reserved_28_13
            bits: "28:13"
            access: RO
            reset: 0x0000
            desc: "Reserved."
          - name: resvl_socout_spc
            bits: "12:0"
            access: RW
            reset: 0x0000
            desc: "Space reserved in rx fifo for ISOC OUT.\nIn host mode, this field is not applicable and must be\nprogrammed to 0.\nIn device mode, this value represents the amount of space to be\nreserved for ISOC OUT packets.\nThe value to be programmed should be chosen so as to ensure\nthat non ISOC packets are not completely dropped,\nIf no space needs to be reserved for ISOC OUT packets, program\nthis field to 0.\nThis field is valid only in device mode. The maximum configurable\ndepth of rx fifo is 8192. Therefore, this field is 13 bits wide.\nFor HS/FS, the space reservation is the actual value."

      - addr: 0xC110
        name: USB3OTG_GCTL
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x13512004
        desc: "Global Core Control Register"
        fields:
          - name: pwrdnscale
            bits: "31:19"
            access: RW
            reset: 0x026A
            desc: "Not applied."
          - name: masterfiltbypass
            bits: "18:18"
            access: RW
            reset: 0x0
            desc: "Master Filter Bypass\nWhen this bit is set to 1'b1, all the filters are bypassed. The\ndouble synchronizers to mac clk preceding the filters are also\nbypassed. For enabling the filters, this bit must be 1'b0."
          - name: bypassetaddr
            bits: "17:17"
            access: RW
            reset: 0x0
            desc: "Bypass SetAddress in Device Mode.\nWhen BYPSSETADDR bit is set, the device core uses the value in\nthe DCFG[DevAddr] bits directly for comparing the device\naddress in the tokens.\nFor simulation, you can use this feature to avoid sending an\nactual SET ADDRESS control transfer on the USB, and make the\ndevice core respond to a new address.\nNote: You can set this bit for simulation purposes only. In the\nactual hardware, this bit must be set to 1'b0."
          - name: u2rstecn
            bits: "16:16"
            access: RW
            reset: 0x1
            desc: "Device controller on USB 2.0 reset checks for receiver\ntermination eight times per attempt if this bit is set to zero, or\nonly once per attempt if the bit is set to one.\nNote: This bit is applicable only in device mode."
          - name: frmscldwn
            bits: "15:14"
            access: RW
            reset: 0x0
            desc: "This field scales down device view of a SOF/USOF duration.\nFor HS mode:\nValue of 2'h3 implements interval to be 15.625 us\nValue of 2'h2 implements interval to be 31.25 us\nValue of 2'h1 implements interval to be 62.5 us\nValue of 2'h0 implements interval to be 125us\nFor FS mode, the scale-down value is multiplied by 8.\nThis field also scales down the MaxPacketSize of the IN and OUT\nbulk endpoint to allow more traffic during simulation. It can only\nbe changed from a non-zero value during simulation.\n2'h0: 1024 bytes\n2'h1: 512 bytes\n2'h2: 256 bytes\n2'h3: 128 bytes"
          - name: prtcapdir
            bits: "13:12"
            access: RW
            reset: 0x2
            desc: "PRTCAPDIR: Port Capability Direction (PrtCapDir)\n2'b01: for Host configurations\n2'b10: for Device configurations\nSW should base on IDDIG input to set usb controller as an OTG\n2.0 device with A-device or B-device."
          - name: coresoftreset
            bits: "11:11"
            access: RW
            reset: 0x0
            desc: "Core Soft Reset (CoreSoftReset)\n1'b0: No soft reset;\n1'b1: Soft reset to core\nClears the interrupts and all the CSRs except the following\nregisters:\nGCTL; GUCTL; GSTS; GSNPSID; GGPIO; GUID; GUSB2PHYCFGn\nregisters; GUSB3PIPECTLn registers; DCFG; DCTL; DEVTEN;\nDSTS."
          - name: sofitpsync
            bits: "10:10"
            access: RW
            reset: 0x0
            desc: "Not applied."
          - name: u1u2_timescale
            bits: "9:9"
            access: RW
            reset: 0x0
            desc: "Not applied."
          - name: debugattach
            bits: "8:8"
            access: RW
            reset: 0x0
            desc: "Debug Attach.\nNot applied."
          - name: ramclksel
            bits: "7:6"
            access: RW
            reset: 0x0
            desc: "RAM Clock Select (RAMClkSel)\n2'b00: bus clock\n2'b01: pipe clock (Only used in device mode)\n2'b10: In device mode, pipe/2 clock. In Host mode, controller\nswitches ram_clk between pipe/2 clock, mac2_clk and bus_clk\nbased on the status of the U2 ports\n2'b11: In device mode, selects mac2_clk as ram_clk (when 8-bit\nUTMI or ULPI used. Not supported in 16-bit UTMI mode); In Host\nmode, controller switches ram_clk between pipe_clk, mac2_clk\nand bus_clk based on the status of the U2 ports.\nIn device mode, upon a USB reset and USB disconnect, the\nhardware clears these bits to 2'b00."
          - name: scaledown
            bits: "5:4"
            access: RW
            reset: 0x0
            desc: "Scale-Down Mode (ScaleDown)\nWhen Scale-Down mode is enabled for simulation, the core uses\nscaled-down timing values, resulting in faster simulations.\nWhen Scale-Down mode is disabled, actual timing values are\nused. This is required for hardware operation.\nHS/FS/LS Modes:\n2'b00: Disables all scale-downs. Actual timing values are used.\n2'b01: Enables scale-down of all timing values except Device\nmode suspend and resume. These include Speed enumeration,\nHNP/SRP, and Host mode suspend and resume\n2'b10: Enables scale-down of Device mode suspend and resume\ntiming values only.\n2'b11: Enables bit 0 and bit 1 scale-down timing values."
          - name: disscramble
            bits: "3:3"
            access: RW
            reset: 0x0
            desc: "Disable Scrambling (DisScramble)\nTransmit request to Link Partner on next transition to Recovery or\nPolling."
          - name: u2exit_lfps
            bits: "2:2"
            access: RW
            reset: 0x1
            desc: "If this bit is:\n1'b0: the link treats 248ns LFPS as a valid U2 exit.\n1'b1: the link waits for 8us of LFPS before it detects a valid U2\nexit.\nThis bit is added to improve interoperability with a third part host\ncontroller. This host controller in U2 state while performing\nreceiver detection generates an LFPS glitch of about 4ms\nduration. This causes the device to exit from U2 state because\nthe LFPS filter value is 248ns. With the new functionality enabled,\nthe device can stay in U2 while ignoring this glitch from the host\ncontroller."
          - name: gbl_hibernation_en
            bits: "1:1"
            access: RO
            reset: 0x0
            desc: "This bit enables hibernation at the global level. If hibernation is\nnot enabled through this bit, the PMU immediately accepts the\nD0->D3 and D3->D0 power state change requests, but does not\nsave or restore any core state. In addition, the PMUs never drive\nthe PHY interfaces and let the core continue to drive the PHY\ninterfaces."
          - name: dsblclkgtng
            bits: "0:0"
            access: RW
            reset: 0x0
            desc: "Disable Clock Gating.\nThis bit is set to 1 and the core is in Low Power mode, internal\nclock gating is disabled. You can set this bit to 1'b1 after Power\nOn Reset."

      - addr: 0xC118
        name: USB3OTG_GSTS
        access: RO
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x7E800000
        desc: "Global Status Register"
        fields:
          - name: cbelt
            bits: "31:20"
            access: RO
            reset: 0x7E8
            desc: "Current BELT Value.\nIn Host mode, this field indicates the minimum value of all\nreceived device BELT values and the BELT value that is set by the\nSet Latency Tolerance Value command."
          - name: reserved_19_12
            bits: "19:12"
            access: RO
            reset: 0x00
            desc: "Reserved."
          - name: SSIC_IP
            bits: "11:11"
            access: RO
            reset: 0x0
            desc: "Not applied."
          - name: OTG_IP
            bits: "10:10"
            access: RO
            reset: 0x0
            desc: "OTG Interrupt Pending.\nThis field indicates that there is a pending interrupt pertaining to\nOTG in OEVT register."
          - name: bc_ip
            bits: "9:9"
            access: RO
            reset: 0x0
            desc: "Battery Charger Interrupt Pending\nThis field indicates that there is a pending interrupt pertaining to\nBC in BCEVT register."
          - name: adp_ip
            bits: "8:8"
            access: RO
            reset: 0x0
            desc: "ADP Interrupt Pending.\nThis field indicates that there is a pending interrupt pertaining to\nADP in ADPEVT register."
          - name: host_ip
            bits: "7:7"
            access: RO
            reset: 0x0
            desc: "Host Interrupt Pending.\nThis field indicates that there is a pending interrupt pertaining to\nxHC in the Host event queue."
          - name: device_ip
            bits: "6:6"
            access: RO
            reset: 0x0
            desc: "Device Interrupt Pending\nThis field indicates that there is a pending interrupt pertaining to\nperipheral (device) operation in the Device event queue."
          - name: csr_timeout
            bits: "5:5"
            access: W1C
            reset: 0x0
            desc: "When this bit is 1'b1, it indicates that the software performed a\nwrite or read to a core register that could not be completed\nwithin DWC_USB3_CSR_ACCESS_TIMEOUT bus clock cycles\n(default: h1FFFF)."
          - name: buserraddrvld
            bits: "4:4"
            access: W1C
            reset: 0x0
            desc: "us Error Address Valid\nIndicates that the GBUSERRADDR register is valid and reports the\nfirst bus address that encounters a bus error."
          - name: reserved_3_2
            bits: "3:2"
            access: RO
            reset: 0x0
            desc: "Reserved."
          - name: curmod
            bits: "1:0"
            access: RO
            reset: 0x0
            desc: "Current Mode of Operation."

      - addr: 0xC11C
        name: USB3OTG_GUCTL1
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x0004018A
        desc: "Global User Control Register 1"
        fields:
          - name: reserved_31_30
            bits: "31:30"
            access: RO
            reset: 0x0
            desc: "Reserved."
          - name: filter_se0_fsls_eop
            bits: "29:29"
            access: RW
            reset: 0x0
            desc: "1'b0: Default behaviour, no change in Linestate check for SE0\ndetection in FS/LS.\n1'b1: Feature enabled, FS/LS SE0 is filtered for 2 clocks for\ndetecting EOP.\nThis bit is applicable for FS/LS operation. If this feature is\nenabled, then SE0 on the Linestate is validated for 2 consecutive\nutmi/ulpi clock edges for EOP detection. This feature is applicable\nonly in FS in device mode and FS/LS mode of operation in host\nmode.\nDevice mode: FS - If GUCTL1.FILTER_SE0_FSLS_EOP is set, then\nfor device LPM handshake, the core will ignore single SE0 glitch\non the Linestate during transmit. Only 2 or more SE0 is\nconsidered as a valid EOP on FS.\nHost mode: FS/LS - If GUCTL1.FILTER_SE0_FSLS_EOP is set,\nthen the core will ignore single SE0 glitch on the Linestate during\ntransmit. Only 2 or more SE0 is considered as a valid EOP on\nFS/LS port. Enable this feature if the Linestate has SE0 glitches\nduring transmission. This bit is quasi-static, i.e., should not be\nchanged during device operation."
          - name: tx_ipgap_linecheck_dis
            bits: "28:28"
            access: RW
            reset: 0x0
            desc: "1'b0: Default behavior, no change in Linestate check.\n1'b1: Feature enable, 2.0 MAC disables Linestate check during HS\ntransmit.\nThis bit is applicable for HS operation of u2mac. If this feature is\nenabled, then the 2.0 mac operating in HS ignores the UTMI/ULPI\nLinestate during the transmit of a token (during token-to-token\nand token-to-data IPGAP). When enabled, the controller\nimplements a fixed 40-bit TxEndDelay after the packet is given\non UTMI and ignores the Linestate during this time. This feature\nis applicable only in HS mode of operation.\nDevice mode: If GUCTL1.TX_IPGAP_LINECHECK_DIS is set, then\nfor device LPM handshake, the core will ignore the Linestate after\nTX and wait for a fixed clocks (40 bit times equivalent) after\ntransmitting ACK on utmi.\nHost mode: If GUCTL1.TX_IPGAP_LINECHECK_DIS is set, then\nthe ipgap between (tkn to tkn/data) is added by 40 bit times of\nTXENDDELAY, and linestate is ignored during this 40 bit times\ndelay.\nEnable this bit if the LineState will not reflect the expected line\nstate (J) during transmission. This bit is quasi-static, i.e., should\nnot be changed during device operation."
          - name: dev_trb_out_spr_ind
            bits: "27:27"
            access: RW
            reset: 0x0
            desc: "1'b0: Default behavior, no change in TRB status dword.\n1'b1: Feature enable, OUT TRB status indicates Short Packet.\nThis bit is applicable for device mode only (and ignored in host\nmode). If the device application (SW/HW) wants to know if a\nshort packet was received for an OUT in the TRB status itself,\nthen this feature can be enabled, so that a bit is set in the TRB\nwriteback in the buf_size dword. Bit[26] - SPR of the trbstatus,\nRSVD, SPR,PCM1, bufsize dword will be set during an OUT\ntransfer TRB write back if this is the last TRB used for that\ntransfer descriptor. This bit is quasi-static, i.e., should not be\nchanged during device operation."
          - name: dve_force_20clk_for_30clk
            bits: "26:26"
            access: RW
            reset: 0x0
            desc: "Not applied."
          - name: p3_in_u2
            bits: "25:25"
            access: RW
            reset: 0x0
            desc: "Not applied."
          - name: dev_l1_exit_by_hw
            bits: "24:24"
            access: RW
            reset: 0x0
            desc: "1'b0: Default behavior, disables device L1 hardware exit logic.\n1'b1: Feature enabled\nThis bit is applicable for device mode (2.0) only. This field enables\ndevice controller sending remote wakeup for L1 if the device\nbecomes ready for sending/accepting data when in L1 state. If\nthe host expects the device to send remote wkp signaling to\nresume after going into L1 in flow controlled state, then this bit\ncan be set to send the remote wake signal automatically when\nthe device controller becomes ready. This HW remote wake\nfeature is applicable only to bulk and interrupt transfers, and not\nfor Isoch/Control\nWhen control transfers are in progress, the LPM will be rejected\n(NYET response). Only after control transfers are completed\n(either with ACK/STALL), LPM will be accepted\nFor Isoch transfers, the host needs to do the wake-up and start\nthe transfer. Device controller will not do remote-wakeup when\nIsoch endpoints get ready. The device SW needs to keep the\nGUSB2PHYCFG[EnblSlpM] reset in order to keep the PHY clock to\nbe running for keeping track of SOF intervals.\nWhen L1 hibernation is enabled, the controller will not do\nautomatic exit for hibernation requests thru L1.\nThis bit is quasi-static, i.e., should not be changed during device\noperation."
          - name: ip_gap_add_on
            bits: "23:21"
            access: RW
            reset: 0x0
            desc: "This register field is used to add on to the default inter packet\ngap setting in the USB 2.0 MAC."
          - name: dev_lsp_tail_lock_dis
            bits: "20:20"
            access: RW
            reset: 0x0
            desc: "1'b0: Default behaviour, enables device lsp lock logic for tail TRB\nupdate.\n1'b1: Fix disabled\nThis is a bug fix for STAR 9000716195 that affects the CSP mode\nfor OUT endpoints in device mode. The issue is that tail TRB\nindex is not synchronized with the cache Scratchpad bytecount\nupdate. If the fast-forward request comes in-between the\nbytecount update on a newly fetched TRB and the tail-index write\nupdate in TPF, the RDP works on an incorrect tail index and\nmisses the byte count decrement for the newly fetched TRB in\nthe fast-forwarding process. This fix needs to be present all the\ntimes."
          - name: nak_per_enh_fs
            bits: "19:19"
            access: RW
            reset: 0x0
            desc: "1'b1: Enables performance enhancement for FS async endpoints\nin the presence of NAKs.\n1'b0: Enhancement not applied.\nIf a periodic endpoint is present, and if a bulk endpoint which is\nalso active is being NAKed by the device, then this could result in\na decrease in performance of other Full Speed bulk endpoint\nwhich is ACKed by the device. Setting this bit to 1, will enable the\nhost controller to schedule more transactions to the async\nendpoints (bulk/ control) and hence will improve the performance\nof the bulk endpoint. This control bit should be enabled only if the\nexisting performance with the default setting is not sufficient for\nyour FullSpeed application. Setting this bit will only control, and\nis only required for Full Speed transfers."
          - name: nak_per_enh_hs
            bits: "18:18"
            access: RW
            reset: 0x1
            desc: "1'b1: Enables performance enhancement for HS async endpoints\nin the presence of NAKs.\n1'b0: Enhancement not applied.\nIf a periodic endpoint is present, and if a bulk endpoint which is\nalso active is being NAKed by the device, then this could result in\na decrease in performance of other High Speed bulk endpoint\nwhich is ACKed by the device. Setting this bit to 1, will enable the\nhost controller to schedule more transactions to the async\nendpoints (bulk/ control) and hence will improve the performance\nof the bulk endpoint. This control bit should be enabled only if the\nexisting performance with the default setting is not sufficient for\nyour HighSpeed application. Setting this bit will only control, and\nis only required for High Speed transfers."
          - name: parkmode_disbale_ss
            bits: "17:17"
            access: RW
            reset: 0x0
            desc: "Not applied."
          - name: parkmode_disable_hs
            bits: "16:16"
            access: RW
            reset: 0x0
            desc: "This bit is used only in host mode.\nWhen this bit is set to 1 all HS bus instances park mode are\ndisabled.\nTo improve performance in park mode, the xHCI scheduler\nqueues in three requests of 4 packets each for High Speed\nasynchronous endpoints in a micro-frame. But if a device is slow\nand if it NAKs more than 3 times, then it is rescheduled only in\nthe next micro-frame. This could decrease the performance of a\nslow device even further.\nIn a few High Speed devices (such as Sandisk Cruzer Blade 4GB\nVID: 1921, PID: 21863 and Flex Drive VID: 3744, PID: 8552)\nwhen an IN request is sent within 900ns of the ACK of the\nprevious packet, these devices send a NAK. When connected to\nthese devices, if required, the software can disable the park\nmode if you see performance drop in your system. When park\nmode is disabled, pipelining of multiple packet is disabled and\ninstead one packet at a time is requested by the scheduler. This\nallows up to 12 NAKs in a micro-frame and improves performance\nof these slow devices."
          - name: parkmod_disavale_fsls
            bits: "15:15"
            access: RW
            reset: 0x0
            desc: "This bit is used only in host mode, and is for debug purpose only.\nWhen this bit is set to 1 all FS/LS bus instances in park mode\ndisabled."
          - name: reserved_14_9
            bits: "14:9"
            access: RO
            reset: 0x00
            desc: "Reserved."
          - name: l1_susp_thrld_en_for_host
            bits: "8:8"
            access: RW
            reset: 0x1
            desc: "This bit is used only in host mode.\nThe host controller asserts the utmi_l1_suspend_n and\nutmi_sleep_n output signals (see LPM Interface Signals table in\nthe Databook) as follows:\nThe controller asserts the utmi_l1_suspend_n signal to put the\nPHY into deep low-power mode in L1 when both of the following\nare true:\nThe HIRD/BESL value used is greater than or equal to the value\nin L1_SUSP_THRLD_FOR_HOST field.\nThe L1_SUSP_THRLD_EN_FOR_HOST bit is set to 1'b1. The\ncontroller asserts utmi_sleep_n on L1 when one of the following\nis true:\nThe HIRD/BESL value used is less than the value in\nL1_SUSP_THRLD_FOR_HOST field.\nThe L1_SUSP_THRLD_EN_FOR_HOST bit is set to 1'b0."
          - name: l1_susp_thrld_for_host
            bits: "7:4"
            access: RW
            reset: 0x8
            desc: "This field is effective only when the\nL1_SUSP_THRLD_EN_FOR_HOST bit is set to 1. For more details,\nrefer to the description of the L1_SUSP_THRLD_EN_FOR_HOST\nbit."
          - name: hc_errata_enable
            bits: "3:3"
            access: RW
            reset: 0x1
            desc: "Not applied."
          - name: hc_parchk_disable
            bits: "2:2"
            access: RW
            reset: 0x0
            desc: "Host Parameter Check Disable.\nWhen this bit is set to 0 (by default), the xHC checks that the\ninput slot/EP context fields comply to the xHCI Specification.\nUpon detection of a parameter error during command execution,\nthe xHC generates an event TRB with completion code indicating\nPARAMETER ERROR.\nWhen the bit is set to 1, the xHC does not perform parameter\nchecks and does not generate PARAMETER ERROR completion\ncode."
          - name: ovrld_l1_susp_com
            bits: "1:1"
            access: RW
            reset: 0x1
            desc: "If this bit is set, the utmi_l1_suspend_com_n is overloaded with\nthe utmi_sleep_n signal. This bit is usually set if the PHY stops\nthe port clock during L1 sleep condition."
          - name: loa_filter_en
            bits: "0:0"
            access: RW
            reset: 0x0
            desc: "If this bit is set, the USB 2.0 port babble is checked at least three\nconsecutive times before the port is disabled. This prevents false\ntriggering of the babble condition when using low quality cables.\nNote: This bit is valid only in host mode."

      - addr: 0xC120
        name: USB3OTG_GSNPSID
        access: RO
        width: 4
