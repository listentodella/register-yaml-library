            desc: "Disconnect Detected Event Enable.\n1'b0: Disable this event\n1'b1: Enable this event"

      - addr: 0xC70C
        name: USB3OTG_DSTS
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00520000
        desc: "Device Status Register"
        fields:
          - name: reserved_31_30
            bits: "31:30"
            access: RO
            reset: 0x0
            desc: "Reserved."
          - name: dcnrd
            bits: "29:29"
            access: RW
            reset: 0x0
            desc: "Device Controller Not Ready.\nThe bit indicates that the core is in the process of completing the\nstate transitions after exiting from hibernation.\nTo complete the state transitions, it takes 256 bus clock cycles\nfrom the time DCTL[31].Run/Stop is set. During hibernation, if\nthe UTMI/ULPI PHY is in suspended state, then the 256-bus clock\ncycle delay starts after the PHY exited suspended state. Software\nmust set DCTL[31].Run/Stop to 1 and wait for this bit to be deasserted to zero before processing DSTS.USBLnkSt."
          - name: reserved_28_26
            bits: "28:26"
            access: RO
            reset: 0x0
            desc: "Reserved."
          - name: rss
            bits: "25:25"
            access: RW
            reset: 0x0
            desc: "Restore State Status.\nThis bit is similar to the USBSTS.RSS in host mode.\nWhen the controller finishes the restore process, it completes the\ncommand by setting DSTS.RSS to 0."
          - name: sss
            bits: "24:24"
            access: RO
            reset: 0x0
            desc: "Save State Status.\nThis bit is similar to the USBSTS.SSS in host mode.\nWhen the controller has finished the save process, it completes\nthe command by setting DSTS.SSS to 0."
          - name: coreidle
            bits: "23:23"
            access: RO
            reset: 0x0
            desc: "Core Idle.\nThe bit indicates that the core finished transferring all RxFIFO\ndata to system memory, writing out all completed descriptors,\nand all Event Counts are zero.\nNote: While testing for Reset values, mask out the read value.\nThis bit represents the changing state of the core and does not\nhold a static value."
          - name: devctrlhlt
            bits: "22:22"
            access: RO
            reset: 0x1
            desc: "Device Controller Halted.\nThis bit is set to 0 when the Run/Stop bit in the DCTL register is\nset to 1.\nThe core sets this bit to 1 when, after SW sets Run/Stop to 0, the\ncore is idle and the lower layer finishes the disconnect process.\nWhen Halted=1, the core does not generate Device events.\nNote: The core does not set this bit to 1 if GEVNTCOUNTn has\nsome valid value. Software needs to acknowledge the events that\nare generated (by writing to GEVNTCOUNTn) while it is waiting\nfor this bit to be set to 1."
          - name: usblnkst
            bits: "21:18"
            access: RO
            reset: 0x4
            desc: "USB/Link State\nIn SS mode: LTSSM State\n4'h0: U0\n4'h1: U1\n4'h2: U2\n4'h3: U3\n4'h5: RX_DET\n4'h6: SS_INACT\n4'h7: POLL\n4'h8: RECOV\n4'h9: HRESET\n4'ha: CMPLY\n4'hb: LPBK\n4'hf: Resume/Reset\nIn HS/FS/LS mode:\n4'h0: On state\n4'h2: Sleep (L1) state\n4'h3: Suspend (L2) state\n4'h4: Disconnected state (Default state)\n4'h5: Early Suspend state (valid only when Hibernation is\ndisabled, GCTL[1].GblHibernationEn = 0)\n4'he: Reset (valid only when Hibernation is enabled,\nGCTL[1].GblHibernationEn = 1)\n4'hf: Resume (valid only when Hibernation is enabled,\nGCTL[1].GblHibernationEn = 1)\nThe link state Resume/Reset indicates that the core received a\nresume or USB reset request from the host while the link was in\nhibernation. Software must write 8 (Recovery) to the\nDCTL.ULStChngReq field to acknowledge the resume/reset\nrequest.\nWhen Hibernation is enabled, GCTL[1].GblHibernationEn = 1, this\nfield USBLnkSt is valid only when DCTL[31].Run/Stop set to 1\nand DSTS[29].DCNRD = 0."
          - name: rx_fifo_empty
            bits: "17:17"
            access: RO
            reset: 0x1
            desc: "Rx Fifo Empty."
          - name: reserved_16_3
            bits: "16:3"
            access: RO
            reset: 0x0000
            desc: "Reserved."
          - name: connectspd
            bits: "2:0"
            access: RU
            reset: 0x0
            desc: "Connected Speed.\nIndicates the speed at which the DWC_usb3 core has come up\nafter speed detection through a chirp sequence.\n3'b000: High-speed (PHY clock is running at 30 or 60 MHz)\n3'b001: Full-speed (PHY clock is running at 30 or 60 MHz)"

      - addr: 0xC710
        name: USB3OTG_DGCMDPAR
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000000
        desc: "Device Generic Command Parameter Register"
        fields:
          - name: parameter
            bits: "31:0"
            access: RW
            reset: 0x00000000
            desc: "This register indicates the device command parameter. This must\nbe programmed before or along with the device command. The\navailable device commands are listed in DGCMD register."

      - addr: 0xC714
        name: USB3OTG_DGCMD
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000000
        desc: "Device Generic Command Register"
        fields:
          - name: reserved_31_16
            bits: "31:16"
            access: RO
            reset: 0x0000
            desc: "Reserved."
          - name: cmdstatus
            bits: "15:12"
            access: RO
            reset: 0x0
            desc: "Command Status:\n1'b1: CmdErr: Indicates that the device controller encountered an\nerror while processing the command.\n1'b0: Indicates command success"
          - name: reserved_11_10
            bits: "11:10"
            access: RO
            reset: 0x0
            desc: "Reserved."
          - name: cmdact
            bits: "9:9"
            access: RW_SC
            reset: 0x0
            desc: "Command Active.\nThe software sets this bit to 1 to enable the device controller to\nexecute the generic command.\nThe device controller sets this bit to 0 after executing the\ncommand."
          - name: cmdioc
            bits: "8:8"
            access: RW
            reset: 0x0
            desc: "Command Interrupt on Complete.\nWhen this bit is set, the device controller issues a Generic\nCommand Completion event after executing the command.\nNote that this interrupt is mapped to DCFG.IntrNum.\nNote: This field must not set to 1 if the DCTL.RunStop field is 0."
          - name: cmdtyp
            bits: "7:0"
            access: RW
            reset: 0x00
            desc: "Command Type.\nSpecifies the type of command the software driver is requesting\nthe core to perform.\n8'h0: Reserved\n8'h1: Set Endpoint Configuration - 64 or 96-bit Parameter\n8'h2: Set Endpoint Transfer Resource Configuration - 32-bit\nParameter\n8'h3: Get Endpoint State - No Parameter Needed\n8'h4: Clear Stall (see Set Stall) - No Parameter Needed\n8'h5: Start Transfer - 64-bit Parameter\n8'h6: Update Transfer - No Parameter Needed\n8'h7: End Transfer - No Parameter Needed\n8'h8 Start New Configuration - No Parameter Needed"

      - addr: 0xC720
        name: USB3OTG_DALEPENA
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000000
        desc: "Device Active USB Endpoint Enable Register"
        fields:
          - name: usbactep
            bits: "31:0"
            access: RW
            reset: 0x00000000
            desc: "USB Active Endpoints.\nThis field indicates if a USB endpoint is active in the current\nconfiguration and interface. It applies to USB IN endpoints 0~15\nand OUT endpoints 0~15, with one bit for each of the 32 possible\nendpoints. Even numbers are for USB OUT endpoints, and odd\nnumbers are for USB IN endpoints, as follows:\nBit[0]: USB EP0-OUT\nBit[1]: USB EP0-IN\nBit[2]: USB EP1-OUT\nBit[3]: USB EP1-IN\n...\nThe entity programming this register must set bits 0 and 1\nbecause they enable control endpoints that map to physical\nendpoints (resources) after USBReset.\nHardware clears these bits for all endpoints (other than EP0-OUT\nand EP0-IN) after detecting a USB reset event. After receiving\nSetConfiguration and SetInterface requests, the application must\nprogram endpoint registers accordingly and set these bits."

      - addr: 0xC800
        name: USB3OTG_DEPnCMDPAR2
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000000
        desc: "Device Physical Endpoint-n Command Parameter 2 Register, offset (0xc800 + 4*n), n=0~12"
        fields:
          - name: parameter
            bits: "31:0"
            access: RW
            reset: 0x00000000
            desc: "This register indicates the physical endpoint command Parameter\n2. It must be programmed before issuing the command."

      - addr: 0xC804
        name: USB3OTG_DEPnCMDPAR1
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000000
        desc: "Device Physical Endpoint-n Command Parameter 1 Register, offset (0xc804 + 4*n), n=0~12"
        fields:
          - name: parameter
            bits: "31:0"
            access: RW
            reset: 0x00000000
            desc: "This register indicates the physical endpoint command Parameter\n1. It must be programmed before issuing the command."

      - addr: 0xC808
        name: USB3OTG_DEPnCMDPAR0
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000000
        desc: "Device Physical Endpoint-n Command Parameter 0 Register, offset (0xc808 + 4*n), n=0~12"
        fields:
          - name: parameter
            bits: "31:0"
            access: RW
            reset: 0x00000000
            desc: "This register indicates the physical endpoint command Parameter\n0. It must be programmed before issuing the command."

      - addr: 0xC80C
        name: USB3OTG_DEPnCMD
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000000
        desc: "Device Physical Endpoint-n Command Register, offset (0xc80c + 4*n), n=0~12"
        fields:
          - name: commandparam
            bits: "31:16"
            access: RW
            reset: 0x0000
            desc: "Command Parameters or Event Parameters\nwhen this register is written:\nFor Start Transfer command: The 16-bit StreamID assigned to\nthis transfer.\nFor Start Transfer command applied to an isochronous endpoint:\nStartMicroFramNum, Indicates the (micro) frame number to\nwhich the first TRB applies.\nFor Update Transfer, End Transfer, and Start New Configuration\ncommands: [22:16]: Transfer Resource Index (XferRscIdx). The\nhardware-assigned transfer resource index for the transfer, which\nwas returned in response to the Start Transfer command. The\napplication software-assigned transfer resource index for a Start\nNew Configuration command.\nEvent Parameters (EventParam), when this register is read."
          - name: cmdstatus
            bits: "15:12"
            access: RW
            reset: 0x0
            desc: "Command Completion Status.\nThe information is in the same format as bits 15:12 of the\nEndpoint Command Complete event."
          - name: hipri_forcerm
            bits: "11:11"
            access: RW
            reset: 0x0
            desc: "HighPriority: Only valid for Start Transfer command.\nForceRM: Only valid for End Transfer command.\nClearPendIN: Only valid for Clear Stall command. Software sets\nthis bit to clear any pending IN transaction (on that endpoint)\nstuck at the lower layers when a Clear Stall command is issued."
          - name: cmdact
            bits: "10:10"
            access: RW
            reset: 0x0
            desc: "Command Active.\nSoftware sets this bit to 1 to enable the device endpoint\ncontroller to execute the generic command.\nThe device controller sets this bit to 0 when the CmdStatus field\nis valid and the endpoint is ready to accept another command.\nThis does not imply that all the effects of the previously-issued\ncommand have taken place."
          - name: reserved_9
            bits: "9:9"
            access: RO
            reset: 0x0
            desc: "Reserved."
          - name: cmdioc
            bits: "8:8"
            access: RW
            reset: 0x0
            desc: "Command Interrupt on Complete.\nWhen this bit is set, the device controller issues a generic\nEndpoint Command Complete event after executing the\ncommand.\nNote that this interrupt is mapped to DEPCFG.IntrNum.\nWhen the DEPCFG command is executed, the command interrupt\non completion goes to the interrupt pointed by the\nDEPCFG.IntrNum in the current command.\nNote: This field must not set to 1 if the DCTL.RunStop field is 0."
          - name: reserved_7_4
            bits: "7:4"
            access: RO
            reset: 0x0
            desc: "Reserved."
          - name: cmdtyp
            bits: "3:0"
            access: RW
            reset: 0x0
            desc: "Command Type.\nSpecifies the type of command the software driver is requesting\nthe core to perform.\n4'h0: Reserved\n4'h1: Set Endpoint Configuration 64 or 96-bit Parameter\n4'h2: Set Endpoint Transfer Resource Configuration - 32bitparameter\n4'h3: Get Endpoint State - No Parameter Needed\n4'h4: Set Stall - No Parameter Needed\n4'h5: Clear Stall (see Set Stall) - No Parameter Needed\n4'h6: Start Transfer - 64-bit Parameter\n4'h7: Update Transfer - No Parameter Needed\n4'h8: End Transfer - No Parameter Needed\n4'h9: Start New Configuration - No Parameter Needed"
