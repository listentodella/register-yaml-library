            desc: "SNPSID[31:16] indicates Core Identification Number. 0x5533 is\nASCII for U3 (DWC_usb3).\nSNPSID[15:0] indicates the release number. Current Release is\n3.00a.\nSoftware uses this register to configure release-specific features\nin the driver."

      - addr: 0xC124
