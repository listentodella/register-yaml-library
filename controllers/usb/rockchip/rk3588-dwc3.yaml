            access: RW
            reset: 0x00
            desc: "Device TxFIFO priority.\nThis register specifies the relative DMA priority level among the\nDevice TXFIFOs (one per IN endpoint). Each register bit[n]\ncontrols the priority (1: high, 0: low) of each TXFIFO[n]. When\nmultiple TXFIFOs compete for DMA service at a given time (that\nis, multiple TXQs contain TX DMA requests and their\ncorresponding TXFIFOs have space available), the TX DMA arbiter\ngrants access on a packet-basis in the following manner:\n1. High-priority TXFIFOs are granted access using round-robin\narbitration\n2. Low-priority TXFIFOs are granted access using round-robin\narbitration only after the high-priority TXFIFOs have no further\nprocessing to do (that is, either the TXQs are empty or the\ncorresponding TXFIFOs are full).\nFor scatter-gather packets, the arbiter grants successive DMA\nrequests to the same FIFO until the entire packet is completed.\nWhen configuring periodic IN endpoints, software must set\nregister bit[n]=1, where n is the TXFIFO assignment. This\nensures that the DMA for isochronous or interrupt IN endpoints\nare prioritized over bulk or control IN endpoints.\nThis register is present only when the core is configured to\noperate in the device mode. The register size corresponds to the\nnumber of Device IN endpoints."

      - addr: 0xC618
        name: USB3OTG_GTXFIFOPRIHST
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000000
        desc: "Global Host TX FIFO DMA Priority Register"
        fields:
          - name: reserved_31_3
            bits: "31:3"
            access: RO
            reset: 0x00000000
            desc: "Reserved."
          - name: gtxfifoprihst
            bits: "2:0"
            access: RW
            reset: 0x0
            desc: "Host TxFIFO priority.\nThis register specifies the relative DMA priority level among the\nHost TXFIFOs (one per USB bus instance) within the associated\nspeed group (HS/FSLS). Each register bit[n] controls the priority\n(1: high, 0: low) of TXFIFO[n] within a speed group. When\nmultiple TXFIFOs compete for DMA service at a given time (i.e.,\nmultiple TXQs contain TX DMA requests and their corresponding\nTXFIFOs have space available), the TX DMA arbiter grants access\non a packet-basis in the following manner:\n1. Among the FIFOs in the same speed group (HS/FSLS):\na. High-priority TXFIFOs are granted access using round-robin\narbitration\nb. Low-priority TXFIFOs are granted access using round-robin\narbitration only after the high-priority TXFIFOs have no further\nprocessing to do (that is, either the TXQs are empty or the\ncorresponding TXFIFOs are full).\n2. The TX DMA arbiter prioritizes the HS/FSLS speed group\naccording to the ratio programmed in the GDMAHLRATIO register.\nFor scatter-gather packets, the arbiter grants successive DMA\nrequests to the same FIFO until the entire packet is completed.\nThis register is present only when the core is configured to\noperate in the host mode (includes DRD and OTG modes). The\nregister size corresponds to the number of configured USB bus\ninstances; for example, in the default configuration, there are 2\nUSB bus instances (1 HS, and 1 FSLS)."

      - addr: 0xC61C
        name: USB3OTG_GRXFIFOPRIHST
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000000
        desc: "Global Host RX FIFO DMA Priority Register"
        fields:
          - name: reserved_31_3
            bits: "31:3"
            access: RO
            reset: 0x00000000
            desc: "Reserved."
          - name: grxfifoprihst
            bits: "2:0"
            access: RW
            reset: 0x0
            desc: "Host RxFIFO priority\nThis register specifies the relative DMA priority level among the\nHost RXFIFOs (one per USB bus instance) within the associated\nspeed group (HS/FSLS). Each register bit[n] controls the priority\n(1: high, 0: low) of RXFIFO[n] within a speed group. When\nmultiple RXFIFOs compete for DMA service at a given time (i.e.,\nmultiple RXQs contain RX DMA requests and their corresponding\nRXFIFOs have data available), the RX DMA arbiter grants access\non a packet-basis in the following manner:\n1. Among the FIFOs in the same speed group (HS/FSLS):\na. High-priority RXFIFOs are granted access using round-robin\narbitration\nb. Low-priority RXFIFOs are granted access using round-robin\narbitration only after high-priority RXFIFOs have no further\nprocessing to do (that is, either the RXQs are empty or the\ncorresponding RXFIFOs do not have the required data).\n2. The RX DMA arbiter prioritizes the HS/FSLS speed group\naccording to the ratio programmed in the GDMAHLRATIO register.\nFor scatter-gather packets, the arbiter grants successive DMA\nrequests to the same FIFO until the entire packet is completed.\nThis register is present only when the core is configured to\noperate in the host mode (includes DRD and OTG modes). The\nregister size corresponds to the number of configured USB bus\ninstances; for example, in the default configuration, there are 2\nUSB bus instances (1 HS, and 1 FSLS)."

      - addr: 0xC620
        name: USB3OTG_GFIFOPRIDBC
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000000
        desc: "Global Host Debug Capability DMA Priority Register"
        fields:
          - name: reserved_31_2
            bits: "31:2"
            access: RO
            reset: 0x00000000
            desc: "Reserved."
          - name: gfifopridbc
            bits: "1:0"
            access: RW
            reset: 0x0
            desc: "Host DbC DMA priority.\nThis register specifies the relative priority of the RXFIFOs and\nTXFIFOs associated with the DbC mode. It overrides the priority\nassigned in the corresponding indexes of the Host RXFIFO and\nTXFIFO DMA priority registers, when the DbC mode is enabled."

      - addr: 0xC624
        name: USB3OTG_GDMAHLRATIO
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000000
        desc: "Global Host FIFO DMA High-Low Priority Ratio Register"
        fields:
          - name: reserved_31_22
            bits: "31:22"
            access: RO
            reset: 0x000
            desc: "Reserved."
          - name: hstrxfifo
            bits: "21:8"
            access: RW
            reset: 0x0000
            desc: "Host RXFIFO DMA High-Low Priority."
          - name: reserved_7_5
            bits: "7:5"
            access: RO
            reset: 0x0
            desc: "Reserved."
          - name: hsttxfifo
            bits: "4:0"
            access: RW
            reset: 0x00
            desc: "Host TXFIFO DMA High-Low Priority."

      - addr: 0xC630
        name: USB3OTG_GFLADJ
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000000
        desc: "Global Frame Length Adjustment Register"
        fields:
          - name: gfladj_refclk_240mhzdecr_pls1
            bits: "31:31"
            access: RW
            reset: 0x0
            desc: "This field indicates that the decrement value that the controller\napplies for each ref_clk must be GFLADJ_REFCLK_240MHZ_DECR\nand GFLADJ_REFCLK_240MHZ_DECR +1 alternatively on each\nref_clk.\nSet this bit to a 1 only if GFLADJ_REFCLK_LPM_SEL is set to 1\nand the fractional component of 240/ref_frequency is greater\nthan or equal to 0.5.\nExamples:\nIf the ref_clk is 24 MHz then\n1. GUCTL.REF_CLK_PERIOD = 41\n2. GFLADJ.GFLADJ_REFCLK_240MHZ_DECR = (240/24) = 10\n3. GFLADJ.GFLADJ_REFCLK_240MHZDECR_PLS1 = 0"
          - name: gfladj_refclk_240mhz_decr
            bits: "30:24"
            access: RW
            reset: 0x00
            desc: "This field indicates the decrement value that the controller applies\nfor each ref_clk in order to derive a frame timer in terms of a\n240-MHz clock.\nThis field must be programmed to a non-zero value only if\nGFLADJ_REFCLK_LPM_SEL is set to 1.\nThe value is derived as follows:\nGFLADJ_REFCLK_240MHZ_DECR = 240/ref_clk_frequency\nExamples: If the ref_clk is 24 MHz then\n1. GUCTL.REF_CLK_PERIOD = 41\n2. GFLADJ.GFLADJ_REFCLK_240MHZ_DECR = 240/24 = 10"
          - name: gfladj_refclk_lpm_sel
            bits: "23:23"
            access: RW
            reset: 0x0
            desc: "This bit enables the functionality of running SOF counters on the\nref_clk. This bit must not be set to 1 if GCTL.SOFITPSYNC bit is\nset to 1. Similarly, if GFLADJ_REFCLK_LPM_SEL set to 1,\nGCTL.SOFITPSYNC must not be set to 1.\nNote that the ref_clk frequencies supported in this mode are\n16/17/19.2/20/24/39.7/40 MHz. The utmi_clk[0] signal of the\ncore must be connected to the FREECLK of the PHY.\nNote: If you set this bit to 1, the\nGUSB2PHYCFG.U2_FREECLK_EXISTS bit must be set to 0."
          - name: reserved_22
            bits: "22:22"
            access: RO
            reset: 0x0
            desc: "Reserved."
          - name: gfladj_refclk_fladj
            bits: "21:8"
            access: RW
            reset: 0x0000
            desc: "This field indicates the frame length adjustment to be applied\nwhen SOF counter is running on the ref_clk.\nSOF interval when GLADJ.GFLADJ_REFCLK_LPM_SEL is set to 1.\nThis field must be programmed to a non-zero value only if\nGFLADJ_REFCLK_LPM_SEL is set to 1 or GCTL.SOFITPSYNC is set\nto 1.\nThe value is derived as follows:\nFLADJ_REF_CLK_FLADJ=((125000/ref_clk_period_integer) -\n(125000/ref_clk_period)) * ref_clk_period where:\n1. The ref_clk_period_integer is the integer value of the ref_clk\nperiod got by truncating the decimal (fractional) value that is\nprogrammed in the GUCTL.REF_CLK_PERIOD field.\n2. The ref_clk_period is the ref_clk period including the fractional\nvalue.\nExamples: If the ref_clk is 24 MHz then\n1. GUCTL.REF_CLK_PERIOD = 41\n2. GFLADJ.GLADJ_REFCLK_FLADJ = ((125000/41) -\n(125000/41.6666)) * 41.6666 = 2032 (ignoring the fractional\nvalue)."
          - name: gfladj_30mhz_sdbnd_sel
            bits: "7:7"
            access: RW
            reset: 0x0
            desc: "This field selects whether to use the input signal fladj_30mhz_reg\nor the GFLADJ.GFLADJ_30MHZ to adjust the frame length for the\nSOF. When this bit is set to:\n1'b1: the controller uses the register field\nGFLADJ.GFLADJ_30MHZ value\n1'b0: the controller uses the input signal fladj_30mhz_reg value."
          - name: reserved_6
            bits: "6:6"
            access: RO
            reset: 0x0
            desc: "Reserved."
          - name: gfadj_30mhz
            bits: "5:0"
            access: RW
            reset: 0x00
            desc: "This field indicates the value that is used for frame length\nadjustment instead of considering from the sideband input signal\nfladj_30mhz_reg.\nThis enables post-silicon frame length adjustment in case the\ninput signal fladj_30mhz_reg is connected to a wrong value or is\nnot valid.\nFor details on how to set this value, refer to section 5.2.4, \"Frame\nLength Adjustment Register (FLADJ),\" of the xHCI Specification."

      - addr: 0xC700
        name: USB3OTG_DCFG
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00080000
        desc: "Device Configuration Register"
        fields:
          - name: reserved_31_24
            bits: "31:24"
            access: RO
            reset: 0x00
            desc: "Reserved."
          - name: ignstrmpp
            bits: "23:23"
            access: RW
            reset: 0x0
            desc: "This bit only affects stream-capable bulk endpoints. Not applied."
          - name: lpmcap
            bits: "22:22"
            access: RW
            reset: 0x0
            desc: "LPM Capable. Not applied."
          - name: nump
            bits: "21:17"
            access: RW
            reset: 0x04
            desc: "Number of Receive Buffers. Not applied."
          - name: intrnum
            bits: "16:12"
            access: RW
            reset: 0x00
            desc: "Interrupt number.\nIndicates interrupt/EventQ number on which non-endpointspecific device-related interrupts (see DEVT) are generated."
          - name: reserved_11_10
            bits: "11:10"
            access: RO
            reset: 0x0
            desc: "Reserved."
          - name: devaddr
            bits: "9:3"
            access: RW
            reset: 0x00
            desc: "Device Address.\nThe application must perform the following:\n1. Program this field after every SetAddress request.\n2. Reset this field to zero after USB reset."
          - name: devspd
            bits: "2:0"
            access: RW
            reset: 0x0
            desc: "Device Speed.\nIndicates the speed at which the application requires the core to\nconnect, or the maximum speed the application can support.\nHowever, the actual bus speed is determined only after the chirp\nsequence is completed, and is based on the speed of the USB\nhost to which the core is connected.\n3'b000: High-speed (USB 2.0 PHY clock is 30 MHz or 60 MHz)\n3'b001: Full-speed (USB 2.0 PHY clock is 30 MHz or 60 MHz)"

      - addr: 0xC704
        name: USB3OTG_DCTL
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00F00000
        desc: "Device Control Register"
        fields:
          - name: run_stop
            bits: "31:31"
            access: RW
            reset: 0x0
            desc: "The software writes 1 to this bit to start the device controller\noperation.\nTo stop the device controller operation, the software must remove\nany active transfers and write 0 to this bit. When the controller is\nstopped, it sets the DSTS.DevCtrlHlt bit when the core is idle and\nthe lower layer finishes the disconnect process.\nThe Run/Stop bit must be used in following cases as specified:\n1. After power-on reset and CSR initialization, the software must\nwrite 1 to this bit to start the device controller. The controller\ndoes not signal connect to the host until this bit is set.\n2. The software uses this bit to control the device controller to\nperform a soft disconnect. When the software writes 0 to this bit,\nthe host does not see that the device is connected. The device\ncontroller stays in the disconnected state until the software writes\n1 to this bit.\nThe minimum duration of keeping this bit cleared is specified in\nthe Note below. If the software attempts a connect after the soft\ndisconnect or detects a disconnect event, it must set DCTL[8:5]\nto 5 before reasserting the Run/Stop bit.\n3. When the USB is in a lower power state and the Two Power\nRails configuration is selected, software writes 0 to this bit to\nindicate that it is going to turn off the Core Power Rail. After the\nsoftware turns on the Core Power Rail again and re-initializes the\ndevice controller, it must set this bit to start the device controller.\nNote: The following is the minimum duration under various\nconditions for which the soft disconnect (SftDiscon) bit must be\nset for the USB host to detect a device disconnect:\n10ms: For high-speed, when the device state is Suspended, Idle,\nor not Idle/Suspended (performing transactions); For fullspeed/low-speed, when the device state is Suspended, Idle, or\nnot Idle/Suspended (performing transactions).\nTo accommodate clock jitter, it is recommended that the\napplication add extra delay to the specified minimum duration."
          - name: csftrst
            bits: "30:30"
            access: RW_SC
            reset: 0x0
            desc: "Core Soft Reset.\nReset all clock domains as follows:\n1. This bit clears the interrupts and all the CSRs except GSTS,\nGSNPSID, GGPIO, GUID, GUSB2PHYCFGn registers,\nGUSB3PIPECTLn registers, DCFG, DCTL, DEVTEN, and DSTS\nregisters.\n2. All module state machines (except the SoC Bus Slave Unit) are\nreset to the IDLE state, and all the TxFIFOs and the RxFIFO are\nflushed.\n3. Any transactions on the SoC bus Master are terminated as\nsoon as possible, after gracefully completing the last data phase\nof a SoC bus transfer. Any transactions on the USB are\nterminated immediately.\nThe application can write this bit at any time to reset the core.\nThis is a self-clearing bit; the core clears this bit after all\nnecessary logic is reset in the core, which may take several\nclocks depending on the core's current state. Once this bit is\ncleared, the software must wait at least 3 PHY clocks before\naccessing the PHY domain (synchronization delay).\nTypically, software reset is used during software development and\nalso when you dynamically change the PHY selection bits in the\nUSB configuration registers listed above. When you change the\nPHY, the corresponding clock for the PHY is selected and used in\nthe PHY domain. Once a new clock is selected, the PHY domain\nmust be reset for proper operation."
          - name: reserved_29
            bits: "29:29"
            access: RO
            reset: 0x0
            desc: "Reserved."
          - name: hirdthres
            bits: "28:24"
            access: RW
            reset: 0x00
            desc: "HIRD Threshold.\nThe core asserts output signals utmi_l1_suspend_n and\nutmi_sleep_n on the basis of this signal:\nThe core asserts utmi_l1_suspend_n to put the PHY into Deep\nLow-Power mode in L1 when both of the following are true:\n1. HIRD value is greater than or equal to the value in\nDCTL.HIRD_Thres[3:0]\n2. HIRD_Thres[4] is set to 1'b1.\nThe core asserts utmi_sleep_n on L1 when one of the following is\ntrue:\n1. If the HIRD value is less than HIRD_Thres[3:0] or\n2. HIRD_Thres[4] is set to 1'b0.\nNote: This field must be set to '0' during SuperSpeed mode of\noperation."
          - name: lpm_nyet_thres
            bits: "23:20"
            access: RW
            reset: 0xF
            desc: "LPM NYET Threshold\nHandshake response to LPM token specified by device application.\nResponse depends on DCFG.LPMCap.\nDCFG.LPMCap is 1'b0 - The core always responds with Timeout\n(that is, no response).\nDCFG.LPMCap is 1'b1 - The core responds with an ACK on\nsuccessful LPM transaction, which requires that all of the\nfollowing are satisfied:\n1. There are no PID or CRC5 errors in both the EXT token and the\nLPM token (if not true, inactivity results in a timeout ERROR).\n2. No data is pending in the Transmit FIFO and OUT endpoints not\nin flow controlled state (else NYET).\n3. The BESL value in the LPM token is less than or equal to\nLPM_NYET_thres[3:0]."
          - name: keep_connect
            bits: "19:19"
            access: RW
            reset: 0x0
            desc: "When 1, this bit enables the save and restore programming\nmodel by preventing the core from disconnecting from the host\nwhen DCTL.RunStop is set to 0.\nThe device core disconnects from the host when DCTL.RunStop is\nset to 0.\nThis bit indicates whether to preserve this behavior (0), or if the\ncore must not disconnect when RunStop is set to 0 (1)."
          - name: l1_hibernation_en
            bits: "18:18"
            access: RW
            reset: 0x0
            desc: "When this bit is set along with KeepConnect, the device core\ngenerates a Hibernation Request Event if L1 is enabled and the\nHIRD value in the LPM token is larger than the threshold\nprogrammed in DCTL.HIRD_Thres.\nThe core does not exit the LPM L1 state until software writes\nRecovery into the DCTL.ULStChngReq field.\nThis prevents corner cases where the device is entering\nhibernation at the same time the host is attempting to exit L1."
          - name: crs
            bits: "17:17"
            access: RW
            reset: 0x0
            desc: "Controller Restore State.\nThis command is similar to the USBCMD.CRS bit in host mode\nand initiates the restore process. When software sets this bit to 1,\nthe controller immediately sets DSTS.RSS to 1. When the\ncontroller has finished the restore process, it sets DSTS.RSS to 0.\nNote: When read, this field always returns 0."
          - name: css
            bits: "16:16"
            access: RW
            reset: 0x0
            desc: "Controller Save State.\nThis command is similar to the USBCMD.CSS bit in host mode\nand initiates the save process. When software sets this bit to 1,\nthe controller immediately sets DSTS.SSS to 1. When the\ncontroller has finished the save process, it sets DSTS.SSS to 0.\nNote: When read, this field always returns 0."
          - name: reserved_15_13
            bits: "15:13"
            access: RO
            reset: 0x0
            desc: "Reserved."
          - name: initu2ena
            bits: "12:12"
            access: RW
            reset: 0x0
            desc: "Not applied."
          - name: acceptu2ena
            bits: "11:11"
            access: RW
            reset: 0x0
            desc: "Not applied."
          - name: initu1ena
            bits: "10:10"
            access: RW
            reset: 0x0
            desc: "Not applied."
          - name: acceptu1ena
            bits: "9:9"
            access: RW
            reset: 0x0
            desc: "Not applied."
          - name: ulstchngreq
            bits: "8:5"
            access: RW
            reset: 0x0
            desc: "Software writes this field to issue a USB state change request. A\nchange in this field indicates a new request to the core.\nIf software wants to issue the same request back-to-back, it must\nwrite a 0 to this field between the two requests. The result of the\nstate change request is reflected in the USB State in DSTS. These\nbits are self-cleared on the MAC Layer exiting suspended state.\nIf software is updating other fields of the DCTL register and not\nintending to force any link state change, then it must write a 0 to\nthis field.\nIn HS/FS/LS mode:\nValue: Requested USB state transition\n8: Remote wakeup request\nOthers: Reserved\nThe Remote wakeup request must be issued 2us after the device\ngoes into suspend state (DSTS[21:18] is 3 ).\nNote: After coming out of hibernation, software must write 8\n(Recovery) into this field to confirm exit from the suspended\nstate."
          - name: tstctl
            bits: "4:1"
            access: RW
            reset: 0x0
            desc: "Test Control.\n4'b000: Test mode disabled\n4'b001: Test_J mode\n4'b010: Test_K mode\n4'b011: Test_SE0_NAK mode\n4'b100: Test_Packet mode\n4'b101: Test_Force_Enable\nOthers: Reserved"
          - name: reserved_0
            bits: "0:0"
            access: RO
            reset: 0x0
            desc: "Reserved."

      - addr: 0xC708
