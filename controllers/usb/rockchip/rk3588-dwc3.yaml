            desc: "Event Buffer Address.\nHolds the lower 32 bits of start address of the external memory\nfor the Event Buffer. During operation, hardware does not update\nthis address."

      - addr: 0xC404
        name: USB3OTG_GEVNTADRHI0
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
