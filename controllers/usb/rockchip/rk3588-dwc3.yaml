            desc: "Event Buffer Address.\nHolds the higher 32 bits of start address of the external memory\nfor the Event Buffer. During operation, hardware does not update\nthis address."

      - addr: 0xC408
        name: USB3OTG_GEVNTSIZ0
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000000
        desc: "Global Event Buffer Size Register 0"
        fields:
          - name: evntintrptmask
            bits: "31:31"
            access: RW
            reset: 0x0
            desc: "Event Interrupt Mask.\nWhen set to '1', this prevents the interrupt from being generated.\nHowever, even when the mask is set, the events are queued."
          - name: reserved_30_16
