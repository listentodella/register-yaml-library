            reset: 0x0000000
            desc: "Reserved."
          - name: binum1
            bits: "3:0"
            access: RW
            reset: 0x0
            desc: "HS USB Instance Number for Port 1.\nApplication-programmable ID field."

      - addr: 0xC188
        name: USB3OTG_GPRTBIMAP_FSLO
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000000
        desc: "Global Full-Speed Port to Bus Instance Mapping Register - Low"
        fields:
          - name: reserved_31_4
            bits: "31:4"
            access: RO
            reset: 0x0000000
            desc: "Reserved."
          - name: binum1
            bits: "3:0"
            access: RW
            reset: 0x0
            desc: "FS USB Instance Number for Port 1.\nApplication-programmable ID field."

      - addr: 0xC200
        name: USB3OTG_GUSB2PHYCFG0
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x40102400
        desc: "Global USB2 PHY Configuration Register 0"
        fields:
          - name: physoftrst
            bits: "31:31"
            access: RW
            reset: 0x0
            desc: "UTMI PHY Soft Reset.\nCauses the usb2phy_reset signal to be asserted to reset a UTMI\nPHY. Not applicable to ULPI because ULPI PHYs are reset via their\nFunctionControl. Reset register, and the core automatically writes\nto this register when the core is reset (vcc_reset_n,\nUSBCMD.HCRST, DCTL.SoftReset, or GCTL.SoftReset)."
          - name: u2_freeclk_exists
            bits: "30:30"
            access: RW
            reset: 0x1
            desc: "Specifies whether your USB 2.0 PHY provides a free-running PHY\nclock, which is active when the clock control input is active.\nIf your USB 2.0 PHY provides a free-running PHY clock, it must be\nconnected to the utmi_clk[0] input. The remaining utmi_clk[n]\nmust be connected to the respective port clocks. The core uses\nthe Port-0 clock for generating the internal mac2 clock.\n1'b0: USB 2.0 free clock does not exist\n1'b1: USB 2.0 free clock exists\nNote: When the core is configured as device-only, do not set this\nbit to 1."
          - name: reserved_29_25
            bits: "29:25"
            access: RO
            reset: 0x00
            desc: "Reserved."
          - name: lstrd
            bits: "24:22"
            access: RW
            reset: 0x0
            desc: "LS Turnaround Time.\nThis field indicates the value of the Rx-to-Tx packet gap for LS\ndevices. The encoding is as follows:\n3'h0: 2 bit times\n3'h1: 2.5 bit times\n3'h2: 3 bit times\n3'h3: 3.5 bit times\n3'h4: 4 bit times\n3'h5: 4.5 bit times\n3'h6: 5 bit times\n3'h7: 5.5 bit times\nNote:\nThis field is applicable only in Host mode.\nFor normal operation (to work with most LS devices), set the\ndefault value of this field to 3'h0 (2 bit times).\nThe programmable LS device inter-packet gap and turnaround\ndelays are provided to support some legacy LS devices that might\nrequire different delays than the default/fixed ones. For instance,\nthe Open LS mouse requires 3 bit times of inter-packet gap to\nwork correctly."
          - name: lsipd
            bits: "21:19"
            access: RW
            reset: 0x2
            desc: "LS Inter-Packet Time.\nThis field indicates the value of Tx-to-Tx packet gap for LS\ndevices.\nThe encoding is as follows:\n3'h0: 2 bit times\n3'h1: 2.5 bit times\n3'h2: 3 bit times\n3'h3: 3.5 bit times\n3'h4: 4 bit times\n3'h5: 4.5 bit times\n3'h6: 5 bit times\n3'h7: 5.5 bit times\nNote:\nThis field is applicable only in Host mode.\nFor normal operation (to work with most LS devices), set the\ndefault value of this field to 3'h2 (3 bit times).\nThe programmable LS device inter-packet gap and turnaround\ndelays are provided to support some legacy LS devices that might\nrequire different delays than the default/fixed ones. For instance,\nthe AOpen LS mouse requires 3 bit times of inter-packet gap to\nwork correctly."
          - name: reserved_18_14
            bits: "18:14"
            access: RO
            reset: 0x00
            desc: "Reserved."
          - name: usbtrdim
            bits: "13:10"
            access: RW
            reset: 0x9
            desc: "USB 2.0 Turnaround Time.\nSets the turnaround time in PHY clocks.\nSpecifies the response time for a MAC request to the Packet FIFO\nController (PFC) to fetch data from the DFIFO (SPRAM).\nThe following are the required values for the minimum SoC bus\nfrequency of 60 MHz. USB turnaround time is a critical\ncertification criteria when using long cables and five hub levels.\nThe required values for this field:\n4'h5: When the MAC interface is 16-bit UTMI+.\n4'h9: When the MAC interface is 8-bit UTMI+/ULPI.\nIf SoC bus clock is less than 60 MHz, and USB turnaround time is\nnot critical, this field can be set to a larger value.\nNote: This field is valid only in device mode."
          - name: xcvrdly
            bits: "9:9"
            access: RW
            reset: 0x0
            desc: "Transceiver Delay.\nEnables a delay between the assertion of the UTMI/ULPI\nTransceiver Select signal (for HS) and the assertion of the TxValid\nsignal during a HS Chirp.\nWhen this bit is set to 1, a delay (of approximately 2.5 us) is\nintroduced from the time when the Transceiver Select is set to\n2'b00 (HS) to the time the TxValid is driven to 0 for sending the\nchirp-K.\nThis delay is required for some UTMI/ULPI PHYs.\nNote:\nIf you enable the hibernation feature when the device core comes\nout of power-off, you must re-initialize this bit with the\nappropriate value because the core does not save and restore\nthis bit value during hibernation.\nThis bit is valid only in device mode."
          - name: enblslpm
            bits: "8:8"
            access: RW
            reset: 0x0
            desc: "Enable utmi_sleep_n and utmi_l1_suspend_n.\nThe application uses this bit to control utmi_sleep_n and\nutmi_l1_suspend_n assertion to the PHY in the L1 state.\n1'b0: utmi_sleep_n and utmi_l1_suspend_n assertion from the\ncore is not transferred to the external PHY.\n1'b1: utmi_sleep_n and utmi_l1_suspend_n assertion from the\ncore is transferred to the external PHY.\nNote:\nThis bit must be set high for Port0 if SNPS PHY is used.\nIn Device mode - Before issuing any device endpoint command\nwhen operating in 2.0 speeds, disable this bit and enable it after\nthe command completes. Without disabling this bit, if a command\nis issued when the device is in L1 state and if mac2_clk\n(utmi_clk/ulpi_clk) is gated off, the command will not get\ncompleted."
          - name: physel
            bits: "7:7"
            access: RO
            reset: 0x0
            desc: "USB 2.0 High-Speed PHY or USB 1.1 Full-Speed.\n1'b0: USB 2.0 high-speed UTMI+ or ULPI PHY.\n1'b1: USB 1.1 full-speed serial transceiver."
          - name: suspendusb20
            bits: "6:6"
            access: RW
            reset: 0x0
            desc: "Suspend USB2.0 HS/FS/LS PHY.\nWhen set, USB2.0 PHY enters Suspend mode if Suspend\nconditions are valid.\nIf it is set to 1, then the application must clear this bit after\npower-on reset. Application needs to set it to 1 after the core\ninitialization completes.\nFor all other configurations, this bit can be set to 1 during core\nconfiguration.\nNote:\nIn host mode, on reset, this bit is set to 1. Software can override\nthis bit after reset.\nIn device mode, before issuing any device endpoint command\nwhen operating in 2.0 speeds, disable this bit and enable it after\nthe command completes. If you issue a command without\ndisabling this bit when the device is in L2 state and if mac2_clk\n(utmi_clk/ulpi_clk) is gated off, the command will not get\ncompleted."
          - name: reserved_5
            bits: "5:5"
            access: RO
            reset: 0x0
            desc: "Reserved."
          - name: ulpi_utmi_sel
            bits: "4:4"
            access: RO
            reset: 0x0
            desc: "ULPI or UTMI+ Select.\n1'b0: UTMI+ Interface\n1'b1: ULPI Interface"
          - name: phyif
            bits: "3:3"
            access: RW
            reset: 0x0
            desc: "If UTMI+ is selected, the application uses this bit to configure the\ncore to support a UTMI+ PHY with an 8- or 16-bit interface.\n1'b0: 8 bits\n1'b1: 16 bits"
          - name: tout_cal
            bits: "2:0"
            access: RW
            reset: 0x0
            desc: "HS/FS Timeout Calibration.\nThe number of PHY clocks, as indicated by the application in this\nfield, is multiplied by a bit-time factor; this factor is added to the\nhigh-speed/full-speed interpacket timeout duration in the core to\naccount for additional delays introduced by the PHY. This may be\nrequired, since the delay introduced by the PHY in generating the\nlinestate condition may vary among PHYs.\nThe USB standard timeout value for high-speed operation is 736\nto 816 (inclusive) bit times. The USB standard timeout value for\nfull-speed operation is 16 to 18 (inclusive) bit times. The\napplication must program this field based on the speed of\nconnection. The number of bit times added per PHY clock are:\nHigh-speed operation:\nOne 30-MHz PHY clock = 16 bit times\nOne 60-MHz PHY clock = 8 bit times\nFull-speed operation:\nOne 30-MHz PHY clock = 0.4 bit times\nOne 60-MHz PHY clock = 0.2 bit times"

      - addr: 0xC2C0
        name: USB3OTG_GUSB3PIPECTL0
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000000
        desc: "Global PIPE PHY Configuration Register 0"
        fields:
          - name: PHYSoftRst
            bits: "31:31"
            access: RW
            reset: 0x0
            desc: "USB3 PHY Soft Reset\nAfter setting this bit to 1, the software needs to clear this bit."
          - name: HstPrtCmpl
            bits: "30:30"
            access: RW
            reset: 0x0
            desc: "This feature tests the PIPE PHY compliance patterns without\nhaving to have a test fixture on the USB 3.0 cable.\nThis bit enables placing the SS port link into a compliance\nstate. By default, this bit must be set to 1'b0.\nIn compliance lab testing, the SS port link enters compliance\nafter failing the first polling sequence after power on. Set this\nbit to 0, when you run compliance tests.\nThe sequence for using this functionality is as follows:\n1. Disconnect any plugged in devices.\n2. Perform USBCMD.HCRST or power-on-chip reset.\n3. Set PORTSC.PP=0.\n4. Set GUSB3PIPECTL. HstPrtCmpl=1. This places the link into\ncompliance state.\nTo advance the compliance pattern, follow this sequence\n(toggle\nthe set GUSB3PIPECTL. HstPrtCmpl):\n1. Set GUSB3PIPECTL.HstPrtCmpl=0.\n2. Set GUSB3PIPECTL.HstPrtCmpl=1. This advances the link to\nthe next compliance pattern.\nTo exit from the compliance state perform USBCMD.HCRST or\npower-on-chip reset."
          - name: U2SSInactP3ok
            bits: "29:29"
            access: RW
            reset: 0x0
            desc: "1'b0: During link state U2/SS.Inactive, put PHY in P2 (Default)\n1'b1: During link state U2/SS.Inactive, put PHY in P3"
          - name: DisRxDetP3
            bits: "28:28"
            access: RW
            reset: 0x0
            desc: "Disabled receiver detection in P3\n1'b0: If PHY is in P3 and Core needs to perform receiver\ndetection, The core performs receiver detection in P3. (Default)\n1'b1: If PHY is in P3 and Core needs to perform receiver\ndetection, The core changes the PHY power state to P2 and then\nperforms receiver detection. After receiver detection, the cores\nchanges PHY power state to P3."
          - name: Ux_exit_in_Px
            bits: "27:27"
            access: RW
            reset: 0x0
            desc: "1'b0: The core does U1/U2/U3 exit in PHY power state P0\n(default behavior).\n1'b1: The core does U1/U2/U3 exit in PHY power state\nP1/P2/P3\nrespectively."
          - name: ping_enhancement_en
            bits: "26:26"
            access: RW
            reset: 0x0
            desc: "Ping Enhancement Enable\nWhen set, the Downstream port U1 ping receive timeout becomes\n500 ms instead of 300 ms. Minimum Ping.LFPS receive duration is\n8 ns (one mac3_clk). This field is valid for the downstream port\nonly."
          - name: u1u2exitfail_to_recov
            bits: "25:25"
            access: RW
            reset: 0x0
            desc: "U1U2exitfail to Recovery\nWhen set, and U1/U2 LFPS handshake fails, the LTSSM transitions\nfrom U1/U2 to Recovery instead of SS Inactive. If Recovery fails,\nthen the LTSSM can enter SS.Inactive. This is an enhancement\nonly. It prevents interoperability issue if the remote link does not\ndo proper handshake."
          - name: request_p1p2p3
            bits: "24:24"
            access: RW
            reset: 0x0
            desc: "Always Request P1/P2/P3 for U1/U2/U3\nWhen set, the core always requests PHY power change from P0 to\nP1/P2/P3 during U0 to U1/U2/U3 transition.\nIf this bit is 0, and immediate Ux exit (remotely initiated, or\nlocally initiated) happens, the core does not request P1/P2/P3\npower state change."
          - name: StartRxDetU3RxDet
            bits: "23:23"
            access: RW
            reset: 0x0
            desc: "Start Receiver Detection in U3/Rx.Detect (StartRxdetU3RxDet)\nIf DWC_USB3_GUSB3PIPECTL_INIT[22] is set, and the link is\nin\neither U3 or Rx.Detect state, the core starts receiver detection\non the rising edge of this bit. This can only be used for\nDownstream ports. This bit must be set to '0' for Upstream\nports. This feature must not be enabled for normal operation."
          - name: DisRxDetU3RxDet
            bits: "22:22"
            access: RW
            reset: 0x0
            desc: "Disable Receiver Detection in U3/Rx.Det\nWhen set, the core does not handle receiver detection in either\nU3 or Rx.Detect states. DWC_USB3_GUSB3PIPECTL_INIT[23]\nmust be used to start receiver detection manually. This bit can\nonly be used for the downstream port. This bit must be set to 0\nfor Upstream ports. This feature must not be enabled for normal\noperation. If you have to use this feature, contact SNPS."
          - name: DelayP1P2P3
            bits: "21:19"
            access: RW
            reset: 0x0
            desc: "Delay P1P2P3\nDelay P0 to P1/P2/P3 request when entering U1/U2/U3 until\n(DWC_USB3_GUSB3PIPECTL_INIT[21:19]*8) 8B10B error\noccurs, or Pipe3_RxValid drops to 0.\nDWC_USB3_GUSB3PIPECTL_INIT[18] must be 1 to enable this\nfunctionality."
          - name: DELAYP1TRANS
            bits: "18:18"
            access: RW
            reset: 0x0
            desc: "DELAYP1TRANS\nDelay PHY power change from P0 to P1/P2/P3 when link state\nchanging from U0 to U1/U2/U3 respectively.\n1'b1: When entering U1/U2/U3, delay the transition to P1/P2/P3\nuntil the pipe3 signals, Pipe3_RxElecIlde is 1 and pipe3_RxValid is\n0\n1'b0: When entering U1/U2/U3, transition to P1/P2/P3 without\nchecking for Pipe3_RxElecIlde and pipe3_RxValid.\nNote: This bit must be set to '1' for SNPS PHY. It is also used by\nthird-party SS PHY."
          - name: SUSPENDENABLE
            bits: "17:17"
            access: RW
            reset: 0x0
            desc: "Suspend USB3.0 SS PHY (Suspend_en)\nWhen set, and if Suspend conditions are valid, the USB 3.0\nPHY\nenters Suspend mode.\nApplication needs to set it to '1' after the core initialization is\ncompleted."
          - name: DATWIDTH
            bits: "16:15"
            access: RW
            reset: 0x0
            desc: "2'b00: 32 bits\n2'b01: 16 bits\n2'b10: 8 bits\nOne clock after reset, these bits receive the value seen on the\npipe3_DataBusWidth."
          - name: AbortRxDetInU2
            bits: "14:14"
            access: RW
            reset: 0x0
            desc: "Abort Rx Detect in U2 (AbortRxDetInU2)\nWhen set, and the link state is U2, then the core will abort\nreceiver detection if it receives U2 exit LFPS from the remote\nlink partner.\nThis bit is for the downstream port only."
          - name: SkipRxDet
            bits: "13:13"
            access: RW
            reset: 0x0
            desc: "Skip Rx Detect:\nWhen set, the core skips Rx Detection if pipe3_RxElecIdle is\nlow.\nSkip is defined as waiting for the appropriate timeout, then\nrepeating the operation."
          - name: LFPSP0Algn
            bits: "12:12"
            access: RW
            reset: 0x0
            desc: "LFPS P0 Align\nWhen set:\n1. The core deasserts LFPS transmission on the clock edge that it\nrequests PHY power state 0 when exiting U1, U2, or U3 low\npower states. Otherwise, LFPS transmission is asserted one clock\nearlier.\n2. The core requests symbol transmission two pipe3_rx_pclks\nperiods after the PHY asserts PhyStatus as a result of the PHY\nswitching from P1 or P2 state to P0 state.\nCurrently, this bit is only used in USB 3.0 HUB with SNPS PHY. For\nother USB 3.0 Host, Device, and DRD cores, this bit is not\nrequired."
          - name: P3P2TranOK
            bits: "11:11"
            access: RW
            reset: 0x0
            desc: "P3 P2 Transitions OK (P3P2TranOK)\nWhen set, the core transitions directly from PHY power state\nP2 to P3 or from state P3 to P2. When not set, P0 is always\nentered as an intermediate state during transitions between\nP2 and P3, as defined in the PIPE3 Specification.\nAccording to the PIPE3 Specification, any direct transition\nbetween P3 and P2 is illegal."
          - name: P3ExSigP2
            bits: "10:10"
            access: RW
            reset: 0x0
            desc: "P3 Exit Signal in P2\nWhen this bit is set, the core always changes the PHY power state\nto P2, before attempting a U3 exit handshake. This bit is used\nonly for some non-SNPS PHYs that cannot do LFPS in P3."
          - name: LFPSFILTER
            bits: "9:9"
            access: RW
            reset: 0x0
            desc: "LFPS Filter\nWhen set, filter LFPS reception with pipe3_RxValid in PHY power\nstate P0, that is, ignore LFPS reception from the PHY unless both\npipe3_Rxelecidle and pipe3_RxValid are deasserted."
          - name: RX_DETECT_to_Polling_L
            bits: "8:8"
            access: RW
            reset: 0x0
            desc: "RX_DETECT to Polling.LFPS Control\n1'b0 (Default): Enables a 400us delay to start Polling LFPS after\nRX_DETECT. This allows VCM offset to settle to a proper level.\n1'b1: Disables the 400us delay to start Polling LFPS after\nRX_DETECT.\nDuring controller certification with third party PHY it is observed\nthat the PHY is not able to meet the Tx AC common mode voltage\nactive (VTX-CM-ACPP_ACTIVE <100mv) if the link starts polling\nwithin 80us from the time rx.detect is performed.\nTo meet this VTX-CM-ACPP_ACTIVE specification, the polling must\nbe delayed further. If the PHY does not have issue then they can\nset this bit to 1 which allows polling to start within 80us."
          - name: reserved_7
            bits: "7:7"
            access: RO
            reset: 0x0
            desc: "Reserved."
          - name: TX_SWING
            bits: "6:6"
            access: RW
            reset: 0x0
            desc: "Tx Swing (TxSwing)\nRefer to the PIPE3 specification."
          - name: TX_MARGIN
            bits: "5:3"
            access: RW
            reset: 0x0
            desc: "Tx Margin[2:0] (TxMargin)\nRefer to Table 5-3 of the PIPE3 Specification."
          - name: TX_DE_EPPHASIS
            bits: "2:1"
            access: RW
            reset: 0x0
            desc: "Tx Deemphasis\nThe value driven to the PHY is controlled by the LTSSM during\nUSB3 Compliance mode."
          - name: ELASTIC_BUFFER_MODE
            bits: "0:0"
            access: RW
            reset: 0x0
            desc: "Elastic Buffer Mode (ElasticBufferMode)\n(Refer to Table 5-3 of the PIPE3 specification.)"

      - addr: 0xC300
        name: USB3OTG_GTXFIFOSIZn
        access: RW
        width: 4
        bit_width: 32
        address_span: 4
        byte_order: little
        reset: 0x00000042
        desc: "Global Transmit FIFO Size Register n, offset (0xc300 + 4*n), n=0~6"
        fields:
