      - name: "PSPLIM_NS"
        access: "RW"
        width: 4
        bit_width: 32
        desc: "Get Process Stack Pointer Limit (non-secure) Devices without ARMv8-M Main Extensions (i.e. Cortex-M23) lack the non-secure Stack Pointer Limit register hence zero is returned always. Returns the current value of the non-secure Process Stack Pointer Limit (PSPLIM) when in secure state. Set Process Stack Pointer (non-secure) Devices without ARMv8-M Main Extensions (i.e. Cortex-M23) lack the non-secure Stack Pointer Limit register hence the write is silently ignored. Assigns the given value to the non-secure Process Stack Pointer Limit (PSPLIM) when in secure state."
        execution_state: "M-profile"
        encoding:
          scheme: "m_profile_special"
          selector: "PSPLIM_NS"
        accessors:
          - name: "__TZ_get_PSPLIM_NS"
            kind: "read"
