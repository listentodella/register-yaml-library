  SysTick:
    access: "Memory-mapped Core Peripheral access"
    desc: "SysTick registers from SysTick_Type"
    registers:
      - addr: 3758153744
        name: "CTRL"
        access: "RW"
        width: 4
        bit_width: 32
        desc: "SysTick Control and Status Register"
        groups:
          - "SysTick"
        source_ref: "CMSIS/Core/Include/core_cm7.h#SysTick_Type.CTRL"
        fields:
          - name: "COUNTFLAG"
            bits: "16"
            desc: "Counter-wrap status. This sticky status bit is set when the counter reaches zero and is cleared by reading the SysTick CTRL register."
            values:
              - value: 0
                desc: "The counter has not wrapped since the last CTRL read."
              - value: 1
                desc: "The counter has wrapped since the last CTRL read."
          - name: "CLKSOURCE"
            bits: "2"
            desc: "SysTick clock-source selection."
            values:
              - value: 0
                desc: "Use the external/reference clock supplied to SysTick."
              - value: 1
                desc: "Use the processor clock."
          - name: "TICKINT"
            bits: "1"
            desc: "SysTick exception request control."
            values:
              - value: 0
                desc: "Counter wrap does not request the SysTick exception."
              - value: 1
                desc: "Counter wrap requests the SysTick exception."
          - name: "ENABLE"
            bits: "0"
            desc: "SysTick counter enable control."
            values:
              - value: 0
                desc: "The SysTick counter is stopped."
              - value: 1
                desc: "The SysTick counter counts down from LOAD."
      - addr: 3758153748
        name: "LOAD"
        access: "RW"
        width: 4
        bit_width: 32
        desc: "SysTick Reload Value Register"
        groups:
          - "SysTick"
        source_ref: "CMSIS/Core/Include/core_cm7.h#SysTick_Type.LOAD"
        fields:
          - name: "RELOAD"
            bits: "23:0"
            desc: "Value loaded into the SysTick counter when it reaches zero."
      - addr: 3758153752
        name: "VAL"
        access: "RW"
        width: 4
        bit_width: 32
        desc: "SysTick Current Value Register"
        groups:
          - "SysTick"
        source_ref: "CMSIS/Core/Include/core_cm7.h#SysTick_Type.VAL"
        fields:
          - name: "CURRENT"
            bits: "23:0"
            desc: "Current SysTick counter value; writing any value clears the counter to zero."
      - addr: 3758153756
        name: "CALIB"
        access: "RO"
        width: 4
        bit_width: 32
        desc: "SysTick Calibration Register"
        groups:
          - "SysTick"
        source_ref: "CMSIS/Core/Include/core_cm7.h#SysTick_Type.CALIB"
        fields:
          - name: "NOREF"
            bits: "31"
            desc: "Calibration reference-clock indicator."
            values:
              - value: 0
                desc: "A separate reference clock is available for calibration."
              - value: 1
                desc: "No separate reference clock is available."
          - name: "SKEW"
            bits: "30"
            desc: "Calibration skew indicator."
            values:
              - value: 0
                desc: "The TENMS calibration value is accurate within the implementation's stated tolerance."
              - value: 1
                desc: "The TENMS calibration value is not guaranteed to be accurate."
          - name: "TENMS"
            bits: "23:0"
            desc: "Reload value that calibrates a ten-millisecond interval for the available SysTick reference clock."
