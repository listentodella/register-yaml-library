  Special Registers:
    access: "MRS / MSR special-register interface"
    desc: "M-profile processor status, mask, control, and stack-pointer registers exposed by CMSIS-Core intrinsics"
    registers:
      - name: "APSR"
        access: "RO"
        width: 4
        bit_width: 32
        desc: "Get APSR Register Returns the content of the APSR Register."
        execution_state: "M-profile"
        encoding:
          scheme: "m_profile_special"
          selector: "APSR"
        accessors:
          - name: "__get_APSR"
            kind: "read"
            instruction: "MRS <value>, APSR"
            encoding:
              scheme: "m_profile_special"
              selector: "APSR"
        source_ref: "CMSIS/Core/Include/core_cm1.h#APSR_Type; CMSIS/Core/Include/m-profile/cmsis_gcc_m.h"
        fields:
          - name: "N"
            bits: "31"
            desc: "Negative condition code flag. After an instruction that updates the condition flags, N indicates the sign of the result when interpreted as a two's-complement value: N=1 means negative and N=0 means non-negative. It describes the most recent flag-setting result, not the current value of an arbitrary register."
            values:
              - value: 0
                desc: "The most recent flag-setting result was non-negative."
              - value: 1
                desc: "The most recent flag-setting result was negative."
          - name: "Z"
            bits: "30"
            desc: "Zero condition code flag. Z=1 when the result of the most recent flag-setting instruction was zero; otherwise Z=0. Comparison instructions such as CMP update the flags as if they performed a subtraction without storing the result, so Z=1 usually means the compared operands were equal."
            values:
              - value: 0
                desc: "The most recent flag-setting result was not zero; a comparison was not equal."
              - value: 1
                desc: "The most recent flag-setting result was zero; a comparison was equal."
          - name: "C"
            bits: "29"
            desc: "Carry or borrow condition code flag. For addition, C=1 means an unsigned carry out. For subtraction or comparison, C=1 means no borrow and C=0 means a borrow, so C=1 commonly means the unsigned left operand was greater than or equal to the right operand. For flag-setting shifts, C records the last bit shifted out when the instruction defines it."
            values:
              - value: 0
                desc: "Depending on the instruction: no unsigned carry from addition, a borrow occurred in subtraction or comparison, or the last bit shifted out was 0."
              - value: 1
                desc: "Depending on the instruction: an unsigned carry occurred in addition, no borrow occurred in subtraction or comparison, or the last bit shifted out was 1."
          - name: "V"
            bits: "28"
            desc: "Signed overflow condition code flag. V=1 when the mathematical result cannot be represented in the signed two's-complement range of the operation, for example when adding two values with the same sign produces a result with the opposite sign. V reports signed overflow; C reports unsigned carry or borrow."
            values:
              - value: 0
                desc: "The most recent flag-setting arithmetic result did not overflow its signed range."
              - value: 1
                desc: "The most recent flag-setting arithmetic result overflowed its signed range."
      - name: "CONTROL"
        access: "RW"
        width: 4
        bit_width: 32
        desc: "Get Control Register Returns the content of the Control Register. Set Control Register Writes the given value to the Control Register."
        execution_state: "M-profile"
        encoding:
          scheme: "m_profile_special"
          selector: "CONTROL"
        accessors:
          - name: "__get_CONTROL"
            kind: "read"
            instruction: "MRS <value>, CONTROL"
            encoding:
              scheme: "m_profile_special"
              selector: "CONTROL"
          - name: "__set_CONTROL"
            kind: "write"
            instruction: "MSR CONTROL, <value>"
            encoding:
              scheme: "m_profile_special"
              selector: "CONTROL"
        source_ref: "CMSIS/Core/Include/core_cm1.h#CONTROL_Type; CMSIS/Core/Include/m-profile/cmsis_gcc_m.h"
        fields:
          - name: "SPSEL"
            bits: "1"
            desc: "Thread-mode stack-pointer selection. Handler mode always uses MSP; this bit selects the stack pointer used by Thread mode."
            values:
              - value: 0
                desc: "Thread mode uses MSP (Main Stack Pointer)."
              - value: 1
                desc: "Thread mode uses PSP (Process Stack Pointer)."
      - name: "IPSR"
        access: "RO"
        width: 4
        bit_width: 32
        desc: "Get IPSR Register Returns the content of the IPSR Register."
        execution_state: "M-profile"
        encoding:
          scheme: "m_profile_special"
          selector: "IPSR"
        accessors:
          - name: "__get_IPSR"
            kind: "read"
            instruction: "MRS <value>, IPSR"
            encoding:
              scheme: "m_profile_special"
              selector: "IPSR"
        source_ref: "CMSIS/Core/Include/core_cm1.h#IPSR_Type; CMSIS/Core/Include/m-profile/cmsis_gcc_m.h"
        fields:
          - name: "ISR"
            bits: "8:0"
            desc: "Current exception number. Zero means Thread mode; a non-zero value identifies the currently active exception according to the implemented exception-number table."
      - name: "MSP"
        access: "RW"
        width: 4
        bit_width: 32
        desc: "Get Main Stack Pointer Returns the current value of the Main Stack Pointer (MSP). Set Main Stack Pointer Assigns the given value to the Main Stack Pointer (MSP)."
        execution_state: "M-profile"
        encoding:
          scheme: "m_profile_special"
          selector: "MSP"
        accessors:
          - name: "__get_MSP"
            kind: "read"
            instruction: "MRS <value>, MSP"
            encoding:
              scheme: "m_profile_special"
              selector: "MSP"
          - name: "__set_MSP"
            kind: "write"
            instruction: "MSR MSP, <value>"
            encoding:
              scheme: "m_profile_special"
              selector: "MSP"
        source_ref: "CMSIS/Core/Include/m-profile/cmsis_gcc_m.h"
        fields:
          - name: "ADDRESS"
            bits: "31:0"
            desc: "Main Stack Pointer value used by the processor in Handler mode and, when selected, Thread mode."
      - name: "PRIMASK"
        access: "RW"
        width: 4
        bit_width: 32
        desc: "Get Priority Mask Returns the current state of the priority mask bit from the Priority Mask Register. Set Priority Mask Assigns the given value to the Priority Mask Register."
        execution_state: "M-profile"
        encoding:
